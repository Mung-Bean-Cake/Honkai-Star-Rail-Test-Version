 hsr_corp_window_desc:0 "资本、契约与星际贸易"
 hsr_corp_welcome:0 "航路将世界连接，信用使交易成为可能。从一座殖民地的生产线，到横跨星海的商业网络，每一项投资都在塑造新的秩序。\n\n通过§Y地方财政与企业管理§!决议设立企业，或在国家财政中审阅投资。每个殖民地最多容纳§Y三家企业§!。"
