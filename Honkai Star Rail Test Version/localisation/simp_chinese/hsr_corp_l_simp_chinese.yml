l_simp_chinese:
 mod_country_hsr_corp_build_time_mult:0 "企业建设耗时"
 mod_country_hsr_corp_build_time_mult_desc:0 "创建时读取本国修正；最终建设至少一天，已经排队的工程不重新计时。"
 mod_country_hsr_corp_controlled_income_mult:0 "受控公司经营收入"
 mod_country_hsr_corp_controlled_income_mult_desc:0 "作用于本国实际控制的公司，与规模和体制加成相加；最终倍率最低为零。"
 mod_country_hsr_corp_dividend_mult:0 "实际收取的企业股息"
 mod_country_hsr_corp_dividend_mult_desc:0 "按实际收款股东计算，由公司现金支付，并保留维护储备。公众池不受此修正影响。"
 mod_country_hsr_corp_tax_rate_mult:0 "总部企业税率"
 mod_country_hsr_corp_tax_rate_mult_desc:0 "相对调整总部位于本国的企业税率，基础20%；+50%对应30%，最终税率0%至100%。正利润才征税，实收不超过公司现金；中央与地方分成仍由税收政策决定。"
 mod_country_hsr_corp_reform_time_mult:0 "企业改革耗时"
 mod_country_hsr_corp_reform_time_mult_desc:0 "开始改革时读取经营控制国修正；最终至少一天，已经开始的改革不重新计时。"
 mod_country_hsr_corp_upkeep_mult:0 "受控公司维护成本"
 mod_country_hsr_corp_upkeep_mult_desc:0 "作用于本国实际控制的公司，与规模和体制加成相加；最终倍率最低为零。"
 mod_country_hsr_corp_loyalty_add:0 "受控公司每年忠诚度变化"
 mod_country_hsr_corp_loyalty_add_desc:0 "每年结算时作用于本国实际控制的公司；最终忠诚度限制在-100至100。"
 mod_country_hsr_corp_creation_cost_mult:0 "企业创建成本"
 mod_country_hsr_corp_creation_cost_mult_desc:0 "创建国的企业创办费用倍率；至少支付1。实际出资、公司初始资金、股价和取消退款均按修正后的实付款计算。"
 mod_country_hsr_corp_expansion_cost_mult:0 "企业升级与兼营成本"
 mod_country_hsr_corp_expansion_cost_mult_desc:0 "本国实际控制公司的升级和两档兼营费用倍率；至少支付1，不改变解锁等级。"
 mod_country_hsr_corp_reform_cost_mult:0 "企业改革费用"
 mod_country_hsr_corp_reform_cost_mult_desc:0 "本国实际控制公司的改革费用倍率；至少支付1。资格失效时按本次实付快照退回公司。"
 mod_country_hsr_corp_transaction_fee_mult:0 "企业股票交易手续费"
 mod_country_hsr_corp_transaction_fee_mult_desc:0 "相对调整本国股票买卖及收购要约的基础2%手续费；最终费率0%至100%。托管后的要约保持原价。"
 mod_country_hsr_corp_crisis_time_mult:0 "企业危机持续时间"
 mod_country_hsr_corp_crisis_time_mult_desc:0 "本国实际控制公司的普通危机及强制监管持续时间倍率；至少一天，已经开始的期限不重新计算。"
 mod_country_hsr_corp_crisis_loss_reduction:0 "企业危机收入损失减轻"
 mod_country_hsr_corp_crisis_loss_reduction_desc:0 "减轻本国实际控制公司在危机中的收入损失；+50%将普通危机的25%损失减为12.5%。不抵消战争或适应期损失。"
 mod_country_hsr_corp_negotiate_loyalty_mult:0 "企业协商忠诚恢复"
 mod_country_hsr_corp_negotiate_loyalty_mult_desc:0 "本国作为总部国协商时的忠诚恢复倍率，基础40；不改变协商费用，实际忠诚上限100。"
 mod_country_hsr_corp_aid_output_mult:0 "企业资源援助产出"
 mod_country_hsr_corp_aid_output_mult_desc:0 "本国收到的九种产业资源援助产出倍率；最低0。不改变公司支出、逐战限制、冷却或临时防御舰队数量与期限。"
