 hsr_corp_crisis_title:0 "契约之下的裂痕"
 hsr_corp_crisis_desc:0 "供应链仍在运转，契约却已不足以维系各方的合作。当地企业与行政机构提交的报告互相矛盾，而账面上的每一次争执，都在削弱市场对我们的信任。\n\n我们可以提供资金促成和解，也可以承担行政成本，暂时加强监管。若选择等待，经营损失将持续至危机结束；现有岗位与股权不变。"
 hsr_corp_appease:0 "促成和解：每级100国家财政"
 hsr_corp_takeover:0 "加强监管：每级25国家财政"
 hsr_corp_release:0 "交由市场消化这次风险。"
 hsr_corp_offer_title:0 "一份值得考虑的要约"
 hsr_corp_offer_desc:0 "一名战略投资者提出收购该企业的部分创始股份。对方显然看重这片市场的长远价值，并已将报价资金交付托管。\n\n接受后，将按锁定报价转让§Y20股§!创始股份。拒绝或要约到期时，托管款项将全额退还。"
 hsr_corp_offer_accept:0 "批准这笔交易。"
 hsr_corp_offer_decline:0 "这些股份暂不出售。"
 hsr_corp_support_fleet:0 "企业资产保全舰队"
 d_hsr_corp_enterprise:0 "星际产业网络"
 d_hsr_corp_enterprise_desc:0 "生产线、运输合同与本地市场在此交汇。企业可以更替，留在这些世界上的产业联系却构成了更为持久的资产。\n\n岗位、防御与产业收益随本地企业的等级、产业和体制变化。经营危机期间保留现有岗位。"
 ap_hsr_corp_currency_war:0 "货币战争"
 ap_hsr_corp_currency_war_desc:0 "舰队划定疆界，信用决定疆界内的一切。借鉴星际和平公司的经验，我们将使投资、生产与财政成为同一套秩序；每一份契约，都将为这套秩序增添新的支点。"
 ap_hsr_corp_currency_war_effect:0 "允许§Y国家与地方财政联合出资§!设立企业。股息由企业现金支付，并保留必要的维护储备。"
 cb_hsr_corp_currency_war:0 "货币战争"
 cb_hsr_corp_currency_war_desc:0 "对公司而言，边界之外并非空白，而是尚未完成评估的市场。战略投资部已获授权，为下一轮资产接管准备必要的保障。"
 cb_hsr_corp_protect_assets:0 "保护企业资产"
 cb_hsr_corp_protect_assets_desc:0 "对方的征用、没收或经营权剥夺已使本国投资者蒙受损失。当契约失去约束力，执行契约便需要另一种保障。"
 casus_belli_cb_hsr_corp_currency_war:0 "货币战争"
 casus_belli_cb_hsr_corp_protect_assets:0 "保护企业资产"
 wg_hsr_corp_currency_war:0 "货币战争"
 wg_hsr_corp_currency_war_desc:0 "信用可以跨越国界。拒绝承认信用的权力，也应接受重新估值。\n\n§Y星际和平公司起源专属。§!获胜后，接收战败国实际持有的企业股份，并使其签订§Y资产监护§!协议。第三国持股不在接管范围内。"
 wg_hsr_corp_protect_assets:0 "保护企业资产"
 wg_hsr_corp_protect_assets_desc:0 "投资可以承担风险，却不意味着我们放弃追索。\n\n获胜后，向责任国追索赔偿。赔偿不超过记录的损失、赔偿上限及败方可支付的贸易储备；不转让企业股份。"
 wg_hsr_corp_currency_war_header:0 "货币战争"
