 hsr_corp_setup_title:0 "组建公司"
 hsr_corp_action_blocked:0 "此项议案尚不具备执行条件。请确认企业仍在运营，并核对经营权限、上市状态、可用资金与协议期限。"
 hsr_corp_creation_blocked:0 "商业登记尚未获准：需要空闲企业名额、有效产业与体制，以及足额出资。财政联合出资需要§Y货币战争§!飞升；原企业的待办通知须先行处理。"
 hsr_corp_setup_blocked:0 "需要本国殖民地的空闲企业名额，且该名额没有尚待处理的企业通知。"
 hsr_corp_need_egalitarian:0 "唯有认同平等主义的社会，才会将经营权交由劳动者共同掌握。需要§Y平等主义§!或§Y极端平等主义§!思潮。"
