l_simp_chinese:
 decision_aex_dock_train:0 "列车靠站"
 decision_aex_dock_train_desc:0 "把星穹列车正式接入常规航道体系。\n\n为此，我们必须放弃§Y游牧§!身份——不再往返于无主星海，而是像所有定居文明那样，宣称星系、设立恒星基地。\n\n列车不会消失。它仍将作为我们的移动旗舰继续行驶，只是从此它也拥有了可以停靠的据点。\n\n§R此决定不可撤销。§!"
 aex_dock_train_effect_tt:0 "放弃§Y游牧§!身份：\n- 可以宣称星系、建造§H恒星基地§!\n- 补授恒星基地相关科技\n- 恢复常规经济（能量/矿物）与国界规则\n- §G星穹列车（方舟舰）保留§!"
