 trait_xz_flame_tea: "烈焰浓茶"
 trait_xz_flame_tea_desc: "一种烈性的茶饮，可以在金人巷的杜老板那里品尝到的神秘“茶”。"
 trait_xz_dragon_well_wine: "龙泉老窖"
 trait_xz_dragon_well_wine_desc: "在浥尘客栈等地方可以品尝到的仙舟特色酒饮，醇厚绵长。"
 trait_xz_willow_nectar: "柳林琼浆"
 trait_xz_willow_nectar_desc: "仙舟特色酒饮，香气清雅，回味悠长。"
 trait_xz_energy_drink: "西鹏特饮"
