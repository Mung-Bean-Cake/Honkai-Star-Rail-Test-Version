 fengraomin.death: "丰饶民战团已被连根拔起"
 fengraomin.death_desc: "丰饶民战团随着他们的长生梦一同在战火中灰飞烟灭，后续会发生什么，谁也不知道。也许会有一位丰饶令使带领大量强大的丰饶民战士前来复仇，也许什么都不会发生......"
 fengraomin.death_option: "真是大快人心！"
 masked_fool.death: "假面愚者商队在制造乐趣途中坠毁"
 masked_fool.death_desc: "假面愚者商队坠毁了，人们无比怀念他们给宇宙带来的不一样的乐趣，但他们再也回不来了......"
 masked_fool.death_option: "我缺的乐子谁给我补啊！！！"
 mourning_actors.death: "悲悼怜人商队的毁灭"
 mourning_actors.death_desc: "悲悼怜人相信，宇宙是一出早已写好结局的悲剧。欢愉只是幕间休息，痛苦才是永恒终幕。他们组成商队，穿行于星海，用悲剧表演收集观众的泪水，认为泪水是唯一真实的祭品。悲悼怜人商队的毁灭，同样是他们献给阿哈的最后一个笑话。"
 mourning_actors.death_option: "他们终究是以悲剧收尾......"



