 jiedu_wangguiren: "§R接渡使·忘归人§!"
 jiedu_wangguiren_desc: "她曾是罗浮天舶司“鸣火”商团的首席接渡使，掌管富甲一方的商会，以善辩与精明在银河各处为仙舟维系贸易网络。然而一场离奇的灾难降临——绝灭大君幻胧袭击了返航的商队，夺走了她的样貌、名字与身份，让她几乎殒命星海。命运的骰子并未就此停止转动。天才科学家阮·梅在关键时刻救下了濒死的停云，以火莲重塑其肉身，平衡了她身上“毁灭”的烙印。苏醒后的她以“忘归人”自称，八面玲珑的狐人少女就此从毁灭的余波中重获新生。如今她已拾起自我，再次启程。无人知晓“忘归人”之名是未能返乡的怅然，抑或流连星海的期许。她以接渡使的身份继续游走于星际之间，用商人的智慧与外交手腕为帝国开拓贸易与盟约——正如她所说，生意讲求你來我往，而她，从来都是这盘棋局中最不可预测的那枚棋子。"
 dark_moze: "§R影卫·貊泽§!"
 dark_moze_desc: "貊泽曾是曜青仙舟阴影中濒死的孤儿，被将军飞霄捡回后，培养成最锋利的暗刃。他常年隐匿于暗处，替将军处理那些不见光的事务——情报刺探、暗杀、清除丰饶孽物的暗桩。市井中流传着“鸦羽怪人”的传说：一袭乌衣，来去无踪，专门惩治逍遥法外的恶徒。却无人知晓，这怪人正是沉默寡言的影卫。貊泽从不承认这个名号，但他的刀刃早已替他说出了一切。对他而言，与飞霄的契约始于救命之恩，终于绝对忠诚。他像耐心的猎手，在暗处静静锁定猎物，直到破绽显现的瞬间——鸦羽降临，一击毙命。“专司不见光的事务，鲜少在人前露面。貊泽显露锋芒时，便是敌人的死期。”"
 player_guinaifen: "§R杂耍·桂乃芬§!"
 player_guinaifen_desc: "桂乃芬本名格妮薇儿，来自已毁灭的卡梅洛。作为化外之民流落至仙舟罗浮，她凭借一腔热血与惊人的杂耍绝活——胸口碎大石、徒手接子弹、炎轮滚滚，迅速在这片土地扎下了根。她给自己取名“桂乃芬”：桂为佳木，乃者是也，芬即芳香，寓意着新生。她不仅是罗浮街头最耀眼的艺人，更是将欢笑融入星际治理的奇才。无论是化解种族隔阂，还是推动星际贸易谈判，她总能以极佳的亲和力与感染力赢得满堂彩。“我叫桂乃芬！从今天起，仙舟就是我的家。”这位热情似火的街头艺人，正用杂耍把式的巧劲与烟花盛放的绚烂，在群星间上演一场名为“外交”的精彩表演。"
