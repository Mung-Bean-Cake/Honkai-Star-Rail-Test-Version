 trait_xz_mingou_cake: "鸣藕糕"
 trait_xz_mingou_cake_desc: "罗浮的传统小吃，用“鸣藕”制作。咬一口会发出清脆的声响，口感独特。"
 trait_xz_momo_roll: "貘貘卷"
 trait_xz_momo_roll_desc: "外形可爱的甜点卷，因造型像貘而得名，让人“不忍心吃掉”。"
 trait_xz_qiongshi_skewer: "琼实鸟串"
 trait_xz_qiongshi_skewer_desc: "类似冰糖葫芦的串烧小吃，制作过程不会伤害到“琼实鸟”，酸甜可口。"
 trait_xz_hot_sheep_milk: "热浮羊奶"
 trait_xz_hot_sheep_milk_desc: "仙舟联盟的特产，也叫“晴柔奶”。难以保存，加热后不加糖也很甜，但放凉后会发苦，必须趁热喝。"
 trait_xz_soda_douzhir: "苏打豆汁儿"
 trait_xz_soda_douzhir_desc: "一种味道非常奇特的饮料，在自动售货机有售，被形容为“味道很怪”。"
 trait_xz_abyss_ice_spring: "鳞渊冰泉"
 trait_xz_abyss_ice_spring_desc: "来自鳞渊境的天然饮用水，在售货机有售。虽然看起来无热量，但实际卡路里含量极高。"
 trait_xz_garlic_pork: "蒜苗五花肉"
 trait_xz_garlic_pork_desc: "用蒜苗炒的五花肉，口感独特，非常美味，是尚滋味的招牌菜之一，广受好评。"
 trait_xz_cucumber_chicken: "脆瓜胡辣鸡丁"
 trait_xz_cucumber_chicken_desc: "用脆瓜炒的胡辣鸡丁，醒园菜的代表作，口味酸辣。"
 trait_xz_jiyu_pork: "鲫香肉丝"
 trait_xz_jiyu_pork_desc: "用鲫鱼炒的肉丝，味道鲜美，醒园菜系中的经典菜肴。"
 trait_xz_spicy_beef_offal: "红油乱斩牛杂"
 trait_xz_spicy_beef_offal_desc: "尚滋味的招牌，由主厨现场表演刀工切制牛杂，再浸入红油，令人难忘。"
 trait_xz_grandma_tofu: "陈婆豆腐"
 trait_xz_grandma_tofu_desc: "尚滋味的招牌菜之一，广受食客好评。"
 trait_xz_999_meatball: "九九九手打肉丸"
 trait_xz_999_meatball_desc: "尚滋味的特色菜，由老板娘现场捶打九百多次肉泥制成，口感扎实。"
 trait_xz_moon_rice: "月华饭"
 trait_xz_moon_rice_desc: "美馔阁提供的主食，有中碗和大碗可选。"
 trait_xz_soy_chicken: "豉油蒸鸡"
 trait_xz_soy_chicken_desc: "美馔阁的菜品，食客可以选择“不要香菜”。"
 trait_xz_cinnamon_rib_rice: "肉桂香排盖饭"
 trait_xz_cinnamon_rib_rice_desc: "美馔阁的招牌，肉香浓郁，口感扎实。"
 trait_xz_jiuhe_banquet: "至味盛苑「九和宴」"
 trait_xz_jiuhe_banquet_desc: "美馔阁的招牌，由九道佳肴组成，菜品极具艺术感,是食客们必尝的美食。"
 trait_xz_stone_soup: "巧石三味"
 trait_xz_stone_soup_desc: "取黄石颈肉与肋条，用鳞渊朝露浸没烹煮的仙舟家常菜。"
 trait_xz_glass_boat: "琉璃舟"
 trait_xz_glass_boat_desc: "前菜，用蟹壳雕成小舟，内酿蟹黄肉丸，造型精美。"
 trait_xz_drunk_red_stream: "醉红溪"
 trait_xz_drunk_red_stream_desc: "头碟，将鲜活缘虾用杏花佳酿醉倒后轻煨慢煮。"
 trait_xz_immortal_happy_tea: "仙人快乐茶"
 trait_xz_immortal_happy_tea_desc: "罗浮极受欢迎的奶茶饮品，适合拍照打卡。"
 trait_xz_stomach_soup: "浮羊和胃汤"
 trait_xz_stomach_soup_desc: "在长乐天「寿考堂」有售，是一种药膳汤品，汤底选用鲜羊骨熬制，搭配各种蔬菜，口感鲜美。"
 trait_xz_soul_pill: "养心返魂丹"
