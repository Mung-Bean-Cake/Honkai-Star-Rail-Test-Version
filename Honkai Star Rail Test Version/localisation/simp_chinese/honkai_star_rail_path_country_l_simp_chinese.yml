 trait_xz_buliren_skewer: "步离人烤串"
 trait_xz_buliren_skewer_desc: "来自步离人的豪放烤肉，粗犷的调味中带着异域风情。"
 trait_xz_vidya_dragon_tea: "持明龙髓茶"
 trait_xz_vidya_dragon_tea_desc: "以持明族秘法调制的药茶，据说能延年益寿、通晓古今。"
 trait_jiedu_wangguiren_1:0 "八方玲珑"
 trait_jiedu_wangguiren_1_desc:0 "忘归人的言辞如春风拂面，又暗藏机锋。她能在谈笑间瓦解敌意、促成盟约，仿佛天生便懂得如何让所有人都觉得“再多听她说几句也无妨”。"
 trait_jiedu_wangguiren_2:0 "幻胧之痕"
 trait_jiedu_wangguiren_2_desc:0 "“毁灭”的烙印从肩头蔓延至颈侧，金色花叶下暗藏着绝灭大君留下的毁灭余波。这力量既是诅咒，也是忘归人最锋利的暗刃。"
 trait_jiedu_wangguiren_3:0 "忘归之志"
 trait_jiedu_wangguiren_3_desc:0 "无人知晓“忘归人”之名意味着未能返乡的怅然，还是流连星海的期许。正是这份没有归途的决绝，让她在深空探索中展现出惊人的意志力。"
 trait_jiedu_wangguiren_4:0 "商团遗脉"
 trait_jiedu_wangguiren_4_desc:0 "忘归人曾掌管富甲一方的“鸣火”商会，为仙舟在银河各处维系贸易网络。即便身份被夺，她辨认商机与谈判议价的本能从未磨灭。"
 trait_jiedu_wangguiren_5:0 "火莲重生"
 trait_jiedu_wangguiren_5_desc:0 "借阮·梅之手托体莲花重塑肉身，忘归人从“毁灭”的余波中破茧而出。她已经历过一次死亡，对生命的理解远超常人。"
 trait_dark_moze_1:0 "曜青影卫"
 trait_dark_moze_1_desc:0 "貊泽曾常年隐匿于曜青的暗影之中，为将军飞霄处理那些不见光的事务。他从不以真面目示人，也从不留下任何痕迹。对他而言，情报的获取与传递，本身就是一场无声的暗杀。"
 trait_dark_moze_2:0 "鸦羽怪人"
 trait_dark_moze_2_desc:0 "在曜青的街头巷尾，流传着一个关于“鸦羽怪人”的传说——一袭乌衣，来去无踪，专门惩治那些逍遥法外的恶徒。貊泽从不承认这个名号，但他的刀刃早已替他说出了一切。那些被他盯上的人，没有一个能逃过鸦羽的裁决。"
 trait_dark_moze_3:0 "猎手标记"
 trait_dark_moze_3_desc:0 "貊泽在战斗开始前便已完成对敌方核心目标的锁定。他像一位耐心的猎手，在暗处静静观察猎物的每一个动作，直到对方露出破绽的瞬间——然后，一击毙命。被他标记为“猎物”的目标，将在整个舰队面前暴露无遗。"
 trait_dark_moze_4:0 "鸦羽裁决"
 trait_dark_moze_4_desc:0 "当貊泽决定出手，便再无回旋余地。鸦羽之刃划破暗夜的瞬间，便是裁决降临的时刻。他的舰队如同他本人一般——沉默，精准，不留活口。被鸦羽锁定的猎物，从来只有一种结局。"
 trait_dark_moze_5:0 "无声潜行"
 trait_dark_moze_5_desc:0 "没有人能听见貊泽的脚步，就像没有人能看见乌鸦羽翼下的阴影。他的舰队如同他本人一般——在敌人毫无察觉的情况下进入战场，在敌人意识到发生了什么之前完成突袭。当警报响起时，鸦羽已经远去。"
 trait_player_guinaifen_1:0 "烟花盛放"
 trait_player_guinaifen_1_desc:0 "桂乃芬最爱的表演是烟花秀——在夜空中绽放万千色彩，让所有人抬头仰望，忘记烦恼。她将这份烟花般的魅力融入到星际治理中：她治理的星系如同烟花般璀璨繁荣，吸引着四面八方的移民和商人。在她的领地上，每一颗行星都是一朵盛放的烟花，照亮整片星域。"
 trait_player_guinaifen_2:0 "古来君子养艺人"
 trait_player_guinaifen_2_desc:0 "“古来君子养艺人”——这是桂乃芬的天赋之名，也是她始终坚信的道理。她深知文艺表演不仅是娱乐，更是凝聚人心、传播文化、稳定社会的基石。在她的治理下，帝国的文化艺术事业蓬勃发展，人口安居乐业。"
 trait_player_guinaifen_3:0 "炎轮滚滚"
 trait_player_guinaifen_3_desc:0 "桂乃芬的招牌绝技“炎轮”以灼热之势席卷全场，正如她在治理中所展现的执行力——势不可挡，一往无前。她推动的政策如同炎轮碾过，所到之处障碍尽消。无论是加速行星建设还是推进工业化进程，她的效率都令人叹为观止。"
 trait_player_guinaifen_4:0 "街头献艺·满堂彩"
 trait_player_guinaifen_4_desc:0 "桂乃芬的表演从不拘泥于剧场，街头巷尾、广场集市都是她的舞台。当她的巡演队伍来到一颗星球，整个星系的居民都会为她的“胸口碎大石”和“徒手接子弹”而沸腾。"
 trait_player_guinaifen_5:0 "仙舟新韵"
 trait_player_guinaifen_5_desc:0 "桂乃芬本名格妮薇儿，来自已被毁灭的卡梅洛。她以化外之民的身份在仙舟罗浮扎根，凭借对仙舟文化的热爱，迅速融入了这片陌生的土地。她深知不同文明之间沟通的艰难，也正因如此，她成为帝国中最擅长化解文化隔阂、促进民族融合的外交官。在她的斡旋下，来自不同星系的种族能够在同一面旗帜下和睦共处。"
