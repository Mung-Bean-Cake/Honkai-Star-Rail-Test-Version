 script_crisis.3.name: "§R中期天灾：「丰饶」之乱提前到来§！"
 script_crisis.3.desc: "§R你提前击溃了丰饶民战团的舰队群，使有药师授意的丰饶令使「羽皇」无法收编丰饶民战团的舰队，使其威胁大降§！§g「羽皇」建立了丰饶国度「羽皇」，一路扩张，并试图将沿途所有星球上的人口同化为不死不灭的丰饶孽物。只有击溃羽皇中枢并将其彻底抹除，才能结束这场天灾！§！"
 script_crisis.3.a: "§R只有我们能结束这场浩劫！§！"
 script_crisis.5.name: "§R中期天灾：「丰饶」之乱降临§！"
 script_crisis.5.desc: "§R你没有及时击毁丰饶民战团的舰队群，使有药师授意的丰饶令使「羽皇」收编了所有丰饶民战团的舰队，使其威胁大增，已成为宇宙中不可忽视的一大威胁§！§g「羽皇」建立了丰饶国度「羽皇」，一路扩张，并试图将沿途所有星球上的人口同化为不死不灭的丰饶孽物。只有击溃羽皇中枢并将其彻底抹除，才能结束这场天灾！§！"
 script_crisis.5.a: "我们必须阻止他们！"
 script_crisis.9.name: "§G「羽皇」核心舰队被击溃§!"
 script_crisis.9.desc: "§G「羽皇」核心舰队被击溃了，我们应该乘胜追击，趁他们还没有布防完全，将其一举歼灭，消灭这一宇宙大敌！若是等「羽皇」回归集结兵力，那对我们绝对是一大挑战......§!"
 script_crisis.9.a: "趁他病要他命！"
 script_crisis.12.title: "§Y丰饶国度「羽皇」的落幕§！"
 script_crisis.12.desc: "§G经过了漫长的斗争与全宇宙各势力的支援，丰饶国度「羽皇」最终被摧毁了。§!§B经过与羽皇的战斗，我们从战场的残垣里提取了部分丰饶命途力量载体，我们如今可以解析并研究丰饶力量，从而利用丰饶力量！§!"
 script_crisis.12.a: "§Y胜利终究属于我们！§!"
 script_crisis.12.b: "§Y我们应当收获丰厚的战利品！§!"
 script_crisis.13.title: "§R「羽皇」的回归§!"
 script_crisis.13.desc: "§R「羽皇」被击溃后重整舰队，挑选了大批造翼者青年加入了舰队制造和训练中，赶制出大量丰饶战舰。如今，「羽皇」的舰队群已整装待发，想要向宇宙各方发泄他的怒火！§!"
 script_crisis.13.a: "§B真是糟糕！我们必须阻止「羽皇」的舰队海！§!"
 yuhuang_introduction: "§R这里是羽皇宣传部§!"
 script_crisis.15.desc: "§R「羽皇」治下疆域即日起正式开启全面扩张，任何不接纳丰饶药师赐福的世界，都将被我们抹除。丰饶绝非仙舟口中的“寿瘟祸祖”，而是慈怀药王播撒的生命恩典。我们将以丰饶的力量消解死亡边界，让所有信众挣脱生老病死的桎梏，获得永恒的生机。所有秉持丰饶信念的族群，都将在羽皇的秩序下获得平等的生存权与进化权，无需再受巡猎的追剿、其他命途的排挤。任何试图阻碍丰饶传播的势力，都将面对羽皇麾下力量的坚决回击。§!"
 end_message: "§B结束通讯§!"
