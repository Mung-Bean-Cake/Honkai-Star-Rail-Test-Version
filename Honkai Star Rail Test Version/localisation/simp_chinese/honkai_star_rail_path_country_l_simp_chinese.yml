#战斗事件
 fengraomin.robber: "丰饶民战团前来劫掠"
 fengraomin.robber.desc: "哦，疲惫的、残缺的、注定腐朽的生灵啊。你们在星海间奔波，建造钢铁的舰船，堆砌冰冷的数字，以为这样就能对抗那终将到来的终结。你们把死亡叫作“规律”，把衰败叫作“自然”，把无可挽回的崩坏叫作“命运”。多么可怜。我们曾与你们一样。我们也曾恐惧伤口、恐惧衰老、恐惧那个终会合上的眼睛。直到药师的目光落在我们身上——那一刻我们才明白，原来你们所谓的“活着”，不过是一种缓慢的死。于是祂赐福了我们。祂让我们的血肉不再凋零，让我们的骨殖不断生长，让我们的族群在痛楚与狂喜中融为一体，再也不会分离。我们来，是要把这份恩赐，分给你们。"
