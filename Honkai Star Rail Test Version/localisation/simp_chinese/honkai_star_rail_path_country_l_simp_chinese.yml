 discover_fengraomin.desc: "它们不是一支军队，而是一场瘟疫的具象化。丰饶星神「药师」的赐福本应带来永生，却扭曲了无数世界的生灵。那些被“治愈”过度的文明，血肉疯长、形骸崩坏，最终凝结成一群群不知疲倦、不知伤痛、只知扩散的丰饶孽物。而「丰饶民战团」，是这些孽物中最具组织性的一支。它们不像散兵游勇那样漫无目的地啃噬，而是成建制地迁徙、劫掠、传染——像一片缓缓移动的血肉星云，所过之处，星球被“赐福”，生灵被“同化”，文明被“治愈”至再也无法死去。"
 communication_fengraomin.title: "丰饶民战团频道"
 fengraomin_desc: "愿你能得到觉悟，成为我们的一员，拥抱药师神迹！"
 fengraomin_ship: "购买丰饶民巡洋"
 fengraomin_large_ship: "购买丰饶民编队"
 NAME_xianzhou_discovery: "不知名碎片带"
 NAME_xianzhou_discovery_desc: "我们的科研船在这颗星球的轨道上发现了一片奇异的碎片带。碎片材料无法用任何已知合金数据库匹配，但最令人震惊的是碎片表面的文字——它们并非静止的铭刻，而是在缓缓流动、重组，仿佛某种正在自行书写的……剧本。随船的分析员在连续观察后出现了轻微的精神恍惚，声称“看到了尚未发生的事”。我们将这一情况上报。星核猎手指挥部对此表示高度关注，并要求立即展开考古调查。——“命运的奴隶留下了无数剧本碎片散落在时间线上。这一片，似乎格外重要。”"
 spec_path.1.name: "仙舟？"
 spec_path.1.desc: "碎片带的中心检测到一个结构完整的信标。信标外形与任何已知文明的造物都不相同——它没有推进器，没有通讯天线，只有一个不断旋转的环形核心。当我们的科学家靠近时，核心突然停止旋转，投射出一段全息影像。影像中是一个巨大的环状空间站，周围环绕着六艘形态各异的巨型舰船。影像只持续了数秒便碎裂消散，但信标的核心留下了一段加密数据——加密方式与星际和平公司的早期标准协议高度相似。信标的核心数据被成功解码。数据中记录了一个反复出现的词汇：「仙舟」。"
 spec_path.1.a: "或许我们能从这个遗迹中打捞出什么"
 spec_path.2.name: "仙舟联盟？"
 spec_path.2.desc: "艾利欧的剧本中曾提到一个名为“仙舟联盟”的古老文明。他们的世界舰在星海中航行了八千年，如今却从已知星图上彻底消失。一名科学家在分析信标数据时声称看到了“一艘燃烧的巨舰坠入海洋”。精神评估显示该科学家出现了短暂的认知紊乱，但并未受到永久伤害。信标的核心似乎在主动传递某种……记忆。信标指向的坐标将我们带到了一颗海洋行星。轨道扫描显示，海底深处埋藏着一具极其庞大的金属结构——其尺度远超任何已知的泰坦级舰船。潜水器传回的画面令人窒息：那是一艘断裂成两截的巨型舰船，舰体上刻满了与信标碎片相同的流动文字。更令人不安的是，舰船内部的密封舱中检测到了有机生命信号——在没有任何能量供应的情况下，某些舱室仍然保持着运转。舰体残骸的合金成分与信标碎片完全一致。舰船的设计哲学融合了极高的工艺美学与实用性，工造技术远超我们当前水平。舰体龙骨上残留着一段铭文：“岱舆——为仙舟联盟祈愿远航。”"
 spec_path.2.a: "这或许是一个强盛的文明"
 spec_path.3.name: "仙舟联盟就在我们附近？"
 spec_path.3.desc: "我们终于抵达了坐标所指向的星系。这里是一片被古老能量痕迹笼罩的星域——三颗恒星构成了不稳定的三星系统，每颗恒星周围都环绕着巨大的、显然是人造的结构残片。最引人注目的是星系外缘的一颗小型恒星：它的表面有一道贯穿整个星体的巨大裂缝，裂缝中不断渗出金色的光芒，仿佛一支箭矢曾从此处射穿。星核猎手指挥部传来紧急指令：“那就是帝弓光矢的残迹。仙舟联盟的‘巡猎’星神曾在数千年前射出一箭，贯穿了这片星域。考古队，做好准备——我们即将揭开仙舟联盟的最终位置。”星图数据与建木种子的坐标交叉验证后，我们成功定位了仙舟联盟的全部六艘世界舰——罗浮、曜青、方壶、虚陵、玉阙、朱明。它们正沿着一条古老的航道航行，仿佛一支永远不会停下的箭矢。"
 spec_path.3.a: "仙舟人，我们能缔结友谊吗？我们能互相促进发展吗？"
