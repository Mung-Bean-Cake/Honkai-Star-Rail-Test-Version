#起源
 NAME_erxiangleyuan:"二相乐园"
 origin_erxiangleyuan:"二相乐园"
 origin_erxiangleyuan_desc:"哈托彼亚，一颗位于失魂星域的天体。传闻久远的过去，「欢愉」星神阿哈曾创造一轮有生命的幻月，令其成为愚者与伶人演出的舞台，建立起包括古弁才天国在内的众多文明。每当幻月满盈时，一场以谒神为名的「幻月游戏」也将如期开始。胜者将承蒙星神垂迹，领受那星神垂赐的「欢愉」权能。尔后，「毁灭」的军锋席卷失魂星域，将众多世界化为白地——此处也不能幸免。所幸一位绘师施展神迹，将整个世界收入「画卷」，最终拯救众生免受涂炭。久远岁月后，归来的幸存者们试图重建故土。在「诸世界重建计划」的运作下，星际和平公司利用朋克洛德的以太编辑技术，将藏入画中平面的世界打捞回现实，又派遣高管担任「二相乐园」的首席执行官，令其成为公司重要的资产星球。"
 NAME_sol_erxiangleyuan_sysytem:"失魂星域"
 NAME_sol_erxiangleyuan:"哈托彼亚"
 NAME_sol_erxiangleyuan_moon:"幻月"
 civic_erxiangleyuan_1:"幻月游戏"
 civic_erxiangleyuan_1_desc:":"每当幻月满盈时，一场以谒神为名的「幻月游戏」也将如期开始。胜者将承蒙星神垂迹，领受那星神垂赐的「欢愉」权能。"
 councilor_civic_erxiangleyuan_1:"谒者"
 councilor_civic_erxiangleyuan_1_desc:"谒者"
 civic_erxiangleyuan_2:"幻造种"
 civic_erxiangleyuan_2_desc:"在二相乐园，自人类的虚构行为中诞生的智慧生灵，名为「幻造种」，其依靠人们的想象力与关注力――「愿力」而存在。"
 councilor_civic_erxiangleyuan_2:"绘师"
 councilor_civic_erxiangleyuan_2_desc:"绘师"
 Name_zhenzhu:"真珠"
 Name_ipc_first_give_leader:"麦斯威尔·格兰特"
 NAME_erxiangleyuan_home_star:"中奖升起的烈阳"
 #地块,修正
 d_two_dimensional_collapse:"二维坍缩区"
 d_two_dimensional_collapse_desc:"从画中‘打捞‘出来不稳定的坍缩区域"
 erxiangleyuan_debuff:"混乱的治安"
 erxiangleyuan_debuff_desc:"由于刚恢复到现实世界，现在政府的治安能力令人堪忧"
 erxiangleyuan_buff:"冉冉升起的新星"
 erxiangleyuan_buff_desc:"让我们创造的娱乐产品也在银河间广为流传吧"
 erxiangleyuan_buff_1:"名声鹊起"
 erxiangleyuan_buff_1_desc:"我们的文娱产业正欣欣向荣！"
 erxiangleyuan_debuff_1:"§R恐慌§!"
 erxiangleyuan_debuff_1_desc:"告死魔事件造成了极其恶劣的影响，民众陷入了无尽的恐慌之中"
 #局势
 situation_various_world_reconstruction_plans_erxiangleyuan:"「诸世界重建计划·哈托彼亚」"
 situation_various_world_reconstruction_plans_erxiangleyuan_type:"「诸世界重建计划·哈托彼亚」"
 situation_various_world_reconstruction_plans_erxiangleyuan_desc:"公司利用来自朋克洛德的以太编辑技术，将我们的画中世界重新打捞出来，长期的困守画中世界使得我们与宇宙文明脱节，实力差距的悬殊，对于我们来说通过依附公司是现在最现实的一条道路。"
 situation_erxiangleyuan_help_regular:"正常投资"
 approach_erxiangleyuan_help_regular_tt:"按照计划给予他们资源"
 situation_erxiangleyuan_help_generous:"加大投资"
 approach_erxiangleyuan_help_generous_tt:"超额给予投资"
 situation_erxiangleyuan_help_frugal:"削减投资"
 approach_erxiangleyuan_help_frugal_tt:"能省则省..."
 situation_erxiangleyuan_research:"研究型投资"
 approach_erxiangleyuan_research:"幻造种生物及其背后技术具有重大的研究意义"
 #事件
 hsr_planarcadia.1000.title:"市场开拓部员工入驻哈托彼亚"
 hsr_planarcadia.1000.desc:"在市场开拓部主管奥斯瓦尔多·施耐德的授意下，其部门的部分人员开始携带器件物资大规模入驻哈托彼亚。按照计划，这些专业人员将帮助恢复哈托彼亚的生产，治安，消除残余的入画影响，随行的技术研发部分人员将提供技术支持，监视哈托彼亚的稳定情况。首席执行官麦斯威尔·格兰特亲自迎接慰问他们，其他政府要员也参与了迎接活动，对于大部分居民来说，已经很久没有这么大量的与现实的物种接触，他们用新奇的目光观察这一切。"
 hsr_planarcadia.1000.a:"「谨代表哈托彼亚的人民向你们问好」"
 hsr_planarcadia.1001.a:"好极了"
 hsr_planarcadia.1002.title:"银河贸易效益大幅增长"
 hsr_planarcadia.1002.desc:"自从哈托彼亚逐渐稳定以来，越来越多的异星游客来到这里，久负盛名的欢愉之地再次热闹起来。有不少异星友人希望与我们达成协议进行贸易往来，我们也可以借此机会创造的独属于我们的娱乐产品影响全宇宙。"
 hsr_planarcadia.1002.a:"让他们见识见识欢愉的力量"
 hsr_planarcadia.1003.desc:"为了维护治安，应对异常情况，由公司牵头，抽调人力，并招募本地人民组建异常防御部队。这只部队的建立以后哈托彼亚的治安飞速好转，虽然如此，因为种种原因，鸽川区衰败成了整个二相乐园治安倒数的城区，「共愿帮」在这里活动频繁，这是二相乐园唯一一个「极高风险，切勿前往」的旅行目的地。"
 hsr_planarcadia.1003.a:"还是尽量控制这些家伙别捣乱"
 erxiangleyuan_buff_2:"异常防御部队"
 erxiangleyuan_buff_2_desc:"维护治安，应对异常情况"
 hsr_planarcadia.1004.title:"新任首席执行官"
 hsr_planarcadia.1004.desc:"首席执行官麦斯威尔·格兰特现在更换为真珠，作为一个智械却追寻美的极境。作为新任执行官，真珠推动建立珠星财团重建绘世学院，大力发展本地的特色文化。"
 hsr_planarcadia.1004.a:"一个追求艺术的智械吗，有意思。"
 hsr_planarcadia.1005.title:"进一步合作"
 hsr_planarcadia.1005.desc:"新任首席执行官对古画极其感兴趣，不仅推动绘世学院的再次建设还，还参与帮助对古画的解读复原，现在我们可以轻松自如的在现实世界和二维画中世界往返，不必担心跌落对我们的影响。根据画中世界游玩建立的新的文娱项目也让更多的异星游客来往哈托彼亚游玩。"
 hsr_planarcadia.1005.a:"振奋人心的消息！"
 hsr_planarcadia.1006.a:"一定要严惩凶手！"
 hsr_planarcadia.1007.a:"终于清净了"
 hsr_planarcadia.1008.desc:"随着公司的资助和指导，以及我们努力的付出，现在二相乐园已经走出入画年代的阴影。随着我们文娱产品在宇宙市场热卖，我们也在银河中发展出属于自己的影响力"
 hsr_planarcadia.1008.a:"谁会不喜欢一个梦幻的世界呢"
