mod_planet_district_erxiangleyuan_energy_build_speed_mult:"§G城市——天际线§!建造速度"
zone_night_city:"夜之城"
zone_night_city_plural:"夜之城"
zone_night_city_desc:"晚上好，夜之城！！！这里充斥着霓虹，公司，义体和帮派战争\n——\n【“您就是大名鼎鼎的开拓者吧”】\n【“唉——什么脏活累活我都要做是吧”】"
zone_Camelot_city:"卡美洛"
zone_Camelot_city_plural:"卡美洛"
zone_Camelot_city_desc:"据说是1比1复刻了某位伟大国王的主城，如今已经成为著名的打卡经典\n——\n【“这个国王怎么有那么多形态啊”】\n【“那要是某一次XX战争自己和自己打起来了怎么办啊”】"
#建筑
building_phantasmoon_court:"幻月秘庭"
building_phantasmoon_court_desc:"幻月游戏的曼荼罗阵法中枢，是收集、计量、汇聚愿力最重要的建筑。谒者在此积攒愿力"
building_phantasmoon_court_1:"幻月秘庭·伪"
building_phantasmoon_court_1_desc:"仿制幻月秘庭而建造的建筑，旨在让更多世界享受欢愉\n虽然其愿力不及原本，但依然可以笼罩整个星球"
decision_custom_design:"汇聚愿力"
decision_custom_design_desc:"你可以通过消耗愿力自定义建筑§R幻月秘庭§!的§G修正!以及§G生产的资源§!"
building_white_mountain:"不黑山基地"
building_white_mountain_desc:"一座依靠山体，深埋于地下的科研设施，专门研究异常物质\n——\n【“为什么除了要穿工服，还要带根撬棍啊”】"
mod_planet_jobs_specialist_physics_research_produces_mult:"专家岗位生产的物理学"
building_Apertural_science:"光方科技"
building_Apertural_science_desc:"一家生产浴帘的科技研究公司，似乎正在研究什么不靠谱的项目\n——\n【“这家公司的产品看起来都不靠谱啊，这真的是能在市场上销售的东西么”】"
mod_planet_jobs_specialist_engineering_research_produces_mult:"专家岗位生产的工程学"
building_Rhizotomy_corporation:"神经公司"
building_Rhizotomy_corporation_desc:"据说这家公司正在研究一些奇怪的幻造种，他们的员工们也都很奇怪\n——\n【“我没招了，重新开始这一天”】\n"
mod_planet_jobs_specialist_society_research_produces_mult:"专家岗位生产的社会学"

