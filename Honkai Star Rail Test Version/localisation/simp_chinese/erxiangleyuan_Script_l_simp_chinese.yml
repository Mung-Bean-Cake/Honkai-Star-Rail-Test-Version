origin_erxiangleyuan:"二相乐园"
erxiangleyuan_sysytem_NAME:"二相乐园"
erxiangleyuan_sysytem_DESC:"哈托彼亚，一颗位于失魂星域的天体。传闻久远的过去，「欢愉」星神阿哈曾创造一轮有生命的幻月，令其成为愚者与伶人演出的舞台，建立起包括古弁才天国在内的众多文明。每当幻月满盈时，一场以谒神为名的「幻月游戏」也将如期开始。胜者将承蒙星神垂迹，领受那星神垂赐的「欢愉」权能。尔后，「毁灭」的军锋席卷失魂星域，将众多世界化为白地——此处也不能幸免。所幸一位绘师施展神迹，将整个世界收入「画卷」，最终拯救众生免受涂炭。久远岁月后，归来的幸存者们试图重建故土。在「诸世界重建计划」的运作下，星际和平公司利用朋克洛德的以太编辑技术，将藏入画中平面的世界打捞回现实，又派遣高管担任「二相乐园」的首席执行官，令其成为公司重要的资产星球。"
origin_erxiangleyuan_desc:"哈托彼亚，一颗位于失魂星域的天体。传闻久远的过去，「欢愉」星神阿哈曾创造一轮有生命的幻月，令其成为愚者与伶人演出的舞台，建立起包括古弁才天国在内的众多文明。每当幻月满盈时，一场以谒神为名的「幻月游戏」也将如期开始。胜者将承蒙星神垂迹，领受那星神垂赐的「欢愉」权能。尔后，「毁灭」的军锋席卷失魂星域，将众多世界化为白地——此处也不能幸免。所幸一位绘师施展神迹，将整个世界收入「画卷」，最终拯救众生免受涂炭。久远岁月后，归来的幸存者们试图重建故土。在「诸世界重建计划」的运作下，星际和平公司利用朋克洛德的以太编辑技术，将藏入画中平面的世界打捞回现实，又派遣高管担任「二相乐园」的首席执行官，令其成为公司重要的资产星球。"
