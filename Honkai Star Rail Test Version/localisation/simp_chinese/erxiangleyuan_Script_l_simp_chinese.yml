tech_ZHUPAO:0 "“帝怒”主炮"
tech_ZHUPAO_desc:0 "“帝怒”主炮,是寰宇湮灭光束的改良版，在命中目标的瞬间二次加速的同时，利用光光束的力量将目标周围的空间完全崩碎，再利用剩余的能量进行空间修复，使空间恢复到“不存在”目标的状态。至于敌人，早已被撕碎、从这个世界上抹除"
