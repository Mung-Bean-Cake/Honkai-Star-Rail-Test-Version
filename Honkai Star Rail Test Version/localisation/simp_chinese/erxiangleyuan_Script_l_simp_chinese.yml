HUANYU_DESC:0 "在对空间以及能量武器有了充足的了解后，科学家们向您提出了一项具有划时代意义的武器，它的存在足以让每个敌人感到恐惧。利用超空间加速技术，使光线速度在命中目标的瞬间二次加速，使光线的能量超出宇宙空间承受范围，从而引起空间坍缩，进而发生不可逆的湮灭"
Kingdom_power:0 "恒星炉心"
Kingdom_power_desc:0 "恒星炉心的内部是一颗真正的，永不衰老的恒星。它的存在为“帝威”提供取之不竭的能量"
Kingdom_tuijin:0 "曲时空推进器"
Kingdom_tuijin_desc:0 "曲时空推进器可以在“帝威”周围形成一层特殊的空间膜，降低空间对舰船的“阻力”，从而使航行速度大幅提升"
Kingdom_leida:0 "时空间探针"
Kingdom_leida_desc:0 "时空间探针可以记录周围空间的波动，时间的影像。并在一定程度上预测未来"
Kingdom_diannao:0 "阿房宫系统"
Kingdom_diannao_desc:0 "阿房宫系统作为仙秦最伟大的科学成果之一，其无与伦比的算力足以碾压一切作战电脑，唯一的缺点就是无法量产"
Kingdom_guanghuan:0 "“原点”领域"
