xkhg:0 "虚空辉光"
tech_XKHG:0 "虚空辉光"
tech_XKHG_desc:0 "利用超空间加速技术，将伽马激光在特定空间内加速，增幅其穿透能力与伤害"
XKHG:0 "虚空辉光"
XKHG_DESC:0 "利用超空间加速技术，将伽马激光在特定空间内加速，增幅其穿透能力与伤害"
large_XKGH:0 "虚空辉光"
tech_KJPZ:0 "空间膨胀鱼雷"
tech_KJPZ_desc:0 "将虚构空间技术应用在鱼雷上，爆炸时瞬间膨胀的虚构空间足以压碎敌人"
KJPZ:0 "空间膨胀鱼雷"
KJPZ_DESC:0 "将虚构空间技术应用在鱼雷上，爆炸时瞬间膨胀的虚构空间足以压碎敌人"
tech_FENGBAO:0 "高位空间毁灭风暴"
tech_FENGBAO_desc:0 "将积蓄的能量加速至一个独立的高位空间，再对空间实行降维，降维带来的能量将裹挟着电弧形成强大的风暴，足以毁灭一切敌人"
FENGBAO:0 "高位空间毁灭风暴"
FENGBAO_DESC:0 "将积蓄的能量加速至一个独立的高位空间，再对空间实行降维，降维带来的能量将裹挟着电弧形成强大的风暴，足以毁灭一切敌人"
tech_ZHUPAO:0 "“帝怒”主炮"
tech_ZHUPAO_desc:0 "“帝怒”主炮,是寰宇湮灭光束的改良版，在命中目标的瞬间二次加速的同时，利用光光束的力量将目标周围的空间完全崩碎，再利用剩余的能量进行空间修复，使空间恢复到“不存在”目标的状态。至于敌人，早已被撕碎、从这个世界上抹除"
ZHUPAO:0 "“帝怒”主炮"
ZHUPAO_desc:0 "帝王一怒，群星祈恕"
tech_KJBL:0 "空间限界武装"
tech_KJBL_desc:0 "通过加固空间的方式加强装甲，同时生成特殊的空间立场护盾。在超出护甲承受范围时，装甲上的空间护甲会主动崩解抵消一部分攻击"
KJBL:0 "空间限界武装"
KJBL_DESC:0 "通过加固空间的方式加强装甲，同时生成特殊的空间立场护盾。在超出护甲承受范围时，装甲上的空间护甲会主动崩解抵消一部分攻击"
small_KJBL:0 "小型空间限界武装"
medium_KJBL:0 "中型空间限界武装"
large_KJBL:0 "空间限界武装"
tech_HUANYU:0 "寰宇湮灭光束"
tech_HUANYU_desc:0 "在对空间以及能量武器有了充足的了解后，科学家们向您提出了一项具有划时代意义的武器，它的存在足以让每个敌人感到恐惧。利用超空间加速技术，使光线速度在命中目标的瞬间二次加速，使光线的能量超出宇宙空间承受范围，从而引起空间坍缩，进而发生不可逆的湮灭"
HUANYU:0 "寰宇湮灭光束"
HUANYU_DESC:0 "在对空间以及能量武器有了充足的了解后，科学家们向您提出了一项具有划时代意义的武器，它的存在足以让每个敌人感到恐惧。利用超空间加速技术，使光线速度在命中目标的瞬间二次加速，使光线的能量超出宇宙空间承受范围，从而引起空间坍缩，进而发生不可逆的湮灭"
Kingdom_power:0 "恒星炉心"
Kingdom_power_desc:0 "恒星炉心的内部是一颗真正的，永不衰老的恒星。它的存在为“帝威”提供取之不竭的能量"
Kingdom_tuijin:0 "曲时空推进器"
Kingdom_tuijin_desc:0 "曲时空推进器可以在“帝威”周围形成一层特殊的空间膜，降低空间对舰船的“阻力”，从而使航行速度大幅提升"
Kingdom_leida:0 "时空间探针"
Kingdom_leida_desc:0 "时空间探针可以记录周围空间的波动，时间的影像。并在一定程度上预测未来"
Kingdom_diannao:0 "阿房宫系统"
Kingdom_diannao_desc:0 "阿房宫系统作为仙秦最伟大的科学成果之一，其无与伦比的算力足以碾压一切作战电脑，唯一的缺点就是无法量产"
Kingdom_guanghuan:0 "“原点”领域"

craze_planet_eater:"喰星"
craze_planet_eater_desc:"利用【贪饕】的力量，将一整颗星球吃干抹净，其中的力量将让我们更加强大"
craze_planet_eater_beam:"利齿寒光"
craze_planet_eater_beam_desc:"“喰星”的副产物，但也拥有不俗的破坏力，它将切碎嚼烂一切敌人"
craze_star_eater_power:"无底之胃"
craze_star_eater_power_desc:"“喰星”吞噬星球后，溢出的一点点能量将被储存在这里，但也足以维持这艘泰坦长久地运行了"
craze_star_eater_tuijin:"急切之足"
craze_star_eater_tuijin_desc:"就如同饥饿的人飞奔向美食那样，喰星者会将敌人撕碎吞吃"
craze_star_eater_leida:"搜寻之眼"
craze_star_eater_leida_desc:"他们无处可藏，因为战场即是喰星者的餐桌，他们已经是待宰的羔羊"
craze_star_eater_diannao:"渴望之脑"
craze_star_eater_diannao_desc:"喰星者将成为我们的利齿，它会满足我们一切的战争需求"
