#疯狂天灾
#阶段1————1.局势
craze.2_title:"未知恶物"
craze.2_desc:"不明的力量从地底显现，它不仅撕裂了星球的地表，其中的力量还影响了我们的人民"
craze.2_op_1:"重视起来"
craze.2_op_2:"不管它"
planet_tantao_pollution_1:"未知恶物Lv.1"
planet_tantao_pollution_1_desc:"不明的力量从地底显现，它不仅撕裂了星球的地表，其中的力量还影响了我们的人民\n幸福度§R-700§!\n岗位产出的资源§R-10%§!"

craze.3_title:"未知恶物"
craze.3_desc:"这股力量变得更强大了，我们不得不重视起来"
planet_tantao_pollution_2:"未知恶物Lv.2"
planet_tantao_pollution_2_desc:"这股力量变得更强大了，我们不得不重视起来\n幸福度§R-1000§!\n岗位产出的资源§R-50%§!\n建筑产出的资源§R-50%§!"
situation_craze_situation_1:"未知恶物"
situation_craze_situation_1_desc:"不明的力量从地底显现，它不仅撕裂了星球的地表，其中的力量还影响了我们的人民,我们必须重视起来"
situation_craze_situation_1_finish:"这一切结束了么？"
craze_situation_1_approach_1:"不管"
craze_situation_1_approach_2:"用愿力压制裂隙"
craze_situation_1_approach_3:"或许可以利用它"
craze_situation_1_approach_fail:"你已经选择了一种方法"
planet_tantao_pollution_3:"未知恶物Lv.3"
planet_tantao_pollution_3_desc:"这股力量已经严重影响了我们的星球，甚至开始影响我们的命途\n幸福度§R-3000§!\n岗位产出的资源§R-80%§!\n建筑产出的资源§R-80%§!\n岗位维护费§R+100%§!\n建筑维护费§R+100%§!"
planet_tantao_pollution_4:"未知恶物Lv.4"
planet_tantao_pollution_4_desc:"或许我们做错了，如果再恶化下去，这颗星球就要变成一颗死寂星球了\n幸福度§R-6000§!\n岗位产出的资源§R-100%§!\n建筑产出的资源§R-100%§!\n岗位维护费§R+200%§!\n建筑维护费§R+200%§!"
planet_tantao_pollution_5:"奇妙共生"
planet_tantao_pollution_5_desc:"赞美欢愉！这股力量竟然奇妙的与【欢愉】相融合，或许我们创造了一个伟大的奇迹\n幸福度§G+1000§!\n岗位产出的资源§G+40%§!\n建筑产出的资源§G+40%§!\n岗位维护费§G-20%§!\n建筑维护费§G-20%§!"
#阶段1————2.科技
craze_system:"虚空之遗"
craze_planet_0:"遗落之肴"
craze.5_title:"渴望欢愉"
craze.5_desc:"我们的一个星球上爆发了一场可怕的灾难。经科学家查明，这颗星球上同样出现了那种未知的力量。或许我们可以用相同的方法中和掉它"
planet_tantao_pollution_6:"渴望欢愉"
planet_tantao_pollution_6_desc:"这颗星球上的人民完全没有工作的动力，我们必须找出解决方法\n幸福度§R-6000§!\n岗位产出的资源§R-100%§!\n建筑产出的资源§R-100%§!\n岗位维护费§R+200%§!\n建筑维护费§R+200%§!\n完成科技[§H幻月秘庭·伪§!]，并在此星球上建造该建筑以去除此修正"
the_craze_planet:"异常的渴望"
the_craze_planet_DESC:"我们需要调查出[the_craze_planet_name.GetName]上的人民对宴会的异常渴望"

craze.7_title:"渴望欢愉"
craze.7_desc:"我们的猜想完全正确，现在我们需要能够让愿力输送到[the_craze_planet_name.GetName]的方法\n万幸的是，科学家们已经提出了解决方案————仿造§H幻月秘庭§!在星球上建立起愿力节点，就如同建立起一条输送愿力的高速通道一样。只待您的命令，我们就开始研究这项科技"
craze.7_op_1:"大胆去做吧"
tech_building_phantasmoon_court_1:"§H幻月秘庭·伪§!"
craze.7_op_2:"我们应该谨慎对待"
tech_building_phantasmoon_court_1_desc:"仿制幻月秘庭而建造的建筑，旨在让更多世界享受欢愉\n虽然其愿力不及原本，但依然可以笼罩整个星球"
the_tantao_pwoer_chain:"刃齿深渊"
the_tantao_pwoer_chain_desc:"这种情况背后一定存在什么隐患，我们应该立刻查明"
the_tantao_power_1:"窥探深渊"
the_tantao_power_1_desc:"这种情况背后一定存在什么隐患，我们应该立刻查明"

craze.8_title:"回复活力"
craze.8_desc:"幻月秘庭散发出的愿力中和了笼罩在[the_craze_planet_name.GetName]上的未知力量，同时，§H幻月秘庭·伪§!散发出的愿力同样笼罩了这颗星球"
craze.8_op_1:"我们可以在更多的星球上建造§H幻月秘庭·伪§!"

craze.9_title:"群星之宴"
craze.9_desc:"§M没错...更多...§!真是天才的想法，我们应该让更多人享受到【欢愉】。但是我必须要提醒您，§H幻月秘庭·伪§!的选址十分重要，我们应该慎重考虑。§M分散...遍布河系...§!"
craze.9_op_1:"当然！！§M！§!"
#阶段2————1.2阶段考验
craze.10_title:"孽物显现"
craze.10_desc:"我们的雷达显示，有着邪恶力量的造物正在向我们前进。目击者声称这些可怕的怪物路过的星系都像是被啃食过一般！\n我们不能放任它们在我们的领土上肆虐"
craze.10_op_1:"我们必须集结舰§M队§!"
tantao_peitai_ship_design:"贪饕孽物"
tz_menp_1_test_2_project:"研究孽物"
tz_menp_1_test_2_project_desc:"他们的破坏性和目击者声称的相去甚远，不过眼下我们正有机会堪破其中缘由"
craze.13_title:"研究孽物"
craze.13_desc:"科学家们传回消息了，他们解刨了一些相对完好的遗骸——这种生物的胃占据了大部分的位置，在其中，他们找到了岩石，合金，甚至是一些未知生物的肉\n更令人惊讶的是，即使它们已经死亡，体内的脏器仍然在缓慢的工作。这些被吃下的物质分解为纯粹的能量，储存在类似肝脏的器官中\n这太奇怪了，就好像它们是故意吃下这些东西，然后来供我们研究的\n无论如何，最终的决定权在您\n \n \n \n§M供养...吞噬...§!"
craze.13_op_1:"我们应该§M更进一步§!"
craze.13_op_2:"我们应该§M谨慎一些§!"
#阶段3————1.3阶段考验
craze.14_title:"毁灭降临"
craze.14_desc:"我们已经锁定了敌人，由绝灭大君——归寂带领的舰队来势汹汹\n为了我们的伟业，我们绝不能倒下"
craze.14_op_1:"这是一场试炼，但笑到最§M后的会是我们§!"
craze.16_title:"毁灭的鼓点"
craze.16_desc:"大事不妙，我们的雷达感应到了反物质舰队正在向我们的边境袭来"
craze.16_op_1:"什么！§M！§"
craze.17_title:"一场交易"
craze.17_desc:"早安，午安，或者晚安。二相乐园的诸位，当看见这颗星球重新出现在银河时，我真的是无比的“欢愉”\n老朋友们，我可想死你们了"
craze.17_op_1:"我想我们之间没什么好聊的"
craze.17_op_1.response:"哦是嘛？那你一定想听听这个消息，你的每一颗星球上都被我安置了足以炸毁整个星球的炸弹\n当然了，你可能不信，你可以按~键用debug_toolips看看你的星球\n你只需要关掉这个事件.....boom~你的一切都会化作飞灰"
craze.17_op_2:"你没有立刻进攻我们，那么你的目的是什么"
craze.17_op_2.response:"title不是写的很明白么：“一场交易”....另外，请不要质疑一位绝灭大君的立场，我的目的从始至终都是为【欢愉】带来毁灭"
craze.17_op_3:"说说你的条件吧"
craze.17_op_3.response:"终于进入正题了，看看你右侧的局势条。我会提出条件，你来选择是否接受，相应地你会收到“回馈”，很简单易懂不是么\n你可以选择把我晾在一旁狠狠地造战舰，这些都无所谓，但请记住\n§R我的耐心有限，超过这个期限，那我们的交易就作废§!"
craze.17_op_4:"那我们开始吧"
situation_craze_situation_2:"一场交易，一场试炼"
situation_craze_situation_2_desc:"风暴悄然逼近，这将是一场足以改变我们命运的战斗"
situation_craze_situation_2_finish:"笑到最后的一定会是我们"
craze_situation_2_approach_1:"归寂正在等待"
craze_situation_2_approach_2:"接受"
craze_situation_2_approach_3:"拒绝"
situation_craze_situation_2_0:"一场交易，一场试炼"
situation_craze_situation_2_1:"交易一"
situation_craze_situation_2_2:"交易二"
situation_craze_situation_2_3:"交易三"
situation_craze_situation_2_4:"交易四"
craze.18_title:"交易一"
craze.18_desc:"§R你的舰船武器伤害-20%，舰船武器射速-20%§!\n§G相应的，我会解除掉你没有建造§H幻月秘庭·伪§!的星球上的炸弹§!"
craze.18_op_1:"我会考虑的"
craze.19_title:"交易二"
craze.19_desc:"§R你的舰船船体值，护盾，装甲-30%§!\n§G相应的，我可以撤掉一部分舰队§!"
craze.19_op_1:"我会考虑的"
craze.20_title:"交易三"
craze.20_desc:"§R你建造舰船的速度-10%§!\n§G相应的，我会赠送你一些奇妙的科技§!"
craze.20_op_1:"我会考虑的"
craze.21_title:"交易四"
craze.21_desc:"§R你的§H幻月秘庭·伪§!生产£the_power_of_wish£§Y$the_power_of_wish$的能力将降低一部分§!\n§G相应的，首都的星球岗位生产资源的能力将增加§!"
craze.21_op_1:"我会考虑的"
craze.22_title:"归寂炸弹"
craze.22_desc:"我们的星球被归寂的炸弹爆破了，幸好我们引导愿力保护了建造节点的星球"
craze.22_op_1:"我们尚且可以接受§M这样的牺牲§!"
craze.23_title:"耐心将尽"
craze.23_desc:"我们应该对归寂的交易做出回应了"
craze.23_op_1:"接§M受§!"
craze.23_op_2:"拒§M绝§!"
craze.25_title:"仍活着的星球"
craze.25_desc:"我们在清理残余的反物质军团时发现了一颗特殊的星球，尽管它所在的星系已经被毁灭，但这颗星球仍然“活着”\n让我详细为您说明吧，这颗星球的内核拥有非凡的特殊性，科学家们推测这颗星球在未被毁灭前拥有者绝大部分星球的特征与及其丰富的资源，这是一个§H宇宙的奇迹§!\n而如今，虽然它已经崩坏，但它的内核仍然尝试着“愈合”自己，或许我们可以稍加引导\n将其改造为一颗幻造星球，虽然这要比改造一般的星球更加费时费力"
craze.25_op_1:"当然，这是§M值得的§!"
craze.25_op_2:"不，我们没有多§M余的精力了§!"
still_alive_planet:"破碎的奇迹"
still_alive_planet_desc:"一颗非凡的行星，它是宇宙的明珠，它曾被毁灭所荼毒。如今，它将在我们手中重新绽放光彩"
craze.26_title:"神秘的魔方"
craze.26_desc:"归寂先前承诺的神秘科技已经送来了，这份遗珍意外的.....“干净”？\n总之，归寂还贴心地送来了使用方法——“按照你的喜好，拼好它”"
craze.26_op_1:"让我§M看看§!"
craze.27_title:"一次劝阻"
craze.27_desc:"呵呵呵，看啊看啊，哈托彼亚曾经的大英雄，又一次从【毁灭】手中拯救了二相乐园"
craze.27_op_1:"急了？没想到绝灭大君也有束手无策的时候"
craze.27_op_1.response:"你一定会有后悔那一天的，后悔没有让我将二相乐园毁掉"
craze.27_op_2:"你没有毁灭我们的机会了"
craze.27_op_2.response:"是啊，到时候又有谁能毁灭你们呢？你们会成为这个宇宙最令人生厌，让人避之不及的灾祸"
craze.27_op_3:"我们知道我们走在什么样的道路上"
craze.27_op_3.response:"你知道？你要是真的知道，就绝不会走上这条道路的......算了，和现在的你说有什么用呢...."
craze.27_op_4:"永别了，归寂"
craze.27_op_4.response:".......我们还会再见的....."
#三阶
craze.28_title:"喰星者"
craze.28_desc:"真是一次伟大的反击，恐怕整个宇宙中也从未有过如此的战果———我们近乎无损地击退了一位绝灭大君\n但是，我们的将领也从中反思很多，我们的舰队实力还是太弱小了，我们需要全新的战斗力\n为此，科学家们提出了一种新的泰坦蓝图，请您过目"
craze.28_op_1:"这正是我§M们需要的§!"
craze.31_title:"§M飨宴，如约而至§!"
craze.31_desc:"§M这次盛宴的食客有两位...菜品也正好是两道\n最后..只会有一位星神新生...§!"
craze.31_op_1:"食人者，§M终饲人§!"
tantao_huashen:"贪饕化身"
craze.32_title:"§M在第零日，祂作为祭品§!"
craze.32_desc:"贪饕化身残破的身躯飘荡再星系间，就连恒星的的光芒也被飞溅的血液染成暗红色\n巨兽的生命力的确在消散，是的，贪饕倾尽剩余的一切造出的尖牙，终究崩断在舰队的钢铁上\n祂再也不可能复活了，永远"
craze.32_op_1:"......"
craze.33_title:"在§M第一日，祂哺育我们§!"
craze.33_desc:"滴答——\n暗红色的水珠落下\n“雨？在这个时候？”有人疑问道，他试着伸手抹去，却反而涂了一脸。甜美的气息冲进鼻腔，他的眼神迷离起来“这种感觉，真的是...妙不可言”\n暴雨倾盆，人们在甘甜的气味中狂欢，天上飘下的，打在身上的，落在地上的，人们争抢着将雨水塞入口中\n雨停，就连那充斥世界的暗红光芒也似乎被一并洗去\n“为什么停下了，我还没喝够啊”“兄弟你好香啊”“再让我尝一口，一口就好”“啊啊啊，你咬我干嘛，等等，我好香啊”“快拉开他们，哎哎，给我留一口”“我的味道也不错吧，我尝尝\n§M就这样，让另一场闹剧开演§!”"
craze.34_title:"在第§M二日，我们反哺祂§!"
craze.34_desc:"闹剧还在上演，人们尽情享受这一切，他们早已听不见远方的恸哭\n§M啊，看起来祂可不愿意见到这一切，让我来帮帮你们§!\n黑暗遮住光芒，人们抬头望去只见到无数利齿，大的小的长的短的，宛如星星般点缀着天空\n“哦，你也想来上一口是么，来尝尝我”有好客的人向祂邀请到\n§M咔咔咔，地壳似乎有些坚硬了，哦，上面的肉粒倒是很完美，他们吸满了汤汁\n咔嚓，咯咯咯，太棒了这个口味，这种浸满了【欢愉】的滋味，哦对了对了，千万不能忘了主菜\n嘶拉————我的肉可是有嚼劲，还有这个，一定要搭配着这个§!\n咕噜，呕——阿哈，看看这是谁的头啊？美味无比美味无比\n命途的滋味，竟然如此美妙§!"
craze.32_op_1:"......"
craze.35_title:"在第三§M日，你我合为一§!"
craze.35_desc:"空洞的宇宙中，笑声与哭声交织成乐曲\n§M很棒不是么，我早该这么做了”祂欢笑着\n“将一大份的【贪饕】当作喂料填入掏干的【欢愉】中，最后撒上一小份的【贪饕】与一小份的【欢愉】搅拌而成的酱汁”\n哭声渐弱，笑声渐歇\n祂张开巨口，吞吃着自己涨圆的身躯，渐渐地，祂化作一个点，渐渐地，祂消失在宇宙中\n就像是一个荒诞的梦，一切从未发生过，这个宇宙依然平静，依然美好，星神们的闹剧依然上演，就像是一锅煮沸的汤，就像是一场永不落幕的闹剧§!"
craze.32_op_1:"......"
craze.36_title:"在第四日§M，一化为我们§!"
craze.36_desc:"在这纯白的狭间，我们扭曲，蔓延。我们尽情地伸展皮肤，十肢，毛发\n“yhsljfdgh3984b%&@”仿佛有一万个的不同的声音，以不同语言不同声调发出同一句话\n紧接着，我们迫不及待地伸出腿，六只脚上的触手勉强撑起我们的身体\n挺起后背，裂开的大嘴仿佛要发出啼哭，头上的声带随之震动起来\n腰上的八手四处摸索着，掌心的鼻孔喘着粗气\n“suebkjgbkjahYIA*%#”又是一阵骚动，随后是长久的安静\n一个声音响起“你们还记得我长什么样子么”，“哦记得记得”，“可是我们没力气了”，“好饿好饿”，“这里好无趣，想出去玩”骚乱再次回荡在狭间\n“好了好了，静下来”一个声音盖过了其他“不如我们捏点玩偶，让他们帮帮我们吧”。“对对，好主意”剩下的声音统一起来\n于是我们再次行动起来，把自己捏成小人，捏成星球，捏成太阳，捏成建筑”\n这下子，我们就变成我们了"
craze.36_op_1:"......"
craze.37_title:"在第四日§M，且在此驻足§!"
craze.37_desc:"那么，为了我们，下一个目标是"
craze.37_op_1:"让众人皆能进入我们的乐园，让【同谐】化为我们的面目"
craze.37_op_2:"让我们能弹奏乐器放声歌唱，让【丰饶】化为我们的肢体"
craze.37_op_3:"让食粮不尽让盛宴永不落幕，让【繁育】化为我们的躯壳"
craze.37_op_4:"让宾客欢笑使惊喜永不缺席，让【神秘】化为我们的幕布"
craze.38_title:"为宴会做足准备"
craze.38_desc1:"「希佩」是一位强大的星神，所幸，祂和我们的相性很好\n要如何与星神交战是我们的事，而我们，只要能抵达那片忆域，就能为我们提供足以倾斜天平的砝码"
craze.38_desc2:"万幸，「药师」是一位慈悲的神明。我们并不需要与其交战\n只要在一颗§G拥有强大生命力的星球§!上呼唤祂，相信祂会赐予我们想要的那部分"
craze.38_desc3:"那位「塔伊兹育罗斯」虽然已经陨落，但祂的命途仍然活跃\n一条无主的命途能省去我们很多麻烦，我们只需要取得祂的一部分，就能尽情从命途上啜饮"
craze.38_desc4:"找寻「迷思」是一件极其困难的事情，好在我们有自己的办法\n找到一个有§G星界裂隙§!的星系，随后我们便可以在探索的过程中扰乱宇宙，或许能够发现祂的踪迹"
craze.40_title:"揭开面纱"
craze.40_desc1:"我们通过这条星界裂隙扰乱了此处的空间，但我们并没有找到祂，不过我们还有机会不是么"
craze.40_desc2:"看来「迷思」已经忍受不了我们的骚扰了，好在，这就是我们想要的\n击溃这些妄图解救【神秘】的敌人"
craze.40_op_1:"当然"
craze.41_title:"呼唤丰饶"
craze.41_desc:"就如我们说的那样，我们只需要找到一颗§G拥有强大生命力的星球§!\n比如一颗§G盖亚星球§!，当然我们或许有其他的选择\n你可以在星球决议里找到§G呼唤丰饶§!"
craze.42_title"因果"
craze.42_desc"等等，二相乐园的各位。请暂时停下那个仪式\n如果你们愿意听听我的谏言"
craze.42_op_1:"我听说仙舟视丰饶为敌人，你们是来开战的么"
craze.42_op_1.response:"并非如此\n因为某些原因，我们了解到了【欢愉】的异状，所以这就是我的目的\n我们也曾寻求过【丰饶】的赐福，但最后却只给我们带来了灾难\n我希望我们可以用【巡猎】的帮助代替【丰饶】的赐福\n仙舟联盟绝不会拒绝一位需要帮助的朋友"
craze.42_op_2:"除非你们愿意用一条命途来换"
craze.42_op_2.response:"哦？也就是说，你们并非寻求【丰饶】的赐福，而是在寻找【丰饶】本身么....\n即使，你们知道这可能成为神战的导火索\n嗯...如果说，我很愿意向元帅上表此事呢"
craze.42_op_3:"我们不能将未来押在你们身上"
craze.42_op_3.response:"那真是可惜，不过我们仍不打算将你们视为敌人，除非你们会变成丰饶民那样的疯子"
craze.42_op_4:"这倒是我们没想到的，我们接受"
craze.42_op_4.response:"那就请各位静候佳音，鄙人对自己的口才还是有那么一点信心的"
craze.43_title:"报应"
craze.43_desc:"一道光矢贯穿了我们的星球，我们能感觉到，我们的同胞无一幸免，那道光矢拉出一道光带消失在视线里\n而凶手，我们心知肚明"
craze.44_title"苍白的未来"
craze.44_desc"不，这绝非我们所做，我愿以性命做保"
craze.44_op_1:"不必多言了，我们已经领教过阁下的口才了"
craze.44_op_1.response:"请给我一些时间，我一定将真相查明，我们也会弥补这一切"
craze.44_op_2:"我们感受得到，“复仇”的火焰在那光矢上燃烧"
craze.44_op_2.response:"帝弓的锋镝绝不会指向无辜者"
craze.44_op_3:"够了，下次见面，希望仙舟不要挡在我们的路上"
craze.44_op_3.response:"......."
craze.45_title:"呼唤丰饶"
craze.45_desc:"我们这次失败了，我们需要重新选择一个星球"
craze.45_op_1:"没问题"
