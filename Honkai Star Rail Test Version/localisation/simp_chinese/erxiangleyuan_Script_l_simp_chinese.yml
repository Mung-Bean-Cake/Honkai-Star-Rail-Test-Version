job_erxiangleyuan_specialist_desc:"能力者中的佼佼者\n——\n【“level-5,七十五万匹力量，原子给我重组耶”】\n【“嘻，能见到如此强者，就算是被风纪委员抓走也值了口牙”】"
job_erxiangleyuan__desc:"GiliGili视频平台上的百万大V\n——\n【“我不敢苟同他的观点啊，我个人认为，这个意大利面就应该拌42号混净土，因为这个螺丝钉的长度，它很容易会直接影响到挖掘机的扭矩你知道吧，你往里砸的时候，一瞬间它就会产生大量的高能蛋白，俗称UFO，会严重影响经济的发展，甚至对整个太平洋以及充电器都会造成一定的核污染你知道吧”】\n【“再者说，根据这个勾股定理，你可以很容易地推断出人工饲养的东条英机，它是可以捕获野生的三角函数的，所以说，你不管秦始皇的切面是否具有放射性啊，川普的的N次方是否含有沉淀物啊，都不影响这个沃尔玛跟维尔康在南极会合”】"
