 # ---------- 物种特质 ----------
 trait_DOTGI_genshin_blessing:0 "提瓦特的祝福"
 trait_DOTGI_genshin_blessing_desc:0 "提瓦特人与生俱来便与这个世界的地脉相连。这份祝福让他们在一切劳作与求知中都展现出远超常人的天赋，族群几乎不会衰老，领袖的寿命被延长至数百年之久。\n\n£mod_planet_jobs_energy_produces_mult£ 能量产出 §G+50%§!\n£mod_planet_jobs_minerals_produces_mult£ 矿物产出 §G+50%§!\n£mod_planet_jobs_food_produces_mult£ 食物产出 §G+50%§!\n£mod_planet_jobs_physics_research_produces_mult£ 物理学研究 §G+50%§!\n£mod_planet_jobs_society_research_produces_mult£ 社会学研究 §G+50%§!\n£mod_planet_jobs_engineering_research_produces_mult£ 工程学研究 §G+50%§!\n£mod_planet_jobs_unity_produces_mult£ 凝聚力产出 §G+50%§!\n£mod_planet_jobs_alloys_produces_mult£ 合金产出 §G+30%§!\n£mod_planet_jobs_consumer_goods_produces_mult£ 消费品产出 §G+30%§!\n£mod_pop_happiness£ 幸福度 §G+15%§!\n£mod_planet_amenities_add£ 便利设施 §G+5§!\n£mod_leader_lifespan_add£ 领袖寿命 §G+200§!"

 # ---------- 静态修正器 ----------
 DOTGI_abyss_erosion_modifier:0 "§R深渊侵蚀§!"
 DOTGI_abyss_erosion_modifier_tooltip:0 "§R深渊侵蚀§!\n深渊的力量正从这颗星球的地表裂缝中渗出，腐蚀着大地与人心。若不加以遏制，终有一日它将吞没整个世界。\n\n£mod_pop_happiness£ 幸福度 §R-20%§!\n£mod_planet_stability_add£ 稳定度 §R-10§!\n£mod_logistic_growth_mult£ 人口增长速度 §R-50%§!\n£mod_planet_jobs_upkeep_mult£ 岗位维护费 §R+25%§!"
 DOTGI_teyvat_awakened_modifier:0 "§G深渊消散§!"
 DOTGI_teyvat_awakened_modifier_tooltip:0 "§G深渊消散§!\n笼罩提瓦特千年的阴影已被彻底驱散，这颗盖亚世界重新焕发出生机。\n\n£mod_planet_stability_add£ 稳定度 §G+10§!\n£mod_pop_happiness£ 幸福度 §G+10%§!\n各项研究产出 §G+10%§!"

 # ---------- 异常现象【深渊侵蚀】 ----------
 DOTGI_abyss_erosion_cat:0 "深渊侵蚀"
 DOTGI_abyss_erosion_desc:0 "行星探测扫描显示，这颗盖亚世界的表层之下存在一团无法辨识的能量结构。它在缓慢地扩散，并持续腐蚀着行星的地脉——这正是提瓦特文献中反复提及的「深渊」。"

 # ---------- 局势【来自虚空的求救信号】 ----------
 DOTGI_distress_signal_situation:0 "来自虚空的求救信号"
 DOTGI_distress_signal_situation_type:0 "来自虚空的求救信号"
 DOTGI_distress_signal_situation_desc:0 "§B提示：游牧帝国需要通过星球决议【列车停靠】将自身转换为常规帝国，建立恒星基地，方可探索裂隙；【列车停靠】不会让方舟失去移动能力；BY绿豆糕§!我们的深空监听阵列捕捉到一段极其微弱的、不断重复的信号。它自某个星界裂隙的深处传来，夹杂着无法解读的语言与一个反复出现的名字——「提瓦特」。\n\n这或许是某个濒临毁灭的文明最后的呼喊。要弄清真相，我们只能深入裂隙。"
 DOTGI_distress_signal_situation_monthly_change_tooltip:0 "只有不断深入星界裂隙，才能拼凑出求救信号的全貌。§B提示：游牧帝国需要通过星球决议【列车停靠】将自身转换为常规帝国，建立恒星基地，方可探索裂隙；【列车停靠】不会让方舟失去移动能力；BY绿豆糕§!"
 DOTGI_distress_signal_stage_1:0 "残响"
 DOTGI_distress_signal_stage_1_tt:0 "信号被初步定位：来自一个被虚空夹层包裹的世界。"
 DOTGI_distress_signal_stage_2:0 "文明的痕迹"
 DOTGI_distress_signal_stage_2_tt:0 "裂隙深处浮现出关于「提瓦特」的影像——七种元素、七位神祇、以及永不停息的地脉。"
 DOTGI_distress_signal_stage_3:0 "坐标"
 DOTGI_distress_signal_stage_3_tt:0 "裂隙尽头显露出提瓦特的确切坐标，同时揭示了一场正在吞噬它的灾难：深渊侵蚀。"
 DOTGI_distress_signal_outcome:0 "求救信号的源头已被完全解读：裂隙将坍缩为一条稳定的虫洞，帝国可借此直达提瓦特。"
 DOTGI_approach_decode_signal:0 "解析信号"
 DOTGI_approach_decode_signal_desc:0 "持续投入能量维持监听阵列，逐步解译来自虚空的信号。"

 # ---------- 局势【深渊侵蚀】 ----------
 DOTGI_abyss_erosion_situation:0 "深渊侵蚀"
 DOTGI_abyss_erosion_situation_type:0 "深渊侵蚀"
 DOTGI_abyss_erosion_situation_desc:0 "提瓦特的地脉正在被一种名为「深渊」的异质能量侵蚀。根据初步推算，若放任不管，它将在约10年后彻底吞没这颗星球，将其拖入虚境。\n\n我们必须争分夺秒地研究它，并投入大量资源遏制其扩散。"
 DOTGI_abyss_erosion_situation_monthly_change_tooltip:0 "深渊每月自行扩散；选择「全力调查」并投入资源可加速研究进度，进度归零时提瓦特将被吞没。"
 DOTGI_abyss_erosion_stage_1:0 "初现端倪"
 DOTGI_abyss_erosion_stage_1_tt:0 "深渊的构成被初步解析，它与虚境的联系已无可辩驳。"
 DOTGI_abyss_erosion_stage_2:0 "深入侵蚀"
 DOTGI_abyss_erosion_stage_2_tt:0 "研究团队找到了深渊的扩散节点，开始着手切断它们。"
 DOTGI_abyss_erosion_stage_3:0 "净化"
 DOTGI_abyss_erosion_stage_3_tt:0 "最后的节点被切断，深渊正在从提瓦特的地脉中退去。"
 DOTGI_abyss_erosion_outcome:0 "深渊被彻底清除。提瓦特文明将完全觉醒，并主动向帝国归附——但它的母星与主权始终属于提瓦特人自己。"
 DOTGI_abyss_erosion_fail_outcome:0 "提瓦特被深渊彻底吞没，化为虚境星球。"
 DOTGI_abyss_progress_investigate:0 "全力调查深渊"
 DOTGI_abyss_progress_contain:0 "封锁隔离"
 DOTGI_abyss_progress_anomaly_done:0 "异常现象已解析"
 DOTGI_approach_abyss_investigate:0 "全力调查"
 DOTGI_approach_abyss_investigate_desc:0 "抽调全部科研力量并投入巨额物资，全力解析深渊的构造。"
 DOTGI_approach_abyss_contain:0 "封锁隔离"
 DOTGI_approach_abyss_contain_desc:0 "在提瓦特周围建立封锁线，延缓深渊的扩散速度。"
 DOTGI_approach_abyss_ignore:0 "静观其变"
 DOTGI_approach_abyss_ignore_desc:0 "暂时不做任何处置。深渊将继续自行扩散。"

 # ---------- 事件：裂隙链 ----------
 DOTGI_teyvat.1.name:0 "来自虚空的求救信号"
 DOTGI_teyvat.1.desc:0 "裂隙内部并非虚无。我们的仪器捕捉到一段极其微弱却不断重复的信号，它绕过一切已知的物理法则，径直钻进每一个聆听者的脑海。\n\n那是一句话，用无数种无法解读的语言同时说出，却只有最后一个词能被理解——「提瓦特」。"
 DOTGI_teyvat.1.a:0 "继续深入。"
 DOTGI_teyvat.2.name:0 "残响"
 DOTGI_teyvat.2.desc:0 "越往深处走，信号越清晰。裂隙的壁上浮现出断续的影像：一座高塔、一片浮空的群岛、七道贯穿天地的光柱。\n\n它们不属于任何已知文明的造物。随行的语言学家颤抖着指着其中一个符号——那是一个仍在使用的文字，意思是「求救」。"
 DOTGI_teyvat.2.a:0 "记录一切，继续前进。"
 DOTGI_teyvat.2.b:0 "先带样本回去研究。"
 DOTGI_teyvat.3.name:0 "文明的痕迹"
 DOTGI_teyvat.3.desc:0 "影像变得连贯。我们看到一个被七种元素滋养的美丽世界——提瓦特。那里的居民建立城邦、信奉神祇、仰望星空。\n\n然而在最后一个画面里，某种漆黑的、不断蠕动的物质正从大地裂缝中涌出。影像在此处断裂。"
 DOTGI_teyvat.3.a:0 "我们必须找到通往那里的路。"
 DOTGI_teyvat.4.name:0 "尽头"
 DOTGI_teyvat.4.desc:0 "裂隙的尽头不是墙，而是一道门。\n\n门后是提瓦特的确切坐标，以及一条只要加以稳定便能永久通行的通路。信号在此刻戛然而止——不是中断，而是终于被听到了。\n\n我们将裂隙的出口锚定在母星系，让它坍缩成一条虫洞。"
 DOTGI_teyvat.4.a:0 "稳定通路，打开虫洞。"

 # ---------- 事件：局势相关 ----------
 DOTGI_teyvat.151.name:0 "来自虚空的求救信号"
 DOTGI_teyvat.151.desc:0 "帝国深空监听阵列在母星系内侧捕捉到一道极不寻常的裂隙——那不是自然造物，而是被某种力量撕开的虚空夹层。自它出现的那一刻起，那段不断重复的信号便占满了我们的每一个接收频道，夹杂着无法解读的语言，以及一个反复出现的名字：「提瓦特」。\n\n帝国已将其列为最高优先级的专项研究。\n\n§Y裂隙所在星系已完成全面测绘；该星系的前哨恒星基地已就位；裂隙球（星界裂隙探索装置）与虫洞稳定技术亦已同步配发至各科研部门。§!\n\n剩下的问题是：裂隙深处，究竟是谁在求救？"
 DOTGI_teyvat.151.a:0 "继续解析。"
 DOTGI_teyvat.195.name:0 "虫洞已开启"
 DOTGI_teyvat.195.desc:0 "裂隙在我们面前坍缩，化作一道稳定旋转的虫洞。虫洞另一端传来清晰的星光，以及一颗蓝色星球温柔的引力脉搏。\n\n那就是提瓦特。航道已通，全帝国的舰船都可借此直达。"
 DOTGI_teyvat.195.a:0 "派遣科学船前往提瓦特。"

 # ---------- 事件：抵达提瓦特 ----------
 DOTGI_teyvat.200.name:0 "提瓦特"
 DOTGI_teyvat.200.desc:0 "虫洞的出口处，是一颗美得令人屏息的盖亚世界。海洋、森林、山脉、草原——一切都恰到好处，仿佛有人精心雕琢过。\n\n地面上遍布着城市、道路与工厂，规模之庞大足以支撑起一个完整的文明。但我们的扫描结果却令人不安：这颗星球的地脉正被某种漆黑的能量持续侵蚀。提瓦特的居民把它称作「深渊」。\n\n我们没有太多时间。"
 DOTGI_teyvat.200.a:0 "启动专项研究。"
 DOTGI_teyvat.201.name:0 "深渊侵蚀"
 DOTGI_teyvat.201.desc:0 "初步分析确认，深渊并非自然现象。它是一种具有明确「意图」的异质能量，正沿着提瓦特的地脉网络有条不紊地推进。\n\n按当前速度推算，10年之内，这颗星球将被彻底拖入虚境。\n\n我们必须在深渊完成它的工作之前，先一步解开它的秘密。"
 DOTGI_teyvat.201.a:0 "我们不会让它得逞。"

 # ---------- 事件：异常现象研究完成 ----------
 DOTGI_teyvat.210.name:0 "深渊的秘密"
 DOTGI_teyvat.210.desc:0 "对异常现象「深渊侵蚀」的完整解析终于完成。\n\n研究团队确认，深渊并非提瓦特本土产物，而是某道更古老的裂隙留下的伤口——它与星界裂隙、与虚境同源。好消息是：它的扩散节点是可以被识别、也可以被切断的。\n\n现在我们需要做的，是投入足够的资源，一个一个地切断它们。"
 DOTGI_teyvat.210.a:0 "开始净化提瓦特。"

 # ---------- 事件：觉醒 ----------
 DOTGI_teyvat.220.name:0 "提瓦特觉醒"
 DOTGI_teyvat.220.desc:0 "最后一个深渊节点被切断的瞬间，提瓦特的地脉重新亮了起来。\n\n长年被压制在机械时代的提瓦特人，在短短数月之内走完了其他文明数百年的路：他们理解了星空、造出了跃迁引擎，并主动找上了我们的使节。\n\n率领这支新生文明的，是一位自称「荧」的少女。她伸出手，说出了提瓦特历史上的第一句外交辞令：「我们不会忘记，是谁把我们拉出深渊的。」\n\n提瓦特的母星与母星系都由提瓦特人自己治理——帝国不会占领他们的星球，我们设在提瓦特星系的前哨也已一并交还给提瓦特人。我们需要的只是一个名分。于是她给出了两个选项。\n\n（无论选择哪一个，提瓦特都将作为一个独立国家继续存在，拥有自己的星球、星系、政府与领袖。）"
 DOTGI_teyvat.220.a:0 "由帝国庇护：臣服为附庸国。"
 DOTGI_teyvat.220.b:0 "保持独立：以朝贡国身份纳贡。"
 DOTGI_teyvat.220.vassal_tt:0 "提瓦特保留其母星与全部主权，并接管自己的母星系（帝国不再持有该星系的恒星基地），成为帝国的§Y附庸国§!。帝国可代为掌管其外交与防务。"
 DOTGI_teyvat.220.tributary_tt:0 "提瓦特保留其母星与全部主权，并接管自己的母星系（帝国不再持有该星系的恒星基地），成为帝国的§Y朝贡国§!——定期向帝国缴纳贡赋，但内政与外交保持完全独立。"

 # ---------- 事件：深渊吞噬 ----------
 DOTGI_teyvat.230.name:0 "提瓦特沉没"
 DOTGI_teyvat.230.desc:0 "深渊的最后一个节点合拢了。\n\n提瓦特的天空在一夜之间变成翻涌的紫黑色，海洋蒸发，大地开裂，所有我们曾记录过的城市、歌声与灯火，都被卷入了那片不属于现实的虚境。\n\n信号消失了。我们听到了求救，却没能及时赶到。"
 DOTGI_teyvat.230.a:0 "……"
