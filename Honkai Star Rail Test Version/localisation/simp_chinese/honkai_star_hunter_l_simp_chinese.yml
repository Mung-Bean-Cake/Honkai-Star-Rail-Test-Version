#联邦
 new_order_federation: "星海秩序霸权"
 new_order_federation_desc: "我们有能力重新制定星海间的秩序\n任何敢于挑战我们权威的个体或国家都将被我们碾碎。"
 new_order_trade:"威权贸易协定"
 new_order_trade_desc:"制定新贸易协定是重塑星海秩序的一部分。"
 new_order_food:"深空农业发展条例"
 new_order_food_desc:"将宜居带轨道农场、行星地下垂直农业纳入核心民生保障体系，推广基因适配性高的耐辐射谷物品种，建立粮食储备战略库，要求各殖民星区农业自给率不低于70%，禁止非必要情况下将农业用地转为工业用地，农业生产数据实行星区周报制度，由联邦农业署统一调度。"
 new_order_science:"前沿科技攻坚法案"
 new_order_science_desc:"设立联邦科技专项基金，重点投入超空间跃迁技术、护盾材料迭代、智能作战系统三大领域，对做出核心贡献的科研团队给予爵位、殖民星命名权等奖励，严格管控科技外流，核心技术科研人员实行联邦级安全保护，严禁未经审批向非同盟势力转让任何军工相关技术。"
 new_order_maintain:"社会稳定保障准则"
 new_order_maintain_desc:"建立联邦-星区-殖民点三级舆情监测体系，开通民生诉求直达通道，及时处置资源分配不公、公共服务缺失等问题，严厉打击分裂势力、宗教极端组织及非法偷渡行为，对受灾殖民星区第一时间启动物资驰援与灾后重建，确保各星域民众归属感与认同感维持在安全阈值以上。"
 new_order_ship_defence:"舰队防护升级计划"
 new_order_ship_defence_desc:"为所有现役主力舰列装第三代极化护盾系统，舰队锚地同步部署固定式轨道防护炮与干扰立场发生装置，每次作战行动后必须提交舰艇损伤报告，根据实战反馈迭代防护方案，确保舰队非战损率控制在5%以内。"
 new_order_strike_craft:"舰载机战力强化纲要"
 new_order_strike_craft_desc:"重点发展隐身突防型、重型轰炸型两类舰载机，批量列装搭载小型离子炮的新型量产机型，每个编队舰载机编队满编率不得低于90%，定期组织舰载机飞行员跨星域实战演练，王牌飞行员享受与舰队舰长同等级待遇，作战损失的舰载机必须在7个工作日内完成补充。"
 new_order_martial_law:"边境星域戒严令"
 new_order_martial_law_desc:"所有与宿敌势力接壤的边境星区实行全时段戒严，民用船只穿越边境必须接受双重核验，无通行许可的外来舰船一律予以扣押或击毁，边境警备队实行24小时巡逻制度，一旦发现敌方侦察单位立即启动一级战备响应，戒严状态调整必须由联邦最高议会审批通过。"
 new_order_minerals:"矿产资源统管制"
 new_order_minerals_desc:"对所有已探明的稀有矿产、能源矿产实行联邦统一管控，矿产开采配额按星域工业需求分级分配，建立战略矿产储备库，严禁向非同盟势力出口矿产，矿产走私行为一经查实一律处以终身监禁及全部资产没收。"
 new_order_diplomacy:"对外外交准则"
 new_order_diplomacy_desc:"“同盟优先、中立缓冲、宿敌零接触”的外交原则，对友好同盟势力开放技术交流、贸易互通权限，对中立势力保持正常外交往来但核心领域不予合作，对认定的宿敌势力不签署任何停战、通商协议，不接受任何形式的外交斡旋，所有外交行动必须服务于联邦整体战略利益。"
 new_order_research:"天灾科研预案"
 new_order_research_desc:"若有威胁到整个星系的灾厄到来，科学界亦不能独善其身，须得将精力从思维游戏中抽脱出来，投入到防卫武具的研发当中。"
 new_order_research_effect:"$FEDERATION_PERK_MEMBER_MOD$\n在终局危机发生期间，科研速率得到§Y25%§!加成。"
 new_order_pops:"人口规划发展方案"
 new_order_pops_desc:"鼓励核心星域家庭生育，向新开发殖民星区推行定向移民政策，为移民提供首3年生活补贴与就业扶持，建立人口动态监测系统，确保劳动年龄人口占比不低于60%，高素质技术人才向军工、农业领域倾斜配置。"
 new_order_alloys:"合金产能提升行动"
 new_order_alloys_desc:"升级现有合金冶炼厂技术工艺，推广自动化冶炼生产线，将合金产能的60%优先供给军工建造领域，建立合金产能预警机制，一旦产能低于战略需求线立即启动工业用地扩容、劳动力调配等应急方案，确保战时合金供应无缺口。"
 new_order_rivalries:"宿敌应对总方略"
 new_order_rivalries_desc:"将所有与联邦存在核心领土争端、意识形态对立的势力认定为宿敌，建立宿敌军力动态监测数据库，资源分配优先倾斜对宿敌的战备需求，一旦爆发冲突举全国之力予以打击，直至对方完全放弃敌对诉求或丧失作战能力。"
 
