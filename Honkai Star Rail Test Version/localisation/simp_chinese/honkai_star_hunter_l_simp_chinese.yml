l_simp_chinese:
 #起源
 auth_lieshou:"星核猎手组织"
 gov_lieshou:"星核猎手"
 StellaronHunter:"星核猎手"
 councilor_ruler_administrator:"猎手总管"
 lieshou_leader:"猎手总管"
 origin_StellaronHunter:"星核猎手"
 HUNTER_END:"猎手终末帝国"
 origin_tooltip_StellaronHunter_effects:0 "星核猎手是由能预知未来的「命运的奴隶」艾利欧创立，信奉终末星神，旨在通过夺取星核执行「剧本」以对抗毁灭、改写宇宙命运的隐秘组织 。‌‌‌星核猎手成员严格遵循艾利欧编写的「剧本」，成员行动看似疯狂无序，实则是为了达成特定未来节点。组织成员极少但个个拥有覆灭星球级的战力。艾利欧的剧本并非单一结局，而是基于无数尝试后找到的唯一生路。"
 origin_StellaronHunter_desc:"星核猎手这次的行动也在剧本之中，前往注定的坏结局，改变宇宙的走向，战胜强大的天灾，为宇宙带来新生"
 The_StellaronHunter_start_screen_messages:0 "星核猎手这次的行动也在剧本之中，前往注定的坏结局，改变宇宙的走向，战胜强大的天灾，为宇宙带来新生"
 civic_StellaronHunter_1:"命运指引"
 civic_StellaronHunter_1_desc:"依照「命运的奴隶」艾利欧的剧本达成特定的未来节点，为了最终获得「好结局」。"
 civic_StellaronHunter_2:"光与影"
 civic_StellaronHunter_2_desc:"星核猎手和星穹列车的关系就如同光与影一样。"
 councilor_StellaronHunter_1:"剧本践行者"
 councilor_StellaronHunter_1_desc:"艾利欧剧本中的重要一环"
 councilor_StellaronHunter_2:"剧本转达者"
 councilor_StellaronHunter_2_desc:"负责转达艾利欧的剧本"
 #特质
 trait_StellaronHunter_pop_1:"格拉默残裔"
 trait_StellaronHunter_pop_1_desc:"以流萤为蓝本，重启格拉默生产线后制造的物种，充满了对未来的希望，在凝聚力和贸易生产上有高加成。"
 trait_StellaronHunter_pop_2:"长寿诅咒"
 trait_StellaronHunter_pop_2_desc:"拥有可怖的自愈能力，对他们来说，长生不是赐福，而是一种挥之不去的诅咒。漫长的寿命使他们失去了对未来的方向，同样也不再热衷于生产。"
 trait_StellaronHunter_pop_3:"骇客天赋"
 trait_StellaronHunter_pop_3_desc:"将宇宙视为游戏，有高超骇客天赋，喜欢通过骇入进行劫富济贫，能提升星球上的进阶产出，同时，使用骇客技术需要耗费大量能量币。"
 trait_StellaronHunter_pop_4:"言灵术"
 trait_StellaronHunter_pop_4_desc:"拥有语言催眠的能力，能通过言灵提高星球幸福度和星球基础产出。"
 trait_StellaronHunter_pop_5:"格拉默兵器"
 trait_StellaronHunter_pop_5_desc:"以格拉默帝国女皇为蓝本制造的基因改造克隆人战士，即格拉默铁骑，这些战士在诞生时被植入了保卫“格拉默帝国”和效忠女皇的“思想钢印”。拥有极为强大的战斗能力，与之相对的，这些战士寿命极短，同时消耗的食物和消费品很多。"
 trait_StellaronHunter_pop_6:"恶魔血脉"
 trait_StellaronHunter_pop_6_desc:"卡芙卡的故乡天衣五被星核污染，居民因缺乏恐惧概念而被欲望支配，演变为「恶魔」。"
 trait_StellaronHunter_pop_7:"传奇骇客"
 trait_StellaronHunter_pop_7_desc:"朋克洛德至今流传着传奇骇客银狼的事迹，当地人受这些事迹影响，有着很强的凝聚力。"
 trait_StellaronHunter_pop_8:"炉火淬炼"
 trait_StellaronHunter_pop_8_desc:"受刃随手点播的冶炼师，有着很高的冶炼天赋。"
 #星球
 pc_hunter_hub:"艾利欧信标"
 pc_hunter_hub_desc:"艾利欧信标是由艾利欧在星图中标记的高价值星球。"
 pc_hunter_ringworld:"星核猎手环世界"
 pc_hunter_ringworld_desc:"这颗星球经过了丰饶之力的改造，已经成为了高加成宜居环世界，有高生育加成，如今作为星核猎手管控星域的核心。"
 StellaronHunter_planet_fleet:"命运"
 NAME_StellaronHunter: "命运的奴隶"
 NAME_StellaronHunter_desc: "以艾利欧称号命名的星球，猎手组从这里出发，践行剧本。"
 NAME_StellaronHunter_adj: "命运的奴隶"
 NAME_gelamo: "格拉默母星"
 NAME_gelamo_desc: "格拉默帝国母星，如今已被虫群变成蜂巢星球。"
 NAME_StellaronHunter_system:"猎手驻地"
 NAME_innubisi:"因奴庇斯"
 NAME_tianyiwu:"天衣五"
 NAME_pengkeluode:"朋克洛德"
 NAME_atutinpushi:"阿图因普世"
 NAME_shujuemo:"数据恶魔"
 NAME_shenpanri:"审判日"
 NAME_StellaronHunter_specis:"小卡芙卡"
 NAME_gelamo_specis:"小萨姆"
 NAME_ren_specis:"小阿刃"
 NAME_yinlang_specis:"小银狼"
 NAME_yepeila_system:"耶佩拉兄弟会"
 NAME_yepeila:"耶佩拉"
 NAME_yepeila_home:"耶佩拉母星"
 NAME_yepeila_planet1:"耶佩拉被毁殖民地"
 NAME_yepeila_planet2:"耶佩拉殖民地"
 NAME_geerkangda_system:"戈尔康达世界"
 NAME_geerkangda:"戈尔康达恒星"
 NAME_geerkangda1:"戈尔康达环世界1"
 NAME_geerkangda2:"戈尔康达环世界2"
 NAME_geerkangda3:"被毁坏的戈尔康达母星"
 #区划
 district_hunter_gov:"信标基站"
 district_hunter_gov_plural:"信标基站"
 district_hunter_gov_desc:"信标基站是各星球间联络的重要基站，同时也用于转运艾利欧从其他世界线带来的资源与书籍。"
 district_hunter_gelamo:"格拉默克隆基站"
 district_hunter_gelamo_plural:"格拉默克隆基站"
 district_hunter_gelamo_desc:"格拉默克隆基站是用于克隆格拉默铁骑的基站，同时也可以用于组装机械。"
 district_hunter_kafuka:"卡芙卡领地"
 district_hunter_kafuka_plural:"卡芙卡领地"
 district_hunter_kafuka_desc:"卡芙卡领地是由卡芙卡直接监管的地区，某种意义上是猎手驻地最安全的区域，卡芙卡的小提琴和长刀都在这里保养。"
 district_hunter_yinlang:"传奇骇客街区"
 district_hunter_yinlang_plural:"传奇骇客街区"
 district_hunter_yinlang_desc:"传奇骇客街区有着大量银狼追随者，银狼也常在此分享骇客技术。"
 #特化
 zone_pc_hunter_hub:"军备节点"
 zone_pc_hunter_hub_desc:"军备节点用于生产武器和装备，快速征召士兵。"
#建筑
 building_yingxing:0 "应星雕像"
 building_yingxing_desc:0 "应星雕像是星核猎手的核心之一，他代表了刃的过去，人民常在这里追忆往昔，能大幅提供凝聚力。"
 building_kafuka_wardrobe:0 "卡芙卡的大衣橱"
 building_kafuka_wardrobe_desc:0 "卡芙卡的大衣橱为星核猎手象征之一，能极大限度增加议案的外交权重并产生影响力。"
 building_gelamo_palace:0 "格拉默女皇宫殿"
 building_gelamo_palace_desc:0 "格拉默女皇宫殿为星核猎手象征之一，现为流萤住所。"
 building_zhimasu_center:0 "芝麻酥喂养中心"
 building_zhimasu_center_desc:0 "芝麻酥喂养中心是星核猎手象征之一，用来喂养某（大肥猫），需要大量食物作为维护费。"
 building_ren_arsenal:0 "刃的武器库"
 building_ren_arsenal_desc:0 "刃的武器库是星核猎手象征之一，用来储藏刃的各种武器，需要矿物和能量币作为维护费。"
 building_kafuka_library:0 "卡芙卡图书馆"
 building_kafuka_library_desc:0 "卡芙卡图书馆收藏了星核猎手从多个世界线收集的书籍，需要合金，贸易，消费品，矿物和暗物质作为维护费。"
 building_gelamo_military_camp:0 "格拉默制造中心"
 building_gelamo_military_camp_desc:0 "格拉默制造中心可以增加领袖上限，快速促进人口增长，提升主流思潮吸引力。"
 building_hunter_ren:0 "阿刃防卫营"
 building_hunter_ren_desc:0 "刃组织的猎手常备防卫武装，可以增加海军容量上限。"
 building_hunter_hacker:0 "骇客中心"
 building_hunter_hacker_desc:0 "提供骇客岗位，产出凝聚力和贸易。"
 building_hunter_hacker_2:0 "格拉默商会"
 building_hunter_hacker_2_desc:0 "商会提供骇客岗位，可以促进贸易往来，产出凝聚力和贸易。"
 building_hunter_hacker_3:0 "以太航路规划中心"
 building_hunter_hacker_3_desc:0 "以太航路规划中心提供骇客岗位，可以促进星海贸易，产出凝聚力和贸易。"
 building_gelamo_BBQ:0 "格拉默老兵烧烤"
 building_gelamo_BBQ_desc:0 "正宗格拉默老兵烧烤，有烤虫族，烤肉，烤丰饶孽物等多样菜品，你值得拥有！"
 building_gelamo_tribunal:0 "格拉默审判庭"
 building_gelamo_tribunal_desc:0 "格拉默审判庭是格拉默文明存续期间独立于议会与军方的特殊司法监督机构，最初设立的核心目的是约束铁骑战士的作战边界、仲裁军方与议会的规则冲突，后被星核猎手发掘出相关档案并复刻，用于维护星球稳定，打击邪恶势力。"
 building_hunter_farm:0 "丰饶田地"
 building_hunter_farm_desc:0 "提供老农阿刃岗位，提升和平主义思潮吸引力，产出食物，天然气和泽洛。"
 building_hunter_farm_2:0 "倏忽种植园"
 building_hunter_farm_2_desc:0 "倏忽种植园提供老农阿刃岗位，产出食物和泽洛。"
 building_hunter_farm_3:0 "药师赐福地"
 building_hunter_farm_3_desc:0 "药师赐福地需要大量凝聚力维持，可以使星球稳定度增加，产出影响力，大量提高食物产出，但同时会增加犯罪度。"
 building_cyber_miner:0 "赛博矿工基地"
 building_cyber_miner_desc:0 "提供赛博矿工岗位，产出能量币。"
 building_cyber_miner_2:0 "赛博矿机基地"
 building_cyber_miner_2_desc:0 "提供赛博矿工岗位，增加住房和舰队指挥上限，产出能量币。"
 building_cyber_miner_3:0 "赛博解码中心"
 building_cyber_miner_3_desc:0 "提供大量赛博矿工岗位，减少殖民船食物和合金消耗，产出能量币。"
 building_gelamo_mining_station:0 "残破的格拉默矿站"
 building_gelamo_mining_station_desc:0 "残破的格拉默矿站提供格拉默采矿队岗位，能降低防御平台建造花费，加快哨站建造速度，消耗消费品，产出矿物。"
 building_gelamo_mining_station_2:0 "格拉默军用矿站"
 building_gelamo_mining_station_2_desc:0 "格拉默军用矿站提供格拉默采矿队岗位，能降低防御平台建造花费，加快哨站和星港建造速度，消耗消费品，产出矿物。"
 building_gelamo_mining_station_3:0 "格拉默行星开采中枢"
 building_gelamo_mining_station_3_desc:0 "格拉默行星开采中枢提供大量格拉默采矿队岗位，能降低防御平台建造花费，加快星港，星垒和星堡建造速度，消耗消费品，产出矿物。"
 #传统
 tradition_hunter_1:0 "逆时之匠"
 tradition_hunter_1_desc:0 "将流失于时间长河的精巧设计与命途力量结合，铸就强大战争机器的奇匠."
 tr_hunter_1_adopt:0"逆时之匠"
 tr_hunter_1_adopt_desc:0""
 tr_hunter_forward_1:0"以太编辑构件"
 tr_hunter_forward_1_desc:0"用以太编辑创造的能量转换构件，能使各舰船组件得到超限"
 tr_hunter_forward_1_tt:0"用以太编辑创造的能量转换构件，能使各舰船组件得到超限"
 tr_hunter_forward_2:0"命途武器构想"
 tr_hunter_forward_2_desc:0"通过分析多种命途力量，以及某位不知名星神的帮助，猎手组有了命途武器的初步构想和实现路径"
 tr_hunter_forward_2_tt:0"通过分析多种命途力量，以及某位不知名星神的帮助，猎手组有了命途武器的初步构想和实现路径"
 tr_hunter_forward_3:0"可持续压榨"
 tr_hunter_forward_3_desc:0"星核猎手为解决产出不足问题，翻阅了星际中各暴君的事迹，发现应当进行可持续压榨附庸，并发掘了一种新附庸方式"
 tr_hunter_forward_3_tt:0"星核猎手为解决产出不足问题，翻阅了星际中各暴君的事迹，发现应当进行可持续压榨附庸，并发掘了一种新附庸方式"
 tr_hunter_forward_4:0"新秩序"
 tr_hunter_forward_4_desc:0"凭借强力的舰船组和命途武器，星核猎手已经有了重塑星际秩序的能力"
 tr_hunter_forward_4_tt:0"凭借强力的舰船组和命途武器，星核猎手已经有了重塑星际秩序的能力"
 tr_hunter_forward_5:0"反天灾武装"
 tr_hunter_forward_5_desc:0"为了应对终将到来的天灾，在多位星神的助力下，星核猎手有了应对天灾的特定强化"
 tr_hunter_forward_5_tt:0"为了应对终将到来的天灾，在多位星神的助力下，星核猎手有了应对天灾的特定强化"
 tr_hunter_1_finish:0"终末行者"
 tr_hunter_1_finish_desc:0"你所拥有的一切已满足了终末命途的要求，你可以就此踏上终末命途"

 #决议
 decision_hunter_hub_change:0 "§R星球改造！§!"
 decision_hunter_hub_change_desc:0 "花费一些暗物质和威慑力将目前星球改造成艾利欧信标，获得高加成，但同时§R该星球上所有建筑将被清空！§!在改造前做好准备"
#议程
 council_agenda_agenda_hunter_1_name: "§B唯才是举§!"
 council_agenda_agenda_hunter_1_desc: "进行这一议程后能快速发掘领袖的潜力，并增强他们的认同感，降低相应的花费，同时开启修正：§R全力备战§!"

