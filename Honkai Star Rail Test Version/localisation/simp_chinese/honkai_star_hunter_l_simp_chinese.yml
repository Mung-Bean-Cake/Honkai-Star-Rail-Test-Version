 job_gelamo_executive_plural:0 "执行官"
 job_gelamo_executive_desc:0 "执行官是审判庭的机动战力，均为铁骑预备役成员，负责对违反规则的铁骑战士，军方人员及在猎手管控星域中违法的极端命途行者进行逮捕与羁押。"
