 cihang_research_DESC:"我们已经将敌舰「慈航」瘫痪，现在我们可以调查并获取丰饶力量进行研究，研究后可获得科技$tech_shuhu$,$tech_destroyers$,$tech_thrusters_2$,$tech_destroyer_hull_2$,$tech_destroyer_build_speed$,$tech_ship_armor_2$，并回收慈航舰。"
