 #区划
 district_hunter_gov:"信标基站"
 district_hunter_gov_plural:"信标基站"
 district_hunter_gov_desc:"信标基站是各星球间联络的重要基站，同时也用于转运艾利欧从其他世界线带来的资源与书籍。"
 district_hunter_gelamo:"格拉默克隆基站"
 district_hunter_gelamo_plural:"格拉默克隆基站"
 district_hunter_gelamo_desc:"格拉默克隆基站是用于克隆格拉默铁骑的基站，同时也可以用于组装机械。"
 district_hunter_kafuka:"卡芙卡领地"
 district_hunter_kafuka_plural:"卡芙卡领地"
 district_hunter_kafuka_desc:"卡芙卡领地是由卡芙卡直接监管的地区，某种意义上是猎手驻地最安全的区域，卡芙卡的小提琴和长刀都在这里保养。"
 district_hunter_yinlang:"传奇骇客街区"
 district_hunter_yinlang_plural:"传奇骇客街区"
 district_hunter_yinlang_desc:"传奇骇客街区有着大量银狼追随者，银狼也常在此分享骇客技术。"
 #特化
 zone_pc_hunter_hub:"军备节点"
 zone_pc_hunter_hub_desc:"军备节点用于生产武器和装备，快速征召士兵。"
#建筑
 building_hunter:0 "星核猎手首府"
 building_hunter_desc:0 "星核猎手首府，是星核猎手决策和发展的核心。"
 building_kafuka_wardrobe:0 "卡芙卡的大衣橱"
 building_kafuka_wardrobe_desc:0 "卡芙卡的大衣橱为星核猎手象征之一，能极大限度增加议案的外交权重并产生影响力。"
 building_gelamo_palace:0 "格拉默女皇宫殿"
 building_gelamo_palace_desc:0 "格拉默女皇宫殿为星核猎手象征之一，现为流萤住所。"
 building_zhimasu_center:0 "芝麻酥喂养中心"
 building_zhimasu_center_desc:0 "芝麻酥喂养中心是星核猎手象征之一，用来喂养某（大肥猫），需要大量食物作为维护费。"
 building_ren_arsenal:0 "刃的武器库"
 building_ren_arsenal_desc:0 "刃的武器库是星核猎手象征之一，用来储藏刃的各种武器，需要矿物和能量币作为维护费。"
 building_kafuka_library:0 "卡芙卡图书馆"
 building_kafuka_library_desc:0 "卡芙卡图书馆收藏了星核猎手从多个世界线收集的书籍，需要合金，贸易，消费品，矿物和暗物质作为维护费。"
 building_gelamo_military_camp:0 "格拉默制造中心"
 building_gelamo_military_camp_desc:0 "格拉默制造中心可以增加领袖上限，快速促进人口增长，提升主流思潮吸引力。"
 building_hunter_ren:0 "阿刃防卫营"
 building_hunter_ren_desc:0 "刃组织的猎手常备防卫武装，可以增加海军容量上限。"
 building_hunter_hacker:0 "骇客中心"
 building_hunter_hacker_desc:0 "提供骇客岗位，产出凝聚力和贸易。"
 building_hunter_hacker_2:0 "格拉默商会"
 building_hunter_hacker_2_desc:0 "商会提供骇客岗位，可以促进贸易往来，产出凝聚力和贸易。"
 building_hunter_hacker_3:0 "以太航路规划中心"
 building_hunter_hacker_3_desc:0 "以太航路规划中心提供骇客岗位，可以促进星海贸易，产出凝聚力和贸易。"
 building_gelamo_BBQ:0 "格拉默老兵烧烤"
 building_gelamo_BBQ_desc:0 "正宗格拉默老兵烧烤，有烤虫族，烤肉，烤丰饶孽物等多样菜品，你值得拥有！"
 building_hunter_farm:0 "丰饶田地"
 building_hunter_farm_desc:0 "提供老农阿刃岗位，提升和平主义思潮吸引力，产出食物，天然气和泽洛。"
 building_hunter_farm_2:0 "倏忽种植园"
 building_hunter_farm_2_desc:0 "倏忽种植园提供老农阿刃岗位，产出食物和泽洛。"
 building_hunter_farm_3:0 "药师赐福地"
 building_hunter_farm_3_desc:0 "药师赐福地需要大量凝聚力维持，可以使星球稳定度增加，产出影响力，大量提高食物产出，但同时会增加犯罪度。"
 building_cyber_miner:0 "赛博矿工基地"
 building_cyber_miner_desc:0 "提供赛博矿工岗位，产出能量币。"
 building_cyber_miner_2:0 "赛博矿机基地"
 building_cyber_miner_2_desc:0 "提供赛博矿工岗位，增加住房和舰队指挥上限，产出能量币。"
 building_cyber_miner_3:0 "赛博解码中心"
 building_cyber_miner_3_desc:0 "提供大量赛博矿工岗位，减少殖民船食物和合金消耗，产出能量币。"
