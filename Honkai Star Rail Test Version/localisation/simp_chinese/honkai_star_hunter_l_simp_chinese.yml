 DOT_SR_Hunter.16.title: "丰饶孽物过境！"
 DOT_SR_Hunter.16.desc: "以太航路规划中心的光屏闪了整整两昼夜，所有推演的时间线都指向同一个结局：拥有强大丰饶力量的「寿形」级丰饶舰队，将在两个标准日后跃迁进猎手星域的边境星域，届时逸散的丰饶力量会逐渐将猎手星域侵蚀为不死孽物的巢穴。我们必须在此之前将丰饶舰队击毁！星际和平公司援军正在路上，会加入战斗帮助我们对抗丰饶！"
 DOT_SR_Hunter.16.a:"冲锋！"
 DOT_SR_Hunter.16.tt:"向丰饶舰队开战"
 DOT_SR_Hunter.18.title: "寿形舰队已瘫痪！"
 DOT_SR_Hunter.18.desc: "我们已将大部分丰饶舰队击毁，主舰「寿形」已瘫痪，我们现在可以登舰拆解构造，研究丰饶力量为我们所用了！"
