 DOT_SR_Hunter.24.title: "警报！警报！格拉默母星内出现大量虫群"
 DOT_SR_Hunter.24.desc: "随着警报而来的是一份格拉默语文件，上面指出处理完虫群后，登陆星球破解审判庭残留的信息遮蔽系统，再沿着残骸长河的能量信号可定位散落的残破格拉默矿站。格拉默军用矿站大多位于行星地下矿脉深处，需突破残留的审判庭执行官防御序列，或持有格拉默铁骑的身份铭牌才能解锁权限。格拉默行星开采中枢需集齐三个军用矿站的密钥碎片开启入口。"
 DOT_SR_Hunter.24.a:"§R迎战虫群舰队！§!"
