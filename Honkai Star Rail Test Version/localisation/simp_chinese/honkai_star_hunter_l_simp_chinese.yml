 job_gelamo_griller_desc:0 "格拉默老兵制作的烧烤有很多奇效，能提升武灾威慑力，增加爆炸武器伤害，减少舰载机冷却等，但相应的，由于威慑过大，需要花费影响力安抚民众。"
