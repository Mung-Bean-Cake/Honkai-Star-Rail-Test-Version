 tech_hacker_skill_desc:0 "受过基本教育的骇客已领会了骇客基本素养。现在，他们在银狼的指引下不断深造，同时劫富济贫为你创造价值。"
 tech_hacker_1:0 "文明贸易通路"
 tech_hacker_1_desc:0 "这是原先星际文明间较为安全的贸易通路，在经历了长久战争的损毁后，被格拉默商会打通，我们将通过商业增强实力，应对天灾。"
 tech_hacker_2:0 "泛星际贸易通路"
 tech_hacker_2_desc:0 "为避免文明贸易通路再次因为战争损毁，我们联合多个星际势力共同修筑了新的泛星际贸易通路，并配合以太航路规划中心进行使用，我们和其他文明的联系也更加紧密。"
 tech_BBQ:0 "格拉默传统美食烹饪"
 tech_BBQ_desc:0 "由流萤传授的格拉默传统美食烹饪技巧，传授并推广需要一些时间。"
 tech_shuhu:0 "魔阴身病例研究"
 tech_shuhu_desc:0 "通过对魔阴身病例进行研究，我们能将部分有丰饶之力的病变血肉种植到田中，从而提高食物产出。"
 tech_shuhu_1:0 "倏忽血肉研究"
 tech_shuhu_1_desc:0 "对阿刃身上残余的倏忽血肉进行研究，从而更好抑制倏忽并发掘提高食物产出的方法。"
 tech_shuhu_2:0 "药师赐福研究"
 tech_shuhu_2_desc:0 "对受到药师赐福的倏忽血肉进行研究，从而利用药师赐福的部分力量，由于研究中部分研究人员被污染，导致犯罪度上升。"
 tech_cyber_skill:0 "赛博矿工素养"
 tech_cyber_skill_desc:0 "掌握赛博矿工素养后，能够提高能量币产出并降低陆军能量币消耗"
 tech_yitai_data_1:0 "以太编辑初步"
 tech_yitai_data_1_desc:0 "银狼以太编辑的初步利用，能够增加能量武器伤害并提高能量币产出"
 tech_yitai_data_2:0 "以太数据演算"
 tech_yitai_data_2_desc:0 "赛博矿工们根据以太编辑的进一步研究成果，能够将其他世界线的空间站容量挪移过来使用"
 tech_gelamo_palace:0 "格拉默古建筑分析"
 tech_gelamo_palace_desc:0 "通过格拉默古建筑分析，我们如今已有能力复刻格拉默女皇宫殿了，我们将建造该建筑作为领袖流萤的家。"
 tech_gelamo_judgement:0 "格拉默火种存储研究"
 tech_gelamo_judgement_desc:0 "通过对审判庭开发的信息存储设备（火种）的研究我们逐渐掌握了将铁骑战士的全部意识、战斗数据与基因信息压缩存储在一块掌心大小的晶体中的技术。"
 tech_gelamo_mining:0 "格拉默初级开采权限"
 tech_gelamo_mining_desc:0 "拥有该权限可使用残破的格拉默矿站。"
 tech_gelamo_mining_1:0 "格拉默连携军备协议"
 tech_gelamo_mining_1_desc:0 "持印有该协议的晶体通行证可获得格拉默军用矿站的掌控权。"
 tech_gelamo_mining_2:0 "格拉默同频接口"
 tech_gelamo_mining_2_desc:0 "使用该接口可以启动格拉默行星开采中枢并掌管部分格拉默星域的防卫系统。"
 tech_yitai_coding:0 "以太编辑构件"
 tech_yitai_coding_desc:0 "使用以太编辑构件可以使原本的舰船组件得到超限爆发，通过这一构件，我们研制出了新一代舰船组件。"
 tech_path_components_zhongmo:0 "「终末」命途武器研发册"
 tech_path_components_zhongmo_desc:0 "通过分析多种命途力量，以及某位不知名星神的帮助，猎手组有了部分「终末」命途武器的制造与使用权限。"
#常规事件
 DOT_SR_Hunter.3.title: "§G开始星球改造!§!"
 DOT_SR_Hunter.4.title:"阿哈赠礼"
 DOT_SR_Hunter.4.desc:"阿哈听闻你想要对抗天灾，拯救宇宙，觉得很有乐子，便带了点礼物送给你。"
 DOT_SR_Hunter.4.a:"接受阿哈的礼物"
 DOT_SR_Hunter.4.tt:"阿哈送东西？绝对是最大的乐子了！"
 DOT_SR_Hunter.4.b:"拒绝阿哈的礼物"
 DOT_SR_Hunter.4.th:"阿哈绝对没安好心！"
 hunter_discover_situation_chain_title: "格拉默古迹探索行动"
 hunter_discover_situation_chain_desc: "根据艾利欧的命运剧本指引，星核猎手于2200年定位到已毁灭的格拉默文明残骸区——此处残留的审判庭及格拉默女皇宫殿的科技是对抗天灾的关键伏笔。格拉默文明曾以铁骑战士为核心战力对抗虫灾，其审判庭留存的火种存储技术，可有效解决星核适配过程中的意识消融风险，同时为批量培育对抗天灾舰队的战力提供技术支撑。本次行动核心目标为获取封存的格拉默古籍，取得格拉默铁骑的培育方法，同时验证集群意识对舰队战力的增强效果，通过残余的繁育力量进行实验，为后续针对天灾的布局铺垫基础。"
 hunter_discover_situation_1:"格拉默北区调查"
 hunter_discover_situation_1_DESC:"我们需要花费一些时间进行格拉默北区调查，并剖析其中科技"
 hunter_discover_situation_2:"格拉默南区调查"
 hunter_discover_situation_2_DESC:"我们需要花费一些时间进行格拉默南区调查，并剖析其中科技"
 hunter_discover_situation_3:"格拉默主城区调查"
 hunter_discover_situation_3_DESC:"我们需要花费一些时间进行格拉默主城区调查，并剖析格拉默女皇宫殿的图纸及科技"
 DOT_SR_Hunter.10.title: "行动日志日志编号：SH-GL-001"
 DOT_SR_Hunter.10.desc: "记录人：银狼   任务阶段：古迹定位   已突破格拉默残骸区的外层空间封锁，这里的辐射指数比朋克洛德的防火墙还让人头疼，花了十七分钟才破解审判庭残留的信息遮蔽系统。艾利欧的坐标没错，残骸长河深处确实有稳定的能量反应，应该就是火种存储舱的信号。卡芙卡已经提前去探路了，刃在舰船上待命——毕竟他那把剑砍古迹比拆防火墙还快，要是不小心把存储舱劈碎了，艾利欧的剧本怕是要直接重写。哦对，刚才扫到了几个流浪的审判庭执行官信号，暂时没惊动他们，反正他们找的是格拉默遗民，和我们的目标不冲突。在残骸核心区找到了诸多破损的火种存储舱。可以将这些带回猎手总部进行拆解研究后复刻原本的格拉默制造中心。我已经把审判庭的所有技术档案同步到了组织数据库。"
 DOT_SR_Hunter.10.a:"已阅"
 DOT_SR_Hunter.10.tt:"已完成科技研究：$tech_gelamo_judgement$,$tech_housing_1$"
 DOT_SR_Hunter.11.title: "日志编号：SH-GL-002"
 DOT_SR_Hunter.11.desc: "记录人：卡芙卡   任务阶段：火种回收   穿过了这些火种存储仓后，又走了几公里后，我们来到了南区，也就是居民区。诶，等等，这是什么？格拉默格拉默传统美食烹饪？用离子炮做烧烤？看来确实是格拉默的风格。"
 DOT_SR_Hunter.11.a:"已阅"
 DOT_SR_Hunter.11.tt:"已完成科技研究：$tech_BBQ$,$tech_mining_1$"
 DOT_SR_Hunter.12.title: "日志编号：SH-GL-003"
 DOT_SR_Hunter.12.desc: "记录人：艾利欧   任务阶段：核心回收   我们终于见到了格拉默女皇宫殿的遗址，虽然经历了格拉默内乱和虫灾的啃食，但是宫殿核心损毁不算严重，相关资料应该也在核心里的备份资料库内。格拉默残骸区的坐标已经同步给星际和平公司，他们会来处理后续的虫灾残留。本次获取的格拉默火种存储仓及格拉默制造中心相关科技，可以用于将格拉默基因克隆为格拉默铁骑作为储备战力。格拉姆女皇宫殿的建造图纸及相关科技，可用于实验集群意识相关运用。格拉默传统美食烹饪指南，可以用于将克隆出的格拉姆老兵作为厨师解决食物短缺问题。这次行动只是我们备战天灾的开始，相信在之后的探索中，我们能获得更多有用的科技助力我们对抗天灾，阻止四末的到来。"
 DOT_SR_Hunter.12.a:"已阅"
 DOT_SR_Hunter.12.tt:"已完成科技研究：$tech_gelamo_palace$,$tech_housing_2$,$tech_mass_drivers_1$"
 DOT_SR_Hunter.13.title: "分享骇客中心"
 DOT_SR_Hunter.13.desc: "骇客中心是银狼专属的工作领地。整座空间以朋克洛德风格的霓虹像素为核心装饰，墙面上流动着半透明的代码流，操作台嵌入了从全宇宙搜集来的古董游戏机组件，银狼常把这里调侃成自己出了新手村后的“高端游戏房”。\n三年前，为了潜入星际和平公司的核心数据库窃取星核分布坐标，银狼在骇客中心与天才俱乐部的螺丝咕姆展开了长达72小时的数据攻防战，双方来回破解对方的防火墙超过四百次，最终银狼用一个伪装成游戏更新包的病毒攻破了最后一道防线，这场对决至今仍是骇客界口耳相传的传奇。如今银狼将骇客中心的结构分享了出来，希望建造更多类似的骇客中心，作为培养新生代骇客的场所，同时也为解决领地贸易短缺问题。"
 DOT_SR_Hunter.13.a:"向银狼致敬"
 DOT_SR_Hunter.13.tt:"已获得研究选项：$tech_hacker_skill$"
 DOT_SR_Hunter.14.title: "格拉默商会权限开放"
 DOT_SR_Hunter.14.desc: "这座商会是星核猎手母星上最热闹的地表建筑，其根源能追溯到早已覆灭的格拉默帝国——当年帝国崩溃前，末代皇室将所有的星际贸易网络、稀有物资储备清单都托付给了当时的暗线联络人，这份传承辗转落入星核猎手手中后，就发展成了如今横跨大半个银河的格拉默商会。商会的主楼保留着格拉默帝国标志性的穹顶浮雕，墙面上刻着帝国全盛时期的星际航线图，如今这里既是全银河自由商人的交易枢纽，也是星核猎手搜集情报、置换行动物资的核心站点。\n百年前格拉默帝国的残余贵族曾组团来到这颗星球，想要收回商会的所有权，卡芙卡没有动武，只是带着他们走完了整个交易市场，看着无数来自不同文明的商人靠着商会的网络摆脱了星际和平公司的垄断压榨，贵族们最终主动摘下了随身的帝国皇室徽章，留在商会里当了藏品管理员。如今经格拉默后裔与猎手组一致同意，将该建筑的建造权限开放，我们可以研究相关构造并建造格拉默商会分部来增加贸易产出了。"
 DOT_SR_Hunter.14.a:"向格拉默后裔致敬"
 DOT_SR_Hunter.14.tt:"已获得研究选项：$tech_hacker_1$"
 DOT_SR_Hunter.15.title: "以太航路规划中心研发说明"
 DOT_SR_Hunter.15.desc: "已有的格拉默商会已不能满足我们对外的贸易和外交需求，我们迫切需要一个新建筑来规划我们的航路，并作为对外的新窗口。以太航路规划中心应运而生。\n这座建筑所设计的整体结构由无数晶体拼接而成，从地表望去像一块悬在天际的半透明星环。它的核心系统由银狼用以太编辑技术搭建，能同时演算上万条跨星系航线的安全概率，所有星核猎手的出任务航线、星际商队的通行路径都要在这里完成最终校准，选择星神的意识盲区和避开公司的巡逻封锁线。"
 DOT_SR_Hunter.15.a:"向银狼致敬"
 DOT_SR_Hunter.15.tt:"已获得研究选项：$tech_hacker_2$"
 gelamo_discover_chain_title: "格拉默母星探索行动"
 gelamo_discover_chain_desc: "由于星核猎手在矿业方面缺乏部分关键科技，无法快速获得资源，因此我们需要对格拉默母星进行探索行动来获取采矿相关科技。"
 gelamo_discovery_1: "格拉默母星外围调查"
 gelamo_discovery_1.title: "格拉默母星外围调查"
 gelamo_discovery_1_DESC:"我们需要花费一些时间对格拉默母星进行初步调查，进而确认安全的登陆地点"
 gelamo_discovery_2: "格拉默地表调查"
 gelamo_discovery_2.title: "格拉默地表调查"
 gelamo_discovery_2_DESC:"我们需要花费一些时间进行格拉默地表调查，找寻格拉默母星的矿业遗迹"
 gelamo_discovery_3: "集结舰队，准备预防虫巢暴动"
 gelamo_discovery_3.title: "集结舰队，准备预防虫巢暴动"
 gelamo_discovery_3_DESC:"探索队在星球表面发现了大量虫巢，且他们快要苏醒了，探险队已紧急撤离，并传回讯息，请求我们集结舰队进行防御。"
 gelamo_discovery_4: "探索格拉默母星"
 gelamo_discovery_4.title: "肃清虫群后，可以开始探索格拉默母星"
 gelamo_discovery_4_DESC:"肃清虫群后，可以派遣一支探险队深入格拉默母星上的矿站遗迹，获取相关科技。"
 DOT_SR_Hunter.22.title: "我们根据星球表层格拉默帝国留下的铁卫档案中解读出如下信息："
 DOT_SR_Hunter.22.desc: "寰宇蝗灾爆发后，格拉默核心星系的能源需求陡增，帝国以格拉默行星开采中枢为核心，在阿斯德纳星系各资源星铺开矿站网络，其中民用矿站逐步改造为残破的格拉默矿站，专供流民与预备役开采基础矿产；军用级别的格拉默军用矿站则由铁骑军团直接驻守，专门开采锻造铁骑铠甲、制造舰队舰炮所需的稀有矿料。虫灾入侵时，格拉默高层做出决断：所有矿站自毁核心数据链路，仅保留火种存储模块与矿产提炼核心，依托审判庭的火种技术封存矿业人才的意识数据，确保即使星球沦陷，未来反攻时仍能快速重启矿业生产线。这些设施在虫灾啃食、格拉默内乱的双重冲击下大多沦为废墟，仅残余的能量信号还在残骸区内断续发送。"
 DOT_SR_Hunter.22.a:"已阅"
 DOT_SR_Hunter.22.tt:"已完成科技研究：$tech_gelamo_mining$,$tech_mass_drivers_2$"
 DOT_SR_Hunter.23.title: "我们在格拉默母星上的建筑残骸中发现了相关建筑说明："
 DOT_SR_Hunter.23.desc: "残破的格拉默矿站：保留了基础的半自动化开采模块与应急护盾发生器，其储存的低烈度能量晶体可直接为小型舰船供能，内置的流民生存日志还记录了早期虫灾入侵的第一手观测数据。格拉默军用矿站：配备了和审判庭信息遮蔽系统同源的隐蔽模块，可规避虫群信息素的探测；其独有的高压提炼技术能将稀有矿料的纯度提升37%，是格拉默铁骑武器锻造的核心技术支撑。格拉默行星开采中枢：内置完整的火种存储阵列，封存了数千名顶级矿业工程师与军工专家的意识数据，可直接对接格拉默制造中心，实现“开采-提炼-军工生产”的全链路无人化运作。"
 DOT_SR_Hunter.23.a:"已阅"
 DOT_SR_Hunter.23.tt:"已完成科技研究：$tech_gelamo_mining_1$,$tech_mining_2$"
 DOT_SR_Hunter.25.title: "已肃清虫群，开始探索格拉默母星"
 DOT_SR_Hunter.25.desc: "我们已肃清格拉默母星表层虫群，现在可以派遣一支探险队深入格拉默母星上的矿站遗迹，获取相关科技。"
 DOT_SR_Hunter.25.a:"§G继续探索事件§!"
 DOT_SR_Hunter.26.title: "探索结束"
 DOT_SR_Hunter.26.desc: "本次探索圆满结束，相关探索人员已返程。已完成科技研究：$tech_gelamo_mining_2$,$tech_strike_craft_2$,$tech_starbase_2$,$tech_missiles_2$,$tech_missiles_3$"
 DOT_SR_Hunter.26.a:"已阅"
 DOT_SR_Hunter.27.title: "阿哈说：“真有乐子”"
 DOT_SR_Hunter.27.desc: "阿哈在巨构快建造完的时候制造了一个大————爆炸，成功让你的巨构化为乌有，并狠狠嘲笑了你。"
 DOT_SR_Hunter.27.a:"可恶的乐子神！"
 DOT_SR_Hunter.28.title: "阿哈说：“又有新乐子了”"
 DOT_SR_Hunter.28.desc: "阿哈在你的巨构快建造完的时候又双叒叕制造了一个大————爆炸，成功让你的巨构化为乌有，并狠狠嘲笑了你。"
 DOT_SR_Hunter.28.a:"阿哈！————"
 DOT_SR_Hunter.30.title: "银狼的游戏机挑战"
 DOT_SR_Hunter.30.desc: "赛博矿工基地有半自动化开采模块与应急护盾系统作为伪装，内部实际增设了星舰停靠平台、入侵设备改装车间与意识同步训练端口，受训骇客只需上传意识即可进入拟真矿场环境，24小时不间断练习隐蔽渗透、节点控制等实操技能，训练产出的“虚拟能源晶体”会直接同步到星穹列车的模拟防御系统，用于升级组织的防火墙体系。基地外围由残破的采矿机甲组成防御阵线，隐蔽性极强，是星核猎手重要的初级骇客实训与补给站点。银狼邀请你进行一场游戏挑战，你赢了，她就会把赛博矿工基地的建造权限共享给你，如果你输了，那你就一无所有。"
 DOT_SR_Hunter.30.a:"优势在我！"
 DOT_SR_Hunter.30.tt:"（你有20%可能成功，80%可能失败）"
 DOT_SR_Hunter.30.b:"我没钱了，我还要攒钱去抽流萤"
 DOT_SR_Hunter.30.th:"不参与游戏挑战"
 DOT_SR_Hunter.31.title: "大获全胜"
 DOT_SR_Hunter.31.desc: "你成功在游戏挑战中击败了银狼，即使她偷偷动用了卡带有没有打赢你，她在地上又哭又闹。已获得研究选项：$tech_cyber_skill$"
 DOT_SR_Hunter.31.a:"银狼你怎么又哭又闹！"
 DOT_SR_Hunter.32.title: "惨败而归"
 DOT_SR_Hunter.32.desc: "你输给了银狼，她把从你这赢来的能量币拿去冲了月卡。不过，她偷偷动用卡带的事被艾利欧发现了，她被关禁闭了"
 DOT_SR_Hunter.32.a:"银狼你也有今天！"
 DOT_SR_Hunter.33.title: "银狼的礼物"
 DOT_SR_Hunter.33.desc: "赛博矿机植入了审判庭的信息遮蔽模块，可模拟虫群信息素探测下的隐蔽作战环境，搭载的“量子钻头”实际是定制化的渗透测试程序，能模拟穿透300层厚的虚拟防火墙，攻破靶场核心节点的效率比普通训练设备高出42%；内置的自毁程序可在训练过程中出现意识反入侵风险时切断神经连接，保护受训人员的意识安全，是训练中级骇客突破高权限加密系统的核心实训装置。银狼将赛博矿机的图纸共享给你作为礼物。"
 DOT_SR_Hunter.33.a:"已获得研究选项：$tech_yitai_data_1$"
 DOT_SR_Hunter.34.title: "银狼的游戏机挑战"
 DOT_SR_Hunter.34.desc: "赛博解码中心内置完整的顶级骇客意识存储阵列，可快速模拟审判庭遗留的加密权限、虫群信息素密码与星核封印三类顶级破解场景。中心核心绑定了卡芙卡的生物密钥，是唯一能模拟铁骑培育技术完整权限攻防、解析星核能量波动规律的训练设备，同时承担着星核猎手跨星系通讯的加密中转功能，是组织考核顶尖骇客、策划跨星系渗透行动的指挥核心。在上次输给你后，银狼不服气，于是又邀请你进行一场游戏挑战，你赢了，她就会把赛博解码中心的建造权限共享给你，如果你输了，那你就一无所有。"
 DOT_SR_Hunter.34.a:"优势在我！"
 DOT_SR_Hunter.34.tt:"（你有30%可能成功，70%可能失败）"
 DOT_SR_Hunter.34.b:"我没钱了，我还要攒钱去抽卡妈"
 DOT_SR_Hunter.34.th:"不参与游戏挑战"
 DOT_SR_Hunter.35.title: "大获全胜"
 DOT_SR_Hunter.35.desc: "你成功在游戏挑战中击败了银狼，即使她偷偷动用了卡带有没有打赢你，同时因为偷跑卡带被艾利欧发现，把她关了禁闭。银狼在地上又哭又闹。已获得研究选项：$tech_yitai_data_2$"
 DOT_SR_Hunter.35.a:"银狼你怎么又哭又闹！"
 DOT_SR_Hunter.36.title: "惨败而归"
 DOT_SR_Hunter.36.desc: "你输给了银狼，她把从你这赢来的能量币和消费品拿去换了新显卡。不过，她偷偷动用卡带的事被艾利欧发现了，她被关禁闭了"
 DOT_SR_Hunter.36.a:"银狼你也有今天！"
 DOT_SR_Hunter.37.title: "卡芙卡图书馆权限开放"
 DOT_SR_Hunter.37.desc: "这里收藏了大量军工技术图谱、星神观测记录、寰宇蝗灾的应对预案。内置的神经同步阅览系统可以直接对接意识体，无需翻阅实体卷宗即可调取全部资料，如今卡芙卡将这个图书馆的权限对我们开放。"
 DOT_SR_Hunter.37.a:"卡妈万岁！"
#战斗事件
 fengrao_cihang_title: "丰饶孽物过境事件"
 fengrao_cihang_desc: "铲除过境的丰饶孽物"
 DOT_SR_Hunter.5.title: "丰饶孽物过境！"
 DOT_SR_Hunter.5.desc: "以太航路规划中心的光屏闪了整整一昼夜，所有推演的时间线都指向同一个结局：运载着大量丰饶孽物的「慈航」级丰饶舰队，将在一个标准日后跃迁进猎手星域的边境星域，届时逸散的丰饶力量会逐渐将整颗殖民星侵蚀为不死孽物的巢穴。我们必须在此之前将丰饶舰队击毁！"
 DOT_SR_Hunter.5.a:"冲锋！"
 DOT_SR_Hunter.5.tt:"向丰饶舰队开战"
 DOT_SR_Hunter.7.title: "丰饶舰队已瘫痪！"
 DOT_SR_Hunter.7.desc: "我们已将大部分丰饶舰队击毁，主舰「慈航」已瘫痪，我们现在可以登舰拆解构造，研究丰饶力量为我们所用了！"
 DOT_SR_Hunter.7.a:"登上「慈航」"
