 taiker_planet:"泰科铵大球馆"
 taiker_planet_desc:"球馆内外人声鼎沸，彩旗展动…激动人心的机动球竞技比赛将在万众瞩目中盛大开幕。\n泰科铵大球馆的标准赛道通常为金属结构外覆光滑混凝土与原木地板。为了让场内观众清晰观赛，大量透明聚碳酸酯材料被投入球馆，战况一览无余。"
 ipc_2_planet:"星际和平娱乐总部"
 ipc_2_planet_desc:"这座打造过无数巨星的传媒之都，以极高的工业化水准向寰宇放送各类娱乐产品。"
 ipc_8_planet:"污染重重的工业中心"
 ipc_8_planet_desc:"这里的工业中心，但是这里的环境无比糟糕，并且当地的文化建构在一端虚假的历史上"
 ipc_start_modifiers:"补偿修正"
 ipc_start_modifiers_desc:"补偿内阁debuff"
 ipc_npc_effect:"古弁才天国的协议"
 ipc_npc_effect_desc:"古弁才天国的难民与公司达成的协议，公司愿意提供帮助，代价是牺牲外交权和军事自主权"
 ipc_shengyanyuan:"寰宇生研院"
 ipc_shengyanyuan_desc:"生命科学研究院的核心区域，研究员如同神经网络中的节点，不断在工业化流程中产出灵感与回馈。"
 ipc_buff_1:"二相乐园的完美投资"
 ipc_buff_1_desc:"如今的二相乐园已经走向正轨，在我们的长期改造之下，二相乐园已经成为公司在宇宙中传播娱乐文化的最大中心之一和最忠心的附属。"
