 situation_cunhu_support_team: "§H琥珀王后援队§!"
 situation_cunhu_support_team_type: "§H琥珀王后援队§!"
 situation_cunhu_support_team_desc: "交付日期为§Y[owner.situation_cunhu_support_team_timer]§!\n[owner.Getcunhu_support_team_use]\n当前的产出目标为：§Y[Owner.cunhu_support_team_once_again]§!\n当前的库存为：§Y[Owner.cunhu_support_team_current_amount]§!\n[Owner.Getcunhu_support_teamstatus]\n筑材物流部是星际和平公司历史最悠久的部门,它的前身是「琥珀王后援队」,在路易斯崛起后进行了改组。 现任部门主管是大腹便便的塔拉梵·基恩——公司少数被证实的「存护」令使,七人董事会的一员。他担负起向克里珀运送筑材这一神圣的任务,地位愈加稳固。最开始，他们只是简单的以物易物，但是随着这伙人里面出现了几个有商业头脑的聪明人，他们开始使用信息差来使自己的商品涨价，最终买到更多材料。他们的生意越做越大，最终他们发行了信用点，并成立了星际和平公司。不过直到今天，他们还是会把一堆又一堆的材料送到克里珀身边，但是祂从来没有使用过就是了。\n§P「囤积居奇？这个词令人生厌。我管它叫价高者得。出不起价格不是我的问题，是你的问题。」§!"
