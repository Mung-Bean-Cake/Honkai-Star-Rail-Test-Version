 hsr_planet_policy_1_level:"[Root.Get_hsr_planet_policy_1]"
 hsr_planet_policy_2_level:"[Root.Get_hsr_planet_policy_2]"
 hsr_planet_policy_3_level:"[Root.Get_hsr_planet_policy_3]"
 hsr_planet_policy_4_level:"[Root.Get_hsr_planet_policy_4]"
 hsr_planet_policy_1_1:"§C扩大行政预算§!"
 hsr_planet_policy_1_1_desc:"扩大地方行政机构的预算与人员编制，使政府能够更有效地处理人口管理、公共事务与政策执行。更庞大的行政体系能够维持社会秩序，但也意味着地方财政需要承担更高的长期行政成本。"
 hsr_planet_policy_1_2:"§C治安整顿§!"
 hsr_planet_policy_1_2_desc:0 "集中调配执法与治安资源，对地下组织、非法经济活动以及高犯罪区域展开阶段性整顿。高强度的执法行动能够迅速改善治安状况，但这种非常规措施并不适合长期维持。"
 hsr_planet_policy_1_3:"§C行政数字化§!"
 hsr_planet_policy_1_3_desc:0 "建设统一的数字化行政、财政和公共服务系统，将分散的地方管理机构接入同一套数据网络。自动化的审批、统计与财政管理能够减少行政摩擦，并提高公共投资的执行效率。"
 hsr_planet_policy_1_4:"§C反腐调查§!"
 hsr_planet_policy_1_4_desc:0 "成立专项调查机构，对地方财政、公共采购和行政机构展开全面审查。调查本身需要投入大量资源，但清理利益输送与隐性财政漏洞有助于恢复地方政府的财政纪律。"
 hsr_planet_policy_1_5:"§C财政审计§!"
 hsr_planet_policy_1_5_desc:0 "增加公共安全设施、社区巡查和应急部门的投入，以建立更加稳定的常态化社会治安体系。相比短期整顿，这一计划更强调长期预防与基层治理。"
 hsr_planet_policy_2_1:"§G食品补贴§!"
 hsr_planet_policy_2_1_desc:0 "充足且可靠的食品供应能够改善居民生活预期，并为人口增长创造更加有利的条件。"
 hsr_planet_policy_2_2:"§G公共医疗§!"
 hsr_planet_policy_2_2_desc:0 "扩大公共医疗体系的覆盖范围，为居民提供基础医疗、疾病预防和生育保障。更加完善的医疗服务能够减少人口损耗，并改善殖民地长期的人口发展环境。"
 hsr_planet_policy_2_3:"§G公共住房§!"
 hsr_planet_policy_2_3_desc:0 "由地方财政投资建设保障住房、新型居住区及其配套设施，以缓解快速城市化造成的住房压力。充足的居住空间也将提高殖民地对外来人口的吸引力。"
 hsr_planet_policy_2_4:"§G教育补贴§!"
 hsr_planet_policy_2_4_desc:0 "通过教育补贴、职业培训和高等教育投资，提高地方人口的专业技能和知识水平。稳定的教育投入能够为科研、工业和行政体系持续提供更加高效的专业人才。"
 hsr_planet_policy_2_5:"§G生育鼓励§!"
 hsr_planet_policy_2_5_desc:0 "通过生育津贴、家庭补助和育儿支持计划鼓励居民扩大家庭规模。政策能够显著促进人口增长，但持续性的补贴也会给地方财政带来较高的长期负担。"
 hsr_planet_policy_3_1:"§H基础工业设施投资§!"
 hsr_planet_policy_3_1_desc:0 "将地方财政集中投入能源网络、矿产、交通设施、通信系统以及基础施工能力，为后续的城市与工业扩张建立更加完善的基础条件。"
 hsr_planet_policy_3_2:"§H重工业补贴§!"
 hsr_planet_policy_3_2_desc:0 "向制造业、冶金产业和消费品生产部门提供投资补贴与设备更新资金，以扩大生产规模并提高工业体系的整体效率。"
 hsr_planet_policy_3_3:"§H高精尖产业投资§!"
 hsr_planet_policy_3_3_desc:0 "投资新的科技园区，逐步扩大科技水平"
 hsr_planet_policy_3_4:"§H商贸旅游圣地§!"
 hsr_planet_policy_3_4_desc:0 "将这里改造成旅游圣地，吸引广大异星游客前来消费"
 hsr_planet_policy_3_5:"§H物流网络§!"
 hsr_planet_policy_3_5_desc:0 "利用自动化设备、生物技术和现代农业管理体系改造传统农业部门，在有限土地和劳动力条件下获得更高的食品产出。"
 hsr_planet_policy_4_1:"§R建立地方民兵§!"
 hsr_planet_policy_4_1_desc:0 "以当地人口为基础建立地方民兵和预备役体系，在不长期维持大规模正规军的情况下，为殖民地保留一支能够在战争爆发时迅速投入防御的武装力量。"
 hsr_planet_policy_4_2:"§R地下防御工程§!"
 hsr_planet_policy_4_2_desc:0 "建设地下指挥所、人员掩体、物资仓库以及分散式防御设施，以减少轨道轰炸和大规模攻击对殖民地基础设施与人口造成的破坏。"
 hsr_planet_policy_4_3:"§R建立地方指挥中心§!"
 hsr_planet_policy_4_3_desc:0 "建立地方军械库和军事物资保障体系，为防御军与民兵提供充足的武器、装备和后勤支持，从而提高地方武装的持续战斗能力和士气。"
 hsr_planet_policy_4_4:"§R训练地方护卫舰队§!"
 hsr_planet_policy_4_4_desc:0 "我们将利用地方的工业能力来组建地方护卫舰队"
 hsr_planet_policy_4_5:"§R意外情况防御计划§!"
 hsr_planet_policy_4_5_desc:0 "设计紧急动员程序，将地方预备役、警备力量和部分适龄人口迅速编入防卫部队，应对紧急情况。"
