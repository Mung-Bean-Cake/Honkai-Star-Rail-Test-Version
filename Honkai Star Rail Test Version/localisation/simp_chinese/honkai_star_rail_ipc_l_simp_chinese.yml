 #事件
 hsr_ipc.2012.name:"运输完成"
 hsr_ipc.2012.desc:"随着亚空间传送门的打开，大批装运着筑材物资的舰船穿过传送门来到克里珀筑墙之地，在巨大无比的星河障壁和星神周边，我们的舰队犹如蚂蚁搬家一般运行在其中。伟大的星神仍专注的敲打的障壁，丝毫不在意身边堆积如山的材料..."
 hsr_ipc.2012.a:"再接再厉！"
 hsr_ipc.2013.name:"材料收集不足"
 hsr_ipc.2013.desc:"我们没有收集到足够的材料！这是整个公司的耻辱，我们需要重新调整计划"
 hsr_ipc.2020.title:"「诸世界重建计划·哈托彼亚」"
 hsr_ipc.2020.desc:"哈托彼亚，一颗位于失魂星域的天体。传闻久远的过去，「欢愉」星神阿哈曾创造一轮有生命的幻月，令其成为愚者与伶人演出的舞台，建立起包括古弁才天国在内的众多文明。每当幻月满盈时，一场以谒神为名的「幻月游戏」也将如期开始。胜者将承蒙星神垂迹，领受那星神垂赐的「欢愉」权能。\n琥珀纪2148纪，「毁灭」的军锋席卷失魂星域，将众多世界化为白地——此处也不能幸免。危局之下，当地幸存者分成了四派：投敌派、顽抗派、撤离派、求援派。在画师「绘世」的带领下，最初的幻造种与人并肩，共同抵御界外天魔。战争的最后，顽抗派的绘世利用古老的幻月游戏将整个古弁才天国从现实世界隐去，一并藏进二维的「画中世界」。\n琥珀历2155纪，一艘逃离古弁才天国的飞船幸运地抵达了新伦蒂尼恩——星际和平公司旗下的工业星球。船长向当地总督描绘了家乡的存在与困境，后者立刻产生了浓厚的兴趣，遂上报至市场开拓部总部。琥珀历2156年，在市场开拓部主管奥斯瓦尔多·施耐德(传言中他曾在年轻时赢得幻月游戏)的授意下，哈托彼亚被纳入第三期「诸世界重建计划」。\n公司利用来自朋克洛德的以太编辑技术，将其中的画中世界重新打捞出来，现代意义上的「二相乐园」登上历史舞台。对于这脆弱的文明，以及公司的重要资产，先将其拉回发展的正轨才是首要之务。按照当前的情况我们已经为他们拟定好重建方案，只需要实时即可。"
 hsr_ipc.2020.a:"我们当然会帮助他们重建家园的，"
 hsr_ipc.2021.title:"市场开拓部派遣人员"
 hsr_ipc.2021.desc:"在市场开拓部主管奥斯瓦尔多·施耐德的授意下，其部门的部分人员开始携带器件物资大规模入驻哈托彼亚。按照计划，这些专业人员将帮助恢复哈托彼亚的生产，治安，消除残余的入画影响，随行的技术研发部分人员将提供技术支持，监视哈托彼亚的稳定情况。随着第一批舰队在星球表面着陆，首席执行官麦斯威尔·格兰特亲自迎接慰问他们，不管怎么说，一次长远的投资开始了。"
 hsr_ipc.2021.a:"结果会怎样呢..."
 hsr_ipc.2022.title:"8-bit像素飞机大战"
 hsr_ipc.2022.desc:"“报告，我们发现了一处坍缩不稳定的区域，在二维市的主干街区，覆盖范围超过一个商店门铺，配备的修复武器已经无法修补复原了，请求支援。”“收到，请封锁目标区域，疏散群众，我们马上到达目标地点。”从踏上这片土地进行修补工作开始，奥斯特觉得这里的一切都有种不真实感，他曾在泰科铵工作过很长时间，对于这种充满娱乐气息的世界早已司空见惯，但哈托彼亚却给了他不一样的梦幻感。”这种世界我以为只存在小时候的漫画书中，没想到还真有存在的...什么？需要我驾驶像素飞机进去二维世界进行清除？“虽然有种不是很靠谱的感觉，但是他还是照做了，他感觉自己不像是工作，而是在玩老式8-bit游戏。很快，清理任务完成，在嘱托了以后面对这种局面如何进入二维世界操作以后便离开现场，同时也带走了奥斯特驾驶的8-bit像素飞机..."
 hsr_ipc.2022.a:"不会吧，不会还有人喜欢玩这种老式8-bit游戏吧？"
 hsr_ipc.2023.title:"门"
 hsr_ipc.2023.desc:"一个门，一个很奇怪的门立在二维市的小巷子里，奥斯特谨慎的打开想看看这里通向哪里，只见光芒闪烁，他倒在一个酒馆之中。“喂，你这家伙怎么没带面具就进来了”，奥斯特赶忙道歉并摸着门把手离开，又是一个闪光他来到了绘世学院，在学生们惊讶的目光注视下他一边道歉一边推门而出，可下一秒却发现自己又被传送到公司驻地的研发部门办公室。在同事们的惊讶目光下说明刚才发生的一切，现在的他只感觉疲惫，想回去早点休息..."
 hsr_ipc.2023.a:"还挺有趣的"
 hsr_ipc.2024.title:"坍缩区域肃清"
 hsr_ipc.2024.desc:"随着公司人员的入驻以后，在大规模的排查和清除之后，哈托彼亚的坍缩区域已经基本肃清干净，技术部门结合之前收集的数据分析构建二维世界地图便于长期监察维护"
 hsr_ipc.2024.a:"好的开端"
 hsr_ipc.2025.title:"战略投资部介入计划"
 hsr_ipc.2025.desc:"自计划设计和筹备到实施，战略投资部都曾提出过意见并想投资哈托彼亚，由于首席执行官由市场开拓部进行任免，战略投资部一开始并不占据上风。随着哈托彼亚加入银河贸易网络，战略投资部有意操控者经贸往来加强对哈托彼亚的投资，无形之中战略投资部已经在哈托彼亚造成了不小的影响力。"
 hsr_ipc.2025.a:"胜者为王"
 hsr_ipc.2026.title:"异常防御部队建立"
 hsr_ipc.2026.desc:"为了维护治安，应对异常情况，由公司牵头，抽调人力，并招募本地人民组建异常防御部队。这只部队的建立以后哈托彼亚的治安飞速好转。"
 hsr_ipc.2026.a:"继续加油伙计们"
 hsr_ipc.2027.title:"新任首席执行官任免"
 hsr_ipc.2027.desc:"随后首席执行官的任免权从市场开拓部“和平”转移到战略投资部，麦斯威尔·格兰特卸任二相乐园首席执行官。战略投资部随后安排真珠作为新一任首席执行官，因解析艺术而诞生，她追寻美的极境，却从未失却「存护」的底色。"
 hsr_ipc.2027.a:"有意思"
 hsr_ipc.2028.title:"幻造种技术研究"
 hsr_ipc.2028.desc:"绘世学院与公司的合作成功的让我们更多的有关幻造种和欢愉技术，自人类的虚构行为中诞生的智慧生灵，名为「幻造种」，其依靠人们的想象力与关注力――「愿力」而存在。基于之前对幻造种技术的研究，技术研发部的部长「亚婆离」提出在千星城尝试复刻这一技术。"
 hsr_ipc.2028.a:"让他们试试"
 hsr_ipc.2028.a.desc:"解锁局势选项:§H研究型投资§!"
 hsr_ipc.2029.title:"血涂游戏"
 hsr_ipc.2029.desc:"乐园历1984年7月22日，一名谒者进入绘世学院，以此为起点，在杀害了准备校庆的22名学生后，向鸽川区方向行进，共计造成146名无辜市民死伤，数百人受事件波及，直接或间接地遭受二次伤害。这个杀人魔就像一名恐怖的作画者，留下一路受害者的遗骸和签名般的杀人痕迹「绽放血手」。媒体称他为「告死魔」。这是一桩无法遗忘的悲剧。该事件被称为「告死魔事件」。"
 hsr_ipc.2029.a:"向他们表达我们的慰问"
 hsr_ipc.2030.title:"余波"
 hsr_ipc.2030.desc:"乐园历1994年7月22日，异常防御部宣布，已于今日对「告死魔」执行死刑。乐园历1986年治疗幻造种叙事结构脆弱病的「斯多纳方案」诞生。乐园历1993年，《灵物保护法》与《愿宝与信用点兑换协议》修订。"
 hsr_ipc.2030.a:"希望他们能走向正常生活"
 hsr_ipc.2031.title:"走向正轨"
 hsr_ipc.2031.desc:"长期的投资已经完成了预期的计划，如今的二相乐园已经走向正轨，在我们的长期改造之下，二相乐园已经成为公司在宇宙中传播娱乐文化的最大中心之一和最忠心的附属。"
 hsr_ipc.2031.a:"一次完美的投资"
