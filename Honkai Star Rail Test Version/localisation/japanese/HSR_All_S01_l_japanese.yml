 SR_belobog.121.title:0 "裂界攻撃の勝利"
 SR_belobog.121.desc:0 "裂界への攻撃計画は予想通りの勝利を収めた。裂界の怪物たちは銀鬃鉄衛の砲火の下で悲鳴を上げ続けた。いくらかの代償を払ったが、我々はこの地域の制御権を手に入れ、成功にまた一歩近づいた。\n時々思うのだが、彼らの悲鳴を使ってコンサートを開き、大守護者を招待して麾下の戦士たちの勇姿を鑑賞してもらうのはどうだろうか？"
 SR_belobog.121.a:0 "もっともだ、直ちに大守護者に招待状を送ろう。"
 SR_belobog.121.b:0 "冗談を言うな、大守護者がそんな馬鹿げたことを認めるはずがない。"
 SR_belobog.122.title:0 "戦勝報告"
 SR_belobog.122.desc:0 "裂界生物との戦いは良いスタートを切った。銀鬃鉄衛の奮戦により、我々は裂界生物の攻勢を撃退し、強固な防衛線を構築することに成功した。我々は決して裂界生物を防衛線内に入れず、住民に危害を加えさせない。\n現在、戦線全体の状況は安定しつつあり、裂界生物の攻勢も鈍化している。裂界侵食地域への反攻を検討する時だ。"
 SR_belobog.122.a:0 "我々は必ず失地を取り戻す。"
 SR_belobog.190.title:0 "裂界怪物が完全に除去された"
 SR_belobog.190.desc:0 "徹底的な捜索と掃討の結果、裂界生物は完全に殲滅され、我々の拠点はかつて裂界に属していた地域の隅々にまで行き渡り、惑星は再び完全に我々の手に戻った。\nこの万界の癌による災難は、幕を閉じるべきだろう。"
 SR_belobog.190.a:0 "この偉大なる勝利は国民全体のものだ！"
 SR_belobog.199.title:0 "エラー！"
 SR_belobog.199.desc:0 "SR_belobog.100+関連の裂界戦闘イベントでエラーが発生した。\n\nもしあなたがプレイヤーで、コンソールを使用せずにこのメッセージが表示された場合は、本MODに関連するコンテキスト情報を可能な限り記録し、私が確認できる場所で連絡し、どのような状況で発生したかをおおよそ説明してほしい。"
 SR_belobog.199.a:0 ":( あなたのMODに問題があるようです"
 SR_belobog.301.title:0 "大移動"
 SR_belobog.301.desc:0 "最初の植民地が設立に成功した。明らかに、ここは母星よりも生存に適した環境である。母星では果てしない氷雪と厄介な裂界の怪物が見られるが、ここではその心配はない。これは国民にとって大きな魅力となっている。\n世論調査の結果によると、かなりの数の国民が新世界での生活を希望している。もし彼らの要望を認めれば、少ない資源の消費で母星から大量の人口を移すことができる——ただし、得られた影響力がすべて強制移住に使用されることが条件である。"
 SR_belobog.301.a:0 "もちろん同意する"
 SR_belobog.301.b:0 "やめておこう"
 SR_belobog.9999.title:0 "通信受信"
 SR_belobog.9999.desc:0 "少し変更してみたが、うまく機能しているかどうかは分からない。しかし、バグはまだたくさんあるだろう。"
 SR_belobog.9999.a:0 "わかった"
 SR_belobog.9999.a.desc:0 "……"
