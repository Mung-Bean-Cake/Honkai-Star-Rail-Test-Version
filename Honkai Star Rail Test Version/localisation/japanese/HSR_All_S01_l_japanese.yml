 #火花
 NAME_huohua:"火花"
 huohua_catch_phrase:"「スクリーンの前の皆さん、私が勝つと思いますか？」"
 huohua_backstory:"いいね！フォロー！ライブ配信！トラフィック！歓喜は世界の果てまで！誰が見られ、誰が好かれるかが、正解だ！"
 hsr_paragon.68.name:"火花"
 hsr_paragon.68.a:"初対面"
 hsr_paragon.68.a.response:"「銀河バットウィーラー」のライブ配信へようこそ！私はあなたの親友「火花」です。ドーパミンたっぷりの一日を始める準備はいいですか？華やかな世界は目を奪う、今日も火花のように輝こう~"
 hsr_paragon.68.b:"挨拶"
 hsr_paragon.68.b.response:"最近何か大きなことをやったか？君には人脈があり、私にはアカウントがある。コラボすれば、花が咲き誇り、大繁盛すること間違いなし~"
 hsr_paragon.68.c:"見聞"
 hsr_paragon.68.c.response:"ショーの開始だ、いいねとフォローをよろしく~"
 leader_huohua_t1:"§Rシグナルオーバーフロー：アンコール！§!"
 leader_huohua_t1_desc:""
 leader_huohua_t1_add:"§R歓楽技—能動§!\n§Y[アハの瞬間]§!が発動すると§R火花§!が出演し、火花が特別に用意した§G抽§!§R選§!を行う。"
 leader_huohua_t2:"§M万我狂騒、カメラは止めるな§!"
 leader_huohua_t2_desc:""
 leader_huohua_t2_add:"§R【良いネタには報いを】—パッシブ技§!\n§Y[アハの瞬間]§!が発動すると§R【歓楽】§!キャラクターが出演し、スキル['leader_trait:leader_huohua_t1']の効果が永続的に§G100§!増加する。"
 leader_huohua_t3:"§M絶叫！火花花が接続中§!"
 leader_huohua_t3_desc:""
 leader_huohua_t4:"§M舞台裏の手§!"
 leader_huohua_t4_desc:""
 leader_huohua_t5:"§M沸騰！真偽のパレット§!"
 leader_huohua_t5_add:"§R【良いネタには報いを】—パッシブ技§!\n§Y[アハの瞬間]§!が発動した時、§R笑いポイント§!を消費していた場合、直ちに§R10笑いポイント§!を獲得する。"
 leader_huohua_t5_desc:""
 leader_huohua_t6:"§Mスイート！笑いポイントサイン会§!"
 leader_huohua_t6_desc:""
 leader_huohua_t6_add:"§Bパッシブ技§!\n§R火花§!の効果を受けた惑星は、BUFF§G快適度が一定値に達すると資源生産が増加するBUFF§!を得る。"
