Star_Rail_species_trait_points_add:0 "遺伝子ポイント増加"
tech_mineral_and_energy:0 "仙舟無限"
tech_mineral_and_energy_desc:0 "この壮大な宇宙船は宇宙の広大な闇を横断し、その壮大な外観と魅惑的な内部景観は、仙舟文明の強大な実力と創造力を示している。"
tech_kuozhang:0 "建設計画"
tech_kuozhang_desc:0 "スーパーコンピュータによる建設計画の補助"
tech_gongzao_1:0 "工造司エネルギー計画"
tech_gongzao_1_desc:0 "エネルギーの生産を担当"
tech_gongzao_2:0 "工造司格物院"
tech_gongzao_2_desc:0 "工匠が設計作業を行う場所。設計図や草稿などの保管も行われる。"
tech_dandingsi_1:0 "丹鼎司拡張計画"
tech_dandingsi_1_desc:0 "丹鼎司は仙舟の生物学・医学研究を担当し、各洞天に医館を開設して医療サービスを提供する。古い時代には、仙舟の先民は長寿種ではなかったと言われている。老・病・死の三苦を解脱するため、彼らは薬を求めて出航した。長生を得た後、丹鼎司は星神の残した奇跡を用いて「仙道」を説いた。しかし現在、丹鼎司は衰退の道を辿り、最終的には化外民の診療所となった。"
tech_dandingsi_2:0 "スーパー遺伝子計画"
tech_dandingsi_2_desc:0 "丹鼎司の生物学的最新研究"
tech_yunqi:0 "雲騎軍"
tech_yunqi_desc:0 "雲騎軍は仙舟連盟の武装勢力である。その建制は現存する六つの仙舟に跨り、仙舟の民の安全を守り、豊穣の孽物を討伐する重任を担っている。"
tech_taipu:0 "太卜司大衍窮観陣"
tech_taipu_desc:0 "羅浮仙舟が未来を占うために用いる大型陣法。卜者たちは無数の玉兆を連結し、往を知り来を鑑み、陰を照らす。大衍窮観陣は常に稼働させ、必要な時にいつでも占いに投入できるようにしておく必要がある。"

