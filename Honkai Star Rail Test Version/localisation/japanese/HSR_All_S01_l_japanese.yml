mega_HM_CRISIS_TTZPC: "戦争の坩堝"
mega_HM_CRISIS_TTZPC_DESC: "かつて火匠一族は、比類なき鍛造技術ゆえに両足を折られて囚われていた。壊滅の星神は囚われの火匠一族を解放し、同時に尽きることのない力を与えた。その恩義に報いるため、火匠は戦争の坩堝を用いて壊滅の星神のために武器を鍛えた。しかし、長きにわたって、戦争の坩堝は既に匠と材を区別せず、反物質の生命を鍛える火匠の大師たちもまた、壊滅の武器の一部となっていた。"
