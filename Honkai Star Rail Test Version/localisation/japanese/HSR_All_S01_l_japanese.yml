 #三月なのか
 NAME_sanyueqi:"三月なのか"
 sanyueqi_catch_phrase:"「ねえ、こんなに綺麗な氷を見たことある？」"
 sanyueqi_backstory:"風変わりな少女。この年頃の少女が「熱中すべき」ことすべてに熱中していると自認しており、例えば写真撮影など。漂う氷塊から目覚めたが、自分の生い立ちや過去については何も知らない。短い落ち込みの後、彼女は新たな人生の始まりの日付を自分の名前とすることにした。この日、三月なのかが「誕生」した。"
 hsr_paragon.58.name:"星穹列車-三月なのか"
 hsr_paragon.58.a:"初対面"
 hsr_paragon.58.a.response:"こんにちは、開拓者。星穹列車への入社を歓迎するよ。私は三月なのか、星穹列車の乗員であり、君の同僚だ。さて、まずは入社写真を撮らせて…冗談だよ~"
 hsr_paragon.58.b:"趣味"
 hsr_paragon.58.b.response:"写真を撮ること、日記を書くこと、言うまでもないでしょ~"
 hsr_paragon.58.c:"見聞"
 hsr_paragon.58.c.response:"たとえ「ダーク」な料理でも、「開拓」の精神で立ち向かわなきゃ！でも正直なところ、砂ウナギのゼリー寄せや姫子のコーヒーはちょっと……"
 leader_sanyueqi_t1:"§M可愛いは正義§!"
 leader_sanyueqi_t1_desc:"私に出会ったのは運が悪かったな。"
 leader_sanyueqi_t2:"§M余生の初日§!"
 leader_sanyueqi_t2_desc:"たまには真面目にならないとね。"
 leader_sanyueqi_t3:"§M少女の特権§!"
 leader_sanyueqi_t3_desc:"全部私が見つけたんだ~"
 leader_sanyueqi_t4:"§M記憶の中のすべて§!"
 leader_sanyueqi_t4_desc:"あら、ちょうどいいところに来たね。今日はまだ一緒に写真を撮ってなかったよ。"
 leader_sanyueqi_t5:"§Mこのままずっと…§!"
 leader_sanyueqi_t5_desc:"私の過去は、もしかしたら過去ではなく、未来にあるのかもしれない。だから私は駅ごとに進み続ける。たとえいつか…列車がなくても。"
