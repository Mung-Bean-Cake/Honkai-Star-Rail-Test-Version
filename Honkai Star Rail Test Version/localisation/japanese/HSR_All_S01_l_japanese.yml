 concept_cunhu: "§H「存護」§!"
 concept_cunhu_desc: "§H「存護」、クリフォー§!\n天慧星壁、亜空晶壁、巨引源基盤の砌造者。崇拝者から「琥珀王」と呼ばれる。彼はより古い「黄昏戦争」の生存者である。彼は大敵の呑噬が差し迫っていることを知っている。そのため、光年単位で障壁を築き封印し、まだ生気のある世界を隔離保護しなければならない。\n§H「哲学者は星空を見上げ、文明の究極の目標を探求する——『壁を築け』と、雄渾な響きが頭の中にこだまする：『壁を築け』。」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——エイドリアン・スペンサー＝スミス『星に関する寓話集』§!"
 concept_cunhu_effect:"運命：「存護」"
 concept_cunhu_effect_desc:"§H防御型§!運命。初期は§G惑星インフラ建造速度§!、§G惑星建造キューの上限§!、§G防御部隊の士気・ダメージ・体力§!を向上させる。実践値が増加するにつれて、§H恒星基地の容量・ダメージ・船体値§!、§H防御プラットフォームのダメージと船体値§!を向上させる。§G恒星基地アップグレード費用§!を削減し、§H艦船建造速度（防衛戦争時）§!と§H本土戦闘時の射速§!を向上させる。"
