 #トパーズ
 NAME_tuopa:"トパーズ"
 tuopa_catch_phrase:"やあ、久しぶり！最近どう？仕事は忙しい？残業は多い？"
 tuopa_backstory:"星間平和会社「戦略投資部」の上級幹部トパーズは、特別債務査察チームを率いる。若くして「石心十人」の一人であり、礎石は「取立トパーズ」。相棒のトロッター「ヌビィ」は富の在処を鋭く感知し、警備、取立て、計算作業もこなす。今や彼らは共に銀河を巡回し、会社の事業に影響を与える様々な債務問題を追及している。"
 hsr_paragon.63.name:"星間平和会社-トパーズ"
 hsr_paragon.63.a:"初対面"
 hsr_paragon.63.a.response:"初めまして、簡単に自己紹介させてください。私はトパーズ、星間平和会社の戦略投資部所属です。星穹列車と無名客の皆さんのことはかねてから伺っていました、お会いできて光栄です！そしてこちらが私の良き相棒です。ヌビィ、皆さんに挨拶して！"
 hsr_paragon.63.b:"趣味"
 hsr_paragon.63.b.response:"広大な星空、数え切れないほど可愛くて不思議な小動物…それらだけのためにでも、私は頑張らなきゃ！"
 hsr_paragon.63.c:"見聞"
 hsr_paragon.63.c.response:"どの家庭にも事情はあるものだ、そのくらいは分かっているつもりだ。しかし、誰もが自分の事情で借金を踏み倒せば、システム全体が崩壊する——そうなれば、一人の事情が全世界の苦悩になる。"
 leader_tuopa_t1:"§M支払い困難？§!"
 leader_tuopa_t1_desc:"リスク意識を高めなければ……"
 leader_tuopa_t2:"§M金融変動§!"
 leader_tuopa_t2_desc:"市場の変動は正常なことだ、チャンスを逃さず行動しよう~"
 leader_tuopa_t3:"§Mテクニカル調整§!"
 leader_tuopa_t3_desc:"悩みながらも、幸せに"
 leader_tuopa_t4:"§M需要膨張§!"
 leader_tuopa_t4_desc:"元利ともに返済せよ！"
 leader_tuopa_t5:"§M赤字を黒字に！§!"
 leader_tuopa_t5_desc:"ああ？そうだな。長期的な視点に立てば…それが投資成功の秘訣だ！"
