 councilor_zhishi_jiyi_1_desc:"時間の検死官は、細かな手がかりを辿って虚構の痕跡を推測する。"
 building_zhishi_jiyi_1:"燭墨検証アーカイブ"
 building_zhishi_jiyi_1_desc:"憶質を検証することで、記録された歴史が虚構であるかどうかを検証する。"
 building_zhishi_jiyi_1_effect:"帝国が飛昇の才覚を1つ採用するたびに、§Y3§!の$physics_research_with_icon$、$engineering_research_with_icon$、$society_research_with_icon$を生産する。"
