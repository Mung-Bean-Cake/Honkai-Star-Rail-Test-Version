#政策
xianzhou_name:"£xianzhou_union£仙舟"
xianzhou_luofu_text:"艦船名称：§K仙舟-「羅浮」§!\n仙舟「羅浮」は仙舟連盟の六つの座艦の一つであり、果てしない星海を漂い、巡狩の主の宿敵に向かって放たれた戻らぬ神の矢のように進む。\n豊穣の民との戦争が一段落した後、「羅浮」は多くの文明が栄える星域をゆっくりと回航し、各世界と貿易・文化交流を行っている。\n彼らは星間平和会社と互市協定を締結し、かつて豊穣の民によって破壊された多くの世界の生態系修復を支援している。\n豊穣の薬師から建木を授かったことにより、仙舟の首となった。\n羅浮竜尊の尊号は「飲月君」。\n豊穣の禍跡は不死建木。\n羅浮の札：雲騎軍が天を覆う建木を守り、化外民が船で訪れ、星槎の海は人波と喧騒で沸き返る。"
xianzhou_fanghu_text:"艦船名称：§K仙舟-「方壺」§!\n仙舟「方壺」は仙舟連盟の六つの座艦の一つである。持明族自治領。連盟は持明が寿瘟の禍跡を鎮めた功績に感謝し、方壺仙舟を持明の自治に贈った。\n星歴8072年、遊星「計都蜃楼」が復活・活化し、方壺を侵攻した。戦況は激しく、幾度となく敗北の危機に瀕したが、幸い帝弓の神矢が頑敵を掃討した。方壺仙舟の約五分の一の洞天が光矢の轟撃によって破壊された。方壺は第三次豊穣戦争後、自保政策を堅持し、休養生息している。方壺の自保政策は、他の仙舟との正常な交流や貿易をほぼ絶たせている。\n星歴8098年時点で、トラテクトリ星団ランナー星系に停泊中。特別な事情がない限り、方壺は少なくとも10星年はここに停泊する予定。\n特産品は水産物。\n方壺竜尊の尊号は「冱淵君」。\n豊穣の禍跡は方寸煙海。\n方壺の札：持明が方寸煙海を遊泳し、「護珠人」が静かに黙想し、微かに粛殺の竜吟が聞こえる。"
xianzhou_yaoqing_text:"艦船名称：§K仙舟-「曜青」§!\n仙舟「曜青」は仙舟連盟の六つの座艦の一つであり、果てしない星海を漂い、全てを平定する巨剣のように、孽物が猛威を振るう多くの星域を横断する。\n六つの仙舟の中で武力で知られる座艦として、曜青仙舟は長らく最も激しい作戦任務を担ってきた。狐人が中心の曜青精鋭部隊「青丘軍」の勇猛な追撃の下、歩離人のような孽物の大軍は散り散りとなり、その勢力は衰えた。\n帝弓神話では、帝弓の出身地とされる。\n曜青仙舟は星間平和会社と長期的に緊密に協力し、作戦に必要な技術と物資の支援を得ている。彼らは多くの世界の孽物の災いを掃討し、その多くを信用システムの戦利品とした。近年では、かつての面影は失われつつある。伝統的な曜青建築は会社のビルに取って代わられ、曜青の若者たちも会社の文化の影響を強く受けている。\n曜青竜尊の尊号は「天風君」。\n豊穣の禍跡は胎動の月。\n曜青の札：風と雷を乗せて九天の外から疾駆する。甲板には無数の狐人が立ち並び、その威風は堂々として敵を寄せ付けない。"
xianzhou_zhuming_text:"艦船名称：§K仙舟-「朱明」§!\n仙舟「朱明」は仙舟連盟の六つの座艦の一つであり、果てしない星海を漂い、百錬の鎚のように、多くの神兵利器を鍛え、雲騎軍の作戦需要を支える。\n古国が出航した時代から、朱明仙舟は工巧奇芸と丹鼎技術で知られていた。そして八千年の航行の旅の中で、朱明仙舟は絶えず自己改造を続け、当初の外観を失ったが、工匠たちの心に燃える革新と知識への渇望は決して消えなかった。\n今や朱明仙舟は星海に名高い工造の聖地となり、スクリューガム星やピアポイントに劣らぬ製造技術で、数え切れないほどの求学者を引き寄せ、彼らを満載して帰している。\n星歴8098年時点で、ルヴァ・ドゥ・ラルディ星団ステラ・ヤマザキ星系に停泊中。この星系はクリメント立憲国の領域内にある。朱明はここで10星年にわたる技術交流を行う予定であり、先進的な製錬技術と引き換えに、この地域の豊富な鉱物資源を得ることを期待している。\n帝弓神話では、豊穣民を撃退するため、帝弓は制止を顧みず朱明仙舟の奥深くにある牢獄に入り、長らく囚われていた歳陽の首領「燧皇」を説得し、自らの身体と引き換えに歳陽の力の協力を得た。\n火劫大戦の終盤、歳陽一族は完全に禁絶された。ごく一部が朱明仙舟に残存しているのみである。歳陽の祖「燧皇」は朱明の中心に囚われ、深い眠りについている。この天体級のエネルギー生命体を中心に、朱明の工匠たちは環形の焔輪鋳煉宮を建設し、その無限のエネルギーを汲み上げている。\n特産品は陶磁器。\n朱明竜尊の尊号は「炎庭君」。\n豊穣の禍跡は太始燧皇。\n朱明の札：工匠がここで熔金・鍛鉄し、洪炉は昼夜を問わず炎を吐き、甲板には絶え間なく様々な機械が運ばれている。"
xianzhou_yuque_text:"艦船名称：§K仙舟-「玉闕」§!\n仙舟「玉闕」は仙舟連盟の六つの座艦の一つである。\n連盟が星を凝視する目。連盟第一の観星重器「瞰雲鏡」を有する。\n玉闕仙舟は現在、巨人の腕星団の外側を航行し、古代航路に沿って探査を続けている。\n第二次豊穣民戦争において、玉闕仙舟は豊穣の令使「倏忽」によって包囲された。\n数百年前、豊穣の民は驚くべき大軍を糾合して玉闕に攻め寄せ、豊穣民は惑星「計都蜃楼」を生きたまま覚醒させた。雲上五骁は玉闕仙舟の包囲を解き、「計都蜃楼」を撃破した。\n持明五脈は玉闕において仙舟と盟約を結んだ。\n特産品は玉兆。\n玉闕竜尊の尊号は「昆岡君」。\n豊穣の禍跡は息壌淵石。\n玉闕の札：観星士が瞰雲鏡を操り星海の深くを覗き、玉兆が回転を止めず、陰霾の中から人々を導き、明るい彼岸へと航行させる。"
xianzhou_xuling_text:"艦船名称：§K仙舟-「虚陵」§!\n仙舟「虚陵」は仙舟連盟の六つの座艦の一つである。\n星歴8098年時点で、位置は不明。\n『仙舟連盟宣言』は虚陵で署名された。\n十王司の本部所在地と思われる。\n連盟の重犯は、全て虚陵仙舟に護送され、帝弓七天将の連合審判を受ける。\n虚陵の札：他の仙舟がここを経由して航行する以外は人影もなく、金人が星羅棋布しているのみ。"
xianzhou_default_text:"古の神話の時代、数隻の仙舟が長生の霊薬を求めて星海に出航した。薬を求める舟は光陰を費やし、身体と意志を磨耗させ、ついに薬師の祝福を得た。しかし、長生をもたらす果実は、四海の荒廃と民の苦難をもたらした。巡狩の星神・嵐が深淵から帰還し、重力を弦とし、辰矢を満弓にして建木を一撃で断ち切り、「豊穣」の孽を絶つまで、その苦しみは続いた。仙舟は迷いの道を脱した後、「巡狩」の導きにより連盟を結成し、強力な雲騎軍を組織した。連盟は豊穣の孽物を標的とし、不死の汚染を断ち切ることを使命として、広大な星野を巡る。"
