#技術
 tech_yaliluo_new_army:0 "新型ロボット部隊"
 tech_yaliluo_new_army_desc:0 "$yaliluo_robotic_army_desc$"
 tech_yaliluo_liexi_research_1:0 "基礎裂界研究"
 tech_yaliluo_liexi_research_1_desc:0 "予備的な判定では、それは何らかの交雑種である：半分は原体であり、残りの半分のデータは星核と高度に適合している——生物科、サラ・カストロ"
 tech_yaliluo_liexi_research_2:0 "裂界回収研究"
 tech_yaliluo_liexi_research_2_desc:0 "悪性腫瘍の病巣、あるいは罪を引き起こす衝動のように、それは裂界の歪みの根源である。この心臓は既に微かに輝いており、その表面の模様にはまだ生命力が宿っている。"
 tech_trait_power_arm:0 "深部採掘動力モジュール"
 tech_trait_power_arm_desc:0 "深部採掘計画と新たに研究されたロボットの新型動力採掘モジュール\n§B特性を解放：動力機械モジュール§!"


#飛昇の才覚と遺物
 ap_jarilo_saved:0 "守護と防衛のために"
 ap_jarilo_saved_desc:0 "我々の絶え間ない努力により、母星の環境上の困難を克服し、ヤリロ-VIを滅亡から救うことに成功した。\n過去の出来事は銀河の歴史における伝説となるだろう。そして今、我々にとってこれは新たな始まりである。"
 ap_jarilo_saved_fail:0 "我々はまだ母星の改造に成功していない"



#修正
 SRB_blockerHC_modifier:0 "寒波"
 SRB_blockerHC_modifier_tooltip:0 "この惑星は果てしない氷と雪の世界である"
 SRB_blockerLJ_modifier:0 "裂界"
 SRB_blockerLJ_modifier_tooltip:0 "惑星上の裂界浸食は人々の生活に深刻な影響を与えている\n\n§R裂界の怪物は定期的に我々の防衛線を攻撃する§!"
 planet_jarilo_start_modifier_tooltip:0 "元々は海洋惑星だったかもしれない"
 planet_jarilo_emigration_push:0 "国外移住法令"
 planet_jarilo_emigration_push_tooltip:0 "クリフォー堡の法令とこの惑星に迫る災難が、人々を早急に去らせようとしている"
 severe_cold_torture:0 "厳寒の拷問"
 severe_cold_torture_tooltip:0 "母星での経験により、この種族は寒冷気候での生存方法を身につけた"
 yaliluo_cold_wave:0 "§R寒波§!"
 yaliluo_cold_wave_desc:0 "星核がもたらした風雪はすぐには消えず、裂界の浸食によって生存・発展の空間は徐々に狭まり、我々の発展と建設の速度に大きな影響を与えている。"
 yaliluo_united_as_one:0 "§H一丸となる§!"
 yaliluo_united_as_one_desc:0 "大守護者の指導の下、我々は一丸となって万難を排する。"
 a_debt_that_lasts_for_seven_hundred_years:0 "§R七百年にわたる債務§!"
 a_debt_that_lasts_for_seven_hundred_years_desc:0 "七百年前、星核がヤリロ-VIに落下した後、この世界に駐留していた外来者は危機の接近を予見し、去ることを選択した。これらの外来者の中には、「星間平和会社」の投資家も含まれていた。しかし彼らは去る前に、一つの大きなことを成し遂げた——彼らは故郷に留まり続ける「築城者」を見つけ、災害避難のための多額の資金を提供した。まさにその資金によって、ベロブルグはこれほど高い城壁を築くことができた…最初の自動機兵の研究開発費もその資金から捻出されたのだ。今、会社は債務の取り立てに人を派遣している。星穹列車の助けで主権を失うことはないが、この債務を返済するためにあらゆる手段を考えなければならない。この事件は社会レベルで激しい議論を引き起こしている。"
 the_power_that_has_not_yet_been_fully_integrated:0 "§R未だ完全に統合されていない力§!"
 the_power_that_has_not_yet_been_fully_integrated_desc:0 "星核危機、裂界浸食、会社の債務に直面して、我々の上層部には多くの意見と見解がある。現在我々が直面する最大の問題は、いかにしてすべての力を迅速に統合するかである。"
 surviving_in_a_desperate_situation:0 "§G絶境に生きる§!"
 surviving_in_a_desperate_situation_desc:0 "絶境にもなお一筋の光明がある。"
 belobog_technology_cooperation:0 "§G海外派遣社員行動規範：ヤリロ-VI版§!"
 belobog_technology_cooperation_desc:0 "トパーズ部長の要請により、本部門は即座に『海外派遣社員行動規範：ヤリロ-VI版』（以下『ヤリロ-VI社員規範』）を発行する。派遣期間中、正規社員および外部委託社員が規律を厳守し、戦略投資部社員として一貫した専門性、効率性、親和性のある対外的イメージを維持することを望む。\n以下は『ヤリロ-VI社員規範』の具体的な条項である：\n一、海外派遣社員は現地権力機関が発布する法律法規を遵守しなければならない。\n二、海外派遣社員は仕事を理由に現地住民の通常の生活、労働、通勤を妨害してはならない。\n三、海外派遣社員はいかなる形であれ、現地の法執行チーム（銀鬃鉄衛、地火、モールズなどを含むがこれに限定されない）の活動に参加、妨害、または影響を与えてはならない。必要な場合、会社社員は現地の法執行チームと積極的に協力しなければならない。\n四、海外派遣社員はいかなる理由であれ、現地住民からの贈り物や賄賂を受け取ってはならない。\n五、海外派遣社員はいかなる理由であれ、現地の環境生態や公共財産を破壊してはならない。\n六、海外派遣社員は人事部の許可なく、社員募集や内部紹介を行ってはならない。\n七、現地権力機関との協議が必要な業務、またはその許可を得て初めて開始できる業務は、プロジェクト開始前に部門部長に報告し承認を得なければならない。\n以下はトパーズ部長が特に追加した条項である：\n八、改めて強調する：「ヤリロ-VI再起動」プロジェクトの立脚点は、現地住民の故郷再建を加速させ、その目標達成のために必要な技術とツールの支援を提供することである。\n九、海外派遣社員はヤリロ-VIの現地住民が「造物エンジン」の修復作業を行うにあたり、全面的に支援・協力しなければならない。必要に応じて、戦略投資部の技術支援を無償で提供してよい。\n十、海外派遣社員は現地の宿泊費、食費、公共交通費を（市場価格×1.5倍）で支払う義務がある。この費用は出張経費として扱われ、部門が一括して精算する。\n十一、派遣期間中に携行するすべての武器装備は、現地の法執行チームに預けなければならない。\n十二、必要な場合、海外派遣社員は現地住民に戦略投資部のヤリロ-VIにおける業務計画と目標を詳細に説明する義務がある。\n以上が『海外派遣社員行動規範：ヤリロ-VI版』の全内容である。部門の社員各位がトパーズ部長の期待に沿い、規範を厳守し、快適で安心な派遣期間を過ごされることを願う。戦略投資部のスローガンを忘れるな：汝のリスク、我存護す。\n$belobog_technology_cooperation_tt$"
 belobog_technology_cooperation_tt:0 "§G$situation_engine_of_creation_type$状況に0.2の進行を提供する§!"
 belobog_endless_exploration_of_the_universe:0 "§G無限宇宙探査§!"
 belobog_endless_exploration_of_the_universe_desc:0 "ベロブルグ発展委員会と技術部が担当する異星資源探査・採掘計画。その目的は、造物エンジン修復計画の需要を満たすための資源を補うことである。"
 belobog_talent_emergence:0 "§G人材の出現§!"
 belobog_talent_emergence_desc:0 "学習と実践の中で、大量の優秀な人材が育成・発掘された。"
 yaliluo_ethereum_front:0 "§H星間貿易§!"
 yaliluo_ethereum_front_desc:0 "異星貿易と観光業は我々の発展の大きな原動力となる。"
 yaliluo_burn:0 "§R恐慌§!"
 yaliluo_burn_desc:0 "多数の爆発事件が社会レベルの恐慌を引き起こした。"
 belobog_liexi_setback:0 "§H偉大なる勝利§!"
 belobog_liexi_setback_desc: "我々は遠くの灯火まで歩き、ベロブルグの姿を描き出す。長い夜は旅人の倦怠を引き延ばすが、決して我々を絶望させることはない。悲しみよ、家族たち：我々の旅はあまりにも長く、琴の弦も太鼓の音も沈黙し、疲れた鈴だけが風の中で鳴り響き、かつて灯火が現れた方角へ。——カタナ・トーマス『トーマス詩集』"
 yaliluo_wonderful_life:0 "§H旧日の栄光§!"
 yaliluo_wonderful_life_desc:0 "先人たちの栄光は我々を鼓舞し、我々はヤリロをこの星域で最も輝く惑星にするだろう。"
 belobog_big_cunhu:0 "§G汎存護連絡§!"
 belobog_big_cunhu_desc:0 "我々は全ての存護勢力との連携を強化する。"
 yaliluo_new_life:0 "§H星海の輝き§!"
 yaliluo_new_life_desc:0 "我々は母星を建設し続け、我々の歩みを知ろうとするより多くの文明に発展の成果を示し、支援を必要とする文明を助けていく。"
 ipc_help:0 "§H協力・共栄§!"
 ipc_help_desc:0 "我々は星間平和会社との協力を強化する。"
 heitacountry_help:0 "§H黒塔宇宙ステーション技術援助§!"
 heitacountry_help_desc:0 "黒塔宇宙ステーションの技術は我々の想像を超えており、彼らは科学技術の指導のため人員を派遣する用意がある。"
 xianzhou_help:0 "§H仙舟の援助§!"
 xianzhou_help_desc:0 "仙舟連盟からの無私の支援。"
 xianzhou_help_event:0 "『仙舟「羅浮」-ベロブルグ相互貿易協定』"
 xianzhou_help_event_desc:0 "今日から、仙舟「羅浮」は君たちと共に戦う。寒波が春風に変わり、凍土が良田に変わるまで。"
 daunting_smite:0 "永劫の防壁"
 daunting_smite_desc:0 "氷雪を経て、この志を成す、決して終わらぬ！"
 #標本
 biological_wave_exploration_instrument: "生物波探査機"
 biological_wave_exploration_instrument_desc_short: "「これが明るく光れば光るほど、宝の価値が高い証拠だ。でも、もし探査灯より明るかったら、多分壊れてる。」"
 biological_wave_exploration_instrument_desc_details: "天才クラブ#8ラムはかつて「価値」をコード化して抽出することに成功し、極地惑星で大量の資源を探査した…ベロブルグの人々は、手にしている宝探し器が通りかかった天才からの贈り物だとは知らない。"
 yongdong_stele_stone: "永冬碑石"
 yongdong_stele_stone_desc_short: "「たとえ我々が失敗しても、この記念碑は永遠に残るだろう。未来の人類がここに来て、我々がかつて存在したことを知るだろう。」"
 yongdong_stele_stone_desc_details: "遥か昔、「悲悼伶人」がヤリロ-VIにやって来た。当時はまだ星核は降臨しておらず、寒波も到来していなかったが、反物質軍団の戦火は容赦なくこの脆弱な惑星に降り注いだ。「悲悼伶人」は築城者の存在を知らず、荒廃した光景だけを目にした。惑星の上空で、ゴンドラは静かに浮かんでいた。伶人たちは軍団に発見される前に去り、沈黙の哀歌を残した。その後、ベロブルグの築城者たちは美しい石を発見した。それは五色の光を放つ石だった。彼らはこの石を地髄と混ぜて記念碑を建造した。この記念碑は今もヤリロ-VI——ベロブルグ——クリフォー堡の中心に立っていると言われている。"
 final_special_issue: "羅浮スポーツ・ルカ決勝特別号"
 final_special_issue_desc_short: "「重要なのは常に一振りの拳を振るうことだ！」"
 final_special_issue_desc_details: "『羅浮スポーツ』がルカの「競鋒守擂」参加を報じた特別号。"
 ancient_coins: "古銭"
 ancient_coins_desc_short: "古い硬貨"
 ancient_coins_desc_details: "ベロブルグの金属資源がまだ豊富だった時代のもの。"
 activate_components: "地髄活性化部品"
 activate_components_desc_short: "「兄弟、本当の賢い人に聞くべきだ。機械の修理に詳しいのはマレフの右に出る者はいない。」"
 activate_components_desc_details: "ベロブルグ汎用規格部品。地髄伝導経路の活性化に使用できる。"
 mimetic_snow_slug: "擬態雪蛞蝓"
 mimetic_snow_slug_desc_short: "「この蛞蝓を火で炙ると、食感がとても良くなる……」"
 mimetic_snow_slug_desc_details: "擬態雪蛞蝓の標本。ベロブルグ雪原生態系のメンバー。周囲の環境に合わせて自身を似た姿に変形させ、捕食者から身を隠す。"
 monster_armor: "裂界怪物の鎧"
 monster_armor_desc_short: "「こんなものが欲しがる奴がいるとは、理解に苦しむ……」"
 monster_armor_desc_details: "裂界怪物から採取した鎧状の外殻。"
 #状況、造物エンジン修復
 situation_engine_of_creation:0 "ヤリロ-VI再起動"
 situation_engine_of_creation_type:0 "状況：造物エンジン修復計画"
 situation_engine_of_creation_desc:0 "この計画は、複数の損傷した「造物エンジン」——ベロブルグが独自に建造した「地質改造工事ユニット」——を修復し、それらを用いて星核によって生じた寒波の影響を除去し、七百年前の活気を取り戻すことを目的とする。計画は十世代にわたると見込まれている。旧い故郷が復活するかどうかは確かではないが、ベロブルグの勇気と希望は永遠に星空の下に刻まれるだろう。\n第一段階：ベロブルグは全ての物資を投入し、造物エンジン修復に必要な原材料を調達する。\n第二段階：四肢を含むすべての部品を建造し、造物エンジンの構造修復を優先する。\n第三段階：造物エンジンの組立を完了する。工事の中心は地下に移り、地髄鉱石の採掘とエネルギー精製に集中する。\n第四段階：エネルギーを注入し、造物エンジンを再起動して、ヤリロの地形改造に着手する。\n第五段階：ヤリロが新たな生気を取り戻す。\n第六段階：宇宙へ飛び出し、青空を超える。\n会社の技術支援により、計画所要時間は大幅に短縮され、おそらく二、三世代以内に完了する見込みである。"
 belobog_country_resource_shortage:0 "§R我々は現在資源が不足している！§!"
 situation_engine_of_creation_outcome:0 "宇宙へ飛び出し、青空を超える！"
 stage_engine_of_creation_effects:0 "修復作業は順調に進んでいる。"
 situation_engine_of_creation_regular:0 "通常進行"
 approach_engine_of_creation_regular_tt:0 "計画通りに進行し、物資供給は正常に確保される。"
 situation_engine_of_creation_generous:0 "超過進行"
 approach_engine_of_creation_generous_tt:0 "ヤリロの未来のために、我々はさらに努力しなければならない！"
 situation_engine_of_creation_frugal:0 "緩慢進行"
 approach_engine_of_creation_frugal_tt:0 "我々は現在、財政難と資源不足に直面しており、速度を落とさざるを得ない。"
 situation_engine_of_creation_job_number_tt:0 "造物エンジン区画"
 situation_engine_of_creation_tooltip:0 "状況の進行"
 belobog_resource_full:0 "資源は豊富"
 more_zaowuyinqing_build:0 "追加建設計画"
 #イベントチェーン
 yaliluo_story.3.name:0 "作戦失敗！"
 yaliluo_story.3.desc:0 "裂界への作戦が失敗した。市民は鉄衛と地火の組織の誘導により大部分が避難を完了し、現在は都市と有利な環境を利用して可能な限り裂界を掃討している。"
 yaliluo_story.3.a:0 "決して諦めるな！"
 yaliluo_story.4.name:0 "奪還成功！"
 yaliluo_story.4.desc:0 "我々は裂界に侵食された地域の奪還に成功した！ベロブルグ建設委員会はすでに復興作業の人員を配置し、地火と鉄衛組織は潜在的な危険の点検・除去を行っている。"
 yaliluo_story.4.a:0 "素晴らしい！"
 yaliluo_story.5.name:0 "失地回復！"
 yaliluo_story.5.desc:0 "鉄衛が東部地域の小さな古い町に大型対裂界装置を配備し、地火組織と別の鉄衛部隊が小規模裂界の捜索を開始したことで、東部地域に対する作戦計画は基本的に終了した。第二陣の部隊はすでにベロブルグに集結しており、東部地域の戦闘から帰還した一部の部隊により、経験はより豊富になった。"
 yaliluo_story.5.a.desc:0 "西部地区の地下貯蔵庫で最後の大型裂界を殲滅したことで、裂界に対する攻撃作戦はほぼ完了した。兵士たちは人々の歓声の中で凱旋した。多数の人々が東西地域に再開発のために向かうことで、以前は製造できなかった部品が今や原材料豊富となり、産業チェーンが形成され始めている。"
 yaliluo_story.5.a:0 "凱旋"
 yaliluo_story.5.a.tt:0 "大守護者は1§R軍事攻撃ポイント§!と1§R軍事防御ポイント§!を獲得する。"
 yaliluo_story.7.desc:0 "前線部隊は苦戦しており、大守護者は予備隊を直ちに前線に派遣し、先頭部隊の撤退を優先した後、攻撃を再開するよう命じた。"
 yaliluo_story.100.name:0 "差し迫るエネルギー不足"
 yaliluo_story.100.desc:0 "我々は計画を立て、損傷した「造物エンジン」の修復工事のために大量の物資を調達したが、消耗速度は速く、近い将来に物資不足に直面するだろう。ベロブルグ技術委員会の試算によると、長期的な資源不足は修復の進捗をほぼ一代分遅らせ、維持費が急増する可能性がある。\n現在、検討の結果、三つの実行可能な解決策が特定されている。第一は、目標を外宇宙に置くことである。母星は資源が乏しいが、異星資源を採掘してプロジェクトに供給することができる。星間平和会社の海外派遣チームとベロブルグ技術委員会の共同努力により、必要な科学船と工兵船の建造技術は問題なく、交渉によって星港の主権と惑星表面基地の使用権を獲得し、関連する採掘技術も習得した。しかし、我々の人的・物的・財力的資源は限られており、この方案から得られる資源量は不確実で不安定である。長期的には、この方案は補助的なものに過ぎず、これほど長い時間を待つことはできず、資源獲得率も限られている。\n第二と第三の解決策は最も実行可能と見なされているが、相互に排他的な関係にある。第二は、軍備を立て直し、侵食された地域を奪還することである。裂界の研究が進み、小規模裂界は容易に殲滅できるようになり、大規模裂界の殲滅方法も研究中で大きな進展がある。必要な兵力は、以前岩盤の間に封印されていた戦闘用ロボットから大部分を賄うことができ、鉄衛、地火組織、機械部隊の支援により、まず一部の領土を奪還し、資源採掘に専念することができる。第三は、より深層の探査に注力することである。以前は技術的制限により、一部の深層エネルギーは採掘どころか探査すらできなかったが、それらのロボットを改造し、戦闘部分を工事モジュールに交換することで、交換された部品のほとんどをプロジェクトに使用できるか、重要な部品の模倣生産に活用して機械の維持費を削減することができる。さらに、現在の安定した環境は異星投資家や観光客にとってより魅力的である。\n現在の我々にとって、これらの二つの方案から選択しなければならず、議論を経て決定を下す必要がある。"
 yaliluo_story.100.a:0 "直ちに大会を開催せよ！"
 yaliluo_story.101.name:0 "選択"
 yaliluo_story.101.desc:0 "鉄衛と地火組織の代表は、まず領土を奪還することに賛成している。ベロブルグの東部と西部はかつて我々の最大の資源センターと研究センターであり、撤退時に多くの不便な物品や施設が地下に埋められ保護されていた。この二つの地域を奪還し維持できれば、プロジェクトが直面する問題はほぼ解決される。技術委員会とエネルギー機関は深層開発に傾いており、裂界攻撃と比較して深層開発は人的被害が少なく、現在掌握しているいくつかの地域では、いくつかの大規模な深層鉱床が既に確認されており、未だ完全には開発されていない。"
 yaliluo_story.101.a:0 "東部と西部の地域を優先的に奪還する。"
 yaliluo_story.101.a.desc:0 "東部と西部の地域を奪還する計画を策定する。\n大守護者は1§G発展ポイント§!と1§R軍事防御ポイント§!を獲得する。"
 yaliluo_story.101.b:0 "深層探査と採掘を優先する。"
 yaliluo_story.101.b.desc:0 "深層探査と採掘の計画を策定する。\n大守護者は1§G発展ポイント§!と1§B外交ポイント§!を獲得する。"
 yaliluo_story.102.name:0 "軍事改革"
 yaliluo_story.102.desc:0 "下層区の禁令が解除された後、鉄衛と地火組織は長期的な共同作戦を実施し、裂界攻撃と戦後復興のための熟練した実行可能な計画を策定した。鉄衛は攻撃と突破を担当し、地火は策応と偵察・補給を担当する。戦後地域の復興は地火が主導し、鉄衛が補助して復興を進め、同時にロボット部隊が支援を提供する。技術委員会は以前から新型戦闘ロボットの研究を開始しており、関連する技術者を派遣して封印されたロボットを改造し、今後の裂界攻撃に備えている。"
 yaliluo_story.102.a:0 "行動準備を整えよ。"
 yaliluo_story.102.a.desc:0 "我々は8個の新型ロボット防御部隊を獲得する。\n大守護者は1§R軍事攻撃ポイント§!と1§R軍事防御ポイント§!を獲得する。"
 yaliluo_story.103.name:0 "計画策定"
 yaliluo_story.103.desc:0 "事前に設定された計画に従い、我々はまずエネルギー問題を解決するために東部地域を奪還し、その後、西部の研究センターに注力する。一方、ベロブルグの一部の民生生産ラインは新型ロボットユニットの生産を支援し始めている。技術部はさらに投資を行えば新たな部隊を建造できると考えているが、攻撃計画は延期される。鉄衛は延期せず即座に攻撃すべきだと主張している。"
 yaliluo_story.103.a:0 "部隊を増やせば勝算が高まる。"
 yaliluo_story.103.a.desc:0 "我々は5個の陸軍を獲得する。"
 yaliluo_story.103.b:0 "一刻の猶予もない、出撃準備を整えよ！"
 yaliluo_story.103.b.desc:0 "我々は1個の陸軍を獲得する。ヤリロ-VIは惑星決議を解放：§R裂界への攻撃を組織§!"
 yaliluo_story.104.name:0 "攻撃開始！"
 yaliluo_story.104.desc:0 "我々はさらに多くの新型ロボット部隊を補充した。ベロブルグの中心広場で閲兵式が行われ、出征する鉄衛、地火のメンバー、ボランティアが大守護者の閲兵の後、前線へと進発した。人々は彼らに祝福と応援を送る。前途は危険に満ちているが、彼らが無事に帰還することを願う。"
 yaliluo_story.104.a:0 "進め、戦士たち！"
 yaliluo_story.104.a.desc:0 "ヤリロ-VIは惑星決議を解放：§R裂界への攻撃を組織§!"
 yaliluo_story.105.name:0 "戦後復興"
 yaliluo_story.105.desc:0 "二度の作戦を経て、以前は戦闘ロボットの生産に使用されていた組立工場は現在、新型ロボットを生産している。クリフォー堡は戦後復興を組織する人員を配置し、復興活動へのボランティアを募集している。人々の高い熱意のおかげで、復興作業は予想を上回る進展を見せている。現在、我々は資源不足に陥ることはなくなり、造物エンジン修復計画を加速すべきである。"
 yaliluo_story.105.a:0 "我々は最終的にベロブルグの未来を勝ち取るだろう！\n大守護者は1§G発展ポイント§!、1§H内政ポイント§!、1§R軍事攻撃ポイント§!、1§R軍事防御ポイント§!、1§M研究ポイント§!、1§B外交ポイント§!を獲得する。"
 yaliluo_story.105.a.desc:0 "状況§Hヤリロ-VI再起動§!の毎月の進行速度を0.1増加させる。"
 yaliluo_story.150.name:0 "改良型ロボット"
 yaliluo_story.150.desc:0 "新型のエンジニアリングロボット。大量の工事モジュールを搭載した機械ユニットで、下層鉱区の作業経験や一般的な都市建設の経験を基に、スヴァローグの協力を得て設計され、大量生産が開始されている。同時に、封印されていた旧型ロボットも再組立し、新型ロボットはより強力な作業能力と低いエネルギー消費を実現している。"
 yaliluo_story.150.a:0 "素晴らしい"
 yaliluo_story.150.a.desc:0 "我々は§B2§!体のロボット人口と§B4§!つの採掘地点を獲得する。\n大守護者は1§G発展ポイント§!と1§H内政ポイント§!を獲得する。"
 yaliluo_story.151.name:0 "『エーテル戦線』と「星間決勝祭典」"
 yaliluo_story.151.desc:0 "星間平和会社が開発した『エーテル戦線』は、「エーテルコイン」を媒体とするトレーディングカードバトルゲームであり、発売と同時に宇宙で大流行した。このゲームでは、あらゆる生物データが「エーテル霊」に変換され、プレイヤーは「収集、対決、育成、アップグレード」を楽しむことができる。以前、会社はベロブルグで「星間決勝祭典」を開催し、好評を博した。その後、星間平和会社は代表を派遣し、現在ベロブルグが比較的安定した時期にあることを考慮し、旧兵器試験場を将来の「星間決勝祭典」の開催地、または分会場として借用したいと提案した。我々にとって、前回の大会はベロブルグをより多くの人々に知らしめ、大きな星間貿易をもたらした。しかし一方で、外国人観光客の安全確保や会場維持のための人員が不足しており、会社との交渉でも不利な立場に立たされることが多く、慎重に検討する必要がある。"
 yaliluo_story.151.a:0 "これはより多くの星間貿易を呼び込む絶好の機会だ。"
 yaliluo_story.151.b:0 "もう少しよく話し合う必要がある。"
 yaliluo_story.151.c:0 "旧兵器試験場には別の用途がある……"
 yaliluo_story.152.name:0 "協議"
 yaliluo_story.152.desc:0 "星間平和会社の代表は我々との協議の後、要求を受け入れ、ベロブルグの管理を受け入れ、合意された契約に従って租借地を運営することを約束した。交渉担当者は我々が彼らの要請を受け入れてもよいと考える。"
 yaliluo_story.152.a:0 "彼らの要請を受け入れる。"
 yaliluo_story.152.b:0 "やめておく。"
 yaliluo_story.153.name:0 "「星間決勝祭典」"
 yaliluo_story.153.desc:0 "我々は星間平和会社と合意に達した。現在、ベロブルグは会社と協力して「星間決勝祭典」を開催している。ますます多くの異星人観光客がベロブルグを訪れる。同時に、この宣伝の窓口を活用して、磐岩鎮の闘技表演技などのプロジェクトをより多くの異星人観光客に紹介している。"
 yaliluo_story.153.a.desc:0 "大守護者は1§G発展ポイント§!と1§B外交ポイント§!を獲得する。"
 yaliluo_story.154.name:0 "大発展時代"
 yaliluo_story.154.desc:0 "新しい鉱区とエネルギー区画の設立により、緊急のエネルギー問題はほぼ解決された。中核技術の研究開発は盛んであり、実力を強化するために発展を続ける必要がある。"
 yaliluo_story.155.name:0 "予期せぬ発見！"
 yaliluo_story.155.desc:0 "探査隊と建設チームは、この場所で別の隠れた資源地点を発見した。これにより相当の利益がもたらされるだろう。"
 yaliluo_story.200.name:0 "長い道のり"
 yaliluo_story.200.desc:0 "我々は造物エンジン修復に必要な原材料をほぼ調達し、粗加工の一部も完了した。しかし、これらは万里の長征の第一歩に過ぎない。材料の収集には多くの時間と労力を費やしたが、技術が比較的遅れていることを考慮し、様々な信頼性試験のために予想をはるかに超える原材料を収集した。いずれにせよ、我々は第一歩を踏み出した。これは星海への復帰の始まりである。"
 yaliluo_story.200.a:0 "只争朝夕…"
 yaliluo_story.200.a.desc:0 "大守護者は1§G発展ポイント§!、1§H内政ポイント§!、1§R軍事攻撃ポイント§!、1§R軍事防御ポイント§!、1§M研究ポイント§!、1§B外交ポイント§!を獲得する。"
 yaliluo_story.201.name:0 "建造範囲の拡大"
 yaliluo_story.201.desc:0 "ベロブルグ技術委員会の絶え間ない努力により、造物エンジンの各モジュールの建造可能性方案は全て承認された。当務の急務は建設を開始することである。しかし、彼らは造物エンジンを同時に複数建造する可能性について予備的な提案を行った。造物エンジンの建造速度と資源量を考慮すると、拡張建造の数を合理的に計画する必要がある。"
 yaliluo_story.201.a:0 "検討する必要がある。"
 yaliluo_story.202.name:0 "さらなる造物エンジン"
 yaliluo_story.202.desc:0 "科学者たちは実行可能性方案を提出した。ベロブルグの現在の総資源量、人的資源、異星貿易、外宇宙採掘などの要素を考慮すると、最大5台の造物エンジンを建造・維持できる。しかし、追加で造物エンジンを建造すると計画の進行に影響を与える可能性があり、その利点と欠点を比較検討する必要がある。"
 yaliluo_story.202.a:0 "適切な範囲内でさらに建造してもよいだろう。"
 yaliluo_story.202.a.desc:0 "惑星決議を解放：さらなる造物エンジン。"
 yaliluo_story.203.name:0 "工事再編"
 yaliluo_story.203.desc:0 "工事部、技術部、後方指揮部の共同努力により、必要な部品は全て製造され、造物エンジンのフレーム修復もほぼ完了した。我々は計画完了にまた一歩近づいた。現在最も解決すべき問題は組立であり、人的資源が不足しており、ロボットの数も足りず、この任務を完全に遂行できるとは言えない。この困難を克服しなければならない。"
 yaliluo_story.203.a:0 "万難を排す！"
 yaliluo_story.204.name:0 "さらなる機械ユニット"
 yaliluo_story.204.desc:0 "組立工場はロボットの生産を強化し、不足する労働力を補った。同時に、より多くの人々を組立プロセスに参加させるため、経験豊富な労働者が新人を迅速に指導する体制を整えた。"
 yaliluo_story.204.a:0 "我々は時間と競っている！"
 yaliluo_story.204.a.desc:0 "ヤリロ-VIは2体のロボット人口を獲得する。"
 yaliluo_story.205.name:0 "エネルギー収集"
 yaliluo_story.205.desc:0 "最後の造物エンジンの組立作業が最終段階に入るにつれ、我々は造物エンジンにエネルギーを供給するために地髄の大量採掘を開始した。地髄の採掘には地下深くでの作業が必要である。ベロブルグの地髄埋蔵量は限られているため、地表では裂界浸食を受けているが地下には地髄鉱脈がある地域を掘削するための大規模な地下鉱区を建設しなければならない。ベロブルグは地髄開拓団計画を再開し、より多くの地髄を採掘するために新たな開拓団を組織することを決定した。今回の採掘需要は非常に大きく、採掘の深度と広範囲に及ぶため、安全を確保した上で採掘を行うよう各部に要求を出している。"
 yaliluo_story.205.a:0 "安全第一。"
 yaliluo_story.206.name:0 "爆発！"
 yaliluo_story.206.desc:0 "複数の開拓団から、前進中または採掘中に爆発が発生したとの報告があった。初期調査の結果、裂界浸食の影響で一部の地髄が長年にわたる浸食により変化し、その性質がより活性化し不安定になっていることが判明した。我々は各開拓団により注意を促し、より先進的な地髄探査機を装備し、負傷者の迅速な撤退を手配するよう通知した。"
 yaliluo_story.206.a:0 "なんて恐ろしい！"
 yaliluo_story.207.name:0 "予期せぬ発見"
 yaliluo_story.207.desc:0 "いくつかの開拓団から朗報が届いた。鉱石資源も発見したという。これらの鉱石の品質は上質だが、数量は少なく、一部は採掘が極めて困難なため断念せざるを得なかった。"
 yaliluo_story.207.a:0 "朗報だ！"
 yaliluo_story.208.name:0 "旧世界の遺物"
 yaliluo_story.208.desc:0 "いくつかの探査隊は、採掘中に旧時代の遺物を発見したと報告している。これらの遺物のほとんどは損傷しており、具体的な正体を特定することは困難であるが、いくつかは旧式のロボットの部品や武器であると識別できる。これは過去の戦闘の遺跡であると考える者もいれば、かつて研究所だった可能性を指摘する者もいる。"
 yaliluo_story.208.a:0 "失って初めて大切さを実感する…"
 yaliluo_story.209.name:0 "エンジンテスト"
 yaliluo_story.209.desc:0 "エネルギー収集の完了と各部品の分散エンジン起動テストの完了により、造物エンジンの建造部分は完了した。この山のような巨大な物体に、我々はまだ適応するのに時間が必要だ。最初の完全にエネルギーを搭載した造物エンジンが総合エンジンテストを完了した。現場は拍手と歓声が雷のように響き、皆の努力は無駄ではなかった。これはヤリロが生まれ変わる千載一遇の機会である。"
 yaliluo_story.209.a:0 "今こそ！"
 yaliluo_story.210.name:0 "病巣の根絶！"
 yaliluo_story.210.desc:0 "エンジンが装備され、テストと訓練が完了した。今や成すべきは病巣を根絶することである。設計によれば、造物エンジンには最新の対裂界装備が搭載されており、大量の裂界浸食を同時に吸収し、自身のエネルギーに変換することができる。我々の全地上防御部隊は造物エンジンのクルーと協力し、惑星表面の全ての裂界を殲滅し、裂界の自己複製と継続的な浸食を根絶する。"
 yaliluo_story.210.a:0 "先人たちの未完の事業を成し遂げる！"
 yaliluo_story.211.name:0 "再び陽の光を見る"
 yaliluo_story.211.desc:0 "「造物エンジン中核アレイ出力が臨界値を突破——99.7%...99.8...100%！」最後の校正パルスがノヴゴロド上空の裂界群を貫いた時、全監視ステーションの量子共振器が同時に沈黙した。七百年ぶりに、ヤリロ-VIの天穹は赤い裂け目によって裂かれることはなくなった。光と熱を飲み込み、物理法則を歪めていた虚空の傷は、惑星規模の地質改造パルスの轟撃の下で、烈日に晒された薄氷のように完全に消え去った。ベロブルグ中央広場の初代守護者の銅像が突然、暗号化された録音を再生し始めた：「後継者よ、もしこの声が聞こえたなら、青空を見てほしい。」\n主任技師の日誌より：「今日、我々はついにあの忌々しい裂界を素粒子まで粉砕した！最初の青色の光が雲の彼方に現れた時、都市中がスパナや缶、凍ったジャガイモで音を立てるものすべてを叩き鳴らしていた。ある老人は曽祖父の遺影を抱えて『見えたか！』と叫び、通り中の人々がそれに続き、その声は造物エンジンの轟音をもかき消すほどだった。正直なところ、明日またエイリアンの怪物が襲ってきたとしても——そんなことはどうでもいい、少なくともこの瞬間は価値があった。」"
 yaliluo_story.211.a:0 "我々は遠くの灯火まで歩き、ベロブルグの姿を描き出す……"
 yaliluo_story.212.name:0 "維持再始動"
 yaliluo_story.212.desc:0 "前回の作戦と今回の惑星浄化の必要性から、多くの武器モジュールを惑星浄化装置に交換し、造物エンジンの徹底的な点検と保守を行う必要がある。今回の浄化計画は、惑星内部に潜む可能性のある裂界の除去と寒波の影響への対処、さらに惑星の気候を可能な限り完璧に改造することを目的としている。"
 yaliluo_story.212.a:0 "この忌々しい寒波を終わらせる時だ。"
 yaliluo_story.213.name:0 "惑星大浄化"
 yaliluo_story.213.desc:0 "今日、ベロブルグの裂界検出システムの60％が惑星深部に向けられている。改造、保守、充填を経て、造物エンジンは浄化作業を開始し、ヤリロをガイア惑星に改造する。大量のエネルギー流が惑星表面に注入され、壮大な大浄化が始まった。浄化開始から一日後、ベロブルグ気象観測所は惑星の平均気温が数度上昇し、目標に向かって徐々に近づいていると報告した。"
 yaliluo_story.213.a:0 "着実に前進。"
 yaliluo_story.214.name:0 "寒波終焉"
 yaliluo_story.214.desc:0 "長期間の改造を経て、現在ヤリロの気候は変化している。寒波は後退し、花々が再び咲き、動植物が大量に生い茂っている。現在の目標は、それを完全にガイア惑星に改造し、安定を維持することである。"
 yaliluo_story.214.a:0 "桑田変じて海となる。"
 yaliluo_story.215.name:0 "宇宙へ飛び出し、青空を超える！"
 yaliluo_story.215.desc:0 "今日、ベロブルグ行政区の広場は人で溢れ、人々は大守護者の演説を聞いている。「同胞たち、熱心で無私の異星の友たちよ、ここに我々はヤリロ-VI再起動計画を完了したことを宣言する！裂界は永遠にヤリロ-VIから追放され、我々はもはや寒波の浸食を心配する必要はない。今、我々は真の星間文明となる資格を備えた。この偉大な事業のために犠牲となった人々を決して忘れてはならない……」演説は雷鳴のような拍手で終わった。我々は成功した。星々は我々を記憶するだろう。"
 yaliluo_story.215.a:0 "我々は成功した！"
 yaliluo_story.216.name:0 "岐路"
 yaliluo_story.216.desc:0 "新たに生まれた星間文明にとって、発展の道と方向性は特に重要である。今、ベロブルグはこの問題を検討しなければならない。一部は、かつてのように研究と貿易に注力し、銀河の大舞台に絶えず進出することを望む。他方は、宇宙の他の存護勢力との連携を強化し、特に最大の存護勢力である星間平和会社との関係を重視すべきだと考える。また、星核・裂界に侵食された惑星を積極的に支援すべきだという見解もある。現在はまだ弱小だが、我々の経験を活かして彼らを助け、星核の影響を受けた世界を団結させて共同で立ち向かうことができる。"
 yaliluo_story.216.a:0 "我々は旧日の栄光を取り戻す。"
 yaliluo_story.216.b:0 "我々は存護の信仰を同じくする。"
 yaliluo_story.216.c:0 "我々は星核の影響を受ける可能性のある世界を支援すべきである。"
 yaliluo_story.217.name:0 "旧日の栄誉"
 yaliluo_story.217.desc:0 "ヤリロはかつてこの星海に輝かしい文明の歴史を残した。我々はこの星域で最大の貿易量、最高の技術水準、最も豊かな文化を誇る惑星——ヤリロ-VIであった。現在、この再興の時期において、我々は先人の道を歩み、実力を絶えず強化し、ヤリロを再び星海の大舞台に戻さなければならない。"
 yaliluo_story.217.a:0 "我々は先人たちの輝かしい歴史を継承する。"
 yaliluo_story.218.name:0 "汎存護勢力"
 yaliluo_story.218.desc:0 "「愚者は肉体を壁とし、貪欲者は金銭を壁とする。終末が訪れれば、彼らは同じ灰燼となる。」\n伝説によれば、「存護」のクリフォーは最も古い星神である。彼は沈黙して着実に、光年単位で星河を巡る障壁を築き、銀河の騒がしい紛争に干渉せず、他の星神の嘲笑の呼びかけにも応じない。銀河の文明は彼の動機を様々に推測する：古の星神が宇宙を消滅させる危機を予見し、万千の世界を「存護」するために障壁を築くという説もあれば、クリフォーは他の星神の苦役として喜んで仕え、彼らのために城壁を築くという説もある。真相は確認できないが、彼の絶え間ない努力は凡人を駆り立て、彼らは自発的に集まり、惑星を守るための壁を築き始めた。築城者の中には、「存護」の神のまなざしを感じたと主張する者もいる。そのまなざしは賛意を示し、鍛冶場の温もりと石灰の香りを伴っていた。一つの恒星の消滅は、千光年彼方の惑星に影響を及ぼし、それらを存亡の崖っぷちに追いやる可能性がある——そんな災難を経験した世界も、そびえ立つ壁によって守られたからこそ存続した。生き延びた人々は「築城者」たちの頑固さを嘲笑うことはなくなり、彼らの仲間に加わり、「存護」の動機や意味を問わなくなった。\n我々は存護を信奉する全ての銀河勢力と連絡を取り、存護の運命を実践すべきである。\n星間平和会社——最大の存護勢力として、我々は連携を強化すべきだが、自らの独立性を失ってはならない。"
 yaliluo_story.218.a:0 "存護の輝き。"
 yaliluo_story.219.name:0 "銀河救援連盟"
 yaliluo_story.219.desc:0 "星核の浸食は単独の事例ではない。我々は唯一の被害者ではない。広大な銀河には、我々と同様に星核の毒に苦しむ弱小文明が多数存在する。同時に、我々の宇宙は危険に満ちており、文明を脅かすのは星核だけではない。我々は銀河救援連盟を結成し、様々な危機に侵食された世界を支援すべきである。"
 yaliluo_story.219.a:0 "団結こそが力だ！"
 yaliluo_story.220.name:0 "自らの強化"
 yaliluo_story.220.desc:0 "安定した強固な文明だけが、他者を助ける余力を持つことができる。我々はヤリロ-VIをより良く建設し、より多くの人々に星核との戦いを知ってもらい、我々との交流を望む文明に発展の成果を見せるべきである。"
 yaliluo_story.220.a:0 "我々はより強くなる。"
 yaliluo_story.221.name:0 "志を同じくする人々"
 yaliluo_story.221.desc:0 "銀河には我々と志を同じくする多くの異星人がいる。例えば、巡海游侠——自発的に結成された義侠団体であり、宇宙の善良さと正義は個人の行動によって実現されると信じている。もし彼らが我々を助けてくれるなら、ますます多くの助力を得られるだろう。"
 yaliluo_story.221.a:0 "侠の極致、星を抱く。"
 yaliluo_story.222.name:0 "連盟の結成"
 yaliluo_story.222.desc:0 "星核浸食と戦う人々や、様々な天災に苦しむ人々はさらに多く存在する。我々は彼らに援助の手を差し伸べるべきである。もし彼らが我々に加わる用意があれば、連邦を結成して共に戦おう。もし連邦結成の時期がまだ熟していなければ、必要な支援を提供しよう。"
 yaliluo_story.222.a:0 "我々は孤独ではない。"
 yaliluo_story.222.a.desc:0 "連邦タイプを解放：§H銀河救援連盟§!\n大守護者は1§G発展ポイント§!、1§H内政ポイント§!、1§R軍事攻撃ポイント§!、1§R軍事防御ポイント§!、1§M研究ポイント§!、1§B外交ポイント§!を獲得する。"
 yaliluo_story.300.name:0 "外宇宙探査・建設計画"
 yaliluo_story.300.desc:0 "星間旅行能力を持つ小型科学船と基礎的な建造能力を持つ小型工兵船が建造の最終段階に近づいている。星間平和会社の艦船と比較すると、我々の艦船はやや粗雑ではあるが、基本的な需要は満たせる。一部からは、星間平和会社の指導を招いたり、より高度な部品を購入して安全性と効率を向上させるべきだという提案がある。"
 yaliluo_story.300.a:0 "このままでいい、資金は限られている。"
 yaliluo_story.300.b:0 "おそらく彼らを招いて、問題を排除するための指導を依頼してもよい。"
 yaliluo_story.300.c:0 "より先進的な部品を使用しよう。安全第一だ。"
 yaliluo_story.301.name:0 "探査と採掘"
 yaliluo_story.301.desc:0 "ベロブルグ発展委員会が主導し、最初の異星資源探査・採掘チームが編成され、訓練を完了した。彼らの目標は、潜在的な異星資源の探査・採掘と採掘ステーションの設立である。出発に際し、大守護者はベロブルグ全人民を代表して深い敬意と祝福を表した。ベロブルグ技術委員会は発展委員会と協力し、異星探査関連の技術と人材育成を継続的に改善し、発展の需要を満たす。"
 yaliluo_story.301.a:0 "ベロブルグの未来のために！"
 yaliluo_story.301.a.desc:0 "§Rヤリロ-VI§!は研究ポスト1つと快適度5を獲得する。\n大守護者は1§G発展ポイント§!を獲得する。"
 yaliluo_story.302.name:0 "未だ完全に統合されていない力"
 yaliluo_story.302.desc:0 "ここしばらく、星核危機の解決、造物エンジン修復計画、星間平和会社の債務紛争を経て、内部には多くの意見が存在する。主要な見解は、当分の間は造物エンジン修復計画を優先し、軍備と発展力を立て直し、裂界浸食をヤリロから完全に追放すべきだというものである。意見の相違は外部勢力に対する見方にある。地火組織、下層鉱区、多くの労働者、一部の学者・専門家は、星間平和会社のような支援が極めて重要ではあるが、彼らの目にはヤリロ-VIは夜空の無数の星々と同じく、ただの普通の小さな惑星に過ぎないと考えている。しかし我々にとっては、唯一の故郷である。もし会社に過度に依存すれば、ベロブルグは手を引かれて歩く子供のようなものになるだろう。表面上は走ったり跳ねたりできても、いったん手が離れれば、足の弱さが露呈する。別の人々は消極的で悲観的な態度をとる。このような長期的な計画に対し、外部の助けがあっても完了は困難であり、あるいは完了前に裂界に飲み込まれる可能性が高いと考える者もいる。さらには、第二の故郷を探し、ヤリロを放棄すべきだと提案する者さえいる。また、星間平和会社に妥協し、完全に会社勢力に傾倒して属国となることを支持する派閥もある。この見解を持つ者は主に上層区の保守派勢力であり、彼らは権力と一部の貿易資源を掌握し、大守護者の現在の決定を批判し、その欠点を捉えて攻撃しようとしている。"
 yaliluo_story.302.a:0 "我々はさらに深い対話と意見の統合が必要だ。"
 yaliluo_story.303.name:0 "共通の目標"
 yaliluo_story.303.desc:0 "否定できないのは、会社の援助なしではベロブルグは単独で復興を成し遂げられなかったということだ——それを否定する者はいないだろう。しかし同時に、会社の重要性は過大評価されており、一部の者はそれを天から降りた救世主と見なし、あの黒服の連中が慈善心から我々を助けに来たと信じている。これまで会社は提供したサービスに対して一切の費用を請求していないが、だからといって彼らが利益を得られないわけではない。秩序は最大の資産であり、秩序の所有者は多くのものを簡単に得ることができる。君主は耕作せずとも最高の食物を享受し、農民はその関係を維持するために苦心する。なぜなら彼らの労働は秩序の中でしか報われないからである。全てを支配する野心は、しばしば全てを救済する善意に偽装される。宇宙市場と接続すれば、我々は必然的に会社の秩序に形成され、口座の数字を追い求めることになる。その時、我々は地下の鉱脈を掘り尽くし、体内の血液を絞り尽くして、ようやく一部の人々が携帯電話に映るような生活を享受できるかもしれない。我々は感謝と喜びに浸ってはならず、警戒と冷静さを保たなければならない。一方、会社は外来者である。彼らの目には、ヤリロ-VIは夜空の無数の星々と同じく、ただの普通の小さな惑星に過ぎない。しかし我々にとっては、唯一の故郷である。もし会社に過度に依存すれば、ベロブルグは手を引かれて歩く子供のようなものになるだろう。表面上は走ったり跳ねたりできても、いったん手が離れれば、足の弱さが露呈する。現在の援助が我々の子孫を溺れさせる川となることを決して許してはならない！ヤリロ-VIと外界との格差は確かに存在するが、決して埋められないものではない。銀河の中で真に尊厳ある一員となるためには、我々は他人の付属物ではなく、自らの道を歩まなければならない。\n学び、模倣し、美しいものをもたらすすべてを探し求めよう。そうして初めて、未来の子供たちは星々と肩を並べることができ、その輝きの下で涙を流すのではなくなるだろう。"
 yaliluo_story.303.a:0 "団結できるすべての力を団結させよ、ヤリロの未来のために！"
 yaliluo_story.303.a.desc:0 "修正を除去：§R未だ完全に統合されていない力§!。大守護者は1§B外交ポイント§!と1§G発展ポイント§!を獲得する。"
 yaliluo_story.304.name:0 "共通の未来"
 yaliluo_story.304.desc:0 "我々は七百年以上にわたって風雪に耐えてきた。諦める理由も、諦めることもできない。ヤリロの復興を完了することは、我々が望む共通の未来である。より多くの人々が、どのような立場であれ参加する必要がある。"
 yaliluo_story.304.a:0 "皆で共に励もう。"
 yaliluo_story.304.a.desc:0 "この地域の伝説的指導者の追加募集を許可する。\n大守護者は1§H内政ポイント§!を獲得する。"
 yaliluo_story.305.name:0 "インフラ整備"
 yaliluo_story.305.desc:0 "生産と建設が本格化するにつれ、多くのインフラが復旧・再建された。現在、エネルギーシステムを強化するための資金を調達している。一部は電力施設の優先的な向上を主張し、他方は鉱業開発の振興を優先すべきだと考える。"
 yaliluo_story.305.a:0 "鉱山区画を建設する。"
 yaliluo_story.305.a.desc:0 "ヤリロは鉱山区画1つと$d_mineral_block$区画1つを獲得する。"
 yaliluo_story.305.b:0 "エネルギー区画を建設する。"
 yaliluo_story.305.b.desc:0 "ヤリロは発電区画1つと$d_energy_block$区画1つを獲得する。"
 yaliluo_story.306.name:0 "星間文明—外交方針"
 yaliluo_story.306.desc:0 "我々の発展に伴い、将来的には多くの異星文明と遭遇することになるだろう。我々にとって、安定した平和的な外部環境は極めて重要である。今、我々は対外方針を再定義すべきである。"
 yaliluo_story.306.a:0 "協力と共栄こそが未来である。"
 yaliluo_story.306.a.desc:0 "大守護者は1§B外交ポイント§!を獲得する。"
 yaliluo_story.306.b:0 "対外探索の強化。"
 yaliluo_story.306.c:0 "貿易を優先する。"
 yaliluo_story.320.name:0 "さらなる裂界研究"
 yaliluo_story.320.desc:0 "ベロブルグは裂界の研究を決して止めてこなかった。世代を超えた努力により、小型裂界を除去する技術が開発された。それは改造された地髄エネルギーを利用した対抗装置であり、起動すると中小都市規模の裂界浸食を除去し、小型裂界の駆逐を支援することができる。"
 yaliluo_story.320.a:0 "徹底的に研究しなければならない。"
 yaliluo_story.320.a.desc:0 "大守護者は1§M研究ポイント§!を獲得する。"
 yaliluo_story.321.name:0 "裂界回収研究"
 yaliluo_story.321.desc:0 "実験により、裂界が後退する際に微少な虚数エネルギーを捕捉できることが判明した。これらの虚数エネルギーを研究して技術水準を向上させるか、直接エネルギーとして回収することができる。"
 yaliluo_story.321.a:0 "研究のために回収する。"
 yaliluo_story.321.a.desc:0 "裂界除去後に物理学・社会学・工学研究ポイントを15ずつ獲得する。"
 yaliluo_story.321.b:0 "エネルギーとして回収する。"
 yaliluo_story.321.b.desc:0 "裂界除去後にエネルギー貨70と鉱物50を獲得する。"
 yaliluo_story.401.name:0 "我々の故郷"
 yaliluo_story.401.desc:0 "[Root.GetName]の植民地が発展するにつれ、ますます多くの人々が新植民地と母星の間を往来している。一部はヤリロ-VIを放棄して新植民地に移住すべきだと鼓吹し、裂界浸食を回避し、大多数の人々を救えると主張している。多くの人がこれに異議を唱えている。星間ニュースによれば、星核による裂界浸食はごく普通の現象であり、もしヤリロ-VIを放棄して裂界に完全に侵食されれば、さらなる災害を生むことになる。我々は裂界から逃げることで身を守ることはできないし、現在の技術では侵食前に全員を撤退させることができるとは限らない。我々は七百年以上も裂界と戦ってきたのだ。今さら退くわけにはいかない！"
 yaliluo_story.401.a:0 "今、諦めるわけにはいかない。"
 yaliluo_story.402.name:0 "星天演武儀典"
 yaliluo_story.402.desc:0 "少し前、ベロブルグの星間通信基地が復旧した。一ヶ月前、我々は信号が少し歪んだ「招待状」を受信した——「仙舟『羅浮』はヤリロ-VIの戦士たちを演武儀典に招く。」寒波が到来する前、我々は多くの世界と連絡を持っていた。伝説の戦士イーゴリ・ハフトは軍団の侵略前にヤリロ-VIを離れ、おそらく演武儀典に参加していたが、その後故郷に戻り、軍団侵略に対する戦争に参加した。仙舟連盟がなぜ我々を招待するにせよ、この「演武儀典」への参加はベロブルグにとって大きな意義を持つ。それは銀河が再び我々を認識する機会を含んでいる——軍団と寒波から強く生き残った英雄的な国として。また、これにより仙舟連盟と簡単な交流を確立できれば、会社との交渉においてもより多くの切り札を得ることができる。ベロブルグが銀河社会に復帰するのを助けるため、ルカは時代遅れの招待状を手に、仙舟「羅浮」へと向かい、星天演武儀典に参加した。"
 yaliluo_story.402.a:0 "行け、若き戦士よ。"
 yaliluo_story.403.name:0 "喝采が止んでも"
 yaliluo_story.403.desc:0 "ブースビルの銃口に直面して、ルカは勇敢に拳を振るい、「名誉ある敗北」を勝ち取った。しかし、圧倒的な実力差はルカの自信を深く打ち砕いた。彼はもう前進したくなかった。幸い、テイル様がすぐに介入し、ルカを自己消耗の穴から引き上げた。\nルカは人気復活戦でアルジェンティの認可を得て、星天演武儀典の舞台に復帰した。ルカは徐々に「競鋒守擂」に近づき、イーゴリの残念な経歴にも近づいていった。\nルカはかつてスヴァローグに挑戦し、敗れた。今、「競鋒守擂」の舞台に上がる前に、彼は再びスヴァローグに挑戦する機会を得た。今回は、ルカが勝利した。\nルカの「星天演武儀典」は終わった。残念ながら彼は勝利を収められなかったが、この物語のすべての人がそれぞれの望みを叶えた。ルカは銀河レベルのスポーツスターとなり、ベロブルグと仙舟「羅浮」との間の相互貿易協定の締結も間接的に促進した。景元は別の形で旧友と再会し、過去の遺恨を埋めた。イーゴリは最終的に故郷を救うことに成功した。喝采が既に止んだ後であっても。"
 yaliluo_story.403.a:0 "よくやった、ルカ！"
 yaliluo_story.403.a.desc:0 "星間平和会社、仙舟連盟、黒塔宇宙ステーションから各10の好感度を獲得する。"
 yaliluo_story.404.name:0 "仙舟「羅浮」-ベロブルグ相互貿易協定"
 yaliluo_story.404.desc:0 "「永冬碑石の証の下、我——大守護者ブローニャ・ランドは宣言する：『仙舟「羅浮」-ベロブルグ相互貿易協定』は本日より効力を発揮する！」\n「私はベロブルグの物語を聞いたことがある。この地の人々は最も絶望的な時にも『存護』の意志を固く守り、運命に屈することなく黎明を迎えるまで戦い続けた。私が自らこの英雄の地に足を踏み入れ、まだ消えていない氷雪が皮膚を灼くように感じるまで、その『存護』の意志がどれほど重く、この地で闘う人々がどれほど偉大であるかを知らなかった。今日から、仙舟『羅浮』は君たちと共に戦う。寒波が春風に変わり、凍土が良田に変わるまで。」"
 yaliluo_story.404.a:0 "仙舟「羅浮」-ベロブルグの友情よ永遠なれ"
 opinion_yaliluo_xianzhou_help:0 "仙舟「羅浮」-ベロブルグ相互貿易協定"
 opinion_xianzhou_help:0 "援助"
 yaliluo_story.500.name:0 "極地探検隊-第一報告書"
 yaliluo_story.500.desc:0 "極地探検隊記録：第一地点 ベロブルグ外東区。この地域は広範囲が積雪に覆われ、気温は寒冷で植生はまばらであり、多くの山々がそびえている。山に沿って建設された東区資源ステーションを発見した。積雪の下に埋もれており、小さな穴から辛うじて内部に侵入できたが、中には分析する価値のあるものはほとんどなかった。なぜなら撤退時にほぼ全ての持ち運び可能な物資を撤収しており、残りは地下深くに埋められているからだ。立ち去ろうとした時、岩のそばでいくつかの古代の金属貨幣を発見し、七百年もの間、裂界に侵食されていなかった時代を偲ばせた。"
 yaliluo_story.500.a:0 "探索を続ける。"
 yaliluo_story.501.name:0 "極地探検隊-第二報告書"
 yaliluo_story.501.desc:0 "極地探検隊記録：第二地点 ベロブルグ外極東区。いくつかの旧時代の建築物を発見したが、既に荒廃していた。この地域を極東区と呼んでいるが、まだ広大な未探索地域が残っている。ここで偶然、廃屋の中に損傷した電子機器を発見した。スキャンした結果、記憶装置であることが判明した。軽微な修復を行ったところ、反物質軍団の攻撃記録が含まれていることが分かった。この時点で裂界の根系に近づいており、すでにいくつかの怪物が徘徊していた。我々は多大な労力を費やして脱出したが、幸い死傷者はなかった。"
 yaliluo_story.501.a:0 "なんてことだ。"
 yaliluo_story.502.name:0 "極地探検隊-第三報告書"
 yaliluo_story.502.desc:0 "極地探検隊記録：第三地点 ベロブルグ外南区。この地域には一部の生物がまだ生存しているとの記録がある。旧時代には大きな自然保護区があったが、残念ながら特筆すべき発見はなかった。しかし、隊員の一人が大型の擬態雪蛞蝓を発見した。その大きさとスキャンによる年齢は驚くべきものであり、しかも生存していた。これは現在の気候改善に関係している可能性がある。"
 yaliluo_story.502.a:0 "興味深い。"
 yaliluo_story.503.name:0 "極地探検隊-第四報告書"
 yaliluo_story.503.desc:0 "極地探検隊記録：第四地点 ベロブルグ外西区。この地域はかつて科学研究開発区域であり、多くの地表建築物や研究所を発見した。小さな旧式研究所に入って調査したが、価値あるものはなかった。なぜならそれも我々が既に搬出していたからだ。角っこで一袋の地髄活性化部品を発見した。我々のものとは異なり、集積度が高く非常に小型だった。地図修正のために多くの有用な位置情報を記録した。"
 yaliluo_story.503.a:0 "素晴らしい。"
 yaliluo_story.504.name:0 "極地探検隊-第五報告書"
 yaliluo_story.504.desc:0 "極地探検隊記録：第五地点 ベロブルグ外北区。北区の裂界根系の数は非常に多いため、歴史的最北区に到達した時、これ以上前進できないことが判明した。脱出に多大な労力を費やしたが、幸運にもこれまで訪れたことのない旧市街地に到達した。廃墟となった建物が掩蔽物となり、反物質軍団からの脱出を助けた。地形を考慮し、地図上でおおよその位置を特定した。沿道では、凍り付いた裂界怪物の破片をいくつか発見した。隊内の生物学者は意義があると考え、一つ持ち帰ることにした。今、我々はベロブルグに戻ることを決定した。"
 yaliluo_story.504.a:0 "おかえり。"
 yaliluo_story.1001.title:0 "クリフォー堡事務所"
 yaliluo_story.1001.desc:0 "執政官邸はベロブルグの中央に位置し、そびえ立つ塔と直結しており、希望と指針を象徴している。生存文明の権力中心として、執政官邸は歴代の執政官と後継者が公務を処理し居住する場所である。煦日祭の計画から裂界の怪物の侵入にどう対処するかまで、共同体の様々な決議はここから発せられる。歴代の執政官は守護者プラミアの意志を受け継ぎ、その命令に従い、壁で風雪を防ぎ、意志で灯火を守り、共同体の民を利し、生存する文明を存続させてきた。"
