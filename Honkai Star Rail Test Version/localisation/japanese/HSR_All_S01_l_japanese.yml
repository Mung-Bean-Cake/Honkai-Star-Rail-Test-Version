#開始紹介
Herta_Space_Station_start_screen_messages:0 "「知性の伝承」という理念を掲げ、自由で広範な研究に従事する。星河は永遠の詩編であり、「黒塔」宇宙ステーションはゆっくりとその書物を開いている。黒塔はかつて、星域を巡る収蔵品の多さに頭を悩ませていた。数が膨大で、保管が容易ではなく、本人はもちろん管理を嫌っていた。熱心で寛大な星間平和会社はすぐに方案を提案し、知恵と秘密を封じる宇宙ステーション「黒塔」が誕生した。ステーション内は収蔵品のために詳細な収容措置が定められ、「明確かつ合理的な中で万象を包み込む」ことを目指している。現象は特別な容器に収められ、奇物は奇物条目によって規範化される——多種多様な収蔵品は分類され、ステーションの奥深くに封蔵され、研究に供されている。その後、会社は共同で繁星の神秘を探求するイニシアチブを提案し、新知を求める学者たちが次々とステーションに駐留し、学問を始めた。職員たちはほとんどが黒塔を敬慕し、星空の理想を実践し、宇宙の繁星が囁く秘密を探求することを誓っている。彼らは星の生命の領域を探り、義理の議論の正義を明らかにし、星河原野の風貌を概観し、宗儀典祀の神秘を解明し、格物致知の精神を実践する。"
Stellaron_Hunters_start_screen_messages:0 "星間平和会社が発行した手配書：刃、シルバーウルフ、サム……以上の四人、生死は問わない。「運命の奴隷」に危害を加えたり、自立的思考能力を奪ったりしてはならない。ある静かな瞬間、「万界の癌」は浩瀚な星海に投じられた一石のように波紋を広げ、極めて短い時間で、これらの歪んだ不明瞭な物質は多くの世界を濁流で汚染した。しかし、泥滓と共に太陽の光と星の輝きの宝石——すなわち星核——が現れた。星核が及ぶところには、破壊と喪失が残された。様々な被害を受けた文明にとって、星核は破壊の象徴であった。それでもなお、星海には濁流の中で珠を求める者が現れた。彼らは自らを「星核猟手」と称し、星核を奪取するために異なる世界を往来する。その事績以外、「星核猟手」のすべては外部には知られていない。彼らが信奉する星神は何か、星核を奪う目的は何か……数多の噂の中で、宇宙全体で一致した見解はただ一つ：「星核猟手」はメンバーが少ないが、各自が非凡な腕前を持つということである。"
Belobog_start_screen_messages:0 "数千年前、当時のヤリロ-VIは年中温暖な気候と羨むべき海洋環境を有していた。森には果実が実り、潮風は湿った暖かさをもたらし、酒は泉のように手ですくって誰もが飲むことができた。現地の住民は非常に進取的で活力に満ちており、道路、都市、海辺の別荘、精巧な宮殿を建設した。豊かな生活は、朝の一杯のコーヒーで始まり、夕暮れの一杯の麦芽酒で終わるようだった。その後、星の軌道がヤリロ-VIの世界と繋がり、星間貿易と天外技術をもたらした。当初、異界の訪問者は地髄鉱石を求めてやって来た。これらの透明な鉱物は産業の血液を内包し、琥珀色の反射は存護の光を映していた。その後、異界の訪問者は長く快適な生活を求めてやって来た。その湾、ヤシの木、軽快なリズムの音楽は、疲れた旅人に安らぎの場を提供した——人々は、いずれこの湿潤な気候の惑星が他の輝く星々のように銀河で輝くと信じていた。約千年前、一つの星核が空を横切り、この世界に落下した。そして、惑星全体の運命は急転直下し、不条理な喜劇のようになった。凶暴な反物質軍団が天から降り注ぎ、戦火は至る所で燃え上がった。築城者たちは城壁と戦線を構築し、百メートルの巨像がそびえ立ち、竜型の巨獣と格闘した——その後、予告なく寒波が突然現れ、味方も敵も区別なく吹雪が全てを飲み込んだ。惑星全体が静寂に包まれた……見えない巨大な空間障壁が要塞都市を覆った。まるで寒夜の中で胸に抱えられた灯火のように、文明は存続した。その後、この都市はベロブルグと呼ばれるようになった。"
The_Interastral_Peace_Corporation_start_screen_messages:0 "対外的な宣伝では、会社は自由貿易を提唱する巨大企業財団である。運営方法としては、通貨を発行し資源を独占する商業独裁である。創業の初心に照らせば、会社は「存護」の星神のために全てを捧げる無私の後援者である。ほとんどの星間市民は会社について語るとき、常に遍在する商品と目を引く標識に言及する。まるで「取引が存在する限り、そこに星間平和会社がある」かのように。実際、銀河のほぼ全ての商業活動は会社の「信用ポイント」システムに基づいている。星間貿易をスポーツ競技に例えるなら、会社はトップアスリートであり、全ての競技種目であり、競技場であり、そしてルールそのものでもある。富に対する絶対的な支配力と、決して止まることのない拡張行動は、星間平和会社に陰謀独裁者のような大衆的印象を与えている。しかし会社は「一手に権力を掌握する」といった低次元のビジョンには微塵も関心がない。なぜなら企業精神は誕生の時から変わることなく、全てを「琥珀王」クリフォーに捧げることだからである。"
Amphoreus_start_screen_messages:0 "アンフォレウスの歴史は輪廻の叙事詩である。タイタンが最初に誕生し、世界と万物を創造した。しかし災厄の三タイタンが降臨した後、アンフォレウスの各都市国家は黒潮の脅威にさらされる。黒潮を平定するため、「黄金の裔」と呼ばれる英雄たちはタイタンを殺し、その火種を回収して半神に昇格し、タイタンの神権を行使する。十二の火種がすべて回収されると、アンフォレウスは再創世を経験し、時間軸がリセットされる。前世の負世半神は自らの記憶をもってアンフォレウスを再構築し、前世の半神は現世のタイタンとなる。既知の時代としては、啓蒙世、造物世、黄金世、紛争世、幻滅世の五つの時代が存在する。十二人のタイタンがアンフォレウスを創造した。三人が運命を紡ぎ、三人が天地を開き、三人が生命を捏ね、三人が災厄を導いた。"



