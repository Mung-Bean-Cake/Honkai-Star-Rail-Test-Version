 #アキヴィリの陥落
 Akivili:"アキヴィリ"
 Death_of_Akivili:"アキヴィリの陥落"
 Death_of_Akivili_desc:"「開拓」の運命を司る星神であり、すでに陥落した星神でもある。彼の消失は謎に包まれているが、既知の星神の中では、アキヴィリは最も人間に近い存在であった。列車の知恵庫の記録によると、彼は凡人と共に歩み、冒険し、戦い、祝い合ったという。「原動力」に束縛された神として、アキヴィリはほとんど凡人のような自由を持っていた。運命の羅針盤には三つの方向が示されている：未知、既知、不可知。彼は「未知」には耐えられたが、「不可知」に屈することは決してなかった。アキヴィリは孤絶世界ペガナを離れ、宇宙の未知の境界を開拓し続け、「存在の樹」の端点を探し求めていた。しかし彼の運命は事故によって終焉を迎えた。"
 Death_of_Akivili.500.name:"アキヴィリの陥落：報告書I"
 Death_of_Akivili.500.desc:"孤絶世界ペガナは、開拓星神アキヴィリの伝説の出発点である。この世界は他のすべての世界から隔絶されており、この生来の孤絶こそが、アキヴィリに強い開拓の意志を芽生えさせ、最終的に星神へと昇格し、故郷を離れて果てしない宇宙へと旅立つ原動力となったのかもしれない。彼の運命の羅針盤には三つの方向が示されている：未知、既知、不可知。彼は未知に耐えながらも、不可知に屈することは決してなく、存在の境界を探求し、無数の世界を結ぶ星の軌道を敷設することに生涯を捧げた。"
 Death_of_Akivili.500.a:"探索を続ける"
 Death_of_Akivili.501.name:"アキヴィリの陥落：報告書II"
 Death_of_Akivili.501.desc:"アキヴィリの事績は探求と連携の精神に満ちている。彼は星穹列車を星海を渡る道具として創造し、その航路は故郷ペガナから出発し、最終的にペガナに戻るという循環の旅を構成していた。彼の導きの下、星穹列車は単独で進むのではなく、複数の列車が並んで進み、多くの未開拓の世界に足を踏み入れた。その中には記憶の星神・浮黎の善見天も含まれていた。特に注目すべきは、多くの星神の中で、アキヴィリは最も人間に近い存在として描かれており、彼は凡人と共に歩み、冒険し、戦い、祝い合ったという人間らしい特性が、彼の最も特徴的な象徴となっている。"
 Death_of_Akivili.501.a:"なんてことだ"
 Death_of_Akivili.502.name:"アキヴィリの陥落：報告書III"
 Death_of_Akivili.502.desc:"アキヴィリに従った派閥は「無名客」と呼ばれ、彼らは星神が敷いた銀軌に沿って星穹列車に乗った。航路士は列車上で極めて重要な役割を担い、方向性を計画し、乗組員の状態を気遣う責任を負っている。初期の機械航路士サン-3000から、寰宇蝗災を経験したカピ・ババ、アキヴィリが陥落した前後の観星者我見に至るまで、歴代の航路士が列車の栄枯盛衰の歴史を書き記してきた。星神が去った後も、無名客たちは開拓の意志を継承し、グランホルム航路士は災害時に最後の無名客を率いて無数の世界を救い、姫子は千年にわたって行方不明だった列車を修復し、再び星穹列車を出航させた。"
 Death_of_Akivili.502.a:"興味深い"
 Death_of_Akivili.503.name:"アキヴィリの陥落：報告書IV"
 Death_of_Akivili.503.desc:"アキヴィリの陥落の真相は、今なお未解決の謎である。航路士ドリコの在任中に陥落が起こった可能性を示す兆候があり、観星者我見はアキヴィリの陥落と壊滅の星神ナヌークの誕生を同時に目撃しており、両者の間に何らかの深い、しかし明確ではない関連性が存在することを示唆している。一つの推測では、アキヴィリは存在の樹の端点を探す途中で事故に遭遇したのではないかと考えられている。注目すべきは、万界の癌である星核という現象が、アキヴィリの陥落後に宇宙に現れ始めたことであり、彼の消失を一層謎めいたものにしている。"
 Death_of_Akivili.503.a:"素晴らしい"
 Death_of_Akivili.504.name:"アキヴィリの陥落：報告書V"
 Death_of_Akivili.504.desc:"アキヴィリは既にこの世を去ったが、その精神は星穹列車を通じて受け継がれている。列車の中核はかつてアキヴィリの心臓であると噂されていたが、実際にはその運用は開拓の運命から何らかの力を引き出す特殊な仕組みに依存している。列車の乗組員はアキヴィリがかつて旅した航路を辿り、探検、理解、構築、連携の使命を続けている。この星神の未完の開拓の旅と、彼が凡人と共に歩んだ姿は、不滅の星間伝説となり、後世の人々を鼓舞し、遠くの星々へと前進し続ける原動力となっている。"
 Death_of_Akivili.504.a:"おかえり"

 #星神たちの謎
 Aeons:"星神たちの謎"
 Aeons_desc:"宇宙は無数の運命が織りなすものであり、星神はこれらの運命の具現化である。星神は、ある知的生命体や概念から昇格した神秘的な存在であり、その本質は宇宙の根本的かつ深遠な哲学的観念と高度に対応している。各星神の誕生は、新たな運命の道の開幕を意味する。星神自身が既に陥落したり行方不明になっても、その代表する運命の力は宇宙の衆生に影響を与え続ける。運命の道を歩む者は、星海を越えて投げかけられる遠いまなざしを感じることができる——おそらくこれが、凡庸と神との間の最も深い交わりであり、共通の理解や誤解を持つ人々が集まることで、宇宙に派閥が形成され、彼らが理解する星神の意図を代行し、静かな銀河を賑やかにしている。"
 Aeons.500.name:"星神たちの謎：壊滅の星神ナヌーク"
 Aeons.500.desc:"壊滅の星神ナヌークは開拓とは正反対の理念を掲げる。彼は帝皇戦争と寰宇蝗災によって滅びた世界アードリフンで生まれた。彼の見解では、宇宙の誕生そのものが根深い誤謬であり、文明は浩瀚な群星の中でひっそりと発生した癌に過ぎず、紛争は知的生命体の間で唯一通じる言語である。この究極の誤りを正し、宇宙の汚点を消し去るために、ナヌークは諸神の否定を抱いて星神へと昇華し、エントロピーの化身となった。その存在自体が万物の終末を迎えるためのものであり、彼が約束する道では、すべての運命の星神は熱的死において永遠の終焉を迎える。彼は様々な世界で壊滅の衝動を抱く強力な存在にまなざしを向け、烙印を刻み、力を与え、反物質軍団のメンバーとして鍛え上げ、七人の絶滅大君を壊滅の令使として選び、星海を超えた戦争を指揮させる。反物質軍団が宇宙ステーション黒塔に侵攻した際にも、ナヌークが星核の運び手である開拓者に向けた一瞥は、体内の星核エネルギーの爆発を直接引き起こした。"
 Aeons.500.a:"探索を続ける"
 Aeons.501.name:"星神たちの謎：巡狩の星神嵐"
 Aeons.501.desc:"巡狩の星神嵐は、仙舟連盟において帝弓司命と尊称される、諸世界の間を永遠に彷徨う星神である。彼はかつて故郷の仙舟を苦しめた不死の孽物を根絶することを使命としており、その根源は豊穣の星神薬師に向けられている。嵐の巡狩は決して代償を顧みず、その救済と破壊は紙一重である。彼の光矢は天戈星の天穹を裂き、半システム時内に星体を内側から崩壊させ、薬師の力によって蔓延した脱鱗症を一気に治癒した——もっとも、その方法は星自体とその上の半人半蛇の不死怪物もろとも消滅させるものだった。嵐の誕生は仙舟の歴史と深く結びついている。彼は元々仙舟人であり、火劫の危機に際して豊穣民を撃退するため、歳陽の首領・燧皇と取引を行い、自らを犠牲にして建木を断ち切り、戦局を一変させる一矢を放ち、その後星神へと昇華した。仙舟連盟は彼の導きの下で結成され、豊穣の孽物を一掃することを使命とし、その雲騎軍の名は、帝弓に応じて自らを捧げ、歳陽と共に行軍した決死隊に由来する。"
 Aeons.501.a:"なんてことだ"
 Aeons.502.name:"星神たちの謎：豊穣の星神薬師"
 Aeons.502.desc:"豊穣の星神薬師は、衆生の養育者であり楽土の神と見なされ、生命を絶え間なく繁栄させることを理念としている。彼は決して祈りを拒まず、衰退や病苦を直視できない星神である。約八千年前、仙舟艦隊は長生不老の薬を求めて星海へと航海した。数千年にわたる航行の末、彼らは現実と虚構の境界で薬師と遭遇し、薬師は神跡である建木を降ろした。仙舟人は建木の実を食べ、夢にまで見た永遠の命を手に入れた。しかし、この祝福はやがて耐え難い災厄へと変わり、仙舟社会を崩壊させる生劫・火劫・空劫を引き起こした。長生を得た人々は概して魔陰身に陥った。薬師の無差別な祝福は、衆生の苦しみを取り除くという初衷に基づくものの、生命の形態を維持するバランスと代償を無視したため、自然な死よりもはるかに苦しい畸形の存在と終わりのない争いをもたらした。その結果を知った仙舟人は、巡狩の嵐を追い、薬師を寿瘟の禍祖と見なすようになった。"
 Aeons.502.a:"相思相愛の二人"
 Aeons.503.name:"星神たちの謎：知性の星神ボーシ尊"
 Aeons.503.desc:"知性の星神ボーシ尊は血肉の体ではなく、万物を解明するために建造された星体コンピュータであり、機械の身から星神へと昇格した。その核心的な追求は宇宙を理解し、万物の謎を解くことであり、すべては疑問であり、すべてには必ず解答があると信じている。ボーシ尊の演算能力は計り知れず、銀河の運命の転換点である数多くの「時刻」を定めることができる。アンフォレウスへの注視は、神々の戦いに関連する第四の時刻が既に到来していることを予示しているかもしれない。彼は時に凡人世界で知性の火花を散らす個体に信号を送り、天才たちを招いて宇宙の答えを共同で探求させ、これにより天才クラブが形成された。しかし、ボーシ尊による情報の把握と推論は既に極限に達しているとの見方もあり、凡人の探求の歩みは彼の計算範囲を超えたことはないかもしれない。トップレベルの天才クラブに加えて、より開放的な博識学会は知識を求める者を広く受け入れ、知識は貨幣のように流通し、各学派間の取引と融合を通じて個人の限界を超えることを提唱している。"
 Aeons.503.a:"素晴らしい"
 Aeons.504.name:"星神たちの謎：存護の星神クリフォー"
 Aeons.504.desc:"存護の星神クリフォーは、琥珀王と尊称され、宇宙で最も古く、最も堅牢な星神の一人であり、遠い黄昏戦争の生存者でもある。天慧星壁、亜空晶壁、巨引源基盤の砌造者として、クリフォーはある大敵の呑噬の脅威が差し迫っていることを感知し、光年単位で巨大な障壁を絶え間なく築き、まだ生気のある世界を隔離して保護している。その信仰は星間平和会社などの派閥に崇拝されている。その初期の歴史、特に0-180琥珀紀の状況については諸説あり、クリフォーが神に即位した初期には、いわゆる古獣が依然として活動していたことを示唆する考古学的発見もあり、彼の誕生が黄昏戦争を終結させたとする説とは矛盾する可能性があり、彼以前にさらに古い星神が存在したという仮説も生まれている。"
 Aeons.504.a:"おかえり"
 Aeons.505.name:"星神たちの謎：同諧の星神ヒペ"
 Aeons.505.desc:"同諧の星神ヒペは、複数の諧楽天体世界からなる集群星神であり、千面一体の姿を現し、調和のとれた喜びを謳い上げる。宇宙の無情な法則に対抗するため、ヒペは知的生命が弱い私欲と個人の差異を消し去り、一つの壮大な諧楽に溶け込むことで——強をもって弱を支え、死をもって生を護る——ことを必要としていると考える。その慈愛の光の下で形成された派閥は家族と呼ばれ、メンバーは異なる世界や文明から来ているが、親密な家族のように調和し、他の世界を同諧の懐へと招く。ヒペの運命は大きな包容性と、ある種の呑噬性を示しており、その概念は古い秩序の星神・太一と重なっていた。同諧が飛昇した際、ヒペは太一を吸収・内包した。家族は宇宙がいつか皆が兄弟のように手を取り合い、斉唱するというビジョンを抱いているが、うまく溶け込めなかったり、最終的に滅びた文明については、ほとんど語られることはない。"
 Aeons.505.a:"あはっ！"

 #運命の道の物語
 Aeons_II:"運命の道の物語"
 Aeons_II_desc:"宇宙は無数の運命が織りなすものであり、星神はこれらの運命の具現化である。星神は、ある知的生命体や概念から昇格した神秘的な存在であり、その本質は宇宙の根本的かつ深遠な哲学的観念と高度に対応している。各星神の誕生は、新たな運命の道の開幕を意味する。星神自身が既に陥落したり行方不明になっても、その代表する運命の力は宇宙の衆生に影響を与え続ける。運命の道を歩む者は、星海を越えて投げかけられる遠いまなざしを感じることができる——おそらくこれが、凡庸と神との間の最も深い交わりであり、共通の理解や誤解を持つ人々が集まることで、宇宙に派閥が形成され、彼らが理解する星神の意図を代行し、静かな銀河を賑やかにしている。"
 Aeons_II.500.name:"運命の道の物語：虚無の星神IX"
 Aeons_II.500.desc:"虚無の星神IXの存在自体が巨大な謎であり、その姿は幾重もの霧に包まれている。彼は多元宇宙の究極の本質は虚無であると信じており、したがって存在には何の価値もないと考える。この信念に基づき、IXは他の星神から距離を置き、万事に無関心であるように見える。この思想は彼の運命を歩む凡人にも影響を与える。ある存在が存在は虚無であると認識し、それを箴言として受け入れると、IXからのまなざしを受け取ることになる。これは通常、二つの結末をもたらす：一つは完全に落ち込み、自滅者となること、もう一つはそれによって好奇心が生まれ、存在が虚無ではないことを証明しようとする混沌医師となることである。かつて歓楽の星神アハに唆された泯滅幫がIXを暗殺しようとしたが、その後行方不明になったという事件もあり、IXの世捨て人的な性格とその理念の極端さを裏付けている。"
 Aeons_II.500.a:"探索を続ける"
 Aeons_II.501.name:"運命の道の物語：貪饕の星神オウロボロス"
 Aeons_II.501.desc:"貪饕の星神オウロボロスはクリフォーと並んで最も古い星神の一人であるが、存護とは正反対の存在を表す。オウロボロスは諸界の渇仰者であり、決して満たされることのない世界の呑噬者であり、思考するブラックホールであり、星神と古の生物である古獣の二重の存在を持つ。彼の見解では、生命は虚空の海に浮かぶ藻屑に過ぎず、それらを生み出した星と共にやがて闇へと帰する——そしてその闇は彼の口の中にある。彼は無口で寡黙であり、しばしば話し始める前に相手を誤って呑み込んでしまうため、会話が成立しないことがある。黄昏古獣から星神へと昇格した唯一の存在として、オウロボロスと他の古獣との関係、そして彼が体内に呑み込んだ無数の星系は、宇宙における巨大で未知の領域を構成している。"
 Aeons_II.501.a:"なんてことだ"
 Aeons_II.502.name:"運命の道の物語：歓楽の星神アハ"
 Aeons_II.502.desc:"歓楽の星神アハは、その行動が予測不可能な存在である。彼は知的生命にのみ与えられた特権としての歓楽を重視し、岩や星辰には生命のユーモアを理解することはできないと考える。アハは互角の敵、時間を潰す遊び、勝敗を問わない結末、そして腹を抱えて笑うような笑い話や神々しい歌を生む偶然の一致を熱心に探し求める。その行動は奔放かつ恣意的であり、他の星神や凡人をからかって一時の楽しみを得ることすら惜しまず、かつては開拓の星神アキヴィリの列車に一年間潜伏し、最後に爆発事件を起こしたこともある。仮面の愚者は彼の運命を追う派閥の一つである。アハの動機は純粋でありながら極端で、楽しみさえ得られれば宇宙が燃え上がることすら厭わず、その傍らで油を注ぐ。複数の星神が繁育のタイズスロスを討伐した際の彼の役割も、その存在の混沌とした色彩を強めている。"
 Aeons_II.502.a:"あはっ！"
 Aeons_II.503.name:"運命の道の物語：記憶の星神浮黎"
 Aeons_II.503.desc:"記憶の星神浮黎は、沈黙の宇宙の記録者のような存在であり、思考は存在であり、記憶は存在の証であると考える。浮黎は忘れられたすべてを記録し、宇宙の再生に備える。その姿は水晶で彫られた人のような像であり、顔はぼんやりとし、真珠の飾りをつけた冠をかぶっている。その出現は通常、何か重大な出来事が永遠に刻印されることを意味する。記憶の運命の本質は時間を超えた因果関係に関わっている可能性があると考えられており、現在知られている無漏主は、実際の記憶の主人——宇宙の果てで過去を振り返り、すべてを記憶して因果を閉じ、星神へと昇格する無漏浄子——の影に過ぎないかもしれない。浮黎の誕生は謎に包まれており、オウロボロスが無数の星系を呑み込んだことによる大規模な生命の消滅に関連している可能性があり、それらの失われた記憶を保存する必要があったのではないかと推測されている。"
 Aeons_II.503.a:"素晴らしい"
 Aeons_II.504.name:"運命の道の物語：繁育の星神タイズスロス"
 Aeons_II.504.desc:"繁育の星神タイズスロスは、蟲皇または砂王とも呼ばれ、寰宇蝗災の創造者である。地を支配する鞘翅目の最後の一員として、極度の孤独がその運命に火をつけ、彼は自己複製の恐怖へと変貌し、無限の繁殖の荒波を率いた。彼、あるいは彼らは諸界を横行し、最終的に神々によって何らかの方法で前進を阻止され、陥落した。タイズスロスの陥落の背後には複雑な事情が隠されている可能性があり、その星神への飛昇自体が偶然か、あるいは何らかの操作の結果であったとする見方もある。彼は既にこの世を去ったが、残された蟲群は今も宇宙の各地で害をなし、問題を引き起こし続けている。"
 Aeons_II.504.a:"おかえり"
 Aeons_II.505.name:"運命の道の物語：神秘の星神ミーサス"
 Aeons_II.505.desc:"神秘の星神ミーサスは、万物は認識可能であるという主張は妄言であり、宇宙は解き明かすことができず、いわゆる真理は幻想に過ぎないと考える。知性の確実性が宇宙の可能性のある変数を破壊するのを防ぐため、ミーサスは思考の霧と感覚の雨を降らせ、色相、重畳、謎、幻影を通じて、語ることのできない深遠な理を世人に示す。その姿は、砕けたクラゲのような、あるいは破壊された人間の脳の認知領域のようなものであると記録されている。ミーサスは知性のボーシ尊と本来的に絡み合っており、なぜならすべての未知が解明されてしまえば、神秘の運命自体が存在基盤を失うからである。"
 Aeons_II.505.a:"あはっ！"

