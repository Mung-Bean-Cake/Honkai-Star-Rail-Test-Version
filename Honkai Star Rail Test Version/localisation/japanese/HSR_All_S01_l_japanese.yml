 SR_Paragon.101.name:"ワープ：運命の行者を招請"
 SR_Paragon.101.desc:"運命の行者：運命の道を歩み、そこから力を得る者たち。浩瀚な宇宙には、無限の未知と可能性が満ちている。文明による宇宙の探査は、科学技術の進歩だけでなく、文明の精神と知恵の無限の拡張でもある。今日、我々は新たな出発点に立ち、かつてない機会と挑戦に直面している。この星海への道において、我々は運命の行者——勇敢で冒険心にあふれた人々——を招き、共にこの偉大な旅路を歩み始めるべきである。"
 SR_Paragon.101.a:"天命既定"
 SR_Paragon.101.b:"天命既定"
 SR_Paragon.101.c:"天命既定"
 SR_Paragon.101.d:"天命既定"
