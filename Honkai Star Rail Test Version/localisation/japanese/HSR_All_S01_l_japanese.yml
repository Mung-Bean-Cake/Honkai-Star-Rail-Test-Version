 #カフカ
 NAME_kafuka:"カフカ"
 kafuka_catch_phrase:"ほぼ無限の時間、ほぼ無限の空間、そして我々は同時に同じ場所に現れる。「運命」はこうやって奇跡を創造し、それが偶然だと思わせるのだ。"
 kafuka_backstory:"星間平和会社の手配書には、カフカの名前と「コート収集が趣味」という記録だけが残されている。この星核猟手については、彼女が「運命の奴隷」エリオの最も信頼されるメンバーの一人であるということ以外、ほとんど知られていない。エリオが予見する「未来」に到達するため、カフカは行動を開始する。"
 hsr_paragon.56.name:"星核猟手-カフカ"
 hsr_paragon.56.a:"初対面"
 hsr_paragon.56.a.response:"やあ、列車団…ええ、私を捕まえたね。"
 hsr_paragon.56.b:"趣味"
 hsr_paragon.56.b.response:"私は特にベルベットのコートが好きだ。壊れやすく美しい、手入れが難しく、少しの油断で輝きを損なう。"
 hsr_paragon.56.c:"見聞"
 hsr_paragon.56.c.response:"「星核」によって変えられた世界…私の故郷もその一つだ。残念ながら、その時代がどのように堕落したのかを目の当たりにすることはなかった。"
 leader_kafuka_t1:"§M夜の喧騒は絶えず§!"
 leader_kafuka_t1_desc:"ただ待て"
 leader_kafuka_t2:"§M月光は絶え間なく摩れる§!"
 leader_kafuka_t2_desc:"私は即興で讃える"
 leader_kafuka_t3:"§M優しさもまた残酷§!"
 leader_kafuka_t3_desc:"今宵だけ奏でる"
 leader_kafuka_t4:"§M赦しは慈悲にあらず§!"
 leader_kafuka_t4_desc:"身体は脆いからこそ美しい。"
 leader_kafuka_t5:"§M悲劇の果ての顫音§!"
 leader_kafuka_t5_desc:"別れを告げる時が来た…"
