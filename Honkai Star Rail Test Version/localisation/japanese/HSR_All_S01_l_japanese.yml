councilor_loading_unloading_department_desc:"部長コラパウ、背後には様々な惑星の「パートナー」がいる。"
civic_confidential_code_breaking_department:"§A機密解読部§!"
civic_confidential_code_breaking_department_desc:"その部員は古語、プログラミング、新言語の解読を得意とし、「機密解読部」とも呼ばれる。"
councilor_confidential_code_breaking_department:"§A機密解読部長§!"
