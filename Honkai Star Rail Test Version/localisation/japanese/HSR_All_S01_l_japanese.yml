 #ミーシャ
 NAME_misha:"ミーシャ"
 misha_catch_phrase:"「生命は迂回する迷宮であり、記憶以外に我々は何も持っていない。」"
 misha_backstory:"「ドリームスケープホテル」の従順で利発なベルボーイ。祖父のような銀河冒険家になることを夢見ている。非常に勤勉で、特に様々な機械の修理を得意とし、ホテルの宿泊客が語る星間の見聞に熱中している。早く大人になり、星々を探索する旅に出る日を楽しみにしている。"
 hsr_paragon.38.name:"ピノコニー-ミーシャ"
 hsr_paragon.38.a:"初対面"
 hsr_paragon.38.a.response:"私は「ドリームスケープホテル」のベルボーイ、ミーシャです。ピノコニーへようこそ。こちらへどうぞ、お荷物をお持ちします！"
 hsr_paragon.38.b:"趣味"
 hsr_paragon.38.b.response:"銀河地理雑誌は毎号欠かさず読んでいます…特に最新号の、惑星を飲み込むあの巨大な鯨は本当にすごい！次の号がいつ出るのか楽しみで…"
 hsr_paragon.38.c:"見聞"
 hsr_paragon.38.c.response:"よく聞くのですが、「開拓」とは未開の領域に足を踏み入れることであり、ピノコニーも同様の歴史を経験しています。ソルダの美味しさ、ドリームジャグトループの公演も、度重なる「開拓」によって成し遂げられたものなのです…本当に大変だったでしょうね……"
 leader_misha_t1:"§Mワープ§!"
 leader_misha_t1_desc:"開拓者、休憩は取れましたか？どこか行きたい所があれば、いつでも私に声をかけてください！"
 leader_misha_t2:"§Mルームサービス！§!"
 leader_misha_t2_desc:"「ドリームスケープホテル」での仕事が大好きです！ここでは多くの遠方からのお客様に出会い、たくさんの冒険物語を聞くことができます…本当に素晴らしい……"
 leader_misha_t3:"§M楽しい年月の影§!"
 leader_misha_t3_desc:"ミーシャはしっかり働いて、たくさん貯金をして、いつか大人たちのように星々を旅して探検するんだ！"
 leader_misha_t4:"§M最初の愛と友情§!"
 leader_misha_t4_desc:"仕事は全部終わった、しっかり休もう。"
 leader_misha_t5:"§M心に刻む約束§!"
 leader_misha_t5_desc:"「ドリームスケープホテル」での仕事は忙しいけれど、この仕事のおかげで開拓者のような友達に出会えたんだ！"
