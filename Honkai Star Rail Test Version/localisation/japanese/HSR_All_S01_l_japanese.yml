 #スパークル
 NAME_huahuo:"スパークル"
 huahuo_catch_phrase:"私は忍耐力がなく、持続的な夢を持つことも難しい…最近の夢は…天才クラブに入ること！そう、天才を演じるんだ！はあ、この難しい挑戦をやってみたい…応援してくれる人はいる？"
 huahuo_backstory:"「仮面の愚者」のメンバーの一人。掴みどころがなく、手段を選ばない。危険な演劇の達人であり、演技に没頭し、千の仮面を身に着け、無数の顔に変身することができる。富、地位、権力…スパークルにとってはどれも重要ではない。彼女を動かすのはただ「楽しみ」だけだ。"
 hsr_paragon.40.name:"ピノコニー-スパークル"
 hsr_paragon.40.a:"初対面"
 hsr_paragon.40.a.response:"やあやあ、私はスパークル！もし危険な用事があれば、遠慮なく私に声をかけて。興味があれば、値段は相談に乗るよ。大事なのは楽しむことだよね？"
 hsr_paragon.40.b:"趣味"
 hsr_paragon.40.b.response:"私はジョークが好き——この世界は重苦しすぎる！もちろん、ジョークは世界を良くしないけど、少なくとも世界をより偽善的にすることはないよね~そう思わない？"
 hsr_paragon.40.c:"見聞"
 hsr_paragon.40.c.response:"大物たちはこの世界がどう動いているかを知りすぎている。だから彼らはルールを作り、何かが法律に違反しているか、道徳に反しているかを判断する…彼らはジョークが面白いかどうかまで決める！私にはこれが一番笑えると思う。"
 leader_huahuo_t1:"§M虚構無端§!"
 leader_huahuo_t1_desc:"おや、最近よく君に会うね…どこで見たかって？それは教えられないよ、ひひ～"
 leader_huahuo_t2:"§M独り芝居§!"
 leader_huahuo_t2_desc:"私はただ舞台の隅で脇役を演じ、拍手を送り、雰囲気を盛り上げて、そしてクライマックスで突然空に舞い上がり、ドーン！花火のようにカラフルに爆発する——主役にそんなことができるか？"
 leader_huahuo_t3:"§M世戯れ§!"
 leader_huahuo_t3_desc:"「いくつかの出自のバージョンは特に人気がある。」愚者の「酒場」に着くと、スパークルはあっさりと認めざるを得なかった。「好きであることと信じることは別物だが、人々は自分が好きな物語が真実であると信じる傾向がある。」"
 leader_huahuo_t4:"§M一人千役§!"
 leader_huahuo_t4_desc:"愚かな賢者、賢い愚者…次は誰になろうか？"
 leader_huahuo_t5:"§M遊戯塵寰§!"
 leader_huahuo_t5_desc:"遊ぶ人もいれば、鏡を見る人もいる…誰のことを言ってると思う？"
 hsr_ui.40.title:"指導者詳細-スパークル"
 hsr_ui.40.desc:"$huahuo_backstory$"
