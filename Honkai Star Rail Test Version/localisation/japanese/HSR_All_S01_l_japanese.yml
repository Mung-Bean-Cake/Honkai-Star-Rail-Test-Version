 #アルジェンティ
 NAME_yinzhi:"アルジェンティ"
 yinzhi_catch_phrase:"「魂を捧げるということは、毎回二度と戻れなくなるかもしれないが、毎回決して退却しないということだ。」「共に励まそう、我が友よ。」"
 yinzhi_backstory:"「純美騎士団」の古典的な騎士。彼は正直で光明磊落、高貴な天性で人々を感服させる——宇宙を旅する孤独な騎士であり、「純美」を確固として実践している。宇宙における「純美」の名誉を守ることがアルジェンティの責務である：それを果たすには、まず敬虔に始め、槍を下ろす時には人々を心服させる必要がある。"
 hsr_paragon.64.name:"純美騎士団-アルジェンティ"
 hsr_paragon.64.a:"初対面"
 hsr_paragon.64.a.response:"私は「純美騎士団」のアルジェンティだ。ここに、一輪の薔薇の重みをもって、君に敬意を表する。"
 hsr_paragon.64.b:"挨拶"
 hsr_paragon.64.b.response:"もし困難に遭遇したなら、必ず私に知らせてくれ。君の安全を守ろう。"
 hsr_paragon.64.c:"見聞"
 hsr_paragon.64.c.response:"「醜」が存在しない惑星を聞いたことはあるか？興味深いことに、そこに住む人々の目には「美」もまた存在しない。"
 leader_yinzhi_t1:"§M敬虔§!"
 leader_yinzhi_t1_desc:"一瞬、目の奥に留まる"
 leader_yinzhi_t2:"§M公正、ここに咲く§!"
 leader_yinzhi_t2_desc:"瑪瑙の謙虚"
 leader_yinzhi_t3:"§M崇高なる客体§!"
 leader_yinzhi_t3_desc:"茨の道の栄光"
 leader_yinzhi_t4:"§M純粋高潔宣言§!"
 leader_yinzhi_t4_desc:"純美騎士の責務に従う。"
 leader_yinzhi_t5:"§M花庭に在りて、尽美を賜う§!"
 leader_yinzhi_t5_desc:"銀河のあらゆる美しさを、最後の瞬間まで守り抜く。"
