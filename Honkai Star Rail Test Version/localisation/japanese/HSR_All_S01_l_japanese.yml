 #プロジェクト
 herta_discuss_pop_up_1:"義体進化時代"
 herta_discuss_pop_up_1_DESC:"黒塔が提供する技術、そして宇宙ステーションの無数の研究者たちの研究成果により、我々は生命進化の方向として義体を選択する。これは新たな義体であり、有機生命体と完全に融合し、有機体と機械の両方の可能性を最大限に引き出すことができる。\n研究完了後、研究オプションを獲得：['technology:tech_herta_choose_1']"
 herta_discuss_pop_up_2:"完全遺伝子時代"
 herta_discuss_pop_up_2_DESC:"ルアン・メェイが提供する技術、そして宇宙ステーションの無数の研究者たちの研究成果により、我々は生命進化の方向として遺伝子を選択する。肉体による成聖、我々はより速く、より強くなる！\n研究完了後、研究オプションを獲得：['technology:tech_ruanmei_choose_1']"
 herta_discuss_pop_up_3:"機械進歩時代"
 herta_discuss_pop_up_3_DESC:"スクリューガムが提供する技術、そして宇宙ステーションの無数の研究者たちの研究成果により、我々は生命進化の方向として機械を選択する。多くの人が機械に対して否定的な態度を持っているが。\n研究完了後、研究オプションを獲得：['technology:tech_luosi_choose_1']"
