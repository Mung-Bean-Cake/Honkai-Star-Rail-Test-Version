 #イベント
 SR_belobog.2.title:0 "火種計画"
 SR_belobog.2.desc:0 "十数年前から、終末が迫っているという社会論調が現れていた。その後この論調は減少したが、最近再びホットトピックとなっている。\n国民の不安は大きな問題を指摘している。科学界は、現在のデータでは、惑星上の自然災害が母星で発展できる程度にまで後退する前に、文明を維持するための資源が枯渇すると指摘している。さらに、前線の銀鬃鉄衛は裂界の浸食が一向に収まる気配がないと報告している。一方、内部調整の努力もまだ完全には成功していない。このままでは、いつか危機に直面するだろう。\n幸い、星核の問題は既に解決されている。広範な議論の末、我々は一つの出口を見つけた——残された資源を活用して広大な宇宙へと進み、母星以外の資源を利用して文明を存続させることだ。二つの道がある：国を挙げて母星を離れ、生存に適した惑星に新たな植民地を開拓すること。あるいは、宇宙の資源を母星に持ち帰り、母星の様々な困難に対抗することだ。いずれにせよ、我々は文明の火種を絶やしてはならない。"
 SR_belobog.2.a:0 "了解"
 SR_belobog.2.a.desc:0 "計画の方向性を決定し、社会の力を結集する"
 SR_belobog.3.title:0 "最終決定"
 SR_belobog.3.desc:0 "期間中の宣伝と議論を経て、我々は計画の方向性を決定することに成功した。\n現在、社会各界から様々な計画案が提出され、国民も計画の進捗を注視している。"
 SR_belobog.3.a:0 "これで決まりだ。"
 SR_belobog.3.a.desc:0 "条件が整えば、ベロブルグ外の地域を開発することができる。宇宙を探索・拡張しながら、母星を徐々に開発し環境を改善することは、母星の滅亡を防ぐために不可欠な要素である。"
 SR_belobog.4.title:0 "激しい議論"
 SR_belobog.4.desc:0 "我々は長期間にわたって母星の終末関連の話題について公式な発言をしてこなかったが、証拠は明確であり、事態は深刻であるため、社会の議論は決して止まなかった。\n不幸なことに、おそらく我々の長期間の沈黙が民衆の怒りを招いたのだろう。多くの国民が様々な手段を通じて、その切迫感と社会の議論の結果を我々に伝えてきた。\nいずれにせよ、事態は行動を開始しなければならない段階にまで至っている。直ちに対応を開始するのが良いだろう。さもなければ、文明全体が我々の手で滅びてしまう。"
 SR_belobog.4.a:0 "わかった"
 SR_belobog.10.title:0 "新しい裂界研究プロジェクトが解放されました"
 SR_belobog.10.desc:0 "新しい裂界研究プロジェクトが実行待ちです。"
 SR_belobog.10.a:0 "了解"
 SR_belobog.11.title:0 "裂界研究完了"
 SR_belobog.11.desc:0 "大量の資源を投入した我々の判断は正しかったことが証明された。関連する研究チームは裂界のかなりの部分の秘密を解明することに成功し、それで十分である。\n人々は新しい成果の用途について熱心に議論している。実際、これは我々がついに裂界の浸食に対して対策を講じることができることを意味している。"
 SR_belobog.11.a:0 "朗報だ"
 SR_belobog.12.title:0 "裂界研究完了"
 SR_belobog.12.desc:0 "我々の研究チームは裂界生物に対して広範な実験を実施した。これらの実験は裂界の動作原理をさらに明らかにし、裂界生物に対する理解も深めた。\n新しい研究成果は裂界の抑制に役立つだけでなく、軍隊の作戦にも参考を提供する。"
 SR_belobog.12.a:0 "銀鬃鉄衛たちも喜ぶだろう"
 SR_belobog.13.title:0 "裂界研究完了"
 SR_belobog.13.desc:0 "裂界の最も深い原理を完全に理解することは科学者にとって依然として困難だが、異なる条件下で裂界を制御する新しい方法を開発することは驚くほど容易であった。特別プロジェクトの期間中、様々な研究チームが次々と最新の成果を発表し、広く注目と議論を集めた。特別プロジェクトは基本的に目標を達成し、我々は惑星上のすべての裂界を制御できるようになった。"
 SR_belobog.13.a:0 "大掛かりな準備をしよう"
 SR_belobog.14.title:0 "裂界研究完了"
 SR_belobog.14.desc:0 "母星の過酷な環境下で惑星全体を調査することは容易ではない。勇敢な探検隊は市外の氷天雪地に足を踏み入れた。どうしても立ち入れない地域については、軌道上の施設を使用してスキャンを行った。\n得られたデータは様々な点で驚くべきものでありながら、予想の範囲内でもあった。時間をかけてデータを整理し、詳細な計画を策定すれば、裂界除去の最終段階を開始することができる。"
 SR_belobog.14.a:0 "大きな動きが来る"
 SR_belobog.15.title:0 "裂界除去完了"
 SR_belobog.15.desc:0 "計画の実行中には多くの問題に遭遇した。しかし、いずれにせよ、我々は既存のすべての裂界を除去することに成功した。\n一部の地域では裂界の再発や拡大の兆候が依然として見られるが、我々の適切な制御下では問題にはならない。裂界の怪物たちも住処を失い、近い将来に完全に消滅するだろう。"
 SR_belobog.15.a:0 "裂界が再び戻ってこないことを願う"
 SR_belobog.20.title:0 "新しい寒波研究プロジェクトが解放されました"
 SR_belobog.20.desc:0 "新しい寒波研究プロジェクトが実行待ちです。"
 SR_belobog.20.a:0 "了解"
 SR_belobog.21.title:0 "氷天雪地の中の拠点"
 SR_belobog.21.desc:0 "慎重な設計と計算の後、我々の研究チームはベロブルグ外の氷天雪地に地域を開発し、それが新しい都市に発展するまで維持するための様々な方案を提示した。一部のチームは典型的な地域を選んで試験的に拠点を設立し、安定した資源供給と生存環境を確保した。現在、依然として多くの困難に直面しているが、ベロブルグ外の荒地を開発することは不可能ではないことが証明された。"
 SR_belobog.21.a:0 "良い試みだ"
 SR_belobog.22.title:0 "成功した試み"
 SR_belobog.22.desc:0 "我々は大規模な部隊を組織し、市外で大規模な建設を実施した。結果は計画が成功したことを示している。ベロブルグ外には、やがて区画に発展する基地が建設された。\n今後はこの方法に従って市外に拡張することができ、風雪に悩まされることはない。"
 SR_belobog.22.a:0 "よくやった"
 SR_belobog.23.title:0 "遺跡研究完了"
 SR_belobog.23.desc:0 "探検隊は厳しい寒さと雪の中を困難に進み、最新技術を駆使して、長期間にわたる困難な探検と発掘の末、古代遺跡の資料や文物を持ち帰ることに成功した。これらの貴重な知識は我々に大きな進歩をもたらした。星核災害が我々をどれだけ後退させたかは想像に難くない。"
 SR_belobog.23.a:0 "朗報だ"
 SR_belobog.24.title:0 "惑星調査完了"
 SR_belobog.24.desc:0 "通常、地球規模の氷が溶けると様々な環境問題や自然災害が発生する。しかし、おそらくこの氷の起源が特殊だったため、それらは単に消え去り、このような問題は発生しなかった。\n氷に覆われていた地域にとっては、間違いなく前例のない災害を経験し、元の環境は完全に破壊された。おそらく氷によって元の姿が保たれていたのだろうが、惑星全体が解凍された後の生態系の回復は大きな問題である。"
 SR_belobog.24.a:0 "我々は先進技術を必要とする"
 SR_belobog.25.title:0 "海の復活"
 SR_belobog.25.desc:0 "数え切れないほどの努力の末、我々はついにこの偉大なプロジェクトを完了した——この凍てついた海洋惑星である母星を寒波の被害から回復させることだ。最後の氷塊が溶けた時、海洋惑星は以前ほど活気に満ちてはいなかったが、我々はこの瞬間に計り知れない感動と誇りを感じた。\nこの数十年の間に、我々は確固たる信念と絶え間ない努力によって、文明を守り、故郷を守り続けてきた。今、我々はついに心の重荷を下ろし、未来の新たな希望を迎えることができる。\n\nこれが永遠の記憶となりますように。"
 SR_belobog.25.a:0 "ついに"
 SR_belobog.31.title:0 "地形障害物を完全に除去"
 SR_belobog.31.desc:0 "我々の絶え間ない努力と文明全体の困難な奮闘により、ついにヤリロ-VI上のすべての地形障害物を除去した。これは母星の復興に向けた最も重要な一歩である。\n現在、母星の気候は徐々に本来の姿に戻りつつあるが、依然として変化せず、または影響を受けた状態が続いている地域も見られる。裂界と寒波のすべてを理解すれば、それらを母星から完全に消し去ることができるだろう。"
 SR_belobog.31.a:0 "偉大なる勝利！"
 SR_belobog.31.b:0 "存護の志！"
 SR_belobog.51.title:0 "裂界の抑制"
 SR_belobog.51.desc:0 "星核が除去されて以来、裂界は自然に消滅しつつある。しかし、その消滅速度も、時折見られる再拡大も、我々を満足させるものではない。今こそ、母星上の裂界怪物の掃討などの行動に向けて準備を始めるべき時である。\n長年にわたる裂界との付き合いの中で、我々は裂界の拡大を抑制し、後退を加速させるいくつかの方法を徐々に摸索してきた。これらの方法は現在、民間や非公式の場で応用されているが、効果は理想的とは言えない。明らかに、我々は裂界をさらに抑制する手段を必要としており、さもなければ将来的に大きな困難に直面するだろう。\n裂界のさらなる研究は知識を深め、より効果的な方法を開発し、裂界から有用なものを抽出することもできる。"
 SR_belobog.51.a:0 "これは長期的な任務となるだろう"
 SR_belobog.51.b:0 "撤退を妨げない程度で十分だ"
 SR_belobog.52.title:0 "裂界の消失"
 SR_belobog.52.desc:0 "十数年前、我々は母星上の裂界を制御するためのこのプロジェクトを開始した。現在、このプロジェクトは最終段階を迎えている。長期的な努力の末、惑星上に残る裂界は急速に後退しており、もはや我々の助力を必要としない。\n裂界が急速に後退するにつれて、残された裂界生物も徐々に消えていき、残存する戦闘力も大幅に低下する——これは裂界生物に対する最終攻撃を仕掛ける絶好の機会である。さらに、もし裂界がまだ我々の発展を妨げているなら、それを除去することも容易になるだろう。"
 SR_belobog.52.a:0 "これは完璧な結末だ"
 SR_belobog.53.title:0 "裂界制御の失敗が深刻な生存問題を引き起こす"
 SR_belobog.53.desc:0 "現在の状況は、つい最近にも前兆があった。裂界が再び我々の活動範囲に侵入し、住民は一部の土地を放棄せざるを得なくなり、銀鬃鉄衛の作戦にも多くの支障をきたしている。裂界の怪物の活動はますます猖獗となり、我々の防衛線を何度も脅かしている。\n現在の状況は以前よりもはるかに深刻である。確実に言えるのは、もしこのまま待っていれば、母星上のすべての発展成果を失うだけでなく、ベロブルグからの撤退も余儀なくされるだろう。そうなれば、母星の復興計画は完全に失敗する。その日が訪れるのを避けたいなら——それは数ヶ月以内に起こるだろう——直ちに最も強力な措置を講じ、現在の抑制計画の失敗を挽回しなければならない。"
 SR_belobog.53.a:0 "これは我々の予想ではなかった……"
 SR_belobog.54.title:0 "裂界が国民の生活に深刻な影響を与える"
 SR_belobog.54.desc:0 ""
 SR_belobog.54.a:0 "我々はこれに取り組まなければならない"
 SR_belobog.55.title:0 "裂界制御の勝利が目前に"
 SR_belobog.55.desc:0 ""
 SR_belobog.55.a:0 "我々は忍耐を続けなければならない"
 SR_belobog.61.title:0 "裂界障害物の発生"
 SR_belobog.61.desc:0 "裂界が絶えず発生しているため、母星に新しい裂界地形障害物が生成された。"
 SR_belobog.61.a:0 "了解"
 SR_belobog.62.title:0 "裂界障害物の消失"
 SR_belobog.62.desc:0 "我々の抑制のおかげで、母星上の裂界地形障害物が自然に消滅した。"
 SR_belobog.62.a:0 "了解"
 SR_belobog.81.title:0 "裂界浸食"
 SR_belobog.81.desc:0 "我々は失敗した。\n母星は完全に裂界に飲み込まれ、すべての土地と文明が消え去った。最後の瞬間、母星の住民たちは逃げようと争い、救援船に殺到した。しかし最終的に、地上の救援船も逃げ切れなかった。我々には何もできなかった。\n裂界の抑制の試みは失敗した。おそらく、より多くの資源と労力を投入すべきだったのだろう。おそらく我々は裂界の脅威を過小評価していたのだ。もしもっと多くのことをしていれば、このような事態は起こらなかったかもしれない。\n災害が発生する直前、我々は非常事態を宣言し、動員可能なすべての力を結集したが、時すでに遅しだった。今、[root.capital_scope.GetLeaderName]は窓の外でベロブルグが裂界に徐々に飲み込まれていくのを見つめ、裂界が自分たちの身近に迫るのを待つしかない。母星の復興計画は失敗し、我々は他の惑星に足場を求めることを余儀なくされる。しかし、いずれにせよ、母星上のすべては戻ってこない。"
 SR_belobog.81.a:0 "これはおそらく最悪の結末だ"
