auth_global_giant_enterprise:"宇宙企業"
auth_global_giant_enterprise_desc:"企業政府とは、巨大な商業グループが行政機能を完全に引き継いだ国家であり、完全な軍事・政治・経済システムを持ち、ビジネスロジックで文明を駆動し、利益を道徳よりも優先する。"
gov_ipc:"超銀河商業会社"
gov_ipc_desc:"商業帝国であり独立主権体でもあり、その取締役会の決議は政府の法令よりも強力な実行力を持つ。"
rt_chairman:"会長"
councilor_ruler_ipc_chairman:"§K会長§!"
councilor_ruler_ipc_chairman_desc:"星神の次に宇宙で最も権力を持つ人物"
ipc_leader:"ルイス・フレミング"
origin_hsr_ipc: "星間平和会社"
origin_hsr_ipc_desc: "対外的な宣伝では、会社は自由貿易を提唱する巨大企業財団である。運営方法としては、通貨を発行し資源を独占する商業独裁である。創業の初心に照らせば、会社は「存護」の星神のために全てを捧げる無私の後援者である。ほとんどの星間市民は会社について語るとき、常に遍在する商品と目を引く標識に言及する。まるで「取引が存在する限り、そこに星間平和会社がある」かのように。実際、銀河のほぼ全ての商業活動は会社の「信用ポイント」システムに基づいている。星間貿易をスポーツ競技に例えるなら、会社はトップアスリートであり、全ての競技種目であり、競技場であり、そしてルールそのものでもある。富に対する絶対的な支配力と、決して止まることのない拡張行動は、星間平和会社に陰謀独裁者のような大衆的印象を与えている。しかし会社は「一手に権力を掌握する」といった低次元のビジョンには微塵も関心がない。なぜなら企業精神は誕生の時から変わることなく、§H全てを「琥珀王」クリフォーに捧げることだからである。§!"
 #国民理念
civic_marketing_expansion_department: "§A市場開拓部§!"
civic_marketing_expansion_department_desc: "市場開拓部は、より多くの星系にクリフォーの使命を宣伝することに注力する。同時に、新世界を宇宙商業システムに組み込む責任も負う。星間平和会社市場開拓部が発売する銀河大宝くじは、そのマーケティング方針がオズワルド・シュナイダー自身のように情熱と熱血に満ちている。わずか一枚の星間通貨で自分の運を賭け、宇宙の富豪になって商業システムに加わるという夢の体験を売り込む。オズワルド・シュナイダーのマーケティングの下では、通常、新しい世界がこの誘惑に抵抗することは難しい——彼らは入場券を獲得するために、星間平和会社の宇宙商業システムに参加し、自国で銀河大宝くじを開催する加盟資格を得るのだ。"
civic_marketing_expansion_department_effect:"-支店建築['building:building_marketing_expansion_department']を解放$TABBED_NEW_LINE$-他国と貿易協定を結ぶたびに、『concept_pan_galaxy_trade_system』効果が発生し、即座に貿易と結束力の収入を得る。協定を結んだ相手国は『concept_pan_galaxy_trade_system_member』の身分を得る。"
councilor_marketing_expansion_department: "§A市場開拓部長§!"
councilor_marketing_expansion_department_desc: "新世界との外交・初期商業プロジェクトの達成を担当する"
civic_business_consolidation_department:"§A業務確立部§!"
civic_business_consolidation_department_desc:"市場開拓部が新世界との外交を完了した後、後続の商業は業務確立部に移管される。この部門は会社の超距離伝送ネットワークを統括し、特色ある物資の棚卸と価格設定、会社の下位施設および商品リストの長期的な維持管理を担当する。業務確立部は会社で最も巨大な部門であり、従業員数は本社総数の45％を占める。"
civic_business_consolidation_department_effect:"-支店建築['building:building_civic_business_consolidation_department']を解放$TABBED_NEW_LINE$会社専用企業建築はより多くの貿易を生み出し、より多くのポストを提供する。"
councilor_business_consolidation_department:"§A業務確立部長§!"
councilor_business_consolidation_department_desc:"業務確立部長、取締役会理事"
civic_strategic_investment_department:"§A戦略投資部§!"
civic_strategic_investment_department_desc:"戦略投資部は会社で二番目に長期的な視野を持ち、その投資は短期的なリターンにこだわらない。投資部の下には精鋭使節団「不良資産清算専門家（石心十人）」が設置されており、神秘的な部長「ダイヤモンド」——会社で数少ない確認された「存護」の令使——が統率する。彼らは宇宙を奔走し、万界の癌によって生じた不良債権を積極的に清算する。そのメンバーの出身は様々で、職責も異なり、交代の記録さえある。唯一の共通点は、全員が「ダイヤモンド」自身によって抜擢され、「基石」と呼ばれる身分証明書を与えられていることである。「石心十人」のメンバーは、自らの努力によって基石を切り開く必要がある。"
civic_strategic_investment_department_effect:"-支店建築['building:building_strategic_investment_department']を解放$TABBED_NEW_LINE$惑星/方舟に支店建築['building:building_strategic_investment_department']を初めて建造するたびに、ランダムな惑星/方舟が『concept_d_special_economic_zone』を獲得する。"
councilor_strategic_investment_department:"§A戦略投資部長§!"
councilor_strategic_investment_department_desc:"その部長「ダイヤモンド」——会社で数少ない確認された「存護」の令使。"
civic_building_materials_logistics_department:"§A築材物流部§!"
civic_building_materials_logistics_department_desc:"築材物流部は星間平和会社で最も歴史のある部門であり、その前身は「琥珀王後援隊」である。ルイスの台頭後に再編された。現部門長は太ったタラヴァン・キーン——会社で数少ない確認された「存護」の令使であり、七人取締役会の一員である。彼はクリフォーへの築材輸送という神聖な任務を担い、その地位はますます強固なものとなっている。戦略投資部と同盟を結んでいる。"
civic_building_materials_logistics_department_effect:"-支店建築['building:building_materials_logistics_department']を解放"
councilor_building_materials_logistics_department:"§A築材物流部長§!"
councilor_building_materials_logistics_department_desc:"現部門長は太ったタラヴァン・キーン——会社で数少ない確認された「存護」の令使であり、七人取締役会の一員である。彼はクリフォーへの築材輸送という神聖な任務を担い、その地位はますます強固なものとなっている。戦略投資部と同盟を結んでいる。"
civic_techniques_developing_department:"§A技術開発部§!"
civic_techniques_developing_department_desc:"技術開発部は博識学会と深い協力関係を築き、学会の研究成果を商業プロジェクトに変換する。「専門家が専門家を管理する」という言葉通り、会社は部長アボロイの科学的素養と商業感覚を評価している。この若い女性と博識学会「庸衆院」との繋がりも常に想像を掻き立てる。"
civic_techniques_developing_department_effect:"-支店建築['building:building_techniques_developing_department']を解放$TABBED_NEW_LINE$-他国と研究協定を結ぶたびに、『concept_pan_galaxy_research_system』効果が発生し、即座に貿易と結束力の収入を得る。協定を結んだ相手国は『concept_pan_galaxy_research_system_member』の身分を得る。"
councilor_techniques_developing_department:"§A技術開発部長§!"
councilor_techniques_developing_department_desc:"部長アボロイ、優れた科学素養と商業感覚を持つ"
civic_human_resources_incentive_department:"§A人材育成部§!"
civic_human_resources_incentive_department_desc:"人材育成部は会社の人材採用・育成・供給を担当し、同時に多くの超星系プロジェクトのコミュニケーションと協働の媒介でもある。"
civic_human_resources_incentive_department_effect:"-支店建築['building:building_human_resources_incentive_department']を解放$TABBED_NEW_LINE$-5年ごとに選考を実施し、1人の指導者に『leader_trait:leader_trait_human_resources』の称号を与え、500の経験値を付与し、職階を1段階昇進させる。"
councilor_human_resources_incentive_department:"§A人材育成部長§!"
councilor_human_resources_incentive_department_desc:"人材育成部は会社の人材採用・育成・供給を担当し、同時に多くの超星系プロジェクトのコミュニケーションと協働の媒介でもある。"
civic_traditional_project_department:"§A伝統プロジェクト部§!"
civic_traditional_project_department_desc:"時の移り変わりは多くの産業の盛衰を生み、それらを会社の貿易システム内での地位も変動させる。ある産業が汎銀河貿易版図に占める割合が一定の閾値を下回ると、それは業務確立部の管轄から外れ、伝統プロジェクト部に移管され、部長ザイティアンが受け継ぐ。業績は平凡な伝統プロジェクト部は会社内であまり重視されていないが、真のエリートはその中で地道に時代に磨かれた仕事をしているという見方もある。"
councilor_traditional_project_department:"§A伝統プロジェクト部長§!"
councilor_traditional_project_department_desc:"ある産業が汎銀河貿易版図に占める割合が一定の閾値を下回ると、それは業務確立部の管轄から外れ、伝統プロジェクト部に移管され、部長ザイティアンが受け継ぐ。"
councilor_traditional_project_department_effect:"会社専用企業建築はより多くの貿易を生み出す。"
civic_publicity_Propaganda_department:"§A政宣部§!"
civic_publicity_Propaganda_department_desc:"部長：トレラ・ファネーシャ、「ゴッドマザー」と呼ばれ、非常に古い勢力を持ち、激励と演説を得意とする。背後には四大「護衛隊」を従え、古の「精神的制御」を掌握し、200回の殺害を計画したと言われているが、トレラ本人は生涯で一人しか殺したことがない。"
councilor_publicity_Propaganda_department:"§A政宣部長§!"
councilor_publicity_Propaganda_department_desc:"部長：トレラ・ファネーシャ、「ゴッドマザー」と呼ばれ、非常に古い勢力を持ち、激励と演説を得意とする。背後には四大「護衛隊」を従え、古の「精神的制御」を掌握し、200回の殺害を計画したと言われているが、トレラ本人は生涯で一人しか殺したことがない。"
civic_loading_unloading_department:"§A荷役部§!"
civic_loading_unloading_department_desc:"部長コラパウ、背後には様々な惑星の「パートナー」がいる。"
