 SR_Paragon.001.c:"汝は何処へ行く"
 SR_Paragon.001.c.response:"我は汝の元へ行く"

 SR_Paragon_March_7th:"運命の行者：三月なのか"
 SR_Paragon_March_7th_desc:"風変わりな少女。この年頃の少女が「熱中すべき」ことすべてに熱中していると自認しており、例えば写真撮影など。漂う氷塊から目覚めたが、自分の生い立ちや過去については何も知らない。短い落ち込みの後、彼女は新たな人生の始まりの日付を自分の名前とすることにした。この日、三月なのかが「誕生」した。"
 SR_Paragon_Himeko:"運命の行者：姫子"
 SR_Paragon_Himeko_desc:"冒険心にあふれた科学者。少女時代、故郷で座礁した星穹列車と出会う。その時、列車内のある存在が彼女に自分の惑星の外側、すなわち「宇宙」と呼ばれる世界を見せた。数年後、姫子がついに列車を修復して星々へと旅立った時、彼女はこれが始まりに過ぎないと悟った。「開拓」の新たな世界への道には、より多くの仲間が必要である——たとえ旅人がそれぞれ異なる方向を向いていても、彼らは同じ星空の下にいるのだ。"
 SR_Paragon_Welt:"運命の行者：ヴェルト"
 SR_Paragon_Welt_desc:"老成した元逆エントロピー盟主。「世界」の名を受け継ぎ、かつて何度も世界を滅亡の淵から救った。聖方丹事件の後、ヴェルトは事件の黒幕と共に星門の向こう側へと向かわざるを得なかった。彼自身も、そこで待ち受けていたのが全く新しい旅と仲間たちであるとは予想していなかったかもしれない。"
 SR_Paragon_Kafka:"運命の行者：カフカ"
 SR_Paragon_Kafka_desc:"星間平和会社の手配書には、カフカの名前と「コート収集が趣味」という記録だけが残されている。この星核猟手については、彼女が「運命の奴隷」エリオの最も信頼されるメンバーの一人であるということ以外、ほとんど知られていない。エリオが予見する「未来」に到達するため、カフカは行動を開始する。"
 SR_Paragon_Silver_Wolf:"運命の行者：シルバーウルフ"
 SR_Paragon_Silver_Wolf_desc:"宇宙をゲームと見なすスーパーハッカー。どんなに厄介な防御システムでも、シルバーウルフは難なく突破する。彼女と「天才クラブ」のスクリューガムとのデータ攻防戦は、今やハッカー界の伝説となっている。宇宙にはまだ攻略すべきステージがいくつ残っているのだろうか？シルバーウルフはそれを楽しみにしている。"
 SR_Paragon_Acheron:"運命の行者：黄泉"
 SR_Paragon_Acheron_desc:"自称「巡海遊侠」の旅人。本名は不明。長刀を帯び、銀河を独り歩む。物静かで口数が少ない。その剣は紫電のように迅雷だが、常に鞘のままで戦い、抜くことはない。"
 SR_Paragon_Firefly:"運命の行者：サム"
 SR_Paragon_Firefly_desc:"星核猟手のメンバー。機械装甲「サム」を身にまとって戦う。任務に忠実で、気性は強い。蟲群に打ち勝つための兵器として生まれ、その成長速度は常人とは異なるが、寿命は非常に短い。「生きる」機会を求めて星核猟手に加わり、運命に逆らう道を探している。"
 SR_Paragon_Jingliu:"運命の行者：鏡流"
 SR_Paragon_Jingliu_desc:"かつての羅浮剣首であり、雲騎軍不敗の盛名を築いた人物。今やその名は抹消され、魔陰の縁を歩む仙舟の反逆者となった。"
 SR_Paragon_Ruan_Mei:"運命の行者：ルアン・メェイ"
 SR_Paragon_Ruan_Mei_desc:"気品優雅な学者。「天才クラブ」#81号会員、生命科学分野の専門家。天才的な才能と驚くべき執着心でボーシ尊の注目を集め、密かな場所で生命本源の研究と探求を始めた。そのため黒塔に招かれ、スクリューガム、スティーブンと共に「模擬宇宙」を共同開発した。私生活では伝統演劇と菓子を好み、刺繍にも興味を持っている。"
