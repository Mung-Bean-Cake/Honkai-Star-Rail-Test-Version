 yaliluo_system_initializer_DESC:0 "歴史家の多くは、ヤリロ-VIの惑星史を千年前の神話戦争に遡るとする。ペルン人の十一国とヴェレス集団軍の戦争は長く激しいものだった。早すぎる春の訪れが戦況を一変させ、ヴェレス軍が大勝するまで、その戦いは続いた。彼らは宿敵を滅ぼした功績を春の戦神ヤリロに帰し、同じ名前の詩で大地を讃えた。現在銀河に記録されている惑星名「ヤリロ-VI」は、詩の一章を含む誤訳である可能性がある。"
