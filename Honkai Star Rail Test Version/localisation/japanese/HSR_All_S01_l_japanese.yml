 #ロビン
 NAME_zhigengniao:"ロビン"
 zhigengniao_catch_phrase:"彼女は自分の人生を歌に例え、その歌の始まりは陰鬱で苦いものだった。"
 zhigengniao_backstory:"ピノコニー出身、銀河で有名なハロヴィアン族の歌手。優雅で落ち着いた少女。家族の招待を受けて故郷に戻り、「諧楽大典」で賓客のために歌を披露する。「同諧」の力を借りて歌声を伝え、ファンや万物の生命に「共鳴」を示すことができる。"
 hsr_paragon.42.name:"ピノコニー-ロビン"
 hsr_paragon.42.a:"初対面"
 hsr_paragon.42.a.response:"こんばんは、私は家族の歌手、ロビンです。堅苦しく考えないでください。これはただ舞台裏での個人的な挨拶です。少しお時間をいただけますか？"
 hsr_paragon.42.b:"趣味"
 hsr_paragon.42.b.response:"時々カツラをかぶって、化粧を変えて、メガネをかける——そうすればどこに行っても心配いらないよ~"
 hsr_paragon.42.c:"見聞"
 hsr_paragon.42.c.response:"エプセロンの出版社から何枚かアルバムを出してもらって、そこにしばらく住むようにも誘われたんだ。あの星の雰囲気はピノコニーに似ているけど、芸術そのものよりも、芸術がもたらす莫大な利益の方が気になっているようだった……"
 leader_zhigengniao_t1:"§M模進楽節§!"
 leader_zhigengniao_t1_desc:"歌声が勝利をもたらしますように。"
 leader_zhigengniao_t2:"§M翎のアリア§!"
 leader_zhigengniao_t2_desc:"新しい楽章に入る時です。"
 leader_zhigengniao_t3:"§M夜色流光溢彩§!"
 leader_zhigengniao_t3_desc:"万籟、再び共鳴せよ。"
 leader_zhigengniao_t4:"§M月隠の深夜§!"
 leader_zhigengniao_t4_desc:"歌の中に安らぎを見出せますように。"
 leader_zhigengniao_t5:"§M千音迭奏、群星のフーガ§!"
 leader_zhigengniao_t5_desc:"心配しないで、私はずっとあなたのそばにいるから。"
