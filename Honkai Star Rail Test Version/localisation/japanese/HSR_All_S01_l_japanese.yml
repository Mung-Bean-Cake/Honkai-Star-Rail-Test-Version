origin_Xianzhou:0 "仙舟連盟"
origin_Xianzhou_desc:0 "§R[再調整予定]§!\n古の神話の時代、数隻の仙舟が長生の霊薬を求めて星海に出航した。薬を求める舟は光陰を費やし、身体と意志を磨耗させ、ついに薬師の祝福を得た。しかし、長生をもたらす果実は、四海の荒廃と民の苦難をもたらした。巡狩の星神・嵐が深淵から帰還し、重力を弦とし、辰矢を満弓にして建木を一撃で断ち切り、「豊穣」の孽を絶つまで、その苦しみは続いた。仙舟は迷いの道を脱した後、「巡狩」の導きにより連盟を結成し、強力な雲騎軍を組織した。連盟は豊穣の孽物を標的とし、不死の汚染を断ち切ることを使命として、広大な星野を巡る。長い年月の中で、「仙舟連盟」はかつて神が足を止めた無数の世界に上陸し、豊穣の孽物を全て滅ぼしてきた。豊穣の恩恵を求めるいかなる星民の種族も、仙舟の星を殲滅する脅威を考慮せざるを得ない。これこそが「仙舟連盟」が求める抑止力であり、彼らは絶え間ない警鐘となり、全ての貪生の者にとって払うことのできない代償となる。今日に至るまで、様々な生命が仙舟に集まるのは、好き放題に振る舞う「豊穣」に復讐し、「巡狩の意志」を徹底するためである。故に、不死の劫難が尽きる日まで、星海の巡航は止まない。"
origin_tooltip_Xianzhou_effects:0 "千秋の敵忾、万劫を同舟す。三千の弱水、疆寿無し、一瓢を取るのみで飲み尽くさず。"
Xianzhou_Alliance_start_screen_messages:0 "千秋の敵忾、万劫を同舟す。三千の弱水、疆寿無し、一瓢を取るのみで飲み尽くさず。古の神話の時代、数隻の仙舟が長生の霊薬を求めて星海に出航した。薬を求める舟は光陰を費やし、身体と意志を磨耗させ、ついに薬師の祝福を得た。しかし、長生をもたらす果実は、四海の荒廃と民の苦難をもたらした。巡狩の星神・嵐が深淵から帰還し、重力を弦とし、辰矢を満弓にして建木を一撃で断ち切り、「豊穣」の孽を絶つまで、その苦しみは続いた。仙舟は迷いの道を脱した後、「巡狩」の導きにより連盟を結成し、強力な雲騎軍を組織した。連盟は豊穣の孽物を標的とし、不死の汚染を断ち切ることを使命として、広大な星野を巡る。長い年月の中で、「仙舟連盟」はかつて神が足を止めた無数の世界に上陸し、豊穣の孽物を全て滅ぼしてきた。豊穣の恩恵を求めるいかなる星民の種族も、仙舟の星を殲滅する脅威を考慮せざるを得ない。これこそが「仙舟連盟」が求める抑止力であり、彼らは絶え間ない警鐘となり、全ての貪生の者にとって払うことのできない代償となる。今日に至るまで、様々な生命が仙舟に集まるのは、好き放題に振る舞う「豊穣」に復讐し、「巡狩の意志」を徹底するためである。故に、不死の劫難が尽きる日まで、星海の巡航は止まない。"
The_Xianzhou_Luofu_start_screen_messages:0 "千秋の敵忾、万劫を同舟す。三千の弱水、疆寿無し、一瓢を取るのみで飲み尽くさず。古の神話の時代、数隻の仙舟が長生の霊薬を求めて星海に出航した。薬を求める舟は光陰を費やし、身体と意志を磨耗させ、ついに薬師の祝福を得た。しかし、長生をもたらす果実は、四海の荒廃と民の苦難をもたらした。巡狩の星神・嵐が深淵から帰還し、重力を弦とし、辰矢を満弓にして建木を一撃で断ち切り、「豊穣」の孽を絶つまで、その苦しみは続いた。仙舟は迷いの道を脱した後、「巡狩」の導きにより連盟を結成し、強力な雲騎軍を組織した。連盟は豊穣の孽物を標的とし、不死の汚染を断ち切ることを使命として、広大な星野を巡る。長い年月の中で、「仙舟連盟」はかつて神が足を止めた無数の世界に上陸し、豊穣の孽物を全て滅ぼしてきた。豊穣の恩恵を求めるいかなる星民の種族も、仙舟の星を殲滅する脅威を考慮せざるを得ない。これこそが「仙舟連盟」が求める抑止力であり、彼らは絶え間ない警鐘となり、全ての貪生の者にとって払うことのできない代償となる。今日に至るまで、様々な生命が仙舟に集まるのは、好き放題に振る舞う「豊穣」に復讐し、「巡狩の意志」を徹底するためである。故に、不死の劫難が尽きる日まで、星海の巡航は止まない。"
