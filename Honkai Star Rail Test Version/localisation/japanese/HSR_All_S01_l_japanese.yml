 #大黒塔
 NAME_daheita:"大黒塔"
 daheita_catch_phrase:"また会ったな？宇宙を渡って二度目に会うのは、君で三百四十五人目だ。これからこれが君の「黒塔番号」だ。覚えておけ、誰かに聞かれるかもしれないぞ。"
 daheita_backstory:"尊き「天才クラブ」#83、人間、女性、若く、美しく、可愛い。彼女は銀河の辺境に隠棲し、ほとんど外に出ないと言われている——今回の出現は、きっと自ら出向かねばならない問題のためであろう？"
 hsr_paragon.1.name:"天才クラブ-大黒塔"
 hsr_paragon.1.a:"初対面"
 hsr_paragon.1.a.response:"私を覚えていないのか？前に言っただろ——人間、女性、若く、美しく、可愛い。"
 hsr_paragon.1.b:"趣味"
 hsr_paragon.1.b.response:"私のワードローブは、まあ、宇宙ステーション一、二個分の大きさはあるだろうな。かつてボーシ尊が先に私に目を向けたから、この世から「純美」の令使が一人減ったんだ。"
 hsr_paragon.1.c:"見聞"
 hsr_paragon.1.c.response:"凡人知識の限界を代表するものは何か？多くの人は天才クラブだと思うが、私は自分だと思う。"
