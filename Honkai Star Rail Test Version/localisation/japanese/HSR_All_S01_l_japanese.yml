 tr_xunlie_cunhu_1:"§B辺境の早撃ち§!"
 tr_xunlie_cunhu_1_flavor:"殺人事件はヘルドリンでは日常茶飯事だ。辺境星系に潜伏する密航者たちは許されざる血の負債を背負っているが、管理者たちの目を盗んで、この場所をもう一つの盗賊の楽園に変えようとしている。あなたは彼らのゴーグルをハッキングし、指令を受けた補助機械が横から攻撃を遮る。室内に充満した麻酔ガスが、犯罪者の抵抗能力を瞬時に奪い、日常業務を完了させる。あなたは粘性のある生物艦船に潜入し、爆撃を仕掛けようとしている腺を麻痺させる。外骨格を装着して違法な記憶取引の巣窟に突入し、ハベック傭兵と接近戦を繰り広げる。これらの大小の混乱は永遠に終わらないように見える。しかし、あなたは前進しなければならない。ヘルドリンの平和のために。"
 tr_xunlie_cunhu_1_desc:"$EFFECTS_TXT$\n—『concept_xunlie_effect』の年間実践値成長：§G+0.5§!$TABBED_NEW_LINE$—『concept_cunhu_effect』の年間実践値成長：§G+1§!$TABBED_NEW_LINE$—超空間ジャンプチャージ時間：§G-50%§!$TABBED_NEW_LINE$—超空間ジャンプクールダウン：§G-50%§!$TABBED_NEW_LINE$—ワープエンジンクールダウン：§G-50%§!$TABBED_NEW_LINE$—ワープエンジン範囲：§G+50%§!$TABBED_NEW_LINE$—艦隊指揮上限：§G+25%§!$TABBED_NEW_LINE$—海軍容量：§G+25%§!\n宇宙戦開始時、艦船は30日間の強化を得る。\n内閣ポストを解放：$councilor_xunlie_cunhu_1$"
 councilor_xunlie_cunhu_1:"§B辺境の早撃ち§!"
 councilor_xunlie_cunhu_1_desc:"あなたは前進し続けるだろう、宇宙の平和のために。"
 tr_xunlie_jiyi_1:"§B記憶喪失者§!"
 tr_xunlie_jiyi_1_flavor:"あなたはとても大切なものを失った。脳の中で、まるで巧みな泥棒があなたの過去を静かに盗み去り、心に穴を開けたかのようだ。焚化師、ホルシュタイン大静寂——あなたはこれらの名前を聞いたことがあるが、自分自身のそばに現れるとは思わなかった。彼らはあなたの心の半分を切り取り、それらの記憶を廃品として捨てた。誰が貴重な記憶を無造作に捨てられることを許せるだろうか？あなたは彼らの影を追い、怨念に満ちた復讐の旅に出る。他人の記憶を支配する権利は誰にもない。あなたは自分の物語を取り戻さなければならない。たとえそれが既に焼かれていても。あなたは冷酷無情な盗賊を捕まえ、その傲慢な行いに対して代償を払わせる。"
