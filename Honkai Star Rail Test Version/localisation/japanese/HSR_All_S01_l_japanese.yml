 yaliluo_robotic_army:0 "新型ロボット攻撃部隊"
 yaliluo_robotic_army_desc:0 "ベロブルグ技術部が開発した新型ロボット部隊。軍民両用で効率的かつ迅速な能力を持つ。"
 yaliluo_robotic_defense_army:0 "新型ロボット防御部隊"
