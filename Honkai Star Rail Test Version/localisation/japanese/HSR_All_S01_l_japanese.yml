 NAME_Herta_Space_Station:0 "「黒塔」"
 auth_herta:0 "博学理事会"
 auth_herta_desc:0 "絶え間なく科学技術の進歩を追求し、資源を科学研究と技術移転に優先的に配分する"
 auth_herta_level_up:"銀河学者理事会"
 auth_herta_level_up_desc:"絶え間なく科学技術の進歩を追求し、資源を科学研究と技術移転に優先的に配分する。銀河学者が技術指導と技術開発を提供する"
 origin_Herta_Space_Station:0 "宇宙ステーション「黒塔」"
 origin_Herta_Space_Station_desc:0 "天才クラブの黒塔は、通常の世界の万物の法則に満足せず、銀河の未解決の存在に目を向け、それらの遠い神秘が自分の好奇心を満たしてくれることを期待した。そのため、黒塔は博物館式の星間艦船を主導して建造し、それを惑星軌道に投入し、「すべての異変を星空に封印する」研究を開始した。有名な黒塔宇宙ステーションがこうして誕生した。今日に至るまで、宇宙ステーションは数え切れないほどの奇物「収蔵品」を擁し、まさに星空の博物館である。多くの随艦研究者もここに定住し、銀河の各地から遺物や奇物を収集し、その形状や機能を記録し、体系的な観測と研究方法を確立している…そして最終的に、謎からさらに理解し難い謎を見つけ出す。これこそが黒塔の当初の目的でもある。多数の「収蔵品」はしばしば羨望の目を集め、様々な勢力が暗躍している。黒塔の実力により、宇宙ステーションが本当の危機に陥ることはほとんどなく、収蔵と研究は秩序正しく進められている。"
 origin_tooltip_Herta_Space_Station_effects:0 "$TABBED_NEW_LINE$—初期に機械・生物系のほとんどの技術を所持$TABBED_NEW_LINE$—より多くの初期人口を所持$TABBED_NEW_LINE$—追加の植民地：黒塔宇宙ステーション$TABBED_NEW_LINE$—初期指導者が一定の強化を得る\n§M裂界憶質イベントは報酬が2倍になり、一部の星核報酬イベントは追加報酬を得る§!"
