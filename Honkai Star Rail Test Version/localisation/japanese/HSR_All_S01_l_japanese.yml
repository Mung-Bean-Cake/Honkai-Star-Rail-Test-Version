 #開拓者
 NAME_kaituozhe:"開拓者"
 kaituozhe_catch_phrase:"昨日は未練の必要はない。"
 kaituozhe_backstory:"星核がもたらす危機を排除するため、若き開拓者は星穹列車との旅を選んだ。"
 hsr_paragon.62.name:"星穹列車-開拓者"
 hsr_paragon.62.a:"初対面"
 hsr_paragon.62.a.response:"選択する機会を得た時、後悔しないように……"
 hsr_paragon.62.b:"思い出・ポンポン"
 hsr_paragon.62.b.response:"口では不満を言いながらも、体の反応は正直だ。もっとポンポンのところに行ってあげよう！"
 hsr_paragon.62.c:"思い出・列車"
 hsr_paragon.62.c.response:"もし列車に乗るという選択をしなかったら、どんな人生を送っていただろう…いや、もしもの話はない。"
 leader_kaituozhe_t1:"§M蓄勢§!"
 leader_kaituozhe_t1_desc:"好機を逃すな。"
 leader_kaituozhe_t2:"§M不滅三振§!"
 leader_kaituozhe_t2_desc:"速やかに決着をつけよう。"
 leader_kaituozhe_t3:"§M万界に墜ちる星芒§!"
 leader_kaituozhe_t3_desc:"自らの意志で、結末に到達せよ。"
 leader_kaituozhe_t4:"§M星塵の切り札§!"
 leader_kaituozhe_t4_desc:"氷雪の中で、君は一団の火のような存在であり、この世界の魂を存護する——たとえ君が日夜燃え続けようとも。"
 leader_kaituozhe_t5:"§M拓宇行天の意志§!"
 leader_kaituozhe_t5_desc:"「開拓」が星光を浴びるように、この地から再び旅立とう。"
 hsr_ui.62.title:"指導者詳細-開拓者"
 hsr_ui.62.desc:"$kaituozhe_backstory$"
