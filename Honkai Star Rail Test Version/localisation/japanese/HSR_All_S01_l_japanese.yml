 # DOT_SR_Dvalin_Script_# l_simp_chinese: New file"風魔竜"
 # 艦船
 Dvalin_General:"風魔竜"
 Dvalin_General_desc:"長い年月と果てしない闇の中で、澄んだ宝石も曇り輝きを失い、誇り高き竜も蝕まれ、怨恨に満ちる。だが、忘れるな、塵は容易に拭い去ることができ、疑念と毒も粉砕できる。これは友人からの戒めだ。彼は真面目なことをしない知恵者とは思えなかったが、彼の助けがなければ、今の私はなかっただろう。彼は次のような詩を残している：深空を自由に舞え。あの頃のように、私が大地を歩き風の歌を歌い、君が希薄な大気の高天から世界を見下ろしていたように。今の空には風雪はなく、大地には緑の草が生い茂り、美しいだろう。もし君も地上を歩き、遠くで牧歌と風鈴が織りなす歌を聞き、蜜のように甘い酒を味わったなら、わかるだろう。もし君が私だったなら、青い空を滑空する孤高の君の姿を見て、その美しさを目の当たりにしたなら、わかるだろう。そうすれば、この空と大地は戦う価値があると理解するだろう。しかし、すべては過ぎ去り、彼ももういない。"
 NAME_Dvalin_General:"風魔竜"
 FML_COMPUTER2:"戦闘コンピュータ：砲撃"
 FML_WEAPON:"魔竜の吐息"
 fml_tjq:"推進器"
 fml:"推進器"
 fml_power:"エネルギー"
 fml_plural:"風魔竜"
 fml_mid_template:"風魔竜"
 Dvalin:"風魔竜・トワリン"

 # イベント
 DOT_SR_Dvalin.001.name:"風魔竜"
 DOT_SR_Dvalin.001.desc:"我が名はトワリン。失われた次元、故郷の生命がテイワットと呼ぶ場所から来た。私はテイワットのモンド地方の「四風守護」の一つであり、古の約束に従い、人々を守っていた。そのため、人々は私を東風の竜と呼んだ。しかし、災厄の訪れと共に、すべては終わりを告げた。誰が知ろう、モンドの千里の美しさを。四季折々の花、常緑の木々。一級の茶、五色の瓜、四季の花。暖かな山々に燕が巣くい、人々は北の水辺で閑に暮らす。"
 DOT_SR_Dvalin.001.a:"ようこそ、トワリン"
 DOT_SR_Dvalin.001.b:"ここはお前の来る場所ではない"

 DOT_SR_Dvalin.002.name:"風魔竜"
 DOT_SR_Dvalin.002.desc:"長い年月と果てしない闇の中で、澄んだ宝石も曇り輝きを失い、誇り高き竜も蝕まれ、怨恨に満ちる。だが、忘れるな、塵は容易に拭い去ることができ、疑念と毒も粉砕できる。これは友人からの戒めだ。彼は真面目なことをしない知恵者とは思えなかったが、彼の助けがなければ、今の私はなかっただろう。彼は次のような詩を残している：深空を自由に舞え。あの頃のように、私が大地を歩き風の歌を歌い、君が希薄な大気の高天から世界を見下ろしていたように。今の空には風雪はなく、大地には緑の草が生い茂り、美しいだろう。もし君も地上を歩き、遠くで牧歌と風鈴が織りなす歌を聞き、蜜のように甘い酒を味わったなら、わかるだろう。もし君が私だったなら、青い空を滑空する孤高の君の姿を見て、その美しさを目の当たりにしたなら、わかるだろう。そうすれば、この空と大地は戦う価値があると理解するだろう。しかし、すべては過ぎ去り、彼ももういない。"
 DOT_SR_Dvalin.002.a:"了解"
 DOT_SR_Dvalin.002.b:"さらば"

 DOT_SR_Dvalin.003.name:"風魔竜"
 DOT_SR_Dvalin.003.desc:"我が友よ、君が私の過去に興味を持っているのは分かっている。私もまた、テイワットとモンドの物語を君たちに語り、宇宙がこの失われた歴史を忘れないようにすべきだと思う。「古の事を復し、詩人は歌を紡ぐ。」「神々が地上に住まいし、人の世は幾春秋。」詩人は廃墟の物語、ヴァネッサの物語を語り終え、風竜の物語を語り始めた。彼は詠った：「私の語る物語は太古に遡る。神々がまだ地上を歩いていた時代の物語だ。」その頃、約五千年前、風の元素を携えた竜が高天に誕生した。それはゆっくりと降り立ち、世の中の全てに好奇心を抱いた。村に降り立つと、恐れた人々に石を投げられた。竜は恐怖の中で人々が発する言葉を理解できなかった。墓地に降り立つと、悲しみに暮れる人々の嘆きが絶え間なく聞こえた。竜は悲しみの中で人々が発する言葉を理解できなかった。果樹園に降り立つと、果樹を失った怒れる人々に呪われた。竜は怒りの中で人々が発する言葉を理解できなかった。人の世はあまりにも複雑だった。竜は惑いながらも、それでも挑戦しようとした。ある日、竜は天空の竪琴の音を聞いた。「天空」は竪琴の名前であり、風の神の伴侶でもあった。竜は詩文に惹かれ、空の下で最も優れた歌い手の傍らに降り立った。人々は慌て始めた。強大な元素の竜と、地上を支配する大神たちは、これまで良好な関係を築くことが難しかったからだ。「見てごらん、何と美しく、優しいんだ。」風の歌い手が言った。「しかし、我々は彼が何を考えているのか分からない。」人々は言った。旋律と詩文は竜と人々の両方を惹きつけた——それはどのような魔力だったのか？竜は歌い手の傍らに留まることを決意した。万物がその心を理解できるようになりたかったからだ。竜は人の言葉を学び、風の歌い手の技を習得した。北風騎士の「狼」、蒲公英騎士の「獅子」、西風騎士団の「鷹」、そしてトワリン——「風竜」——これらはモンドの「四風守護」と見なされた。"
 DOT_SR_Dvalin.003.a:"了解"
 DOT_SR_Dvalin.003.b:"さらば"

 DOT_SR_Dvalin.004.name:"風魔竜"
 DOT_SR_Dvalin.004.desc:"我が友よ、君が私の過去に興味を持っているのは分かっている。私もまた、テイワットとモンドの物語を君たちに語り、宇宙がこの失われた歴史を忘れないようにすべきだと思う。「古の事を復し、詩人は歌を紡ぐ。」「神々が地上に住まいし、人の世は幾春秋。」詩人は廃墟の物語、ヴァネッサの物語を語り終え、風竜の物語を語り始めた。彼は詠った：「私の語る物語は太古に遡る。神々がまだ地上を歩いていた時代の物語だ。」その頃、約五千年前、風の元素を携えた竜が高天に誕生した。それはゆっくりと降り立ち、世の中の全てに好奇心を抱いた。村に降り立つと、恐れた人々に石を投げられた。竜は恐怖の中で人々が発する言葉を理解できなかった。墓地に降り立つと、悲しみに暮れる人々の嘆きが絶え間なく聞こえた。竜は悲しみの中で人々が発する言葉を理解できなかった。果樹園に降り立つと、果樹を失った怒れる人々に呪われた。竜は怒りの中で人々が発する言葉を理解できなかった。人の世はあまりにも複雑だった。竜は惑いながらも、それでも挑戦しようとした。ある日、竜は天空の竪琴の音を聞いた。「天空」は竪琴の名前であり、風の神の伴侶でもあった。竜は詩文に惹かれ、空の下で最も優れた歌い手の傍らに降り立った。人々は慌て始めた。強大な元素の竜と、地上を支配する大神たちは、これまで良好な関係を築くことが難しかったからだ。「見てごらん、何と美しく、優しいんだ。」風の歌い手が言った。「しかし、我々は彼が何を考えているのか分からない。」人々は言った。旋律と詩文は竜と人々の両方を惹きつけた——それはどのような魔力だったのか？竜は歌い手の傍らに留まることを決意した。万物がその心を理解できるようになりたかったからだ。竜は人の言葉を学び、風の歌い手の技を習得した。北風騎士の「狼」、蒲公英騎士の「獅子」、西風騎士団の「鷹」、そしてトワリン——「風竜」——これらはモンドの「四風守護」と見なされた。"
 DOT_SR_Dvalin.004.a:"了解"
 DOT_SR_Dvalin.004.b:"さらば"

 DOT_SR_Dvalin.005.name:"風魔竜"
 DOT_SR_Dvalin.005.desc:"「古国に黒日沈み、明珠はその光を失う。黄金はその色を失い、白絹は黄昏に染まる。」これは地底の失落王国カーンルイアで起きたもう一つの物語だ。約三千年前、大陸全体が混乱の時代を経験した。闇の力は拡散し、出会うものすべてを汚染した。その間、大地には蛮族が蔓延り、魔獣が猛威を振るった。人々の生活圏は城壁の内側に圧縮され、野外は危険に満ちていた。その時代はモンドにとって特に厳しかった。獅牙騎士の継承は資格を持つ者が不在のため空位となり、西風騎士団も過酷な戦闘によって人材が枯渇していた。この時、黒日王朝は崩壊し、災厄は古国の城壁を突破して大陸中に広がった。「黄金」と呼ばれた錬金術師は罪人へと堕ち、無数の漆黒の魔獣を生み出した。漆黒の大蛇——悪竜「ドゥリン」——が海から現れ、その影はモンドに迫った。しかしこの時、獅牙騎士の継承は空位のままであり、西風騎士団の鷹の旗は風に翻ることができなかった。絶え間ない怨嗟の声は、ついにモンドの神——風の歌い手——を再び呼び起こした。モンドの人々の祈りは風神の意志を目覚めさせ、天空の竪琴は再び奏でられ、風竜も再び呼び寄せられた。今やモンドは風竜だけが頼りだった。悪竜と風竜は嵐の中で死闘を繰り広げた。風竜は最終的に勝利し、悪竜の喉を噛み砕いたが、毒血を飲み込んでしまった。悪竜の毒血こそ、歪められた黄金であり、山を崩し大地を壊す力だった。風竜はモンドを守り、これで人々が自分を理解してくれると思った。そして長い眠りについた。天空の竪琴は哀しげな調べを奏でた。天空の竪琴は言った、次に目覚める時、君は自由であるべきだと。高天を自由に飛ぶべき竜よ、万物はいつか君の美しさを理解するだろう。"
 DOT_SR_Dvalin.005.a:"了解"
 DOT_SR_Dvalin.005.b:"さらば"

 DOT_SR_Dvalin.006.name:"風魔竜"
 DOT_SR_Dvalin.006.desc:"しかし、万事が思い通りにはいかなかった。ドゥリンの遺骸は寒天の雪原に埋もれ、トワリンは風神によって呼び戻され、眠りについた。人々は風竜が必要な時に目覚め、モンドを守ると信じていた。しかし平和な時代には、四風守護の信仰は失われ、対応する廟も荒廃した。五百年後、トワリンは毒血とアビスの魔術師の影響で迷い、堕落した。再び目覚めた時、友人の竪琴の音ではなく、アビスの魔術師の囁きを聞いた。それは、自分を最も必要とした瞬間に寄り添わなかった主を呪った。トワリンは徐々にかつての風竜ではなく、魔竜へと変貌していった。騎士団に包囲されるまでに落ちぶれた。人々が、騎士団と何度も交戦した見慣れない害獣「風魔竜」が、四風守護のトワリンであると知った時、憎悪に駆られた対立は既に形成され、和解は不可能だった。百年の眠りから覚めたばかりの竜は、この街の裏切りだけを感じたに違いない。幸い、異郷の旅人の助けにより、トワリンは救われた。風向きは変わる。いつか、より明るい方向へと吹く日が来るだろう。ああ、すべてはなんと美しいことか。"
 DOT_SR_Dvalin.006.a:"了解"
 DOT_SR_Dvalin.006.b:"さらば"

 DOT_SR_Dvalin.007.name:"風魔竜"
 DOT_SR_Dvalin.007.desc:"災厄は二千年前のある夜に訪れた。その時、突如天穹が砕け、巨艦が空を横切り、雷霆が地脈を貫き、次元が崩壊し、島々が墜落し、神々は狩られ、民は地火で命を落とした。私は天地の間に立ち、文明が一瞬で灰燼に帰し、親友が一人残らず消え去るのを見届け、ただ独りこの地を逃れ、太虚へと流浪した。その後千年を経て、かつての災厄の黒幕の名が、星河猟手であることを知った。誰が知ろう、モンドの千里の美しさを。四季折々の花、常緑の木々。一級の茶、五色の瓜、四季の花。暖かな山々に燕が巣くい、人々は北の水辺で閑に暮らす。"
 DOT_SR_Dvalin.007.a:"我々は君が我々の文明に加わることを望む。君の復讐を手助けしよう！"
 DOT_SR_Dvalin.007.b:"物語は終わった、さらば、友よ！"

 DOT_SR_Dvalin.008.name:"風魔竜"
 DOT_SR_Dvalin.008.desc:"伝えられるところによれば、仙舟連盟には持明一族の五大竜尊がおり、民を守護しているという。その名は、曜青竜尊は応竜の伝を掌り、風雷を宰制し、胎動の月を守護する責を負い、尊号は「天風君」。朱明竜尊は虬竜の伝を掌り、天火を炳輝し、太始燧皇を守護する責を負い、尊号は「炎庭君」。方壺竜尊は蛟竜の伝を掌り、氷濤を馴致し、方寸煙海を守護する責を負い、尊号は「冱淵君」。玉闕竜尊は地竜の伝を掌り、凝思静黙し、息壌淵石を守護する責を負い、尊号は「昆岡君」。羅浮竜尊は蒼竜の伝を掌り、行雲布雨し、不死建木を守護する責を負い、尊号は「飲月君」。今や、トワリンは第六の竜尊となり、風竜の伝を掌り、雷を裂き霆を撕き、蒼青の空を守護する責を負い、尊号は「嘯風君」と称される。"
 DOT_SR_Dvalin.008.a:"了解"
 DOT_SR_Dvalin.008.b: "さらば"

