 tech_path_path_solt_1:"運命・一"
 tech_path_path_solt_1_desc:"これらの深宇宙を彷徨う神秘的な存在について、人々が知っていることはほとんどない。有限な認識に制約された知的生命は、星神が凡人には見えない運命を歩み、何らかの理念を通じてその計り知れない力を行使していることをかすかに察知するに過ぎない。そして、口承の神話において、星神は高度に凝縮された哲学的観念の化身となった。星神が司る運命の道を歩むことができれば、銀河を超えた遠いまなざしのような感応を受けるだろう。多くの者は、これこそが星神と凡人との唯一の接点であると考える。"
 tech_path_path_solt_2:"運命・二"
 tech_path_path_solt_2_desc:"これらの深宇宙を彷徨う神秘的な存在について、人々が知っていることはほとんどない。有限な認識に制約された知的生命は、星神が凡人には見えない運命を歩み、何らかの理念を通じてその計り知れない力を行使していることをかすかに察知するに過ぎない。そして、口承の神話において、星神は高度に凝縮された哲学的観念の化身となった。星神が司る運命の道を歩むことができれば、銀河を超えた遠いまなざしのような感応を受けるだろう。多くの者は、これこそが星神と凡人との唯一の接点であると考える。"
