 concept_fanyu_effect_desc:"§H有用型§!運命。初期は§G人口成長速度§!、§G居住可能性§!を向上させ、§G人口による帝国規模§!を減少させる。実践値が増加するにつれて、§H幸福度§!、§H毎月有機人口増加§!、§Hポスト効率§!、§H種族居住可能性下限§!を向上させる。§H強制移住費用§!、§H人口住宅使用§!を減少させる。追加で§R指導者維持費§!を増加させる。"
