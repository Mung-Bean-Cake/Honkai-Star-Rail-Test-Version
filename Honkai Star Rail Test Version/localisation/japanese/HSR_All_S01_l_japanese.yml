#初期模擬宇宙プロジェクト
 herta_start_situation_chain_title: "模擬宇宙技術転換プロジェクト"
 herta_start_situation_chain_desc: "四人の天才によって共同開発された模擬宇宙は大成功を収め、我々も下流の技術やプロジェクトを引き受ける機会を得た。関連技術を研究することで、これらの技術を実際の産業やより高度な技術研究に転換し、産業と技術の進歩を推進することができる。\n§B全四つの研究方向があります。すべての技術支援方向を完了すると、飛昇の才覚$ap_herta_premote$を解放します。§!\n現在の研究状況：\n黒塔：[Get_herta_help_text]\nルアン・メェイ：[Get_ruanmei_help_text]\nスクリューガム：[Get_luosi_help_text]\nスティーブン：[Get_sidifen_help_text]"
 tech_reserched:"§G研究済み§!"
 tech_unreserched:"§R未研究§!"
 DOT_SR_Herta.1000.title:"黒塔の技術研究成果受入報告書"
 DOT_SR_Herta.1000.desc:"今回の黒塔の技術研究成果受入は物理学グループが担当した。技術移転は物理学グループの最先端分野の物理モデルを豊かにし、理論面での深い研究方向を指導した。各科室に関連資料が配布され、研究・議論が行われた。今回の受入結果は大成功であった。"
 DOT_SR_Herta.1000.a:"了解"
 DOT_SR_Herta.1000.tt:"黒塔の技術支援方向を完了しました。すべての技術支援方向を完了すると、飛昇の才覚$ap_herta_premote$を解放します。"
 DOT_SR_Herta.1001.title:"ルアン・メェイの技術研究成果受入報告書"
 DOT_SR_Herta.1001.desc:"湛藍星の改造技術の蓄積により、惑星改造技術の研究は急速に進展した。今や短時間で惑星を霊境惑星に変換することができる。遺伝子技術に関しては、小範囲の遺伝子改造テストで悪影響は確認されておらず、安心して新しい遺伝子端を編集できる。"
 DOT_SR_Herta.1001.a:"了解"
 DOT_SR_Herta.1001.tt:"ルアン・メェイの技術支援方向を完了しました。すべての技術支援方向を完了すると、飛昇の才覚$ap_herta_premote$を解放します。"
 DOT_SR_Herta.1002.title:"スクリューガムの技術研究成果受入報告書"
 DOT_SR_Herta.1002.desc:"受入結果：大成功\n以前の宇宙ステーション攻撃で多くの高精度機械設備や機械アシスタントを失ったが、スクリューガムの新技術は新しい設備や機械アシスタントの建造・改造を支援し、生産・建造技術も改善した。同時に、スクリューガム星の技術を参考に、新しい惑星変換技術も習得した。"
 DOT_SR_Herta.1002.a:"了解"
 DOT_SR_Herta.1002.tt:"スクリューガムの技術支援方向を完了しました。すべての技術支援方向を完了すると、飛昇の才覚$ap_herta_premote$を解放します。"
 DOT_SR_Herta.1003.title:"スティーブンの技術研究成果受入報告書"
 DOT_SR_Herta.1003.desc:"宇宙ステーションの防衛ネットワークは強化された。前回の攻撃により宇宙ステーションの防衛ネットワーク強化は喫緊の課題となっていた。スティーブンの参加により防衛システムが再構築され、宇宙ステーションと湛藍星の防衛システムは全面的に強化された。"
 DOT_SR_Herta.1003.a:"了解"
 DOT_SR_Herta.1003.tt:"スティーブンの技術支援方向を完了しました。すべての技術支援方向を完了すると、飛昇の才覚$ap_herta_premote$を解放します。"
 DOT_SR_Herta.1004.title:"銀河学者"
 DOT_SR_Herta.1004.desc:"我々の研究レベルの更なる向上と宇宙ステーションの修復工事の完了により、多数の異星学者が宇宙ステーションに流入し、かつてない研究の波を引き起こした。今や収蔵と研究は秩序正しく進められている。"
 DOT_SR_Herta.1004.a:"進歩の道！"
 DOT_SR_Herta.1004.tt:"飛昇の才覚$ap_herta_premote$を解放"
