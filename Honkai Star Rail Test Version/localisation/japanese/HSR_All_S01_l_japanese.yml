 #刃
 NAME_ren:"刃"
 ren_catch_phrase:"自らを削り、敵を裂く——それが刃だ。"
 ren_backstory:"身を刃に捧げた剣客。本名は不詳。「運命の奴隷」に仕え、恐るべき自己治癒能力を持つ。古剣を手に戦い、その刃は無数の亀裂で覆われている。それは彼の体のようであり、彼の心のようでもある。"
 hsr_paragon.55.name:"星核猟手-刃"
 hsr_paragon.55.a:"初対面"
 hsr_paragon.55.a.response:"開拓者…私は君を知らない。それは君にとって良いことだ。"
 hsr_paragon.55.b:"趣味"
 hsr_paragon.55.b.response:"「刃」の存在は、剣を振るう一瞬だけ、消え去ることができる。"
 hsr_paragon.55.c:"見聞"
 hsr_paragon.55.c.response:"死んだ者に、恐れるものはない。"
 leader_ren_t1:"§M業途の風§!"
 leader_ren_t1_desc:"私より速い武器は数え切れないほどあるが、千の交刃の末にどうなる？"
 leader_ren_t2:"§M玄鋼を冶し、寒芒を銑す§!"
 leader_ren_t2_desc:"この手の剣で、送ってやろう。"
 leader_ren_t3:"§M百死を忍ぶ§!"
 leader_ren_t3_desc:"死はいつ訪れる？待ちくたびれた。"
 leader_ren_t4:"§M万死を大辟す§!"
 leader_ren_t4_desc:"死兆…来たる！"
 leader_ren_t5:"§M命は留まり、魂は銷え、この身に還る§!"
 leader_ren_t5_desc:"この美景、我は求めて得られぬが…諸君と共に賞することができよう。"
