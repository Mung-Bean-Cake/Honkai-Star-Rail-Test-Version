 concept_huimie: "§H「壊滅」§!"
 concept_huimie_desc: "§H「壊滅」、ナヌーク§!\n「壊滅」の運命を司る星神。滅びた世界アードリフンで誕生した。彼はしばしば黒い肌と金色の瞳を持つ人間の男性の姿で現れる。\n§H「もしエントロピー増大が宇宙の不可逆な法則であり、熱的死が物質世界の逃れられない運命ならば、我々は何のために足掻くのか？燃焼し、核融合し、そして消滅せよ。新生を迎えたいなら、まず終焉に身を投じねばならない。」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——琥珀2152紀、核爆弾のボタンを押す直前の科学者の遺言より§!"
 concept_huimie_effect:"運命：「壊滅」"
 concept_huimie_effect_desc:"§H攻撃型§!運命。初期は§G宿敵へのダメージ§!、§G艦隊指揮上限§!を向上させ、§G厭戦度獲得§!を減少させ、§G毎月影響力§!、§G指揮官経験値獲得§!を向上させ、§G法令維持費§!、§G法令費用§!を減少させる。実践値が増加するにつれて、§H海軍容量§!、§H艦船兵器射速§!、§H軌道爆撃ダメージ§!、§H恒星基地へのダメージ§!、§H艦船経験値獲得§!、§H艦船兵器ダメージ§!、§H艦船兵器射程§!を向上させる。§H艦船維持費§!を減少させる。"
