 concept_jiyi: "§H「記憶」§!"
 concept_jiyi_desc: "§H「記憶」、浮黎§!\n思考は存在であり、記憶は存在の証である。「記憶」の運命を司る星神は、忘れられたすべてを記録し、宇宙の再生に備える。\n§H「時間——世界で最も勤勉な泥棒。それは絶えず我々の現在を盗み、『記憶』という倉庫に無造作に投げ込む。ある者は遺失物の受付に没頭し…ある者は喪失に無関心だ。」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——佚名『この人生は短く苦い』§!"
 concept_jiyi_effect:"運命：「記憶」"
 concept_jiyi_effect_desc:"§H有用型§!運命。初期は§G解読§!、§G暗号化§!、§G探知強度§!、§G隠蔽強度§!を向上させ、§G犯罪率§!を減少させる。実践値が増加するにつれて、§H属国信頼度上限§!、§H臣従受諾度§!、§H指導者上限§!、§H指導者経験値獲得§!、§Hカテゴリ別採用可能指導者数§!、§H保護可能な属国数§!を向上させる。§H帝国規模効果§!を減少させる。"
