 yaliluo_story.1005.title:0 "§H星間平和会社§!との関係を調整"
 yaliluo_story.1005.desc:0 "現在の好感度：[from.count_ipc_like]\n対外的な宣伝では、会社は自由貿易を提唱する巨大企業財団である。運営方法としては、通貨を発行し資源を独占する商業独裁である。創業の初心に照らせば、会社は「存護」の星神のために全てを捧げる無私の後援者である。ほとんどの星間市民は会社について語るとき、常に遍在する商品と目を引く標識に言及する。まるで「取引が存在する限り、そこに星間平和会社がある」かのように。実際、銀河のほぼ全ての商業活動は会社の「信用ポイント」システムに基づいている。星間貿易をスポーツ競技に例えるなら、会社はトップアスリートであり、全ての競技種目であり、競技場であり、そしてルールそのものでもある。富に対する絶対的な支配力と、決して止まることのない拡張行動は、星間平和会社に陰謀独裁者のような大衆的印象を与えている。しかし会社は「一手に権力を掌握する」といった低次元のビジョンには微塵も関心がない。なぜなら企業精神は誕生の時から変わることなく、全てを「琥珀王」クリフォーに捧げることだからである。現在の星間平和会社は七つの部門に分かれている。文字通りの「部門」という言葉では、この汎銀河企業の驚くべき規模を捉えきれていないかもしれない。実際には、各会社部門は数十から数百の規模の異なる文明世界を掌握し、そのために代々仕える従業員は億単位であり、その貿易活動の影響を受ける広大な人々については言うまでもない。"
 yaliluo_story.1005.a:0 "関係改善"
 yaliluo_story.1005.b:0 "顧問を招待"
 yaliluo_story.1005.c:0 "協力強化"
