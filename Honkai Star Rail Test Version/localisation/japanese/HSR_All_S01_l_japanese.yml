antimatter_legion_chain: "壊滅-反物質軍団"
antimatter_legion_chain_desc: "運命の異動により帝国は人心惶惶となり、深く調査を進めるほどに不安が募る。躁動する壊滅の運命は何かを予兆しているのか？"
antimatter_legion_chain_title: "壊滅-反物質軍団"
antimatter_or: "令使星系"
antimatter_jz: "進捗"
special_project_find: "最終幻想"


DDT_FY.1_name: "運命の異動"
DDT_FY.1_desc: "我々の市民が最近運命の異変を感じ取り、帝国に報告した。帝国は直ちに状況を調査し、その根源が壊滅の運命の躁動であることを確認したが、我々はこの問題を解決することはできない。"
DDT_FY.2_name: "強いエネルギーの擾乱"
DDT_FY.2_desc: "以前の微かな運命の躁動は今や大幅に増大し、一部の市民が感じ取る範囲から星海全体を覆うエネルギーの擾乱へと拡大した。\n現在までに、このエネルギーが我々に示していること、または伝えようとしていることは、何か強大な存在が目覚めようとしている、あるいは到来しようとしているということのようだ。\n"
DDT_FY.2_name_one: "不吉な予感"
DDT_FY.2_name_two: "我々は準備を整えなければならない"
DDT_FY.3_name: "エネルギー爆発、壊滅の幕開け！"
DDT_FY.3_desc: "先程、我々が長く探し求めていたエネルギー源がついに銀河系に出現した。我々の探知機は——九つの爆発地点を検出した!!!!!\nこの九つの爆発地点はすべて銀河系に現れており、これらのエネルギーは壊滅の気配に満ちている。これほど強力なエネルギーが、小さな嵐であるはずがない。まさか壊滅の星神が戦争を引き起こそうとしているのか？"
DDT_FY.3_name_one: "これは間違いなく災難だ！"
DDT_FY.4_name: "壊滅の幕開け！"
DDT_FY.4_desc: "九つのエネルギー爆発地点は九つの未知の星系に潜伏している。各国は何度も探査船を派遣したが、すべて連絡を絶った。伝送された映像資料から、探査船が攻撃を受けたことが判断できる。\n先程、壊滅のエネルギーが再び爆発した。彼らが行動を開始したことは間違いない。"
DDT_FY.4_name_one: "急げ、防御態勢を整えろ！"
DDT_FY.8_name: "全宇宙への通告"
DDT_FY.8_desc: "宇宙の誕生は誤謬であり、文明は浩瀚な群星の中でひっそりと発生した癌に過ぎず、紛争は知的生命体の間で唯一通じる言語である。この誤りを正し、宇宙の汚点を消し去るために、我はエントロピーの化身となり、すべてを壊滅する。"
DDT_FY.8_name_one: "我々は決して諦めない！"
DDT_FY.8_name_two: "我々を壊滅させる？よくもまあそんなことが言えるな。"
DDT_FY.8_name_three: "降伏して命を助けてもらうことはできるか？"
DDT_FY.12_name: "§R壊滅§!"
DDT_FY.12_desc: "宇宙の誕生は誤謬であり、文明は浩瀚な群星の中でひっそりと発生した癌に過ぎず、紛争は知的生命体の間で唯一通じる言語である。この誤りを正し、宇宙の汚点を消し去るために、我はエントロピーの化身となり、すべてを壊滅する。"
DDT_FY.12_name_one: "反物質軍団？"
DDT_FY.12_desc_one: "反物質軍団、我が配下の信者たちだ。"
DDT_FY.12_name_two: "何をしようとしている？"
DDT_FY.12_desc_two: "我々は自らを文明と生命の絶対的な対立者として位置づける。\n我々は弱体化した文明や強力な文明を何度も破壊し、無数の粉々になった惑星を歩き回り、文明が崩壊する過程で放出される【混沌エネルギー】を吸収し、文明が完全に衰退するまで続ける。\n今、我々は再び目覚めた。\nお前たちが完全に滅びるまで、果てしない壊滅を受け入れよ。"
DDT_FY.12_name_three: "ふん"
DDT_FY.12_name_four: "かかってこい"

DDT_FY.201_name: "§I星神令使——焚風§!"
DDT_FY.201_desc: "§I焚風§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——焚風の仮住まいである。"
DDT_FY.202_name: "§I星神令使——星嘯§!"
DDT_FY.202_desc: "§I星嘯§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——星嘯の仮住まいである。"
DDT_FY.203_name: "§I星神令使——鉄幕§!"
DDT_FY.203_desc: "§I鉄幕§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——鉄幕の仮住まいである。"
DDT_FY.204_name: "§I星神令使——瀆神§!"
DDT_FY.204_desc: "§I瀆神§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——瀆神の仮住まいである。"
DDT_FY.205_name: "§I星神令使——制作§!"
DDT_FY.205_desc: "§I制作§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——制作の仮住まいである。"
DDT_FY.206_name: "§I星神令使——呑星§!"
DDT_FY.206_desc: "§I呑星§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——呑星の仮住まいである。"
DDT_FY.207_name: "§I星神令使——再現§!"
DDT_FY.207_desc: "§I再現§!星系が出現した。この星系内部からの情報によると、この星系は星神令使——再現の仮住まいである。"
DDT_FY.208_name: "§I戦争の坩堝§!"
DDT_FY.208_desc: "§I戦争の坩堝§!星系が出現した。この星系内部からの情報によると、この星系は壊滅の軍事重地である。"
DDT_FY.209_name: "§Iアードリフン§!"
DDT_FY.209_desc: "§Iアードリフン§!星系が出現した。この星系内部からの情報によると、この星系は壊滅の星神ナヌークの仮住まいである。"

NAME_antimatter_hm: "§R反物質軍団§!"
NAME_ANTIMATTER: "§R壊滅§!"
DDT_FY.306_title: "勝利！"
DDT_FY.306_desc: "この広大無辺な宇宙で、我々は前例のない大災厄を経験した。それは星雲を覆う暗雲のように、全宇宙の運命を揺るがした。滅世の危機が迫った時、我々が頼れるのは互いだけだった。我々は国境、肌の色、宗教を問わず団結し、辛苦の末にこの宇宙深淵からの災厄を撃退した。それは我々と壊滅の力との対決であり、星系の安寧と生気を必死に守る闘いだった。今、我々は勝利したが、心にはまだ余震が残る。この勝利は、我々が持つすべてをより大切にし、守ることを教えてくれた。"
DDT_FY.306_desc_a: "ようやく勝利だ。"
DDT_FY.306_desc_b: "勝利は必然だった！"

