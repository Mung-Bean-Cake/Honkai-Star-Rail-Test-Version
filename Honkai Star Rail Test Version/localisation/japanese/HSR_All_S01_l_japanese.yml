 DOT_SR_Dvalin.101.name:"琥珀紀以前の宇宙"
 DOT_SR_Dvalin.101.desc:"宇宙は依然として未開で荒れ狂う太古の時代にあった。後の史学者たちはこの時代を総称して古獣紀元と呼ぶ。その頃、星海は未だ安らかではなく、秩序も生まれていなかった。広大な宇宙は、巨大で原始的な黄昏古獣によって支配され、群星はまばらで、世界は混沌と荒廃の中に沈んでいた。この時代、宇宙にはまだ成熟した文明体系や星間ルールは存在せず、古獣は生まれながらの力で星海を横断し、生まれたばかりの星辰や世界の生気を貪り食っていた。宇宙で最も初期の星神たちがこの乱世に誕生した。均衡、貪饕、秩序、不朽などの本源的な星神が次々と神位に就き、その中でも貪饕の星神オウロボロスは古獣の一脈から変貌を遂げた存在であり、旧時代の覇権の象徴となった。やがて初期文明が芽生え始めると、生命と古獣の生存矛盾は完全に爆発し、星海全体を巻き込む黄昏戦争が幕を開けた。戦火は尽きることなく続き、新たな文明は次第に敗退し、滅亡の危機に瀕し、宇宙の生気はほとんど絶え果てた。それまで……彼は無上の神力をもって長きにわたる戦乱を終結させ、生き残った世界と生命を保護し、古獣が支配する蛮荒の時代を完全に終わらせた。彼とは誰なのか？"
 DOT_SR_Dvalin.101.a:"アキヴィリ！"
 DOT_SR_Dvalin.101.b:"帝弓司命！"
 DOT_SR_Dvalin.101.c:"無量塔姫子！"
 DOT_SR_Dvalin.101.d:"黒塔！"
 DOT_SR_Dvalin.101.e:"スクリューガム！"
 DOT_SR_Dvalin.101.f:"必然的に我々だ！浩瀚たる宇宙、我々は自分自身だけを頼りにできる！"

 #区画
 district_train_planet_1:"列車中核車両"
 district_train_planet_1_desc:"列車処理ユニットの主な格納エリア"
 district_train_planet_2:"パーティー車両"
 district_train_planet_2_desc:"旧称「会議車両」、現名称「パーティー車両」。現在の主な用途は食堂とバーであり、会議やボードゲームにも使われるが、パーティーが開催されたことはない。"
 district_train_planet_3:"展望車両"
 district_train_planet_3_desc:"厳密に言えば、「展望車両」という名称は正確ではないかもしれない。多くの車両には窓があり、「展望」に使えるからだ。しかし、この車両は客をもてなすためによく使われる——おそらく、その多種多様な客こそが車両の「風景」なのだろう。"
 district_train_planet_4:"客室車両"
 district_train_planet_4_desc:"星穹列車の全盛期には、このような乗員車両が数十から百両もあったと言われている。いつか、星穹列車も再び往時の栄光を取り戻すかもしれない。"
 district_train_planet_5:"最後尾車両"
 district_train_planet_5_desc:"通常の「開拓」の旅では、列車メンバーは安全で安定した着陸ポッドを使用して、所定の座標に着陸する。一方、変則的な「開拓」の旅では、星穹列車は最後尾車両を切り離して着陸ポッドとして使用し、車両には十分な生存資源を搭載し、無名客が着陸後に車両を安全ハウスとして行動できるようにする。列車の記録によると、星穹列車の航路士「ボブ」は何度も車両を切り離して着陸を行っており、車両の回収率はわずか42.4％で、回収された車両の修理率は100％だった……それ以来、車両を切り離しての着陸方法は車掌によって厳禁とされ、ごく稀な場合にのみ特別な「予備方案」として使用されている。"
 district_train_planet_1_plural:"列車中核車両"
 district_train_planet_2_plural:"パーティー車両"
 district_train_planet_3_plural:"展望車両"
 district_train_planet_4_plural:"客室車両"
 district_train_planet_5_plural:"最後尾車両"
