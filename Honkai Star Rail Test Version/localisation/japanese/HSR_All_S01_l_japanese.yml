 leader_trait_battlefield:0 "戦場"
 leader_trait_battlefield_desc:0 "いかなる隙も見逃すな。\n§L一部のイベントや決議において、大守護者は特別なスキルポイントを獲得する。\n-§G発展ポイント§!\n-$mod_planet_jobs_produces_mult$：§G+0.25%§!\n-$mod_planet_jobs_upkeep_mult$：§G-0.25%§!\n-§H内政ポイント§!\n-$mod_country_unity_produces_mult$：§G+1%§!\n-$MOD_PLANET_AMENITIES_MULT$：§G+0.01§!\n-$MOD_PLANET_STABILITY_ADD$：§G+0.1§!\n-§M研究ポイント§!\n-$mod_country_physics_research_produces_mult$：§G+1%§!\n-$mod_country_society_research_produces_mult$：§G+1%§!\n-$mod_country_engineering_research_produces_mult$：§G+1%§!"
