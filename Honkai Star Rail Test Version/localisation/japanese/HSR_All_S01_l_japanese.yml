 NAME_jiziqixing:"姫子・啓行"
 jiziqixing_catch_phrase:"「無名客を改めて知る時だ。」"
 jiziqixing_backstory:"「どれほど複雑な過去を持っていようとも、どれほど遠い未来へ向かおうとも、我々の関係は変わらない。私は星穹列車の航路士、姫子。永遠に君と同じ景色を見つめる家族だ。」誰かが共に歩み、誰かが見守る。「開拓」は決して孤帆の旅ではない。彼女は星を拓く奇跡を描き、銀軌は延々と続き、無名客たちは再び船出し、星河の長夜を照らす——終点で彼女は再び振り返り、出航の夢は決して座礁しなかった。"
