 #緋英
 NAME_feiying:"緋英"
 feiying_catch_phrase:"「髪がピンクなほど、ケンカが強い…聞いたことない？」"
 feiying_backstory:"一季の幻月が満ち、一季の世が移り変わる。神秘の少女が再び二相楽園に現れる！落ちる花びらは散りやすく、彼女の滞在も一瞬に過ぎない。新たな時代のすべてに夢中になり、それを誰にも壊させるわけにはいかない——一振りの定規刀で正邪を裁くが、己の善悪を誰が知る？"
 hsr_paragon.69.name:"緋英"
 hsr_paragon.69.a:"初対面"
 hsr_paragon.69.a.response:"お宝発見おめでとう！私は緋英だ。こんにちは、大主役の小さなアライグマ。普段はこのカーニバルで幻月ゲームが円滑に進むようにしているだけだが、今回は君と一緒に舞台に上がるなら、それも悪くないな！"
 hsr_paragon.69.b:"挨拶"
 hsr_paragon.69.b.response:"今日はフワフワ号のアップデートはあった？ない！"
 hsr_paragon.69.c:"見聞"
 hsr_paragon.69.c.response:"世の中の縁は分からないものだ。もしかしたらいつか、花びらの舞い散る街角で再び出会うかもしれない…楽しみにしている。"
 leader_feiying_t1:"§R緋色・楽しからざれば即座に斬る§!"
 leader_feiying_t1_desc:""
 leader_feiying_t1_add:"§R歓楽技—能動バフ技§!\n§Y[アハの瞬間]§!が発動すると§R緋英§!が出演し、BUFF§G海軍、陸軍戦闘力10%上昇§!を獲得、12ヶ月間持続"
