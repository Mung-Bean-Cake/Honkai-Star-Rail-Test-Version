 tr_xunlie_fengrao_1:"§B平和主義者§!"
 tr_xunlie_fengrao_1_flavor:"カーミット行軍蟻、ケイ素を食べる花、そして至る所に存在するコルチ人。超距離伝送技術は大量の商品流通をもたらしただけでなく、数え切れないほどの種の移動ももたらした。それらは貨物箱の中、客の袖の中、さらには腹の中に隠れ、検疫装置の目の前をすり抜ける。そして、集群する菌類は惑星を飲み込み、蔓延する赤潮は海洋を窒息させる。あなたは様々な拠点を奔走し、その痕跡を辿り、ここに属さない生物を撲滅するために知恵を絞る。野蜂は蟻の体に寄生し、毒雨は花の表皮を灼く。来るものは拒まず、水来たら土を以て堰き止める。病が深く入り込む前に、毒をもって毒を制し、絶滅の星火を食い止め、群星に平和の静けさを取り戻すために。"
 tr_xunlie_fengrao_1_desc:"$EFFECTS_TXT$\n—『concept_xunlie_effect』の年間実践値成長：§G+0.5§!$TABBED_NEW_LINE$—『concept_fengrao_effect』の年間実践値成長：§G+1§!$TABBED_NEW_LINE$—虚空蟲へのダメージ：§G+25%§!$TABBED_NEW_LINE$—プレソリン生物へのダメージ：§G+25%§!\n法令を解放：['edict:tr_xunlie_fengrao_1_edict']\n内閣ポストを解放：$councilor_xunlie_fengrao_1$"
