 #ルアン・メェイ
 NAME_ruanmei:"ルアン・メェイ"
 ruanmei_catch_phrase:"「死を加速も遅延もせず、生命はやがて枯れる。」"
 ruanmei_backstory:"気品優雅な学者。「天才クラブ」#81号会員、生命科学分野の専門家。天才的な才能と驚くべき執着心でボーシ尊の注目を集め、密かな場所で生命本源の研究と探求を始めた。そのため黒塔に招かれ、スクリューガム、スティーブンと共に「模擬宇宙」を共同開発した。私生活では伝統演劇と菓子を好み、刺繍にも興味を持っている。"
 hsr_paragon.5.name:"宇宙ステーション「黒塔」-ルアン・メェイ"
 hsr_paragon.5.a:"初対面"
 hsr_paragon.5.a.response:"私はルアン・メェイ。私の名前を呼ぶ時は、途中の間を忘れずに。"
 hsr_paragon.5.b:"趣味"
 hsr_paragon.5.b.response:"唇が最も敏感だ。菓子が上等かどうかは、一口食べれば分かる。私は鮮果や花木など季節の食材を好む。生命の一瞬の姿を捉えることは、ドーパミン反応を引き起こしやすい。"
 hsr_paragon.5.c:"見聞"
 hsr_paragon.5.c.response:"人間は論理を過大評価しすぎる。合理性に固執すれば感情の奴隷になる——科学は熱狂から生まれる。それは才能だ。"
 leader_ruanmei_t1:"§Mゆっくりと爪弾き、また撫でる§!"
 leader_ruanmei_t1_desc:"琴の音は巡り巡る。"
 leader_ruanmei_t2:"§M花の絹を揺らし、水に濡れても摘まない§!"
 leader_ruanmei_t2_desc:"いつ咲こうとも、風に散る日は来る……\n$leader_ruanmei_t2_effect_desc$"
 leader_ruanmei_t2_effect_desc:"§Bルアン・メェイが宇宙獣群の捕獲に成功した後、その遺伝子を利用して自身の知識で小規模な実験を行うことを試みる...§!"
 leader_ruanmei_t3:"§Mフラクタルの螺旋§!"
