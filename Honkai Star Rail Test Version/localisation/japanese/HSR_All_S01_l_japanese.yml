 tr_cunhu_huanyu_1:"§B夢の建築士§!"
 tr_cunhu_huanyu_1_flavor:"手を叩けば、万丈の高楼が立ち並び、世を覆う。瞬きすれば、鳥は風に舞い、枯れ木は花を咲かせる。あなたは手のひらの夢をこねる。まるで粘土細工のように、自由に変形させ、想像力の波が岸に打ち寄せ、時間が止まり、物語は最も美しい瞬間に留まる。この瞬間、悪夢とミームは追い出され、安寧と祥和は決して幕を閉じない。この瞬間、十二の時が空に輝き、五光十色の饗宴が徹夜で祝われる。あなたは生命に満ちた世界を創り出し、それは喜びと共に成長し、人々の眠りの笑顔を守る。星々は歌い続け、優しい雨を降らせる。あなたは傘も差さずにその歌声の中に立ち、紫の朝焼けに浴びる。"
 tr_cunhu_huanyu_1_desc:"$EFFECTS_TXT$\n—『concept_cunhu_effect』の年間実践値成長：§G+0.5§!$TABBED_NEW_LINE$—『concept_huanyu_effect』の年間実践値成長：§G+1§!$TABBED_NEW_LINE$—惑星建造キューの上限：§G+1§!$TABBED_NEW_LINE$—最大区画数：§G+1§!$TABBED_NEW_LINE$—快適度：§G+25%§!$TABBED_NEW_LINE$—惑星インフラ建造速度：§G+15%§!$TABBED_NEW_LINE$—建築費用：§G-15%§!\n惑星表面に新しい区画や建築を建設するたび（交換、アップグレード、再建を除く）、『concept_d_cunhu_huangyu_1_slot』が生成される。\n内閣ポストを解放：$councilor_cunhu_huanyu_1$"
 councilor_cunhu_huanyu_1:"§B夢の建築士§!"
 councilor_cunhu_huanyu_1_desc:"万丈の高楼が立ち、世を覆う。"
