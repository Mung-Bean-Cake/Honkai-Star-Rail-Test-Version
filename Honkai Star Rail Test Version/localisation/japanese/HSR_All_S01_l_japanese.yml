 Pom-Pom_II_MEGASTRUCTURE_DETAILS:"至高ポンポン：星穹列車の車掌。初めから星穹列車に存在している。"
 Pom-Pom_III:"開拓天君：アキヴィリ"
 Pom-Pom_III_DESC:"開拓天君：アキヴィリ。「開拓」の運命を司る星神であり、すでに陥落した星神でもある。彼の消失は謎に包まれているが、既知の星神の中では、アキヴィリは最も人間に近い存在であった。列車の知恵庫の記録によると、彼は凡人と共に歩み、冒険し、戦い、祝い合ったという。「原動力」に束縛された神として、アキヴィリはほとんど凡人のような自由を持っていた。"
 Pom-Pom_III_MEGASTRUCTURE_DETAILS:"開拓天君：アキヴィリ。「開拓」の運命を司る星神であり、すでに陥落した星神でもある。彼の消失は謎に包まれているが、既知の星神の中では、アキヴィリは最も人間に近い存在であった。列車の知恵庫の記録によると、彼は凡人と共に歩み、冒険し、戦い、祝い合ったという。「原動力」に束縛された神として、アキヴィリはほとんど凡人のような自由を持っていた。"

