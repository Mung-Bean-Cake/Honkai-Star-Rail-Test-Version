 r_ev_fleet_bingyangzhang:"星核ロケーター"
 r_ev_fleet_bingyangzhang_desc:"裂界の原理を模倣した人工遺物。理論上存在する世界が球状の位面装飾品に封じ込められる。"
 xinghe_test_chain_title: "星核追跡記録"
 xinghe_test_chain_desc: "§Y星核の封印方法：\n--星核に初めて遭遇したら、技術『technology:tech_seal_star_core』を研究する。\n--工兵船が星核のある星系に恒星基地を建造する。\n--星核の影響を受けた惑星を選択し、惑星決議を有効にする。\n§!§R封印するたびに大量の研究ポイントを獲得する。\n10年ごとに、未処理の星核はすべて段階的にレベルアップするので、速やかに処理してください。§!"
 databank_cosmos_chronicles:"星海紀聞"
 concept_xinghe: "星核災害"
 concept_xinghe_desc: "初めて無主星系に入ると、ランダムな惑星が星核になる確率がある。星核には三種類ある。\n$pc_shielded_white$：封印が容易で、開封しても悪影響はない。\n$pc_shielded_yellow$：生成時に75％の確率で『cosmic_storm:xinghe_small_storm』を生成する。\n$pc_shielded_red$：生成時に『cosmic_storm:xinghe_big_storm』を生成し、封印に失敗する確率がある。\n星核に初めて遭遇すると、技術『technology:tech_seal_star_core』を獲得する。研究完了後、星核を封印できる。\n§C星核の位置の調べ方：\n-情報ログで星核追跡記録を確認する。§!\n§Y星核の封印方法：\n--星核に初めて遭遇したら、技術『technology:tech_seal_star_core』を研究する。\n--工兵船が星核のある星系に恒星基地を建造する。\n--星核の影響を受けた惑星を選択し、惑星決議を有効にする。\n§!§R封印するたびに大量の研究ポイントを獲得する。\n10年ごとに、未処理の星核はすべて段階的にレベルアップするので、速やかに処理してください。§!\n琥珀紀2147年から出現し始めた神秘的な現象。「開拓」が生み出した星間航路上で、不透明な物質が虚数エネルギーの流れを乱している。それは山登りで断崖に直面し、航海で大渦に遭遇するようなものだ——かつては順調だった星間の旅が危険に満ち、先行き不透明になる。この現象は非常に侵略的であり、神秘的な物体「星核」の形で隣接する世界を侵食し続ける——まるで癌細胞が宇宙の至る所に拡散するように。星間平和会社はこれを「万界の癌」と呼び、星間旅行者に決して軽く見てはならないと警告している。万界の癌に侵された世界では、文明や生態系が劇的な変化を遂げ、容易には戻れなくなり、生き残る者はほとんどいないからだ。「万界の癌」については多くの憶測があり、そのほとんどは「壊滅」のナヌークや「反物質軍団」に関連している。これらの宇宙の破壊者は、しばしば星核と同じ場所に現れる。これが偶然なのか必然なのかは、今のところ不明である。\n「万界の癌」が諸世界に蔓延する時、「裂界」と呼ばれる侵食現象も密かに発生している。博識学会は両者に因果関係があると考えており、すなわち「裂界」は「星核」によって引き起こされ、接触した物や空間を特殊な裂界造物に変える。造物は一般的に侵食の形で存在し、原型の記憶や習慣を保っているように見えるが、外見上の振る舞いは大きく異なり、強い排他性を示すことが多い。裂界を研究する学者は警告する：裂界に侵食された物体は、その原型とは全く無関係な存在と見なすべきであり、それに対するいかなる幻想も深刻な結果を招くと。侵食に加えて、裂界は接触した物体のエーテル情報を記録し、裂界自体が保存するデータと混合して、一種の接ぎ木された裂界造物を生み出す。万界の癌に侵されたすべての世界で、無数の遺物、裂界の怪物、さらには神秘的に隔離された異空間が至る所に生まれている。人々はこの行動の背後にある目的を研究し続けている。"
