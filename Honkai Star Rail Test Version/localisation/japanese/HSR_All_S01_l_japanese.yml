 Dvalin_General:"風魔竜"
 Dvalin_General_desc:"長い年月と果てしない闇の中で、澄んだ宝石も曇り輝きを失い、誇り高き竜も蝕まれ、怨恨に満ちる。だが、忘れるな、塵は容易に拭い去ることができ、疑念と毒も粉砕できる。これは友人からの戒めだ。彼は真面目なことをしない知恵者とは思えなかったが、彼の助けがなければ、今の私はなかっただろう。彼は次のような詩を残している：深空を自由に舞え。あの頃のように、私が大地を歩き風の歌を歌い、君が希薄な大気の高天から世界を見下ろしていたように。今の空には風雪はなく、大地には緑の草が生い茂り、美しいだろう。もし君も地上を歩き、遠くで牧歌と風鈴が織りなす歌を聞き、蜜のように甘い酒を味わったなら、わかるだろう。もし君が私だったなら、青い空を滑空する孤高の君の姿を見て、その美しさを目の当たりにしたなら、わかるだろう。そうすれば、この空と大地は戦う価値があると理解するだろう。しかし、すべては過ぎ去り、彼ももういない。"
 NAME_Dvalin_General:"風魔竜"
