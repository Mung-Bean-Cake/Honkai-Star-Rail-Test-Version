 concept_fanyu_desc: "§H「繁育」、タイズスロス§!\n「繁育」の運命を司る古い星神。すでに陥落している。タイズスロスは鞘翅目の最後の一員であり、自己複製の恐怖の如く、無限の繁殖の荒波を率いた。彼、あるいは彼らは諸界を横行し、神々が何らかの方法でその前進を阻止するまで続いた。\n§H「もし正午の空の端に黒い影が現れたら、扉を固く閉ざせ——それは早まった夜の訪れではなく、飢えた蟲群である。」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——エイドリアン・スペンサー＝スミス『星に関する寓話集』§!"
