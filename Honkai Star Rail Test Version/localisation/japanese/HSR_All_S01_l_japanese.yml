xz_building_xz_stronghold:0 "雲騎軍護衛枢"
xz_building_xz_stronghold_desc:0 "雲騎軍は仙舟連盟の武装勢力である。その建制は現存する六つの仙舟に跨り、仙舟の民の安全を守り、豊穣の孽物を討伐する重任を担っている。"
xz_building_xz_researcher:0 "太卜司大衍窮観陣"
xz_building_xz_researcher_desc:0 "羅浮仙舟が未来を占うために用いる大型陣法。卜者たちは無数の玉兆を連結し、往を知り来を鑑み、陰を照らす。大衍窮観陣は常に稼働させ、必要な時にいつでも占いに投入できるようにしておく必要がある。"
xz_building_xz_roboticist:0 "工造司格物院"
xz_building_xz_roboticist_desc:0 "工匠が設計作業を行う場所。設計図や草稿などの保管も行われる。"
