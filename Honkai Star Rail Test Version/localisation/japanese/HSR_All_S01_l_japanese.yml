#イベント
 luosi.100.name:"第三次産業再生運動"
 luosi.100.desc:"#76スクリューガムが機械生命のために艱難辛苦の末に平和を勝ち取って以来、我々は二度の産業再生運動を経験してきた。現在、我々の技術レベルは新たな高みに達しており、第三次産業再生運動を推進し、宇宙の衆生を脅かす危険な勢力に常に警戒しながら、我々のハードパワーを徐々に強化する時である。"
 luosi.100.a:"時を待たず"
 luosi.100.tt:"伝統を解放['tradition_category:tradition_luosi']"
 luosi.101.name:"機械合体-分離"
 luosi.101.desc:"機械の特殊な利点により、機械人口を戦艦に変換するか、工業生産に組み込むか、惑星のある星系の艦隊や工業施設を人口に分解するかを選択することができる。工場は調整済みであり、具体的な要件を指定されたい。"
 luosi.101.a:"戦艦を分解して機械人口に変換"
 luosi.101.b:"工業施設を分解して機械人口に変換"
 luosi.101.c:"人口を合体させて戦艦に変換"
 luosi.101.d:"人口を合体させて工業施設に変換"
 luosi.102.name:"戦艦の分解"
 luosi.102.desc:"艦船の規模は分解後に生成される人口の数を決定する。分解によって生成される人口は主要種族となる。"
 luosi.102.a:"やめておく"
 luosi.107.name:"真の兄弟！"
 luosi.107.desc:"我々と銀河間の他の機械文明との交流が深まるにつれて、影響力のある機械たちは、我々が新たな統合国家に再編成されるべきだと声を上げ始めた。同じ機械として、我々には大きな違いはない。おそらく彼らの提案を考慮し、統合国家を形成すべきだろう。"
 luosi.107.a:"[event_target:target_country_dipio_1.GetName]と統合国家を形成"
 luosi.107.b:"[event_target:target_country_dipio_2.GetName]と統合国家を形成"
 luosi.107.c:"[event_target:target_country_dipio_3.GetName]と統合国家を形成"
 luosi.107.d:"[event_target:target_country_dipio_4.GetName]と統合国家を形成"
