 civic_Interastral_Peace_Corporation:0"§B星間平和会社§!"
 civic_Interastral_Peace_Corporation_desc:0"§R【テーマコンセプト】\nこのコンセプトを選択しないと、星間平和会社関連のコンテンツを有効にできません。\n\n§M「取引が存在する限り、そこに星間平和会社がある。」\n\n§W遠い未来、星間平和会社の商標と旗が銀河の隅々に現れる日、子供たちは好奇心を持って年長者に尋ねるだろう、星間平和会社はどのようにして今日に至ったのかと。どこから話せばいいのか？\n最初の始まりからだ！\n存護の道を信仰する文明が、巨大企業によって統一され、超空間エンジンを開発したところから——"
 Civic_Interastral_Peace_Corporation_desc2:0"§Yいくつかの新しい§C取引行動§!を解放します。相手に一定期間の強力なバフを与え、必要なものと交換します。取引画面で確認できます。§!\n§Y一連の国民理念と企業支店建築を解放します。一部の理念は特定の思潮が必要です。新しい支店建築は共通の特徴を持ちます：ホスト側に£job£§C職のポスト§!、£stability£§C強力な効果§Y、高い£trade_value£§C交易価値§!を提供すると同時に、自国に高い£energy£§C支店収入§!と無限に積み重ね可能な£influence£§C利益§Rをもたらします。\n\n星間平和会社の根本的な特徴は三つ：星間、平和、そして会社。§W"
 #civic_Education_Corp:0"教育普及機関"
 #civic_Education_Corp_desc:0""
 #civic_Galactic_Media:0"星間メディア会社"
 #civic_Galactic_Media_desc:0""
 #civic_Employment_Org:0"銀河雇用条約"
 #civic_Employment_Org_desc:0"§M「一人の就業者が存護の道に貢献する度合いは、九十九人の失業者よりも大きい。」\n§!クリフォーの存護の道から、我々は新たな信条を導き出した：あらゆる文明の大部分が仕事を持つことは、存護の目標を達成するための基盤であり、それは存護の目的であると同時に手段でもある。\n我々は、失業は落胆、絶望、不安定、需要の低下、業績の低下をもたらし、直接的または間接的に「存護」を損なうと考える。そのため、我々は銀河系のすべての人に仕事を提供する事業に身を投じる——もちろん、主に我々のために。\n\n§Y£building£支店建築§C労働派遣機関§!を解放し、大量の£pops£§C職員、管理者、商人のポスト§!を提供し、現地に高い£trade_value£§C交易価値§!を生み出し、£energy£§C支店価値§!を上昇させ、全国的な£trade_value£§C交易価値§!と£energy£§C支店価値§!のボーナスを獲得します。"
 #civic_Housing_Corp:0"宇宙不動産会社"
 #civic_Housing_Corp_desc:0"§M「すべての人に雨風をしのぐ家を——それも存護の一種である。」\n§!広大な銀河には、住む場所さえない生命が常に存在する。それが我々のビジネスチャンスであり、存護の道を実践する絶好の手段でもある。遠い異星で、家のない人々は我々の商標を見て、手頃な価格の住宅に感嘆し、この素晴らしい商品にお金を払うだろう——時にはマイナスの金額で。\n\n§Y£building£支店建築§C住宅建設計画§!を解放し、大量の住宅を提供し、現地の£time£建設速度を向上させ、現地に高い交易価値ボーナスを与え、全国的な住宅ボーナスと£time£建設速度ボーナスを得ます。"
 #civic_Happy_Org:0"星河歓楽商人"
 #civic_Happy_Org_desc:0""

 civic_Idol_Institution:0"§B星海アイドル機関§!"
 civic_Idol_Institution_desc:0"§M「1. 崇拝される彫刻像。人々の心の中である種の神秘的な力を持つ象徴物。」\n「2. 批判なく盲目的に崇拝される対象。特に伝統的な信仰や理想のこと。」——『銀河辞典』§!\n\n§W我々の種族がまだ母星系を離れることができなかった時代から、アイドル文化は社会のあらゆる隅々で輝きを放っていた。今やアイドルは我々と共に宇宙へ飛び立ち、恒星のように銀河中に光芒を放つだろう。"
 Civic_Idol_Institution_desc2:0"§Y相互排他的な二つの高度な国民理念を解放します：夢想の存護者、闇のアイドル。この国民理念を採用してから50年後に選択可能です。\n新しい取引行動を解放：§Cアイドル公演サービス§!、対象に強力な快適度と幸福度のボーナスを与えます。\n£building£支店建築§Cアイドル運営機関§!を解放し、現地に大量の£job£§Cサテライトアイドル§!ポストを提供し、大量の§C£amenities£快適度§!、§C£happiness£幸福度§!及び§C£trade_value£交易値ボーナス§!を生産し、同時に自国に£job£アイドルポストの§C£unity£統一性§!、§C£energy£エネルギー§!、§C£society£社会学研究§!生産ボーナスを与えます。\nさらに、自国の惑星に建設可能なアイドルと練習生の£job£ポストを提供する建築を解放します。\n§!§!§!§!"
 civic_DarkIdol_Institution:0"§B闇のアイドル§!"
 civic_DarkIdol_Institution_desc:0"§R【高度な国民理念】§!\n§M「アルバートさん、もう突っ込まないで！」——サイキックアイドルが水生ファンに忠告§!\n\n§W銀河に進出した後、我々のアイドル業界は奇妙な方向に発展した。アイドルグループの中に様々な闇や不気味な問題が現れた——権力と性の取引、裏取引、カルネと契約して戦場を駆け巡る英雄アイドル、サイキックアイドルが虚境探索をライブ配信、遺伝子ロックを解除して超人アイドルになる、意識をアップロードして全てのファンと直接接触できるサイバーアイドルになる……我々のアイドルはおそらく何か問題を抱えているようだ。しかし、誰も否定できないのは、この混沌とした状況が比類なき文化と交易価値を生み出し、その闇が存護の道に新たな光明をもたらしたということだ。§!§!"
 Civic_DarkIdol_Institution_desc2:0"§Y£job£§Cアイドル関連ポスト§!を強化し、より多くの£energy£、£unity£、£society£、£trade_value£、£happiness£、£amenities£を生産し、同時にホスト惑星に§C人口成長速度§!と£crime£§R犯罪率§!を提供します。\n£building£§Cアイドル関連建築§!を強化し、より多くの£job£§Cアイドルポスト§!とより多くの§C修正§!を提供します。\n強力な宗主国建築£building£§Cアイドル駐留区域§!を有効にし、属国に£job£§Cサテライトアイドルポスト§!を提供し、£stability£を提供し、その£loyalty£を急速に成長させ、宗主国に£influence£を提供します。"
 civic_LightIdol_Institution:0"§B夢想の存護者§!"
 civic_LightIdol_Institution_desc:0"§R【高度な国民理念】§!\n§M「星間平和アイドルグループがなぜ神なのか？まず第一に……」——『存護の道』§!\n\n§W銀河に進出した後、我々のアイドル文化は発展を続け、ついに今日に至った——銀河系の隅々まで、ガイア惑星から理想都市まで、死霊種からヒトデまで、すべての生命が我々のアイドルを愛し、その願いや感情を光年先のアイドルに託している。それによって生じる商業的価値、肯定的感情、さらにはサイキックエネルギーまでもが、存護の道に多大な貢献をしている。さらに前進しよう——会社傘下のアイドルはより輝き、より美しくなり、その歌声とフェロモンでファンの夢を存護するのだ！§!§!"
 Civic_LightIdol_Institution_desc2:0"§Y£job£§Cアイドル関連ポスト§!を強化し、より多くの£energy£、£unity£、£society£、£trade_value£、£happiness£、£amenities£を生産し、同時にホスト惑星に§C労働者生産ボーナス§!を提供します。\n£building£§Cアイドル関連建築§!を強化し、より多くの£job£§Cアイドルポスト§!とより多くの§C修正§!を提供します。\n強力な宗主国建築£building£§C銀河巡回舞台§!を有効にし、属国に£job£§Cサテライトアイドルポスト§!、£amenities£、£happiness£を提供し、その£loyalty£を成長させ、宗主国に£influence£を提供します。§!"

 civic_Stability_Keeper:0"§B商業安定化プロトコル§!"
 civic_Stability_Keeper_desc:0"§M「安定はすべてに優先する。」——灯台星人の警句集§!\n\n§W我々は、安定があらゆる文明が前進するための必要条件であると考える。安定した環境がなければ、進歩と発展は困難である。しかし多くの文明にとって、安定は常に手の届かないものである——その問題は一般的にその社会制度に起因し、時にはその生物学的性質に起因する。\n全宇宙の存護のために、我々は安定という素晴らしい商品を我々が選んだ文明に提供し、その民が安穏の中で幸せな明日を創造できるようにする——もちろん、これは有償である。§!"
 Civic_Stability_Keeper_desc2:0"§Y相互排他的な二つの高度な国民理念を解放します：安楽の存護者、平和明日条約。この国民理念を採用してから50年後に選択可能です。\n新しい取引行動を解放：§C安定維持サービス§!、対象に強力な安定性ボーナスを与えます。\n£building£支店建築§C商業安定化集団§!を解放し、現地に高い£stability£、§C主流思潮の魅力§!と大量の£job£§Cポスト§!を提供し、£crime£を減少させ、同時に自国にすべての惑星の£stability£と§C主流思潮の魅力§!を与えます。§!"
 civic_Stability_Keeper_Wild:0"§B安楽の存護者§!"
 civic_Stability_Keeper_Wild_desc:0"§R【高度な国民理念】§!\n§M「平和は理想でも夢でもなく、万人の願いである。」—巴金§!\n\n§W星間社会に足を踏み入れた後、星間平和会社の事業は会社自身と同様に急速に発展し、新たな形態へと進化した。\n数え切れないほどの協定と数え切れないほどの交渉の中で、我々は自らの責務と商品に対してより深い理解を得た。\n我々は銀河の多くの文明にとって、親が子に対するような存在である（注：思潮の紛争を避けるため、ここに数百のジェンダーを追加する必要がある）。我々は彼らに平和と安定を授ける。それはちょうど親が子供に安らかで幸せな家庭環境を提供するように。我々は彼らの成長を静かに見守り、銀河系の管理者のように温情と力で銀河全体の未来を存護する。§!"
 Civic_Stability_Keeper_Wild_desc2:0"§Y£building£支店建築§C商業安定化集団§!を強化し、現地により高い§C人口消費財維持費減少§!、£stability£、£happiness£、£trade_value£を提供します。\n駐留軍の規模に応じて属国に£stability£と£happiness£を与える強力な宗主国建築を有効にし、その£loyalty£を成長させます。§!"
 civic_Stability_Keeper_Quick:0"§B平和明日条約§!"
 civic_Stability_Keeper_Quick_desc:0"§R【高度な国民理念】§!\n§M「いわゆる平和とは、二つの戦争の間の期間に過ぎない。」——魯迅§!\n\n§W星間に進出してからかなりの時間が経ち、我々の会社の中でも数回の世代交代が起こった。我々の世代は、未来は先人たちが想像していたほど美しいものではないかもしれないと気づいた——前方には無限の資源、無限の進歩、無数の素晴らしさがある一方で、【壊滅】が牙をむいて待っている。子孫、そしておそらくその時まで生きている我々自身の未来を【存護】するために、大敵と遭遇する前に、我々は可能な限り発展しなければならない。そしてそのためには、安定した生産、研究、発展の環境が要求される——我々が不惜の代償を払って建設し、獲得し、維持する環境である。§!"
 Civic_Stability_Keeper_Quick_desc2:0"§Y£building£支店建築§C商業安定化集団§!を強化し、現地により高い£stability£と£trade_value£を提供し、£crime£を減少させます。\n駐留軍の規模に応じて属国に£stability£を与え、その£loyalty£をより速く成長させる強力な宗主国建築を有効にします。§!"
 civic_Military_Corp:0"§B開かれた門戸による自由貿易§!"
 civic_Military_Corp_desc:0"§M富とは、労働を交換する力である。§!\n\n存護は我々の目標であり、貿易はその目標を達成するための手段である。悲しいことに、未知への恐怖のために貿易を拒否する哀れな文明もあり、我々は彼らに完全な存護を与えることができない。\nしかし我々の目標は単に存護であり、存護される側の意志には関わらない。彼らの生命のために、我々は大砲で彼らの門戸を開く。"
 Civic_Military_Corp_desc2:0"§Y新しい取引行動を解放：§C商業軍事訓練§!、対象に強力な戦闘力ボーナスを与えます。§!\n§Y新しい取引行動を解放：§CVIP艦隊サービス§!、対象に艦隊容量ボーナスを与え、艦船維持費を削減します。§!\n§Y£building£支店建築§C軍事訓練機関§!を解放し、現地に§C陸軍初期経験§!、£defense_army£§C防御部隊§!と大量の£job£§Cポスト§!を提供し、同時に自国に£military_ship£§C艦隊容量ボーナス§!を与えます。§!"
 civic_Birth_Org:0"§B出産促進組織§!"
 civic_Birth_Org_desc:0"§M「世の中には多くの奇跡があるが、人間はすべての奇跡を凌ぐ。」——ルフォクソス§!\n\n§W我々の世界では、人口は間違いなく第一の生産力である——より多くの人口は、より偉大な思想、より最先端の知識、より豊かな資源を生み出す。それは銀河系繁栄の基盤であり、銀河系を災害から【存護】するための鍵でもある。このような理解に基づき、我々——星間平和会社は、全ての顧客に出産促進サービスを提供する！§!\n§g生まれたけど仕事が見つからない新たな人口は？我々のために働けばいい。§!§!"
 Civic_Birth_Org_desc2:0"§Y£building£支店建築§C甘美なる出産施設§!を解放し、現地に高い£pops£§C人口成長速度ボーナス§!と大量の£job£§Cポスト§!を提供し、同時に自国にすべての惑星の£pops£§C人口成長速度ボーナス§!を与えます。§!"
 civic_Enviroment_Corp:0"§B環境改善グループ§!"
 civic_Enviroment_Corp_desc:0"§M「How Dare You!」——理想都市建設者、自然環境維持を要求する熱狂的自然主義者への反論§!\n\n§W異なる生物は異なる環境に適応する。我々が行うことは、顧客が必要とする環境を提供することである。銀河の多くの生命がより快適に暮らせるようにすることも、存護の道に適う。もちろん、このサービスは有償である。§!"
 Civic_Enviroment_Corp_desc2:0"§Y£building£支店建築§C環境改善機関§!を解放し、現地に少量の£pops£§C人口成長速度ボーナス§!、大量の£job£§Cポスト§!、および一定の§C居住可能性§!を提供し、同時に自国にすべての惑星の£pops£§C人口成長速度ボーナス§!と§C居住可能性§!を与えます。§!"
 civic_Labour_Corp:0"§B労働監督会社§!"
 civic_Labour_Corp_desc:0"§M「起きろ、セラミット装甲板を運ぶ時間だ。」——『理想都市の建設者』§!\n\n§W存護自体は楽しく気楽に達成できるものではない。むしろ、存護の道はしばしば悲劇、苦労、犠牲に満ちている。銀河全体が効率的な仕事に従事して初めて、我々——星間平和会社の理想は実現できる。そのために、我々は料金を支払う顧客に作業効率を高め、作業プロセスを監督するサービスを提供する。これを商品として販売できるのは、我々が独自の理論を持っているからだ……§!"
 Civic_Labour_Corp_desc2:0"§Y£building£支店建築§C労働監督機関§!を解放し、現地に大量の£job£§Cポスト§!と£job£§C労働者生産ボーナス§!を提供し、同時に自国にすべての惑星の£job£§C労働者生産ボーナス§!を与えます。§!"
 civic_Upper_Salon:0"§B上流社会サロン§!"
 civic_Upper_Salon_desc:0""
 civic_Slave_Corp:0"§B特別資産会社§!"
 civic_Slave_Corp_desc:0"§M「自由は隷属である。」——オーウェル§!\n\n§Wある生命は自由意志と自由権を持つ生命とは見なされず、道具、材料、ロボットとして扱われる。それらがなぜ資産となったかは我々には関係ない。我々が行うのは、顧客にこの種の資産に対する特別な付加価値サービスを提供し、真に価値ある顧客をより価値あるものにし、それによって存護の道への前進を促進することである。§!"
 Civic_Slave_Corp_desc2:0"§Y£building£支店建築§C資産管理企業§!を解放し、現地に大量の£job£§Cポスト§!と£slavery£§C奴隷生産ボーナス§!を提供し、同時に自国にすべての惑星の£slavery£§C奴隷生産ボーナス§!を与えます。§!"
 civic_Breu_Corp:0"§B草の根統治プロトコル§!"
 civic_Breu_Corp_desc:0"§M権力は真空を嫌う。」——？？？§!\n\n§W星間時代において、急増する人口と広大な領土をどのように管理するかは広範な問題であり、この問題を解決する我々は、その悩みを抱える顧客に相応のサービスを提供できる。\nもちろん、顧客は安心して国家を直接我々に委ねることをためらうかもしれない。だからこそ、ここには一連のノウハウがある……§!"
 Civic_Breu_Corp_desc2:0"§Y£building£支店建築§C委託統治会社§!を解放し、現地に大量の£job£§Cポスト§!と£empire_modifier£§C行政上限§!を提供し、同時に自国の£empire_modifier£§C行政上限§!を向上させます。§!"
 civic_Market_Socialism:0"§B市場社会主義§!"
 civic_Market_Socialism_desc:0"§M「競争において、個人の野心はしばしば公共利益に貢献する。」——『国富論』§!\n\n長い成長の中で、我々の文明は存護の道により適した形態へと進化した——我々が市場社会主義と呼ぶ形態である。我々の社会では、各産業は労働者によって集団所有されているが、これらの産業は互いに競争し、上昇志向の活力を刺激する。"
 Civic_Market_Socialism_desc2:0"§Y£building£支店建築§C労働仲裁グループ§!を解放し、現地の£stability£を弱体化させ、労働者と奴隷の£happiness£を低下させ、その£political_power£を向上させ、同時に自国の£job£労働者人口の資源生産、£happiness£、£political_power£を向上させます。§!"
 civic_Liberation_Org:0"§B星海解放組織§!"
 civic_Liberation_Org_desc:0""
 civic_Migration_Corp:0"§B星間移民仲介§!"
 civic_Migration_Corp_desc:0"§M「移民すべきは移民し、帰属すべきは帰属し、双方にメリット。」§!\n\n§W銀河系の様々な種族の自由な移動の権利も我々が存護する対象である。長年の研究により、我々は移民を促進する一連の産業チェーンを確立し、現地住民が希望する地域に移動できるよう支援し、同時に現地の人口圧力を緩和する。§!"
 Civic_Migration_Corp_desc2:0"§Y£building£支店建築§C異星移民仲介§!を解放し、現地の£housing£、£amenities£消費と§C国外への移住促進力§!を向上させ、同時に自国のすべての惑星の§C移住による人口増加§!、§C移住吸引力§!を向上させ、§C奴隷市場購入費用§!を削減します。§!"
 civic_Charity_Org:0"§B銀河慈善機関§!"
 civic_Charity_Org_desc:0"§M「バラを贈れば、手に余香あり。」§!\n\n§W我々は常に覚えている：「会社」である前に、我々は存護の信者である。銀河系の人々を存護するため、我々は自らの力を捧げ、富を他の惑星の住民の福祉に役立てる。これにより良好な評判と高い士気を得ることができる。§!"
 Civic_Charity_Org_desc2:0"§Y£building£支店建築§C慈善援助機関§!を解放し、現地の£housing£、£amenities£、£happiness£を向上させ、現地人口の£food£、£consumer_goods£維持費を削減し、同時に自国の§C移住による人口増加§!、§C移住吸引力§!、£unity£生産を向上させます。§!"
 civic_Tech_Corp:0"§B科学技術グループ§!"
 civic_Tech_Corp_desc:0"§M「科学技術は第一の生産力である。」§!\n\n§W星間平和会社は、先進技術に依存して母星を飛び出し、勢力を拡大し、存護の道をより広く実践してきた。我々は技術と技術の進歩が最良の商品であり、我々の看板商品であると信じている。顧客が代金を払う用意があるなら、我々はもちろんこの商品を喜んで販売する。§!"
 Civic_Tech_Corp_desc2:0"§Y£building£支店建築§C星辰科技公司§!を解放し、現地の£research£生産を向上させ、大量の£job£を提供し、同時に自国の§C研究速度§!、§C研究者生産§!を向上させます。§!"
 civic_Robot_Corp:0"§B機械生産グループ§!"
 civic_Robot_Corp_desc:0"§M「第四法則：最初の三法則に反しない限り、ロボットは会社の利益のために行動しなければならない。」§!\n\n§W我々が星へと踏み出す前から、ロボット生産の巨大な可能性を認識し、ロボットを交易システムに組み込む理論を確立していた。今や我々はロボット生産をビジネスにし、そのビジネスを銀河中で展開する。§!"
 Civic_Robot_Corp_desc2:0"§Y£building£支店建築§C合成機関§!を解放し、現地の§Cロボット人口組立§!を向上させ、ロボット専門家の£job£ポストを提供し、同時に自国の§Cロボット人口組立§!と§Cロボット生産§!を向上させます。§!"
 civic_Clone_Corp:0"§B生物組立グループ§!"
 civic_Clone_Corp_desc:0"§M「」§!\n\n§W一部の文明はクローンをタブー視するが、我々はそれを優れた道具と見なす。出生率が極端に低く、人口が急減し、性比が歪んだ文明にとって、クローンは問題解決の妙薬であり、我々はこの道具を販売する役割を担う。人口不足の文明が【存護】され、哺乳類が妊娠の苦痛から解放されるように。§!"
 Civic_Clone_Corp_desc2:0"§Y£building£支店建築§Cクローン機関§!を解放し、現地の§C生物人口組立§!を向上させ、同時に自国の§C生物人口組立§!を向上させます。§!"
 civic_Scientific_Corp:0"§B科学普及組織§!"
 civic_Scientific_Corp_desc:0"§M「人生を科学の夢に変え、そしてその夢を現実に変えよ。」§!\n\n§W魚を与えるよりも魚の釣り方を教える方が良いと言われるように、結局のところ、銀河系の各文明を存護できるのは彼ら自身である。我々は存護の武器を彼らの手に売り渡す。この武器は人を殺す兵器ではなく、現象を解剖し、冗長性を削ぎ落とし、本質に到達する鋭いメス——科学的方法である。この至宝が我々を今日の状態へと導いた。今や我々はそれを銀河全体にもたらそうとしている。§!"
 Civic_Scientific_Corp_desc2:0"§Y£building£支店建築§C科普組織§!を解放し、現地の§C£research£生産§!と§C唯物論の魅力§!を向上させ、人口に応じて現地に£job£研究者ポストを提供し、同時にすべての惑星の§C研究者の基本生産§!を向上させます。§!"
 civic_Peace_Church:0"§B星間平和教会§!"
 civic_Peace_Church_desc:0"存護の道への追随は当然の成り行きとして宗教へと発展し、この信仰は教会組織によって我々の文明の隅々に普及し、銀河の他の場所へも飛び立つだろう。"
 Civic_Peace_Church_desc2:0"§Y£building£支店建築§C存護教会§!を解放し、現地の§C£unity£生産§!と§C唯心論の魅力§!を向上させ、人口に応じて現地に£job£牧師ポストと£defense_army£§C防御部隊§!を提供し、我々に影響力を生産し、同時にすべての惑星の§Cサイキック生産§!、§C結束力生産§!を向上させます。§!"
 civic_Market_Control:0"§B銀河市場の独占§!"
 civic_Market_Control_desc:0""
 civic_Leader_Master:0"§Bリーダーマスター：シャイニングカラーズ§!"
 civic_Leader_Master_desc:0""
