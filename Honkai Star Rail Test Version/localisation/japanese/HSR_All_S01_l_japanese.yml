 #不死途
 NAME_busitu:"不死途"
 busitu_catch_phrase:"「老狼の牙は、まだ抜けていない。」"
 busitu_backstory:"気ままな営業、本格的な推理、直感だけで屡々難事件を解決。猿が助手で、引退を夢見る探偵は冷蔵庫で寝て、釣られるのを待つ。幻月の下、猛獣が遠吠え、彼の追跡ゲームはどのように終わるのか？"
 hsr_paragon.66.name:"不死途"
 hsr_paragon.66.a:"初対面"
 hsr_paragon.66.a.response:"私は「不死神探事務所」の名探偵、不死途だ。これが名刺だ。私はあらゆる依頼を引き受ける。迷子の犬猫の捜索、保護者会への代理出席、銀河指名手配犯の捕獲、星神の行方の追跡——何を依頼する？"
 hsr_paragon.66.b:"挨拶"
 hsr_paragon.66.b.response:"待たせたな。探偵は決して欠席しない、ただ時々遅刻するだけだ——新たな手がかりが現れた、話さないか？"
 hsr_paragon.66.c:"別れ"
 hsr_paragon.66.c.response:"次に会おうと言った後、大抵の人々は撃ち出された弾丸のように二度と戻らない。だから、ハグはどうだ？"
 leader_busitu_t1:"§M饗宴、始まりも終わりもなし§!"
 leader_busitu_t1_desc:""
 leader_busitu_t1_add:"§B積層技§!\n宇宙戦に勝利すると、§H不死途§!が§G【婪酣】§!を1層蓄積する——各§G【婪酣】§!層はBUFF§G艦船船体値+1%§!を提供する。\n現在の層数：[from.yuzhousuipian]"
