 #起源
 origin_luosi_star:"スクリューガム星"
 origin_luosi_star_desc:"我々の惑星が滅びかけた時、我々の中の賢明な個体は狂気の計画を実行することを決断した。それは、消えかけていた母星を燃料として星体差分機を駆動し、演算後に完璧な生存環境をシミュレートしてスクリューガム族が居住できるようにするというものだった。天才クラブ#76のスクリューガムは、スクリューガム星（機械惑星IX）の統治者であり、宇宙で名高い存在である。彼の知恵は惑星全体を超えており、それによってスクリューガム星の本質を見抜いた。スクリューガム星自体は一つの試みと実験であり、優雅な方程式と冷たいローラー群がこの惑星を構成し、彼ら無機生命を生み出したのだ。星体差分機の目的は宇宙と生命の本源を解析することであり、もし生存環境をシミュレートできるなら、それは宇宙と生命の構成基本単位、すなわちあの優雅な方程式を理解していることを意味する。それがまさに、その学者が差分機を構築した目的である。しかし、これが本当に無機生命の本源なのかは、スクリューガムにとっては議論の余地がある——なぜなら、方程式の誤りは星体差分機がスクリューガム星の生存環境を再構築できなくなることを意味し、現在も星体差分機は稼働しており、この方程式は反証が難しいからだ。スクリューガムは、先人の思想が正しいかどうかを確認するために長い年月を費やすことを決して良しとしなかった。彼は自ら宇宙の本源を探求することを決意する。"
