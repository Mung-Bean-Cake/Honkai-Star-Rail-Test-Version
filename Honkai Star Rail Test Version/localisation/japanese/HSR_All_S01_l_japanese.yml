#国民理念
civic_The_Destruction:0 "実践-『concept_huimie_effect』"
civic_The_Destruction_desc:0 "宇宙の誕生は誤謬であり、文明は浩瀚な群星の中でひっそりと発生した癌に過ぎず、紛争は知的生命体の間で唯一通じる言語である。この誤りを正し、宇宙の汚点を消し去るために、ナヌークはエントロピーの化身となり、諸神の否定を抱いて星神へと昇華した。「壊滅」は過程ではなく結果である。彼が約束する道では、すべての運命の星神は熱的死において終焉を迎える。"
councilor_oracle_destruction:0 "壊滅の神使"
councilor_oracle_destruction_female:0"$councilor_oracle_destruction$"
councilor_oracle_destruction_desc:0 "宇宙の誕生は誤謬であり、文明は浩瀚な群星の中でひっそりと発生した癌に過ぎず、紛争は知的生命体の間で唯一通じる言語である。"
civic_The_Harmony:0 "実践-『concept_tongxie_effect』"
civic_The_Harmony_desc:0 "複数の諧楽天体世界からなる集群星神。千面一体のヒペは、調和のとれた喜びを謳い上げる。宇宙の無情な法則に対抗するため、知的生命は弱い私欲と個人の差異を消し去り、一つの諧楽に溶け込む必要がある——強をもって弱を支え、死をもって生を護る。"
councilor_oracle_harmony:0 "同諧の神使"
councilor_oracle_harmony_female:0"$councilor_oracle_harmony$"
councilor_oracle_harmony_desc:0 "宇宙の無情な法則に対抗するため、知的生命は弱い私欲と個人の差異を消し去り、一つの諧楽に溶け込む必要がある——強をもって弱を支え、死をもって生を護る。"
civic_The_Abundance:0 "実践-『concept_fengrao_effect』"
civic_The_Abundance_desc:0 "諸有情、求めるもの全てを得させよ。薬師は衆生の養育者、楽土の神であり、生命を絶え間なく繁栄させることを目的とする。彼は決して祈りを拒まず、衰退や病苦を直視できない星神である。"
councilor_oracle_abundance:0 "豊穣の神使"
councilor_oracle_abundance_female:0"$councilor_oracle_abundance$"
councilor_oracle_abundance_desc:0 "薬師は衆生の養育者、楽土の神であり、生命を絶え間なく繁栄させることを目的とする。"
civic_The_Hunt:0 "実践-『concept_xunlie_effect』"
civic_The_Hunt_desc:0 "仇忔は涯なく、征逐は疆なく、獵君幾多の愁い？辰矢は弦に在り、金瞳は熾き、帝弓は顧みず。"
councilor_oracle_hunt:0 "巡狩の神使"
councilor_oracle_hunt_female:0"$councilor_oracle_hunt$"
councilor_oracle_hunt_desc:0 "嵐の遊猟は決して代償を顧みず、その救済と破壊はほとんど区別がつかない。"
civic_The_Preservation:0 "実践-『concept_cunhu_effect』"
civic_The_Preservation_desc:0 "天慧星壁、亜空晶壁、巨引源基盤の砌造者。崇拝者から「琥珀王」と呼ばれる。彼はより古い「黄昏戦争」の生存者であり、大敵の呑噬が差し迫っていることを知っている。そのため、光年単位で障壁を築き封印し、まだ生気のある世界を隔離保護しなければならない。"
councilor_oracle_preservation:0 "存護の神使"
councilor_oracle_preservation_female:0"$councilor_oracle_preservation$"
councilor_oracle_preservation_desc:0 "彼は大敵の呑噬が差し迫っていることを知っている。そのため、光年単位で障壁を築き封印し、まだ生気のある世界を隔離保護しなければならない。"
civic_The_Nihility:0 "実践-『concept_xuwu_effect』"
civic_The_Nihility_desc:0 "IXは他の星神と交際せず、多元宇宙の本質は虚無であり、したがって存在には何の価値もないと信じている"
councilor_oracle_nihility:0 "虚無の神使"
councilor_oracle_nihility_female:0 "$councilor_oracle_nihility$"
councilor_oracle_nihility_desc:0 "このポストで死を待っているのか？"
civic_The_Erudition:0 "実践-『concept_zhishi_effect』"
civic_The_Erudition_desc:0 "万物は疑問であり、全てに解答がある。"
civic_The_Propagation:"実践-『concept_fanyu_effect』"
civic_The_Propagation_desc:0 "もし正午の空の端に黒い影が現れたら、扉を固く閉ざせ——それは早まった夜の訪れではなく、飢えた蟲群である。"
 civic_jiyi:0 "実践-『concept_jiyi_effect』"
 civic_jiyi_desc:0 "思考は存在であり、記憶は存在の証である。「記憶」の運命を司る星神は、忘れられたすべてを記録し、宇宙の再生に備える。"
 civic_huanyu:0 "実践-『concept_huanyu_effect』"
 civic_huanyu_desc:0 "「歓楽」の星神。誰も彼が何をきっかけに大笑いするかを予測できない。歓楽は知的生命の特権であり、アハは信者たちに生命の歓楽を享受し、運命の刃のような転機から楽しみを見出すよう鼓舞する。"
 civic_kaituo:0 "アキヴィリの祝福"
 civic_kaituo_desc:0 "「開拓」の運命を司る星神。孤絶世界ペガナから出発し、未知の境界を開拓し続けた。彼の運命は事故によって終焉を迎えた。"
 councilor_oracle_jiyi:0 "記憶の神使"
 councilor_oracle_jiyi_desc: "時間——世界で最も勤勉な泥棒。それは絶えず我々の現在を盗み、『記憶』という倉庫に無造作に投げ込む。ある者は遺失物の受付に没頭し…ある者は喪失に無関心だ。」"
 councilor_oracle_huanyu:0 "歓楽の神使"
 councilor_oracle_huanyu_desc: "「知性は鉄屑、存護は愚か者；巡狩はユーモアがなく、壊滅は狂人だ。星神は皆一本気、アハは面目丸つぶれ！」"
 councilor_oracle_fanyu:0 "繁育の神使"
 councilor_oracle_fanyu_desc: "「もし正午の空の端に黒い影が現れたら、扉を固く閉ざせ——それは早まった夜の訪れではなく、飢えた蟲群である。」"
 councilor_oracle_kaituo:0 "開拓の神使"
 councilor_oracle_kaituo_desc: "「今夜の空を無数の流星が横切る…もし正しいものを選べば、それは君の願いを千百の世界に運ぶだろう。」"

