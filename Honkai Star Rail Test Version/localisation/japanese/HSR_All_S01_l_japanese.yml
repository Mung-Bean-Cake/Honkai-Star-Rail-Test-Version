#起源
 origin_belobog:0 "§R決して退くな！§!"
 origin_belobog_desc:0 "資源の枯渇、星核の落下、寒波の到来…数多くの災難が、かつてヤリロ-VIの輝かしくも短命な文明の歴史をほぼ完全に葬り去るところだった。しかし、ヤリロの民は大守護者の指導の下、星穹列車の無名客たちの無私の助けを借りて、この最も困難な時期を乗り越えた。しかし、裂界による災難はまだ完全には排除されておらず、会社の債務が新たな難関となっている。ヤリロの民はいかなる可能性も諦めず、いつか必ず星海へと帰還するだろう！\n\n§L一部のイベントでの選択は異なる結末へと導く§!"
 origin_tooltip_belobog_effects:0 "§R- 警告：挑戦的な起源§!\n状況『concept_situation_engine_of_creation』、£situation_outcome_icon_positive£§Bヤリロ-VI再起動§!を開始\nヤリロ-VIは『concept_belobog_blocker_1_army』、£mod_menace_perk_undertaker£§R裂界浸食§!に直面する\n§R初期艦船なし、母星系に採掘ステーションなし§!\n修正『concept_a_debt_that_lasts_for_seven_hundred_years』、£mod_country_subject_tribute_mult£$a_debt_that_lasts_for_seven_hundred_years$、『concept_the_power_that_has_not_yet_been_fully_integrated』、£mod_country_edict_length_mult£$the_power_that_has_not_yet_been_fully_integrated$、『concept_surviving_in_a_desperate_situation』、£mod_country_occupation_armies_add£$surviving_in_a_desperate_situation$、『concept_belobog_technology_cooperation』、£mod_cat_technology£$belobog_technology_cooperation$を持つ\n—$INITIAL_POPS$:§R10主体種族人口と5機械人口§!$NEW_LINE$—$HOMEWORLD$$TABBED_NEW_LINE$惑星修正『concept_yaliluo_cold_wave』、『concept_yaliluo_united_as_one』$TABBED_NEW_LINE$—『concept_d_belobog_blocker_liexi』：+5$TABBED_NEW_LINE$—『concept_d_belobog_blocker_small』：+10$TABBED_NEW_LINE$—荒廃度：§R45%§!$TABBED_NEW_LINE$§R研究施設不足§!"
 START_SCREEN_PART_BELOBOG:0 "資源の枯渇、星核の落下、寒波の到来…数多くの災難が、かつてヤリロ-VIの輝かしくも短命な文明の歴史をほぼ完全に葬り去るところだった。しかし、ヤリロの民は大守護者の指導の下、星穹列車の無名客たちの無私の助けを借りて、この最も困難な時期を乗り越えた。しかし、裂界による災難はまだ完全には排除されておらず、会社の債務が新たな難関となっている。ヤリロの民はいかなる可能性も諦めず、いつか必ず星海へと帰還するだろう！しかし、当面は修理用資材の不足が差し迫っており、裂界の浸食も止まっていない。指導者にとって、あらゆる決断が極めて重要である。"
