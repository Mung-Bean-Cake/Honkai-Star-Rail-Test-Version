 #千冶・刃
 NAME_qianyeren:"千冶・刃"
 qianyeren_catch_phrase:"「すべての恩讐は、ここで別れを告げる。」"
 qianyeren_backstory:"身は春の木の如く、心は死灰の如く、指先にはまだ工匠の火花が残る。累世の宿怨が再び燃え上がり、彼は自らと神を共に彼岸へ送ることを誓う——この支離滅裂な身、千冶して刃となす…いかなる答えを鋳造するのか？"
 hsr_paragon.70.name:"千冶・刃"
 hsr_paragon.70.a:"初対面"
 hsr_paragon.70.a.response:"君のことは覚えている、開拓者。歳月は我々を鍛え、より鋭くした。君は依然として君であり、私も依然として私だ。"
 hsr_paragon.70.b:"挨拶"
 hsr_paragon.70.b.response:"来たな…今日はもう食べたか？"
 hsr_paragon.70.c:"見聞"
 hsr_paragon.70.c.response:"たとえ道が全く異なっていても…君と私の間には、縁が尽きていない。"
 leader_qianyeren_t1:"§M骸骨を炉とし、血肉を薪とする\n千冶して一に铸し、万劫を烬滅す§!"
 leader_qianyeren_t1_desc:""
 leader_qianyeren_t1_add:"§B切§!§R換§!技\n§M骸骨を炉とし、血肉を薪とする§!\n§H千冶・刃§!が§E惑星総督§!である時、毎月§G無量忿怒§!を1ポイント獲得する——累計15ポイントに達すると、宇宙戦開始時に§M千冶して一に铸し、万劫を烬滅す§!に切り替わる。\n§M千冶して一に铸し、万劫を烬滅す§!\n直ちにこのスキルに大量の戦闘ボーナスを与える。"
 leader_qianyeren_t2:"§M刃の下、葬る§!"
 leader_qianyeren_t2_desc:""
 leader_qianyeren_t2_add:"§Bバフ技§!\n['leader_trait:leader_qianyeren_t1']が§M千冶して一に铸し、万劫を烬滅す§!に切り替わった時にのみ発動可能\n§H千冶・刃§!にBUFF§Gシールド貫通+50%§!、§G装甲貫通+50%§!を与える。"
