 DOT_SR_Dvalin.012.name:"開拓天君の贈り物：列車「無名」"
 DOT_SR_Dvalin.012.desc:"星穹列車は「開拓」のアキヴィリが自身と無名客を乗せて星間旅行を行うために作った道具である。このような乗り物は一台だけではなかったと言われているが、列車には他の記録はない。姫子が列車を発見した時、その記憶体は損傷しており、貴重な資料の多くが失われていた。分かっているのは、列車が確かにアキヴィリの造物であり、列車が確かにアキヴィリと共に旅をしていたということだけである。"
 DOT_SR_Dvalin.012.a:"了解"
