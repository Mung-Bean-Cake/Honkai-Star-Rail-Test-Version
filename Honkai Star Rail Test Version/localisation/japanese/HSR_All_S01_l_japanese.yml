 concept_yuzhousuipian:"宇宙の欠片"
 concept_yuzhousuipian_desc:"§M指導者の雇用§!、§Lvアップ§!に使用可能。\n§HUIインターフェース、ショップを通じて購入可能。§!\n「定期的に整理してくれれば、管理者が裏口から数値をちょっといじるくらいの便宜は図ってやるよ。」"
 #奇物
 concept_curiosity:"奇物"
 concept_curiosity_desc:"崩壊・星穹鉄道の特殊アイテム。このMODでは主に特殊な標本として扱われる。同等の奇物数を計算する際にはオリジナル版の標本も含まれる。\n黒塔の奇物展示ケース。千奇百怪な小物たち。"
 mod_country_curiosity_add: "同等『concept_curiosity』数"
 simulated_universe:0 "§M模擬宇宙§!"
 dimensionality_reduction_dice:0 "次元削減ダイス"
 dimensionality_reduction_dice_desc_short: "奇妙な三角体"
 dimensionality_reduction_dice_desc_details: "9つの六面ダイスがこの奇妙な三角体を構成している。それは自身に対して継続的な次元削減を行い、立体的な世界に二次元平面として存在することができる。誰がどのような目的で創造したのかは、現時点では明らかになっていない。"
 chaotic_coriolus_versicolor:0 "混沌雲芝"
 chaotic_coriolus_versicolor_desc_short: "混沌医師が最も頻繁に使用する奇物道具。落ち込んだ自滅者が生命の価値への自信を再構築するのを助けるために使われる。"
 chaotic_coriolus_versicolor_desc_details: "雲は水蒸気が集まった産物であり、目的もなく現れ、予兆もなく散る。しかし人々はランダムに生まれる浮雲を見つめるとき、しばしば想像上の物が空に現れるのを目撃する——混沌医師は、絶対的な虚無など存在せず、一見無意味に見えるすべての存在には、それに付随する意味があると信じている。"
 transitional_compound_eye: "遷移複眼"
 transitional_compound_eye_desc_short:"無名客の小道具"
 transitional_compound_eye_desc_details:"無名客には二種類いる。未知の神秘を楽しむ者と、計画的な宇宙開拓を好む者である。後者はアキヴィリの力を利用して「遷移複眼」を製作した。その光はまず前方の星系へとワープし、新世界の情報を持ち帰ることができる。単独で旅する無名客にとって、遷移複眼は欠かせない装備であり、香涎チーズで満たされた世界に真っ向から飛び込むのを防ぐことができる。"
 exotic_fruit:"異木の果実"
 exotic_fruit_desc_short:"奇妙な果実"
 exotic_fruit_desc_details:"この心臓のような形をした果実は、薬師の祝福を受けた某大樹から採れたもので、既に50琥珀紀の歴史があると言われている。食べれば不老不死になれるかどうかは定かではないが、それ自体がすでに不死の孽物であることは明らかだ。"
 uncertainty_box:"測不准匣"
 uncertainty_box_desc_short:"奇妙な箱"
 uncertainty_box_desc_details:"この箱のすべての面は開くことができ、本来重なるべき空間は重ならない。この独特な性質のため、箱を開けた後に何が起こるかを確かめることはできず、そのため中に何かを入れることは推奨されない。"
 fuling_gum:"福霊膠"
 fuling_gum_desc_short:"ある天才の発明"
 fuling_gum_desc_details:"運は能力なのか？おそらく。運は変えられるのか？黒塔は可能だと考えている。この天才は「福霊膠」を発明し、それをまぶたに塗ると丸々24システム時の幸運を得ることができる。黒塔宇宙ステーションの多くの人々がこの発明を熱心に試した。彼らは皆、波瀾のない一日を過ごした。これは、激動の世界において平凡に暮らすこと自体がすでに十分幸運であることを示している。\n§2宇宙戦に勝利するたびに、宇宙の欠片を50追加で獲得§!"
 fragrant_cheese:"香涎チーズ"
 fragrant_cheese_desc_short:"奇妙なチーズ"
 fragrant_cheese_desc_details:"かつて、あるベビーシッターロボットがひらめき、豊穣香涎をチーズにして、小さな主人の果てしない食欲を満たそうとした。ところが香涎チーズは自力で成長し始め、ベビーシッターロボットと主人はフル回転で消化しようとしたが、チーズの成長速度に追いつけなかった。そこで彼らは通りかかった悲悼伶人に助けを求め、ゴンドラに乗って別の星系へ逃げた。今でも銀河のある星系は、隙間なく美味しいチーズでぎっしり詰まっている。この物語には教訓がある：食べ物を無駄にしてはいけない。"
 sponge_king:"スポンジ王"
 sponge_king_desc_short:"自由意志を持ったスポンジ？"
 sponge_king_desc_details:"黒い森の中で、一枚のスポンジが奇跡的に自由意志を獲得した。それは同じく意識を持ったネジと社交を試みたが、ことごとく失敗した。反省したスポンジは、自らのすべての角と穴を消し去り、絶えず輝きを放ち、上流社会に進出することを学んだ——それは最後には円滑なスポンジになった。今、それはゴミ捨て場に捨てられたスポンジたちが自由意志を持つよう支援することに尽力している。"
 sheepskin_scroll:"喋り続ける羊皮紙"
 sheepskin_scroll_desc_short:"危険な奇物"
 sheepskin_scroll_desc_details:"黒塔の奇物リストにおいて、この羊皮紙の危険度は極高と評価されている。黒塔宇宙ステーションに流れ着く以前、それは一人の虚構史学家の所有物であった。羊皮紙は人類の歴史を糧とし、貪欲な舌が文明の集合的無意識を掻き混ぜ、それを粉々にする。黒塔は羊皮紙の飽くなき欲望を満たすために、偽造された世界の記憶を供給している。しかし、いつかこの羊皮紙は天才の策略を見抜くだろう。\n§M宇宙戦に入ると、星系内のすべての敵艦隊に10000のダメージを与える。この効果は60日ごとに発動する§!"
 doctor_robe:"博士のローブ"
 doctor_robe_desc_short:"神秘的なローブ"
 doctor_robe_desc_details:"第IX機関の秘密の闇ネットで、一つの天価商品が無数の入札者の注目を集めた。この長袍はかつて天才クラブ#64「原始博士」の所有物であったとされ、不可思議な力を持っていると言われている。それを闇ネットに出品したのは匿名のユーザーであり、人々は彼が巡海遊侠の一人であると信じ、多くの質問を投げかけたが、残念ながら、長袍が落札されるまで、この神秘的な出品者は一切の返答をしなかった。"
 beautiful_robe:"純美のローブ"
 beautiful_robe_desc_short:"絹と星光で織られた華麗な戦袍"
 beautiful_robe_desc_details:"純美騎士が星海を縦横無尽に駆け巡った時代、全宇宙がその風采に魅了された。この美を追い求める高貴な騎士たちは、輝く金銀の甲冑をまとい、絹と星光で織られた華麗な戦袍を肩に掛け、兜の下には神々しいほどの美貌を誇っていた。「純美」が既に消え去った現代においても、かつてその騎士の風采を目撃した人々は、イードリラがいつか必ず戻ってくると信じている。\n§M各宇宙の欠片が0.16%のダメージボーナスを提供§!"
 club_ticket:"クラブ券"
 club_ticket_desc_short:"天才クラブの小さな発明"
 club_ticket_desc_details:"天才クラブ#56のエリヤサラスはかつて、クラブ内の天才たちが一堂に会し、生活、愛、夢を楽しく交流することを願っていた。そのために彼は「クラブ券」を発明し、自分が死んだ後も新しい会員全員がこの券を受け取り、特定の宴会次元へ即座にテレポートできるシステムを設計した。しかし実際には、#56以降の会員全員が確かに「クラブ券」を使用しているが、時間が一致したことは一度もない。\n§M毎月75の宇宙の欠片を獲得§!"
 faith_bond:"信仰債券"
 faith_bond_desc_short:"会社の認可"
 faith_bond_desc_details:"星間平和会社でP40レベルに昇格した従業員は、「信仰債券」を購入する権利を得る。それはルイス・フレミングの認可を意味し、「琥珀王」の運命づけられた存護の偉業において君の一席が約束されているという神聖な約束が付随している。君の能力は微々たるもの、君の財産は取るに足らない、君の信仰は浩瀚な星海の中の一粒の塵に過ぎない。しかし、世代を超えた「君」たちが集まることで、いつか宇宙全体を守る力を持つに至る。\n§M模擬宇宙の欠片を消費した後、一定の割合で返還される§!"
 split_gold_coins:"分裂金貨"
 split_gold_coins_desc_short:"血と涙で染まっている..."
 split_gold_coins_desc_details:"すべての惑星が星間平和会社の商業帝国に両手を広げて歓迎するわけではない。拡大し続ける銀河の版図の中には、会社の好意を拒む極めて例外的なケースが常に存在する。「ありがとう」と彼らは言う、「しかし信用ポイントは必要ない。我々は自分たちで十分にやっていける。」このような状況に直面した時、会社の代表は肩をすくめ、そしてその惑星の金融システムの基盤——通常は金——を軽く破壊する。"
 empty_candle_scissors:"虚無燭剪"
 empty_candle_scissors_desc_short:"魔法のハサミ"
 empty_candle_scissors_desc_details:"この燭剪がロウソクに使われることはほとんどない。それよりも残酷で、暗く、苦しい場所に使われることが多い。ハサミが切断するのは物質ではなく、生物の心の中の熱量——情熱と呼ばれる原動力だ。もし虚無燭剪が君の心臓をなぞれば、君が感じるのは痛みではなく、無関心だ。\n§M有効にすると奇物数+5§!"
 annihilate_candle_scissors:"消滅燭剪"
 annihilate_candle_scissors_desc_short:"また別の魔法のハサミ..."
 annihilate_candle_scissors_desc_details:"もしこの燭剪でロウソクの芯を切れば、怒れる反物質の炎が逆にロウソクに点火し、粒子衝突の下でロウソク全体が数秒間燃焼した後、即座に消滅する。もしこのハサミで君の皮膚をなぞれば、エネルギー逸散反応が即座に発生し、触れた部分は負の粒子へと変化して体内で振動し、その後四方に散逸する。\n§M各奇物数がダメージを5%、体力を8%向上させる§!"
 heavy_sound_album:"天外重音大碟"
 heavy_sound_album_desc_short:"奇妙なディスク"
 heavy_sound_album_desc_details:"「秩序」の太一がヒペに吸収された時、天外合唱班は信仰を失い、かつて荘厳で整然としていたハーモニーは沈黙し、群星は言葉を失った。今ではごく少数の愛好家によって録音されたレコードだけが残されている。それを専用の蓄音機にかければ、宇宙の彼方からの歌声が聞こえてくる。秩序の美しさに満ちた歌声だ。最後の秩序蓄音機は帝皇戦争で破壊され、レコードの上には厚い埃が積もっている。それは沈黙の時に対する抗議のようだ。\n§M宇宙戦に入ると、我が艦隊は10日間100%のダメージ軽減を得る§!"
 broken_star_fragrant_bait:"砕星芳餌"
 broken_star_fragrant_bait_desc_short:"混沌星雲..."
 broken_star_fragrant_bait_desc_details:"黄昏戦争以前、混沌星雲の膨張によって生じた爆発破片は餌として使用でき、その特有の宇宙塵の芳香が古獣を誘き寄せることができた。しかしこの世界を覆う大災厄の後、「砕星芳餌」はその本来の効果を失ったようだ。学者がどれほど餌を研究・改良しても、誰も古獣の姿を再び見つけることはできなかった。"
 cunhu_sealing_wax:"存護封蝋"
 cunhu_sealing_wax_desc_short:"星神封蝋"
 cunhu_sealing_wax_desc_details:"落ち込んだ自滅者の間では、宇宙の万物には意味がなく、人間は星神の目には取るに足らない存在であるという説が流れている。もし星神が本当に衆生を超越し、高みに君臨するのであれば、なぜ凡人の愛憎苦楽を気にするのか？無相の眠り手IXの存在がその証拠だ。自滅者たちに星神が気にかけていることを証明するために、混沌医師は秘学僧侶の巫神術と組み合わせて星神封蝋を製作した。この封蝋を押せば、対応する星神の時空を超えたまなざしを遠くから引き寄せることができると言われている——今のところ成功例はないが、いくつかの自滅者は封蝋を押した後、宇宙や星神、その他すべてに対する自信を取り戻したという。"
 fengrao_sealing_wax:"豊穣封蝋"
 fengrao_sealing_wax_desc_short:"星神封蝋"
 fengrao_sealing_wax_desc_details:"落ち込んだ自滅者の間では、宇宙の万物には意味がなく、人間は星神の目には取るに足らない存在であるという説が流れている。もし星神が本当に衆生を超越し、高みに君臨するのであれば、なぜ凡人の愛憎苦楽を気にするのか？無相の眠り手IXの存在がその証拠だ。自滅者たちに星神が気にかけていることを証明するために、混沌医師は秘学僧侶の巫神術と組み合わせて星神封蝋を製作した。この封蝋を押せば、対応する星神の時空を超えたまなざしを遠くから引き寄せることができると言われている——今のところ成功例はないが、いくつかの自滅者は封蝋を押した後、宇宙や星神、その他すべてに対する自信を取り戻したという。"
