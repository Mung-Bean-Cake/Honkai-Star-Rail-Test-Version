 #その他
 Gov_IPC0:0"銀河存護グループ"
 Gov_IPC0_desc:0"この巨大企業は銀河系全体の存護を目標とし、そのために絶え間なく奮闘している。"
 IPC_Normal_Leader:0"終身取締役"
 IPC_Normal_Leader_Female:0"終身取締役"
 Gov_IPC_Idol:1"アイドル育成会社"
 Gov_IPC_Idol_desc:1"この巨大企業はアイドルの育成とアイドル文化の発展を通じて資金を調達し、その資金を銀河系全体の存護事業に投入している。アイドルという職業は彼らの生活のあらゆる場面に現れ、アイドルが指導者を務めることさえある。"
 IPC_Idol_Leader:0"プロデューサー"
 IPC_Idol_Leader_Female:0"至高のアイドル"
 #IPC_Normal_Leader:0"プロデューサー"
 #IPC_Normal_Leader_Female:0"至高のアイドル"
 Gov_IPC_Idol_Dark:0"アイドルの深淵"
 Gov_IPC_Idol_Dark_desc:0"この巨大企業は、闇に足を踏み入れたアイドルたちによって乗っ取られた。彼女たちはこの巨大な商業帝国を影から操り、この文明が常に変わることなく実践してきた【存護】の道を、手段を選ばずに継続することを決意した。おそらくそれは、企業全体が至高のアイドル——星神クリフォーを深く愛しているからだろう。"
 IPC_Idol_Leader_Dark:0"ダークアイドル"
 IPC_Idol_Leader_Female_Dark:0"深淵の花"
 Gov_IPC_Idol_Light:0"夢想存護組織"
 Gov_IPC_Idol_Light_desc:0"この巨大企業はアイドル育成の道をひた走り、ついに今日の状態に到達した。上から下まで、内から外まで、アイドルとアイドル文化が会社を満たし、指導者たちもあらゆる意味でアイドルとなっている。\nこのような会社は、依然として【存護】の道を実践することを決意している——すべてのファンの夢を存護することから始めて。おそらくいつか、星間平和会社という巨大な集団自体が【アイドル】となり、超空間航路が届くすべての場所に無数のファンがいるようになるだろう。"
 IPC_Idol_Leader_Light:0"銀河の灯台"
 IPC_Idol_Leader_Female_Light:0"星海の光"
 Gov_IPC_ST_Mild:0"安楽存護組織"
 Gov_IPC_ST_Mild_desc:0"この巨大企業は、すべての文明に究極の安定維持サービスを提供し、すべての顧客の幸福感を高めることに尽力している。彼らの見解では、このような行動は、慈愛に満ちた母親が優しくゆりかごを揺らし、ゆりかごの中の子供に快適な成長環境を与えるようなものだ。これが彼らが【存護】の道を実践する方法である。"
 IPC_ST_Leader:0"長子"
 IPC_ST_Leader_Female:0"慈母"
 Gov_IPC_ST_Quick:0"銀河安定の守護者"
 Gov_IPC_ST_Quick_desc:0"この巨大企業は銀河系に迫る巨大な脅威を鋭く察知し、すべての友好文明の安定を維持して急速に発展させ、銀河系全体の実力を高めることで、恐ろしい危機から銀河を【存護】することを決意している。多数を【存護】するためには、犠牲にならないものはない。"
 #異常現象
 planet_broken_category:0"射抜かれた星"
 planet_broken_category_desc:0"地表が溶岩で覆われたこの惑星に生物の痕跡を発見した。かつては生命が存在した惑星だったのかもしれない。"
 rukaanomoly.001.name:0"射抜かれた星"
 rukaanomoly.001.desc:0"長期にわたる調査と研究の結果、我々は驚くべき結論に達した：ここは確かにかつて居住可能な惑星だったが、何らかの極めて強力な破壊力によって惑星の構造全体が破壊され、生態圏も滅びた。今日に至るまでその表面には広大な溶岩海が広がっており、我々の研究によると、この破壊力は非常に巨大で、巨大な運動エネルギーを伴った……矢のように見える？\n過去がどうであれ、現在では様々な鉱物が溶岩の形で内部から噴出しており、採掘作業は容易になっている。一方、科学者たちはこの惑星の変化過程に研究上の興味を持っている。"
 IPC.001.a:0"研究ステーションの建設を承認する。"
 IPC.001.b:0"素晴らしい鉱山だ。"
 IPC.001.c:0"これは帝弓司命が豊穣の孽物を狩った神跡に違いない！"
 IPC.001.e:0"かつてそこに住んでいた生物に悲劇的な物語をでっち上げれば、大勢の人を騙して大金を払わせて観光させることができる……"
