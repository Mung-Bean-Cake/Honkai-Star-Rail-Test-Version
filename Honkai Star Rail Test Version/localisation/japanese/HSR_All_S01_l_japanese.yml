 DOT_SR.1.name:0 ""
 DOT_SR.1.desc:0 "現在は崩壊:星穹鉄道MOD§M紹介設定§!パネルです\n§R本MODはSteamワークショップでのみ無料提供されています！！！§!\n§G星穹鉄道MOD交流グループ：912693940；制作グループ：692875844（継続的にメンバー募集中、歓迎します）。§!\n現在のバージョン：v4.2\n更新日：2026/7/1\n§H更新ログ§!：\n1.新バージョンへの初期適応を完了\n2.仙舟、スクリューガム星、黒塔宇宙ステーションを調整\n3.星核生成を一時的に削除"
 DOT_SR_money_show:0 "宇宙の欠片：[from.yuzhousuipian]"
 DOT_SR.2.desc:0 "天才クラブの黒塔は、通常の世界の万物の法則に満足せず、銀河の未解決の存在に目を向け、それらの遠い神秘が自分の好奇心を満たしてくれることを期待した。そのため、黒塔は博物館式の星間艦船を主導して建造し、それを惑星軌道に投入し、「すべての異変を星空に封印する」研究を開始した。有名な黒塔宇宙ステーションがこうして誕生した。今日に至るまで、宇宙ステーションは数え切れないほどの奇物「収蔵品」を擁し、まさに星空の博物館である。多くの随艦研究者もここに定住し、銀河の各地から遺物や奇物を収集し、その形状や機能を記録し、体系的な観測と研究方法を確立している…そして最終的に、謎からさらに理解し難い謎を見つけ出す。これこそが黒塔の当初の目的でもある。多数の「収蔵品」はしばしば羨望の目を集め、様々な勢力が暗躍している。黒塔の実力により、宇宙ステーションが本当の危機に陥ることはほとんどなく、収蔵と研究は秩序正しく進められている。"
 #UI
