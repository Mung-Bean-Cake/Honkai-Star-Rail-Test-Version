 pc_astral_express:"星穹列車"
 pc_astral_express_desc:"星穹列車は短い停車の後、再び星海を渡る。聞け、列車の汽笛が前進の序曲を奏でている。新たな世界、新たな命、新たな物語が、開拓者の足跡を待っている。新たな「開拓」の旅に出る準備はいいか？ワープはまもなく開始される。開拓者よ、準備を整えよ、3、2、1……次の停車駅：銀河！"
 origin_Astral_Express:"星穹列車"
 origin_Astral_Express_desc:"嗚呼、嗚呼、きちんと座れ、立つなよ、ワープジャンプは慎重に；嗚呼、嗚呼、シートベルト、常に装着、食堂車はカード遊びの場にあらず！"
 origin_tooltip_Astral_Express_effects:"開拓の星神アキヴィリが陥落した後、その開拓の意志は追従者「無名客」たちに継承された。その中には彼がかつて搭乗した星穹列車も含まれていた。しかし「万界の癌」は蔓延し、列車の枕木である銀軌も免れなかった。疫病が到来する前から、列車はすでに苦境に立たされていた。道は塞がれ、やむを得ず静かに座礁した。そうして長い年月が流れた。ある日、一人の赤髪の少女が荒廃した列車と出会った。彼女はエンジンと銀軌の間に残された無言の物語に惹かれ、時間をかけて亀裂を埋め、摩耗を修復し、列車を一新した。そして、好奇心旺盛な少女は列車の車両に足を踏み入れ、宇宙を測る開拓の旅を始めた。星穹列車は駅ごとに停車し、乗客は行き来する。旅に加わる者もいれば、去っていく者もいる。旅人たちは異なる世界から来て、異なる過去を背負い、異なる終着点へと向かう。しかし、列車の中にいる限り、彼らは同じ旅を共有している。だからこそ、旅人たちがそれぞれの思惑や、場合によっては悪意を抱いていても、列車と姫子はそれを気にしない——誰かがこの素晴らしい旅を共にしようとするなら、列車の扉は惜しみなく開かれるのだ。"
 Star_Rail_start_screen_messages:"星穹列車は短い停車の後、再び星海を渡る。聞け、列車の汽笛が前進の序曲を奏でている。新たな世界、新たな命、新たな物語が、開拓者の足跡を待っている。新たな「開拓」の旅に出る準備はいいか？ワープはまもなく開始される。開拓者よ、準備を整えよ、3、2、1……次の停車駅：銀河！"
 Astral_Express_start_screen_messages:"嗚呼、嗚呼、きちんと座れ、立つなよ、ワープジャンプは慎重に；嗚呼、嗚呼、シートベルト、常に装着、食堂車はカード遊びの場にあらず！開拓の星神アキヴィリが陥落した後、その開拓の意志は追従者「無名客」たちに継承された。その中には彼がかつて搭乗した星穹列車も含まれていた。しかし「万界の癌」は蔓延し、列車の枕木である銀軌も免れなかった。疫病が到来する前から、列車はすでに苦境に立たされていた。道は塞がれ、やむを得ず静かに座礁した。そうして長い年月が流れた。ある日、一人の赤髪の少女が荒廃した列車と出会った。彼女はエンジンと銀軌の間に残された無言の物語に惹かれ、時間をかけて亀裂を埋め、摩耗を修復し、列車を一新した。そして、好奇心旺盛な少女は列車の車両に足を踏み入れ、宇宙を測る開拓の旅を始めた。星穹列車は駅ごとに停車し、乗客は行き来する。旅に加わる者もいれば、去っていく者もいる。旅人たちは異なる世界から来て、異なる過去を背負い、異なる終着点へと向かう。しかし、列車の中にいる限り、彼らは同じ旅を共有している。だからこそ、旅人たちがそれぞれの思惑や、場合によっては悪意を抱いていても、列車と姫子はそれを気にしない——誰かがこの素晴らしい旅を共にしようとするなら、列車の扉は惜しみなく開かれるのだ。"

