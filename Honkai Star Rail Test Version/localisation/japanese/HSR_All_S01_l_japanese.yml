 DOT_SR_Dvalin.010.name:"帝弓司命の贈り物：仙舟「蒼城」"
 DOT_SR_Dvalin.010.desc:"仙舟「蒼城」は仙舟連盟創設時の九隻の旗艦の一つであり、九舟の中で最も繁栄した勝境と称された。蒼城は文風が盛んで、有名な学宮が設けられ、厚みのある人文伝統を育んだ。特産の蒼城梅は艦上の象徴的な植物であり、『蒼城方集』に収録された石犢升麻湯などの方剤は、今なお仙舟連盟内で伝承・使用されている。星歴6300年、活化惑星「噬界羅睺」が豊穣の令使・倏忽を伴い蒼城に降臨した。騰骁将軍率いる艦隊を超えた援軍が駆け付けたものの、蒼城は陥落を免れず、仙舟全体が羅睺に飲み込まれて分解された。豊穣の長生の祝福を受けた民は死ぬことができず、意識と血肉が生きた惑星と一体化し、永遠の苦痛の檻に閉じ込められた。今、私は修復した仙舟「蒼城」を汝に贈る。この艦に乗り、長風を駆り、万里の星河を破らんことを！"
 DOT_SR_Dvalin.010.a:"了解"
 DOT_SR_Dvalin.010.b: "ありがとう"
 NAME_XIANZHOU_AE:"仙舟「蒼城」"
 XIANZHOU_AE_Ship:"仙舟「蒼城」"
 XIANZHOU_AE_Ship_plural:"仙舟「蒼城」"
 XIANZHOU_AE_Ship_cap:"仙舟「蒼城」"
 XIANZHOU_AE_Ship_desc:"仙舟「蒼城」は仙舟連盟創設時の九隻の旗艦の一つであり、九舟の中で最も繁栄した勝境と称された。蒼城は文風が盛んで、有名な学宮が設けられ、厚みのある人文伝統を育んだ。特産の蒼城梅は艦上の象徴的な植物であり、『蒼城方集』に収録された石犢升麻湯などの方剤は、今なお仙舟連盟内で伝承・使用されている。星歴6300年、活化惑星「噬界羅睺」が豊穣の令使・倏忽を伴い蒼城に降臨した。騰骁将軍率いる艦隊を超えた援軍が駆け付けたものの、蒼城は陥落を免れず、仙舟全体が羅睺に飲み込まれて分解された。豊穣の長生の祝福を受けた民は死ぬことができず、意識と血肉が生きた惑星と一体化し、永遠の苦痛の檻に閉じ込められた。"

 DOT_SR_Dvalin.011.name:"開拓天君の贈り物：ヒペリオン号"
 DOT_SR_Dvalin.011.desc:"ヒペリオン号は天命組織が開発した浮空戦列艦であり、無量塔姫子が率いるヴァルキリー第五小隊専用旗艦である。聖フレイヤ学園に配属され、物語の主軸となる核心的な作戦艦艇でもある。全長278.5メートル、甲板長182メートル、標準乗員50〜200名。6基の核融合炉を動力源とし、レオノフ反重力エンジンを搭載、垂直離着陸と長時間の低空浮遊が可能。この艦は元々航空母艦として設計されたが、姫子が引き継いだ後に艦載機施設を撤去し、直射火力を全面的に強化する改装が施された。左右の舷側に各3門の430mmレールガンと3門の270mmレールガン、さらに10基の近接防御システムを備え、百メートル級の大型崩壊獣に対抗する前線攻撃プラットフォームとして設計された。今、私はこのヒペリオン号を汝に贈る。この艦に乗り、長風を駆り、万里の星河を破らんことを！"
 DOT_SR_Dvalin.011.a:"了解"
 DOT_SR_Dvalin.011.b: "ありがとう"
