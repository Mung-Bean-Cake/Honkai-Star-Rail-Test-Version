 #仮想伝統ツリー
 tradition_path: "運命派閥"
 tradition_path_desc: "§Rこの伝統は表示専用です。実際のゲームプレイは設定パネルで運命を選択してください。§!\n凡人種が神の意図を推測することは無駄な試みであり、まるで蜉蝣と星が無関係であるかのようだ。しかし、共通の誤解を持つ人々が集まることで、付加価値が生まれる：認識は合意となり、誤解は通解となり、集団は集団を引き寄せる……そして、派閥は自然に生まれるのだ。"
 #UI
 concept_path_effect:"§H運命§!"
 concept_path_effect_desc:"§R注意：運命システムを有効にすると伝統ツリーを1つ占有します。再び有効にしても伝統インターフェースに新しい伝統ツリーは表示されませんが、新しい伝統は正常に有効になります！§!\n以下を含む：['concept_cunhu_effect']、['concept_fanyu_effect']、['concept_fengrao_effect']、['concept_huanyu_effect']、['concept_huimie_effect']、['concept_jiyi_effect']、['concept_tongxie_effect']、['concept_xunlie_effect']、['concept_xuwu_effect']、['concept_zhishi_effect']\n特定の条件を満たすと運命を受け入れ、運命を『concept_primary_effect』または『concept_secondary_effect』に設定することができる。\n特定の運命を『concept_primary_effect』または『concept_secondary_effect』に設定すると、特定の『concept_hsr_path_civic_effect』を選択することができる。\n運命の実体はまだ研究中である。現段階では、「哲学的観念」という平易な形で説明するしかない。運命のエネルギーは虚数の一部であり、形而上学的な精神の集合体である。"
