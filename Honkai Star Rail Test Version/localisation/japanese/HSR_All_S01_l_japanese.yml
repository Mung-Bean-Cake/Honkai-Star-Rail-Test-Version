 #ヴェルト
 NAME_waerte:"ヴェルト"
 waerte_catch_phrase:"——故郷へ帰り、平和な生活に戻る方法が当面見つからないなら、再び戦いを始めよう。今回は、運命を背負う必要はない。すべては自らの意志に従って。"
 waerte_backstory:"老成した元逆エントロピー盟主。「世界」の名を受け継ぎ、かつて何度も世界を滅亡の淵から救った。聖方丹事件の後、ヴェルトは事件の黒幕と共に星門の向こう側へと向かわざるを得なかった。彼自身も、そこで待ち受けていたのが全く新しい旅と仲間たちであるとは予想していなかったかもしれない。"
 hsr_paragon.61.name:"星穹列車-ヴェルト"
 hsr_paragon.61.a:"初対面"
 hsr_paragon.61.a.response:"こんにちは、私はヴェルト・ヤンだ。何か困ったことがあれば、いつでも私を頼ってくれ。"
 hsr_paragon.61.b:"趣味"
 hsr_paragon.61.b.response:"歴史の研究とアニメーション制作…この二つは矛盾しない。"
 hsr_paragon.61.c:"見聞"
 hsr_paragon.61.c.response:"存護」のクリフォーの信者がどのようにして「星間平和会社」になったのか知っているか？神は壁を築こうとし、人間は神の足跡に従ってその建材を探し始める——この話にはブラックユーモアが満ちている。"
 leader_waerte_t1:"§M重力制圧§!"
 leader_waerte_t1_desc:"浩瀚な星海にも、我々の痕跡は残される。"
 leader_waerte_t2:"§M虚空断界§!"
 leader_waerte_t2_desc:"決断を下す時だ。"
 leader_waerte_t3:"§M平和の祈願§!"
 leader_waerte_t3_desc:"この銀河は、あらゆる可能性を容れる。"
 leader_waerte_t4:"§M時空歪曲§!"
 leader_waerte_t4_desc:"この力の重みを、君は何も知らない。"
 leader_waerte_t5:"§M擬似ブラックホール§!"
 leader_waerte_t5_desc:"星辰が粉砕される様を見よ…生きるか死ぬか、君に選択の余地はない。"
