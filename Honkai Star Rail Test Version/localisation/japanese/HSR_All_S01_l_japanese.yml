 #運命国民理念
 tr_cunhu_fengrao_1:"§B惑星浄化師§!"
 tr_cunhu_fengrao_1_flavor:"第10238日、クヴェイダ星雲の汚染は依然として消えていない。あなたはガラスの山の上に座っている。漏れ出たエネルギーが溶ける前、ここは砂漠の一角だった。改造された身体が軋む。あなたはゆっくりと測定値を調整する。それは空気中の残留放射能を吸収し、発熱する色とりどりの結晶に変える。\n第27349日、クヴェイダの第三惑星、汚染は依然として消えていない。あなたは花を植えるが、まだ芽は出ない。彼らはあなたを嘲笑う。あなたの努力は焼け石に水であり、母星は死の墓地となり、二度と新しい命は育たないと。あなたは土を耕し、腐敗を促進する薬剤を散布する。あなたは黙って土地の隅々を歩き、生命が再び戻ってくるまで。"
