 #特性
 trait_IPC_Better_Trader:0"交易の伝統"
 trait_IPC_Better_Trader_desc:0"この種族は文明以前から繁栄した交易を発展させており、交易は文化に深く根付いた伝統となっている。"
 trait_IPC_Work_Much_Harder:0"残業好き"
 trait_IPC_Work_Much_Harder_desc:0"この種族は残業を当然のことと考えており、中毒になる者さえいる。しかし、過度の残業は出生率を低下させる。"
 trait_IPC_No_Baby:0"自己責任"
 trait_IPC_No_Baby_desc:0"この種族は文明を築く以前から、子供を産んだ後に放置する習慣があり、これにより幼児死亡率は上昇したが、成人後の生活費は確実に削減された。"
 trait_IPC_Best_Trader:0"マーケティングの天才"
 trait_IPC_Best_Trader_desc:0"もう少し遺伝子ポイントを投資するだけで、2ポイントの交易価値ボーナス特性の2倍の強さの特性が手に入ります！"
 trait_IPC_Live_Much_Harder:0"究極の競争者"
 trait_IPC_Live_Much_Harder_desc:0"この種族は過酷な環境や単調な生活に適応し、資源を節約し、懸命に働き、学ぶことで自らの地位を向上させようとする。"
 trait_IPC_Better_Miner:0"建造の達人"
 trait_IPC_Better_Miner_desc:0"この種族はかつて存護の星神の偉業を垣間見、その教えを遺伝子に刻み込んだ。"
 TRAIT_Expensiver_Slave:0"この種族の奴隷市場での価格が2500エネルギー貨上昇"
 trait_IPC_Expensive_Goods:0"人気商品"
 trait_IPC_Expensive_Goods_desc:0"見た目が良いからか、非常に便利だからか、いずれにせよこの種族は奴隷市場で常に引く手あまたである。"
 trait_IPC_NeverGonna_GiveUp:0"自衛の伝統"
 trait_IPC_NeverGonna_GiveUp_desc:0"この種族は自発的に自衛部隊を組織する本能を持っており、この本能は進化の過程で何度も彼らの集団を救ってきた。"
 trait_IPC_NeverGonna_RunAround:0"不屈の精神"
 trait_IPC_NeverGonna_RunAround_desc:0"この種族は抑圧や侵略に抵抗する際に驚くべき力と勇気を発揮する。"
 trait_IPC_Better_Alloys:0"建造の野望"
 trait_IPC_Better_Alloys_desc:0"この種族はかつて存護の星神に近距離で影響を受け、今では種族全体が壮大な建造物を築くことに熱心である。"
 trait_IPC_Life_Saver:0"救死扶傷"
 trait_IPC_Life_Saver_desc:0"この種族は医療サービスを補助する構造を持ち、その神経系は繊細な医療操作を行う能力も与えている。"
 trait_IPC_Better_Writer:0"妙筆生花"
 trait_IPC_Better_Writer_desc:0"この種族の文化従事者はしばしば驚くべき優れた作品を創作する。その文芸作品は文明の発展過程で何度も社会の変化を推進してきた。"
 trait_IPC_Better_Idol:0"演技の遺伝子"
 trait_IPC_Better_Idol_desc:0"この種族の公演——歌唱、ダンス、フェロモンの放出など——は魅了する力を持ち、その効果はしばしば他の種族の同業者を何光年も引き離す。"
 IPC_Good_For_Idol:0"アイドルも芸能人の一種である"
 mod_planet_jobs_entertainer_produces_mult:0"芸能人の生産"
 mod_planet_jobs_culture_worker_produces_mult:0"文化従事者の生産"
 mod_planet_jobs_culture_worker_society_research_produces_mult:0"文化従事者の£society£生産"
 mod_planet_jobs_healthcare_produces_mult:0"医療従事者の生産"

 #伝統
 tradition_IPC:0"会社"
 tradition_IPC_desc:0"星間平和会社があなたのためにサービスを提供します！"
 tr_IPC_adopt:0""
 tr_IPC_adopt_desc:0""
 tr_IPC_finish:0""
 tr_IPC_finish_desc:0""
 allow_IPC_Bduilings:0"ここにいくつか新しい建築を追加する予定ですが、まだ完成していません"
 tr_ipc_infi_expressnetwork:0"星間宅配便ネットワーク"
 tr_ipc_infi_expressnetwork_desc:0""
 tr_ipc_infi_expressnetwork_delayed:0"長年にわたる貿易の中で、壮大な星間宅配便ネットワークが徐々に形成され、顧客は注文した商品をより早く受け取ることができ、我々もより多くのエネルギー貨を稼ぐことができる。"
 tr_ipc_infi_investdevelopmentofstar:0"惑星開発への投資"
 tr_ipc_infi_investdevelopmentofstar_desc:0""
 tr_ipc_infi_investdevelopmentofstar_delayed:0"一部の文明は利益のために他者の惑星を損なうことがあり、一部の帝国は短期的な利益のために自らの惑星を損なうことさえある。我々は、自分たちと友人の双方が豊かになることでのみ、稼ぐお金があることを認識している。"
 tr_ipc_infi_eliteloan:0"星間融資産業"
 tr_ipc_infi_eliteloan_desc:0""
 tr_ipc_infi_eliteloan_delayed:0"もしすべての人が収入の範囲内で生活したら、我々の商品は誰が買うのか？より多くの商品を販売するために、我々は成熟した消費者ローン制度を開発した。その目的は直接利益を得ることではなく、消費者の購買力を搾り取ることで間接的にお金を稼ぐことである。"
 tr_ipc_infi_spreadcreditpoints:0"信用ポイントの普及"
 tr_ipc_infi_spreadcreditpoints_desc:0""
 tr_ipc_infi_spreadcreditpoints_delayed:0"銀河共通の通貨が存在すれば、貿易は確実に繁栄するだろう。我々は単独でそれを作り出すことはできないが、試みることはできる。"
 tr_ipc_infi_moreinvolution:0"内なる競争の奨励"
 tr_ipc_infi_moreinvolution_desc:0""
 tr_ipc_infi_moreinvolution_delayed:0"力でお金を稼ぐことで心の安らぎを得ることは、無数の異星人の生活信条となっている。もちろん、力を入れるのは彼らの仕事であり、我々の会社のメンバーは異星人の労働の成果を感謝して享受すればよい。"
 tradition_Interastral:0"星間"
 tradition_Interastral_desc:0"輝く星々への道は広く開かれている。果てしない宇宙へ行き、存護の道を実践しよう！"
 tr_interastral_expand_faster:0"領土拡張熱"
 tr_interastral_expand_faster_desc:0""
 tr_interastral_expand_faster_delayed:0"銀河探査が進むにつれて、我々は恒星系に前哨基地を建設して「主権を宣言」することに熱心になっている。この行動は、新しいおもちゃに名前を書く子供のようであり、無邪気で愛らしい。"
 tr_interastral_sell_stars:0"星間投資"
 tr_interastral_sell_stars_desc:0""
 tr_interastral_sell_stars_delayed:0"異星の採掘所と研究ステーションの株価は急上昇しており、一方で母星の鉱業の株価は暴落している。誰もが母星の鉱業は衰退し、外宇宙の鉱業は大きな繁栄を迎えると信じている。この異星採掘への投資熱は、間違いなく我々の星間探査を促進するだろう。"
 tr_interastral_invest_base:0"基地産業の繁栄"
 tr_interastral_invest_base_desc:0""
 tr_interastral_invest_base_delayed:0"創造的な恒星基地スタッフは、プロジェクトの資金調達のために一連の革新的な産業を開発した。例えば、金持ちを騙して宇宙ステーションへの高価で無意味な旅行をさせたり、中産階級を騙して「外宇宙の無農薬果物」栽培を試させたりするなど、我々の事業に大きく貢献している。"
 tr_interastral_fly_us_to_the_star:0"星へ飛び立つ"
 tr_interastral_fly_us_to_the_star_desc:0""
 tr_interastral_fly_us_to_the_star_delayed:0"超空間エンジンの開発以来、星間探検をテーマにした数多くの文芸作品が登場し、若者は皆、科学船の乗組員を理想の仕事と見なすようになった！"
 tr_interastral_better_colonist:0"新世界熱"
 tr_interastral_better_colonist_desc:0""
 tr_interastral_better_colonist_delayed:0"新しい世界に向かう船に乗る人が増え、遠くの異星を自分自身の理想を実現する場と見なすようになっている。"
 tradition_peace:0"平和"
 tradition_peace_desc:0"救済の道はその中にある。"
 tr_peace_we_are_the_world:0"星間外交"
 tr_peace_we_are_the_world_desc:0""
 tr_peace_we_are_the_world_delayed:0"惑星文明だった時代に確立された外交機関と規範は、星間時代のニーズに適応できなくなっている。異星生命との長期的な交流を通じて、我々は星間時代にふさわしい外交理論を確立した。"
 tr_peace_we_are_the_one:0"互恵協力"
 tr_peace_we_are_the_one_desc:0""
 tr_peace_we_are_the_one_delayed:0"星間平和会社の原則は「搾取」でも「無私」でもなく、「互恵」である。我々は他の帝国と友好関係を築き、取引を通じて共通の繁栄を促進するよう努める。"
 tr_peace_fate_together:0"ロビー活動組織"
 tr_peace_fate_together_desc:0""
 tr_peace_fate_together_delayed:0"時には、小さな贈り物が双方に利益をもたらすことがある。友好国の国内ロビー活動組織への資金提供は、我々の外交手段の一部となっており、取引を容易にすると同時に、彼らに収入と雇用を提供する——これはまさに互恵の典型的な事例ではないだろうか。"
 tr_peace_influence_galaxy:0"富の投射"
 tr_peace_influence_galaxy_desc:0""
 tr_peace_influence_galaxy_delayed:0"軍事力の投射に加えて、星間時代に特に重要な別の投射形態を発見した：富の投射である。我々は、蓄積された富を使ってどこでも問題を解決し、その後……さらに多くの富を蓄積するために、富を銀河系の隅々まで届けることができる機関を広く設立しなければならない。"
 tr_peace_peace_ours:0"我々の会社の平和"
 tr_peace_peace_ours_desc:0""
 tr_peace_peace_ours_delayed:0"星間平和会社は、一方的な譲歩と宥和が平和をもたらさないことを熟知している。戦争を好む野蛮人には、断固たる打撃を与えなければならない。"

 #アジェンダ
 council_agenda_agenda_IPC_More_Export_name:0"星間市場の開拓"
 council_agenda_agenda_IPC_More_Export_desc:0"星間平和会社の中核は内部ではなく、外部にある。"
 council_agenda_agenda_IPC_More_Trade_name:0"国内経済の刺激"
 council_agenda_agenda_IPC_More_Trade_desc:0"対外的な商業的成功を通じて、我々は国内経済をさらに発展させることができる。"
 council_agenda_agenda_IPC_More_Branches_name:0"支店建設への注力"
 council_agenda_agenda_IPC_More_Branches_desc:0"次の目標は、支店の商業価値の開発に注力し、会社により多くの利益をもたらすことである。"
 council_agenda_IPC_Expand_Faster_name:0"銀河の領土拡張運動"
 council_agenda_IPC_Expand_Faster_desc:0"今や、目の前には未開の巨大な富が広がっている——その富とは星々そのものである。そこにある資源を開発するにせよ、星系の所有権を転売するにせよ、それは安定した、利益率の高い取引である。"
 council_agenda_IPC_Faster_than_Light_name:0"世界の翼を導く"
 council_agenda_IPC_Faster_than_Light_desc:0"我々は世界の翼となる……"
 council_agenda_IPC_Accelerate_Colonization_name:0"揺りかごを出る時"
 council_agenda_IPC_Accelerate_Colonization_desc:0"宣伝とインセンティブ政策、そして大量生産されたエンターテイメント製品を通じて、国民を異星植民地への移住に促すことができる。"
