 #おすすめ
 XQTD_recommend1_text: "制作チームまたはメンバー関連MODのおすすめ"
 XQTD_recommend2_text: "以下のMODは強制ではありません。現在のMODの動作に影響しません。"
 XQTD_recommend_MOD1.1_custom_tooltip: "本作は崩壊：星穹鉄道MODの音楽・画像・アドバイザーパックMOD、すなわち「崩壊：星穹鉄道」MODのサブMODです！本MODには音楽200曲以上、高品質画像140枚以上、星穹鉄道キャラクターアドバイザーボイス（最適化予定）が含まれています。音楽は「失控」、「雪融于烬」、「长生梦短」、「行于命途」、「星空剧场」などの星穹鉄道音楽アルバムを網羅しています。"
 hsr_module_recommendation1_custom_tooltip: "§RこのMODはHearts of Iron IV（鋼鉄の雄心4）のMODです§!\n\nもし原神が単なるシンプルでカジュアルな二次元スマホゲームではなく、剣と魔法、烈火と鲜血、人民と指導者、理想と正義で綴られた叙事詩的な伝奇だったら、その物語はどのように展開するでしょうか？もし興味があれば、今、新しいキャラクター、国家、地図、イベント、国策、シナリオ、メカニズム、兵モデル、音楽、技術をベースに、有名ゲーム「原神」を元にした大型鋼鉄の雄心4MOD——テイワットの夜明け——をぜひ購読して体験してください！白骨が野を埋め尽くし雪の如く、高い木々は悲風を響かせる様を見よ。一朝英雄が剣を抜けば、また十年の蒼生の劫となる！"
 XQTD_recommend_MOD3.1_custom_tooltip: "1. 原神キャラクター種族パック\n——2つの新起源\n——新しい種族特性\n——専用の伝統、建築、職業\n——新しい武器\n——新しい物語、イベントチェーン\n2. 新しい指導者と育成メカニズム\n——原神のキャラクターをベースにした伝説の指導者\n——キャラクター専用の育成システム\n3. 専用飛昇ルート、技術ルート\n——本MODには独自の飛昇ルートがあり、プレイヤーは技術「元素理論」を研究した後、直接伝統の古木を選択し、その伝統を完了した後、二段階目の飛昇の道を選択します。対応する技術を研究した後、対応する飛昇の才覚と伝統を選択して二段階飛昇を行います。\n——原神をベースにした新しい技術ルート\n4. 新しい武器、世界樹システム\n——世界樹はあなたの国に強力な助力を提供します\n——群星の世界観に基づいて設計された新しい武器\n5. 新しい飛び地、艦船\n——冒険者協会、冒険者協会を活用して探索をより良く行えます\n——武装工学船、武装科学船、風魔竜を追加"
 hsr_module_recommendation_custom_tooltip: "このMODは天体戦艦を中心に展開し、巨大構造物などを通じて特殊な艦船や要塞を建造します。\n関連技術を研究すれば、天体戦艦や天体要塞を建造できます。\n天体戦艦と天体要塞は艦船設計機で設計可能です。\n八種類の戦艦を提供：小惑星戦艦、衛星戦艦、惑星戦艦、巨大惑星戦艦、恒星戦艦、中性子戦艦、ブラックホール戦艦、永遠天塔。\n八種類の要塞を提供：小惑星防御アレイ、軌道基地、環惑星防御基地、巨大惑星殲滅砲、恒星爆弾、中性子雷暴、ブラックホール--忘川、擎蒼天塔。"
 XQTD_recommend_MOD1.2_custom_tooltip: "MOD名：\n  崩壊：星穹鉄道 | 音楽・画像・アドバイザー"
