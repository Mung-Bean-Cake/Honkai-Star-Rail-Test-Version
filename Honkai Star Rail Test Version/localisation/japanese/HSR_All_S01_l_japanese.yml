ap_xianzhou_world:0 "仙舟巨艦"
ap_xianzhou_world_desc:0 "生態巨艦がゆっくりと星空へと進み出る。まるで夜に沈む静かな月のようだ。長い道のりは果てしなく、その行方も知れない。"
allow_xianzhou_project:0 "仙舟巨艦決議を解放"
decision_xianzhou_project_effects:0 "星艦または宇宙ステーションを仙舟巨艦の惑星タイプにアップグレードする。住宅、資源生産、人口増加を増加させ、特別な仙舟区画を解放するが、一部の生産区画は削除される。"
decision_xianzhou_project_requirements:1 "大量の資源を用いて古仙舟の完全な設計図を建造する。惑星上の全ての区画スロットが建設されている必要があるが、全てが都市区画や工業区画である必要はない。"
decision_xianzhou_project:0 "星艦アップグレード：仙舟巨艦"
