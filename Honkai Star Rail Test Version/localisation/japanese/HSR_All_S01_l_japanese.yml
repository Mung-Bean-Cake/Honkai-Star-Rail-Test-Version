 #開拓者—歓楽
 NAME_huanyunv:"開拓者—歓楽"
 huanyunv_catch_phrase:"「笑いは、人類の賛歌である！」"
 huanyunv_backstory:"星穹列車に乗り込んだ少女。星核がもたらす危機を排除するため、星穹列車との旅を選んだ。"
 hsr_paragon.65.name:"開拓者—歓楽"
 hsr_paragon.65.a:"初対面"
 hsr_paragon.65.a.response:"選択する機会を得た時、後悔しないように……。"
 hsr_paragon.65.b:"挨拶"
 hsr_paragon.65.b.response:"いいだろう、君は私の注意を引いた。"
 hsr_paragon.65.c:"見聞"
 hsr_paragon.65.c.response:"もし列車に乗るという選択をしなかったら、どんな人生を送っていただろう…いや、もしもの話はない。"
 leader_huanyunv_t1:"§R歓楽だと言ったら、お前は耳が聞こえないのか？§!"
 leader_huanyunv_t1_desc:""
 leader_huanyunv_t1_add:"§R歓楽技—パッシブ§!\n宇宙戦に勝利すると、§R笑いポイントを5§!獲得する。"
 leader_huanyunv_t2:"§M安心して飛べ、開拓は永遠に共に！§!"
 leader_huanyunv_t2_desc:""
 leader_huanyunv_t3:"§M英雄の一笑、生死は計り知れず§!"
 leader_huanyunv_t3_desc:""
 leader_huanyunv_t4:"§M君と共に爆発する§!"
 leader_huanyunv_t4_desc:""
 leader_huanyunv_t4_add:"§R【良いネタには報いを】—バフ技§!\n§Y[アハの瞬間]§!が発動した後、追加でBUFF§G艦船初期経験値+500§!を獲得、6ヶ月間持続"
 leader_huanyunv_t5:"§Mアハ、噛め！§!"
 leader_huanyunv_t5_desc:""
 leader_huanyunv_t5_add:"§R【良いネタには報いを】—バフ技§!\n§Y[アハの瞬間]§!が発動した後、追加でBUFF§G艦船建造速度+20%§!を獲得、3ヶ月間持続"
 leader_huanyunv_t6:"§M快哉快哉§!"
 leader_huanyunv_t6_desc:""
 leader_huanyunv_t6_add:"§R【良いネタには報いを】—積層技§!\n他の§Y【歓楽】§!キャラクターの§R歓楽技§!——能動効果が発動するたびに、スキル['leader_trait:leader_huanyunv_t1']の効果が永続的に+1される。"
