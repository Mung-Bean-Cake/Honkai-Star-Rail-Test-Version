 tr_zhishi_jiyi_1:"§B燭墨検証官§!"
 tr_zhishi_jiyi_1_flavor:"文字の正誤をどのように評価するのか？完全な論理、簡潔な文章、虚飾のない語彙、そして憶質との照応。虚構史学だけが歴史を弄ぶわけではない。公にできない秘密、スキャンダル、文明の殺戮——贋作は過去を満たすだけでなく、現在をも改ざんする。時間の検死官は、細かな手がかりを辿って虚構の痕跡を推測する。あなたはその残骸を切り開く。溢れ出る憶質が切片に浸透し、レンズの下で証拠を露わにする。そして、探偵は事件に決着をつける。死因はクーデターとある取引であり、意味の改ざんが凶器であり、イスター連合の正当性の維持が動機である。歴史は環環相関しているが、欠陥だらけだ。これらすべての不合理を通じて、真実の結末を推理することができる。"
 tr_zhishi_jiyi_1_desc:"$EFFECTS_TXT$\n—『concept_zhishi_effect』の年間実践値成長：§G+0.5§!$TABBED_NEW_LINE$—『concept_jiyi_effect』の年間実践値成長：§G+1§!$TABBED_NEW_LINE$—研究速度：§G+15%§!$TABBED_NEW_LINE$—代替技術：§G+1§!$TABBED_NEW_LINE$—毎月影響力：§G+1§!$TABBED_NEW_LINE$—異常現象発見確率：§G+25%§!$TABBED_NEW_LINE$—異常現象研究速度：§G+25%§!\n建築を解放：['building:building_zhishi_jiyi_1']\n内閣ポストを解放：$councilor_zhishi_jiyi_1$"
