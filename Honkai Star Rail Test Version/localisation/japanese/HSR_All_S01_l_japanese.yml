 d_herta_1:0 "収容セクション"
 d_herta_1_desc:0 "奇物を収容する保管室セクション。中庭には巨大な環状通路が高低に配置され、各科室の収蔵品を結んでいる。"
 d_herta_2:0 "支援セクション"
 d_herta_2_desc:0 "宇宙ステーションの後方支援の中核。各種物資の保管、エネルギーコアの管理、完全な接続プラットフォームを備え、宇宙ステーションの運用と維持の重要な拠点。"
 d_herta_3:"虚数エネルギー区画"
 d_herta_3_desc:"宇宙ステーションに残留する反物質軍団の浸食を集中収容・処理して封じた特殊なエネルギー区画。特殊処理後は発電のみに使用される。"
 d_herta_debuff:"裂界浸食"
 d_herta_debuff_desc:"黒塔宇宙ステーションが反物質軍団の攻撃を受けた後の残留影響。宇宙ステーションのエネルギーシステムを浸食することで自らの存在を維持している。"
 d_herta_debuff_remove:"我々はさらに処理方法を研究する必要がある"
