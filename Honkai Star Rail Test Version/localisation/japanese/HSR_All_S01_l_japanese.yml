 #姫子
 NAME_jizi:"姫子"
 jizi_catch_phrase:"「それは始点へと至る旅路である。」"
 jizi_backstory:"冒険心にあふれた科学者。少女時代、故郷で座礁した星穹列車と出会う。その時、列車内のある存在が彼女に自分の惑星の外側、すなわち「宇宙」と呼ばれる世界を見せた。数年後、姫子がついに列車を修復して星々へと旅立った時、彼女はこれが始まりに過ぎないと悟った。「開拓」の新たな世界への道には、より多くの仲間が必要である——たとえ旅人がそれぞれ異なる方向を向いていても、彼らは同じ星空の下にいるのだ。"
 hsr_paragon.60.name:"星穹列車-姫子"
 hsr_paragon.60.a:"初対面"
 hsr_paragon.60.a.response:"乗車を歓迎する、開拓者。私は星穹列車の航路士、姫子だ。我々はきっと興味深い旅を共にすることになるだろう。"
 hsr_paragon.60.b:"趣味"
 hsr_paragon.60.b.response:"様々な風味のコーヒー豆をブレンドするのが私の得意技だ。今すぐ一杯淹れてあげよう。ミルクなしのブラックコーヒーがおすすめだ。"
 hsr_paragon.60.c:"見聞"
 hsr_paragon.60.c.response:"宇宙の中で求めているものを見つけるということは、たいていの場合、「あった！これだ！」というひらめきではなく、「これかな？違ったらどうしよう？」という熟考と疑念と躊躇いの連続だ。"
 leader_jizi_t1:"§M灼熱§!"
 leader_jizi_t1_desc:"戦闘は精密な設計である。"
 leader_jizi_t2:"§M熔核爆裂§!"
 leader_jizi_t2_desc:"私はもちろん、何でも引き受ける。"
 leader_jizi_t3:"§M追撃§!"
 leader_jizi_t3_desc:"コーヒーはいかが？"
 leader_jizi_t4:"§M銀河鉄道の夜§!"
 leader_jizi_t4_desc:"ポンポンから見れば、私はずっと列車の整備士に過ぎないんだろうな。"
 leader_jizi_t5:"§M天墜の火§!"
 leader_jizi_t5_desc:"人間は星空を支配したいという欲望を隠さない…もちろん、私もその一人だ。"
