origin_tooltip_Amphoreus_effects:0 "「永遠の地」アンフォレウス。「知性」「記憶」「壊滅」の三つの運命が交差する世界。憶庭の鏡にのみ映し出されるこの世界は、少なくとも三人の「令使」に匹敵する存在が生まれたことを証明している。外界からはアンフォレウスの存在を観測できず、現地人も天外の世界について全く認識していない。彼らは土着の神「タイタン」を信仰し、「星神」という概念はむしろ馴染みがない。"
