 concept_tongxie_desc: "§H「同諧」、ヒペ§!\n複数の諧楽天体世界からなる星神。「同諧」の運命を司る。千面一体の姿で、人間の調和のとれた喜びを謳い上げる。\n§H「普世同諧、群星共に輝く、無上の功徳を神主に讃えよ！世人は同袍、万物は同根、祝福の風は大地を吹き渡る！」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——『諧楽頌』第一楽章§!"
 concept_tongxie_effect:"運命：「同諧」"
 concept_tongxie_effect_desc:"§H有用型§!運命。初期は§G安定度§!、§Gポスト生産の快適度§!、§Gポスト生産の結束力§!、§G主流思潮の魅力§!を向上させ、§G遺物結束力費用§!を減少させる。実践値が増加するにつれて、§H自動再配置確率§!、§H星域サイズ§!を向上させる。§H人口維持費§!、§H帝国規模による伝統費用§!、§H強制移住費用§!、§H帝国規模§!を減少させる。"
