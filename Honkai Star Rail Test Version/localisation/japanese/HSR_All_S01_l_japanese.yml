 tr_cunhu_jiyi_1:"§B築城の史官§!"
 tr_cunhu_jiyi_1_flavor:"あなたは書物の香りを嗅ぐ。アルパニの花が永遠に枯れませんように——それはあなたの母親がエイドリアンの寓話を読み聞かせているのだ。築城者たちはこの大陸を守り抜いた。彼らは銀の盾を掲げ、反物質の火の罪を粉砕した。しかし彼らはどこへ行ったのか？脳の奥深くで花が咲く。あなたはトロダルの廃墟を越え、シビルチの塹壕を越え、戦争の断壁残垣を登る。アルパニ、それらはそこで咲いている。忘却を養分として。あなたは血に染まった勲章を拾い、見知らぬ名前を記録し、勇敢な戦士の行為を石碑に刻み、砕けた鎧を船に乗せて故郷へと送り返す。そしてあなたは次の世界へと向かう。築城者の足跡を辿り、新たなる伝説を発掘するために。"
