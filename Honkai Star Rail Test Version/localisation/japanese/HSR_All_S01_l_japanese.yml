 herta_holomuseum_1:0 "奇物収容センター"
 herta_holomuseum_1_desc: "ここには銀河各地から集められた大量の奇物が収容されている。職員は研究・選別を行い、価値ある奇物を発見し、時には模造品を展示することもある。"
