 SR_belobog.101.title:0 "裂界怪物の侵入！"
 SR_belobog.101.desc:0 "ヤリロ-VIの前線部隊が、大量の裂界怪物が我々の活動地域に向かって押し寄せているのを観測した。裂界怪物に打ち負かされれば、結果は想像を絶するものとなる。"
 SR_belobog.101.a:0 "戦闘準備を整えよ！"
 SR_belobog.111.title:0 "戦士たちの帰還成功"
 SR_belobog.111.desc:0 "不幸中の幸い！我々の戦士たちは敗れた戦場から撤退し、まだそびえ立つ壁の中に戻ってくることができた。生存者たちの説明によると、彼らは戦場を離れた後、指揮部との連絡を失ったが、豊富な戦闘経験と関連知識を駆使して裂界生物を安全に回避し、ほぼ完全な状態でここに戻り、再びベロブルグのために戦うことができた。"
 SR_belog.111.a:0 "これらの英雄たちを休ませてやろう。彼らは相当疲れているはずだ。"
 SR_belobog.112.title:0 "痛ましい代償"
 SR_belobog.112.desc:0 "戦士たちは相当な犠牲を払い、ようやく敗れた戦場から撤退した。しかし、彼らの生存は戦友たちの血の上に成り立っており、誰の顔にも生き延びた喜びはなく、悲しみの気配が人々の中に漂っていた。彼らは復讐のために再び戦場に戻ることを切望している。"
 SR_belobog.112.a:0 "裂界生物に血の代償を払わせなければならない！"
 SR_belobog.112.b:0 "この敗北には誰かが責任を取らなければならない。裂界生物か、司令部か。"
 SR_belobog.113.title:0 "裂界生物の反撃を受ける"
 SR_belobog.113.desc:0 "我々の部隊は撤退中に裂界生物の激しい反撃を受け、戦士たちはやむを得ず一部を殿軍として残した——殿軍には永遠の静寂だけが待っていることを誰もが知っていた。\n殿軍の犠牲のおかげで、一部の戦士は防衛線内に撤退することに成功したが、誰もこの作戦を成功とは見なさなかった。なぜなら、英雄たちは永遠にこの地に残ったからだ。\n我々は直ちに後続の計画を検討し始めるべきである。死んだ戦士たちのためだけでなく、我々自身の未来のためにも。"
 SR_belobog.113.a:0 "これらの勇敢な戦士たちに勲章を授与せよ。その行為は永遠に記憶されるべきだ。"
 SR_belobog.113.b:0 "裂界生物に代償を払わせなければならない！"
