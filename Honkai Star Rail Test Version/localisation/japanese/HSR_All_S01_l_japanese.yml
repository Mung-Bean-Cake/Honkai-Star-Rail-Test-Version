 xianzhou_planet_fleet: "仙舟"
 xianzhou_planet_fleet_plural: "仙舟"
 xianzhou_planet_fleet_desc:"仙舟は完全な生態系を備えた宇宙航行体である"
#区画
 district_xz_yunqi:0 "雲騎護衛"
 district_xz_yunqi_desc:0 "雲騎軍は仙舟連盟の武装勢力である。その建制は現存する六つの仙舟に跨り、仙舟の民の安全を守り、豊穣の孽物を討伐する重任を担っている。"
 district_xz_yunqi_plural:0 "雲騎護衛"
 district_xz_danding:0 "丹鼎司"
 district_xz_danding_desc:0 "丹鼎司は仙舟の生物学・医学研究を担当し、各洞天に医館を開設して医療サービスを提供する。古い時代には、仙舟の先民は長寿種ではなかったと言われている。老・病・死の三苦を解脱するため、彼らは薬を求めて出航した。長生を得た後、丹鼎司は星神の残した奇跡を用いて「仙道」を説いた。しかし現在、丹鼎司は衰退の道を辿り、最終的には化外民の診療所となった。"
 district_xz_danding_plural:0 "丹鼎司"
district_xz_city:0 "天舶司"
district_xz_city_desc:0 "天舶司は仙舟内部の空域と星間航行などの事務を掌管し、星槎や斗艦飛舸などの交通機関の維持、全ての「飛行」に関連する事項が天舶司の仕事である。仙舟と他の知的生命体との貿易・交流も天舶司が担当する。"
district_xz_industrial:0 "工造司"
district_xz_industrial_desc:0 "工造、工造、工は工業、造は製造。工造司は工業開発と製造を担当し、仙舟上のほぼ全ての物品の設計・製造・改良を担う。武器設計、造船、機械人工知能など、製造可能な物品を全て含む。民間の機械から大型の星間戦艦や洞天に至るまで、全てここの工匠によって作られる。彼らは巧奪天工の技を追求し、「百冶大煉」の儀式を完成させ、「百冶」の称号を与えられることを目標に奮闘する。"
district_xz_science:0 "太卜司"
district_xz_science_desc:0 "太卜司は「玉兆」と呼ばれる晶石コンピュータ技術を用いて、未来の占い、情報処理と保存、航路の推算、戦略運籌などの業務を担当する。"
district_xz_trade:0 "地衡司"
district_xz_trade_desc:0 "地衡司は仙舟の庶務管理機関であり、仙舟の住民が日常的に最も接する機関である。人口統計、資源配分、生態治理、暦法計時などの事務は全て地衡司が計画する。社会学や生態学などの専門学術研究を行う学者も含まれている。"
district_xz_city_plural:0 "天舶司"
district_xz_industrial_plural:0 "工造司"
district_xz_science_plural:0 "太卜司"
district_xz_trade_plural:0 "地衡司"
