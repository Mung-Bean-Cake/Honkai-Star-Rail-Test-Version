 hsr_thank_you_list_custom_tooltip: "星穹鉄道制作チームメンバーリスト：小松岗（制作チームリーダー）、緑豆糕、Phantom、猫猫来咯、天灾苏丹娜、Ruka、我很可爱请给我钱、善良地联球、七月不见不散、包子、摸鱼仔、七铭、自闭废物阿门、小白、无岫、佚名、白夜、嗯哼、Luna、锵锵、他にもまだ働いているメンバーがいます。\n謝辞リスト：Mihoyo Technology Co., Ltd、Cindy、鋼鉄の雄心テイワットの夜明け制作チーム、二元君主国女王涡芽、雷肾老司机、shv2013とその太虚流浪MOD制作チーム、Starkiller、善良海豹、御坂11726号、爱吃咖喱的Poi、Void/新神殿下、雨様、Longkoha、Nevakuma、Litchi、Akmr Knst、Sheya、SWKL:D、Miyoushe、Crackingtaro、原汁云喵-mao、白夢しらみ、DOODuck、Yujiu1、YuutaDatma、jeanbeansprout、Rafa、是如沫似尘呀、Nid417、Minty0、アナ、Rafa、霜天、Varhan、糖德慕斯、Nishikino形昇、tmddks321、破偶. frame、elvandec、Yukiya/雪呀、Broseele、Vvon、Dr.K战斗中、鳗鱼茶泡飯、Celtreny、么斯鸽Misige、Iras17514、Saclia、camu、mao、Yukiya/雪呀、コユコム、鸦居、robokoboto、芹江ニ愛、patrika、アナ、Harukix、一akeng、Yolanda、布搂希、tmt、Zieru、ムム、mao、千早Tihaya、Vvon、蒼辰、Oli、Feint、へれおれお、Azenotbald、Nishikino形昇、To___e、jwijaya_art、MarseilleZ、elodeas、guaisanmu、原汁云喵-mao、Saclia、コユコム、VVlolicon など。UI素材の一部はVVloliconがMODderグループに共有したものです。"
