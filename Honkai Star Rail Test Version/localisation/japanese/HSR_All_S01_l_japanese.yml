 #スクリューガム
 NAME_luosi:"スクリューガム"
 luosi_catch_phrase:"あらゆる微小な蟲との再会を楽しみにしている"
 luosi_backstory:"天才クラブ#76、スクリューガム星（機械惑星IX）の統治者。毒舌で知られる黒塔でさえ彼を高く評価し、「真の善人、紳士、卓越した機械的頭脳を持つ」と称している。黒塔、ルアン・メェイ、スティーブン・ロイドと共に「模擬宇宙」プロジェクトを推進；その後、スクリューガム星の先進技術を利用して模擬宇宙に新たなプロジェクトブランチ「差分宇宙」を制作した。"
 hsr_paragon.6.name:"天才クラブ-スクリューガム"
 hsr_paragon.6.a:"人物紹介"
 hsr_paragon.6.a.response:"天才クラブ#76、スクリューガム星（機械惑星IX）の統治者"
 hsr_paragon.6.b:"他人の評価"
 hsr_paragon.6.b.response:"毒舌で知られる黒塔でさえ彼を高く評価し、「真の善人、紳士、卓越した機械的頭脳を持つ」と称している。"
 hsr_paragon.6.c:"初期の経歴"
 hsr_paragon.6.c.response:"第二次ルパート戦争後、星間平和会社は機械生命の絶滅を計画していたが、スクリューガムが天才クラブに加わったことで方針を変更した。最終的に会社はスクリューガムに「機械カッコウ時計」を贈り、好意を示した。"
 leader_luosi_t1:"§M機械紳士§!"
 leader_luosi_t1_desc:"「真の善人、紳士、卓越した機械的頭脳を持つ」"
 leader_luosi_t2:"§M機械天才§!"
 leader_luosi_t2_desc:"スクリューガムは黒塔、ルアン・メェイ、スティーブン・ロイドと共に「模擬宇宙」プロジェクトを推進；その後、スクリューガム星の先進技術を利用して模擬宇宙に新たなプロジェクトブランチ「差分宇宙」を制作した。"
