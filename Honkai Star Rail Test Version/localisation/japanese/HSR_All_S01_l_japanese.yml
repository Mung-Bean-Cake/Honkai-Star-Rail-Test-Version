 #銀狼Lv.999
 NAME_langzun:"銀狼Lv.999"
 langzun_catch_phrase:"「天井レベルの操作。」"
 langzun_backstory:"新たな歓楽シーズン、無敵プレイヤー「銀狼Lv.999」が期間限定で復帰中！宇宙の大勝者となり、銀河の全実績をコンプリートしたら、次はどう遊ぶ？「『歓楽』の頂点に立つ？退屈過ぎて死にそう…カセットは手に入れたから、あとは俺が決める~」"
 hsr_paragon.71.name:"銀狼Lv.999"
 hsr_paragon.71.a:"初対面"
 hsr_paragon.71.a.response:"Lv.999の形態、完全な私。初めて見るだろ？高難易度ダンジョン、俺が連れて行く、ワンクリッククリアだ。"
