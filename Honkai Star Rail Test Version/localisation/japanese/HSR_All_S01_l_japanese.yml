# l_simp_chinese: New file

prethoryn_scourge_chain_desc: "我々の星系は貪欲な星間生物の群れに侵略された。彼らは出会うすべての生命を貪り食おうとしている。この繁育蟲族の侵略者の数が我々を超える前に、彼らを殲滅しなければならない。"
prethoryn_kills_us: "§G我々が殲滅した繁育蟲族§!"
prethoryn_kills_others: "§G他者が殲滅した繁育蟲族§!"
prethoryn_victims: "§R繁育蟲族に貪り食われた艦船§!"
crisis.51.desc: "繁育蟲族と戦う組織が最近銀河に現れた。この組織は主に難民、退役軍人、その他戦争で全てを失った人々——追放され、抑圧された集団で構成されているようだ。\n\nそれにもかかわらず、彼らが寄せ集めた艦隊は、いくつかの繁育狩猟蟲群との戦闘で勝利を収めている。未確認の報告では、彼らの艦隊には異常な設計の戦艦があるという……"
crisis.52.desc: "我々は哨兵である。我々の教団は、血に飢えた繁育蟲族を阻止するためにどんな犠牲も払うと誓った。他の帝国が粉々になる中、我々は戦い続けた。彼らが闇に屈する中、我々は彼らに反撃の手段を与えた。\n\n私はカス大団長、教団の長である。外見で判断するな——哨兵は銀河のすべての種族、君たちの種族からも人材を募っている。我々はただ、君たちの政府が寰宇蝗災の侵攻に抗い続け、可能な時には我々を支援することを願っている。"
crisis.52.a.response: "多くの哨兵は軍歴を持つ。我々は繁育蟲群との戦闘で敗れた様々な艦隊の生存者である。哨兵として、我々は過去の過ちから教訓を学び、同様の事態が再び起こらないよう努力している。\n\n同様に、既に述べたように、我々は銀河のすべての種族から人材を募集している。それには古代の種族、例えば[sentinel_fallen_empire.GetSpeciesNamePlural]も含まれる。我々は§H[sentinel_fallen_empire.GetName]§!の影響力のある派閥から支援を受けており、彼らは自分たちの星系が蟲群に飲み込まれるのを望んでいない。彼らは我々の事業に艦船と資源を寄付している。"
crisis.55.a.response: "我々が知っていることも限られているが、彼らが銀河の外から来たことは確かだ。彼らは我々の銀河に来る前に数十、あるいは数百の銀河を破壊した可能性が高い…あるいは我々が最初の被害者かもしれない。\n\n彼らが惑星上のすべての非繁育蟲族の生命を虐殺した後、その惑星を歪んだ悪夢としか言いようのない地獄に変える。これらの孵化惑星では他の生命は一切生存できず、惑星を浄化する唯一の方法は、強力な軌道爆撃で生物圏全体を焼き尽くすことだ。"
crisis.101.desc: "我々の深宇宙偵察探知機が[queen_system.GetName]の戦場残骸に侵入した。そこは繁育蟲族と未知の勢力が戦った場所だ。繁育蟲族の蟲后が戦闘で重傷を負い、死ぬままに放置されたようだ。\n\n偵察探知機は蟲后がまだ一命を取り留めていると報告している。今こそ生きた蟲后を捕獲するまたとない好機である。"
crisis.211.desc: "最後の繁育蟲族が殲滅され、宇宙全体が安堵の息をついた。彼らの侵略は完全に失敗に終わった。かつて無数の生物を恐怖させた繁育蟲族は、今や無数の焼け焦げた死体を虚空に漂わせるのみとなった。\n\n安堵と歓喜の気配は超光速で宇宙全体に広がり、無数の惑星がこの偉大な勝利を祝う行事を自発的に開催している。おそらく、この機会を利用して宇宙の平和と安定の新たな章を開くことができるだろう？"
gal_com_is_neighboring_swarm: "繁育蟲族が近くにいる"
gal_com_is_not_neighboring_swarm: "繁育蟲族はまだ遠くにいる"
swarm_army: "繁育蟲族部隊"
swarm_army_plural: "繁育蟲族部隊"
leader_trait_sentinel_desc: "哨兵艦隊指揮官は繁育蟲族の生理構造と戦術を熟知している。"
leader_trait_hive_mind_desc: "繁育蟲族艦隊を制御する集合意識は複雑なマルチタスクを処理する能力を持つ。"
leader_trait_hive_affinity_desc: "艦隊意識に基づいて行動する繁育蟲族は、互いに非凡な共鳴を示す。その射撃規律は大幅に改善され、射速も向上する。"
leader_trait_void_swimmer_desc: "この艦隊の狩猟本能は配下の繁育蟲族を狂気に駆り立てる。戦争への渇望が彼らを前進させる。"
SWARM_STRIKE_CRAFT_1_DESC: "これらの繁育蟲族のミニチュアクローンは艦隊通信システムによって制御され、効果的な艦載機となる。"
name_list_Prethoryn: "繁育蟲族"
mod_weapon_swarm_weapon_fire_rate_mult: "繁育蟲族兵器射速"
necroids.310.desc: "繁育蟲族が§R我々§!に侵入しようとしている！\n\nこれらの系外侵入者は素早く我々の死霊働き蜂を捕獲した。そこから他の蟲群がより多くの近くの個体を収集し始める。我々は[Root.GetName]の安全を確保するために感染区域全体を浄化する必要がある。"
enclave.240.c: "繁育蟲族"
enclave.255.desc: "繁育蟲族艦隊は低速の運動兵器と小型艦船の大群で敵を圧倒する。選択肢の一つは、点防御と装甲、向上した船体回復力を組み合わせることだ。もう一つの選択肢は遠距離交戦である。十分に強力なエネルギー兵器を使用すれば、敵が攻撃範囲に入る前に艦隊を破壊できる。"
tactic_v_swarm: "傭兵戦術：繁育蟲族"
CAPTURE_QUEEN_DESC: "[queen_system.GetName]星系で最近宇宙戦が発生し、繁育蟲族の蟲后が重傷で瀕死の状態だが、まだ生存している。これを捕獲することは情報戦略上の大きな勝利となる。"
tech_swarm_strike_craft_1_desc: "倒した繁育蟲族からサンプルを収集することで、その遺伝子をクローンし再プログラムし、我々自身の戦闘兵器を製造することができる。"
NAME_Prethoryn: "繁育蟲族"
NAME_Feral_Prethoryn: "野生繁育蟲族"
NAME_Prethoryn_Armies: "繁育蟲族部隊"
NAME_Prethoryn_Star_Brood: "繁育蟲族星孵池"
PRETHORYN_SHIP_PrethorynSwarmer: "繁育蟲族群"
PRETHORYN_SHIP_PrethorynSwarmling: "繁育蟲族幼体"
PRETHORYN_SHIP_PrethorynWarrior: "繁育蟲族戦士"
PRETHORYN_SHIP_PrethorynBroodMother: "繁育蟲族育母"
PRETHORYN_SHIP_PrethorynInfestor: "繁育蟲族感染体"
NEW_ACHIEVEMENT_2_21_DESC: "繁育蟲族の蟲后を捕獲することに成功"
crisis.250.desc: "蟲后は新たな繁育蟲族艦隊を産み落とした。この艦隊は[Root.Capital.GetName]の軌道を周回する。蟲后が我々の支配下にある限り、これらの生物は絶対的に忠実であり、我々のすべての命令に従う。"
crisis.252.desc: "[battle_system.GetName]星系で繁育蟲族艦隊と交戦した際、我々の部隊は彼らの蟲后が運んでいた卵を奪取することに成功した。卵はすぐに孵化し、§H蟲后§!が現れた。\n\n我々の科学者は神経伝達物質を使用してこの蟲后を鎮静化させた。それはまるで元の繁育蟲族集合意識に従うかのように、我々の命令に従う。我々はこの蟲后を利用して、我々自身の小型繁育蟲族群を育成できるかもしれない。"
relic_queen_spawn: "相当な規模の繁育蟲族艦隊を育成する"
r_prethoryn_queen: "「繁育」タイズスロス"
r_prethoryn_queen_desc: "捕獲されたこの繁育蟲族の蟲后は、神経伝達物質を使用して鎮静化されている。これを使用して相当な規模の繁育蟲族艦隊を繁殖させることができる。"
crisis.52.2.a.response: "多くの哨兵は軍歴を持つ。我々は皆、繁育蟲族と戦った様々な艦隊の生存者である。敗北したが、過去の経験から教訓を学び、同じ過ちを繰り返さないよう努めている。\n\n先に述べたように、哨兵は銀河のすべての種族からメンバーを募集している。我々の希望は、この銀河に現れなくなった失われた帝国の生き残りの一小隊に託されている——彼らは我々に秘密技術と封蔵された艦隊を援助している。"
crisis.76.desc: "多くの困難を乗り越え、我々の銀河は勝利を収めた——繁育蟲族は敗北した。この日が来ることはないかと恐れた時もあった。しかし今、私は最後の任務を残すのみである。\n\n哨兵の大団長として、私はここに教団の解散を宣言する。我々の唯一の目的は繁育蟲族を倒すことであった。その目標が達成された以上、別れの時である。既存の戦艦が悪用されるのを防ぐため、これらは廃棄される。\n\nこの銀河の災厄の終焉が、新たな平和の時代の始まりとなりますように。こちらは哨兵一号、通信を終了する。"
crisis.78.desc: "こちらは哨兵一号。銀河は危機的な状況にあるが、良い知らせがある。\n\n長期にわたる戦闘で得た教訓と、困難な研究を通じて、我々の工作員はついに繁育蟲族生物の極めて詳細な解剖学データを作成した。例えば、繁育蟲族の幼虫は主胆嚢と副胆嚢を同時に貫かれれば激しく燃焼することを知っているか？\n\n我々はこれらの文書を公開する。我々が特定した弱点を狙って攻撃すれば、艦船はより効率的に戦闘を行えるだろう。"
sentinel_data_desc: "これらの繁育蟲族の詳細な解剖学データは哨兵組織から提供された。このデータの助けにより、我々は蟲群生物の外骨格にいくつかの弱点を特定することができた。"
crisis.121.name: "野生繁育蟲族を発見"
crisis.121.desc: "繁育蟲族が敗北した後、我々は逃げ延びた一部の繁育蟲族を捕捉できなかった。中枢の主巣の導きがないため、これらの心を持たない野獣のほとんどは枯れ果てるだろう。\n\nしかし、最近の目撃報告により、大群の野生繁育蟲族が§H[feral_prethoryn_system.GetName]§!星系に新たな巣穴を築いたことが確認された。\n\n今後、繁育蟲族がかつて占領していた未占領星系で野生の蟲群の巣穴に遭遇する可能性は高い。しかし、これらが大きな脅威に発展する可能性は低い——これらの野生生物は内部対立に陥りやすく、天災を継続させる知性を発達させる兆候も見られない。"
crisis.52.a: "どのようにして蟲族に抵抗できたのか？"
crisis.55.desc_03: "今や国家間の争いは無意味だ。艦船を蟲族ではなく味方同士で使うのは、莫大な無駄遣いである。"
crisis.55.desc_05: "蟲族に正面から対抗できない場合は、資源を我々に寄付してほしい。それによって蟲族の侵略者に対する兵力が強化される。"
crisis.55.a: "蟲族について何を知っている？"
crisis.71.a: "もちろん…我々は蟲族と戦うためだけにそれを使用する。"
crisis.71.b.response: "それで構わない。我々はただ君たちが戦い続けることを望んでいる。一匹でも多くの蟲族を倒せば、勝利に一歩近づく。"
#crisis.101.desc: "我々の深宇宙偵察探知機が[queen_system.GetName]の戦場残骸に侵入した。そこは繁育蟲族と未知の勢力が戦った場所だ。繁育蟲族の蟲后が戦闘で重傷を負い、死ぬままに放置されたようだ。\n\n偵察探知機は蟲后がまだ一命を取り留めていると報告している。今こそ生きた蟲后を捕獲するまたとない好機である。"
crisis.105.desc: "[Root.GetName]は蟲后のいくつかの重傷を治療した。科学官[Root.GetLeaderName]は蟲后が同族と連絡するために使用していた器官を切除し、小型の陽電子装置を埋め込んで、蟲后を完全に制御した。蟲后は今や我々の意のままに動き、その腹の中では蟲族の幼体が育っている。これらの幼体はこの蟲后にのみ従う、つまり我々にのみ従う。蟲后が生きている限り、我々は大量の奴隷化された蟲族の大軍を育成することができる！"
country.60.name: "繁育蟲族を捕獲"
NAME_Domesticated_Prethoryn: "飼いならされた蟲族"
