 councilor_cunhu_xuwu_1_desc:"あなたは永遠にその過去の死都を守り続けるだろう。しかし、もはや自問することはない——あなたは一体誰の墓を守っているのか。"
 tr_xunlie_fanyu_1:"§B巣立ちの浪人§!"
 tr_xunlie_fanyu_1_flavor:"正義は一尺高ければ、悪は一丈高い。星の幕の下、奸邪は至る所に存在し、正義は分身できない。一つの血肉の体で、どうやって星間海賊の艦隊に抵抗するのか？一つの金属の骨格で、どうやって腐敗した星間帝国を打ち破るのか？宇宙を浄化するためには、個人の枠を超えなければならない。培養槽は無限のあなたを複製し、装甲をまとい、記憶を刻み込む。あなたは個人の名の下に無限の星域へと進軍する。あなたは銀心の犯罪現場に現れ、被弾した後により多くの支援を呼ぶ。あなたは被害を受けた辺境世界に足を踏み入れ、数を頼りに巨獣を殺す。まるで象を噛み殺す蟻の群れのように。あなたは無限に死ぬだろう。あなたは無限に死んだ。しかし、新しい浪人が常に巣を離れ、狩りを続けるだろう。"
 tr_xunlie_fanyu_1_desc:"$EFFECTS_TXT$\n—『concept_xunlie_effect』の年間実践値成長：§G+0.5§!$TABBED_NEW_LINE$—『concept_fanyu_effect』の年間実践値成長：§G+1§!$TABBED_NEW_LINE$—小型スロット兵器ダメージ：§G+100%§!$TABBED_NEW_LINE$—小型スロット兵器射速：§G+100%§!$TABBED_NEW_LINE$—魚雷型スロット兵器ダメージ：§G+100%§!$TABBED_NEW_LINE$—魚雷型スロット兵器射速：§G+100%§!$TABBED_NEW_LINE$—雷撃艦建造速度：§G+15%§!$TABBED_NEW_LINE$—駆逐艦建造速度：§G+15%§!$TABBED_NEW_LINE$—駆逐艦建造費用：§G-15%§!\n戦争期間中（危機を含む）上記の効果は2倍になる。\n内閣ポストを解放：$councilor_xunlie_fanyu_1$"
