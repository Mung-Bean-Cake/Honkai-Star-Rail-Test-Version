 #起源
 origin_IPC_Default:0"星間平和"
 origin_IPC_Default_desc:0"遠い昔、虚無に沈んだ文明が星へと踏み出す前に、存護の星神の偉業を目の当たりにし、自らの存在意義を存護の道に託すことを決意した——これが会社の起源である。クリフォーは彼らの声に応えることはなかったが、それでも彼らはこの偉大な事業に身を捧げる決意を固めた。\n今、会社の最も偉大な科学者たちの努力により、彼らはついに輝く群星へと通じる道を切り開き、物語はここから始まる。§!"
 #。前方は果てしない闇か、それとも永遠の光か？いずれにせよ、【存護】のために、会社は前進しなければならない。\n\n§R星辰と深淵へ！
 origin_tooltip_origin_IPC_Default_effects:0"この起源の役割は、星間平和会社にコンテンツがあることをプレイヤーに知らせることです。これがなくても星間平和会社関連のコンテンツは使用できます。"

 #取引アクション
 trade_action_Trade_More:0"天使型債務発行機のリース"
 trade_action_Trade_More_desc:0"星間平和会社は、あらゆる潜在的な顧客に資産増殖サービスを提供します！少々の資源を支払う用意があれば、富への道は障害なく開かれます！"
 trade_action_Idol_Show:0"アイドル公演サービス"
 trade_action_Idol_Show_desc:0"国民の幸福、社会の安定、国家の活力が目前に！家畜人口さえも感動させる究極のアイドル公演が、今まさに市場に登場！今すぐ購入すれば、エイリアンアイドルの触手握手サービスも付属！"
 trade_action_Stability_Keep:0"安定維持サービス"
 trade_action_Stability_Keep_desc:0"安定維持なら星間平和を選べ！執行官を一人ずつ送り込みます。星間平和の登録商標をお確かめください！"
 trade_action_Military_Training:0"商業軍事訓練"
 trade_action_Military_Training_desc:0"星間平和、平和を守るサービスを提供します！"
 trade_action_VIP_Ship_Treat:0"VIP艦隊サービス"
 trade_action_VIP_Ship_Treat_desc:0"我々の会社には特別な艦隊整備技術があります。恋人を慈しむように優しく艦船を整備します！"
 trade_action_Charity_Treat:0"星間慈善援助"
 trade_action_Charity_Treat_desc:0"我々は慈善という言葉に対して独特の理解を持っているため、この援助は通常有料です。"
 trade_action_Faster_Growth:0"成長促進協定"
 trade_action_Faster_Growth_desc:0"会社は商品の供給のみを責任とし、アフターケアは責任を負いません。"
 trade_action_Live_Better:0"環境改善パッケージ"
 trade_action_Live_Better_desc:0"星間平和会社には夢があります。いつか、毒性の人口と水生種が同じ席に座り、共に存護の道を学ぶ日が来ることを。"
 trade_action_Worker_Better:0"人材資源管理"
 trade_action_Worker_Better_desc:0"「力を入れれば」階段を登れると信じることは、社会運営の根本的な論理です。力でお金を稼ぐことで心の安らぎを得ることは、無数の普通の生命の生活信条です。\nこのような悩みを抱えたことはありませんか？「力を入れる」ことを嫌がる怠け者が階段を登れず、十分な力を入れなかったためにお金を稼げなかった人々が、しばしばその責任をあなたに押し付けることはありませんか？おそらくあなたは我々の会社の少しの助けを必要としているでしょう。"
 trade_action_Slave_Better:0"資産管理パッケージ"
 trade_action_Slave_Better_desc:0"資産は稼働してこそ価値を生み出します——それは誰もが認めることです。しかし、あなたの資産の中には動こうとしないものもあるかもしれません——そのような時には、我々のサービスが必要です。"
 trade_action_Control_Better:0"帝国管理パッケージ"
 trade_action_Control_Better_desc:0"たった19.9の影響力で25％の規模軽減！"
 trade_action_Equal_Better:0"平等思想の普及"
 trade_action_Equal_Better_desc:0"至上の善の道へ。"
 trade_action_Migrate_Better:0"移民要件の緩和"
 trade_action_Migrate_Better_desc:0"会社はあなたを歓迎します！"
 trade_action_Research_Better:0"科学研究支援"
 trade_action_Research_Better_desc:0"学芸員を超えるお得なパッケージ！"
 trade_action_Study_Better:0"科学普及許可"
 trade_action_Study_Better_desc:0"銀河系の広大な文盲層のためにデザインされました。"
 trade_action_KLB_Better:0"布教活動許可"
 trade_action_KLB_Better_desc:0"クリフォーの恩恵を顧客に伝えます。"
 trade_action_IPC_Better:0"不可侵条約"
 trade_action_IPC_Better_desc:0"我々はあなたを「存護」します。"
 trade_action_Build_Better:0"建設者協定"
 trade_action_Build_Better_desc:0"一夜にして高楼が立ち、ローマも一日で築ける。"

 #修正
 country_modifier_Trade_Service:0"天使型債務発行機"
 country_modifier_Trade_Service_desc:0"星間平和会社があなたのためにサービスを提供します！"
 country_modifier_Idol_Service:0"銀河アイドル公演サービス"
 country_modifier_Idol_Service_desc:0"空前絶後の存在、転生した明星！\n光信号で愛を伝えれば、あらゆる種族が虜になる！"
 country_modifier_Stable_Service:0"星間平和会社安定維持サービス"
 country_modifier_Stable_Service_desc:0"ご注意ください——専門家階級の科学者ジーミン・リー、反対派指導者ジーミン・リー氏、あなたの政府は二倍の星間平和安定サービスを注文し、それを「あなたに」届けようとしています！\n「わあ、あなたの政府はあなたをとても愛しているんですね！」"
 country_modifier_Service_Training:0"軍事訓練サービスの購入"
 country_modifier_Service_Training_desc:0"小さすぎて聞こえない！会社の訓練キャンプでは、教官が聞こえないと言ったら聞こえないのだ！"
 country_modifier_Service_ShipUpkeep:0"商業艦隊整備サービス"
 country_modifier_Service_ShipUpkeep_desc:0"コルベット、入ります！"
 country_modifier_Service_PeopleUpkeep:0"資本主義援助サービス"
 country_modifier_Service_PeopleUpkeep_desc:0"これは特別なサービスです。その目的はあなたを生かしておくことです。"
 country_modifier_Service_PopGrow:0"出産促進サービス"
 country_modifier_Service_PopGrow_desc:0"うーん？え？…う、あー！"
 country_modifier_Service_Tolerance:0"居住可能な故郷計画"
 country_modifier_Service_Tolerance_desc:0"銀河系の無数の種族に居住可能なサービスを提供することは困難ですが——我々はやり遂げました。"
 country_modifier_Labour_ProUp:0"効率向上サービス"
 country_modifier_Slave_ProUp:0"資産監視サービス"
