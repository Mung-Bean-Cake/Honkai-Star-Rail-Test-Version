 #シルバーウルフ
 NAME_yinlang:"シルバーウルフ"
 yinlang_catch_phrase:"朋克洛德では、人々はいつもチームを組んで仕事をする。単独行動する者は、たいてい生き残れない。だからこそ、成功した者たちは最後には伝説になる。"
 yinlang_backstory:"宇宙をゲームと見なすスーパーハッカー。どんなに厄介な防御システムでも、シルバーウルフは難なく突破する。彼女と「天才クラブ」のスクリューガムとのデータ攻防戦は、今やハッカー界の伝説となっている。宇宙にはまだ攻略すべきステージがいくつ残っているのだろうか？シルバーウルフはそれを楽しみにしている。"
 hsr_paragon.54.name:"星核猟手-シルバーウルフ"
 hsr_paragon.54.a:"初対面"
 hsr_paragon.54.a.response:"よっ、開拓者。なかなかいい感じだな。あの星核は君に何か影響を与えてないのか？"
 hsr_paragon.54.b:"趣味"
 hsr_paragon.54.b.response:"抱き枕に顔を埋めて昼寝したり、可愛いものを揉んだりすること。"
 hsr_paragon.54.c:"見聞"
 hsr_paragon.54.c.response:"好きなゲームがいつも同じ日にアップデートされるんだよね、彼らは話し合ってるのか？"
 leader_yinlang_t1:"§M|システム警告|§!"
 leader_yinlang_t1_desc:"チュートリアルクエストの開始前に"
 leader_yinlang_t2:"§M|強制終了|§!"
 leader_yinlang_t2_desc:"今回はもっと楽しませてくれるか？"
 leader_yinlang_t3:"§M変更を許可するか？§!"
 leader_yinlang_t3_desc:"ほう、チートコードを解禁するか。"
 leader_yinlang_t4:"§M攻撃ペイロード§!"
 leader_yinlang_t4_desc:"ちょっと刺激を加えよう。"
 leader_yinlang_t5:"§M|アカウント凍結|§!"
 leader_yinlang_t5_desc:"戦闘体験は最適化が必要だな。"
