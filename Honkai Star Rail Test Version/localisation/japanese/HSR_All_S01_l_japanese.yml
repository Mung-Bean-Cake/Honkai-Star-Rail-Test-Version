 #起源
 auth_lieshou:"星核猟手組織"
 gov_lieshou:"星核猟手"
 StellaronHunter:"星核猟手"
 councilor_ruler_administrator:"猟手総管"
 lieshou_leader:"猟手総管"
 origin_StellaronHunter:"星核猟手"
 origin_tooltip_StellaronHunter_effects:0 "星核猟手は、未来を予知する「運命の奴隷」エリオによって創設された組織であり、終末の星神を信奉し、星核を奪取して「脚本」を実行することで、壊滅に対抗し、宇宙の運命を書き換えることを目的とする。星核猟手のメンバーはエリオが執筆した「脚本」に厳格に従い、その行動は一見無秩序に見えるが、実際には特定の未来のノードを達成するためのものである。組織のメンバーは少ないが、各々が惑星を壊滅させる戦力を持つ。エリオの脚本は単一の結末ではなく、数え切れないほどの試行錯誤を経て見出された唯一の生存経路に基づいている。"
 origin_StellaronHunter_desc:"星核猟手の今回の行動もまた脚本の内にある。運命の悪い結末へと赴き、宇宙の流れを変え、強大な天災を克服し、宇宙に新たな生命をもたらすのだ。"
 The_StellaronHunter_start_screen_messages:0 "星核猟手の今回の行動もまた脚本の内にある。運命の悪い結末へと赴き、宇宙の流れを変え、強大な天災を克服し、宇宙に新たな生命をもたらすのだ。"
 civic_StellaronHunter_1:"運命の導き"
 civic_StellaronHunter_1_desc:"「運命の奴隷」エリオの脚本に従って特定の未来のノードを達成し、最終的に「良い結末」を得る。"
 civic_StellaronHunter_2:"光と影"
 civic_StellaronHunter_2_desc:"星核猟手と星穹列車の関係は、光と影のようなものである。"
 councilor_StellaronHunter_1:"脚本の実践者"
 councilor_StellaronHunter_1_desc:"エリオの脚本における重要な一環"
 councilor_StellaronHunter_2:"脚本の伝達者"
 councilor_StellaronHunter_2_desc:"エリオの脚本を伝達する責任者"
 #特性
 trait_StellaronHunter_pop_1:"グラモス残裔"
 trait_StellaronHunter_pop_1_desc:"サムを原型として、グラモスの生産ラインを再起動して製造された種族。未来への希望に満ち、結束力と貿易生産に高いボーナスを持つ。"
 trait_StellaronHunter_pop_2:"長寿の呪い"
 trait_StellaronHunter_pop_2_desc:"恐るべき自己治癒能力を持つが、彼らにとって長生は祝福ではなく、拭い去れない呪いである。長い寿命は彼らに未来への方向性を失わせ、生産にも熱心ではない。"
 trait_StellaronHunter_pop_3:"ハッカー才能"
 trait_StellaronHunter_pop_3_desc:"宇宙をゲームと見なし、卓越したハッキング才能を持ち、富者から奪って貧者を助けるハッキングを好む。惑星上の高度な生産を向上させるが、ハッキング技術の使用には大量のエネルギー貨を消費する。"
 trait_StellaronHunter_pop_4:"言霊術"
 trait_StellaronHunter_pop_4_desc:"言語による催眠能力を持ち、言霊を通じて惑星の幸福度と基礎生産を向上させることができる。"
 trait_StellaronHunter_pop_5:"グラモス兵器"
 trait_StellaronHunter_pop_5_desc:"グラモス帝国の女帝を原型として作られた遺伝子改造クローン戦士、すなわちグラモス鉄騎。これらの戦士は誕生時に「グラモス帝国」の防衛と女帝への忠誠を植え付けられた「思考鋼印」を持つ。非常に強力な戦闘能力を持つが、その反面、寿命は極めて短く、食料と消費財の消費も多い。"
 trait_StellaronHunter_pop_6:"悪魔の血脈"
 trait_StellaronHunter_pop_6_desc:"カフカの故郷である天衣五は星核に汚染され、住民は恐怖の概念を失い欲望に支配され、「悪魔」へと変貌した。"
 trait_StellaronHunter_pop_7:"伝説のハッカー"
 trait_StellaronHunter_pop_7_desc:"朋克洛德には今も伝説のハッカー、シルバーウルフの逸話が語り継がれており、現地の人々はこれらの影響を受けて強い結束力を持っている。"
 trait_StellaronHunter_pop_8:"炉火の錬成"
 trait_StellaronHunter_pop_8_desc:"刃によって手ほどきを受けた錬冶師たちは、高い錬冶の才能を持っている。"
