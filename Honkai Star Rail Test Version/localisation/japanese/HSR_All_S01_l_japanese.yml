 leader_busitu_t2_desc:""
 leader_busitu_t3:"§M宿怨、歯を食いしばって返す§!"
 leader_busitu_t3_desc:""
 leader_busitu_t4:"§M影肢§!"
 leader_busitu_t4_desc:""
 leader_busitu_t4_add:"§B積層技§!\n現在、各§G【婪酣】§!層はBUFF§G艦船兵器ダメージ+1%§!を提供する。\n現在の層数：[from.yuzhousuipian]"
