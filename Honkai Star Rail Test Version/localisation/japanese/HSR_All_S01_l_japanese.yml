 #状況
situation_cunhu_support_team: "§H琥珀王後援隊§!"
situation_cunhu_support_team_type: "§H琥珀王後援隊§!"
situation_cunhu_support_team_desc: "納期：§Y[owner.situation_cunhu_support_team_timer]§!\n[owner.Getcunhu_support_team_use]\n現在の生産目標：§Y[Owner.cunhu_support_team_once_again]§!\n現在の在庫：§Y[Owner.cunhu_support_team_current_amount]§!\n[Owner.Getcunhu_support_teamstatus]\n築材物流部は星間平和会社で最も歴史のある部門であり、その前身は「琥珀王後援隊」である。ルイスの台頭後に再編された。現部門長は太ったタラヴァン・キーン——会社で数少ない確認された「存護」の令使であり、七人取締役会の一員である。彼はクリフォーへの築材輸送という神聖な任務を担い、その地位はますます強固なものとなっている。当初は単なる物々交換だったが、この集団の中に商才のある者が現れるようになり、情報格差を利用して商品を値上げし、より多くの材料を購入するようになった。商売は拡大を続け、最終的に信用ポイントを発行し、星間平和会社を設立した。今日に至るまで彼らはクリフォーのもとに大量の材料を送り続けているが、彼がそれを使ったことは一度もない。\n§P「買い占め？その言葉は不快だ。私はそれを『高値を付ける者に売る』と呼ぶ。支払えないのは私の問題ではなく、君の問題だ。」§!"
situation_cunhu_support_team_stage_1:"残り月数"
situation_cunhu_support_team_outcome:"割り当てを達成すれば、大量の結束力収入を得られる。\n[Owner.Getcunhu_support_teamstatus]"
stage_cunhu_support_team_effects:"異なる世界の需要を利用し、必要な場所に物資を輸送する。"
