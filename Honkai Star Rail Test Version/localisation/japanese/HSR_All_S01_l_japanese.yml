 # "仙舟艦「帝弓友情」号"
 DOT_SR_Dvalin.009.name:"帝弓司命の贈り物：仙舟「岱輿」"
 DOT_SR_Dvalin.009.desc:"仙舟「岱輿」：孤航時代、視肉との戦闘で殉爆した仙舟。岱輿仙舟が粉々になり、もはや取り返しがつかないと悟った時、岱輿の指導者・青竹は即座に決断し、壮絶な犠牲をもって寿瘟の呪いの汚染を断ち切ると誓った。断艦は深海世界タラッサのイシュマ州自治区に墜落し、イシュマ州文明に啓示をもたらした。今、私は修復した仙舟「岱輿」を汝に贈る。この艦に乗り、長風を駆り、万里の星河を破らんことを！"
 DOT_SR_Dvalin.009.a:"了解"
 DOT_SR_Dvalin.009.b: "ありがとう"
