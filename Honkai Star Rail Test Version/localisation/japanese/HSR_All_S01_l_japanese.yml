 hundunlinyao:"混沌特効霊薬"
 hundunlinyao_desc_short:"一般奇物"
 hundunlinyao_desc_details:"混沌医師の無意味への抵抗精神は、常に非常に無意味であるように感じられる。彼らはかつて混沌特効霊薬に異問魔の牙、バヴィルの粘液、放浪する悪魔の血液を入れ、最後にテレパシー感知クモの額で瓶口を封じた。混沌医師はこの薬が患者の孤独の治療に奇効があると信じていたが、患者はしばしば服薬後に医師への敵意を強めた——その副作用は自滅者に「虚無の影」を見せることがしばしばあった。"
