 herta_herta_discuss_desc:"より先端分野に焦点を当てた高級研究室。飛昇後の各分野の研究を担当する。"
 herta_herta_discuss_1:"高効率自動化"
 herta_herta_discuss_1_desc:"この建築は自動的に大規模な補填と自己最適化を行う。"
