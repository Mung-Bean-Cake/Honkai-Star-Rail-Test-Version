 tr_cunhu_xuwu_1:"§B守墓人§!"
 tr_cunhu_xuwu_1_flavor:"銀色の護衛艦隊が、果てしない闇の中を巡航する。ホログラムのキャビンには、足下の蒼白い大地が映し出されている。そこには動作を停止したコンピュータクラスターがあり、麻痺した諸都市は苔で覆われている。あなたは廃墟の下に何が埋もれているのか知らない。ただ、自分がそれを守る使命を負っていることだけは知っている。あなたの種族の反逆者たちは罵りながら去っていく。彼らは広大な星間へと向かう。あなたも去りたい。しかし、仲間たちの非難の目に耐えられず、あなたが受けてきた教育、家族、脳内のチップに刻まれた原始的な論理を裏切ることができない。あなたは身体を剥ぎ取り、脳細胞を艦隊と一体化させる。ちょうどあなたを作り出した親族のように。あなたは永遠にその過去の死都を守り続けるだろう。しかし、もはや自問することはない——あなたは一体誰の墓を守っているのか。"
 tr_cunhu_xuwu_1_desc:"$EFFECTS_TXT$\n—『concept_cunhu_effect』の年間実践値成長：§G+0.5§!$TABBED_NEW_LINE$—『concept_xuwu_effect』の年間実践値成長：§G+1§!$TABBED_NEW_LINE$—帝国規模効果：§G-25%§!$TABBED_NEW_LINE$—法令経費：§G+25%§!$TABBED_NEW_LINE$—法令費用：§G-25%§!$TABBED_NEW_LINE$—暗号化：§G+3§!$TABBED_NEW_LINE$—[GetCrimeDeviancy]：§G-15%§!\n毎年、ランダムな軍事艦船に船体・装甲・シールドの修正を提供し、ランダムな指導者に100の経験値を与える。\n内閣ポストを解放：$councilor_cunhu_xuwu_1$"
