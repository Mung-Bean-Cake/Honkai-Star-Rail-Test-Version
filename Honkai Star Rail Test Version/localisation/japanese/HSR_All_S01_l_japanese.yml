 #ギャラガー
 NAME_jialahe:"ギャラガー"
 jialahe_catch_phrase:"五大家系の中で、「猟犬」は故郷を守る責務を担っている。つまり…すべてのトラブルメーカーは私が処理する。人を消すのは、人を出現させるよりもずっと簡単だ。"
 jialahe_backstory:"ピノコニー猟犬家系の保安官であり、だらしない風貌の気ままなバーテンダーでもある。服装は大雑把で、酒の調合も適当。来訪者には礼儀正しく接するが、警戒心を持っている。多くの過去を持っているようだが、自ら語ることはない。"
 hsr_paragon.41.name:"ピノコニー-ギャラガー"
 hsr_paragon.41.a:"初対面"
 hsr_paragon.41.a.response:"俺はギャラガー。ここの「猟犬」の一人だ。夢の地「ピノコニー」へようこそ、新米の無名客。"
 hsr_paragon.41.b:"趣味"
 hsr_paragon.41.b.response:"酒の調合は感性に関わる芸術だ。夢の中でソーダを調合するには、その時の気分を加える必要がある——憂鬱なら濃く、楽しいなら甘く…酒を調合することは、人生を調合することでもある。"
 hsr_paragon.41.c:"見聞"
 hsr_paragon.41.c.response:"もし狂ったティーポットや、這い回る電話ボックスを見たら——それは「ドリームジャグトループ」のいたずらに遭遇したのだろう。心配するな、死にはしない、せいぜい皮膚が一枚剥がれるくらいだ。"
 leader_jialahe_t1:"§M塩と犬§!"
 leader_jialahe_t1_desc:"どんなに時間が経っても、ソルダの味は常に安定している…それが添加物の魅力だ。"
 leader_jialahe_t2:"§M酒花の奔流§!"
 leader_jialahe_t2_desc:"美しい夢に深く溺れないように気をつけろ。"
 leader_jialahe_t3:"§M缶詰特調§!"
 leader_jialahe_t3_desc:"直感、本能…これらは訓練によって向上させることができる。"
 leader_jialahe_t4:"§M臨終の囁き§!"
 leader_jialahe_t4_desc:"言うまでもない、筋肉の記憶の方を信じている。"
 leader_jialahe_t5:"§M血と砂§!"
 leader_jialahe_t5_desc:"星々の間にまだ通路があった頃、この世界にも無名客の足跡があった。残念ながら、ピノコニーはその中の名前を一つも記録することができなかった。"
 hsr_ui.41.title:"指導者詳細-ギャラガー"
 hsr_ui.41.desc:"$jialahe_backstory$"
 hsr_ui.41.show:"$hsr_ui.41.a.desc$"
