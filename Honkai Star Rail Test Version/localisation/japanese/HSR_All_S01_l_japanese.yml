 #黒塔
 NAME_heita:"黒塔"
 heita_catch_phrase:"今日は私のところに来て一緒に研究しよう——君を研究するから。"
 heita_backstory:"宇宙ステーション「黒塔」の真の主人。湛藍星で最も知能の高い人間として、興味のあることだけを行い、興味を失えばすぐに去る——宇宙ステーションはその最たる例だ。普段は遠隔操作の人形で登場する：「子供の頃の私に比べれば、まあ七分似ってところだな。」——黒塔本人。"
 hsr_paragon.2.name:"天才クラブ-黒塔"
 hsr_paragon.2.a:"初対面"
 hsr_paragon.2.a.response:"私は黒塔だ。今忙しい。これは遠隔人形自動応答モードだ：こんにちは、こんにちは、皆さんこんにちは、素敵な一日をお過ごしください、さようなら。"
 hsr_paragon.2.b:"趣味"
 hsr_paragon.2.b.response:"問題を解かず、原稿も書かないなら、自分の人生がつまらなくても文句は言うなよ？"
 hsr_paragon.2.c:"見聞"
 hsr_paragon.2.c.response:"「静寂の主」は肖像画から目を消したが、それによって全ての人の注目を集めた。"
