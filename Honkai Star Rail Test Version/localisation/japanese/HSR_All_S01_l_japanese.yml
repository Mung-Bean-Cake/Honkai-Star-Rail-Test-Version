 NAME_alan:"アーラン"
 alan_catch_phrase:"「みんなを守るために傷つくことは、本来誇るべきことだ。」"
 alan_backstory:"無口な宇宙ステーション「黒塔」の防衛科責任者。研究は分からないが、大切な研究を守るために命を懸けることができるステーションの研究員たちを守るために、アーランは命を懸ける。彼は痛みに慣れており、負傷を勲章と見なしている。ペペと一緒にいる時だけ、少年は警戒を解き、めったに見せない笑顔を見せる。"
 hsr_paragon.4.name:"宇宙ステーション「黒塔」-アーラン"
 hsr_paragon.4.a:"初対面"
 hsr_paragon.4.a.response:"こんにちは、開拓者。私は宇宙ステーション「黒塔」の防衛科責任者、アーランだ。ステーションにいる間は、全力で君の安全を守る。"
 hsr_paragon.4.b:"趣味"
 hsr_paragon.4.b.response:"大剣は常に清潔に保たなければならない。"
 hsr_paragon.4.c:"見聞"
 hsr_paragon.4.c.response:"研究員の話では、ある奇物は自ら進んで宇宙ステーションに来たがっているらしい。"
 leader_alan_t1:"§M封印解除§!"
 leader_alan_t1_desc:"叶えてやる。"
 leader_alan_t2:"§M狂者の制裁§!"
 leader_alan_t2_desc:"お前たちは、千倍の苦しみを味わう！\n$leader_alan_t2_effect_desc$"
 leader_alan_t2_effect_desc:"§B有効レベルごとに1%のシールド値、装甲値、船体値\n宇宙戦に入ると、自身の§R20%§!の船体値を損失し、大きなダメージ増幅と回復能力を得る。持続§R20§!日、クールダウン§R60§!日§!"
 leader_alan_t3:"§M至痛至怒§!"
 leader_alan_t3_desc:"皆、黙れ。\n$leader_alan_t3_effect_desc$"
 leader_alan_t3_effect_desc:"§B宇宙戦に入ると、敵艦隊に追加で巨大なシールドダメージと20%の船体値ダメージを与える§!"
