#陸軍
 belobog_blocker_1_army_1:0 "裂界怪物群（小）"
 belobog_blocker_1_army_1_desc:0 "これらの裂界怪物の群れは小型の怪物で構成されており、脅威は比較的小さい。"
 belobog_blocker_1_army_2:0 "裂界怪物群（中）"
 belobog_blocker_1_army_2_desc:0 "これらの裂界怪物の群れは主に中小型の怪物で構成されており、脅威は中程度である。"
 belobog_blocker_1_army_3:0 "裂界怪物群（大）"
 belobog_blocker_1_army_3_desc:0 "これらの裂界怪物の群れは様々な怪物が混在して構成されており、対処が難しい大型ユニットも多く含まれており、脅威は極めて大きい。"
 belobog_blocker_1_army_4:0 "徘徊する裂界怪物"
 belobog_blocker_1_army_4_desc:0 "目標地への行軍中に路上で発見された裂界怪物。ほとんど脅威にはならないが、完全に掃討することは難しい。"
 tiewei_guardian:0 "銀鬃鉄衛"
 tiewei_guardian_desc:0 "$job_tiwei_soldier$は治安と平和を守る堅実な力である。"
 tiewei_guardian_defensive:0 "$tiewei_guardian$"
