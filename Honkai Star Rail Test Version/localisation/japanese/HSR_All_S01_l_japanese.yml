 building_Defence_Barrier:0"惑星存護機関"
 building_Defence_Barrier_desc:0"会社の最終目的を達成する時が来た。我々はこの美しい惑星を守る。"
 building_Agri_Fac:0"平和食品工場"
 building_Agri_Fac_desc:0""
 building_Mine_Fac:0"銀河採掘施設"
 building_Mine_Fac_desc:0""
 building_Energy_Fac:0"星間エネルギーネットワーク"
 building_Energy_Fac_desc:0""
 building_Energy_Fac:0"銀河メディアプラットフォーム"
 building_Energy_Fac_desc:0""
 building_Labour_Dispatch:0"労働派遣機関"
 building_Labour_Dispatch_desc:0"§M「一人の就業者が存護の道に貢献する度合いは、九十九人の失業者よりも大きい。」——ウッドソン・ヘルス\n§!クリフォーの存護の道から、我々は新たな信条を導き出した：あらゆる文明の大部分が仕事を持つことは、存護の目標を達成するための基盤であり、それは存護の目的であると同時に手段でもある。\n我々は、失業は落胆、絶望、不安定、需要の低下、業績の低下をもたらし、直接的または間接的に「存護」を損なうと考える。そのため、我々は銀河系のすべての人に仕事を提供する事業に身を投じる。\n§gもちろん、主に我々のために。§!"
 building_Housing_Corp:0"住宅建設計画"
 building_Housing_Corp_desc:0"「すべての人に雨風をしのぐ家を——それも存護の一種である。」——ジーン・グンヒルド\n§!広大な銀河には、住む場所さえない生命が常に存在する。それが我々のビジネスチャンスであり、存護の道を実践する絶好の手段でもある。遠い異星で、家のない人々は我々の商標を見て、手頃な価格の住宅に感嘆し、この素晴らしい商品にお金を払うだろう。\n§g時にはマイナスの金額で。§!"
 building_Amenity_Corp:0"グローバルエンターテイメントグループ"
 building_Amenity_Corp_desc:0"§M「星間平和、夢を叶える！」——ピースランドの広告コピー§!\n\n§!星間時代になっても、消費主義は至る所に蔓延している——広告や映画は、お金を払えば楽しさを得られると言うが、実際にはお金を払って苦しみを買うことが多い。しかし我々は違う。\n我々は全力を尽くし、期待と疲れを持った顧客に喜びと驚きをもたらし、翌日の仕事に活力を取り戻せるようにし、お金を持って来たすべての人が楽しみを買えるようにする。これも存護のためだ。存護のための資金調達のためだけでなく、子供たちの夢、そして大人たちの夢を存護するためでもある。\n§g一部の成人男性が子供よりも我々の施設を好むことに気づいている。§!"

