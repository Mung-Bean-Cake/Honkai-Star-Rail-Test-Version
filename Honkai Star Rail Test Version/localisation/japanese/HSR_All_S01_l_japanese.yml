 tech_seal_star_core_desc:"現在、星核を破壊する既知の方法はない。せいぜいそのエネルギーを制御し、その害を減らすことしかできない。"
 pc_shielded_white: "§B微小星核§!"
 pc_shielded_white_desc: "この星核のエネルギーは全体的に比較的小さく、エネルギーの干渉も強くないため、容易に捕捉して封印することができる。"
 pc_shielded_white_DESC:"この星核のエネルギーは全体的に比較的小さく、エネルギーの干渉も強くないため、容易に捕捉して封印することができる。\n$xinghe_test_chain_desc$"
 pc_shielded_yellow: "§M中型星核§!"
 pc_shielded_yellow_desc: "この星核のエネルギーは全体的に比較的強く、発生した星系嵐が星系内の艦船の正常な航行を妨害しているため、注意が必要である。"
 pc_shielded_yellow_DESC:"この星核のエネルギーは全体的に比較的強く、発生した星系嵐が星系内の艦船の正常な航行を妨害しているため、注意が必要である。\n$xinghe_test_chain_desc$"
 pc_shielded_red: "§R活性星核§!"
 pc_shielded_red_desc: "この星核のエネルギーは非常に強く、発生した星系嵐が星系内の艦船の正常な航行を深刻に妨害しており、発生する嵐は非常に危険であるため、この星系を航行するすべての艦船は注意を要する。"
 pc_shielded_red_DESC:"この星核のエネルギーは非常に強く、発生した星系嵐が星系内の艦船の正常な航行を深刻に妨害しており、発生する嵐は非常に危険であるため、この星系を航行するすべての艦船は注意を要する。\n$xinghe_test_chain_desc$"
 MESSAGE_MONIYUZHOU_BATTLE_XINGHE_TITLE:"§R星核を発見！§!"
 MESSAGE_MONIYUZHOU_BATTLE_XINGHE_DESC:"我々の艦船が星核を発見した。この現象は非常に侵略的であり、隣接する世界を侵食し続ける——まるで癌細胞が宇宙の至る所に拡散するように。"
 xinghe_small_storm: "§3星核嵐§!"
 xinghe_small_storm_desc: "琥珀紀2147年から出現し始めた神秘的な現象。「開拓」が生み出した星間航路上で、不透明な物質が虚数エネルギーの流れを乱している。それは山登りで断崖に直面し、航海で大渦に遭遇するようなものだ——かつては順調だった星間の旅が危険に満ち、先行き不透明になる。この現象は非常に侵略的であり、神秘的な物体「星核」の形で隣接する世界を侵食し続ける——まるで癌細胞が宇宙の至る所に拡散するように。"
 xinghe_small_storm_color_tooltip: "§3星核嵐§!"
 xinghe_small_storm_lore_description:"§L強力な星核嵐がこの星系を通過しようとしており、この惑星や通過する艦船に深刻な影響を及ぼす可能性がある。避難所を求めることを推奨する。§!"
 xinghe_small_storm_fleet_tt:"—亜光速速度：§R-25%§!\n—探知範囲：§R-5§!\n—艦船超空間航路探知範囲：§R-5§!\n—$MOD_SHIP_SHIELD_REGEN_ADD_PERC$艦船と宇宙ステーションに対して§R無効§!。\n—艦船と宇宙ステーションは毎月§R50§!の$MOD_SHIP_SHIELD_ADD$ダメージを受ける。"
 xinghe_small_storm_aftermath_modifier_tooltip:""
 xinghe_big_storm: "§R壊滅星核嵐§!"
 xinghe_big_storm_desc: "琥珀紀2147年から出現し始めた神秘的な現象。「開拓」が生み出した星間航路上で、不透明な物質が虚数エネルギーの流れを乱している。それは山登りで断崖に直面し、航海で大渦に遭遇するようなものだ——かつては順調だった星間の旅が危険に満ち、先行き不透明になる。この現象は非常に侵略的であり、神秘的な物体「星核」の形で隣接する世界を侵食し続ける——まるで癌細胞が宇宙の至る所に拡散するように。"
 xinghe_big_storm_color_tooltip: "§R壊滅星核嵐§!"
 xinghe_big_storm_lore_description:"§L強力な星核嵐がこの星系を通過しようとしており、この惑星や通過する艦船に深刻な影響を及ぼす可能性がある。この嵐は一般的な星核嵐よりもはるかに強力であるため、避難所を求めることを推奨する。§!"
 xinghe_big_storm_fleet_tt:"—亜光速速度：§R-25%§!\n—探知範囲：§R-5§!\n—艦船超空間航路探知範囲：§R-5§!\n—ワープエンジン範囲：§R-25%§!\n—ワープエンジンクールダウン：§R-25%§!\n—隠蔽強度：§R-5§!\n—回避確率：§R-25%§!\n—行方不明期間：§R+25%§!\n—艦船兵器ダメージ：§R-25%§!\n—艦船兵器射速：§R-25%§!\n—艦船維持費：§R+25%§!\n—毎日のシールド、装甲、船体再生が艦船と宇宙ステーションに対して§R無効§!。\n—艦船と宇宙ステーションは毎月§R50§!のシールドダメージを受ける。"
 xinghe_big_storm_aftermath_modifier_tooltip:""
 decision_seal_star_core:"§Y封印§!§R星核§!"
 decision_seal_star_core_desc:"星核は銀河の生物にとって災いである。破壊する方法はないが、封印して内部のエネルギーを制御し、その害を減らすことができる。"
 decision_seal_star_core_tt:"星核を封印し、大量の研究ポイントを獲得する。星核の種類によって封印後に異なるイベントが発生する。星核が§R活性であるほど§!、§R悪いイベント§!が発生しやすくなる。§R適切に処理しない場合、10年ごとに星核のレベルが上昇し、星核エネルギー体が生成される§!"
 xinghe_small_modifier:"封印された§B微小星核§!"
 xinghe_small_modifier_desc:"この星核のエネルギーは一般的なため、その影響を比較的容易に抑えることができる。"
 xinghe_medium_modifier:"封印された§M中型星核§!"
 xinghe_medium_modifier_desc:"この力を抑え込んではいるが、封印場所に軽々しく近づかないよう人々に注意を促す必要がある。"
 xinghe_large_modifier:"封印された§R活性星核§!"
 xinghe_large_modifier_desc:"制御が極めて困難！観察・記録のための人員を配置しなければならない！"
 xinghe_small_modifier_1:"沈静化した§B微小星核§!"
 xinghe_small_modifier_1_desc:"この星核の悪影響は可能な限り最小限に抑えられている。"
 xinghe_medium_modifier_1:"沈静化した§M中型星核§!"
 xinghe_medium_modifier_1_desc:"この星核の悪影響は可能な限り最小限に抑えられている。"
 xinghe_large_modifier_1:"沈静化した§R活性星核§!"
 xinghe_large_modifier_1_desc:"この星核の悪影響は可能な限り最小限に抑えられている。"
 xinghe_cleaning_modifier:"処理遮蔽"
 xinghe_cleaning_modifier_desc:"星核と外界との接続を一時的に遮断することができる。"
 decision_seal_star_core_reuse:"裂界の探索"
 decision_seal_star_core_reuse_desc:"星核封印後、裂界が生じる。探索することで二次的な被害を軽減できる。"
 decision_seal_star_core_reuse_tt:"封印された星核の修正効果を軽減し、裂界憶質イベントを一度発生させる。"
 edict_xinghe_edict: "国内星核スキャン"
 edict_xinghe_edict_desc:"我々のセンサーは毎月、国内の星核の最新状況を報告する。"
 #イベント
 xinghe.11.title:"星核発見"
 xinghe.11.desc:"我々の艦船が星核を発見した。琥珀紀2147年から出現し始めたこの神秘的な現象は、我々の正常な星間航行を妨害し続けている。我々のトップ科学者たちはこの現象に注目し、現時点ではこの災いを根絶する能力はないものの、既存の技術で封印し、外部への危害を軽減できると考えている。関連する技術実現方法の研究開発はすでに開始されている。"
 xinghe.11.a:"どうやら大きな問題に直面したようだ..."
 xinghe.101.title:"新世界"
 xinghe.101.desc:"我々の科学者たちは遠隔操作装置によって星核の封印に成功した。惑星外部の虚数エネルギー層が後退した後、我々は居住可能な新世界を目にした。この惑星には現時点では高度な知的生命体の痕跡は発見されておらず、封印後の星核の落下地点を長期的に監視するための無人設備を配置する必要がある。"
 xinghe.101.a:"よくやった"
 xinghe.111.title:"古戦場"
 xinghe.111.desc:"星核を封印し、この惑星を観測したところ、かつてここに知的生命が存在していたことが判明した。彼らは高度な文明を持っていた可能性があるが、星核の到来によってすべてが無に帰した。惑星表面には大小のクレーターが観測され、彼らがかつて星核によって生じた裂界と戦闘を行ったことを示している。"
 xinghe.111.a:"なんてことだ..."
 xinghe.121.title:"生存者"
 xinghe.121.desc:"我々の封印装置が遭難信号を受信した！直ちに地上探索部隊が惑星表面に派遣され、信号源を探した。堅固な地下施設の地上観測所で信号源を発見した。地質分析とスキャンの結果、地下都市の存在とその入口が確認された。我々が都市の入口を開け、生存者とコミュニケーションを取った後、彼らは防衛設備を解除し、我々を地下都市に招待した。そこには、古代の核戦争で生き残った何百万人もの生存者がいた。資源は乏しいものの、彼らは自給自足のコミュニティを確立し、数世紀にわたって維持してきた。最初は我々の科学者に警戒心を持っていたが、彼らが初めて出会ったエイリアンであり、門を開けてくれたことに感謝していた。避難所には核災害後の文明再建のための装備や器材が大量に保管されており、それらを操作できるのは彼らだけだったが、彼らは日光に適応した後、我々の植民地に加わりたいようだった。"
 xinghe.121.a:"この惑星を共に再建しよう！"
 xinghe.121.b:"我々は君たちの主権を尊重する！"
 xinghe.121.c:"残念だが、君たちの望みは叶わない……"
 xinghe.131.title:"ナノマシン惑星"
 xinghe.131.desc:"ナノマシン惑星、特に目立った特徴はない。しかし、我々の封印装置は惑星表面から奇妙な微弱なエネルギー信号を常に受信している。原因は不明である。"
 xinghe.131.a:"故障か？"
 xinghe.141.title:"廃棄艦船"
 xinghe.141.desc:"目標惑星の同期軌道上に、いくつかの廃棄された艦船を発見した。それらがどの勢力に属するかは不明である。しかし、まだ起動可能であり、修理すれば正常に作戦できることが分かった。"
 xinghe.141.a:"面白い"
 xinghe.150_title:"奇物"
 xinghe.150_desc:"我々の探知機が[This.GetName]で『concept_curiosity』を発見した。適切な機会に、我々はこれらの奇物を回収した。"
 xinghe.160_title:"エネルギーの捕獲"
 xinghe.160_desc:"[This.GetName]の星核を封印する際、我々のエネルギー捕獲装置が予期せず星核爆発のエネルギーを捕獲した。このエネルギーは大量の電力に変換され、我々の利用に供された。"
 xinghe.170_title:"星界裂孔"
 xinghe.170_desc:"虚数障壁を突破した後、内部に星界裂孔があることが判明した。どうやらここでの空間は異変を起こし始めているようだ。注意が必要である。"
 xinghe.180_title:"ワームホール"
 xinghe.180_desc:"我々の前にワームホールが現れた。生成原因と行き先は不明である。もしかすると、内部に侵入して調査してみる価値があるかもしれない？"
 xinghe.200_title:"裂界憶質-三匹の子豚"
 xinghe.200_desc:"あなたはシスラダーン部族の荒野を歩いている。三匹の豚のような臆病なシーケンス生物があなたに出くわした。それぞれ反応が異なる：一匹は震え、一匹は逃げようとし、一匹は戦闘態勢を取る。あなたは星間平和ガイドの記述を思い出す：彼らの名前は「シーケンストロッター」、異次元生物で、一生のほとんどの時間を食事と逃走に費やす。「シーケンストロッター」との遭遇は吉兆とされる。あなたはどう対応するか考える：遊びのルールは、各トロッターの性格に合わせてカスタマイズしなければならない。"
 xinghe.200.a:"あなたは優れたトロッター保護意識を伝えた。"
 xinghe.200.a.tt:"§G5§!の『concept_cunhu_effect』実践値を獲得"
 xinghe.200.b:"優れたトロッター捕獲テクニック…スピードが重要だ！"
 xinghe.200.b.tt:"§G5§!の『concept_xunlie_effect』実践値を獲得"
 xinghe.200.c:"シーケンストロッターと遊ぶ。"
 xinghe.200.c.tt:"ランダムな三つの『concept_path_effect』の§G2§!実践値を獲得"
 xinghe.200.d:"立ち去る。"
 xinghe.200.d.tt:"トロッターと議論すべきではない！"
 xinghe.201_title:"裂界憶質-果てしない闇"
 xinghe.201_desc:"ここはどこだ？…あなたはつぶやく。あなたは果てしない闇に落ちた。光はなく、方向も見失う。神秘的なうなり声が耳に響き、巨大な引力があなたを引きずる。あなたの精神力は異常に怠惰になる。周囲の気流には実体がなく、筋肉は弛緩し、まぶたは垂れ下がる…"
 xinghe.201.a:"闇へ向かう。"
 xinghe.201.b:"引力に逆らう。"
 xinghe.201.c:"あなたは*それに身を委ねる*こともできる。"
 xinghe.201.c.tt:"ランダムな二つの『concept_path_effect』の§G1§!実践値を獲得"
 xinghe.202_title:"裂界憶質-ジェム・ハックとジェム・ハル"
 xinghe.202_desc:"あなたは果てしない廃墟にいる。視界は廃棄されたコンテナで遮られている。濃い煙が立ち込め、廃棄されたロボットがばらばらに分解されている。その胴体には「星間平和会社」の印があり、頭部は足元にあり、もはや知性はない。この時、背後にあるゴミの山からカサカサという音が聞こえる。何かがあなたを見つめている——振り返ると、箱の後ろに隠れているロボットを見つける。近づくと、ロボットのケーブルが切断され、動けなくなっているのが分かる。「我々は『琥珀王後援隊』と呼ばれていた。タラヴァン・キーンが我々を作り、使い、そして最終的に捨てた。」ロボットは必死に守ってきた品物をあなたに見せる。「ジェム・ハックは371029秒前に動作を停止した。ジェム・ハルは74158秒後に動作を停止する。兄の品物をこれ以上保管することはできない。どうか一つだけ持って行ってほしい。」"
 xinghe.202.a:"ジェム・ハックの収蔵品。"
 xinghe.202.a.tt:"ランダムな『concept_path_effect』の§G2§!実践値を獲得"
 xinghe.202.b:"立ち去る。"
 xinghe.202.b.tt:"100の『concept_yuzhousuipian』を獲得"
 xinghe.202.c:"代償を払って…それを動かし続ける。"
 xinghe.202.c.tt:"『concept_fengrao_effect』の§G4§!実践値を獲得"
 xinghe.202.d:"ジェム・ハックの遺体を保存する。"
 xinghe.202.d.tt:"$hundunlinyao$、100の『concept_yuzhousuipian』を獲得"
 xinghe.203_title:"裂界憶質-スティーブン・ロイドのアイデア"
 xinghe.203_desc:"あなたは一人の男性を見かける。三十歳くらいで、風貌は平凡、白いシャツに茶色のオーバーオールを着ている。話し始めると、彼の視線はあちこちに泳ぎ、まるで避けているようだ：「えーと、このゲームにランダムイベントをいくつか追加しようと思ったんだ。面白いだろうと思ってね…でも、どうやら脳波リーダーの安定性に少し問題があるみたいだ。だから、えーと、今君が遭遇するイベントは、えーと、少し単調だ。すまない。」「例えば、」男性はあなたを見ずに、つっかえながら言う、「えーと、これはランダムイベントだ。いくつかテンプレートを書いたんだけど、『模擬宇宙』が今それを有効なコンテンツに変換できないんだ。だから君はこれを見ることになる……」そう言うと、男性の姿は消え、彼が立っていた場所に一行の文字が現れる：あなたはランダムイベントに遭遇した。"
 xinghe.203.a:"いくつか初期資金をくれ。"
 xinghe.203.a.tt:"150の『concept_yuzhousuipian』を獲得"
 xinghe.203.b:"良いものをくれ。"
 xinghe.203.b.tt:"ランダムな『concept_path_effect』の§G3§!実践値を獲得"
 xinghe.203.c:"何もしない。"
 xinghe.204_title:"裂界憶質-遊牧鉱夫"
 xinghe.204_desc:"今は夕暮れ時、あなたは熱気の中に立っている。鉱山の景色はあなたを眩暈させる。鉱脈は溶けたバターのように燃えている。「偉大なる存護の星神クリフォー…彼は我々の声を聞くことができる。」鉱夫たちはツルハシを振り上げては打ち下ろす。彼らは狂信的な動物のように、信者のように見える。誰かがあなたに気づいた——探知灯を装着した*一番鉱夫*だ。彼の腕は黒々として力強く、唇も同じように黒い。彼の豪快な笑顔は忘れがたい。彼は金の歯を一本入れていて、それがあなたの頭の中で拡大し、歪み続け、最後には彼の*笑顔*だけが見える——唇と目が混ざり合い、パレットの絵の具のように溶け合っている。「琥珀王の恩恵、『クリフォー』はこの地脈を存護している。一つ持って行け。」"
 xinghe.204.a:"クリフォーの恩恵。"
 xinghe.204.a.tt:"ランダムな二つの『concept_path_effect』の§G1§!実践値を獲得"
 xinghe.204.b:"クリフォーの祝福。"
 xinghe.204.b.tt:"ランダムな『concept_path_effect』の§G2§!実践値を獲得"
 xinghe.204.c:"琥珀王に捧げる。"
 xinghe.204.c.tt:"『concept_cunhu_effect』の§G3§!実践値を獲得"
 xinghe.204.d:"*一番鉱夫*と戦って、良いものを奪え！"
 xinghe.204.d.tt:"『concept_huimie_effect』の§G3§!実践値を獲得"
 xinghe.205_title:"裂界憶質-エラーアイテム"
 xinghe.205_desc:"⌈ちょっとしたトラブルがあったけど、大した問題じゃない。⌋突然黒塔の声が聞こえるが、声の出所は分からない。⌈システム内の球状コードの一部がエントロピー増大を起こしたんだ、よくあることさ。⌋⌈それらはとても混沌としているから、そのコードの塊を奇物に詰め込んだんだ。⌋黒塔は言う。⌈それを持っていけ、しばらく君の行動記録にずれが生じるが、すぐに修正する。⌋"
 xinghe.205.a:"エラーコードの奇物を選択する。"
 xinghe.205.a.tt:"ランダムな『concept_path_effect』の§G1§!実践値を失い、『concept_random_common_curiosity_get』を獲得する。"
 xinghe.205.b:"立ち去る。"
 xinghe.205.c:"エントロピー増大をさらに激しくする！"
 xinghe.205.c.tt:"ランダムな二つの『concept_path_effect』の§G1§!実践値を失い、二つの『concept_random_common_curiosity_get』を獲得する。"
 xinghe.205.d:"「正しいアイテム」のコードを思い出す。"
 xinghe.205.d.tt:"『concept_random_common_curiosity_get』を獲得する。"
 xinghe.206_title:"裂界憶質-エラーアイテム"
 xinghe.206_desc:"あなたは再帰方程式によってシミュレートされた自然プログラムに足を踏み入れる。地面に黒い箱が置かれている。開けると、一人の医者がホログラムで現れる——彼の腰椎より下は蛇の形をしている。彼は蛇の尾を動かし、濃い緑の鱗が擦れて金属のような光沢を反射する。「シーッ——」彼は口を開き、連覚ビーコンが作動し、あなたは徐々に半蛇人の言葉を理解する。「天戈星は62光年先で『嵐』の光矢によって破壊された。黒塔はその出来事を観測し、模擬宇宙の中で私の精神体を育成した。」彼は手のひらに火種を捧げる。「私の存在は虚無である…私はブラックボックスを終了する権限を持っていない。防御を乗り越えようとしたが、この自己消火する火種をブラックボックスの外に送り出すことしかできなかった。それを受け取り、私の信念を実行してほしい。」"
 xinghe.206.a:"「自滅」の火種を受け入れ、ブラックボックスを破壊する。"
 xinghe.206.a.tt:"150の『concept_yuzhousuipian』を失い、ランダムな『concept_path_effect』の§G4§!実践値を獲得"
 xinghe.206.b:"拒否する。"
 xinghe.206.b.tt:"100の『concept_yuzhousuipian』を獲得"
 xinghe.206.c:"急いでブラックボックスを終了させ、彼を救出する。"
 xinghe.206.c.tt:"『concept_xunlie_effect』の§G4§!実践値を獲得"
 xinghe.206.d:"君は*この信念を強化する*こともできる。"
 xinghe.206.d.tt:"150の『concept_yuzhousuipian』を失い、ランダムな四つの『concept_path_effect』の§G1§!実践値を獲得"
 xinghe.207_title:"裂界憶質-インタラクティブアート"
 xinghe.207_desc:"あなたは「シグマ星系合同劇場」の5番ホールにいる。あなたは自分が、華やかな服装の紳士淑女たちの中に座っているのが信じられない。あなたは赤いベルベットの幕の向こうの公演を楽しみにしている。あなたは考える、おそらくそれはサルソットオペラ団の宇宙姫で、そのスカートは舞台全体を覆うほど広いかもしれない。あるいはジャコバン数理院の老骨たちが最も好む科学装置公演で、人工知能「プラント・エキスパートシステム」が演劇的なプロットを計算するかもしれない。あるいはもっと壮大に、シグマ聖女のアンプラグド伴奏、その永遠の「聖女」は黄金比の男性であり、太陽を掲げる逞しい姿で知られている。すぐに公演が始まる——舞台には青色の粘性のある肌の女性が立っている。彼女は手を上げ、歌い始める——それは合成されたカラフラである。あなたは胸を張り、固まった筋肉を動かそうとするが、動けないことに気づく——脇腹に冷たい感触がする。そう…確かに…あなたは銃口を突きつけられている。「我々はプログラムを変更した。『アキヴィリ』の時代は終わり、クラシックアートは死んだ。今日は誰もがアクション映画を好む。選択を教えろ。」男性の声が聞こえる。ええと、そうではない。」男性の声はやや困惑しており、彼は唇を舐めた。「つまり、ミュージカルとアクション映画、どっちが好きかってことだ。」"
 xinghe.207.a:"ミュージカル。"
 xinghe.207.a.tt:"『concept_huanyu_effect』の§G4§!実践値を獲得"
 xinghe.207.b:"アクション映画。"
 xinghe.207.b.tt:"『concept_xunlie_effect』の§G4§!実践値を獲得"
 xinghe.207.c:"命だけは助けてください。"
 xinghe.207.d:"「瞬間」の秘密の映像を観る。"
 xinghe.207.d.tt:"『concept_xunlie_effect』の§G6§!実践値を獲得"
 xinghe.207.e:"「生命」の秘密の映像を観る。"
 xinghe.207.e.tt:"『concept_fengrao_effect』の§G6§!実践値を獲得"
 xinghe.207.f:"秘密の「映像」を観る。"
 xinghe.207.f.tt:"『concept_zhishi_effect』の§G6§!実践値を獲得"
 xinghe.208_title:"裂界憶質-社会的夢"
 xinghe.208_desc:"あなたはピアポイントで最も可愛いキリロ魚介レストランに入る——巨大な魚の目玉の泡で構成されている。湾曲したガラス越しに亜空障壁が見える。あなたは午後の心地よい日差しを楽しむ、自分だけの時間だ。すべての客は超音波魚波の脳マッサージに没頭している。あなたは皿の上の*魚の目玉*を一口で飲み込み、社会的夢の到来を感じる——ピアポイントは夜明けの発展期を迎え、空から星間通貨の雨が定期的に降り、あなたは会社が発行した債券を握りしめ、幸福は増大している。あなたの胃粘膜が魚の目玉を消費し、夢から覚める。出勤時間が過ぎていることに気づく。しかし、あなたはまだ去りたくない…"
 xinghe.208.a:"別の*魚の目玉*を飲み込み、マッサージを続ける。"
 xinghe.208.a.tt:"300の『concept_yuzhousuipian』を獲得し、ランダムな『concept_path_effect』の§G3§!実践値を失う"
 xinghe.208.b:"仕事に戻る。"
 xinghe.208.b.tt:"100の『concept_yuzhousuipian』を獲得"
 xinghe.208.c:"もっと魚の目玉を捕獲する…"
 xinghe.208.c.tt:"500の『concept_yuzhousuipian』を獲得し、ランダムな二つの『concept_path_effect』の§G3§!実践値を失う"
 xinghe.208.d:"永遠に仕事をしない！永遠に…"
 xinghe.208.d.tt:"『concept_xuwu_effect』の§G3§!実践値を獲得"
 xinghe.208.e:"あなたに連絡できる*仕事用通信機*を壊す！"
 xinghe.208.e.tt:"400の『concept_yuzhousuipian』を獲得し、ランダムな『concept_path_effect』の§G1§!実践値を失う"
 xinghe.209_title:"裂界憶質-焚化師"
 xinghe.209_desc:"この洞窟は非常に静かで、空中で跳ねる蟲の群れはカラフルな星のようだ。一人の女性が洞窟の中で眠っており、足元にはノブレス蟲が這い、彼女の肌は*灰色の物質*のように色を失っている。彼女が目を開け、あなたを見ると、一瞬でカラフルな炎が彼女の周囲に燃え上がる。火は壁に沿って広がり、すぐにあなたの足元に達し、あなたは一瞬で炎に包まれる。無数の記憶があなたの脳内に溢れ、精神が過熱し始める。あなたは指で数を数え始めた最初の午後、宇宙アリが整列して歩くのを初めて見た日を思い出す——なぜこれらを覚えているのか？「このゴミを記憶しているからこそ、自分が生きていると感じるのだ。」彼女の鼻息が聞こえる。「浮黎を信じれば、お前の色あせた記憶を燃やしてやる。」彼女は言う。"
 xinghe.209.a:"すべてを「彼」に捧げる。"
 xinghe.209.a.tt:"ランダムな『concept_path_effect』の§G1§!実践値を失い、ランダムな『concept_path_effect』の§G3§!実践値を獲得"
 xinghe.209.b:"10カラットのゴミに耐える。"
 xinghe.209.b.tt:"80の『concept_yuzhousuipian』を獲得"
 xinghe.209.c:"忘れたい「記憶」を燃やす。"
 xinghe.209.c.tt:"『concept_xuwu_effect』の§G3§!実践値を獲得"
 xinghe.209.d:"「記憶」の星神を信じる。"
 xinghe.209.d.tt:"『concept_jiyi_effect』の§G3§!実践値を獲得"
 xinghe.209.e:"すべての色あせた「記憶」を忘れる。"
 xinghe.209.e.tt:"『concept_jiyi_effect』の§G100§!実践値を失い、20回にわたってランダムな『concept_path_effect』の§G5§!実践値を獲得"
 xinghe.210_title:"裂界憶質-賞金稼ぎ"
 xinghe.210_desc:"あなたは雪原を歩き、暖かい毛皮を身にまとっている。一人の男性に出会う——赤い髪とそばかす、背が高く細身で、子牛革のブーツを履き、ライフルを担いでいる。彼は球形の建物を指さす。「星間平和会社の製薬会社がスノードランドで生物材料を狩猟し、貴重な医薬品を製造しており、多くの賞金稼ぎを募集している。」「秘密情報、S級募集——雪原の深奥のヤク、高額報酬。ここはとても寒い、君の毛皮を借りてもいいか？」あなたは彼の胸の*スノードランド動物保護協会*のバッジに気づく…"
 xinghe.210.a:"身に着けている毛皮を彼に渡す。"
 xinghe.210.a.tt:"200の『concept_yuzhousuipian』を獲得"
 xinghe.210.b:"立ち去る。"
 xinghe.210.b.tt:"80の『concept_yuzhousuipian』を獲得"
 xinghe.210.c:"彼の*子牛革のブーツ*を安く買い叩く！"
 xinghe.210.c.tt:"50の『concept_yuzhousuipian』を獲得し、『concept_random_common_curiosity_get』を獲得する。"
 xinghe.210.d:"彼のバッジを引きちぎる！"
 xinghe.210.d.tt:"『concept_xunlie_effect』の§G3§!実践値を獲得"
 xinghe.210.e:"彼からより多くの*情報*を引き出す。"
 xinghe.210.e.tt:"四つの『concept_random_common_curiosity_get』を獲得"
 xinghe.211_title:"裂界憶質-ニルディスカード"
 xinghe.211_desc:"あなたはカードテーブルに座っている。片目のディーラーの金属製の脚がニルディスカードテーブルの脚に絡み合い、彼の胴体はテーブルの中央の穴に直立し、球体が彼の腰の周りを回っている。彼は眼球を回してあなたを見つめ、紳士的に一礼する。そしてディーラーは10本の機械腕でチップを配り、優雅にカードをシャッフルする。「一定の確率で、君は世界で最も美しい記憶をめくることになるだろう。」ディーラーはあなたの前に一連のカードを配る。「あるいは、誰にも知られてはならない秘密をめくるかもしれない。運が悪ければ、結果は危険なものになるだろう。」"
 xinghe.211.a:"カードをめくる。"
 xinghe.211.a.tt:"25％の確率でランダムな『concept_path_effect』の§G2§!実践値を獲得"
 xinghe.211.b:"諦める。"
 xinghe.211.b.tt:"80の『concept_yuzhousuipian』を獲得"
 xinghe.211.c:"はは、テーブルをひっくり返せ！"
 xinghe.211.c.tt:"ランダムな二つの『concept_path_effect』の§G2§!実践値を獲得"
 xinghe.211.d:"過去の「カードプレイの経験」を思い出す。"
 xinghe.211.d.tt:"『concept_jiyi_effect』の§G3§!実践値を獲得"
 xinghe.212_title:"裂界憶質-願い事をしよう"
 xinghe.212_desc:"あなたは円形の部屋に入る。ロープが真っ白な枝の木を縛っている。あなたはその純美に驚く。それは全身が神聖で、まるで舞う彫刻のようだ。あなたは木のそばにもたれかかる数人の兵士に気づく。彼らが眠っているかどうかは定かではない。彼らは敬虔な騎士であり、それぞれが血の気を失った肌をしている。あなたもまた、抗いがたくそれに近づく。あなたは木の波のゆっくりとした砕ける音を聞く。木の根元の木札を見る：「…で水をやりなさい…それは…咲くでしょう。」"
 xinghe.212.a:"祝福と交換する。"
 xinghe.212.a.tt:"ランダムな二つの『concept_path_effect』の§G2§!実践値を獲得"
 xinghe.212.b:"立ち去る。"
 xinghe.212.b.tt:"80の『concept_yuzhousuipian』を獲得"
 xinghe.212.c:"眠っている兵士たちを「再び目覚めさせる」。"
 xinghe.212.c.tt:"ランダムな二つの『concept_path_effect』の§G5§!実践値を獲得"
 xinghe.212.d:"その生命の論理を解体する。"
 xinghe.212.d.tt:"ランダムな指導者が1000の経験値を獲得"
 xinghe.213_title:"裂界憶質-プレゼント交換をしよう"
 xinghe.213_desc:"無名客の列車がブダーンリル駅に停車する。後部車両には無限の贈り物が積まれている。フェルト帽をかぶった旅行者が車両に寄りかかっている。彼の服装はぼろぼろで、毛皮のブーツは泥だらけだ。あなたが車両に近づくと、彼は手を振る。「アキヴィリはかつて凡人に姿を変え、ブダーンリルの人々と共に開拓の冒険をし、旅の面白い経験を交換した。」"
 xinghe.213.a:"祝福と交換する。"
 xinghe.213.a.tt:"ランダムな『concept_path_effect』の§G1§!実践値を失い、ランダムな『concept_path_effect』の§G3§!実践値を獲得"
 xinghe.213.b:"立ち去る。"
 xinghe.213.b.tt:"80の『concept_yuzhousuipian』を獲得"
 xinghe.213.c:"お互いの「記憶」を交換する。"
 xinghe.213.c.tt:"ランダムな『concept_path_effect』の§G1§!実践値を失い、ランダムな『concept_path_effect』の§G4§!実践値を獲得"
 xinghe.213.d:"自分の物語を語る！そして車両から「面白い経験」を略奪する。"
 xinghe.213.d.tt:"『concept_xunlie_effect』の§G4§!実践値を獲得"
 xinghe.214_title:"裂界憶質-ロボット販売端末"
 xinghe.214_desc:"あなたは可愛いロボットが手を振っているのを見かける。近づくと、それは口を開く：「星間平和会社販売端末へようこそ！私たちはあなたが望むすべてを揃えています！」メニューには、医療、強化、購入サービスがあり、価格はまずまずのようだ…"
 xinghe.214.a:"祝福と交換する。"
 xinghe.214.a.tt:"50の『concept_yuzhousuipian』を消費し、ランダムな『concept_path_effect』の§G3§!実践値を獲得"
 xinghe.214.b:"立ち去る。"
 xinghe.214.b.tt:"80の『concept_yuzhousuipian』を獲得"
 xinghe.214.c:"販売端末の「防御ネット」を飲み込む。"
 xinghe.214.c.tt:"ランダムな『concept_path_effect』の§G3§!実践値を獲得"
 xinghe.214.d:"忘れていた「値切り交渉のテクニック」を思い出す。"
 xinghe.214.d.tt:"50の『concept_yuzhousuipian』を消費し、ランダムな『concept_path_effect』の§G4§!実践値を獲得"
 xinghe.214.e:"*アフターサービス*について尋ねる。"
 xinghe.214.e.tt:"50の『concept_yuzhousuipian』を消費し、『concept_random_common_curiosity_get』を獲得"
 xinghe.1000_title:"閉じ込められた蝗蟲"
 xinghe.1000_desc:"[This.GetName]の星核を封印した際、探知機が同時に蝗蟲の画像を捕捉した。その後、自由を取り戻した蝗蟲の群れが我々の設備に向かって攻撃を開始した。直ちに艦隊を派遣して殲滅するのが良いだろう。"
 xinghe.1000.a:"しまった..."
 xinghe.1010_title:"危険なロボット艦隊"
 xinghe.1010_desc:"[This.GetName]の星核を封印した後、我々はロボット艦隊からのメッセージを受信した。彼らは我々に立ち去るよう命じ、我々が彼らの領地を冒涜したと主張し、星系内で無差別攻撃を開始した！"
 xinghe.1020_title:"悪魔"
 xinghe.1020_desc:"一群の悪魔が自由を得た後、我々の設備に向かって突進し、理由もなく無差別に攻撃を開始した。何とかしなければならない！"
 xinghe.1030_title:"怒れるエイリアン"
 xinghe.1030_desc:"[This.GetName]の星核を封印したことで、[This.GetName]の文明は激怒し、星系内の我々の設備を狂ったように攻撃し始め、宇宙征服などを宣言している。"
 xinghe.1030.a:"奇妙な連中だ"
 xinghe.1040_title:"ここに竜がいる"
 xinghe.1040_desc:"竜、天竜が我々を凶暴な目つきで見つめている。どうやら長い間空腹だったようだ。既に我々の施設を攻撃し始めている。"
 xinghe.1050_title:"封印失敗"
 xinghe.1050_desc:"封印作戦は失敗した！星核はむしろ我々のエネルギーを吸収し、悪魔を召喚して攻撃を開始した！彼らの反撃を阻止しなければならない！"
 xinghe.1050.a:"直ちに行動せよ！"
