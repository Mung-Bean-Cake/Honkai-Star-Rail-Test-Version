#指導者
 belobog_bronya:0 "ブローニャ・ランド"
 belobog_bronya_desc:0 "ベロブルグ「大守護者」の後継者であり、若くして有能な銀鬃鉄衛の統領。ブローニャは幼い頃から厳格な教育を受け、「後継者」としての優雅な立ち居振る舞いと親和性を身につけている。しかし、下層区の過酷な環境を目の当たりにし、未来の最高指導者は次第に疑問を抱き始めた…「私が受けてきた訓練は、本当に人々を彼らが望む生活へと導くことができるのだろうか？」"
 belobog_gepard:0 "ジェパード・ランドー"
 belobog_serval:0 "セーバル・ランドー"
 belobog_natasha:0 "ナターシャ"
 belobog_pela:0 "ペラ"
 belobog_pela_desc:0 "緻密な銀鬃鉄衛情報官。若いが頭脳は明晰だ。部隊の移動、物資の配分、地形状況など、ペラは冷静に即座に問いに答え、間違いはない。ペラのスマホケースについては…「それは仕事に関係ありません、長官。」"
 belobog_pela_tt:0 "銀鬃鉄衛情報官、ペラグヤ・セルゲーエヴナ、到着しました。ペラと呼んでください。"
 belobog_lingke:0 "リンクス・ランドー"
 belobog_lingke_desc:0 "ランドー家の末娘であり、ベロブルグ随一の極地探検家。一見怠惰に見えるが、実行力は非常に強い。人を寄せつけない雰囲気を放つのも、不必要な社交を避けるためだ。不必要な社交の定義については——「えっと…すべての社交って不必要じゃない？」"
 belobog_lingke_tt:0 "…私はリンクス、ベロブルグ雪原探検隊の隊員です。仕事の用事は仕事中に連絡してください。それ以外の時間は…私はいません。では、さようなら。"
 belobog_luka:0 "ルカ"
 belobog_luka_desc:0 "楽観的で陽気な機械アームの自由格闘家。「地火」のメンバー。リングから戦場へ、ボクサーから戦士へ、ルカはその力で下層区の人々を守る。自らも絶望を経験したからこそ、他の人々に希望をもたらすことを切望している。"
 belobog_luka_tt:0 "よう、元気か？俺はルカ、「地火」のメンバーだ。悪党を叩き、街を守る——それが俺の日課だ。"
 belobog_huke:0 "フック"
 belobog_huke_desc:0 "冒険グループ「モールズ」のボス。自称「漆黒のフック様」。ちびっ子扱いされるのが嫌いで、大人に頼らずとも自分で何とかできると信じている。大人たちは裂界へ冒険に行き、サンボさんは地上へ、患者たちはナターシャの治療に挑む…フックのリーダーシップの下、子供たちも自分の冒険を持つべきだ！"
 belobog_huke_tt:0 "下層区の大人は地火が管理し、子供はモールズが管理する。そして私はモールズのボスだ。私のことを——漆黒のフック様と呼べ！"
 belobog_kelala:0 "クララ"
 belobog_kelala_desc:0 "ロボットに育てられた少女。年齢を超えた洞察力と粘り強さを持つ。クララにとって、スヴァローグの理性的な計算は世界の法則であり、決して間違ってはいない。しかし、「計算」の結果が必ずしも皆に幸福をもたらすとは限らないことに気づく。臆病な少女は勇気を振り絞ることを決意する。"
 belobog_kelala_tt:0 "こんにちは…私はクララです。私の家族になってくれますか…スヴァローグさんのように。"
 belobog_xier:0 "ゼーレ"
 belobog_xier_desc:0 "颯爽とした「地火」のメンバー。危険で混沌とした地下環境で育ち、単独行動を習慣としている。保護と被保護、抑圧と被抑圧——世界はゼーレに常に白か黒かの一面だけを見せてきた——「あの少女」が現れるまでは。"
 belobog_xier_tt:0 "よっ、私はゼーレ、ベロブルグ下層区「地火」のメンバーだ。一緒に下層区の未来を見届けるか？"
#政体
 auth_yaliluo:0 "ベロブルグ守護領"
 auth_yaliluo_desc:0 "偉大な築城者アリサ・ランドの指導の下、築城者たちは惑星の各地に避難所を建設し始めた。アリサ・ランドの指導の下で建設された都市は「ベロブルグ」と呼ばれ、その完成年は築城紀元元年とされた。その組織構造は銀鬃鉄衛と地火組織を含み、大守護者はベロブルグの最高統治者であり、ランドの姓が代々受け継がれる。次の大守護者は通常、前任者によって育てられる。"
 gov_yaliluo:0 "軍事守護領"
 gov_yaliluo_desc:0 "強力な軍事力で生存者を保護し、指導者は最高司令官でもある。"
 YALILUO_leader:0 "大守護者"
 YALILUO_leader_FEMALE:0 "大守護者"
 councilor_ruler_great_guardian:0 "大守護者"
 councilor_ruler_great_guardian_desc:0 "大守護者はベロブルグの最高統治者であり、指導者であり最高司令官でもある。"
 councilor_tiewei:0 "銀鬃鉄衛戍衛官"
 councilor_tiewei_desc:0 "銀鬃鉄衛戍衛官は銀鬃鉄衛を統率し、裂界の浸食に抵抗し、ヤリロの平和と安全を維持する。"
 councilor_yaliluo_tech:0 "ベロブルグ技術委員会"
 councilor_yaliluo_tech_desc:0 "ベロブルグ技術委員会は科学技術の研究と、一部技術の産業化を担当する。"
#国民理念
 civic_tiewei:0 "銀鬃鉄衛"
 civic_tiewei_desc:0 "人類最後の城塞都市——ベロブルグを守るために常に準備を整える銀鬃鉄衛は、ベロブルグ、築城者、そしてすべての人民に忠誠を誓い、勇気、正義、無私、忠誠を自らに課す。"
 civic_yaliluo_tech:0 "ベロブルグ技術部"
 civic_yaliluo_tech_desc:0 "大守護者直属の技術部であり、科学研究の中核を担う。現在の中心的な研究方向は、裂界の影響の抑制と除去、軽重工業の回復、環境気候の改造、および航空宇宙技術である。"
#地形障害と惑星決議
 d_belobog_blocker_1:0 "裂界浸食"
 d_belobog_blocker_1_desc:0 "この地域は極めて深刻な裂界浸食を受けており、大量の裂界生物が徘徊している。"
 d_belobog_blocker_2:0 "氷天雪地"
 d_belobog_blocker_2_desc:0 "この生命のない地域は雪と氷に完全に覆われており、時折裂界生物が徘徊する。"
 decision_attacker_belobog_blocker_1:0 "裂界への攻撃"
 decision_attacker_belobog_blocker_1_desc:0 "最新の裂界対策技術により、銀鬃鉄衛を組織して裂界生物が集中する地域を攻撃し、その総数を効果的に減少させることができる。"
 decision_attacker_belobog_blocker_1_fail:0 "惑星の陸軍戦力が十分ではなく、現時点での裂界攻撃は良い選択ではないかもしれない。"
 decision_attacker_belobog_blocker:0 "§R部隊を招集せよ！§!"
 decision_attacker_belobog_blocker_desc:0 "民よ、武器を取れ、裂界と最後まで戦い、我々のベロブルグを守れ！"
 decision_deep_resource_exploitation:0 "§H深部資源採掘§!"
 decision_deep_resource_exploitation_desc:0 "ベロブルグはより深層の鉱物・エネルギー資源地点をいくつか探査しているが、これらの資源地点の採掘難易度は高く、採掘基地の設立により多くの時間を要する。"
 decision_deep_resource_exploitation_tt:0 "40％の確率で新たな鉱山区画を追加、40％の確率で新たなエネルギー区画を追加（合計4ヶ所の探査地点）、20％の確率で新たな鉱山区画と新たなエネルギー区画を追加（合計4ヶ所の探査地点）；25％の確率で予期せぬイベントが発生する。\n残り：[from.count_resource_exploitation]"
 decision_attacker_liexi_blocker:0 "裂界への攻撃を組織"
 decision_attacker_liexi_blocker_desc:0 "現状はまだ弱小だが、未来のために賭けに出なければならない！"
 decision_more_zaowuyinqing:0 "さらなる造物エンジン"
 decision_more_zaowuyinqing_desc:0 "研究によれば、現在の上限を超えてさらに造物エンジンを建造することが可能である。"
 need_chance:0 "すべての攻撃計画が完了している"
 more_juntuan:0 "§R現時点では徴兵に十分な人的余裕がない。\nクールダウン7.5年§!"
 the_way_used:0 "すべての採掘地点の採掘が完了している"
 more_zaowuyinqing:0 "上限を超えている"
 decision_attacker_belobog_blocker_tt:0 "銀鬃鉄衛の陸軍ユニットを15個徴兵する"
 d_belobog_blocker_liexi:0 "裂界浸食"
 d_belobog_blocker_liexi_desc:0 "この地域は極めて深刻な裂界浸食を受けており、大量の裂界生物が徘徊している。"
 d_belobog_blocker_small:0 "裂界"
 d_belobog_blocker_small_desc:0 "小型裂界。これらの破壊された都市には少数の裂界生物が徘徊している。"
 d_belobog:0 "ベロブルグ"
 d_belobog_desc:0 "裂界浸食を生き延びた人々が再建した領地。人々はここで休息し、力を蓄えている。"
 d_zaowuyinqing:0 "造物エンジン"
 d_zaowuyinqing_desc:0 "ヤリロ独自の新技術によって建造された巨大機械。現在、全力で建造が進められている。"
 d_energy_block:0 "新エネルギー区画"
 d_energy_block_desc:0 "投資によって新たに建設されたエネルギー施設"
