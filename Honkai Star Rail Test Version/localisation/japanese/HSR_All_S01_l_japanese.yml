 yaliluo_story.1006.desc:0 "我々は星間平和会社に使者を派遣し、相互関係の改善を図る。"
 yaliluo_story.1006.a:0 "共に前進"
 yaliluo_story.1007.title:0 "協力・共栄"
 yaliluo_story.1007.desc:0 "我々は星間平和会社と協定を結び、双方がより緊密な協力と相互関係の強化に同意する。"
 yaliluo_story.1007.a:0 "協力・共栄"
 yaliluo_story.1008.title:0 "債務の再交渉"
 yaliluo_story.1008.desc:0 "重い債務は我々の発展を制限し、双方の関係を損なっている。我々は債務問題の再交渉を希望する。"
 yaliluo_story.1008.a:0 "交渉開始"
 yaliluo_story.1009.title:0 "一部免除"
 yaliluo_story.1009.desc:0 "星間平和会社は我々の債務の一部を免除し、その資金を投資として活用して関係改善に努めることを提案した。"
 yaliluo_story.1009.a:0 "素晴らしい！"
 yaliluo_story.1010.title:0 "交渉失敗"
 yaliluo_story.1010.desc:0 "星間平和会社との合意には至らず、目的は達成されなかった。"
 yaliluo_story.1010.a:0 "残念だ。"
 yaliluo_story.1020.title:0 "§H仙舟連盟§!との関係を調整"
 yaliluo_story.1020.desc:0 "現在の好感度：[from.count_xianzhou_like]\n古の神話の時代、数隻の仙舟が長生の霊薬を求めて星海に出航した。薬を求める舟は光陰を費やし、身体と意志を磨耗させ、ついに薬師の祝福を得た。しかし、長生をもたらす果実は、四海の荒廃と民の苦難をもたらした。巡狩の星神・嵐が深淵から帰還し、重力を弦とし、辰矢を満弓にして建木を一撃で断ち切り、「豊穣」の孽を絶つまで、その苦しみは続いた。仙舟は迷いの道を脱した後、「巡狩」の導きにより連盟を結成し、強力な雲騎軍を組織した。連盟は豊穣の孽物を標的とし、不死の汚染を断ち切ることを使命として、広大な星野を巡る。長い年月の中で、「仙舟連盟」はかつて神が足を止めた無数の世界に上陸し、豊穣の孽物を全て滅ぼしてきた。豊穣の恩恵を求めるいかなる星民の種族も、仙舟の星を殲滅する脅威を考慮せざるを得ない。これこそが「仙舟連盟」が求める抑止力であり、彼らは絶え間ない警鐘となり、全ての貪生の者にとって払うことのできない代償となる。今日に至るまで、様々な生命が仙舟に集まるのは、好き放題に振る舞う「豊穣」に復讐し、「巡狩の意志」を徹底するためである。故に、不死の劫難が尽きる日まで、星海の巡航は止まない。"
 yaliluo_story.1020.a.desc:0 "現在の好感度：[from.count_xianzhou_like]"
 yaliluo_story.1021.desc:0 "我々は仙舟連盟に使者を派遣し、相互関係の改善を図る。"
 yaliluo_story.1022.title:0 "無私の援助"
 yaliluo_story.1022.desc:0 "我々は仙舟と協定を結び、彼らは我々を支援する用意があり、より緊密な協力と相互関係の強化に同意する。"
 yaliluo_story.1022.a:0 "感謝の念に堪えない。"
 yaliluo_story.1030.title:0 "§H黒塔宇宙ステーション§!との関係を調整"
 yaliluo_story.1030.desc:0 "現在の好感度：[from.count_heitacountry_like]\n天才クラブの黒塔は、通常の世界の万物の法則に満足せず、銀河の未解決の存在に目を向け、それらの遠い神秘が自分の好奇心を満たしてくれることを期待した。そのため、黒塔は博物館式の星間艦船を主導して建造し、それを惑星軌道に投入し、「すべての異変を星空に封印する」研究を開始した。有名な黒塔宇宙ステーションがこうして誕生した。今日に至るまで、宇宙ステーションは数え切れないほどの奇物「収蔵品」を擁し、まさに星空の博物館である。多くの随艦研究者もここに定住し、銀河の各地から遺物や奇物を収集し、その形状や機能を記録し、体系的な観測と研究方法を確立している…そして最終的に、謎からさらに理解し難い謎を見つけ出す。これこそが黒塔の当初の目的でもある。多数の「収蔵品」はしばしば羨望の目を集め、様々な勢力が暗躍している。黒塔の実力により、宇宙ステーションが本当の危機に陥ることはほとんどなく、収蔵と研究は秩序正しく進められている。"
 yaliluo_story.1030.a.desc:0 "現在の好感度：[from.count_heitacountry_like]"
 yaliluo_story.1031.desc:0 "我々は黒塔宇宙ステーションに使者を派遣し、相互関係の改善を図る。"
 yaliluo_story.1032.desc:0 "我々は黒塔宇宙ステーションと協定を結び、より緊密な協力と相互関係の強化に同意する。"
 yaliluo_story.1100:0 "§Hペラ§!"
 yaliluo_story.1100.a:0 "自分自身について"
 yaliluo_story.1100.a.response:0 "私は情報の研究、記録、分析を得意としています。どのような決断を下すかは、上官の役目です。"
 yaliluo_story.1100.b:0 "共有"
 yaliluo_story.1100.b.response:0 "私のフルネームについては、軍内で少なくとも32の説が流れています。なぜそれを知っているかと言えば、それが情報官の能力です。"
 yaliluo_story.1101:0 "§Hリンクス§!"
 yaliluo_story.1101.a.response:0 "ランドー家のやり方は簡単です。「やりたいならやればいい」。私は雪原に行きたかったので、探検隊に参加した…それだけです。"
 yaliluo_story.1101.b.response:0 "カント谷の山風に注意してください。それは通常、吹雪の前兆です——決して、決して夜の峡谷に留まってはいけません。"
 yaliluo_story.1102:0 "§Hルカ§!"
 yaliluo_story.1102.a.response:0 "格闘は暴力が好きだからじゃない。チャンピオンになったからといって自慢したいわけでもない…ただ地下の悪党が多すぎて、子供たちに良い手本を示さなければならないと思っただけだ。"
 yaliluo_story.1102.b.response:0 "聞いたか？下層区の三大名物：地髄、良心のかけらもない鉱山主、そしてルカの拳だ！"
 yaliluo_story.1103:0 "§Hフック§!"
 yaliluo_story.1103.a.response:0 "ドリルマシンはかつて勤勉な鉱夫だった。引退後、フック様の呼びかけに応じて、悪党を倒す無情の鉄腕となった！"
 yaliluo_story.1103.b.response:0 "大人はいつも「大人になれば分かる道理」でフックをごまかす…むしろフックは、大人は「大人になる前に知っていた道理」を忘れてしまったと思う！どっちの道理が多いか勝負してみる？"
 yaliluo_story.1104:0 "§Hクララ§!"
 yaliluo_story.1104.a.response:0 "スヴァローグの「計算」でさえ、みんなの「記憶」から切り離すことはできません…だからクララは絶対にみんなを忘れません。"
 yaliluo_story.1104.b.response:0 "クララのロボットの仲間たちは、時々口が悪いけど、みんな嘘をつかない良い子たちです。"
 yaliluo_story.1105:0 "§Hゼーレ§!"
 yaliluo_story.1105.a.response:0 "子供の頃の私？フックの破壊力の10倍くらいだったかな。"
 yaliluo_story.1105.b.response:0 "ボスの言う通りだ。道理の通じない奴には、刃が道理だ。"
 #特別プロジェクトとイベントチェーン
 belobog_story_outer_space_exploration_chain_title:0 "外宇宙採掘計画"
 belobog_story_outer_space_exploration_chain_desc:0 "$belobog_story_outer_space_exploration_chain_DESC$"
 belobog_story_outer_space_exploration_chain_DESC:0 "母星は資源が乏しいが、異星資源を採掘してプロジェクトに供給することができる。星間平和会社の海外派遣チームとベロブルグ技術委員会の共同努力により、必要な科学船と工兵船の建造技術は問題なく、交渉によって星港の主権と惑星表面基地の使用権を獲得し、関連する採掘技術も習得した。しかし、長期的にはこの方案は補助的なものに過ぎず、これほど長い時間を待つことはできず、資源獲得率も限られている。"
 belobog_story_outer_space_exploration:0 "異星資源採掘"
 belobog_story_outer_space_exploration_DESC:0 "$belobog_story_outer_space_exploration_chain_DESC$"
 belobog_story_internal_power_integration_chain_title:0 "内部勢力統合"
 belobog_story_internal_power_integration_chain_desc:0 "$belobog_story_internal_power_integration_chain_DESC$"
 belobog_story_internal_power_integration_chain_DESC:0 "星核危機、裂界浸食、会社の債務に直面して、我々の上層部には多くの意見と見解がある。現在我々が直面する最大の問題は、いかにしてすべての力を迅速に統合するかである。団結の大会が今まさに必要とされており、全ての力を集中してこれらの困難を克服しなければならない。"
 belobog_story_internal_power_integration:0 "内部勢力統合"
 belobog_story_internal_power_integration_DESC:0 "$belobog_story_internal_power_integration_chain_DESC$"
 belobog_story_internal_power_integration_sec:0 "団結の演説"
 belobog_story_internal_power_integration_sec_DESC:0 "今、我々は団結できるすべての力を団結させなければならない。ベロブルグの人々にとって、現在最も重要な任務は造物エンジンを修復し、裂界をヤリロから追放し、生産・軍事・技術力を強化して、独立自主の復興の道を歩むことである。異星文明に対しては、関係を適切に処理し、独立自主の原則を維持し、安定した平和的な外部環境を確保しなければならない。"
 belobog_story_liexi_research_chain_title:0 "特殊技術研究"
 belobog_story_liexi_research_chain_desc:0 "ベロブルグ技術委員会が担当するいくつかの特殊技術研究プロジェクト。"
 belobog_story_liexi_research_chain_DESC:0 "$yaliluo_story.320.desc$"
 belobog_story_liexi_research:0 "$yaliluo_story.320.name$"
 belobog_story_liexi_research_DESC:0 "$yaliluo_story.320.desc$"
 belobog_story_plan_of_operation_chain_title:0 "軍事攻撃計画"
 belobog_story_plan_of_operation_chain_desc:0 "我々の発展の必要性に伴い、侵食された地域の奪還は喫緊の課題となっている。今こそ、あの忌々しい裂界に攻撃を仕掛け、ベロブルグの発展に貴重な機会と可能性をもたらす時である。"
 belobog_story_plan_of_operation_chain_DESC:0 "$belobog_story_plan_of_operation_chain_desc$"
 belobog_story_plan_of_operation:0 "東部地域攻撃計画"
 belobog_story_plan_of_operation_DESC:0 "ベロブルグの東部に位置する地域は、かつて重要な資源採掘・処理区域であった。ベロブルグ建設時には大量の資源を採掘し、一部の設備を地下に封鎖した。この地域を奪還するためには、この広大な地域で裂界と戦争を繰り広げなければならない。"
 belobog_story_plan_of_operation_west:0 "西部地区計画"
 belobog_story_plan_of_operation_west_DESC:0 "ベロブルグの西部に位置する地域は、かつて最盛期の研究センターであった。時間の制約のために多くの高度な研究設備が現地に封鎖されている。研究速度を加速するためには、この地域を奪還しなければならない。"
 belobog_story_establish_the_galactic_rescue_alliance_chain_title:0 "銀河救援連盟の結成"
 belobog_story_establish_the_galactic_rescue_alliance_chain_desc:0 "$yaliluo_story.219.desc$"
 belobog_story_establish_the_galactic_rescue_alliance_chain_DESC:0 "$yaliluo_story.219.desc$"
 belobog_story_establish_the_galactic_rescue_alliance_a:0 "自らの強化"
 belobog_story_establish_the_galactic_rescue_alliance_a_DESC:0 "$yaliluo_story.220.desc$"
 belobog_story_establish_the_galactic_rescue_alliance_b:0 "志を同じくする人々"
 belobog_story_establish_the_galactic_rescue_alliance_b_DESC:0 "$yaliluo_story.221.desc$"
 #固定設計
 NAME_belobog_first:0 "築城者のベロブルグ"
 NAME_belobog_first_better:0 "$NAME_belobog_first$"
 NAME_belobog_first_best:0 "$NAME_belobog_first$"
 NAME_belobog_constructor:0 "築城者のベロブルグ"
 NAME_belobog_constructor_better:0 "$NAME_belobog_constructor$"
 NAME_belobog_constructor_best:0 "$NAME_belobog_constructor$"
 SRB_story_main_chain_title:0 "火種計画"
 SRB_story_main_chain_desc:0 "現在の状況では、ベロブルグは最終的に陥落するだろう。我々は星空へと進み、生存の道を見つけなければならない。"
 SRB_main_story_choice_leave:0 "母星を離れる"
 SRB_main_story_choice_leave_DESC:0 "母星を離れることは、母星上の文明の成果のほとんどを失うことを意味する。我々はできるだけ多くのものを植民地に移し、母星の灯火が消えるのを見守るしかない。再建の過程では多くの困難に直面するだろう。もし人口の移住に成功し、植民地で文明を再建できたとしても、文明のその後の発展を考慮しなければならない。\n他の計画を支持する人々も少なくないため、我々の決定を大多数に受け入れさせるには時間がかかるだろう。"
 SRB_main_story_choice_stay:0 "母星に留まる"
 SRB_main_story_choice_stay_DESC:0 "母星に留まることは、既存の文明の成果を引き続き活用できることを意味するが、同時に母星の極端な環境に抵抗し、長い時間をかけて母星を改造・発展させなければならないことを意味する。他の計画と比較して、この過程はより困難かもしれない。しかし、もし成功すれば、それは輝かしい歴史となるだろう。成功した後には、我々の文明は大きな力を解放できるだろう。\nこの計画は文明全体に大きな挑戦をもたらすため、我々の決定を大多数に受け入れさせるには時間がかかるだろう。"
#連邦
 no_galactic_rescue_federation:0 "イベントによってのみ設立可能"
 galactic_rescue_federation:0 "銀河救援連盟"
 galactic_rescue_federation_desc:0 "この連邦は相互扶助に尽力し、多方面での協力を通じて連邦メンバーが互いに長所を補完し、共に成長することを目指す。"
 galactic_rescue_federation_passive:0 "相互通有"
 galactic_rescue_federation_passive_desc:0 "我々は共通の目標のために集まった。文化的・生理学的な違いに関わらず、連邦の発展は我々の共通の目標を実現するためのものである。"
 galactic_rescue_federation_unite_as_one_2:0 "和を以て貴しとなす"
 galactic_rescue_federation_unite_as_one_2_desc:0 "共通点は基本的なものであり、相違点は局部的なものである。和を以て貴しとなすことができる。"
 galactic_rescue_federation_mutual_assistance:0 "インフラと互助協会"
 galactic_rescue_federation_mutual_assistance_desc:0 "連邦メンバーは互いに助け合い、長所を補完し、経済を刺激し、高速発展の道を歩む。"
 galactic_rescue_federation_ideal_heart:0 "理想の本心"
 galactic_rescue_federation_ideal_heart_desc:0 "我々の特使は昼夜を問わず働き、連邦の議題と目標を推進・宣伝し、銀河中に友好と信頼を刺激する。"
 galactic_rescue_federation_research_1:0 "技術共有と学術交流"
 galactic_rescue_federation_research_1_desc:0 "連邦内の全体的な科学技術水準を向上させるため、全メンバーが交流できる学術プラットフォームを提供する。"
 galactic_rescue_federation_research_1_effect:0 "§Y連邦研究協定§!により、研究速度が§Y10%§!増加する。\n§H連邦内の他のメンバーが既に研究した技術を研究する際の研究速度を向上させる§!"
 galactic_rescue_federation_national_defense_1:0 "国防建設と共有兵站"
 galactic_rescue_federation_national_defense_1_desc:0 "我々の敵は想像よりもはるかに恐ろしく残酷であり、武器は我々を守る最良のものだ。"
 galactic_rescue_federation_storm_prevention:0 "嵐予防と嵐研究"
 galactic_rescue_federation_storm_prevention_desc:0 "宇宙嵐は我々に悪影響を及ぼす可能性がある。それらを研究し、合理的な予防計画を策定すべきである。"
 galactic_rescue_federation_structure:0 "巨大構造物建設と深宇宙採掘"
 galactic_rescue_federation_structure_desc:0 "巨大構造物という無限の可能性を秘めた施設をインフラ事業として捉えれば、我々の生産力は大幅に向上するだろう。"
 galactic_rescue_federation_national_defense_2:0 "艦隊訓練と人材育成"
 galactic_rescue_federation_national_defense_2_desc:0 "我々は銀河の潜在的な脅威を排除するための優秀な職業軍隊を必要とする。"
 galactic_rescue_federation_damage_voidworms:0 "虚空蟲災害防御"
 galactic_rescue_federation_damage_voidworms_desc:0 "虚空蟲は我々の艦船や人員の安全を脅かす。防衛を強化すべきである。"
 galactic_rescue_federation_damage_voidworms_effect:0 "§H虚空蟲§!へのダメージ+§Y25%§!"
 galactic_rescue_federation_research_2:0 "研究動員"
 galactic_rescue_federation_research_2_desc:0 "銀河全体を脅かす災厄が到来した場合、科学界はそれに無関心ではいられない。思考ゲームから精力を引き抜き、防衛武具の研究開発に専念しなければならない。"
 crisis_research_2_effect:0 "メンバー修正：\n終末危機発生中、研究速度が20%増加する。"
 galactic_rescue_federation_more_defence:0 "衆志成城"
 galactic_rescue_federation_more_defence_desc:0 "強力な侵略者に対する防衛需要は、銀河全体に脆弱な平和状態を維持させる。我々は共にこの状態を維持し、内部や外部のトラブルメーカーに対抗しなければならない。"
 galactic_rescue_federation_more_defence_effect:0 "§R終末危機陣営§!（§R壊滅天災§!と§R模擬宇宙の敵§!を含む）へのダメージ：§G+50%§!"
 galactic_rescue_federation_national_defense_3:0 "ユートピアの夢"
 galactic_rescue_federation_national_defense_3_desc:0 "ユートピアを築くという夢は、我々を絶えず前進させる。素晴らしい明日は、戦う価値がある。"
 SRB_blocker_remove_fail:0 "この障害物を除去するにはさらなる研究が必要である"
 belobog_blocker_1_research_1:0 "理論的枠組みの構築"
 belobog_blocker_1_research_1_DESC:0 "災害の根源である星核が裂界をもたらした。星核が封印された現在でも、裂界はまだ退いていない。ここ数十年、我々は裂界に頻繁に悩まされており、この状況はまだしばらく続くだろう。\nしかし、科学界の最新情報は希望をもたらす。多くの研究者が裂界に関する最新の理論的成果を発表しており、理論的枠組みを構築することが可能になった。おそらく、専用のプロジェクトを設立し、十分な資源を投入すれば、現在の状況に転機をもたらすことができるかもしれない……？"
 belobog_blocker_1_research_2:0 "狂気の捕獲"
 belobog_blocker_1_research_2_DESC:0 "記者たちは、ある異常な事件を報道するために競い合っている。狂気の科学者チームが裂界怪物の集積地に向かい、研究のために裂界怪物を捕獲しようとしたというものだ。捕獲自体は成功したが、鉄衛の救出チームが最終的に彼らを見つけた時、彼らはそこに閉じ込められていた。\n我々は多くの研究者が裂界怪物に注目していることに気づいた。しかし、裂界生物の捕獲は明らかに鉄衛に任せる方が適切だ。"
 belobog_blocker_1_research_3:0 "さらなる研究"
 belobog_blocker_1_research_3_DESC:0 "以前、我々は基本的な理論的枠組みを完成させ、関連する応用の準備をするための大規模な研究プロジェクトを組織した。その後も研究者たちは裂界のさらなる秘密を発見し続け、技術応用の過程でも多くの緊急の課題が明らかになった。これらの課題は統合され、科学研究院に提出され議論された。\n我々は現在、星海の多くの秘密を発掘しており、思考の幅も広がっている。裂界内部の秘密をすべて明らかにし、理論を完全に理解する必要はないかもしれない。現在の時間的制約の中では、以前の基礎の上で少し改良を加え、裂界を十分に制御できればそれで十分だ。"
 belobog_blocker_1_research_4:0 "惑星裂界調査"
 belobog_blocker_1_research_4_DESC:0 "裂界を実際に制御する能力を得た後、我々は裂界を活動範囲から遠ざけ、裂界の自然消滅を加速させることに成功した。\n母星の復興という目標は遠くない。母星上の裂界を完全に把握するための特別プロジェクトを実施し、裂界を完全に除去する計画を策定する必要がある。これには当然ながら莫大な人的・物的資源が必要となるが、最終段階への準備として価値がある。"
 belobog_blocker_1_research_5:0 "裂界除去計画"
 belobog_blocker_1_research_5_DESC:0 "宇宙に戻って以来、我々は裂界に対して多くの努力を払ってきた——研究、抑制、除去、対抗。疑いなく、裂界は現在、我々の完全な制御下にある。\n今は完璧な機会だ。以前の調査データを基に、我々はついに、千年近くにわたって母星を悩ませてきた裂界を完全に追放する壮大な計画を策定することができる。その後は、もう裂界のことを心配する必要はない。"
 belobog_blocker_2_research_1:0 "ベロブルグの外"
 belobog_blocker_2_research_1_DESC:0 "寒波は依然としてヤリロ-VIの表面を覆っている。\nこれは悲しい知らせだ。市外の氷天雪地は我々をいくつかの小さな地域に閉じ込めている。このような制約の下では、母星での発展を続けることは不可能だ。\nベロブルグ周辺に引きこもり続けることは、自滅を待つことに等しい。市外に新たな市街地を建設する方法を見つけなければならない。"
 belobog_blocker_2_research_2:0 "寒波の中の拡張方法"
 belobog_blocker_2_research_2_DESC:0 "拠点を持つだけでは不十分だ。氷天雪地の中に都市を建設するには、人員の大規模な移動と物資の安定供給を保証する完全な仕組みが必要だ。\n母星の環境下で領土を拡張することは、宇宙よりもさらに困難である。一連のプロセスを円滑に機能させるには、様々な分野の協力が必要だ。"
 belobog_blocker_2_research_3:0 "古代遺跡の再開発"
 belobog_blocker_2_research_3_DESC:0 "雪に覆われた惑星では、多くの神秘的な古代文明の遺跡が積雪の下に静かに埋もれている。好奇心に駆られて、古代文明の遺産はしばしば我々の足を止めさせる。これらの遺跡は大きな可能性を秘めている。特別プロジェクトを組織し、探検隊を派遣してその秘密を徹底的に調査すべきであり、必ず多くの収穫があるだろう。"
 belobog_blocker_2_research_4:0 "惑星地図の再描画"
 belobog_blocker_2_research_4_DESC:0 "寒波が後退するにつれて、母星の真の姿が徐々に現れてきた。これに伴い、いくつかの問題も生じている。数百年前の世界地図は今や参考としてのみ使用できる。\n母星の気候回復計画が進むにつれて、母星の地形を再調査する任務の重要性も増している。これは大規模なプロジェクトであり、母星を完全に回復させるための重要な一環である。"
 belobog_blocker_2_research_5:0 "海洋惑星"
 belobog_blocker_2_research_5_DESC:0 "我々は、ヤリロ-VIがかつて海洋惑星であり、温暖な気候と羨むべき海洋環境を有していたことを知っている。資源は比較的乏しかったが、地髄鉱石と快適な生活環境は宇宙の様々な場所から訪問者を引き寄せた。\n我々には、地表の氷を溶かす自然の偉力はない。【存護】の力が我々をベロブルグ内で生存させてきた。そして今、その【存護】の力を駆使してこの偉業を成し遂げる時だ。"
 SRB_main_story_save_jarilo:0 "ヤリロ-VIの復興"
 SRB_main_story_save_jarilo_DESC:0 "母星の復興は多面的なプロジェクトであり、一つの側面にだけ注力しても成功することはない。気づかぬうちに、我々の社会は母星の環境改善のために多大な努力と資源を投入し、多くの人員と組織を巻き込む広大なネットワークを形成してきた。現在、母星の環境はほぼ整備された。最後のプロジェクトには全員の協力が必要であり、物語に完璧な結末を付ける時だ。"
 #状況：裂界の抑制
 belobog_blocker_1_situation:0 "裂界の抑制"
 belobog_blocker_1_situation_type:0 "状況：裂界の抑制"
 belobog_blocker_1_situation_desc:0 "星核が封印されて以来、裂界はゆっくりと後退している。しかし、計算によれば、母星の生態系が破壊される前に裂界が後退する進捗は許容しがたいものである。裂界の基礎知識を習得した後、我々は裂界に干渉し、望ましい効果を強制的に達成することができる。"
 belobog_blocker_1_situation_monthly_change_tooltip:0 "裂界研究プロジェクトを進めて、より強力な抑制オプションを解放する"
 belobog_blocker_1_progress_desc:0 "我々は状況の変化についての推測を立てている"
 belobog_blocker_1_situation_triggered_desc.1:0 "星核が封印されて以来、裂界はゆっくりと後退している。しかし、計算によれば、母星の生態系が破壊される前に裂界が後退する進捗は許容しがたいものである。裂界の基礎知識を習得した後、我々は裂界に干渉し、望ましい効果を強制的に達成することができる。"
 belobog_blocker_1_situation_triggered_desc.2:0 "星核が封印されて以来、裂界はゆっくりと後退している。しかし、我々は母星を離れることを決定しており、裂界の制御は撤退に影響を及ぼさない程度で十分である。"
 belobog_blocker_1_stage_1:0 "裂界が大いに蔓延"
 belobog_blocker_1_stage_1_desc:0 "裂界が大いに蔓延しており、その発生速度は予想を超えている。"
 belobog_blocker_1_stage_1_tooltip:0 "この状態から一刻も早く脱却しなければならない。"
 belobog_blocker_1_stage_2:0 "裂界が蔓延中"
 belobog_blocker_1_stage_2_desc:0 "本来、裂界は自然に後退するはずだが、なぜかまだ発生し続けている。"
 belobog_blocker_1_stage_2_tooltip:0 "より強力な手段が必要だ。"
 belobog_blocker_1_stage_3:0 "裂界の初期制御"
 belobog_blocker_1_stage_3_desc:0 "現在、裂界にわずかに影響を与え、後退を加速させることができる。"
 belobog_blocker_1_stage_3_tooltip:0 "状況の悪化を防ぐために行動を起こせ。"
 belobog_blocker_1_stage_4:0 "裂界の基本的制御"
 belobog_blocker_1_stage_4_desc:0 "現在、裂界は我々の制御下にある。裂界が再び我々に影響を与えることを心配する必要はない。"
 belobog_blocker_1_stage_4_tooltip:0 "状況の展開を辛抱強く待つことができる。"
 belobog_blocker_1_stage_5:0 "裂界がほぼ消失"
 belobog_blocker_1_stage_5_desc:0 "現在、我々の活動範囲では裂界の兆候はほとんど見られない。"
 belobog_blocker_1_stage_5_tooltip:0 "間もなく、既に形成された頑固な領域を除いて、新しい裂界は発生しなくなるだろう。"
 belobog_blocker_1_approach_1:0 "裂界発電"
 belobog_blocker_1_approach_1_desc:0 "これは馬鹿げていると思わないか？うまくいけば、悲惨な経済状況を多少改善できるだろう。\n裂界が人々の生活に再び影響を及ぼす前に、止めるべきだ……さもなければ結果は悲惨なものになる。"
 belobog_blocker_1_approach_2:0 "見て見ぬふり"
 belobog_blocker_1_approach_2_desc:0 "うーん、この問題については良い解決策がない。"
 belobog_blocker_1_approach_3:0 "積極的な清掃"
 belobog_blocker_1_approach_3_desc:0 "軍隊を派遣し、専門チームを設置し、先進技術を用いて裂界を可能な限り制御下に置く。"
 belobog_blocker_1_approach_4:0 "全面清掃"
 belobog_blocker_1_approach_4_desc:0 "最新技術と調査結果により、地上と宇宙の戦力が協力して、裂界の制御能力を大幅に向上させることができる。"
 belobog_get_help:0 "異星の援助"
