 concept_fengrao: "§H「豊穣」§!"
 concept_fengrao_desc: "§H「豊穣」、薬師§!\n衆生の養育者、楽土の神。生命を絶え間なく繁栄させることを目的とする。薬師は「豊穣」の運命を司り、「巡狩」の嵐は彼を死敵と見なす。\n§H「花は自由に咲き誇り、避けられない凋落へと向かう；鳥は翼を広げて歌い、避けられない墜落へと向かう；小川はせせらぎ、避けられない干上がりへと向かう——なぜ万物は必ず滅びなければならないのか？宇宙には必ず、『短命』という難病を癒す霊薬があるはずだ。」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——佚名『この人生は短く苦い』§!"
 concept_fengrao_effect:"運命：「豊穣」"
 concept_fengrao_effect_desc:"§H有用型§!運命。初期は§G惑星インフラ建造速度§!、§G障害物除去速度§!、§G住宅§!、§G快適度§!を向上させ、§G障害物除去費用§!を減少させる。実践値が増加するにつれて、§H指導者寿命§!、§Hテラフォーミング速度§!、§H植民地発展速度§!、§H植民地飛昇効果§!を向上させる。§H植民船建造費用§!、§Hテラフォーミング費用§!を減少させる。追加で§Rポスト維持費§!を増加させる。"
