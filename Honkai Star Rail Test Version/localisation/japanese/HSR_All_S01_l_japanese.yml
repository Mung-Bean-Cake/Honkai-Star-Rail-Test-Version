 hsr_path.1000.desc:"惑星浄化区内の浄化師たちの絶え間ない努力により、この惑星の汚染はほぼ一掃された。今、我々は惑星浄化区を利用して惑星をガイア惑星に変換するか、惑星浄化区を追加するかを選択できる。"
