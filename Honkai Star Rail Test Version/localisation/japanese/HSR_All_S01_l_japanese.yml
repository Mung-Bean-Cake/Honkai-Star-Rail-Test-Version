 councilor_xunlie_fanyu_1_desc:"宇宙を浄化するためには、個人の枠を超えなければならない。"
 tr_xunlie_zhishi_1:"§B予演家§!"
 tr_xunlie_zhishi_1_flavor:"優れた狩人は自ら攻撃しない。彼らは獲物を操り、罠に落ちるのを待つ。あなたは前方の虚空に向けて発砲し、10秒のカウントダウンを開始する。2時間前、彼は機械の占いの影響で、浮遊船を諦め、公共交通機関を利用して交渉会場に向かった。1時間前、カプセル管の定期点検が30分遅れ、彼は非常に焦り、体裁も顧みず会場へと走った。2分前、相手の強硬な態度に気分を害し、彼は習慣で戸外に空気を吸いに出たが、政敵に遭遇した。彼は虚偽の儀礼を交わし、7分から9分ほど寒暄するだろう。その後、9秒後に弾丸が彼と出会う。"
