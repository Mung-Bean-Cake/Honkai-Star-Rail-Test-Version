 #爻光
 NAME_yaoguang:"爻光"
 yaoguang_catch_phrase:"「チャンスは危険の中にあり、大胆に来い。」"
 yaoguang_backstory:"神秘的で、大胆で、過激で、変革を求めるその行動は人々を驚愕させる。巡狩の「目」をもって吉凶を遍観し、天意に逆らうことを知りながらも、「戎韜将軍」は孤身で危険に身を投じる。この下下の籤、どのようにして運命を変えるのか？"
 hsr_paragon.67.name:"爻光"
 hsr_paragon.67.a:"初対面"
 hsr_paragon.67.a.response:"私は爻光、仙舟「玉闕」の戎韜将軍だ。君は他の人と同じように、私を「爻老板」と呼んでくれ。今回の会合は、細部は占いで予見できたが、私はやはり直接体験したいと思った——やはり、多くの意外な喜びがあった。"
 hsr_paragon.67.b:"挨拶"
 hsr_paragon.67.b.response:"今日の天気で言えば、君は仙舟連盟で最も聡明な人物に出会うだろうと予想している…それが私だとは言っていないが。"
 hsr_paragon.67.c:"見聞"
 hsr_paragon.67.c.response:"天高く地は広く、思い切り行動せよ——次に会う時は、私も驚くような大きな出来事を話してくれ。"
