 huimie_sealing_wax:"壊滅封蝋"
 huimie_sealing_wax_desc_short:"星神封蝋"
 huimie_sealing_wax_desc_details:"落ち込んだ自滅者の間では、宇宙の万物には意味がなく、人間は星神の目には取るに足らない存在であるという説が流れている。もし星神が本当に衆生を超越し、高みに君臨するのであれば、なぜ凡人の愛憎苦楽を気にするのか？無相の眠り手IXの存在がその証拠だ。自滅者たちに星神が気にかけていることを証明するために、混沌医師は秘学僧侶の巫神術と組み合わせて星神封蝋を製作した。この封蝋を押せば、対応する星神の時空を超えたまなざしを遠くから引き寄せることができると言われている——今のところ成功例はないが、いくつかの自滅者は封蝋を押した後、宇宙や星神、その他すべてに対する自信を取り戻したという。"
