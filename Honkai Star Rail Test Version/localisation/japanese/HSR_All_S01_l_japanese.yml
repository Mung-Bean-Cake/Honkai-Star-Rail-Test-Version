origin_Penacony:0 "ピノコニー"
origin_Penacony_desc:0 "「未実装」このソルダを飲め～快樂の夢よ急げ～"
origin_tooltip_Penacony_effects:0 "ピノコニーはアスダナ星系に位置する、有名な盛会の星である。現実のピノコニーは銀河に浮かぶ星間ホテルであり、ここでチェックインして客室で休むことができる。そして眠りにつくと、ピノコニーの真の姿——金色に輝く歓楽の都が見える。夢の中では、童話のような「ドリームスケープ」ホテルを自由に散策し、賑やかな「オーティモール」で様々な面白い店を楽しみ、「クロッキー広場」で観光し、「エディエン公園」で様々な遊戯施設を試したり、「ゴールデン中央駅」を見学したりすることもできる……"
The_Penacony_start_screen_messages:0 "このソルダを飲め～快樂の夢よ急げ～ピノコニーはアスダナ星系に位置する、有名な盛会の星である。現実のピノコニーは銀河に浮かぶ星間ホテルであり、ここでチェックインして客室で休むことができる。そして眠りにつくと、ピノコニーの真の姿——金色に輝く歓楽の都が見える。夢の中では、童話のような「ドリームスケープ」ホテルを自由に散策し、賑やかな「オーティモール」で様々な面白い店を楽しみ、「クロッキー広場」で観光し、「エディエン公園」で様々な遊戯施設を試したり、「ゴールデン中央駅」を見学したりすることもできる……"

