 SR_Paragon.001.name:"運命の行者"
 SR_Paragon.001.desc:"運命の行者"
 SR_Paragon.001.a:"汝は誰だ"
 SR_Paragon.001.a.response:"我は運命の行者なり"
 SR_Paragon.001.b:"汝は何処から来た"
