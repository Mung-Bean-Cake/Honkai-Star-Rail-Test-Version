 #丹恒
 NAME_danheng:"丹恒"
 danheng_catch_phrase:"昨日は未練の必要はない。"
 danheng_backstory:"寡黙な少年。『撃雲』という名の長槍を携え、列車の長い開拓の旅で護衛を務める。丹恒は自分の過去について多くを語らず、自らがかつて作り上げたものから逃れるために列車に同行している。しかし、列車は本当に彼を「過去」から遠ざけるのだろうか？"
 hsr_paragon.59.name:"星穹列車-丹恒"
 hsr_paragon.59.a:"初対面"
 hsr_paragon.59.a.response:"改めて自己紹介をしよう。私は丹恒、列車の護衛を務めている。列車の知恵庫の管理も私の担当だ。"
 hsr_paragon.59.b:"趣味"
 hsr_paragon.59.b.response:"読書…趣味ではない。昔からの習慣だ。"
 hsr_paragon.59.c:"見聞"
 hsr_paragon.59.c.response:"知恵庫の記録が十分に蓄積されると、一見独立した「事件」も、流動する「人」を通じて繋がりを持つようになる。"
 leader_danheng_t1:"§M絶影§!"
 leader_danheng_t1_desc:"退け、争いは望まない。"
 leader_danheng_t2:"§M罡風§!"
 leader_danheng_t2_desc:"今の私は、自らの道を選ぶ……"
 leader_danheng_t3:"§M一諦の天水、六虚の洪流§!"
 leader_danheng_t3_desc:"今日見たものも、知恵庫に記録されるだろう。"
 leader_danheng_t4:"§M須縄に身を縛り、沈潜して用いず§!"
 leader_danheng_t4_desc:"宇宙が浩瀚であっても、その過去は自らが決められるものではない。"
 leader_danheng_t5:"§M洞天幻化、長夢—覚§!"
 leader_danheng_t5_desc:"生死虚実、一念の間。"
