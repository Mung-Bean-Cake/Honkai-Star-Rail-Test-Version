 building_Education_Base:0"科普組織"
 building_Education_Base_desc:0"要するに、十三進法を使うか、脳の処理速度が我々の十分の一しかない生物を教育するのは非常に難しい。しかし我々はそれができる。なぜなら我々は星間平和会社だからだ。"
