 d_cunhu_huangyu_1_slot_desc:"喜びと共に成長する生命に満ちた世界。人々の眠りの笑顔を守る。"
 concept_d_cunhu_huangyu_1_slot:"美夢の辺境"
 concept_d_cunhu_huangyu_1_slot_desc:"—住宅：§G+1000§!$TABBED_NEW_LINE$—快適度：§G+1000§!$TABBED_NEW_LINE$—ポスト生産の結束力：§G+5%§!$TABBED_NEW_LINE$—ポスト生産の交易：§G+5%§!"
 tr_cunhu_huimie_1:"§B不沈の巨艦§!"
 tr_cunhu_huimie_1_flavor:"あなたは美しい夢を見る。三つの太陽の下で友人と杯を交わし、偉大な平和を祝う！天穹を覆うドームが惑星を抱きしめ、灼熱の光と熱を遮る——あなたが設計した傑作。しかし、夜明けと共にそれが崩壊するのを目の当たりにする。崩壊、悲鳴、超新星のガンマ線バースト——あなたの目、手、体内のすべての細胞が悲鳴を上げる。悪徒たちは大気に点火し、二百九十琥珀紀にわたってそびえ立っていた塔は灰燼に帰す。死の病菌はスメア星環の氷晶の上で踊る。あなたは誓う、彼らに倍返しをさせると。あなたは筆で星河を燃やす巨艦を描く。その砲火は夜の悪意を焼き払い、愛するすべてが廃墟と化す前に、敵に必要な破壊をもたらす。"
