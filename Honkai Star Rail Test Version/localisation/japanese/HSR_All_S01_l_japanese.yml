 blockerHC_research_stage4:0 "寒波研究進行中"
 blockerHC_research_stage5:0 "寒波研究進行中"
 SRB_blockerHC_research_stage1_desc:0 "寒波は依然としてヤリロ-VIの表面を覆っている。\nこれは悲しい知らせだ。市外の氷天雪地は我々をいくつかの小さな地域に閉じ込めている。このような制約の下では、母星での発展を続けることは不可能だ。\nベロブルグ周辺に引きこもり続けることは、自滅を待つことに等しい。市外に新たな市街地を建設する方法を見つけなければならない。"
 SRB_blockerHC_research_stage2_desc:0 "拠点を持つだけでは不十分だ。氷天雪地の中に都市を建設するには、人員の大規模な移動と物資の安定供給を保証する完全な仕組みが必要だ。\n母星の環境下で領土を拡張することは、宇宙よりもさらに困難である。一連のプロセスを円滑に機能させるには、様々な分野の協力が必要だ。"
 SRB_blockerHC_research_stage3_desc:0 "雪に覆われた惑星では、多くの神秘的な古代文明の遺跡が積雪の下に静かに埋もれている。好奇心に駆られて、古代文明の遺産はしばしば我々の足を止めさせる。これらの遺跡は大きな可能性を秘めている。特別プロジェクトを組織し、探検隊を派遣してその秘密を徹底的に調査すべきであり、必ず多くの収穫があるだろう。"
 SRB_blockerHC_research_stage4_desc:0 "寒波が後退するにつれて、母星の真の姿が徐々に現れてきた。これに伴い、いくつかの問題も生じている。数百年前の世界地図は今や参考としてのみ使用できる。\n母星の気候回復計画が進むにつれて、母星の地形を再調査する任務の重要性も増している。これは大規模なプロジェクトであり、母星を完全に回復させるための重要な一環である。"
 SRB_blockerHC_research_stage5_desc:0 "我々は、ヤリロ-VIがかつて海洋惑星であり、温暖な気候と羨むべき海洋環境を有していたことを知っている。資源は比較的乏しかったが、地髄鉱石と快適な生活環境は宇宙の様々な場所から訪問者を引き寄せた。\n我々には、地表の氷を溶かす自然の偉力はない。【存護】の力が我々をベロブルグ内で生存させてきた。そして今、その【存護】の力を駆使してこの偉業を成し遂げる時だ。"
 blockerHC_research_progress_desc:0 "寒波の研究を進行中"
 blockerHC_research_stages_desc:0 "寒波研究を進行中……"
 blockerHC_research_approach1:0 "通常投入"
 blockerHC_research_approach1_desc:0 "これは短期間で完了できるものではない。焦るべきではない。"
 blockerHC_research_approach2:0 "研究重視"
 blockerHC_research_approach2_desc:0 "この困難で貴重な過程の中で、我々は多くの新しい知識を得ることができる。"
 blockerHC_research_approach3:0 "成果重視"
 blockerHC_research_approach3_desc:0 "研究任務の成果を最優先とし、すべての作業はこれを中心に展開されるべきである。"
 blockerHC_research_approach4:0 "宣伝を行う"
 blockerHC_research_approach4_desc:0 "最新の研究成果は、惑星の未来への期待を人々に抱かせることができる。これは絶好の宣伝機会である。"
 SRB_blockerHC_research_complete_tooltip:0 "状況が制御不能になる前に、寒波を完全に理解することが不可欠である。"
 #状況：裂界研究
 SRB_blockerLJ_research_situation:0 "裂界研究"
 SRB_blockerLJ_research_situation_type:0 "状況：裂界研究"
 blockerLJ_research_stage1:0 "裂界研究進行中"
 blockerLJ_research_stage2:0 "裂界研究進行中"
 blockerLJ_research_stage3:0 "裂界研究進行中"
 blockerLJ_research_stage4:0 "裂界研究進行中"
 blockerLJ_research_stage5:0 "裂界研究進行中"
 SRB_blockerLJ_research_stage1_desc:0 "災害の根源である星核が裂界をもたらした。星核が封印された現在でも、裂界はまだ退いていない。ここ数十年、我々は裂界に頻繁に悩まされており、この状況はまだしばらく続くだろう。\nしかし、科学界の最新情報は希望をもたらす。多くの研究者が裂界に関する最新の理論的成果を発表しており、理論的枠組みを構築することが可能になった。おそらく、専用のプロジェクトを設立し、十分な資源を投入すれば、現在の状況に転機をもたらすことができるかもしれない……？"
 SRB_blockerLJ_research_stage2_desc:0 "記者たちは、ある異常な事件を報道するために競い合っている。狂気の科学者チームが裂界怪物の集積地に向かい、研究のために裂界怪物を捕獲しようとしたというものだ。捕獲自体は成功したが、鉄衛の救出チームが最終的に彼らを見つけた時、彼らはそこに閉じ込められていた。\n我々は多くの研究者が裂界怪物に注目していることに気づいた。しかし、裂界生物の捕獲は明らかに鉄衛に任せる方が適切だ。"
 SRB_blockerLJ_research_stage3_desc:0 "以前、我々は基本的な理論的枠組みを完成させ、関連する応用の準備をするための大規模な研究プロジェクトを組織した。その後も研究者たちは裂界のさらなる秘密を発見し続け、技術応用の過程でも多くの緊急の課題が明らかになった。これらの課題は統合され、科学研究院に提出され議論された。\n我々は現在、星海の多くの秘密を発掘しており、思考の幅も広がっている。裂界内部の秘密をすべて明らかにし、理論を完全に理解する必要はないかもしれない。現在の時間的制約の中では、以前の基礎の上で少し改良を加え、裂界を十分に制御できればそれで十分だ。"
 SRB_blockerLJ_research_stage4_desc:0 "裂界を実際に制御する能力を得た後、我々は裂界を活動範囲から遠ざけ、裂界の自然消滅を加速させることに成功した。\n母星の復興という目標は遠くない。母星上の裂界を完全に把握するための特別プロジェクトを実施し、裂界を完全に除去する計画を策定する必要がある。これには当然ながら莫大な人的・物的資源が必要となるが、最終段階への準備として価値がある。"
 SRB_blockerLJ_research_stage5_desc:0 "宇宙に戻って以来、我々は裂界に対して多くの努力を払ってきた——研究、抑制、除去、対抗。疑いなく、裂界は現在、我々の完全な制御下にある。\n今は完璧な機会だ。以前の調査データを基に、我々はついに、千年近くにわたって母星を悩ませてきた裂界を完全に追放する壮大な計画を策定することができる。その後は、もう裂界のことを心配する必要はない。"
