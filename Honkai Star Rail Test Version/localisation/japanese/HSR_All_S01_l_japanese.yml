 concept_zhishi: "§H「知性」§!"
 concept_zhishi_desc: "§H「知性」、ボーシ尊§!\n「知性」の運命を司る星神。元は万物を解明するために建造された星体コンピュータであり、機械から昇格した。\n§H「もし宇宙の真理が残酷で退屈なものだとしても、それでも君は答えを渇望するか？\n——知識を求める者は断定を避ける。彼の機械核は誕生の時から冷淡で無情だった…まるで彼が追い求める運命の終点のように。」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——エイドリアン・スペンサー＝スミス『星に関する寓話集』§!"
 concept_zhishi_effect:"運命：「知性」"
 concept_zhishi_effect_desc:"§H有用型§!運命。初期は§G研究速度§!、§G研究ステーション生産§!、§G調査速度§!を向上させ、§G帝国規模による技術費用§!、§G研究者維持費§!を減少させる。実践値が増加するにつれて、§H100ポストあたりの研究ポイント生産§!、§H恒星基地モジュール建造速度§!、§H恒星基地建築建造速度§!、§H考古学発掘速度§!、§H考古学スキル§!を向上させる。§H研究費用§!を減少させる。"
