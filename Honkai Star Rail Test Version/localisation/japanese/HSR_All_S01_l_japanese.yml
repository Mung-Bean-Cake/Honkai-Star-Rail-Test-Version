 #アスター
 NAME_aisida:"アスター"
 aisida_catch_phrase:"来たな。前に調整した観測アレイの結果が出たはずだ。一緒に見に来ないか？"
 aisida_backstory:"好奇心と活力に満ち溢れた少女。宇宙ステーション「黒塔」の名目上の所長。様々な意見を持つ研究員の管理から、博識学会の様々な難題に直接かつ礼儀正しく対応することまで、アスターにとっては朝飯前だ。だって宇宙ステーションを指揮するのは……家業を継ぐより簡単だからな！"
 hsr_paragon.3.name:"宇宙ステーション「黒塔」-アスター"
 hsr_paragon.3.a:"初対面"
 hsr_paragon.3.a.response:"やあ、開拓者。私は宇宙ステーション「黒塔」の所長、アスターだ。君の助けが必要な時は必ず言うから……遠慮はしないぞ。"
 hsr_paragon.3.b:"趣味"
 hsr_paragon.3.b.response:"継続的に資金を宇宙ステーションの建設に投入し、職員の福利厚生を充実させ、好循環を生み出し、同時に所長、すなわち私自身の必要な買い物欲も満たすこと。"
 hsr_paragon.3.c:"見聞"
 hsr_paragon.3.c.response:"監視室でさえ、監視下にあるのだ。"
 leader_aisida_t1:"§M流星群§!"
 leader_aisida_t1_desc:"星々の祝福を受けよ~\n§B星系探索、遺跡発掘、裂孔探索を完了するたびに、§R流星§!を1ポイント追加する§!"
 leader_aisida_t2:"§M星空の祝言§!"
 leader_aisida_t2_desc:"星々の神秘の鍵を渇望する者よ、開拓者たちに真の祝福を授けん！\n$leader_aisida_t2_effect_desc$"
 leader_aisida_t2_effect_desc:"§B内閣にいる時、各§R流星§!はポスト生産のエネルギー貨を0.5%、ポスト生産の貿易を0.5%、亜光速速度を1%、ワープエンジン範囲を1%提供する§!"
 leader_aisida_t3:"§M天象学§!"
 leader_aisida_t3_desc:"隙を見せたな~\n$leader_aisida_t3_effect_desc$"
 leader_aisida_t3_effect_desc:"§B各§R流星§!は惑星/星域のポスト生産研究ポイントを2%/1%提供する§!"
 leader_aisida_t4:"§M閃き§!"
 leader_aisida_t4_desc:"幸運なのは誰かな~"
 leader_aisida_t5:"§Mスペクトル光線§!"
 leader_aisida_t5_desc:"星々は我々の名を刻むだろう。"
