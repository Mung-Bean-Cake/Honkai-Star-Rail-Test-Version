 #ブラックスワン
 NAME_heitiane:"ブラックスワン"
 heitiane_catch_phrase:"「生命は迂回する迷宮であり、記憶以外に我々は何も持っていない。」"
 heitiane_backstory:"「流光憶庭」の憶者。神秘的な優雅な占い師。常に優しい微笑みを浮かべ、他人の言葉を辛抱強く聞き、それによって「記憶」に入り込み、全情報を把握する。唯一無二の記憶を収集することに熱心だが、その背後にある考えは読み解くことが難しい。"
 hsr_paragon.39.name:"ピノコニー-ブラックスワン"
 hsr_paragon.39.a:"初対面"
 hsr_paragon.39.a.response:"開拓者？面白い名前ですね。それに、読み解くのが難しい運命。"
 hsr_paragon.39.b:"趣味"
 hsr_paragon.39.b.response:"もし誰よりも先に記憶を察知し、収集することができれば、その一人で鑑賞する時間は、私にとって最も愛おしい、唯一無二の思い出です。"
 hsr_paragon.39.c:"見聞"
 hsr_paragon.39.c.response:"他人の頭脳にこっそり侵入し、記憶を好き勝手に改ざんする憶者もいます…しかし私はそれが全く好きではありません。他人に改ざんされていない記憶だけが真にリアルで貴重なのです。そうでなければ、それは誰かがあなたの頭の中に差し込んだ思想に過ぎませんから。"
 leader_heitiane_t1:"§M失墜、偽神の黄昏§!"
 leader_heitiane_t1_desc:"『これらの「記憶」を見るために、私はどのような代償を払うのだろうか？』『あなたが姿を現すことを望むまでは、人々はあなたの存在を知ることはない。』『人々が黒い白鳥を見るまでは、白鳥が白だけではないことを知らなかったように？』『そのように。』"
 leader_heitiane_t2:"§M無端なる運命の機杼§!"
 leader_heitiane_t2_desc:"「人々は自分が現在と未来に向き合っていると思っているが、実際には誰もが過去へと向かっていることに気づいていない。」"
 leader_heitiane_t3:"§M涙、また贈り物§!"
 leader_heitiane_t3_desc:"「しかし、夢もまた記憶の一形態だ。あの記憶盗人や焚き火師が来る前に、私は深淵へと潜り、残骸を一目見よう。」"
 leader_heitiane_t4:"§M彼方の腕に酔いしれて§!"
 leader_heitiane_t4_desc:"既定の軌跡が現れた。"
 leader_heitiane_t5:"§M時を再塑する記憶§!"
 leader_heitiane_t5_desc:"静かな水面の下には…果てしない深淵がある。"
