 DOT_SR_Dvalin.101.name:"Вселенная до янтарной эпохи"
 DOT_SR_Dvalin.101.desc:"Вселенная находилась в диком и бурном древнем периоде, который более поздние историки назвали эпохой древних зверей; тогда звёздное море не было умиротворено, порядок не установлен, обширная вселенная была во власти огромных и первобытных древних зверей сумерек, жизнь была редка, миры погружены в хаос и запустение; в этот период ещё не было зрелых цивилизационных систем и межзвёздных правил, древние звери с врождённой силой бродили по морю звёзд, пожирая зарождающиеся звёзды и жизненную силу вселенной. В это время родились первые Эоны вселенной: Равновесие, Алчность, Порядок, Бессмертие и другие, причём Эон Алчности Оборос сам был мутировавшим древним зверем, став символом старой гегемонии; с постепенным зарождением первых цивилизаций, конфликт между жизнью и древними зверями перерос в Сумеречную войну, охватившую всё море звёзд; война длилась бесконечно, зарождающиеся цивилизации отступали, оказавшись на грани гибели, жизненная сила вселенной почти иссякла. Пока... Он не явился с божественной силой, чтобы положить конец затяжной войне, защитить оставшиеся миры и жизнь, окончательно покончив с дикой эпохой древних зверей. Кто Он?"
 DOT_SR_Dvalin.101.a:"Акивили!"
 DOT_SR_Dvalin.101.b:"Повелитель лука!"
 DOT_SR_Dvalin.101.c:"Химеко Мунато!"
 DOT_SR_Dvalin.101.d:"Хэйта!"
 DOT_SR_Dvalin.101.e:"Скруллум!"
 DOT_SR_Dvalin.101.f:"Это должен быть я! В бескрайней вселенной мы можем положиться только на себя!"

 #Районы
 district_train_planet_1:"Центральный вагон поезда"
 district_train_planet_1_desc:"Основное место хранения вычислительных блоков поезда"
 district_train_planet_2:"Вагон-вечеринка"
 district_train_planet_2_desc:"Прежнее название «Конференц-вагон», теперь переименован в «Вагон-вечеринка». В основном используется как столовая и бар, также для собраний и настольных игр, хотя вечеринок там никогда не проводилось."
 district_train_planet_3:"Смотровой вагон"
 district_train_planet_3_desc:"Строго говоря, название «Смотровой вагон» кажется не совсем точным. Ведь во многих вагонах есть окна, и все они могут служить для «обзора». Но поскольку этот вагон часто используется для приёма гостей — возможно, именно эти разнообразные гости и являются «пейзажем» вагона."
 district_train_planet_4:"Спальный вагон"
 district_train_planet_4_desc:"Говорят, в эпоху расцвета Звёздного экспресса было несколько десятков таких пассажирских вагонов. Возможно, когда-нибудь экспресс вернёт себе былую славу."
 district_train_planet_5:"Последний вагон"
 district_train_planet_5_desc:"В обычных «освоительных» путешествиях члены экипажа используют безопасные спускаемые капсулы для высадки в заданных координатах; в нестандартных путешествиях Звёздный экспресс отделяет последний вагон как спускаемую капсулу, снабжённую достаточными ресурсами, чтобы Безымянные странники могли использовать вагон как убежище после посадки. Согласно записям, проводник «Взлохмаченный» Боб многократно использовал такой метод посадки, и процент возврата вагонов составил всего 42,4%, а все возвращённые требовали капитального ремонта... С тех пор такой метод посадки был строго запрещён проводником и используется только в крайних случаях как «резервный план»."
 district_train_planet_1_plural:"Центральные вагоны поезда"
 district_train_planet_2_plural:"Вагоны-вечеринки"
 district_train_planet_3_plural:"Смотровые вагоны"
 district_train_planet_4_plural:"Спальные вагоны"
 district_train_planet_5_plural:"Последние вагоны"
