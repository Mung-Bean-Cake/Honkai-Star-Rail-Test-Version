 pc_astral_express:"Звёздный экспресс"
 pc_astral_express_desc:"После короткой остановки Звёздный экспресс снова пересечёт звёздное море. Слушайте, гудок уже звучит увертюру к путешествию. Новые миры, новые жизни, новые истории ждут остановки первопроходцев. Готовы ли вы отправиться в новое «Освоение»? Скачок скоро начнётся, приготовьтесь, 3, 2, 1... Следующая станция: Галактика!"
 origin_Astral_Express:"Звёздный экспресс"
 origin_Astral_Express_desc:"У-у, сидите рядком, не стойте, осторожно при прыжке; У-у, пристегните ремни, всегда держите их при себе, в вагоне-ресторане не играйте в карты!"
 origin_tooltip_Astral_Express_effects:"После гибели Эона Освоения Акивили его волю освоения унаследовали последователи «Безымянные странники», включая Звёздный экспресс, на котором он путешествовал; однако «Рак межмировья» беспрепятственно распространялся, и серебряные рельсы, на которых покоился поезд, не избежали этого; ещё до прихода болезни поезд уже двигался с трудом; когда путь был завален, пришлось незаметно остановиться; так прошли годы, никто не знал, сколько времени прошло, пока рыжеволосая девушка не встретила заброшенный поезд; её привлекли безмолвные истории, оставленные между двигателем и серебряными рельсами, она потратила время на заполнение трещин, сглаживание износа, обновила поезд сверху донизу; затем любопытная девушка вошла в вагон и начала своё путешествие по освоению вселенной; Звёздный экспресс останавливался на станциях, пассажиры сменялись, люди присоединялись к путешествию и покидали его; путешественники из разных миров, несущие разное прошлое, стремящиеся к разным конечным точкам, но пока они находятся в поезде, они разделяют одно и то же путешествие; поэтому, даже если пассажиры имеют свои мысли, а некоторые и коварные замыслы, поезд и Химеко не обращают на это внимания — пока кто-то готов отправиться в совместное приключение, двери поезда щедро открываются для них."
 Star_Rail_start_screen_messages:"После короткой остановки Звёздный экспресс снова пересечёт звёздное море. Слушайте, гудок уже звучит увертюру к путешествию. Новые миры, новые жизни, новые истории ждут остановки первопроходцев. Готовы ли вы отправиться в новое «Освоение»? Скачок скоро начнётся, приготовьтесь, 3, 2, 1... Следующая станция: Галактика!"
 Astral_Express_start_screen_messages:"У-у, сидите рядком, не стойте, осторожно при прыжке; У-у, пристегните ремни, всегда держите их при себе, в вагоне-ресторане не играйте в карты! После гибели Эона Освоения Акивили его волю освоения унаследовали последователи «Безымянные странники», включая Звёздный экспресс, на котором он путешествовал; однако «Рак межмировья» беспрепятственно распространялся, и серебряные рельсы, на которых покоился поезд, не избежали этого; ещё до прихода болезни поезд уже двигался с трудом; когда путь был завален, пришлось незаметно остановиться; так прошли годы, никто не знал, сколько времени прошло, пока рыжеволосая девушка не встретила заброшенный поезд; её привлекли безмолвные истории, оставленные между двигателем и серебряными рельсами, она потратила время на заполнение трещин, сглаживание износа, обновила поезд сверху донизу; затем любопытная девушка вошла в вагон и начала своё путешествие по освоению вселенной; Звёздный экспресс останавливался на станциях, пассажиры сменялись, люди присоединялись к путешествию и покидали его; путешественники из разных миров, несущие разное прошлое, стремящиеся к разным конечным точкам, но пока они находятся в поезде, они разделяют одно и то же путешествие; поэтому, даже если пассажиры имеют свои мысли, а некоторые и коварные замыслы, поезд и Химеко не обращают на это внимания — пока кто-то готов отправиться в совместное приключение, двери поезда щедро открываются для них."

