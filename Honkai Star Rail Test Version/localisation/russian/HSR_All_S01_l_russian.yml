 SR_Paragon.101.name:"Скачок: приглашение странника Пути"
 SR_Paragon.101.desc:"Странник Пути: тот, кто идёт по Пути и черпает из него силу. В бескрайней вселенной полно неизведанного и скрытых возможностей. Исследование космоса цивилизацией — это не только прорыв в науке и технике, но и бесконечное расширение духа и мудрости. Сегодня мы стоим на новом рубеже, перед нами открываются невиданные возможности и вызовы. На этом пути к звёздам мы должны пригласить странников Пути — тех бесстрашных и авантюрных людей, чтобы вместе начать это великое путешествие."
