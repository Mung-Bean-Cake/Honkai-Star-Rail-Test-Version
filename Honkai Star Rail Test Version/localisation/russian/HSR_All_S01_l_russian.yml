 DOT_SR_Dvalin.012.name:"Дар Небесного владыки освоения: поезд «Безымянный»"
 DOT_SR_Dvalin.012.desc:"Звёздный экспресс был создан Эоном «Освоения» Акивили как средство для межзвёздных путешествий его и Безымянных странников. Говорят, таких транспортных средств было несколько, но других записей в поезде нет. Когда Химеко обнаружила поезд, его память была повреждена, и много ценной информации было утеряно. Известно только, что поезд действительно был творением Акивили и действительно путешествовал с ним."
