 Pom-Pom_II_MEGASTRUCTURE_DETAILS:"Верховный Пом-Пом: проводник Звёздного экспресса, существующий на поезде с самого начала."
 Pom-Pom_III:"Небесный владыка освоения: Акивили"
 Pom-Pom_III_DESC:"Небесный владыка освоения: Акивили, Эон, управляющий Путём «Освоения», павший Эон, его уход — загадка, но среди всех известных Эонов Акивили был самым близким к людям. В записях библиотеки экспресса он путешествовал и сражался вместе с людьми, праздновал. Как божество, связанное «перводвигателем», Акивили обладал почти человеческой свободой."
 Pom-Pom_III_MEGASTRUCTURE_DETAILS:"Небесный владыка освоения: Акивили. Эон, управляющий Путём «Освоения», павший Эон, его уход — загадка, но среди всех известных Эонов Акивили был самым близким к людям. В записях библиотеки экспресса он путешествовал и сражался вместе с людьми, праздновал. Как божество, связанное «перводвигателем», Акивили обладал почти человеческой свободой."

