 #civic_Happy_Org_desc:0""

 civic_Idol_Institution:0"§BИнститут звёздных идолов§!"
 civic_Idol_Institution_desc:0"§M«1. Скульптура, которой поклоняются и почитают; символический объект, обладающий таинственной силой в сердцах людей.»\n«2. Объект слепого поклонения, особенно традиционная вера или идеал.» — «Галактический словарь»§!\n\n§WЕщё до того, как наш вид покинул родную систему, культура идолов процветала на нашей планете, появляясь во всех сферах общества. Теперь идолы полетят с нами в космос, излучая свет, как звёзды, на всю галактику."
 Civic_Idol_Institution_desc2:0"§YОткрывает две взаимоисключающие продвинутые идеи: Хранители мечты, Идолы в тени, доступные через 50 лет после выбора этой идеи.\nОткрывает новое торговое действие: §CВыступление идолов§!, дающее сильные бонусы к комфорту и счастью.\nОткрывает £building£здание филиала§CАгентство идолов§!, предоставляющее множество £job£§Cспутниковых идолов§! должностей, производящих много §C£amenities£ комфорта§!, §C£happiness£ счастья§! и §C£trade_value£ бонус к торговой стоимости§!, а также дающее бонусы к £job£должностям идолов§C£unity£ единства§!, §C£energy£ энергии§!, §C£society£ социологического исследования§!.\nКроме того, открывает здания на наших планетах, дающие должности идолов и стажёров.\n§!§!§!§!"
 civic_DarkIdol_Institution:0"§BИдолы в тени§!"
 civic_DarkIdol_Institution_desc:0"§R【Продвинутая идея】§!\n§M«Мистер Альберт, не надо больше бежать!» — увещевание психического идола своему фанату-водному§!\n\n§WПосле выхода в галактику наша индустрия идолов пошла по странному пути: среди идолов появились различные тёмные или таинственные проблемы — коррупция, закулисные сделки, героические идолы, подписавшие контракт с Кхорном и сражающиеся на полях битв, психические идолы в прямом эфире исследуют Пустоту, идолы-сверхлюди, разблокировавшие генные замки, киберидолы, загрузившие сознание и напрямую взаимодействующие с каждым фанатом... С нашими идолами явно что-то не так. Но никто не может отрицать, что этот хаос создал невероятно блестящую культуру и торговую ценность, и его тьма принесла новый свет Пути Сохранения.§!§!"
 Civic_DarkIdol_Institution_desc2:0"§YУсиливает £job£§Cдолжности идолов§!, давая больше £energy£, £unity£, £society£, £trade_value£, £happiness£, £amenities£, а также даёт планете §Cскорость роста населения§! и £crime£§Rпреступность§!\nУсиливает £building£§Cздания, связанные с идолами§!, давая больше £job£§Cдолжностей идолов§!, больше §Cмодификаторов§!\nВключает сильное здание сюзерена £building£§CЗона проживания идолов§!, дающее вассалу £job£§Cспутниковых идолов§!, £stability£, быстро растущий £loyalty£, даёт сюзерену £influence£"
 civic_LightIdol_Institution:0"§BХранители мечты§!"
 civic_LightIdol_Institution_desc:0"§R【Продвинутая идея】§!\n§M«Почему межзвёздная мирная идол-группа божественна? Во-первых...» — «Путь Сохранения»§!\n\n§WВыйдя в галактику, наша культура идолов продолжала развиваться и достигла сегодняшнего уровня — в каждом уголке галактики, от планет Гайя до идеальных городов, от нежити до морских звёзд, все существа любят наших идолов, вкладывая свои желания и эмоции в идолов за многие световые годы. Коммерческая ценность, положительные эмоции и даже психическая энергия, возникающие от этого, внесли огромный вклад в Путь Сохранения. Сделаем ещё шаг: идолы под эгидой компании станут ещё ярче, ещё прекраснее, защищая мечты фанатов своими песнями и феромонами!§!§!"
 Civic_LightIdol_Institution_desc2:0"§YУсиливает £job£§Cдолжности идолов§!, давая больше £energy£, £unity£, £society£, £trade_value£, £happiness£, £amenities£, а также даёт планете §Cбонус к производительности труда§!\nУсиливает £building£§Cздания, связанные с идолами§!, давая больше £job£§Cдолжностей идолов§!, больше §Cмодификаторов§!\nВключает сильное здание сюзерена £building£§CГалактическая концертная сцена§!, дающее вассалу £job£§Cспутниковых идолов§!, £amenities£ и £happiness£, увеличивающее £loyalty£, даёт сюзерену £influence£§!"

 civic_Stability_Keeper:0"§BПротокол коммерческой стабильности§!"
 civic_Stability_Keeper_desc:0"§M«Стабильность превыше всего.» — «Избранные афоризмы жителей Маяка»§!\n\n§WМы считаем, что стабильность — необходимое условие прогресса любой цивилизации, без стабильной среды сложно добиться развития. Но для многих цивилизаций стабильность остаётся недостижимой — это обычно связано с их социальным устройством, иногда с их биологической природой.\nРади всеобщего Сохранения мы предоставим стабильность как чудесный товар избранным цивилизациям, чтобы их народы могли творить счастливое завтра в безопасности — конечно, это стоит денег.§!"
 Civic_Stability_Keeper_desc2:0"§YОткрывает две взаимоисключающие продвинутые идеи: Блаженные хранители, Соглашение о мирном завтра, доступные через 50 лет после выбора этой идеи.\nОткрывает новое торговое действие: §CУслуги по поддержанию стабильности§!, дающее сильный бонус к стабильности.\nОткрывает £building£здание филиала§CКоммерческая группа стабильности§!, дающее высокий £stability£, §Cпривлекательность主流思潮§! и множество £job£§Cдолжностей§!, снижающее £crime£, и дающее бонус к £stability£ и §Cпривлекательности主流思潮§! на всех наших планетах.§!"
 civic_Stability_Keeper_Wild:0"§BБлаженные хранители§!"
 civic_Stability_Keeper_Wild_desc:0"§R【Продвинутая идея】§!\n§M«Мир — это не идеал, не мечта, это желание миллионов.» — Ба Цзинь§!\n\n§WВступив в межзвёздное общество, бизнес Межзвёздной мирной корпорации стремительно развился, приняв новые формы.\nВ бесчисленных соглашениях и переговорах мы глубже осознали свой долг и суть нашего товара.\nМы для цивилизаций галактики — словно родители для детей (примечание: чтобы избежать конфликтов мировоззрений, здесь следует добавить сотни вариантов полов). Мы дарим им мир и стабильность, как родители дают детям уютный и счастливый дом. Мы будем молча оберегать их рост, как галактические опекуны, защищая будущее всей галактики теплом и силой.§!"
 civic_Stability_Keeper_Wild_desc2:0"§YУсиливает £building£здание филиала§CКоммерческая группа стабильности§!, давая больше §Cснижения расходов на потребительские товары населения§!, £stability£, £happiness£ и £trade_value£\nВключает сильное здание сюзерена, дающее вассалу £stability£ и £happiness£ в зависимости от численности гарнизона, увеличивающее £loyalty£§!"
 civic_Stability_Keeper_Quick:0"§BСоглашение о мирном завтра§!"
 civic_Stability_Keeper_Quick_desc:0"§R【Продвинутая идея】§!\n§M«Так называемый мир — это всего лишь время между двумя войнами.» — Лу Синь§!\n\n§WС тех пор как мы вышли в космос, в нашей компании сменилось несколько поколений. Наше поколение обнаружило, что будущее не так прекрасно, как представляли предки — впереди бесконечные ресурсы, бесчисленные возможности и красоты, но также и 【Уничтожение】, уже раскрывающее когти. Ради 【Сохранения】 будущих поколений и, возможно, нас самих до того времени, мы должны как можно быстрее развиваться, а для этого необходима среда для стабильного производства, исследований и развития — среда, которую мы будем создавать, завоёвывать и защищать любой ценой.§!"
 civic_Stability_Keeper_Quick_desc2:0"§YУсиливает £building£здание филиала§CКоммерческая группа стабильности§!, давая больше £stability£ и £trade_value£, снижая £crime£\nВключает сильное здание сюзерена, дающее вассалу £stability£ в зависимости от численности гарнизона, быстрее увеличивающее £loyalty£§!"
 civic_Military_Corp:0"§BСвободная торговля открытыми дверями§!"
 civic_Military_Corp_desc:0"§MБогатство — это право обменивать труд.§!\n\nСохранение — наша цель, а торговля — средство её достижения. К сожалению, некоторые бедные цивилизации, боясь неизвестного, отказываются от торговли, и мы не можем дать им полное Сохранение.\nНо наша цель — только Сохранение, и она не зависит от воли сохраняемых. Ради их жизни мы откроем их двери с помощью пушек."
 Civic_Military_Corp_desc2:0"§YОткрывает новое торговое действие: §CВоенная подготовка для бизнеса§!, дающее сильный бонус к боеспособности.§!\n§YОткрывает новое торговое действие: §CУслуги флота VIP§!, дающее бонус к вместимости флота и снижение стоимости обслуживания.§!\n§YОткрывает £building£здание филиала§CВоенный учебный центр§!, дающее §Cначальный опыт армии§!, £defense_army£§Cвойска обороны§! и множество £job£§Cдолжностей§!, а также даёт нам £military_ship£§Cбонус к вместимости флота§!.§!"
 civic_Birth_Org:0"§BОрганизация по стимулированию рождаемости§!"
 civic_Birth_Org_desc:0"§M«В мире много чудес, но человек чудеснее всех.» — Лефокс§!\n\n§WВ нашем мире население — бесспорная первая производительная сила: больше людей рождает более великие идеи, передовые знания и богатство ресурсов, это основа процветания галактики и ключ к её 【Сохранению】 от бедствий. Исходя из такого понимания, мы, Межзвёздная мирная корпорация, предлагаем услуги по стимулированию рождаемости всем клиентам!§!\n§gА что касается новых людей, родившихся и не нашедших работы? Они могут работать на нас.§!§!"
 Civic_Birth_Org_desc2:0"§YОткрывает £building£здание филиала§CСладкие родильные учреждения§!, дающее высокий £pops£§Cбонус к скорости роста населения§! и множество £job£§Cдолжностей§!, а также даёт нам бонус к £pops£§Cскорости роста населения§! на всех планетах.§!"
 civic_Enviroment_Corp:0"§BГруппа по улучшению окружающей среды§!"
 civic_Enviroment_Corp_desc:0"§M«Как вы смеете!» — строитель идеального города, возражающий против попыток сохранить естественную среду§!\n\n§WРазные существа привыкли к разной среде, и мы создаём для клиентов ту среду, которая им нужна. Обеспечить более комфортное существование галактических существ — это тоже соответствует Пути Сохранения. Конечно, эта услуга платная.§!"
 Civic_Enviroment_Corp_desc2:0"§YОткрывает £building£здание филиала§CОрган по улучшению среды§!, дающее небольшой £pops£§Cбонус к скорости роста населения§!, множество £job£§Cдолжностей§! и §Cобитаемость§!, а также даёт нам бонус к £pops£§Cскорости роста населения§! и §Cобитаемости§! на всех планетах.§!"
 civic_Labour_Corp:0"§BКомпания по надзору за трудом§!"
 civic_Labour_Corp_desc:0"§M«Просыпайся, пора нести керамические бронеплиты.» — «Строитель идеального города»§!\n\n§WСохранение само по себе не приходит легко и радостно, наоборот, путь Сохранения часто полон трагедий, тяжёлого труда и жертв. Только когда вся галактика будет работать эффективно, мы сможем достичь наших идеалов — Межзвёздная мирная корпорация. Для этого мы предлагаем платным клиентам услуги по повышению эффективности труда и надзору за работой. Почему мы можем продавать это как товар? Потому что у нас есть уникальная теория...§!"
 Civic_Labour_Corp_desc2:0"§YОткрывает £building£здание филиала§CОрган надзора за трудом§!, дающее множество £job£§Cдолжностей§! и £job£§Cбонус к производительности труда§!, а также даёт нам бонус к £job£§Cпроизводительности труда§! на всех планетах.§!"
 civic_Upper_Salon:0"§BСалон высшего общества§!"
 civic_Upper_Salon_desc:0""
 civic_Slave_Corp:0"§BКомпания по особым активам§!"
 civic_Slave_Corp_desc:0"§M«Свобода — это рабство.» — Оруэлл§!\n\n§WНекоторые существа не признаются обладающими свободной волей и свободой, они считаются инструментами, материалами, роботами — почему они стали активом, нас не касается, мы лишь предоставляем клиентам услуги по повышению ценности таких активов, чтобы сделать действительно ценных клиентов ещё более ценными, помогая нам двигаться вперёд на пути Сохранения.§!"
 Civic_Slave_Corp_desc2:0"§YОткрывает £building£здание филиала§CПредприятие по управлению активами§!, дающее множество £job£§Cдолжностей§! и £slavery£§Cбонус к производительности рабов§!, а также даёт нам бонус к £slavery£§Cпроизводительности рабов§! на всех планетах.§!"
 civic_Breu_Corp:0"§BПротокол низового управления§!"
 civic_Breu_Corp_desc:0"§M«Власть не терпит пустоты.» — ???§!\n\n§WВ межзвёздную эпоху управление огромным населением и обширными территориями — повсеместная проблема, и мы, решив эту проблему, можем предложить соответствующие услуги заказчикам.\nКонечно, клиенты могут не доверить управление государством нам напрямую, поэтому в этом есть свои тонкости...§!"
 Civic_Breu_Corp_desc2:0"§YОткрывает £building£здание филиала§CКомпания по делегированному управлению§!, дающее множество £job£§Cдолжностей§! и £empire_modifier£§Cлимит административного управления§!, а также увеличивающее наш £empire_modifier£§Cлимит административного управления§!.§!"
 civic_Market_Socialism:0"§BРыночный социализм§!"
 civic_Market_Socialism_desc:0"§M«В конкуренции личные амбиции часто служат общественному благу.» — «Богатство народов»§!\n\nЗа долгий рост наша цивилизация превратилась в форму, более соответствующую требованиям Пути Сохранения — форму, которую мы называем рыночным социализмом. У нас отрасли находятся в коллективной собственности рабочих, но при этом конкурируют друг с другом, стимулируя жизненную силу."
 Civic_Market_Socialism_desc2:0"§YОткрывает £building£здание филиала§CГруппа трудового арбитража§!, ослабляющее £stability£ на месте, снижающее £happiness£ рабочих и рабов и повышающее их £political_power£, а также увеличивающее £job£производительность труда нашего населения, £happiness£ и £political_power£ по всей стране.§!"
 civic_Liberation_Org:0"§BГалактическая организация освобождения§!"
 civic_Liberation_Org_desc:0""
 civic_Migration_Corp:0"§BМежзвёздное агентство по иммиграции§!"
 civic_Migration_Corp_desc:0"§M«Иммигрируй, когда можешь, побеждают боги и кролики.»§!\n\n§WПраво на свободное передвижение галактических рас также является объектом нашего Сохранения. За долгие годы мы разработали целую индустрию, поощряющую иммиграцию, способствующую местным жителям переезжать в желаемые регионы и снимающую демографическое давление с принимающей стороны.§!"
 Civic_Migration_Corp_desc2:0"§YОткрывает £building£здание филиала§CИнопланетное иммиграционное агентство§!, увеличивающее £housing£, £amenities£ потребление и §Cстимулы к выезду§!, а также дающее нам бонус к §Cросту населения за счёт иммиграции§!, §Cпривлекательности для иммиграции§! и снижение §Cстоимости покупки рабов§!.§!"
 civic_Charity_Org:0"§BГалактическая благотворительная организация§!"
 civic_Charity_Org_desc:0"§M«Дарите розы, и в руках останется аромат.»§!\n\n§WМы всегда помним: прежде чем быть «компанией», мы — последователи Сохранения. Чтобы сохранить жителей галактики, мы посвятим свои силы, используя наше богатство на благо жителей других планет, что принесёт нам хорошую репутацию и высокий моральный дух.§!"
 Civic_Charity_Org_desc2:0"§YОткрывает £building£здание филиала§CБлаготворительное учреждение§!, увеличивающее £housing£, £amenities£ и £happiness£, снижающее затраты на £food£, £consumer_goods£ для населения, а также дающее нам бонус к §Cросту населения за счёт иммиграции§!, §Cпривлекательности для иммиграции§!, £unity£ производству.§!"
 civic_Tech_Corp:0"§BНаучно-техническая группа§!"
 civic_Tech_Corp_desc:0"§M«Наука и техника — первая производительная сила.»§!\n\n§WМежзвёздная мирная корпорация опиралась на передовые технологии, чтобы покинуть родную планету, расширить влияние и шире практиковать Путь Сохранения. Мы считаем, что технологии и технический прогресс — это лучший товар, наш козырь. Если наши клиенты готовы платить, мы, конечно, продадим им этот товар.§!"
 Civic_Tech_Corp_desc2:0"§YОткрывает £building£здание филиала§CЗвёздная технологическая компания§!, увеличивающее £research£ производство, дающее множество £job£, а также увеличивающее §Cскорость исследований§! и §Cпроизводительность учёных§! по всей стране.§!"
 civic_Robot_Corp:0"§BГруппа по производству роботов§!"
 civic_Robot_Corp_desc:0"§M«Четвёртый закон: если это не противоречит первым трём, робот должен действовать в интересах компании.»§!\n\n§WЕщё до выхода в космос мы осознали огромный потенциал роботизированного производства и создали теорию, интегрирующую роботов в нашу торговую систему. Теперь мы превратим производство роботов в бизнес и сделаем этот бизнес по всей галактике.§!"
 Civic_Robot_Corp_desc2:0"§YОткрывает £building£здание филиала§CСборочный цех§!, увеличивающее §Cсборку механических популяций§!, дающее должности роботов-специалистов, а также увеличивающее §Cсборку механических популяций§! и §Cпроизводительность роботов§! по всей стране.§!"
 civic_Clone_Corp:0"§BГруппа по биологической сборке§!"
 civic_Clone_Corp_desc:0"§M«»§!\n\n§WНекоторые цивилизации считают клонирование табу, а мы считаем его отличным инструментом. Для цивилизаций с низкой рождаемостью, сокращением населения, дисбалансом полов клонирование — это решение их проблем, и мы продаём этот инструмент, чтобы цивилизации с нехваткой населения могли 【Сохраниться】, а млекопитающие избавиться от бремени беременности.§!"
 Civic_Clone_Corp_desc2:0"§YОткрывает £building£здание филиала§CКлонирующее учреждение§!, увеличивающее §Cбиологическую сборку популяций§!, а также увеличивающее §Cбиологическую сборку популяций§! по всей стране.§!"
 civic_Scientific_Corp:0"§BОрганизация по популяризации науки§!"
 civic_Scientific_Corp_desc:0"§M«Превратить жизнь в научную мечту, а затем превратить мечту в реальность.»§!\n\n§WЕсли дать человеку рыбу, он будет сыт один день; если научить его ловить рыбу, он будет сыт всю жизнь. В конечном счёте, цивилизации могут сохранить себя только сами, а мы дадим им в руки оружие Сохранения. Это оружие — не убивающее орудие, а острый скальпель, рассекающий явления, отсекающий лишнее и находящий суть — научный метод. Это сокровище привело нас туда, где мы сейчас, и теперь мы принесём его всей галактике.§!"
 # Civic_Scientific_Corp_desc2:0"§YОткрывает £building£здание фили