 SR_Paragon_March_7th:"Странник Пути: Март Седьмая"
 SR_Paragon_March_7th_desc:"Живая и озорная девушка, считающая себя увлекающейся всем, чем «должны» увлекаться девушки её возраста, например фотографией. Очнулась ото льда в дрейфующем айсберге, но не помнит своего прошлого. После недолгой печали она решила назвать себя в честь даты своего нового рождения. В этот день родилась «Март Седьмая»."
 SR_Paragon_Himeko:"Странник Пути: Химеко"
 SR_Paragon_Himeko_desc:"Полная приключений учёная, в юности встретила на родине севший на мель Звёздный экспресс. Тогда некое существо внутри поезда показало ей мир за пределами её планеты — вселенную. Спустя годы, когда Химеко наконец восстановила поезд и вышла в звёзды, она поняла, что это только начало. На пути «Освоения» новых миров нужны спутники — даже если они смотрят в разные стороны, они всё равно находятся под одним звёздным небом."

 SR_Paragon_Welt:"Странник Пути: Вальт"
 SR_Paragon_Welt_desc:"Сдержанный и рассудительный бывший лидер «Антиэнтропии», унаследовавший имя «Мир», неоднократно спасал мир от гибели. После инцидента в Санкт-Фонтейне Вальт был вынужден последовать за виновником через звёздные врата. Возможно, он и не ожидал, что его там ждёт новое путешествие и новые спутники."

 SR_Paragon_Kafka:"Странник Пути: Кафка"
 SR_Paragon_Kafka_desc:"В досье Межзвёздной мирной корпорации о Кафке остались только имя и запись «любит коллекционировать пальто». Об этом Охотнике за звёздными ядрами известно немного, только то, что она — один из самых доверенных членов «Раба судьбы» Элио. Чтобы достичь «будущего», предвиденного Элио, Кафка начинает действовать."

 SR_Paragon_Silver_Wolf:"Странник Пути: Серебряный Волк"
 SR_Paragon_Silver_Wolf_desc:"Суперхакер, воспринимающий вселенную как игру. Как бы ни была сложна защита, Серебряный Волк легко её взламывает. Его битва с членом Клуба гениев Скруллумом стала легендой в мире хакеров. Сколько ещё неприступных крепостей ждёт во вселенной? Серебряный Волк с нетерпением ждёт этого."

 SR_Paragon_Acheron:"Странник Пути: Хуанцюань"
 SR_Paragon_Acheron_desc:"Путешественница, называющая себя «Странствующим охотником», настоящее имя неизвестно. Носит длинный меч, странствует по галактике в одиночестве. Немногословна, меч быстр как фиолетовая молния, но сражается только ножнами, не обнажая клинка."

 SR_Paragon_Firefly:"Странник Пути: Светлячок"
 SR_Paragon_Firefly_desc:"Член Охотников за звёздными ядрами, сражается в механическом доспехе «Сэм». Предана миссии, сильна духом. Рождена как оружие для борьбы с роями насекомых, растёт быстрее обычных людей, но жизнь её коротка. Чтобы найти путь к «жизни», она присоединилась к Охотникам, ища способ бросить вызов судьбе."

 SR_Paragon_Jingliu:"Странник Пути: Цзин Лю"
 SR_Paragon_Jingliu_desc:"Бывшая первая мечница Лофу, создательница непобедимой славы Облачных всадников. Теперь её имя стёрто, она стала предателем Сяньчжоу, бредущим по грани демонического состояния."

 SR_Paragon_Ruan_Mei:"Странник Пути: Жуань Мэй"
 SR_Paragon_Ruan_Mei_desc:"Изящная и элегантная учёная, член Клуба гениев #81, специалист в области наук о жизни. Благодаря таланту и упорству привлекла внимание Бошцзуня, в тайном уголке начала исследования и поиски истоков жизни. Была приглашена Хэйтой вместе со Скруллумом и Стивеном для совместной разработки «Симулированной вселенной». В частной жизни очень любит традиционную драму и десерты, интересуется вышивкой."


