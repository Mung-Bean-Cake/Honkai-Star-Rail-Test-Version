 civic_Interastral_Peace_Corporation:0 "§BМежзвёздная мирная корпорация§!"
 civic_Interastral_Peace_Corporation_desc:0 "§R【Тематическая идея】\nЧтобы использовать контент, связанный с Межзвёздной мирной корпорацией, необходимо взять эту идею.\n\n§M«Пока существует обмен, существует Межзвёздная мирная корпорация.»\n\n§WВ далёком будущем, в тот день, когда товарный знак и флаг корпорации появятся в каждом уголке галактики, дети с любопытством спросят у старших, как корпорация достигла нынешнего положения. С чего начать рассказ?\nНачнём с самого начала!\nС цивилизации, верящей в Путь Сохранения, которая, объединившись в мегакорпорацию, разработала двигатель гиперпространства —"
 Civic_Interastral_Peace_Corporation_desc2:0"§YОткрывает несколько новых §Cторговых действий§!, которые дают сильные временные бонусы другой стороне в обмен на нужные ресурсы, их можно увидеть в торговле.§!\n§YОткрывает ряд идей и зданий корпоративных филиалов, некоторые идеи требуют определённых течений. Новые здания филиалов имеют общую черту: они дают другим странам множество £job£§Cдолжностей§!, £stability£§Cсильные эффекты§Y и высокий £trade_value£§Cторговый доход§Y, одновременно принося себе высокий £energy£§Cдоход от филиалов§Y и бесконечно суммируемый £influence£§Cбонус§R.\n\nУ Межзвёздной мирной корпорации есть три основных признака: межзвёздная, мир и корпорация.§W"
