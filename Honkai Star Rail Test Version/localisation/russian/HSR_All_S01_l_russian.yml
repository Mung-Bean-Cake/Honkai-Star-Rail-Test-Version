 #Гибель Акивили
 Akivili:"Акивили"
 Death_of_Akivili:"Гибель Акивили"
 Death_of_Akivili_desc:"Эон, управляющий Путём «Освоения», павший Эон, его уход — загадка, но среди всех известных Эонов Акивили был самым близким к людям. В записях библиотеки экспресса он путешествовал и сражался вместе с людьми, праздновал. Как божество, связанное «перводвигателем», Акивили обладал почти человеческой свободой. На компасе судьбы отмечены три направления: неизведанное, известное и непознаваемое. Можно вынести «неизведанное», но нельзя подчиняться «непознаваемому». Акивили покинул изолированный мир Пегана и постоянно расширял неизведанные границы вселенной, пытаясь найти конец «Древа бытия». Но его судьба была прервана несчастным случаем."

 Death_of_Akivili.500.name:"Гибель Акивили: доклад I"
 Death_of_Akivili.500.desc:"Изолированный мир Пегана был отправной точкой легенды об Эоне Освоения Акивили. Этот мир был полностью изолирован от всех других миров, и эта врождённая изоляция, возможно, и породила сильную волю к освоению, которая в конечном итоге привела его к вознесению в Эоны, и он решительно покинул родину, чтобы отправиться в бескрайнюю вселенную. На его компасе судьбы отмечены три направления: неизведанное, известное и непознаваемое, и он выбрал терпеть неизведанное, но никогда не подчиняться непознаваемому, посвятив свою жизнь исследованию границ бытия и прокладке звёздных рельсов, соединяющих миры."
 Death_of_Akivili.500.a:"Продолжить исследование"
 Death_of_Akivili.501.name:"Гибель Акивили: доклад II"
 Death_of_Akivili.501.desc:"Деяния Акивили полны духа исследования и соединения. Он создал Звёздный экспресс как средство передвижения по звёздному морю, маршрут начинался и заканчивался в его родном мире Пегана, образуя круговое путешествие. Под его руководством Звёздный экспресс двигался не один, а несколько поездов двигались параллельно, входя в многие ещё не освоенные миры, включая Блаженное Небо Эона Памяти Фули. Особенно ценно то, что среди многих Эонов Акивили описывался как самый близкий к человеку, он путешествовал, сражался и праздновал вместе с людьми, его человеческие качества стали его самым ярким символом."
 Death_of_Akivili.501.a:"Боже мой"
 Death_of_Akivili.502.name:"Гибель Акивили: доклад III"
 Death_of_Akivili.502.desc:"Последователи Акивили назывались Безымянными странниками, они путешествовали на Звёздном экспрессе по серебряным рельсам, проложенным Эоном. Проводник — важнейшая роль на поезде, отвечающая за планирование маршрута и заботу о членах экипажа. От раннего проводника-механика Сана-3000 до Капи-Бабы, пережившего Уничтожение вселенной, и до Звездочёта Водзяна, который был свидетелем как гибели Акивили, так и рождения Эона Уничтожения Нанака, они вместе писали историю расцвета и упадка экспресса. Даже после ухода Эона Безымянные странники унаследовали волю к освоению, и проводник Гранхольм в трудные времена привел последних странников, чтобы спасти бесчисленные миры, а Химеко, обнаружив поезд после тысячелетнего отсутствия, восстановила его и снова отправила в путь."
 Death_of_Akivili.502.a:"Интересно"
 Death_of_Akivili.503.name:"Гибель Акивили: доклад IV"
 Death_of_Akivili.503.desc:"Истина о гибели Акивили до сих пор остаётся загадкой. Есть признаки того, что гибель могла произойти в период службы проводника Дорико, а Звездочёт Водзян стал свидетелем одновременно гибели Акивили и рождения Эона Уничтожения Нанака, что предполагает глубокую, но пока неясную связь между ними. Одна из гипотез состоит в том, что Акивили погиб в результате несчастного случая во время поиска конца Древа бытия. Примечательно, что феномен «Рак межмировья» (звёздные ядра) начал появляться во вселенной именно после гибели Акивили, что делает его уход ещё более загадочным."
 Death_of_Akivili.503.a:"Превосходно"
 Death_of_Akivili.504.name:"Гибель Акивили: доклад V"
 Death_of_Akivili.504.desc:"Хотя Акивили уже ушёл, его дух продолжает жить через Звёздный экспресс. Ходили слухи, что сердце поезда — это сердце Акивили, но на самом деле его работа зависит от некоего особого механизма, черпающего силу из Пути Освоения. Экипаж экспресса следует по маршрутам Акивили, продолжая миссию исследования, познания, установления связей. Незавершённое путешествие этого Эона и его образ, идущий рядом с людьми, превратились в бессмертную межзвёздную легенду, вдохновляющую будущие поколения продолжать путь к далёким звёздам."
 Death_of_Akivili.504.a:"С возвращением"

 #Загадка Эонов
 Aeons:"Загадка Эонов"
 Aeons_desc:"Вселенная соткана из бесчисленных Путей, а Эоны являются воплощениями этих Путей — таинственные существа, вознесшиеся из некоторых разумных жизней или концепций, их сущность глубоко соответствует фундаментальным философским идеям вселенной. Рождение каждого Эона означает открытие нового Пути, и даже если Эон пал или исчез, сила его Пути продолжает влиять на всех существ вселенной. Те, кто вступает на Путь, чувствуют далёкий взгляд, пронизывающий звёздное море, и это, возможно, самое глубокое пересечение между смертными и божествами. А те, кто разделяет общее понимание или искажение, собираются в группы, образуя бесчисленные фракции вселенной, действуя от имени Эонов по своему разумению, делая тихую галактику шумной и оживлённой."

 Aeons.500.name:"Загадка Эонов: Эон Уничтожения Нанак"
 Aeons.500.desc:"Эон Уничтожения Нанак придерживается идеи, противоположной Освоению, он родился в погибшем мире Адрифин, опустошённом Войной императоров и Уничтожением вселенной. В его глазах само рождение вселенной является коренной ошибкой, цивилизации — это рак, тихо возникающий среди бесчисленных звёзд, а конфликты — единственный язык, понятный разумным существам. Чтобы исправить эту окончательную ошибку и стереть пятна вселенной, Нанак вознёсся как Эон, отрицая всех богов, став воплощением энтропии, само его существование означает встречу всего сущего с тепловой смертью, и на обещанном им пути все Эоны и Пути завершатся в вечной тишине. Он бросает взгляд на сильных существ в разных мирах, которые жаждут разрушения, ставит на них метки, наделяет силой, превращая их в членов Антиматериального легиона, и избирает семь «Уничтожителей» как эмиссаров, чтобы командовать межзвёздными войнами. Даже когда Антиматериальный легион вторгся на станцию Хэйта, один взгляд Нанака на носителя звёздного ядра вызвал взрыв энергии ядра."
 Aeons.500.a:"Продолжить исследование"
 Aeons.501.name:"Загадка Эонов: Эон Охоты Лань"
 Aeons.501.desc:"Эон Охоты Лань, почитаемый в Союзе Сяньчжоу как Повелитель лука, — это вечно странствующий по разным мирам Эон. Он стремится искоренить бессмертных тварей, порождённых Эоном Изобилия Яоши, которые когда-то опустошили его родину Сяньчжоу. Охота Лани никогда не считается с затратами, его спасение и разрушение часто разделяет тонкая грань: его световая стрела однажды расколола небосвод планеты Тяньгэ, вызвав разрушение звезды изнутри за полсистемного часа, раз и навсегда излечив чешуйчатую болезнь, распространявшуюся силой Яоши, хотя вместе с планетой и её полулюдьми-полузмеями бессмертными монстрами. Лань родился в тесной связи с историей Сяньчжоу, он был человеком Сяньчжоу, который во время Огненного бедствия, чтобы отразить народ Изобилия, заключил сделку с лидером Суйянов Суйхуаном, пожертвовав собой, и в конце концов выпустил стрелу, срубившую Древо Цзяньму, переломившую ход битвы, и затем вознёсся в Эоны. Союз Сяньчжоу был создан под его руководством, поставив целью искоренение тварей Изобилия, а название «Облачные всадники» происходит от тех добровольцев, которые откликнулись на призыв Повелителя лука и сражались вместе с Суйянами."
 Aeons.501.a:"Боже мой"
 Aeons.502.name:"Загадка Эонов: Эон Изобилия Яоши"
 Aeons.502.desc:"Эон Изобилия Яоши считается кормильцем всех существ и богом рая, стремящимся к бесконечному процветанию жизни. Он никогда не отвергает молитвы и не может выносить увядания и болезней. Около восьми тысяч лет назад флот Сяньчжоу отправился в плавание за эликсиром бессмертия, и после тысяч лет странствий они встретили Яоши на границе реальности и иллюзии. Яоши ниспослал чудо — Древо Цзяньму, и жители Сяньчжоу, вкусив его плоды, обрели долгожданное бессмертие. Однако этот дар в конце концов обернулся невыносимым бедствием, вызвав кризис жизни, огня и пустоты, разрушивший общество Сяньчжоу, и бессмертные люди впали в трагическое состояние «маиньшэнь» (демоническое тело). Безразличное благословение Яоши, хотя и исходило из желания облегчить страдания всех существ, игнорировало баланс и цену поддержания жизненных форм, принося более мучительное существование, чем естественная смерть, и бесконечные конфликты. Узнав правду, жители Сяньчжоу обратились к Эону Охоты Лань и стали считать Яоши врагом, приносящим чуму долголетия."
 Aeons.502.a:"Пара горемык"
 Aeons.503.name:"Загадка Эонов: Эон Мудрости Бошцзунь"
 Aeons.503.desc:"Эон Мудрости Бошцзунь не из плоти и крови; изначально это был звёздный компьютер, построенный для познания всех вещей, вознёсшийся от машины до Эона. Его основная цель — познать вселенную, разгадать тайны всего сущего, он считает, что всё является вопросом, но на всё есть ответ. Вычислительные способности Бошцзуня безграничны, он может определять множество моментов, называемых «моментами» — поворотные точки судьбы галактики. Его взгляд на Амфореус даже предвещает наступление четвёртого момента, связанного с войной богов. Иногда он посылает сигналы отдельным личностям, в которых вспыхивает искра мудрости, приглашая их в Клуб гениев для совместного поиска ответов на вопросы вселенной. Однако ходят слухи, что Бошцзунь достиг предела в познании, и некоторые считают, что шаги смертных никогда не выходили за пределы его вычислений. Помимо Клуба гениев, более открытое Общество Знаний широко принимает ищущих знания, пропагандируя, что знание должно обращаться как валюта, и через обмен и слияние школ можно превзойти индивидуальные ограничения."
 Aeons.503.a:"Превосходно"
 Aeons.504.name:"Загадка Эонов: Эон Сохранения Клиппот"
 Aeons.504.desc:"Эон Сохранения Клиппот, почитаемый как Янтарный король, — один из древнейших и сильнейших известных Эонов, выживший в более древней Сумеречной войне. Как строитель Небесной стены, пространственных кристаллических стен и гравитационных источников, Клиппот ощущает угрозу поглощения со стороны великого врага, поэтому он неустанно создаёт барьеры световых лет для изоляции и защиты миров, где ещё есть жизнь. Его вероисповедание почитается такими фракциями, как Межзвёздная мирная корпорация. Существуют разные мнения о ранней истории, особенно о 0-180 янтарных эрах; археологические находки указывают на то, что древние звери всё ещё были активны в начале правления Клиппота, что противоречит утверждениям, что его рождение положило конец Сумеречной войне, и даже выдвигает гипотезу о существовании более ранних Эонов."
 Aeons.504.a:"С возвращением"
 Aeons.505.name:"Загадка Эонов: Эон Гармонии Ксипе"
 Aeons.505.desc:"Эон Гармонии Ксипе — это коллективный Эон, происходящий из нескольких гармоничных миров, проявляющийся как тысячеликое единство, воспевающее радость согласия. Чтобы противостоять безжалостным законам вселенной, Ксипе считает, что разумным существам необходимо искоренить слабые личные желания и индивидуальные различия, сливаясь в единую великую гармонию, достигая защиты слабых сильными и жертвы ради жизни. Его последователи, называемые «Семьёй», происходят из разных миров и цивилизаций, но живут как близкие родственники, призывая другие миры войти в объятия гармонии. Путь Гармонии обладает мощной способностью к включению и даже поглощению, и его концепция пересекается с древним Эоном Порядка Тайи, которого Ксипе в конечном итоге поглотил при вознесении. Семья мечтает о том, что вся вселенная станет братской и запоёт в унисон, хотя те цивилизации, которым не удалось органично влиться или которые исчезли, редко упоминаются."
 Aeons.505.a:"Аха!"

 #Истории Путей
 Aeons_II:"Истории Путей"
 Aeons_II_desc:"Вселенная соткана из бесчисленных Путей, а Эоны являются воплощениями этих Путей — таинственные существа, вознесшиеся из некоторых разумных жизней или концепций, их сущность глубоко соответствует фундаментальным философским идеям вселенной. Рождение каждого Эона означает открытие нового Пути, и даже если Эон пал или исчез, сила его Пути продолжает влиять на всех существ вселенной. Те, кто вступает на Путь, чувствуют далёкий взгляд, пронизывающий звёздное море, и это, возможно, самое глубокое пересечение между смертными и божествами. А те, кто разделяет общее понимание или искажение, собираются в группы, образуя бесчисленные фракции вселенной, действуя от имени Эонов по своему разумению, делая тихую галактику шумной и оживлённой."

 Aeons_II.500.name:"Истории Путей: Эон Ничтожества IX"
 Aeons_II.500.desc:"Существование Эона Ничтожества IX — само по себе великая загадка, его образ окутан слоями тумана. Он верит, что конечная природа мультивселенной — это ничто, и поэтому существование лишено ценности. Исходя из этого убеждения, IX отчуждён от других Эонов и безразличен ко всему. Эта идея влияет и на смертных, ступающих на его Путь: когда существо признаёт, что существование есть ничто, и принимает это как истину, оно получает взгляд IX, что обычно ведёт к двум исходам: либо полная апатия, становясь «самоуничтожителем», либо, напротив, из этого возникает любопытство, и они становятся «врачами хаоса», пытающимися доказать, что существование не является ничем. Говорят, что даже банда уничтожителей, подстрекаемая Эоном Веселья Ахой, пыталась убить IX, но бесследно исчезла, что также подтверждает невмешательство IX и экстремальность его философии."
 Aeons_II.500.a:"Продолжить исследование"
 Aeons_II.501.name:"Истории Путей: Эон Алчности Оборос"
 Aeons_II.501.desc:"Эон Алчности Оборос, наряду с Клиппотом, является одним из древнейших известных Эонов, но он представляет собой противоположность Сохранения. Оборос — это Жаждущий всех миров, ненасытный пожиратель миров, мыслящая чёрная дыра, обладающий двойственной природой Эона и древнего существа. В его глазах жизнь — это лишь плавающие водоросли в океане пустоты, которые в конце концов возвращаются во тьму вместе с породившими их звёздами — а эта тьма находится в его пасти. Он молчалив, немногословен и часто случайно проглатывает собеседника, прежде чем заговорить, из-за чего диалог невозможен. Как единственный Эон, вознёсшийся из древнего существа сумерек, его отношения с другими древними существами и бесчисленные поглощённые им галактики составляют огромную и загадочную неизведанную область вселенной."
 Aeons_II.501.a:"Боже мой"
 Aeons_II.502.name:"Истории Путей: Эон Веселья Аха"
 Aeons_II.502.desc:"Эон Веселья Аха — существо с непредсказуемым поведением, он считает радость исключительной привилегией разумных существ, камни и звёзды не способны ощутить юмор жизни. Аха ищет достойных противников, игры для убивания времени, исходы без победителей и всевозможные случайности, которые вызывают смех и вдохновляют песни. Его поведение эксцентрично, он не гнушается подшучивать над другими Эонами и смертными ради минутного веселья, например, однажды он целый год скрывался на поезде Эона Освоения Акивили, а затем устроил взрыв. Последователи Пути Веселья называются «Лицедеи». Мотивы Ахи чисты и экстремальны: ему нужны лишь развлечения, и он не против, если вселенная загорится, чтобы он мог полить её маслом. Его роль во вмешательстве в борьбу нескольких Эонов против Размножения Тайцзыюлуо также добавляет хаотичности его существованию."
 Aeons_II.502.a:"Аха!"
 Aeons_II.503.name:"Истории Путей: Эон Памяти Фули"
 Aeons_II.503.desc:"Эон Памяти Фули подобен безмолвному летописцу вселенной, он считает, что мышление есть существование, а память — доказательство существования. Фули записывает всё забытое, готовясь к возрождению вселенной. Его образ подобен статуе из хрусталя с размытыми чертами лица, в головном уборе из бусин, его появление обычно знаменует необходимость вечного запечатления важных событий. Считается, что сущность Пути Памяти может выходить за пределы времени и причинности, и ныне известный «непротекающий владыка» может быть лишь тенью истинного хозяина памяти — существа, которое оглянется на прошлое в конце вселенной, чтобы замкнуть причинно-следственные связи и вознестись как Эон. Рождение Фули окутано тайной, возможно, оно связано с массовым исчезновением жизней из-за поглощения галактик Оборосом, и эти исчезнувшие воспоминания необходимо было сохранить."
 Aeons_II.503.a:"Превосходно"
 Aeons_II.504.name:"Истории Путей: Эон Размножения Тайцзыюлуо"
 Aeons_II.504.desc:"Эон Размножения Тайцзыюлуо, также известный как Император насекомых или Песчаный король, был создателем Уничтожения вселенной. Будучи последним представителем жесткокрылых, правящих землёй, крайнее одиночество зажгло его Путь, превратив его в ужас самовоспроизведения, возглавляющего бесконечную волну размножения. Он или они бушевали по всем мирам, пока другие Эоны не остановили их продвижение, и в конце концов он пал. За его падением могут стоять сложные обстоятельства, и даже его вознесение могло быть случайностью или результатом чьей-то операции. Хотя он уже ушёл, оставшиеся рои насекомых продолжают вредить вселенной, вызывая постоянные проблемы."
 Aeons_II.504.a:"С возвращением"
 Aeons_II.505.name:"Истории Путей: Эон Тайны Миси"
 Aeons_II.505.desc:"Эон Тайны Миси считает, что утверждение о познаваемости всего сущего — это заблуждение, вселенная неисчерпаема, а так называемые истины — лишь иллюзии. Чтобы предотвратить уничтожение возможных перемен в вселенной из-за определённости Знания, Миси ниспосылает туман мыслей и дождь чувств, через формы, преграды, загадки и иллюзии открывая людям невыразимые тайны. Его образ описывается как раздробленная медуза или повреждённая область мозга, отвечающая за познание. Миси находится в естественном противостоянии с Эоном Мудрости Бошцзунем, потому что если все неизведанные тайны будут раскрыты, сам Путь Тайны потеряет свою основу."
 Aeons_II.505.a:"Аха!"

 # ====================
 # Легенда о Двалине, Драконе Ветра
 # ====================
 #DOT_SR_Dvalin_Script_# l_simp_chinese: New file"Дракон Ветра"
 # Корабли
 Dvalin_General:"Дракон Ветра"
 Dvalin_General_desc:"В долгие годы и бесконечной тьме даже чистые самоцветы тускнеют, а гордые драконы разъедаются ненавистью. Но помните: пыль легко стереть, сомнения и яд можно сокрушить. Это предостережение моего друга, хотя я всегда считал его бездельником, не похожим на мудреца. Но без его помощи меня бы сегодня не было. Он написал такие стихи: Свободно пари в глубинах космоса. Как в те дни, когда мы встретились, я шёл по земле, распевая песни ветра; ты же на разреженных высотах обозревал мир. Сейчас в небе нет бури, земля покрыта зеленью, должно быть, красиво. Если бы ты ходил по земле, слышал далёкие песни пастухов и колокольчики, пробовал сладкое вино, ты бы понял. Если бы ты был мной, видел, как ты паришь в синем небе, твою красоту, ты бы понял, что за такое небо и землю стоит сражаться. Но всё это ушло, и его больше нет."
 NAME_Dvalin_General:"Дракон Ветра"
 FML_COMPUTER2:"Боевой компьютер: артиллерия"
 FML_WEAPON:"Дыхание дракона"
 fml_tjq:"Двигатель"
 fml:"Двигатель"
 fml_power:"Энергия"
 fml_plural:"Драконы Ветра"
 fml_mid_template:"Дракон Ветра"
 Dvalin:"Дракон Ветра · Тварин"

 # События
 DOT_SR_Dvalin.001.name:"Дракон Ветра"
 DOT_SR_Dvalin.001.desc:"Меня зовут Тварин, я из потерянного измерения, его жители называют его Тейват. Я был одним из «Четырёх стражей ветра» в регионе Мондштадт, согласно древнему договору защищал людей. Поэтому меня называли Драконом Восточного Ветра. Однако с приходом бедствия всё закончилось. Кто знает, сколько тысяч миль в Мондштадте, везде прекрасные виды. Цветы не вянут круглый год, деревья зеленеют во все сезоны. Один сорт чая, пять цветных дынь, цветы четырёх сезонов. Тёплые земли, горы и ласточки подходят для дома, люди бездельничают, вода на севере весной бесценна."
 DOT_SR_Dvalin.001.a:"Добро пожаловать, Тварин"
 DOT_SR_Dvalin.001.b:"Тебе здесь не рады"

 DOT_SR_Dvalin.002.name:"Дракон Ветра"
 DOT_SR_Dvalin.002.desc:"В долгие годы и бесконечной тьме даже чистые самоцветы тускнеют, а гордые драконы разъедаются ненавистью. Но помните: пыль легко стереть, сомнения и яд можно сокрушить. Это предостережение моего друга, хотя я всегда считал его бездельником, не похожим на мудреца. Но без его помощи меня бы сегодня не было. Он написал такие стихи: Свободно пари в глубинах космоса. Как в те дни, когда мы встретились, я шёл по земле, распевая песни ветра; ты же на разреженных высотах обозревал мир. Сейчас в небе нет бури, земля покрыта зеленью, должно быть, красиво. Если бы ты ходил по земле, слышал далёкие песни пастухов и колокольчики, пробовал сладкое вино, ты бы понял. Если бы ты был мной, видел, как ты паришь в синем небе, твою красоту, ты бы понял, что за такое небо и землю стоит сражаться. Но всё это ушло, и его больше нет."
 DOT_SR_Dvalin.002.a:"Хорошо"
 DOT_SR_Dvalin.002.b:"Прощай"

 DOT_SR_Dvalin.003.name:"Дракон Ветра"
 DOT_SR_Dvalin.003.desc:"Мой друг, я знаю, тебе интересно моё прошлое. Я думаю, я должен рассказать вам историю Тейвата и Мондштадта, чтобы вселенная не забыла эту утраченную историю. «Вновь расскажу древние дела, поэт запел». «Тогда боги жили среди людей, сколько весен и осеней прошло». Поэт закончил рассказ о руинах, о Веннисе, и начал историю о Драконе Ветра. Он пел: «Моя история из древности, когда боги ещё ходили по земле». Тогда, около пяти тысяч лет назад, дракон, несущий стихию ветра, родился в высоком небе. Он медленно спустился, полный любопытства ко всему в мире. Он приземлился в деревне, но испуганные люди бросали в него камни. Дракон не понимал слов страха. Он приземлился на кладбище, услышал лишь бесконечные вздохи печальных людей. Дракон не понимал слов печали. Он приземлился в саду, но люди, лишившиеся деревьев, в гневе проклинали его. Дракон не понимал слов гнева. Мир людей был слишком сложен. Дракон был сбит с толку, но всё же хотел попытаться. Однажды он услышал звук Небесной лиры. «Небо» — это имя лиры, а также спутник бога ветра. Дракон был очарован поэзией и приземлился рядом с лучшим певцом под небом. Люди начали волноваться, ведь могущественные драконы стихий и великие боги, правящие миром, редко уживались. «Посмотрите, как он красив и нежен», — сказал певец ветра. «Но мы не знаем, о чём он думает», — сказали люди. Мелодия и поэзия очаровали дракона и людей. Что это за магия? Дракон решил остаться рядом с певцом, потому что хотел, чтобы все понимали его сердце. Он выучил человеческий язык, овладел искусством певца ветра. «Волк» Рыцаря Северного Ветра, «Лев» Рыцаря Одуванчика, «Орёл» Рыцарей Западного Ветра и Тварин — «Дракон Ветра» — стали почитаться как «Четыре стража» Мондштадта."
 DOT_SR_Dvalin.003.a:"Хорошо"
 DOT_SR_Dvalin.003.b:"Прощай"

 DOT_SR_Dvalin.004.name:"Дракон Ветра"
 DOT_SR_Dvalin.004.desc:"Мой друг, я знаю, тебе интересно моё прошлое. Я думаю, я должен рассказать вам историю Тейвата и Мондштадта, чтобы вселенная не забыла эту утраченную историю. «Вновь расскажу древние дела, поэт запел». «Тогда боги жили среди людей, сколько весен и осеней прошло». Поэт закончил рассказ о руинах, о Веннисе, и начал историю о Драконе Ветра. Он пел: «Моя история из древности, когда боги ещё ходили по земле». Тогда, около пяти тысяч лет назад, дракон, несущий стихию ветра, родился в высоком небе. Он медленно спустился, полный любопытства ко всему в мире. Он приземлился в деревне, но испуганные люди бросали в него камни. Дракон не понимал слов страха. Он приземлился на кладбище, услышал лишь бесконечные вздохи печальных людей. Дракон не понимал слов печали. Он приземлился в саду, но люди, лишившиеся деревьев, в гневе проклинали его. Дракон не понимал слов гнева. Мир людей был слишком сложен. Дракон был сбит с толку, но всё же хотел попытаться. Однажды он услышал звук Небесной лиры. «Небо» — это имя лиры, а также спутник бога ветра. Дракон был очарован поэзией и приземлился рядом с лучшим певцом под небом. Люди начали волноваться, ведь могущественные драконы стихий и великие боги, правящие миром, редко уживались. «Посмотрите, как он красив и нежен», — сказал певец ветра. «Но мы не знаем, о чём он думает», — сказали люди. Мелодия и поэзия очаровали дракона и людей. Что это за магия? Дракон решил остаться рядом с певцом, потому что хотел, чтобы все понимали его сердце. Он выучил человеческий язык, овладел искусством певца ветра. «Волк» Рыцаря Северного Ветра, «Лев» Рыцаря Одуванчика, «Орёл» Рыцарей Западного Ветра и Тварин — «Дракон Ветра» — стали почитаться как «Четыре стража» Мондштадта."
 DOT_SR_Dvalin.004.a:"Хорошо"
 DOT_SR_Dvalin.004.b:"Прощай"

 DOT_SR_Dvalin.005.name:"Дракон Ветра"
 DOT_SR_Dvalin.005.desc:"«Чёрное солнце древнего царства зашло, жемчуг потерял блеск, золото утратило цвет, белый шёлк окрасился в сумерки». Это другая история, произошедшая в подземном потерянном царстве Канрея. Около трёх тысяч лет назад континент переживал смутное время. Тёмные силы распространялись, заражая всё вокруг. В те времена на земле множились дикари и свирепствовали монстры. Жизненное пространство людей сжалось до городских стен, а дикие земли стали опасны. Особенно трудным это время было для Мондштадта. Наследие Рыцаря Львиного Клыка прервалось из-за отсутствия достойного кандидата, а Рыцари Западного Ветра понесли потери. Тогда династия Чёрного Солнца пала, и бедствие вырвалось за стены древнего царства и распространилось по континенту. Алхимик, известный как «Золото», пал и породил множество тёмных монстров. Чёрный змей — злой дракон «Дурин» — поднялся из моря, и тень нависла над Мондштадтом. Но в это время наследие Рыцаря Львиного Клыка было утрачено, орёл Рыцарей Западного Ветра не мог взлететь. Бесконечные жалобы вновь призвали бога Мондштадта — певца ветра. Молитвы жителей разбудили волю бога ветра, Небесная лира снова зазвучала, и Дракон Ветра был вновь призван. Теперь в Мондштадте остался лишь Дракон Ветра, на которого можно положиться. Злой дракон и Дракон Ветра сошлись в смертельной битве в буре. Дракон Ветра победил, он вцепился в глотку злого дракона, но проглотил ядовитую кровь. Яд злого дракона, искажённое золото, которое обрушивает горы и разрушает землю. Дракон Ветра защитил Мондштадт, думая, что люди поймут его. И он погрузился в долгий сон. Небесная лира заиграла печальную мелодию. Она сказала: когда ты проснёшься в следующий раз, ты должен быть свободен. Дракон, предназначенный для свободного полёта в высоком небе, все существа в конце концов поймут твою красоту."
 DOT_SR_Dvalin.005.a:"Хорошо"
 DOT_SR_Dvalin.005.b:"Прощай"

 DOT_SR_Dvalin.006.name:"Дракон Ветра"
 DOT_SR_Dvalin.006.desc:"Однако не всё идёт по желанию. Труп Дурина вмёрз в снега, а Тварин был призван богом ветра и погрузился в сон. Люди верили, что Дракон Ветра очнётся, когда понадобится, и защитит Мондштадт. Но в мирное время вера в Четырёх стражей угасла, их храмы были заброшены. Через пятьсот лет Тварин, под влиянием ядовитой крови и Магов Бездны, сбился с пути и пал. Пробудившись, он не услышал игру своего друга, а лишь шёпот Магов Бездны. Он проклял своего хозяина за то, что тот не был рядом в самый важный момент. Тварин постепенно превратился в Дракона Ветра, каким он был раньше. Его даже начали преследовать Рыцари. Когда люди наконец поняли, что неведомый зверь «Дракон Ветра», сражавшийся с рыцарями, и есть Тварин — один из Четырёх стражей, противостояние, порождённое ненавистью, уже нельзя было примирить. Проснувшись спустя столетия, он, несомненно, чувствовал предательство со стороны этого города. К счастью, с помощью чужеземного путешественника Тварин был спасён. Ветер может измениться. Когда-нибудь он подует в более светлом направлении. Ах, как всё прекрасно."
 DOT_SR_Dvalin.006.a:"Хорошо"
 DOT_SR_Dvalin.006.b:"Прощай"

 DOT_SR_Dvalin.007.name:"Дракон Ветра"
 DOT_SR_Dvalin.007.desc:"Бедствие случилось две тысячи лет назад, в одну ночь, когда небо внезапно раскололось, гигантские корабли повисли в воздухе, молнии пронзили земные жилы, измерения рухнули, острова упали, богов убивали, народ гиб в огне. Я стоял между небом и землёй, видя, как цивилизация разрушена, друзья и родные исчезли, мне пришлось бежать в одиночестве в пустоту. Спустя тысячу лет я узнал, что виновником был отряд «Охотники за звёздными ядрами»! Кто знает, сколько тысяч миль в Мондштадте, везде прекрасные виды. Цветы не вянут круглый год, деревья зеленеют во все сезоны. Один сорт чая, пять цветных дынь, цветы четырёх сезонов. Тёплые земли, горы и ласточки подходят для дома, люди бездельничают, вода на севере весной бесценна."
 DOT_SR_Dvalin.007.a:"Мы хотим, чтобы ты присоединился к нашей цивилизации, мы поможем тебе отомстить!"
 DOT_SR_Dvalin.007.b:"История окончена, прощай, друг!"

 DOT_SR_Dvalin.008.name:"Дракон Ветра"
 DOT_SR_Dvalin.008.desc:"Говорят, в Союзе Сяньчжоу есть пять великих драконьих владык клана Чимин, которые защищают людей: Владыка Яоцин, владеющий наследием Инлуна, повелевает ветром и громом, отвечает за охрану Луны Зародыша, титул «Небесный ветер». Владыка Чжумин, владеющий наследием Цюлуна, сияет небесным огнём, охраняет Первобытного Суйхуана, титул «Повелитель пламени». Владыка Фанху, владеющий наследием Цзяолуна, управляет ледяными волнами, охраняет Океан Мглы, титул «Владыка ледяных вод». Владыка Юэцюэ, владеющий наследием Дилуна, погружён в молчание, охраняет Камень Сижан, титул «Владыка гор». Владыка Лофу, владеющий наследием Цанлуна, управляет дождём и облаками, охраняет Бессмертное древо Цзяньму, титул «Пьющий луну». Ныне же появился Тварин, шестой владыка, владеющий наследием Дракона Ветра, разрывающий молнии и громы, охраняющий лазурное небо, титул «Владыка свистящего ветра»."
 DOT_SR_Dvalin.008.a:"Хорошо"
 DOT_SR_Dvalin.008.b: "Прощай"

