origin_Amphoreus:0 "Амфореус"
origin_Amphoreus_desc:0 "«Не завершено» Титаны родились из огня, трое создали небеса и землю, трое сплели судьбу, трое вылепили жизнь, трое привели бедствия."
origin_tooltip_Amphoreus_effects:0 "«Вечная земля» Амфореус. Пересечение трёх Путей: «Знания», «Памяти» и «Уничтожения». Мир, отражающийся только в зеркале Сада Памяти, доказывает, что в этом мире родились по крайней мере три существа, сравнимых с «Эмиссарами». Внешний мир не может наблюдать Амфореус, а местные жители не имеют никакого представления о внешнем космосе. Они поклоняются местным божествам «Титанам», а понятие «Эон» им совершенно незнакомо."
The_Amphoreus_start_screen_messages:0 "«Вечная земля» Амфореус. Пересечение трёх Путей: «Знания», «Памяти» и «Уничтожения». Мир, отражающийся только в зеркале Сада Памяти, доказывает, что в этом мире родились по крайней мере три существа, сравнимых с «Эмиссарами». Внешний мир не может наблюдать Амфореус, а местные жители не имеют никакого представления о внешнем космосе. Они поклоняются местным божествам «Титанам», а понятие «Эон» им совершенно незнакомо."

