 #civic_Employment_Org:0"Галактическая конвенция о занятости"
 #civic_Employment_Org_desc:0"§M«Один занятый вносит больший вклад в Путь Сохранения, чем девяносто девять безработных.»\n§!Из Пути Сохранения Клиппота мы вывели новое учение: дать большинству цивилизаций работу — это основа достижения целей Сохранения, это одновременно и цель, и средство.\nМы считаем, что безработица порождает уныние, отчаяние, нестабильность, снижение спроса и падение производительности, что прямо или косвенно подрывает «Сохранение». Поэтому мы посвящаем себя тому, чтобы у каждого в галактике была работа — конечно, в основном у нас.\n\n§YОткрывает £building£здание филиала§CАгентство по временному трудоустройству§Y, предоставляющее множество £pops£§Cдолжностей клерков, менеджеров, торговцев§!, дающее высокий £trade_value£§Cторговый доход§! на месте, а также увеличивающее £energy£§Cдоход от филиала§! и дающее бонусы ко всей £trade_value£§Cторговой стоимости§! и £energy£§Cдоходу от филиалов§! по всей стране."
 #civic_Housing_Corp:0"Вселенская недвижимость"
 #civic_Housing_Corp_desc:0"§M«Дать каждому существу дом, защищающий от непогоды, — это тоже форма Сохранения.»\n§!В бескрайней галактике всегда есть те, у кого нет крова, и в этом наша возможность и превосходный способ практиковать Путь Сохранения. На далёких чужих планетах бездомные увидят наш бренд, оценят наше недорогое и качественное жильё и заплатят за этот чудесный товар — иногда даже с доплатой.\n\n§YОткрывает £building£здание филиала§CПлан строительства жилья§Y, предоставляющее огромное количество жилья и ускоряющее местное £time£строительство, а также дающее бонус к торговле, даёт нам бонус к жилью по всей стране и £time£скорости строительства."
