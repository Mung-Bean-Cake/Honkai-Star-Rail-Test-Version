 # "Корабль Сяньчжоу «Дружба Повелителя лука»"
 DOT_SR_Dvalin.009.name:"Дар Повелителя лука: Сяньчжоу «Дайюй»"
 DOT_SR_Dvalin.009.desc:"Сяньчжоу «Дайюй»: во времена одинокого плавания взорвался в бою с плотоядными. Когда корабль Дайюй развалился на части и всё стало необратимо, лидер Дайюй Цинчжу немедленно принял решение поклясться величественной жертвой прервать проклятие чумы долголетия. Обломки упали в мир океанских бездн Талассы, в автономную область Исюмачжоу, вдохновив цивилизацию Исюмачжоу. Теперь я дарю тебе восстановленный Сяньчжоу «Дайюй», пусть ты плывёшь на этом корабле, укрощая ветер, и разбиваешь мириады звёзд!"
 DOT_SR_Dvalin.009.a:"Хорошо"
 DOT_SR_Dvalin.009.b: "Спасибо"
 Xingcha_Ship:"Сяньчжоу «Дайюй»"
 Xingcha_Ship_desc:"Сяньчжоу «Дайюй»"
 NAME_Xingcha_Ship:"Сяньчжоу «Дайюй»"
 xianzhou_fleet_plural:"Флагманы Сяньчжоу"
 xianzhou_fleet_cap:"Флагман Сяньчжоу"
 xianzhou_planet_fleet_cap:"Флагман Сяньчжоу"
 xianzhou_planet_fleet:"Флагман Сяньчжоу"
 xianzhou_planet_fleet_1:"Флагман Сяньчжоу"

 DOT_SR_Dvalin.010.name:"Дар Повелителя лука: Сяньчжоу «Цанчэн»"
 DOT_SR_Dvalin.010.desc:"Сяньчжоу «Цанчэн» был одним из девяти флагманов при основании Союза Сяньчжоу, считался самым процветающим среди девяти кораблей. В Цанчэне процветала литература, говорят, там были известные академии, взрастившие глубокие гуманитарные традиции; местная слива Цанчэн была символом корабля, а рецепты, например, отвар из каменного телёнка и дудника, до сих пор используются в Союзе Сяньчжоу. В 6300 году звездного календаря активированная планета «Пожиратель миров Лохоу» вместе с эмиссаром Изобилия Сюху вторглась в Цанчэн. Несмотря на помощь подкреплений с других кораблей под командованием генерала Тэнсяо, Цанчэн пал, был поглощён и разорван Лохоу. Народ, благословлённый долголетием Изобилия, не мог умереть, их сознание и плоть слились с живой планетой, попав в вечную мучительную темницу. Теперь я дарю тебе восстановленный Сяньчжоу «Цанчэн», пусть ты плывёшь на этом корабле, укрощая ветер, и разбиваешь мириады звёзд!"
 DOT_SR_Dvalin.010.a:"Хорошо"
 DOT_SR_Dvalin.010.b: "Спасибо"
 NAME_XIANZHOU_AE:"Сяньчжоу «Цанчэн»"
 XIANZHOU_AE_Ship:"Сяньчжоу «Цанчэн»"
 XIANZHOU_AE_Ship_plural:"Сяньчжоу «Цанчэн»"
 XIANZHOU_AE_Ship_cap:"Сяньчжоу «Цанчэн»"
 XIANZHOU_AE_Ship_desc:"Сяньчжоу «Цанчэн» был одним из девяти флагманов при основании Союза Сяньчжоу, считался самым процветающим среди девяти кораблей. В Цанчэне процветала литература, говорят, там были известные академии, взрастившие глубокие гуманитарные традиции; местная слива Цанчэн была символом корабля, а рецепты, например, отвар из каменного телёнка и дудника, до сих пор используются в Союзе Сяньчжоу. В 6300 году звездного календаря активированная планета «Пожиратель миров Лохоу» вместе с эмиссаром Изобилия Сюху вторглась в Цанчэн. Несмотря на помощь подкреплений с других кораблей под командованием генерала Тэнсяо, Цанчэн пал, был поглощён и разорван Лохоу. Народ, благословлённый долголетием Изобилия, не мог умереть, их сознание и плоть слились с живой планетой, попав в вечную мучительную темницу."

 DOT_SR_Dvalin.011.name:"Дар Небесного владыки освоения: Хюперион"
 DOT_SR_Dvalin.011.desc:"Хюперион — летающий линкор, разработанный организацией «Судьба», флагман Пятого отряда Валькирий под командованием Химеко Мунато, приписанный к академии Святой Фреи, также является ключевым боевым кораблём, проходящим через всю основную сюжетную линию. Длина корпуса 278,5 метров, длина палубы 182 метра, стандартный экипаж от 50 до 200 человек; силовая установка — 6 термоядерных реакторов, антигравитационные двигатели Леонова, поддерживают вертикальный взлёт и длительное зависание. Изначально корабль был авианосцем, но после接手 Химеко был переоборудован: демонтированы авиационные средства, усилена прямое огневое вооружение: по 3 430-мм и 3 270-мм рельсотрона на борт, плюс 10 систем ближней обороны, основное назначение — фронтовая платформа для борьбы с крупными Гонкай-зверями размером более ста метров. Теперь я дарю тебе Хюперион, пусть ты плывёшь на этом корабле, укрощая ветер, и разбиваешь мириады звёзд!"
 DOT_SR_Dvalin.011.a:"Хорошо"
 DOT_SR_Dvalin.011.b: "Спасибо"
