l_english:
 decision_aex_dock_train:0 "Dock the Train"
 decision_aex_dock_train_desc:0 "Officially bring the Astral Express into the standard hyperlane network.\n\nTo do so we must give up our §YNomadic§! status - no longer roaming unclaimed space, but claiming systems and raising Starbases like any settled civilization.\n\nThe Express itself does not vanish. It keeps sailing as our mobile flagship, only now it also has a place to call its own.\n\n§RThis decision cannot be undone.§!"
 aex_dock_train_effect_tt:0 "Gives up §YNomadic§! status:\n- Can claim systems and build §HStarbases§!\n- Grants the starbase-related technologies\n- Restores standard economy (Energy/Minerals) and border rules\n- §GThe Astral Express (Arkship) is kept§!"
