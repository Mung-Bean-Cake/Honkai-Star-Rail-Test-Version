#特性
trait_Honkai:0 "The People of Collapse"
trait_Honkai_desc:0 "On the interstellar voyages created by the Pathfinder, certain obscure substances disrupt the flow of imaginary energy. This phenomenon is extremely aggressive, and it continues to infest neighbouring worlds in the form of the mysterious object "Star Core" - spreading like a cancerous cell throughout the universe."
trait_The_Destruction:0 "Embarking on a destiny: destruction"
trait_The_Destruction_desc:0 "The birth of the universe was a mistake; if civilisation is a cancer that rises silently in the vastness of the stars, strife is the only language that passes among intelligent beings. To correct such errors as these, to erase the stains of the universe, Nanook became the embodiment of entropy."
trait_The_Harmony:0 "Setting out on the path of destiny: the Harmony"
trait_The_Harmony_desc:0 "Clustered star gods from multiple Harmonic Celestial Worlds. A thousand faces in one, Hippe sings of the joy of harmony and unity. In order to combat the relentless laws of the universe, intelligent beings need to obliterate weak selfishness and individual differences and merge into the same queer harmonic joy - strength for strength, death for life."
trait_The_Abundance:0 "Embarking on the path of destiny: abundance"
trait_The_Abundance_desc:0 "So that all sentient beings may receive what they seek. The Medicine Man is the nurturer of all beings, the god of bliss, aiming to make life flourish without extinction. He is the star god who never refuses a prayer and does not tolerate decay and sickness."
trait_The_Hunt:0 "Setting out on a life path: a hunting tour"
trait_The_Hunt_desc:0 "Known as the Emperor's Bow Siren, the roving star god wanders endlessly among the worlds, rooting out the undead and sinful creatures that once plagued his homeworld. Arashi's prowling never counts the cost, and there is little difference between its salvation and destruction."
trait_The_Preservation:0 "Embarking on the path of destiny: survival and protection"
trait_The_Preservation_desc:0 "The mason of the Celestial Comet Wall, the Subspace Crystal Wall, and the Giant Lead Source Base Plate, known to worshippers as the 'Amber King'. He is a survivor of the much older 'Twilight War'. He knew that the devouring of the Great Enemy was imminent. So he was forced to forge barriers in light-years to seal off and protect the world from the living."
trait_The_Erudition:0 "Embarking on the path of destiny: the intellect"
trait_The_Erudition_desc:0 "Everything is a question, everything must be answered. Originally an astral computer used to seek answers to all things, the Astral God was elevated from a machine. The Exalted Exalted seeks to empathise with the universe and solve the mystery of all things."
trait_The_Nihility:0 "Embarking on the path of destiny: the Void"
trait_The_Nihility_desc:0 "The existence of the Void is a mystery, His image wrapped in layers of mist. ix does not deal with other astral deities, He believes that the essence of the multiverse is nothingness, and thus existence is worthless."
