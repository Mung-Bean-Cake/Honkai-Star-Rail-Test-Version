necroids.310.desc:0 "The Propagation tried to enter §Rus§!!\n\nThe extragalactic invader immediately seized our necro-drones. From there, the other swarm started to collect additional nearby drones. We had to eliminate the entire infiltration pod to keep the [Root.GetName] secure."
#nemesis_content_l_english.yml （匹配1次）
operation.4005.desc.swarm:0 "Our research into the biological drives of the §P$CRISIS_TYPE_PRETHORYN$§! was conducted swiftly, but has proven effective. We devised a synthetic compound - expensive to produce, and dangerous to transport - which has succeeded in luring a fleet away from the Swarm.\n\nSo adhesive is this compound that the fate of our operatives is now as bleak as that of any starbase which lies between the §Y[crisis_beacon_crisis_system.GetName] system§! and the [crisis_beacon_target_country.GetAdj] capital, §Y[crisis_beacon_target_capital.GetName]§!. The moment our operatives released the beguiling chemical, their fate was sealed.\n\nRather than flee and risk confusing the swarm's route, our team will instead spend what remaining time they have ensuring that the trail remains intact. The §H[crisis_beacon_target_country.GetName]§! will soon experience the results of our sacrifice."
#overlord_enclaves_l_english.yml （匹配3次）
enclave.240.c:0 "The Propagation Swarm"
enclave.255.desc:0 "Propagation fleets rely on slow moving projectiles and hosts of smaller ships to take down their foes. One option to fend them off is to use point defense, coupled with armor and improvements to your ship's hull resilience; another is to engage them at extreme range. With sufficiently powerful energy weapons, one might manage to destroy their fleets before they can even get in range."
tactic_v_swarm:0 "Mercenary Tactics: The Prethoryns"
#projects_l_english.yml （匹配1次）
CAPTURE_QUEEN_DESC:0 "After a recent space battle in the [queen_system.GetName] system, a Propagation Queen was badly injured and left for dead by the rest of the Scourge. The creature is still alive, however. Capturing it would be a major intelligence coup."
#technology_l_english.yml （匹配1次）
