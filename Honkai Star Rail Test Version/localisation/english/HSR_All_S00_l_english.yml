ap_xianzhou_world_desc:0 "The eco-giant ship slowly sails into the starry sky, like a clear moon falling into the silence of the night, a long way to nowhere."
allow_xianzhou_project:0 "Unlocking the resolution of the giant ship of Xianzhou."
decision_xianzhou_project_effects:0 "Upgrades a starship or space station to the Xianzhou Megaship planet type, increasing housing, resource production and population growth and unlocking special Xianzhou zoning, at the cost of having the First Estate zoning removed"
