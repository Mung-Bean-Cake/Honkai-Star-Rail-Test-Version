district_xz_city:0 "Senkai Huanwu City"
district_xz_city_desc:0 "When the improved Ancient Immortal Boat Module was activated once again, the pulse of the city continued to beat, and all kinds of commercial activities and the atmosphere of life filled every corner. And the existence of the Ancient Immortal Boat Module gives the city a unique charm, with its history and modernity intermingling with each other, adding a touch of unique scenery to the city."
district_xz_industrial:0 "General Division of Xianzhou Kobo"
district_xz_industrial_desc:0 "On the land of Senju, there stands proudly a breathtaking industrial giant, the Senju Kogyozou General Division. This magnificent factory resembles a stately fortress. When night falls, the huge factory building is brightly lit and glittering, just like the stars in the starry sky."
district_xz_science:0 "Research Department, Division of Industrial Manufacturing"
district_xz_science_desc:0 "Hidden within the Industrial Manufacturing Division of the Immortal Boat Lands is a mysterious place full of wisdom and innovation - the Research Department of the Industrial Manufacturing Division. This department is situated in the core area of the Industrial Manufacturing Division, resembling a giant laboratory"
district_xz_trade:0 "Immortal Boat Logistics Hub"
district_xz_trade_desc:0 "As a galactic-class ship, the Immortal Ark carries a huge logistical task and possesses a unique and efficient logistics hub. The Star Crew is compact and intricately constructed, equipped with advanced navigation systems and cargo transport equipment, and travels through starports."

