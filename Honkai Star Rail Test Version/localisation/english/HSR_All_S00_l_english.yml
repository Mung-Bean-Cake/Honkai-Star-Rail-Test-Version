#国民理念
civic_The_Destruction:0 "The blessing of the Lord of Destruction."
civic_The_Destruction_desc:0 "In order to right such wrongs as these and erase the stains of the universe, Nanook became the embodiment of entropy."
councilor_oracle_destruction:0 "The divine messenger of destruction."
councilor_oracle_destruction_female:0 "$councilor_oracle_destruction$"
councilor_oracle_destruction_desc:0 "The birth of the universe was a mistake; if civilisation is a quiet cancer rising from the vastness of the stars, strife is the only language that passes among intelligent beings."
civic_The_Harmony:0 "Blessings of the Lord of Harmony"
civic_The_Harmony_desc:0 "Clustered star gods from multiple Harmonic Celestial Worlds. Hippe, one in a thousand faces, proclaims the joy of Harmony."
councilor_oracle_harmony:0 "Envoy of the God of Harmony."
councilor_oracle_harmony_female:0 "$councilor_oracle_harmony$"
councilor_oracle_harmony_desc:0 "In order to combat the relentless laws of the universe, intelligent beings need to obliterate weak selfishness and individual differences and merge into the same Queer Harmony - to aid the weak with the strong, and to protect the living with the dead."
civic_The_Abundance:0 "The Blessing of the Medicine King of Tzu-Wai"
civic_The_Abundance_desc:0 "That all sentient beings may receive what they seek."
councilor_oracle_abundance:0 "The divine messenger of abundance"
councilor_oracle_abundance_female:0 "$councilor_oracle_abundance$"
councilor_oracle_abundance_desc:0 "The medicine man is the nurturer of all beings, the god of bliss, aiming to make life flourish without extinction."
civic_The_Hunt:0 "Blessing of the Emperor's Bow Siddhant"
