sm_space_mining_station_t2:0 "Galaxy-like ground pith synthesis"
sm_space_mining_station_t2_desc:0 "If the process of generating ground pith can be accelerated, then a steady stream of high-energy solid batteries can be obtained"
sm_space_mining_station_t3:0 "Refinement of the Earth's medulla reorganisation furnace"
sm_space_mining_station_t3_desc:0 ""Ground Marrow-based Energy Supply Cycle for Jagged Ships""

