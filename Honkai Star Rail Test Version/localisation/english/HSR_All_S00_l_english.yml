sm_space_rare_resource_t2_desc:0 "Facility for synthesising large quantities of rare resources for the station to supply the station's huge rare resource needs"

sm_space_anchorage_t1:0 "Space harbour for the Black Tower space station"
sm_space_anchorage_t1_desc:0 "Huge harbour for recovering ships/materials/experimental equipment from various galaxies during normal times, and also able to moor large numbers of ships during special times"
