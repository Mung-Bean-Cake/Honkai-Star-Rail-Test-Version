l_english:
 NAME_keqing:0 "Keqing"
 keqing_desc:0 "The Yuheng of the Liyue Qixing. She never took the protection of the adepti or the Geo Archon for granted — the affairs of Liyue should be decided by its people. After her homeland shattered, she boarded this wind dragon from a lost world and took the helm."
 keqing_catch_phrase:0 "Out of my way. I am busy."
 leader_trait_yuheng:0 "Yuheng"
 leader_trait_yuheng_desc:0 "Swift as lightning: greatly increased ship speed, evasion, weapon damage and accuracy."
