 # ---------- Species trait ----------
 trait_DOTGI_genshin_blessing:0 "Blessing of Teyvat"
 trait_DOTGI_genshin_blessing_desc:0 "The Teyvatians are bound to the ley lines of their world from birth. This blessing grants them a talent for labour and learning far beyond ordinary mortals, and a lifespan measured in centuries.\n\n£mod_planet_jobs_energy_produces_mult£ Energy from Jobs §G+50%§!\n£mod_planet_jobs_minerals_produces_mult£ Minerals from Jobs §G+50%§!\n£mod_planet_jobs_food_produces_mult£ Food from Jobs §G+50%§!\n£mod_planet_jobs_physics_research_produces_mult£ Physics Research from Jobs §G+50%§!\n£mod_planet_jobs_society_research_produces_mult£ Society Research from Jobs §G+50%§!\n£mod_planet_jobs_engineering_research_produces_mult£ Engineering Research from Jobs §G+50%§!\n£mod_planet_jobs_unity_produces_mult£ Unity from Jobs §G+50%§!\n£mod_planet_jobs_alloys_produces_mult£ Alloys from Jobs §G+30%§!\n£mod_planet_jobs_consumer_goods_produces_mult£ Consumer Goods from Jobs §G+30%§!\n£mod_pop_happiness£ Happiness §G+15%§!\n£mod_planet_amenities_add£ Amenities §G+5§!\n£mod_leader_lifespan_add£ Leader Lifespan §G+200§!"

 # ---------- Static modifiers ----------
 DOTGI_abyss_erosion_modifier_tooltip:0 "§RAbyssal Erosion§!\nThe power of the Void seeps out through the cracks in this world, corroding both land and spirit. Left unchecked, it will one day swallow the planet whole.\n\n£mod_pop_happiness£ Happiness §R-20%§!\n£mod_planet_stability_add£ Stability §R-10§!\n£mod_logistic_growth_mult£ Pop Growth Speed §R-50%§!\n£mod_planet_jobs_upkeep_mult£ Job Upkeep §R+25%§!"
 DOTGI_teyvat_awakened_modifier_tooltip:0 "§GThe Abyss Recedes§!\nThe shadow that hung over Teyvat for a millennium has been dispelled, and this gaia world breathes freely once more.\n\n£mod_planet_stability_add£ Stability §G+10§!\n£mod_pop_happiness£ Happiness §G+10%§!\nAll Research Output §G+10%§!"

 # ---------- Anomaly: Abyssal Erosion ----------
 DOTGI_abyss_erosion_cat:0 "Abyssal Erosion"
 DOTGI_abyss_erosion_desc:0 "Planetary scans reveal an unidentifiable energy structure beneath the surface of this gaia world. It is spreading slowly, steadily corroding the planet's ley lines. This is what the Teyvatian records call the Abyss."

 # ---------- Situation: Distress Signal from the Void ----------
 DOTGI_distress_signal_situation:0 "Distress Signal from the Void"
 DOTGI_distress_signal_situation_type:0 "Distress Signal from the Void"
 DOTGI_distress_signal_situation_desc:0 "Our deep-space arrays have caught an impossibly faint, endlessly repeating signal. It comes from deep within an astral rift, laced with an unreadable language and a single recurring name - Teyvat.\n\nThe last cry of a dying civilization, perhaps. To learn the truth, we must go deeper."
 DOTGI_distress_signal_situation_monthly_change_tooltip:0 "Only by pressing deeper into the astral rift can the full message be pieced together."
 DOTGI_distress_signal_stage_1:0 "Echo"
 DOTGI_distress_signal_stage_1_tt:0 "The signal is roughly located: it originates from a world wrapped in a layer of the Void."
 DOTGI_distress_signal_stage_2:0 "Traces of a Civilization"
 DOTGI_distress_signal_stage_2_tt:0 "Images surface from the depths - seven elements, seven gods, and ley lines that never rest."
 DOTGI_distress_signal_stage_3:0 "Coordinates"
 DOTGI_distress_signal_stage_3_tt:0 "The rift's end reveals Teyvat's exact coordinates - and the disaster devouring it: Abyssal Erosion."
 DOTGI_distress_signal_outcome:0 "The source of the distress signal has been fully decoded. The rift will collapse into a stable wormhole leading to Teyvat."
 DOTGI_approach_decode_signal:0 "Decode the Signal"
 DOTGI_approach_decode_signal_desc:0 "Keep the listening array powered and slowly unravel the signal from the Void."

 # ---------- Situation: Abyssal Erosion ----------
 DOTGI_abyss_erosion_situation:0 "Abyssal Erosion"
 DOTGI_abyss_erosion_situation_type:0 "Abyssal Erosion"
 DOTGI_abyss_erosion_situation_desc:0 "Teyvat's ley lines are being corroded by an alien energy known as the Abyss. Early projections suggest that, left alone, it will consume the planet in roughly a century and drag it into the Shroud.\n\nWe must study it and commit vast resources to halting its spread."
 DOTGI_abyss_erosion_situation_monthly_change_tooltip:0 "The Abyss spreads on its own each month. Choosing Full Investigation and committing resources accelerates research; if progress reaches zero, Teyvat is consumed."
 DOTGI_abyss_erosion_stage_1:0 "First Readings"
 DOTGI_abyss_erosion_stage_1_tt:0 "The composition of the Abyss is partially decoded. Its link to the Shroud is undeniable."
 DOTGI_abyss_erosion_stage_2:0 "Deep Erosion"
 DOTGI_abyss_erosion_stage_2_tt:0 "The team has located the Abyss's spread nodes and begun severing them."
 DOTGI_abyss_erosion_stage_3:0 "Purification"
 DOTGI_abyss_erosion_stage_3_tt:0 "The last node is cut. The Abyss is receding from Teyvat's ley lines."
 DOTGI_abyss_erosion_outcome:0 "The Abyss is purged. The Teyvatian civilization will fully awaken and offer itself to your empire - while keeping its own homeworld and sovereignty."
 DOTGI_abyss_erosion_fail_outcome:0 "Teyvat is consumed by the Abyss and becomes a shrouded world."
 DOTGI_abyss_progress_investigate:0 "Full Investigation"
 DOTGI_abyss_progress_contain:0 "Containment"
 DOTGI_abyss_progress_anomaly_done:0 "Anomaly Studied"
 DOTGI_approach_abyss_investigate:0 "Full Investigation"
 DOTGI_approach_abyss_investigate_desc:0 "Divert every available researcher and pour in vast resources to decode the Abyss."
 DOTGI_approach_abyss_contain:0 "Containment"
 DOTGI_approach_abyss_contain_desc:0 "Establish a cordon around Teyvat to slow the Abyss's spread."
 DOTGI_approach_abyss_ignore:0 "Wait and See"
 DOTGI_approach_abyss_ignore_desc:0 "Take no action for now. The Abyss will continue to spread."

 # ---------- Events: rift chain ----------
 DOTGI_teyvat.1.name:0 "Distress Signal from the Void"
 DOTGI_teyvat.1.desc:0 "The rift's interior is not emptiness. Our instruments catch an impossibly faint, endlessly repeating signal that bypasses every known law of physics and drives itself straight into the mind of every listener.\n\nIt is one sentence, spoken at once in countless undecipherable languages - yet only the final word can be understood: Teyvat."
 DOTGI_teyvat.1.a:0 "Press on."
 DOTGI_teyvat.2.name:0 "Echo"
 DOTGI_teyvat.2.desc:0 "The deeper we go, the clearer the signal. Fragmented images surface along the rift's walls: a tall tower, a floating archipelago, seven pillars of light piercing the heavens.\n\nThey belong to no known civilization. A linguist points at one symbol with a trembling hand - a glyph still in use, meaning help."
 DOTGI_teyvat.2.a:0 "Record everything and continue."
 DOTGI_teyvat.2.b:0 "Take samples back first."
 DOTGI_teyvat.3.name:0 "Traces of a Civilization"
 DOTGI_teyvat.3.desc:0 "The images grow coherent. We see a beautiful world nourished by seven elements - Teyvat. Its people build cities, worship gods, and gaze at the stars.\n\nThen, in the final frame, something black and writhing pours out from cracks in the earth. The images cut out there."
 DOTGI_teyvat.3.a:0 "We must find the way there."
 DOTGI_teyvat.4.name:0 "The End"
 DOTGI_teyvat.4.desc:0 "The end of the rift is not a wall, but a door.\n\nBeyond it lie Teyvat's exact coordinates and a passage that, once stabilised, will endure forever. The signal stops - not broken off, but finally heard.\n\nWe anchor the rift's exit to our home system and let it collapse into a wormhole."
 DOTGI_teyvat.4.a:0 "Stabilise the passage. Open the wormhole."

 # ---------- Events: situation ----------
 DOTGI_teyvat.151.name:0 "Distress Signal from the Void"
 DOTGI_teyvat.151.desc:0 "Our deep-space arrays have caught something extraordinary on the inner edge of our home system: a rift - not a natural formation, but a layer of the Void torn open by some force. From the moment it appeared, that endlessly repeating signal has occupied every receiving channel, laced with an unreadable language and one recurring name: Teyvat.\n\nThe empire has designated this a research priority of the highest order.\n\n§YThe rift\'s system has been fully surveyed, an outpost starbase is in place, and the Rift Sphere together with wormhole stabilisation technology has been issued to our science divisions.§!\n\nThe remaining question is what, deep inside the rift, is calling for help."
 DOTGI_teyvat.151.a:0 "Keep decoding."
 DOTGI_teyvat.195.name:0 "The Wormhole Opens"
 DOTGI_teyvat.195.desc:0 "The rift collapses before us into a steadily rotating wormhole. From the far side come clear starlight and the gentle gravitational pulse of a blue planet.\n\nThat is Teyvat. The passage is open, and any ship of the empire may travel there."
 DOTGI_teyvat.195.a:0 "Send a science ship to Teyvat."

 # ---------- Events: arrival ----------
 DOTGI_teyvat.200.name:0 "Teyvat"
 DOTGI_teyvat.200.desc:0 "The wormhole opens onto a gaia world so beautiful it takes the breath away. Oceans, forests, mountains, grasslands - everything in perfect measure, as if carefully sculpted by a hand.\n\nCities, roads and factories blanket the surface, vast enough to sustain a full civilization. But the scans are troubling: the planet's ley lines are being steadily corroded by a black energy. Its inhabitants call it the Abyss.\n\nWe do not have much time."
 DOTGI_teyvat.200.a:0 "Launch a dedicated research programme."
 DOTGI_teyvat.201.name:0 "Abyssal Erosion"
 DOTGI_teyvat.201.desc:0 "Preliminary analysis confirms the Abyss is no natural phenomenon. It is an alien energy with a discernible intent, advancing methodically along Teyvat's ley-line network.\n\nAt current rates, the planet will be dragged wholly into the Shroud within a century.\n\nWe must unlock its secrets before it finishes its work."
 DOTGI_teyvat.201.a:0 "We will not let it."

 # ---------- Events: anomaly resolved ----------
 DOTGI_teyvat.210.name:0 "The Secret of the Abyss"
 DOTGI_teyvat.210.desc:0 "A complete analysis of the anomaly Abyssal Erosion is finally in hand.\n\nThe team confirms the Abyss is not native to Teyvat: it is the wound left by a far older rift - of the same origin as the astral rifts, and as the Shroud. The good news is that its spread nodes can be identified, and severed.\n\nWhat remains is to commit enough resources to cut every one of them."
 DOTGI_teyvat.210.a:0 "Begin purifying Teyvat."

 # ---------- Events: awakening ----------
 DOTGI_teyvat.220.name:0 "Teyvat Awakens"
 DOTGI_teyvat.220.desc:0 "The instant the last Abyssal node was severed, Teyvat\'s ley lines lit up again.\n\nHeld down in the Machine Age for so long, the Teyvatians crossed in a few short months what took other civilizations centuries: they understood the stars, built jump drives, and sought out our envoys on their own initiative.\n\nLeading this newborn civilization is a young woman who calls herself Ying. She extends a hand and delivers Teyvat\'s first ever diplomatic sentence: "We will not forget who pulled us out of the Abyss."\n\nTeyvat\'s homeworld and home system will be governed by the Teyvatians themselves - the empire will not take their planet, and the outpost we established in the Teyvat system has been handed back to them as well. All we need is a title. She offers two options.\n\n(Either way, Teyvat continues to exist as an independent nation with its own planet, star system, government and ruler.)"
 DOTGI_teyvat.220.a:0 "Under our protection: submit as a vassal."
 DOTGI_teyvat.220.b:0 "Stay independent: pay tribute as a tributary."
 DOTGI_teyvat.220.vassal_tt:0 "Teyvat keeps its homeworld and full sovereignty, and takes over its own home system (the empire no longer holds a starbase there), becoming a §YVassal§! of the empire. The empire may direct its foreign policy and defence."
 DOTGI_teyvat.220.tributary_tt:0 "Teyvat keeps its homeworld and full sovereignty, and takes over its own home system (the empire no longer holds a starbase there), becoming a §YTributary§! - paying regular tribute to the empire while retaining complete domestic and foreign independence."

 # ---------- Events: doom ----------
 DOTGI_teyvat.230.name:0 "Teyvat Sinks"
 DOTGI_teyvat.230.desc:0 "The last Abyssal node closed.\n\nOvernight, Teyvat's sky turned a churning violet-black. The oceans boiled away, the continents split, and every city, song and lantern we had ever recorded was drawn into that place which is not reality.\n\nThe signal is gone. We heard the call for help, and we did not arrive in time."
 DOTGI_teyvat.230.a:0 "..."
