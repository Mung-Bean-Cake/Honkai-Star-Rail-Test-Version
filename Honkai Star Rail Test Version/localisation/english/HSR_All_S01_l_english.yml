NAME_antimatter_hm: "§RAntimatter Legion§!"
NAME_ANTIMATTER: "§RDestruction§!"
DDT_FY.306_title: "Victory!"
DDT_FY.306_desc: "In this vast and boundless universe, we have experienced an unprecedented catastrophe, like a haze over the nebulae, shaking the fate of the entire galaxy. When the threat of annihilation loomed, we could only rely on each other. We united, regardless of nation, color, or religion, and with great difficulty, resisted this cosmic disaster from the depths of the universe. It was a battle between us and the forces of Destruction, desperately guarding the peace and vitality of the galaxy. Now, we have won, but our hearts still tremble. This victory has taught us to cherish and protect everything we have."
DDT_FY.306_desc_a: "Finally, victory."
DDT_FY.306_desc_b: "Victory was certain!"

