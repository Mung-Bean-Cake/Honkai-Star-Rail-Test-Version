 #Kafka
NAME_kafuka:"Kafka"
kafuka_catch_phrase:"Almost infinite time, almost infinite space, and we appear at the same place at the same time. "Fate" works like this — creating miracles while making you think it's just coincidence."
kafuka_backstory:"In the Interastral Peace Corporation's wanted files, only Kafka's name and "hobby of collecting coats" are recorded. Little is known about this Stellaron Hunter, except that she is one of the most trusted members of "Destiny's Slave" Elio. To reach the "future" foreseen by Elio, Kafka begins to act."
hsr_paragon.56.name:"Stellaron Hunters - Kafka"
hsr_paragon.56.a:"First Meeting"
hsr_paragon.56.a.response:"Hi, Train crew... well, you've caught me."
hsr_paragon.56.b:"Hobbies"
hsr_paragon.56.b.response:"I especially love velvet coats — fragile and beautiful, hard to maintain, easily losing their luster if not careful."
hsr_paragon.56.c:"Observations"
hsr_paragon.56.c.response:"Worlds changed by "Stellarons"... my homeland is one of them. Unfortunately, I didn't get to see how that era fell."
leader_kafuka_t1:"§MNight's Bustle Never Ceases§!"
leader_kafuka_t1_desc:"Just wait."
leader_kafuka_t2:"§MMoonlight Caresses Endlessly§!"
leader_kafuka_t2_desc:"I praise, impromptu."
leader_kafuka_t3:"§MGentleness is Also Cruelty§!"
leader_kafuka_t3_desc:"Only tonight does it play."
leader_kafuka_t4:"§MForgiveness Has Nothing to Do with Mercy§!"
leader_kafuka_t4_desc:"Bodies are beautiful because they are fragile."
leader_kafuka_t5:"§MTremor at the End of Tragedy§!"
leader_kafuka_t5_desc:"Time to say goodbye..."
