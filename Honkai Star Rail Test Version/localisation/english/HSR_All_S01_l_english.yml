# l_simp_chinese: New file

prethoryn_scourge_chain_desc: "Our galaxy has been invaded by a swarm of greedy interstellar creatures; they intend to devour all life they encounter. We must destroy these Propagation Swarm invaders before their numbers overwhelm us."
prethoryn_kills_us: "§GPropagation Swarm destroyed by us§!"
prethoryn_kills_others: "§GPropagation Swarm destroyed by others§!"
prethoryn_victims: "§RShips devoured by the Propagation Swarm§!"
crisis.51.desc: "An organization that battles the Propagation Swarm has recently emerged in the galaxy. This organization appears to be composed mainly of exiles and oppressed groups — refugees, veterans, and others who lost everything in the conflict.\n\nNevertheless, their improvised fleet has managed to achieve several victories against the Swarm's hunting fleets. Some unconfirmed reports mention unusually designed warships in their fleet..."
crisis.52.desc: "We are the Sentinels. Our order has sworn to stop the bloodthirsty Propagation Swarm at any cost. While other empires crumbled, we persisted. When they surrendered to darkness, we gave them the means to fight back.\n\nI am Grand Master Khas, head of the order. Don't judge by appearance — the Sentinels recruit from all races in the galaxy, including yours. We only ask that your government continues to resist the Swarm disaster and supports us when possible."
crisis.52.a.response: "Many Sentinels have military backgrounds. We are the survivors of various fleets that were defeated in battles against the Propagation Swarm. As Sentinels, we have learned from past mistakes and work hard to avoid repeating them.\n\nLikewise, I assure you, we recruit from all races in the galaxy. This includes the ancient races, such as the [sentinel_fallen_empire.GetSpeciesNamePlural]. We have received support from several influential factions within §H[sentinel_fallen_empire.GetName]§!, who do not want to see their galaxy devoured by the Swarm. They have donated ships and resources to our cause."
crisis.55.a.response: "What we know is limited, but they certainly originate from outside the galaxy. It is highly likely they have destroyed dozens, or even hundreds, of galaxies before reaching us... or perhaps we are their first victims.\n\nAfter they have exterminated all non-Swarm life on a planet, they convert it into what can only be described as a twisted nightmare. No other life can survive on these incubation planets; the only way to cleanse them is to burn the entire biosphere with intense orbital bombardment."
crisis.101.desc: "One of our deep-space reconnaissance probes entered a battlefield debris field in the [queen_system.GetName] system, where the Propagation Swarm fought an unknown force. A Swarm queen appears to have been seriously injured in the battle and abandoned to die.\n\nThe reconnaissance probe reports that the queen is still alive. Now is a rare opportunity to capture a live Swarm queen."
crisis.211.desc: "With the last of the Propagation Swarm eliminated, the entire universe breathed a sigh of relief. Their invasion has completely failed. The Swarm that once terrified countless beings now leaves behind only innumerable fire-scorched corpses, drifting slowly through the void.\n\nA sense of relief and joy spreads at superluminal speed across the universe; countless worlds spontaneously begin celebrations of this great victory. Perhaps this could be an opportunity to open a new chapter of peace and stability?"
gal_com_is_neighboring_swarm: "Propagation Swarm is nearby"
gal_com_is_not_neighboring_swarm: "Propagation Swarm is still far away"
swarm_army: "Propagation Swarm Forces"
swarm_army_plural: "Propagation Swarm Forces"
leader_trait_sentinel_desc: "Sentinel fleet commanders have intimate knowledge of the Propagation Swarm's physiology and tactics."
leader_trait_hive_mind_desc: "The gestalt consciousness controlling the Propagation Swarm fleet has the ability to handle complex multitasking."
leader_trait_hive_affinity_desc: "Based on this fleet's consciousness, the Swarm creatures resonate with each other unusually well. Their firing discipline and rate of fire are improved."
leader_trait_void_swimmer_desc: "This fleet's hunting instinct drives its Swarm creatures into a frenzy. Their thirst for battle pushes them forward."
SWARM_STRIKE_CRAFT_1_DESC: "These miniature clones of Propagation Swarm creatures can be controlled by fleet communication systems, serving as effective strike craft."
name_list_Prethoryn: "Propagation Swarm"
mod_weapon_swarm_weapon_fire_rate_mult: "Propagation Swarm Weapon Fire Rate"
necroids.310.desc: "The Propagation Swarm has attempted to invade §Rus§!!\n\nThese extragalactic invaders quickly captured our dead drone workers. From them, other swarm creatures began gathering more nearby sub-individuals. We must cleanse the entire infection pod to ensure the safety of [Root.GetName]."
enclave.240.c: "Propagation Swarm"
enclave.255.desc: "Propagation Swarm fleets rely on slow kinetic weapons and large swarms of small ships to overwhelm enemies. One option is to use point defense paired with armor and improved hull regeneration; another is to engage at long range. With sufficiently powerful energy weapons, you can destroy their fleets before they enter attack range."
tactic_v_swarm: "Mercenary Tactic: Propagation Swarm"
CAPTURE_QUEEN_DESC: "A recent space battle in the [queen_system.GetName] system left a Propagation Swarm queen near death, but still alive. Capturing it would be a major intelligence victory."
tech_swarm_strike_craft_1_desc: "Collecting samples from defeated Propagation Swarm allows us to clone and reprogram their genetics, creating our own combat weapons."
NAME_Prethoryn: "Propagation Swarm"
NAME_Feral_Prethoryn: "Feral Propagation Swarm"
NAME_Prethoryn_Armies: "Propagation Swarm Forces"
NAME_Prethoryn_Star_Brood: "Propagation Swarm Star Brood"
PRETHORYN_SHIP_PrethorynSwarmer: "Propagation Swarm Swarmer"
PRETHORYN_SHIP_PrethorynSwarmling: "Propagation Swarm Swarmling"
PRETHORYN_SHIP_PrethorynWarrior: "Propagation Swarm Warrior"
PRETHORYN_SHIP_PrethorynBroodMother: "Propagation Swarm Brood Mother"
PRETHORYN_SHIP_PrethorynInfestor: "Propagation Swarm Infestor"
NEW_ACHIEVEMENT_2_21_DESC: "Successfully capture a Propagation Swarm queen"
crisis.250.desc: "The queen has spawned a new Propagation Swarm fleet, which will orbit [Root.Capital.GetName]. As long as the queen remains under our control, these creatures are absolutely loyal and will follow all our orders."
crisis.252.desc: "During a recent engagement with a Propagation Swarm fleet in the [battle_system.GetName] system, our forces managed to seize some eggs being carried by one of their queens. The eggs hatched shortly afterward, revealing a §Hqueen§!.\n\nOur scientists have pacified this queen using neurotransmitters. It now appears to obey our commands as if it were part of the original Swarm hive mind. We might be able to use this queen to cultivate a small Swarm of our own."
relic_queen_spawn: "Raise a substantial Propagation Swarm fleet"
r_prethoryn_queen: "「Propagation」 Tayzzyronth"
r_prethoryn_queen_desc: "This captured Propagation Swarm queen has been pacified using neurotransmitters. It can now be used to breed a sizable Swarm fleet."
crisis.52.2.a.response: "Many Sentinels have military backgrounds. We are all survivors of fleets that fought the Propagation Swarm. Though we were defeated, we have learned from our experience and strive not to repeat our mistakes.\n\nAs I said, the Sentinels recruit from all species in the galaxy. Our hope rests with a small remnant of a lost empire that gifted us secret technologies and mothballed fleets."
crisis.76.desc: "After much hardship, our galaxy has achieved victory — the Propagation Swarm is defeated. At times, I feared this day might never come. But now, I have only one final task.\n\nAs Grand Master of the Sentinels, I hereby disband the order. Our only purpose was to defeat the Propagation Swarm. Since that goal has been achieved, it is time for us to part ways. To prevent our existing ships from being misused, they will be decommissioned.\n\nMay the end of this galactic calamity mark the beginning of a new era of peace. This is Sentinel One, communication ended."
crisis.78.desc: "This is Sentinel One. The galaxy is in a critical state, but I have some good news.\n\nThrough lessons learned in prolonged combat and arduous research, our agents have compiled extremely detailed anatomical data on the Propagation Swarm creatures. For example, did you know that a Swarm larva will burn violently if both its primary and secondary gallbladders are pierced simultaneously?\n\nWe will make these documents public. You can aim for these weak points we have identified, making your ships more efficient in combat."
sentinel_data_desc: "These detailed anatomical data on the Propagation Swarm were provided by the Sentinel order. With their help, we have identified several weak points in the Swarm creatures' exoskeletons."
crisis.121.name: "Feral Propagation Swarm Discovered"
crisis.121.desc: "After the Propagation Swarm's defeat, some Swarm creatures escaped. Without a central hive mind to guide them, these mindless beasts will mostly wither and fade.\n\nHowever, recent reports confirm that a large pack of feral Swarm has established a new nest in the §H[feral_prethoryn_system.GetName]§! system.\n\nIn the future, it is likely we will encounter feral Swarm nests in unclaimed systems once occupied by the Swarm. They are unlikely to develop into a major threat, however — these feral creatures are prone to infighting and show no signs of developing the intelligence to continue the Scourge."
crisis.52.a: "How did you manage to resist the Swarm?"
crisis.55.desc_03: "Now, conflicts between nations are meaningless. Using ships against each other instead of the Swarm is a colossal waste."
crisis.55.desc_05: "If you cannot face the Swarm directly, you can donate resources to us. This will strengthen our forces against the Swarm invaders."
crisis.55.a: "What do you know about the Swarm?"
crisis.71.a: "Of course... we will only use them against the Swarm."
crisis.71.b.response: "That doesn't matter. We only ask that you keep fighting. Every Swarm creature destroyed brings us closer to victory."
#crisis.101.desc: "One of our deep-space reconnaissance probes entered a battlefield debris field in the [queen_system.GetName] system, where the Propagation Swarm fought an unknown force. A Swarm queen appears to have been seriously injured in the battle and abandoned to die.\n\nThe reconnaissance probe reports that the queen is still alive. Now is a rare opportunity to capture a live Swarm queen."
crisis.105.desc: "[Root.GetName] has healed the queen's serious wounds. Science Officer [Root.GetLeaderName] removed the organs the queen used to communicate with its kin and implanted a small positronic device, granting complete control. The queen is now at our mercy, and its brood is growing in its belly. These offspring will obey only this queen, meaning they will obey only us. As long as the queen lives, we can cultivate a massive enslaved Swarm army!"
country.60.name: "Propagation Swarm Captured"
NAME_Domesticated_Prethoryn: "Domesticated Swarm"
