 #Himeko
NAME_jizi:"Himeko"
jizi_catch_phrase:""That is a journey to the starting point.""
jizi_backstory:"An adventurous scientist who, in her youth, encountered the stranded Astral Express in her homeland. At that time, something on the train showed her the world beyond her planet, the universe. Years later, when Himeko finally repaired the train and set sail into the stars, she realized that this was only the beginning. On the path of "Trailblazing" new worlds, more companions are needed — even if those who travel together face different directions, they are still under the same starry sky."
hsr_paragon.60.name:"Astral Express - Himeko"
hsr_paragon.60.a:"First Meeting"
hsr_paragon.60.a.response:"Welcome aboard, Trailblazer. I'm Himeko, the navigator of the Astral Express. I believe we will share an interesting journey."
hsr_paragon.60.b:"Hobbies"
hsr_paragon.60.b.response:"Blending various coffee beans is my specialty. I'll brew you a cup right now — I recommend it black, no milk."
hsr_paragon.60.c:"Observations"
hsr_paragon.60.c.response:"Searching for what you seek in the universe is not usually a matter of "Aha! That's it!" but rather "Could it be this? What if it isn't?" — deliberation, doubt, and hesitation."
leader_jizi_t1:"§MScorching Heat§!"
leader_jizi_t1_desc:"Combat is a precise design."
leader_jizi_t2:"§MMeltdown Burst§!"
leader_jizi_t2_desc:"I'm never one to refuse."
leader_jizi_t3:"§MPress the Advantage§!"
leader_jizi_t3_desc:"Fancy a cup of coffee?"
leader_jizi_t4:"§MGalactic Railroad Night§!"
leader_jizi_t4_desc:"In Pom-Pom's eyes, I've always been just a train mechanic."
leader_jizi_t5:"§MFalling Fire from Heaven§!"
leader_jizi_t5_desc:"Humans never hide their desire to control the stars... and I am no exception."
