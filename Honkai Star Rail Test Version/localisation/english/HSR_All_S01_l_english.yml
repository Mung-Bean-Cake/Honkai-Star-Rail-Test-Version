DOT_SR_Dvalin.011.name:"Gift of the Trailblaze Heavenly Lord: Hyperion"
DOT_SR_Dvalin.011.desc:"Hyperion is a floating battleship developed by Schicksal, the flagship of the 5th Valkyrie Squad led by Murata Himeko, stationed at St. Freya Academy, and a core combat vehicle throughout the main storyline. Ship length 278.5 meters, deck length 182 meters, standard crew 50 to 200; powered by 6 fusion reactors, equipped with Leonov anti-gravity engines, capable of vertical takeoff and long-term low-altitude hover. Originally designed as an aircraft carrier, it was refitted under Himeko to remove carrier facilities and enhance direct firepower: 3 430mm railguns and 3 270mm railguns on each side, supplemented by 10 point-defense systems, serving as a front-line assault platform against hundred-meter-class Honkai beasts. Now, I gift you this Hyperion – may you ride this ship, command the wind, and sail across ten thousand miles of stars!"
DOT_SR_Dvalin.011.a:"Alright"
DOT_SR_Dvalin.011.b: "Thank you"
