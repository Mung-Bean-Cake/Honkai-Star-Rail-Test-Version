#Qianye · Blade
NAME_qianyeren:"Qianye · Blade"
qianyeren_catch_phrase:""All grievances end here.""
qianyeren_backstory:"Body like spring wood, heart like dead ashes, yet fingertips still hold the sparks of the craftsman. The accumulated grudge ignites again, and he vows to send himself and the god to the other shore — this broken body, forged a thousand times... what answer will it cast?"
hsr_paragon.70.name:"Qianye · Blade"
hsr_paragon.70.a:"First Meeting"
hsr_paragon.70.a.response:"I remember you, Trailblazer. Years have tempered us, sharpening us both. You are still you, and I am still I."
hsr_paragon.70.b:"Greeting"
hsr_paragon.70.b.response:"You're here... have you eaten today?"
hsr_paragon.70.c:"Observations"
hsr_paragon.70.c.response:"Though our paths are different... our connection is not yet over."
