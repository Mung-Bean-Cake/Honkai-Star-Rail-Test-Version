SR_belobog.101.title:0 "Rift Monster Invasion!"
SR_belobog.101.desc:0 "Frontline forces on Jarilo-VI have observed large numbers of Rift monsters surging toward our activity zones. If we are defeated, the consequences will be dire."
SR_belobog.101.a:0 "Prepare for battle!"

SR_belobog.111.title:0 "Warriors Return Successfully"
SR_belobog.111.desc:0 "A silver lining! Our warriors have successfully withdrawn from the failed battlefield, returning within the still-standing walls. According to survivors, after losing contact with command, they relied on their rich experience and knowledge to evade Rift creatures safely, returning in near-perfect condition to fight for Belobog again."
SR_belobog.111.a:0 "Send these heroes to rest; they must be exhausted."
SR_belobog.112.title:0 "A Heavy Price"
SR_belobog.112.desc:0 "The warriors paid a heavy price to successfully retreat from the lost battlefield. However, there was no joy of survival on their faces, because their survival was built on the blood of their comrades. The air was thick with grief; they were eager to return to the battlefield and avenge their fallen brothers."
SR_belobog.112.a:0 "The Rift monsters must pay with blood!"
SR_belobog.112.b:0 "Someone must pay for this loss, whether the Rift monsters or the command."
SR_belobog.113.title:0 "Rift Monster Counterattack"
SR_belobog.113.desc:0 "Our forces suffered a strong counterattack from Rift monsters during the retreat. The warriors had no choice but to leave a rearguard — even though everyone knew only silence awaited them.\nThanks to the sacrifice of the rearguard, some warriors successfully retreated to the defensive line. But no one would call this a success; those heroes will forever remain on this land.\nWe should immediately begin planning the next steps, not only for the fallen warriors but also for our future."
SR_belobog.113.a:0 "Award these brave warriors; their deeds deserve to be remembered."
SR_belobog.113.b:0 "The Rift monsters must pay!"
