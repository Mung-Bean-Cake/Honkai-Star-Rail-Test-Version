tr_cunhu_fengrao_1:"§BPlanetary Purifier§!"
tr_cunhu_fengrao_1_flavor:"Day 10238, the pollution in the Kuveida Nebula still lingers. You sit on the glass mountain; before the leaking energy melted it, this used to be a corner of the desert. Your modified body creaks; you leisurely adjust the readings; it absorbs the residual radioactive material in the air and compresses it into warm-colored crystals.\nDay 27349, the third planet of Kuveida, pollution still remains. You plant a flower; it has yet to sprout. They laugh at you, saying your efforts are but a drop in the bucket, that the homeworld has become a dead cemetery, and no new life will ever grow there. You turn the soil, spray the accelerant for decay. You walk silently across every inch of land, until life returns once more."
