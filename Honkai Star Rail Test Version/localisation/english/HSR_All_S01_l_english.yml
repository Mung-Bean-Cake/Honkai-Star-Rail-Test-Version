concept_new_cyborg_pop_bonus_workforce_mult: "§MCyber Synergy Rate§!"
concept_new_cyborg_pop_bonus_workforce_mult_desc: "When synergy rate is ≤100%, cybernetics operate in normal mode, providing 75% of the value as §Hjob efficiency§! and 50% as §Hjob output§!.\nWhen synergy rate >100%, cybernetics operate in overclock mode, providing 100% of the value as §Hjob efficiency§! and 75% as §Hjob output§!, while increasing §Hpop amenities usage§!, §Hpop housing usage§!, and §Hjob upkeep§! by 25% of the value; each $pop_group_unit$ £pop£ §Hpop§! consumes 0.25 £energy£ §Y$energy$§! per month."
