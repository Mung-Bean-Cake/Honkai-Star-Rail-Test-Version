leader_trait_jiyi_ipc_leader_desc:"In currently available records, one of Fuli's appearances occurred precisely during Louis Fleming's final public appearance. The Remembrance Aeon Fuli suddenly appeared before Louis Fleming as he finished his speech, like a ghost, and disappeared shortly after. Thereafter, Louis left the venue and never appeared in public again."
 #Situation
situation_cunhu_support_team: "§HAmber Lord Support Team§!"
situation_cunhu_support_team_type: "§HAmber Lord Support Team§!"
situation_cunhu_support_team_desc: "Delivery date: §Y[owner.situation_cunhu_support_team_timer]§!\n[owner.Getcunhu_support_team_use]\nCurrent output target: §Y[Owner.cunhu_support_team_once_again]§!\nCurrent inventory: §Y[Owner.cunhu_support_team_current_amount]§!\n[Owner.Getcunhu_support_teamstatus]\nThe Construction Materials Logistics Department is the longest-standing department of the IPC. Its predecessor was the "Amber Lord Support Team", reorganized under Louis's rise. The current director is the portly Taravan Keane — one of the few confirmed Emanators of Preservation in the Corporation and a member of the Seven-Player Board. He holds the sacred task of transporting construction materials to Qlipoth, solidifying his position. In the beginning, they simply bartered, but as some clever individuals emerged among them, they began to use information asymmetry to raise prices and buy more materials. Their business grew larger and larger, and eventually they issued Credits and founded the Interastral Peace Corporation. To this day, they still pile material after material near Qlipoth, but He has never used them.\n§P"Hoarding? I find that term distasteful. I call it 'selling to the highest bidder.' If you can't afford it, that's your problem, not mine."§!"
situation_cunhu_support_team_stage_1:"Months remaining"
situation_cunhu_support_team_outcome:"If the quota is met, we will gain a large amount of unity.\n[Owner.Getcunhu_support_teamstatus]"
stage_cunhu_support_team_effects:"Exploiting demand between different worlds, transporting goods where they are needed."
cunhu_support_team_use_minerals:"Currently collecting: §Y$minerals_with_icon$§!"
cunhu_support_team_use_alloys:"Currently collecting: §Y$alloys_with_icon$§!"
cunhu_support_team_use_consumer_goods:"Currently collecting: §Y$consumer_goods_with_icon$§!"
 #Events
hsr_ipc.2012.name:"Transport Complete"
hsr_ipc.2012.desc:"As the subspace portal opens, fleets loaded with construction materials pass through to Qlipoth's wall-building site. Amid the colossal cosmic barrier and the Aeon, our fleets move like ants. The great Aeon remains focused on hammering the barrier, paying no attention to the mountains of materials piled nearby..."
hsr_ipc.2012.a:"Keep up the good work!"
hsr_ipc.2013.name:"Insufficient Materials Collected"
hsr_ipc.2013.desc:"We failed to collect enough materials! This is a disgrace to the entire Corporation. We need to reassess our plan."
