leader_qianyeren_t1_add:"§BSwitch§! §RSkill\n§MBones as Fuel, Flesh as Kindling§!\nWhen §HQianye · Blade§! serves as a §EPlanetary Governor§!, gain one §GInfinite Fury§! each month — upon accumulating 15, when entering space combat, switch to §MThousand Forges into One, Ten Thousand Calamities Reduced to Ash§!\n§MThousand Forges into One, Ten Thousand Calamities Reduced to Ash§!\nImmediately grants substantial combat bonuses to this skill."
