 #Districts
district_luosi_planet_1:"Simulated City Center"
district_luosi_planet_1_plural:"Simulated City Centers"
district_luosi_planet_1_desc:"The Simulated City Center can adjust its internal structure at any time according to the inhabitants' species, preferences, and moods."
district_luosi_planet_2:"Basic Analysis Center"
district_luosi_planet_2_plural:"Basic Analysis Centers"
district_luosi_planet_2_desc:"Basic research center for everyday R&D needs."
district_luosi_planet_3:"Refining Production Center"
district_luosi_planet_3_plural:"Refining Production Centers"
district_luosi_planet_3_desc:"Produces resources needed for production, and also grows some food for organic beings as needed."
district_luosi_planet_4:"Industrial Assembly District"
district_luosi_planet_4_plural:"Industrial Districts"
district_luosi_planet_4_desc:"A variant of industrial and assembly districts. For many machines, upgrading and reinforcing their existing bodies is a good method, so industrial districts often also have machine assembly centers."
district_luosi_planet_5:"Data Exchange Center"
district_luosi_planet_5_plural:"Data Exchange Centers"
district_luosi_planet_5_desc:"A district used to add additional equation content. It is very large, mainly housing machines, with only a small number of personnel stationed here."
district_luosi_planet_6:"Collection Center"
district_luosi_planet_6_plural:"Collection Centers"
district_luosi_planet_6_desc:"For the machines of Screwllum, collecting is a major hobby. Some even place dangerous weapons from other civilizations in museums..."
 #Traditions
council_agenda_agenda_luosi_name: "Iteration"
council_agenda_agenda_luosi_desc: "Upgrade, not rebuild."
tradition_luosi: "Iteration"
tradition_luosi_desc: "Upgrade, not rebuild."
tr_luosi_adopt:"Iteration"
tr_luosi_adopt_desc:"For machines, upgrading themselves is their special advantage."
tr_luosi_finish:"Unite into One"
tr_luosi_finish_desc:"For machines, physical form does not affect self-identity — no matter how modified or damaged."
tr_luosi_1:"Combine-Separate"
tr_luosi_1_desc:"Physical form is only a carrier; we can combine to form factories, warships, or separate as needed."
tr_luosi_1_tt:"Unlock Resolution: §BCombine-Separate§!; allows us to convert machine population into warships or special industrial facilities, or dismantle fleets or industrial facilities in the system into machine population."
tr_luosi_2:"Equation-Adjustment"
tr_luosi_2_desc:"We can fine-tune certain internal parameters of the equation to meet our requirements without changing the current state."
tr_luosi_2_tt:"Allows adding additional code to the Stellar Differential Engine."
tr_luosi_3:"Equation-Automation"
tr_luosi_3_desc:"For our industrial situation, we can automate certain industries."
tr_luosi_3_tt:"Unlock Building ['building:herta_luosi_automated_1']"
tr_luosi_4:"Equation-Expansion"
tr_luosi_4_desc:"We can bring our current Screwllum technology to other places, which requires significant effort."
tr_luosi_4_tt:"Unlock Resolution: §BStellar Differentiation§!"
tr_luosi_5:"Communication-Connection"
tr_luosi_5_desc:"We should steadfastly adhere to the path of peaceful development and establish connections with all civilizations."
tr_luosi_5_tt:"Each treaty signed provides 5% job output, happiness, and job efficiency.\nUnlock Edict: ['edict:hsr_luosi_intergerte'], allowing integration with machine empires with relations > 1000 into a joint nation."
 #Resolutions
decision_luosi_pop_change:"Combine-Separate"
decision_luosi_pop_change_desc:"Physical form is only a carrier; we can combine to form factories, warships, or separate as needed."
decision_luosi_pop_change_tt:"We can choose to convert machine population into warships or integrate them better into industrial production, or dismantle fleets or industrial facilities in the system into population."
decision_luosi_build:"Stellar Differentiation"
decision_luosi_build_desc:"Convert a planet into a Stellar Differential Engine."
edict_hsr_luosi_intergerte:"Integrate Machine Factions"
edict_hsr_luosi_intergerte_desc:"As we develop, we can form a joint nation with friendly machine empires. Allows integration with machine empires with relations > 1000 into a joint nation."
d_luosi_industry_slot:"Auxiliary Industrial Complex"
d_luosi_industry_slot_desc:"Industrial clusters formed when machines combine with other things."
