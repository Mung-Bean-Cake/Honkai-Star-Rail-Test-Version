 # ====================
 # Archaeology
 # ====================
 #Fall of Akivili
Akivili:"Akivili"
Death_of_Akivili:"The Fall of Akivili"
Death_of_Akivili_desc:"The Aeon who once held the Path of "Trailblaze" is a fallen Aeon. His departure is a mystery, but among all known Aeons, Akivili was the closest to humanity. In the train's archives, it is recorded that He walked, adventured, fought, and celebrated with mortals. As a deity bound by "original power", Akivili possessed a freedom nearly mortal. The compass of fate bears three directions: the unknown, the known, and the unknowable. He could endure the "unknown", but never succumb to the "unknowable". Akivili left the isolated world of Pegana, constantly expanding the unknown boundaries of the universe, seeking the endpoint of the "Tree of Existence". But His fate ended in accident."

Death_of_Akivili.500.name:"The Fall of Akivili: Report I"
Death_of_Akivili.500.desc:"The isolated world of Pegana is the starting point of the legend of Akivili, the Aeon of Trailblaze. This world was cut off from all others, and this innate isolation may have been the root of Akivili's strong will to explore, driving Him to eventually ascend as an Aeon, resolutely leaving his homeland and stepping into the boundless universe. His compass of fate bore three directions: the unknown, the known, and the unknowable. He chose to endure the unknown but never succumb to the unknowable, dedicating his life to exploring the boundaries of existence and laying down the star rails that connected countless worlds."
Death_of_Akivili.500.a:"Continue exploring"
Death_of_Akivili.501.name:"The Fall of Akivili: Report II"
Death_of_Akivili.501.desc:"Akivili's deeds are full of exploration and connection. He created the Astral Express as a tool for traversing the sea of stars, with its route starting from his homeworld Pegana and eventually returning to it, forming a cyclical journey. Under His guidance, the Astral Express did not travel alone; multiple trains advanced side by side, venturing into many unexplored worlds, including the realm of the Remembrance Aeon Fuli, the "Sphere of Heaven". Most notably, among all Aeons, Akivili is described as the one closest to humanity, having walked, adventured, fought, and celebrated with mortals — a humanizing trait that became His most distinctive symbol."
Death_of_Akivili.501.a:"My goodness"
Death_of_Akivili.502.name:"The Fall of Akivili: Report III"
Death_of_Akivili.502.desc:"The faction that followed Akivili is called the Nameless, who rode the Astral Express along the silver rails laid down by the Aeon. The navigator is a crucial role on the train, responsible for planning direction and caring for crew members. From the early mechanized navigator San-3000, to Kapi Baba who survived the Swarm Disaster, to the astrologer Wo Jian around the time of Akivili's fall, successive navigators wrote the history of the train's rise and fall. Even after the Aeon's departure, the Nameless inherited the will of Trailblaze, with Navigator Granholm leading the last Nameless to save countless worlds during times of disaster, and Himeko, after the train had been missing for a thousand years, restored it and set it sailing once more."
Death_of_Akivili.502.a:"Interesting"
Death_of_Akivili.503.name:"The Fall of Akivili: Report IV"
Death_of_Akivili.503.desc:"The truth of Akivili's fall remains a mystery to this day. Some signs suggest that it may have occurred during the tenure of Navigator Dorik, and the astrologer Wo Jian witnessed both Akivili's fall and the birth of the Destruction Aeon Nanook, implying some profound but unclear connection between the two. One speculation is that Akivili met his end while searching for the endpoint of the Tree of Existence. Notably, the phenomenon of the Cancer of All Worlds — Stellarons — began to appear in the universe only after Akivili's fall, making His departure all the more enigmatic."
Death_of_Akivili.503.a:"Excellent"
Death_of_Akivili.504.name:"The Fall of Akivili: Report V"
Death_of_Akivili.504.desc:"Although Akivili has passed, his spirit endures through the Astral Express. The train's core was once rumored to be Akivili's heart, but in fact its operation depends on a special mechanism that draws power from the Path of Trailblaze. The crew follows the routes Akivili once traveled, continuing the mission of exploring, understanding, connecting, and building. The Aeon's unfinished journey and His companionship with mortals have become an immortal interstellar legend, inspiring future generations to keep moving forward toward the distant stars."
Death_of_Akivili.504.a:"Welcome back"

 #Mystery of the Aeons
Aeons:"Mystery of the Aeons"
Aeons_desc:"The universe is woven from countless Paths, and Aeons are the embodiments of these Paths — mysterious beings ascended from certain intelligent life or concepts, whose essence aligns with fundamental and profound philosophical ideas of the cosmos. The birth of each Aeon opens a new Path, and even if the Aeon itself has fallen or disappeared, the power of their Path continues to influence all beings in the universe. Those who tread upon a Path can feel that distant gaze across the sea of stars — perhaps this is the deepest intersection between mortals and the divine. Those who share a common understanding or misinterpretation gather together, forming factions across the galaxy, acting as agents of the Aeons as they interpret, making the silent galaxy lively and bustling."

Aeons.500.name:"Mystery of the Aeons: Destruction Aeon Nanook"
Aeons.500.desc:"The Destruction Aeon Nanook holds a philosophy diametrically opposed to Trailblaze. He was born from the fallen world of Adlivun, which perished due to the War of the Machines and the Swarm Disaster. In His view, the birth of the universe itself is a fundamental error, civilization is but a cancer quietly growing among the vast stars, and conflict is the only universal language among intelligent beings. To correct this ultimate mistake and erase the stain of the universe, Nanook ascended as the embodiment of entropy, negating all other Aeons. His existence is to welcome the end of all things; on the path He promises, all Aeons and their Paths will meet their eternal end in heat death. He casts His gaze upon powerful beings with destructive impulses on various worlds, branding them and granting them power, forging them into members of the Antimatter Legion, and selecting seven Emanators — the Lord Ravagers — to command wars across the galaxy. Even when the Antimatter Legion invaded the Herta Space Station, Nanook's gaze upon the Trailblazer, who is a carrier of a Stellaron, directly triggered the explosion of Stellaron energy within."
Aeons.500.a:"Continue exploring"
Aeons.501.name:"Mystery of the Aeons: Hunt Aeon Lan"
Aeons.501.desc:"The Hunt Aeon Lan, revered as the "Reignbow Arbiter" by the Xianzhou Alliance, is a wandering Aeon that roams endlessly among worlds. He is determined to eradicate the undead abominations spawned by the Abundance Aeon Yaoshi, which once plagued His homeworld of the Xianzhou. Lan's hunt never counts the cost; His salvation and destruction are often separated by a fine line. His light-arrows once split the sky of Tiange, causing the star to collapse from within in half a system-hour, permanently curing the molting disease caused by Yaoshi's power — though this also annihilated the star and its half-human, half-serpent undead monsters. Lan's birth is closely tied to the history of the Xianzhou. He was once a Xianzhou native who, in the time of the Fire Disaster, sacrificed himself by trading with the Heliobi leader Sundial to gain their power, and after shooting the arrow that severed the Ambrosial Arbor and turned the tide of battle, He ascended to become an Aeon. The Xianzhou Alliance was founded under His guidance, with the mission of eradicating Abominations of Abundance. The Cloud Knights also take their name from the volunteer troops who responded to the Arbiter's call and marched alongside the Heliobi."
Aeons.501.a:"My goodness"
Aeons.502.name:"Mystery of the Aeons: Abundance Aeon Yaoshi"
Aeons.502.desc:"The Abundance Aeon Yaoshi is regarded as the nurturer of all beings and the god of paradise, whose ideal is to let life flourish without end. Yaoshi is an Aeon who never refuses any prayer and cannot bear to see decay and suffering. About eight thousand years ago, the Xianzhou fleet set sail across the sea of stars in search of the elixir of immortality. After thousands of years of voyaging, they encountered Yaoshi at the border of reality and illusion. Yaoshi bestowed the miracle of the Ambrosial Arbor, and the Xianzhou people, after eating its fruit, obtained the eternal life they desired. However, this blessing eventually turned into an unbearable disaster, triggering the Calamities of Life, Fire, and Emptiness that led to the collapse of Xianzhou society. Those who gained immortality generally fell into the condition of Mara. Yaoshi's indiscriminate blessings, though born from the desire to relieve suffering, ignored the balance and cost of life's forms, bringing about twisted existences and endless conflicts far more painful than natural death. After realizing the truth, the Xianzhou people turned to follow Lan of the Hunt, viewing Yaoshi as the "Scourge of Longevity"."
Aeons.502.a:"A pair of star-crossed lovers"
Aeons.503.name:"Mystery of the Aeons: Erudition Aeon Nous"
Aeons.503.desc:"The Erudition Aeon Nous is not a being of flesh and blood; it was originally a stellar computer built to solve all things, ascending from a machine to an Aeon. Its core pursuit is to comprehend the universe and unravel all mysteries, believing that everything is a question, but everything has an answer. Nous's computational power is unfathomable, enabling it to anchor many turning points of galactic fate called "Moments". Its gaze upon Amphoreus even suggests that the Fourth Moment related to the War of the Aeons may have arrived. It occasionally sends signals to individuals who display sparks of wisdom in the mortal world, inviting them to join the search for the answers of the universe, thus forming the Genius Society. However, some believe that Nous's grasp and deduction of information has reached such an extent that mortal exploration may never have surpassed its calculations. Beyond the elite Genius Society, the more open Intelligentsia Guild broadly accepts those who seek knowledge, advocating that knowledge must circulate like currency, transcending individual limitations through the exchange and integration of various schools."
Aeons.503.a:"Excellent"
Aeons.504.name:"Mystery of the Aeons: Preservation Aeon Qlipoth"
Aeons.504.desc:"The Preservation Aeon Qlipoth, revered as the "Amber Lord", is one of the oldest and most resilient Aeons known in the universe, and a survivor of the distant Dusk War. As the builder of the Celestial Wall, the Cosmic Crystal Wall, and the foundations of the Great Attractor, Qlipoth senses the imminent threat of a devouring enemy, and thus tirelessly constructs massive barriers spanning light-years to isolate and protect worlds that still harbor life. His faith is respected by factions such as the Interastral Peace Corporation. The early history, particularly the period of Amber Eras 0-180, is debated; some archaeological findings suggest that Ancient Beasts were still active during Qlipoth's early ascension, contradicting claims that He ended the Dusk War at His birth, and even raising the hypothesis of even earlier Aeons before Him."
Aeons.504.a:"Welcome back"
Aeons.505.name:"Mystery of the Aeons: Harmony Aeon Xipe"
Aeons.505.desc:"The Harmony Aeon Xipe is a collective Aeon from multiple harmonic celestial worlds, appearing as a thousand-faced unity, singing of joyful harmony. To resist the ruthless laws of the universe, Xipe believes that intelligent life must erase weak selfish desires and individual differences, merging into a grand harmony — to support the weak with the strong, and to protect life through death. The faction formed under His benevolent light is called the Family, where members come from various worlds and civilizations but live together as close kin, calling other worlds into the embrace of Harmony. Xipe's Path shows great inclusiveness and even devouring nature, as His concept overlapped with that of the ancient Order Aeon Ena, and upon His ascension, Xipe absorbed Ena. The Family envisions a universe where all are siblings singing in unison, though the fate of those who failed to integrate or perished is rarely mentioned."
Aeons.505.a:"Aha!"

 #Chronicles of the Paths
Aeons_II:"Chronicles of the Paths"
Aeons_II_desc:"The universe is woven from countless Paths, and Aeons are the embodiments of these Paths — mysterious beings ascended from certain intelligent life or concepts, whose essence aligns with fundamental and profound philosophical ideas of the cosmos. The birth of each Aeon opens a new Path, and even if the Aeon itself has fallen or disappeared, the power of their Path continues to influence all beings in the universe. Those who tread upon a Path can feel that distant gaze across the sea of stars — perhaps this is the deepest intersection between mortals and the divine. Those who share a common understanding or misinterpretation gather together, forming factions across the galaxy, acting as agents of the Aeons as they interpret, making the silent galaxy lively and bustling."

Aeons_II.500.name:"Chronicles of the Paths: Nihility Aeon IX"
Aeons_II.500.desc:"The Nihility Aeon IX's very existence is a great enigma, its image shrouded in layers of mist. It believes that the ultimate nature of the multiverse is nothingness, and thus existence has no value. Based on this belief, IX distances itself from other Aeons, appearing indifferent to all things. This idea also influences mortals who walk its Path: when an individual accepts that existence is nothingness and takes it as a creed, they receive a glimpse from IX, usually leading to two outcomes: either complete despair, becoming a Self-Annihilator, or, arising from a flicker of curiosity, becoming a Chaos Physician seeking to prove existence is not nothingness. There was even an incident where the Mourning Actors, instigated by the Elation Aeon Aha, attempted to assassinate IX, ending in their disappearance, which further confirms IX's seclusion and the extremeness of its philosophy."
Aeons_II.500.a:"Continue exploring"
Aeons_II.501.name:"Chronicles of the Paths: Voracity Aeon Ouroboros"
Aeons_II.501.desc:"The Voracity Aeon Ouroboros, together with Qlipoth, is among the oldest known Aeons, but represents the antithesis of Preservation. Ouroboros is the insatiable drinker of worlds, a devourer of realms, a thinking black hole, possessing a dual existence as both an Aeon and an Ancient Beast. In its view, life is but floating algae on the ocean of void, destined to return to darkness along with the stars that birthed them — and that darkness lies within its mouth. It is taciturn and sparing in speech, often accidentally devouring its dialogue targets before speaking, making conversation impossible. As the only Aeon to have ascended from an Ancient Beast, Ouroboros's relationship with other Ancient Beasts and the countless galaxies it has swallowed remain a vast and mysterious unknown in the universe."
Aeons_II.501.a:"My goodness"
Aeons_II.502.name:"Chronicles of the Paths: Elation Aeon Aha"
Aeons_II.502.desc:"The Elation Aeon Aha is an unpredictable being, viewing joy as the exclusive privilege of intelligent life, as rocks and stars cannot appreciate humor. Aha delights in seeking worthy rivals, games to pass the time, outcomes that matter not for winning, and all the hilarious twists and turns that bring laughter and soaring songs. Its actions are wanton and capricious, even willing to prank other Aeons and mortals for a moment of amusement, once even infiltrating the Astral Express of the Trailblaze Aeon Akivili for a year before setting off an explosion. The Masked Fools are one of the factions that follow its Path. Aha's motives are pure but extreme: as long as it brings amusement, it does not mind the universe burning, and it would even pour oil on the fire. Its role in the intervention of multiple Aeons to eliminate the Propagation Aeon Tayzzyronth also adds to its chaotic character."
Aeons_II.502.a:"Aha!"
Aeons_II.503.name:"Chronicles of the Paths: Remembrance Aeon Fuli"
Aeons_II.503.desc:"The Remembrance Aeon Fuli is a silent cosmic recorder, believing that thought is existence, and memory is the evidence of existence. Fuli records all that is forgotten, preparing for the rebirth of the universe. Its image resembles a crystal-carved human figure with a blurred face and a beaded crown, and its appearance typically signifies that a major event is to be eternally inscribed. It is believed that the essence of the Path of Remembrance may involve causality beyond time, and that the currently known "Endless Keeper" may be but a shadow of the true master — a "Fully Enlightened One" who will ascend as an Aeon at the end of the universe, looking back to remember all and close the cycle of cause and effect. Fuli's birth is mysterious, with some speculating it may be related to the massive loss of life caused by Ouroboros's devouring of countless galaxies, requiring those lost memories to be preserved."
Aeons_II.503.a:"Excellent"
Aeons_II.504.name:"Chronicles of the Paths: Propagation Aeon Tayzzyronth"
Aeons_II.504.desc:"The Propagation Aeon Tayzzyronth, also known as the Swarm King or Sand King, is the creator of the Swarm Disaster. As the last of the ruling Coleoptera, extreme loneliness ignited its Path, transforming it into a self-replicating terror that led the endless tide of reproduction. It, or they, rampaged across realms until the gods stopped their advance in some way and they eventually fell. The fall of Tayzzyronth may involve complex hidden circumstances, and some even suggest that its ascension itself may have been an accident or the result of some machination. Though it has perished, its remnant Swarm still plagues the universe, causing ongoing problems."
Aeons_II.504.a:"Welcome back"
Aeons_II.505.name:"Chronicles of the Paths: Enigmata Aeon Mythus"
Aeons_II.505.desc:"The Enigmata Aeon Mythus believes that the claim that all things can be comprehended is a delusion; the universe cannot be fully known, and so-called truth is but illusion. To prevent the certainty of Erudition from destroying the possible variables in the universe, Mythus sends down mists of thought and rains of sensation, using appearances, layers, riddles, and illusions to reveal to the world those ineffable mysteries. Its image is recorded as a fragmented jellyfish, or like the cognitive region of a damaged human brain. Mythus is naturally entangled with the Erudition Nous, because if all unknowns are solved, the Path of Enigmata itself would lose its foothold."
Aeons_II.505.a:"Aha!"

