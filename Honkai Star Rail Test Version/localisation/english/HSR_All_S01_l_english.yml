#Asta
NAME_aisida:"Asta"
aisida_catch_phrase:"You're here. The observation array we adjusted earlier should have results now. Want to come take a look?"
aisida_backstory:"A young lady with boundless curiosity and energy, the nominal director of the Space Station「Herta」. Whether managing the diverse opinions of the staff or directly yet politely dealing with the Intelligentsia Guild's various challenges, Asta handles it with ease. After all, commanding a space station... is simpler than inheriting a family business!"
hsr_paragon.3.name:"Space Station「Herta」- Asta"
hsr_paragon.3.a:"First Meeting"
hsr_paragon.3.a.response:"Hi, Trailblazer, I'm Asta, the director of the Space Station「Herta」. When I need your help, I'll definitely tell you... don't worry, I won't be shy."
hsr_paragon.3.b:"Hobbies"
hsr_paragon.3.b.response:"Continuously invest funds into the station's construction, improve staff welfare, form a virtuous cycle, and also satisfy the director's, that is, my own, essential shopping needs."
hsr_paragon.3.c:"Observations"
hsr_paragon.3.c.response:"Even the surveillance room is under surveillance."
leader_aisida_t1:"§MMeteor Shower§!"
leader_aisida_t1_desc:"Receive the blessings of the stars~\n§BWhen completing system surveys, archaeological digs, or rift explorations, gain 1 §RMeteor§!"
leader_aisida_t2:"§MStellar Blessing§!"
leader_aisida_t2_desc:"A key to the mysteries of the stars, bestow your true blessing upon the Trailblazers!\n$leader_aisida_t2_effect_desc$"
leader_aisida_t2_effect_desc:"§BWhen in the Council, each §RMeteor§! provides 0.5% Energy output from jobs, 0.5% Trade output from jobs, 1% Sublight Speed, and 1% Jump Drive Range§!"
leader_aisida_t3:"§MAstronomy§!"
leader_aisida_t3_desc:"You've shown a weakness~\n$leader_aisida_t3_effect_desc$"
leader_aisida_t3_effect_desc:"§BEach §RMeteor§! provides 2%/1% Research output from jobs on planets/sectors§!"
leader_aisida_t4:"§MFlash of Inspiration§!"
leader_aisida_t4_desc:"Who will be the lucky one~"
leader_aisida_t5:"§MSpectral Ray§!"
leader_aisida_t5_desc:"The stars will remember our names."
