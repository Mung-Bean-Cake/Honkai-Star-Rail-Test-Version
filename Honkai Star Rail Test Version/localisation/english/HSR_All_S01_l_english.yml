 #Technologies, Storms, Misc
r_ev_fleet_bingyangzhang:"Stellaron Locator"
r_ev_fleet_bingyangzhang_desc:"An artificial relic simulating the principles of the Rift. Theoretically existing worlds are encapsulated in spherical planar ornaments."
xinghe_test_chain_title: "Stellaron Tracking Records"
xinghe_test_chain_desc: "§YHow to seal a Stellaron?\n-- Upon first encountering a Stellaron, research ['technology:tech_seal_star_core']\n-- Build a starbase in the system with a construction ship.\n-- Select the Stellaron-affected planet and activate the planet resolution.\n§!§REach sealing grants a large amount of research points.\nEvery ten years, all unsealed Stellarons will escalate in level; please deal with them promptly.§!"
databank_cosmos_chronicles:"Stellar Chronicles"
concept_xinghe: "Stellaron Disaster"
concept_xinghe_desc: "Upon first entering an unowned system, there is a chance that a random planet becomes a Stellaron. Stellarons come in three types.\n$pc_shielded_white$: Easy to seal; no negative events after opening.\n$pc_shielded_yellow$: Has a 75% chance to generate a ['cosmic_storm:xinghe_small_storm'] upon generation.\n$pc_shielded_red$: Generates a ['cosmic_storm:xinghe_big_storm'] upon generation, with a chance of sealing failure.\nUpon first encountering a Stellaron, gain the technology ['technology:tech_seal_star_core']. After research, Stellarons can be sealed.\n§CHow to find Stellaron locations?\n-Check the Stellaron Tracking Records in the intel log.§!\n§YHow to seal a Stellaron?\n-- Upon first encountering a Stellaron, research ['technology:tech_seal_star_core']\n-- Build a starbase in the system with a construction ship.\n-- Select the Stellaron-affected planet and activate the planet resolution.\n§!§REach sealing grants a large amount of research points.\nEvery ten years, all unsealed Stellarons will escalate in level; please deal with them promptly.§!\nA mysterious phenomenon that began appearing in Amber Era 2147. On the interstellar routes created by "Trailblaze", some obscure substances have disrupted the flow of imaginary energy. It is like encountering a cliff on a mountain climb, a maelstrom on a voyage — once-smooth interstellar journeys become perilous and uncertain. This phenomenon is highly aggressive, infecting neighboring worlds in the form of mysterious objects known as "Stellarons" — like cancer cells spreading across the universe. The Interastral Peace Corporation calls it the "Cancer of All Worlds" and warns interstellar travelers never to take it lightly: because worlds afflicted by the Cancer undergo dramatic changes in civilization and ecosystems, often losing their way, rarely finding a way out. There are many speculations about the "Cancer of All Worlds", most of which are linked to "Destruction" Nanook and the "Antimatter Legion". These cosmic destroyers often appear together with Stellarons. Whether this is coincidence or necessity is still unknown.\nAs the "Cancer of All Worlds" spreads across worlds, a phenomenon called the "Rift" also quietly grows. The Intelligentsia Guild believes there is a causal relationship: the "Rift" is spawned by "Stellarons", transforming contacted objects and spaces into special Rift creations. These creations typically exist in the form of erosion, appearing to retain the memories and habits of the originals, but their external manifestations are vastly different, often showing strong exclusivity. Scholars studying the Rift warn that Rift-eroded objects should be considered entirely unrelated to their prototypes, and any illusions about them will lead to serious consequences. In addition to erosion, the Rift also records the Ethereal information of objects it contacts, mixing it with the Rift's own stored data to produce a kind of grafted Rift creation. In every world afflicted by the Cancer of All Worlds, countless relics, Rift monsters, and even mysteriously separated spaces are born in every corner. People are still studying the purpose behind this."
