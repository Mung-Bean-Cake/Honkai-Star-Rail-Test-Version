concept_fanyu_effect:"Path: 「Propagation」"
concept_fanyu_effect_desc:"§HUtility§! Path. Initially boosts §GPop Growth Speed§!, §GHabitability§!, reduces §GEmpire Size from Pops§!. As devotion increases, it boosts §HHappiness§!, §HMonthly Organic Pop Growth§!, §HJob Efficiency§!, §HSpecies Habitability Floor§!; reduces §HForced Migration Cost§!, §HPop Housing Usage§!, and additionally increases §RLeader Upkeep§!."
