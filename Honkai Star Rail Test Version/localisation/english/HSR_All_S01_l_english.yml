 #Welt
NAME_waerte:"Welt"
waerte_catch_phrase:"——Since I can't find a way back home and to peaceful life, let's begin fighting again? This time, no need to bear fate — follow your own will."
waerte_backstory:"A seasoned and steady former leader of Anti-Entropy, who inherited the name "Welt" and has saved the world from the brink of destruction many times. After the St. Fontaine incident, Welt was forced to travel through the Stargate with the instigator. Perhaps even he did not expect that what awaited him there would be a brand new journey and companions."
hsr_paragon.61.name:"Astral Express - Welt"
hsr_paragon.61.a:"First Meeting"
hsr_paragon.61.a.response:"Hello, I'm Welt Yang. Feel free to come to me if you encounter any difficulties."
hsr_paragon.61.b:"Hobbies"
hsr_paragon.61.b.response:"Studying history, making animations... these two are not contradictory."
hsr_paragon.61.c:"Observations"
hsr_paragon.61.c.response:"Do you know how the followers of "Preservation" Qlipoth evolved into the "Interastral Peace Corporation"? The Aeon wants to build a wall, and humans, to follow in the Aeon's footsteps, begin to seek materials for that wall — this is full of dark humor."
leader_waerte_t1:"§MGravity Suppression§!"
leader_waerte_t1_desc:"Even in the vast sea of stars, our traces will remain."
leader_waerte_t2:"§MVoid Barrier§!"
leader_waerte_t2_desc:"Time to decide."
leader_waerte_t3:"§MPrayer for Peace§!"
leader_waerte_t3_desc:"This galaxy can hold any possibility."
leader_waerte_t4:"§MSpace-Time Distortion§!"
leader_waerte_t4_desc:"You know nothing of the weight of this power."
leader_waerte_t5:"§MPseudo Black Hole§!"
leader_waerte_t5_desc:"Witness the shattering of stars... To be or not to be, you have no choice."
