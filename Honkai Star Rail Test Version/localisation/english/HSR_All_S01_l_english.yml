tr_xunlie_zhishi_1:"§BPre-simulator§!"
tr_xunlie_zhishi_1_flavor:"A good hunter does not strike first; they direct their prey and wait for them to fall into the trap. You fire into the empty space ahead, starting a ten-second countdown. Two hours ago, influenced by the machine divination, he abandoned his hovercraft and took public transport to the negotiation venue. One hour ago, the routine maintenance of the capsule tube was delayed by half an hour, making him anxious, and he ran to the venue regardless of decorum. Two minutes ago, the other party's tough attitude made him irritable; he stepped outside for air, and unexpectedly ran into his political opponent. He will exchange pleasantries for seven to nine minutes. Then, after nine seconds, the bullet will meet him."
tr_xunlie_zhishi_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_xunlie_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_zhishi_effect']：§G+1§!$TABBED_NEW_LINE$—Decryption: §G+3§!$TABBED_NEW_LINE$—Encryption: §G+3§!$TABBED_NEW_LINE$—Cloaking Strength: §G+3§!$TABBED_NEW_LINE$—Tracking: §G+10§!$TABBED_NEW_LINE$—Evasion: §G+10§!\nUnlock Edict: ['edict:tr_xunlie_zhishi_1_edict']\nUnlock Council Seat: $councilor_xunlie_zhishi_1$"
