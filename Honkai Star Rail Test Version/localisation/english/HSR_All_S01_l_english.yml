#Undying Path
NAME_busitu:"Undying Path"
busitu_catch_phrase:""The old wolf's fangs aren't gone yet.""
busitu_backstory:"Open for business, hard-boiled reasoning, relying on intuition yet solving cases repeatedly. A monkey as assistant, yearning for retirement, the detective sleeps in the fridge, waiting for the willing to take the bait. Beneath the phantom moon, the beast howls — how will his hunt end?"
hsr_paragon.66.name:"Undying Path"
hsr_paragon.66.a:"First Meeting"
hsr_paragon.66.a.response:"I am Undying Path, the famous detective of the "Undying Detective Agency". Here's my business card. I accept all kinds of commissions — from finding lost pets, posing as a parent for school meetings, to hunting interstellar fugitives, or even tracing the whereabouts of Aeons. What's your commission?"
hsr_paragon.66.b:"Greeting"
hsr_paragon.66.b.response:"Long wait. A detective is never absent, only occasionally late — a new clue has appeared, let's talk?"
hsr_paragon.66.c:"Farewell"
hsr_paragon.66.c.response:"After we say "see you next time", most people never return like bullets. So, how about a hug?"
leader_busitu_t1:"§MFeast, Without End§!"
leader_busitu_t1_desc:""
leader_busitu_t1_add:"§BStacking Skill§!\nUpon winning a space battle, §HUndying Path§! accumulates one §G[Ravenous]§! stack — each stack of §G[Ravenous]§! provides BUFF §GShip Hull +1%§!\nCurrent stacks: [from.yuzhousuipian]"
