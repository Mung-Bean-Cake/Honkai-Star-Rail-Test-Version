 #Dan Heng
NAME_danheng:"Dan Heng"
danheng_catch_phrase:"No need to cling to yesterday."
danheng_backstory:"A quiet and aloof young man, wielding a spear called "Cloud-Piercer", serving as a guard on the train's long Trailblaze journey. Dan Heng is reticent about his past, journeying with the train to escape everything he once created. But will the train really take him away from his "past"?"
hsr_paragon.59.name:"Astral Express - Dan Heng"
hsr_paragon.59.a:"First Meeting"
hsr_paragon.59.a.response:"Let me reintroduce myself. I'm Dan Heng, the train's guard, and I also maintain the train's archives."
hsr_paragon.59.b:"Hobbies"
hsr_paragon.59.b.response:"Reading... it's not a hobby, just an old habit."
hsr_paragon.59.c:"Observations"
hsr_paragon.59.c.response:"When the archives contain enough records, seemingly independent "events" become connected through the flow of "people"."
leader_danheng_t1:"§MPhantom Shadow§!"
leader_danheng_t1_desc:"Step aside, I don't want conflict."
leader_danheng_t2:"§MGale Wind§!"
leader_danheng_t2_desc:"Now I choose my own path..."
leader_danheng_t3:"§MOne Drop of Heavenly Water, Six Voids of Torrent§!"
leader_danheng_t3_desc:"What I see today will also be recorded in the archives."
leader_danheng_t4:"§MBound by Ropes, Sink Without Use§!"
leader_danheng_t4_desc:"Vast as the universe is, its past is not something one can decide for oneself."
leader_danheng_t5:"§MCave of Illusions, a Long Dream Awakens§!"
leader_danheng_t5_desc:"Life and death, reality and illusion, are but a single thought."
