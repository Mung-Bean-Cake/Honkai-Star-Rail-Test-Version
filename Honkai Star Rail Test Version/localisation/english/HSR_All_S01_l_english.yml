 #Fake Tradition Tree
tradition_path: "Path Factions"
tradition_path_desc: "§RThis tradition is for display only. For actual gameplay, please go to the settings panel and select a Path.§!\nIt is futile for mortal beings to guess the will of the gods, just as the mayfly and the stars have nothing to do with each other. However, when people who share a common misunderstanding gather together, they generate additional value: awareness becomes consensus, misinterpretation becomes common understanding, groups attract collectives... and then factions naturally emerge."
 #UI
concept_path_effect:"§HPath§!"
concept_path_effect_desc:"§RNote: Once the Path system is enabled, it will occupy one tradition tree slot. Even if the new tradition tree does not appear in the tradition interface after re-enabling, the new traditions will still take effect!§!\nIncludes: ['concept_cunhu_effect'], ['concept_fanyu_effect'], ['concept_fengrao_effect'], ['concept_huanyu_effect'], ['concept_huimie_effect'], ['concept_jiyi_effect'], ['concept_tongxie_effect'], ['concept_xunlie_effect'], ['concept_xuwu_effect'], ['concept_zhishi_effect']\nWhen specific conditions are met, you can embrace a Path and set it as ['concept_primary_effect'] or ['concept_secondary_effect']\nWhen certain Paths are set as ['concept_primary_effect'] or ['concept_secondary_effect'], specific ['concept_hsr_path_civic_effect'] can be selected.\nThe essence of Paths is still under study. For now, they can only be described in the simple form of "philosophical concepts". Path energy is part of imaginary energy, a metaphysical spiritual aggregate."
