 #Buildings
herta_holomuseum_1:0 "Curio Containment Center"
herta_holomuseum_1_desc: "This center houses a large number of curios from across the galaxy. The clerks here are responsible for researching and screening valuable curios, and sometimes exhibit replicas of curios."
herta_herta_discuss:"Ascension Laboratory"
herta_herta_discuss_desc:"An advanced laboratory with a focus on cutting-edge research, responsible for detailed field studies after ascension."
herta_herta_discuss_1:"High-Efficiency Automation"
herta_herta_discuss_1_desc:"This building automatically and massively fills requirements and optimizes itself."
col_capital_hsr_research:"Research Capital"
col_capital_hsr_research_desc:"Specialized for research output."
col_capital_hsr_research_tt:"Where countless laboratories are located."
