#Sparkle
NAME_huahuo:"Sparkle"
huahuo_catch_phrase:"I don't have much patience, and it's hard for me to have lasting dreams... My recent dream is to join the Genius Society! Yes, play the role of a genius! Ha, I really want to try this challenging act... anyone support me?"
huahuo_backstory:"A member of the "Masked Fools", elusive and unscrupulous. A dangerous drama master, addicted to acting, possessing a thousand masks, able to transform into countless facades. Wealth, status, power... none of it matters to Sparkle; what moves her is only "amusement"."
hsr_paragon.40.name:"Penacony - Sparkle"
hsr_paragon.40.a:"First Meeting"
hsr_paragon.40.a.response:"Hello hello, I'm Sparkle! If you have any dangerous errands, feel free to come to me. As long as I'm interested, the price is negotiable. The key is to have fun, right?"
hsr_paragon.40.b:"Hobbies"
hsr_paragon.40.b.response:"I like jokes — this world is too serious! Of course, jokes won't make the world better, but at least they won't make it more hypocritical~ wouldn't you agree?"
hsr_paragon.40.c:"Observations"
hsr_paragon.40.c.response:"The big shots know too well how the world operates, so they make rules, judge whether something violates the law, whether it's moral... they even decide whether jokes are funny! To me, that's the funniest part."
leader_huahuo_t1:"§MFictitious Nonsense§!"
leader_huahuo_t1_desc:"Oh dear, I've been seeing you a lot lately... Where did I see you? Can I let you know that, hehe~"
leader_huahuo_t2:"§MSolo Act§!"
leader_huahuo_t2_desc:"I just want to be a supporting character in the corner, applauding the people on stage, setting the mood, and then suddenly, at the climax of the performance, I rush up to the sky and — boom! Explode like fireworks in a colorful burst — would the protagonist dare do that?"
leader_huahuo_t3:"§MToying with the World§!"
leader_huahuo_t3_desc:""Several versions of my past are especially popular." Arriving at the "Tavern" of fools, Sparkle can only admit generously, "Liking and believing are two different things, but people tend to believe the stories they like are true.""
leader_huahuo_t4:"§MOne Person, Thousand Roles§!"
leader_huahuo_t4_desc:"Foolish wise men, clever fools... who will I be next?"
leader_huahuo_t5:"§MToying with the World§!"
leader_huahuo_t5_desc:"Some play games, some look in the mirror... guess who I'm talking about?"
