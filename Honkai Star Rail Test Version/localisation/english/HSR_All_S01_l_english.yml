tr_cunhu_jiyi_1:"§BArchivist of the Wall§!"
tr_cunhu_jiyi_1_flavor:"You smell the scent of books; may the flowers of Alpani never wither — your mother is reading you Adrian's fables. The Builders defended this continent, raising their silver shields, crushing the sins of antimatter fire. But where have they all gone? A flower blooms in the depths of your mind. You walk through the ruined city of Troda, climb over the trenches of Sibirch, scale the rubble of war — Alpani, they bloom there, fed by oblivion. You pick up the bloodied medals, record unfamiliar names, engrave the heroic deeds of the fallen on stone tablets, and send broken armor back home by boat. Then you head to the next world, following the Builders' footsteps, excavating yet another legend."
tr_cunhu_jiyi_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_cunhu_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_jiyi_effect']：§G+1§!$TABBED_NEW_LINE$—Archaeological Excavation Speed: §G+25%§!$TABBED_NEW_LINE$—Rift Exploration Speed: §G+25%§!$TABBED_NEW_LINE$—Archaeology Skill: §G+2§!$TABBED_NEW_LINE$—Rift Exploration Skill: §G+2§!$TABBED_NEW_LINE$—Relic Unity Cost: §G-25%§!\nUnlock Building: ['building:building_cunhu_jiyi_1']\nUnlock Council Seat: $councilor_cunhu_jiyi_1$"
