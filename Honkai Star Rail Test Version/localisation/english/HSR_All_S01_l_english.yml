#Feiying
NAME_feiying:"Feiying"
feiying_catch_phrase:""The pinker the hair, the harder the punch... haven't you heard?""
feiying_backstory:"One season of the phantom moon full, one season of the world's change — the mysterious girl appears again in Dual Paradise! Falling petals scatter, her stay is but a moment. The new era fascinates her, and she will not allow anyone to ruin it — a ruler's blade judges right and wrong, but who knows the measure of her own good and evil?"
hsr_paragon.69.name:"Feiying"
hsr_paragon.69.a:"First Meeting"
hsr_paragon.69.a.response:"Congratulations, you've found a treasure! I'm Feiying, hello there, big protagonist little raccoon. Usually, in this revelry, I only ensure the Phantom Moon Festival goes smoothly, but this time, if it's with you on stage, why not?"
hsr_paragon.69.b:"Greeting"
hsr_paragon.69.b.response:"Has the Fluffy Number updated today? No!"
hsr_paragon.69.c:"Observations"
hsr_paragon.69.c.response:"Fate in the world is unpredictable; maybe one day we'll meet again on a street of falling petals... I'm looking forward to it."
