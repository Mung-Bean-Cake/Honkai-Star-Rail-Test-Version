herta_discuss_pop_up_1:"Age of Cybernetic Evolution"
herta_discuss_pop_up_1_DESC:"With technology from Herta and the research achievements of numerous station scientists, we choose cybernetics as our direction for life advancement. This new cybernetics perfectly integrates with our organic bodies and maximizes the potential of both organic and machine.\nUpon completion, we will gain research options: ['technology:tech_herta_choose_1']"
herta_discuss_pop_up_2:"Age of Perfect Genes"
herta_discuss_pop_up_2_DESC:"With technology from Ruan Mei and the research achievements of numerous station scientists, we choose genes as our direction for life advancement. Ascend through the flesh, we will become faster and stronger!\nUpon completion, we will gain research options: ['technology:tech_ruanmei_choose_1']"
herta_discuss_pop_up_3:"Age of Machine Advancement"
herta_discuss_pop_up_3_DESC:"With technology from Screwllum and the research achievements of numerous station scientists, we choose machine as our direction for life advancement. Although many hold negative attitudes toward machines.\nUpon completion, we will gain research options: ['technology:tech_luosi_choose_1']"
