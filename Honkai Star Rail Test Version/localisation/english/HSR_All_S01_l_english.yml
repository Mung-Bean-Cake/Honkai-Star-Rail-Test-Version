leader_trait_combat_redeployment:0 "Combat Redeployment"
leader_trait_combat_redeployment_desc:0 "Time waits for no one; join me in battle!\n§BEach army recruited provides 50 Unity and 50 experience to a random leader.\n(Triggers when in Council)§!"
leader_trait_the_belobog_march:0 "Belobog March"
leader_trait_the_belobog_march_desc:0 "For defense and protection, crush them!\n§BEach space battle victory grants 300 experience to a random leader, removes all negative traits, and provides 25% of monthly Unity§!"
