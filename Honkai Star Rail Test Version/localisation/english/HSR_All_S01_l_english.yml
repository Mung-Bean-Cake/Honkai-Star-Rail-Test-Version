#Events
luosi.100.name:"Third Industrial Renaissance Movement"
luosi.100.desc:"Since #76 Screwllum secured hard-won peace for mechanical life, we have experienced two Industrial Renaissance movements. Now, our technological level has reached a new height, and it is time to push for the Third Industrial Renaissance Movement, gradually strengthening our hard power and remaining vigilant against dangerous forces that threaten the universe."
luosi.100.a:"Time waits for no one."
luosi.100.tt:"Unlock Tradition ['tradition_category:tradition_luosi']"
luosi.101.name:"Machine Combine-Separate"
luosi.101.desc:"Thanks to the special advantages of machines, we can choose to convert machine population into warships or integrate them better into industrial production, or dismantle fleets or industrial facilities in the system into population. The factory is ready; please specify the requirements."
luosi.101.a:"Dismantle warships into machine population."
luosi.101.b:"Dismantle industrial facilities into machine population."
luosi.101.c:"Combine population into warships."
luosi.101.d:"Combine population into industrial facilities."
luosi.102.name:"Dismantle Warships"
luosi.102.desc:"The size of the ships will determine the number of population generated after dismantling. The generated population will be of the primary species."
luosi.102.a:"Never mind."
luosi.107.name:"True Brothers!"
luosi.107.desc:"As we deepen exchanges with other machine civilizations in the galaxy, influential machines have begun to call for us to reorganize into a new joint national body. As fellow machines, we are not fundamentally different; perhaps we should consider their suggestion and form a joint nation."
luosi.107.a:"Form a joint nation with [event_target:target_country_dipio_1.GetName]"
luosi.107.b:"Form a joint nation with [event_target:target_country_dipio_2.GetName]"
luosi.107.c:"Form a joint nation with [event_target:target_country_dipio_3.GetName]"
luosi.107.d:"Form a joint nation with [event_target:target_country_dipio_4.GetName]"
