#Screwllum
NAME_luosi:"Screwllum"
luosi_catch_phrase:"Looking forward to meeting every tiny insect again."
luosi_backstory:"#76 of the Genius Society, ruler of Screwllum (Machine Planet IX). Even the famously sharp-tongued Herta praises him highly, calling him "a truly good man, a gentleman, with an excellent mechanical mind". Together with Herta, Ruan Mei, and Stephen Lloyd, he jointly advanced the "Simulated Universe" project; later, using Screwllum's advanced technology, he created a new project branch, "Divergent Universe"."
hsr_paragon.6.name:"Genius Society - Screwllum"
hsr_paragon.6.a:"Introduction"
hsr_paragon.6.a.response:"#76 of the Genius Society, ruler of Screwllum (Machine Planet IX)."
hsr_paragon.6.b:"Others' Comments"
hsr_paragon.6.b.response:"Even the famously sharp-tongued Herta praises him highly, calling him "a truly good man, a gentleman, with an excellent mechanical mind"."
hsr_paragon.6.c:"Early Life"
hsr_paragon.6.c.response:"After the Second Rubert War, the Interastral Peace Corporation once planned to exterminate machine life, but Screwllum's joining the Genius Society changed their decision. Eventually, the Corporation gifted Screwllum a "mechanical cuckoo clock" as a gesture of goodwill."
leader_luosi_t1:"§MMechanical Gentleman§!"
leader_luosi_t1_desc:""a truly good man, a gentleman, with an excellent mechanical mind""
leader_luosi_t2:"§MMechanical Genius§!"
