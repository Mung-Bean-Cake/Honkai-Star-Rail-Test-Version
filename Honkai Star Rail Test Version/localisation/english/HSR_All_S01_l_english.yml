#Silver Wolf
NAME_yinlang:"Silver Wolf"
yinlang_catch_phrase:"In Punklorde, people always work together; those who go it alone mostly don't make it. So those who do make it eventually become legends."
yinlang_backstory:"A super hacker who treats the universe as a game. No matter how formidable the defense system, Silver Wolf can easily crack it. Her data battles with Screwllum of the Genius Society have already become legends in the hacking world. How many more levels are there in the universe to conquer? Silver Wolf is quite looking forward to it."
hsr_paragon.54.name:"Stellaron Hunters - Silver Wolf"
hsr_paragon.54.a:"First Meeting"
hsr_paragon.54.a.response:"Yo, Trailblazer, you seem pretty good. That Stellaron hasn't affected you?"
hsr_paragon.54.b:"Hobbies"
hsr_paragon.54.b.response:"Burying my head in a pillow for a nap and squeezing cute things."
hsr_paragon.54.c:"Observations"
hsr_paragon.54.c.response:"My favorite games always update on the same day — are they in cahoots?"
