#Blade
NAME_ren:"Blade"
ren_catch_phrase:"To wear oneself down and tear enemies apart — that is a blade."
ren_backstory:"A swordsman who abandoned himself to the blade, original name unknown. He serves "Destiny's Slave" and possesses terrifying self-healing abilities. He wields an ancient sword, its blade covered in cracks, just like his body, just like his heart."
hsr_paragon.55.name:"Stellaron Hunters - Blade"
hsr_paragon.55.a:"First Meeting"
hsr_paragon.55.a.response:"Trailblazer... I don't know you. For you, that's a good thing."
hsr_paragon.55.b:"Hobbies"
hsr_paragon.55.b.response:"The existence of "Blade" can only be forgotten for a moment at the instant of swinging the sword."
hsr_paragon.55.c:"Observations"
hsr_paragon.55.c.response:"A dead man knows no fear."
leader_ren_t1:"§MKarma's Wind§!"
leader_ren_t1_desc:"There are countless weapons faster than mine, but what of it after thousands of clashes?"
leader_ren_t2:"§MSmelt the black steel, forge the cold gleam§!"
leader_ren_t2_desc:"With this blade in hand, I shall send you off."
leader_ren_t3:"§MEndure a Hundred Deaths§!"
leader_ren_t3_desc:"When will death come? I am getting impatient."
leader_ren_t4:"§MGreat Execution of Ten Thousand Deaths§!"
leader_ren_t4_desc:"The omen of death... approaches!"
leader_ren_t5:"§MLife passes, soul vanishes, yet returns to this body§!"
leader_ren_t5_desc:"This magnificent view, though I seek it in vain... I can, invite you all to share it."
