 #Curios
concept_curiosity:"Curio"
concept_curiosity_desc:"Special items from Honkai: Star Rail. In this mod, they are mainly special specimens. Equivalent curio count includes vanilla specimens.\nHerta's curio exhibition hall, full of all sorts of curious little things."
mod_country_curiosity_add: "Equivalent ['concept_curiosity'] count"
simulated_universe:0 "§MSimulated Universe§!"
dimensionality_reduction_dice:0 "Dimensional Reduction Dice"
dimensionality_reduction_dice_desc_short: "A peculiar triangular object"
dimensionality_reduction_dice_desc_details: "Nine six-sided dice form this peculiar triangular object. It can continuously reduce its own dimensionality, allowing it to exist in a three-dimensional world as a two-dimensional plane. Who created it and for what purpose remains unclear."
chaotic_coriolus_versicolor:0 "Chaotic Cloud Fungus"
chaotic_coriolus_versicolor_desc_short: "A curio commonly used by Chaos Physicians to help despondent Self-Annihilators rebuild confidence in the value of life."
chaotic_coriolus_versicolor_desc_details: "Clouds are aggregates of water vapor; they appear without purpose and dissipate without warning. Yet when people gaze at randomly formed clouds, they often see imagined objects in the sky — Chaos Physicians believe there is no absolute nothingness in the world; everything seemingly meaningless has a meaning it cannot abandon."
transitional_compound_eye: "Warp Compound Eye"
transitional_compound_eye_desc_short:"A Nameless' small gadget"
transitional_compound_eye_desc_details:"The Nameless are of two types: those who enjoy the mystery of the unknown, and those who prefer a planned approach to exploring the universe. The latter use Akivili's power to create the "Warp Compound Eye", whose light can warp ahead to the next galaxy and bring back information about new worlds. For Nameless traveling alone, the Warp Compound Eye is an essential piece of equipment, preventing them from stumbling into worlds filled with fragrant cheese."
exotic_fruit:"Exotic Fruit"
exotic_fruit_desc_short:"A strange fruit"
exotic_fruit_desc_details:"This heart-shaped fruit comes from a tree blessed by Yaoshi, said to be 50 Amber Eras old. While it is unknown whether eating it grants immortality, the fruit itself is already an Abomination of Abundance."
uncertainty_box:"Uncertainty Box"
uncertainty_box_desc_short:"A peculiar box"
uncertainty_box_desc_details:"Every side of this box can be opened; spaces that should overlap do not. Due to this unique property, you cannot be sure what will happen when you open it, so it is not recommended to store anything inside."
fuling_gum:"Fuling Gum"
fuling_gum_desc_short:"A genius's invention"
fuling_gum_desc_details:"Is luck an ability? Perhaps. Can luck be changed? Herta thinks so. This genius invented "Fuling Gum", and applying it to your eyelids grants 24 system hours of good luck. Many people at the Herta Space Station eagerly tried this invention; they all had an uneventful day, proving that in a turbulent world, simply living an ordinary life is already quite lucky.\n§2Each space battle won grants an additional 50 Cosmic Fragments§!"
fragrant_cheese:"Fragrant Cheese"
fragrant_cheese_desc_short:"A strange cheese"
fragrant_cheese_desc_details:"Once, a nanny robot had an idea to turn Abundance fragrance into cheese, to satisfy her young master's seemingly endless appetite. Unexpectedly, the fragrant cheese started growing on its own. The nanny robot and the owner worked at full speed, but could not keep up with the cheese's growth. So they had to ask a passing Mourning Actor for help, and fled to another galaxy by gondola. To this day, a galaxy is still tightly packed with delicious cheese, not a single gap left. This story is quite educational: do not waste food."
sponge_king:"Sponge King"
sponge_king_desc_short:"A sponge that gained free will?"
sponge_king_desc_details:"In the Black Forest, a sponge miraculously gained free will. It tried to socialize with screws that had also gained consciousness, but kept failing. Reflecting on this, it learned to smooth away all its edges and flaws, constantly rejuvenating itself to climb the social ladder — it eventually became a smooth sponge. Now, it is dedicated to helping other sponges discarded in the trash heap gain free will."
sheepskin_scroll:"Never-Shut-Up Parchment"
sheepskin_scroll_desc_short:"A dangerous curio"
sheepskin_scroll_desc_details:"In Herta's curio list, this parchment is marked as extremely dangerous. Before coming to the Herta Space Station, it belonged to a Fictional Historian. The parchment feeds on human history, its greedy tongue stirring the collective subconscious of civilization, shattering it. Herta created false world memories for it to devour, thus satisfying its insatiable appetite. But one day, this parchment will see through the genius's trick.\n§MUpon entering space combat, deal 10000 damage to all enemy fleets in the system; this effect triggers every 60 days§!"
doctor_robe:"Doctor's Robe"
doctor_robe_desc_short:"A mysterious robe"
doctor_robe_desc_details:"On the secret dark net of the IX Bureau, a sky-high priced item attracted countless bidders. This robe is said to have belonged to #64 of the Genius Society, "Primitive Doctor", and possesses incredible power. The anonymous user who listed it is believed to be a member of the Galactic Rangers, but despite many questions, the mysterious owner never responded until it was sold."
beautiful_robe:"Robe of Beauty"
beautiful_robe_desc_short:"A glorious battle robe woven from silk and starlight"
beautiful_robe_desc_details:"In the age when the Knights of Beauty roamed the stars, the entire universe was captivated by their elegance. These noble knights, seeking beauty, wore shining golden armor and robes woven from silk and starlight, and beneath their helmets were handsome, godlike faces. Even in the modern era when "Beauty" has faded, those who once witnessed their splendor still believe that Idrila will return.\n§MEach Cosmic Fragment provides 0.16% damage bonus§!"
club_ticket:"Club Ticket"
club_ticket_desc_short:"A small invention of the Genius Society"
club_ticket_desc_details:"#56 of the Genius Society, Elias Salas, once had a beautiful wish: that the geniuses of the Society could gather happily and share life, love, and dreams. To that end, he invented the "Club Ticket" and designed a complete system to ensure that even after his death, every new member would receive this ticket that instantly teleports them to a banquet plane. The fact is, every member after #56 has indeed used the "Club Ticket", but their times have never coincided even once.\n§MEach month, gain 75 Cosmic Fragments§!"
faith_bond:"Faith Bond"
faith_bond_desc_short:"The Corporation's recognition"
faith_bond_desc_details:"Employees who reach P40 rank in the Interastral Peace Corporation are granted the right to subscribe to the "Faith Bond". It signifies Louis Fleming's affirmation and carries a sacred promise: that you will have a place in the Amber Lord's destined work of Preservation. Your ability is negligible, your wealth insignificant, your faith but a grain of dust in the vast sea of stars. But generation after generation of "you" will converge, ultimately gaining the power to protect the entire universe.\n§MAfter spending Simulated Universe Fragments, receive a certain percentage back§!"
split_gold_coins:"Split Gold Coins"
split_gold_coins_desc_short:"Stained with blood and tears..."
split_gold_coins_desc_details:"Not all planets welcome the Interastral Peace Corporation's commercial empire with open arms. Among the ever-expanding galactic map, there are always rare exceptions that refuse the Corporation's goodwill. "Thank you," they say, "but we do not need Credits; we are fully capable of taking care of ourselves." Faced with such situations, the Corporation's representatives shrug, then casually destroy the planet's financial foundation — usually gold."
empty_candle_scissors:"Emptiness Candle Snuffer"
empty_candle_scissors_desc_short:"A magical pair of scissors"
empty_candle_scissors_desc_details:"Few use these candle snuffers on candles; they are more often used on crueler, darker, more painful things. The scissors do not cut matter, but the warmth within living beings — the motivation called passion. If the Emptiness Candle Snuffer passes over your heart, you will feel not pain, but indifference.\n§MWhen enabled, increases Curio count by +5§!"
annihilate_candle_scissors:"Annihilation Candle Snuffer"
annihilate_candle_scissors_desc_short:"Another magical pair of scissors..."
annihilate_candle_scissors_desc_details:"If you use these candle snuffers to cut the wick, the angry antimatter flame will ignite the candle instead, and under particle collision, the whole candle will burn for a few seconds and then annihilate. If you cut your skin with them, an energy dispersion reaction will occur immediately; the touched part will turn into negative particles that oscillate in the body and then scatter away.\n§MEach Curio count increases damage by 5% and health by 8%§!"
heavy_sound_album:"Heavenly Heavy Sound Album"
heavy_sound_album_desc_short:"A strange disc"
heavy_sound_album_desc_details:"When "Order" Ena was absorbed by Xipe, the Heavenly Choir lost its faith, and the once solemn and orderly harmonies fell silent, leaving the stars speechless. Only a few records made by enthusiasts still circulate. Place one in a special phonograph, and you will hear singing from the other side of the universe, full of the beauty of Order. The last Order phonograph was destroyed in the War of the Machines; the thick dust on the record seems to protest against the silent passage of time.\n§MUpon entering space combat, our fleets gain 100% damage reduction for 10 days§!"
broken_star_fragrant_bait:"Broken Star Fragrant Bait"
broken_star_fragrant_bait_desc_short:"Chaotic nebula..."
broken_star_fragrant_bait_desc_details:"Before the Dusk War, the explosion debris of the chaotic nebula could be used as bait; its unique cosmic dust fragrance could attract Ancient Beasts to feed. But after this world-covering catastrophe, the "Broken Star Fragrant Bait" seems to have lost its original function. No matter how scholars research and modify the bait, no one has succeeded in finding any traces of Ancient Beasts again."
cunhu_sealing_wax:"Preservation Sealing Wax"
cunhu_sealing_wax_desc_short:"Aeon Sealing Wax"
cunhu_sealing_wax_desc_details:"A saying circulates among despondent Self-Annihilators: that the universe is meaningless, and that humans are worthless in the eyes of Aeons. If Aeons truly stand above all beings, why would they care about mortal love, hate, joy, and suffering? The existence of the slumbering formless IX is proof. To prove to the Self-Annihilators that Aeons do care, Chaos Physicians combined the shamanism of mystic monks to create Aeon Sealing Wax. It is said that stamping this wax will remotely attract the gaze of the corresponding Aeon across time and space — there have been no successful cases yet, but some Self-Annihilators who stamped the wax regained confidence in the universe, Aeons, and everything else."
fengrao_sealing_wax:"Abundance Sealing Wax"
fengrao_sealing_wax_desc_short:"Aeon Sealing Wax"
fengrao_sealing_wax_desc_details:"A saying circulates among despondent Self-Annihilators: that the universe is meaningless, and that humans are worthless in the eyes of Aeons. If Aeons truly stand above all beings, why would they care about mortal love, hate, joy, and suffering? The existence of the slumbering formless IX is proof. To prove to the Self-Annihilators that Aeons do care, Chaos Physicians combined the shamanism of mystic monks to create Aeon Sealing Wax. It is said that stamping this wax will remotely attract the gaze of the corresponding Aeon across time and space — there have been no successful cases yet, but some Self-Annihilators who stamped the wax regained confidence in the universe, Aeons, and everything else."
