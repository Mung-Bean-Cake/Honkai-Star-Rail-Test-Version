#Technologies
tech_path_civic_1:"Path Civic • I"
tech_path_civic_1_desc:"It is futile for mortal beings to guess the will of the gods, just as the mayfly and the stars have nothing to do with each other. However, when people who share a common misunderstanding gather together, they generate additional value: awareness becomes consensus, misinterpretation becomes common understanding, groups attract collectives... and then factions naturally emerge."
