DOT_SR.1.desc:0 "Current Honkai: Star Rail MOD §MIntroduction & Settings§! Panel\n§RThis MOD is only provided for free on the Steam Workshop!§!\n§GHSR MOD Discord Group: 912693940; Dev Group: 692875844 (continuously recruiting new members, welcome to join).§!\nCurrent Version: v4.2\nUpdate Date: 2026/7/1\n§HChangelog§!: \n1. Preliminary adaptation for new version\n2. Adjusted Xianzhou, Screwllum, Herta Space Station\n3. Temporarily removed Stellaron generation"
DOT_SR_money_show:0 "Cosmic Fragments: [from.yuzhousuipian]"
DOT_SR.2.desc:0 "Herta of the Genius Society was not satisfied with the laws of ordinary worlds. She turned her gaze to the unsolved mysteries of the galaxy, expecting those distant enigmas to satisfy her curiosity. To this end, Herta established a museum-style interstellar ship and launched it into planetary orbit, beginning research work on "sealing all anomalies in the starry sky". The renowned Herta Space Station was thus born. To this day, the station possesses countless curio "collections", making it a veritable museum of the stars. Numerous researchers have settled aboard, continuously collecting relics and curios from across the galaxy, recording their forms and functions, establishing systematic observation and research methods... ultimately finding ever more perplexing puzzles. This was Herta's original purpose. The numerous "collections" often attract envious glances, with various factions lurking in the shadows. Thanks to Herta's power, the station rarely faces real crises, and collection and research work proceeds in an orderly manner."
