xinghe_small_modifier_desc:"Due to its modest energy, we can suppress its effects relatively easily."
xinghe_medium_modifier:"Sealed §MMedium Stellaron§!"
xinghe_medium_modifier_desc:"Although we have suppressed this power, we must remind people not to approach the seal site carelessly."
xinghe_large_modifier:"Sealed §RActive Stellaron§!"
xinghe_large_modifier_desc:"Extremely difficult to control! We must assign personnel to monitor and record."
xinghe_small_modifier_1:"Quiescent §BSmall Stellaron§!"
xinghe_small_modifier_1_desc:"The negative effects of this Stellaron have been minimized as much as possible."
xinghe_medium_modifier_1:"Quiescent §MMedium Stellaron§!"
xinghe_medium_modifier_1_desc:"The negative effects of this Stellaron have been minimized as much as possible."
