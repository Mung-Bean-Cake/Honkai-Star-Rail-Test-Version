xinghe_big_storm: "§RDevastating Stellaron Storm§!"
xinghe_big_storm_desc: "A mysterious phenomenon that began appearing in Amber Era 2147. On the interstellar routes created by "Trailblaze", some obscure substances have disrupted the flow of imaginary energy. It is like encountering a cliff on a mountain climb, a maelstrom on a voyage — once-smooth interstellar journeys become perilous and uncertain. This phenomenon is highly aggressive, infecting neighboring worlds in the form of mysterious objects known as "Stellarons" — like cancer cells spreading across the universe."
xinghe_big_storm_color_tooltip: "§RDevastating Stellaron Storm§!"
xinghe_big_storm_lore_description:"§LA powerful Stellaron storm is about to pass through this system, potentially causing extreme effects on planets and passing ships. This storm is far stronger than common Stellaron storms; seek shelter.§!"
xinghe_big_storm_fleet_tt:"—Sublight Speed: §R-25%§!\n—Sensor Range: §R-5§!\n—Ship Hyperlane Detection Range: §R-5§!\n—Jump Drive Range: §R-25%§!\n—Jump Drive Cooldown: §R-25%§!\n—Cloaking Strength: §R-5§!\n—Evasion: §R-25%§!\n—Missing in Action Duration: §R+25%§!\n—Ship Weapon Damage: §R-25%§!\n—Ship Weapon Fire Rate: §R-25%§!\n—Ship Upkeep: §R+25%§!\n—Daily Shield, Armor, Hull regeneration §Rdisabled§! on ships and stations.\n—Ships and stations suffer §R50§! shield damage per month."
xinghe_big_storm_aftermath_modifier_tooltip:""
decision_seal_star_core:"§YSeal§! §RStellaron§!"
decision_seal_star_core_desc:"Stellarons are a scourge to galactic life. Although we cannot destroy them, we can seal them, control their internal energy, and reduce their harm."
decision_seal_star_core_tt:"Seal the Stellaron, gaining a large amount of research points. Different types of Stellarons trigger different events upon sealing. The more §Ractive§! the Stellaron, the more likely it is to trigger §Rbad events§!. §RIf not dealt with in time, the Stellaron's level will increase every ten years and generate Stellaron Energy Entities§!"
