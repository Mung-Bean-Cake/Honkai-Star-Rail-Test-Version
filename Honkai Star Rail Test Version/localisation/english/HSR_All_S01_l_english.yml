#Huohua
NAME_huohua:"Huohua"
huohua_catch_phrase:""Family and friends watching the screen, do you think I'll win?""
huohua_backstory:"Like! Follow! Livestream! Traffic! Revelry until the end of the world! Who gets seen, who gets liked, who is the right answer!"
hsr_paragon.68.name:"Huohua"
hsr_paragon.68.a:"First Meeting"
hsr_paragon.68.a.response:"Welcome to the livestream, "Galactic Bat-Wielder"! I'm your good friend "Huohua", ready for a dopamine-filled day? The world of flowers is dazzling, today shine like a spark~"
hsr_paragon.68.b:"Greeting"
hsr_paragon.68.b.response:"What big things have you done lately? You have connections, I have an account — let's collaborate and blow it up, making flowers bloom and become wildly popular~"
hsr_paragon.68.c:"Observations"
hsr_paragon.68.c.response:"The show is about to start, click like and follow~"
leader_huohua_t1:"§RSignal Overflow: Encore!§!"
leader_huohua_t1_desc:""
leader_huohua_t1_add:"§RElation Skill — Active§!\nUpon triggering §Y[Aha Moment]§!, make §RHuohua§! perform, and conduct a §Gdraw§! §Rlottery§! specially prepared by Huohua."
