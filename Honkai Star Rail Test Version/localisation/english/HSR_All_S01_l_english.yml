auth_global_giant_enterprise:"Galactic Megacorporation"
auth_global_giant_enterprise_desc:"A corporate government is a nation-state where a vast commercial group has fully taken over administrative functions, possessing complete military, political, and economic systems, driven by business logic, or placing profit above morality."
gov_ipc:"Transgalactic Commercial Corporation"
gov_ipc_desc:"Both a commercial empire and an independent sovereign entity, its board resolutions have greater implementation efficiency than government decrees."
