councilor_xunlie_fengrao_1_desc:"You run between various nodes, following their traces, racking your brains to eliminate species that do not belong here. Wild wasps parasitize ant bodies, poisonous rain scorches flower skins — countermeasures for every move. Before the infection becomes terminal, use ruthless means to extinguish the sparks of extinction and restore peace to the stars."
edict_tr_xunlie_fengrao_1_edict: "Stellar Serenity"
edict_tr_xunlie_fengrao_1_edict_desc: "Before the infection becomes terminal, use ruthless means to extinguish the sparks of extinction and restore peace to the stars."
tr_zhishi_jiyi_1:"§BCandle-Ink Verifier§!"
tr_zhishi_jiyi_1_flavor:"How to judge the correctness or fallacy of text? Complete logic, concise sentences, no embellished rhetoric, and correspondence with memory substances. It is not only the fictional historiography that toys with history. Secret scandals, acts of genocide, forgeries not only fill the past but also rewrite the present. The coroner of time traces the threads of fiction. You dissect its remains; the emerging memory substances seep into the slices, revealing evidence under the lens. Then, the detective concludes the case: the cause of death is a coup and a transaction, the weapon is semantic tampering, the motive is to maintain the legitimacy of the Ister Union. History is interlocking, yet full of loopholes. Through all the unreasonable details, one can deduce the true ending."
tr_zhishi_jiyi_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_zhishi_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_jiyi_effect']：§G+1§!$TABBED_NEW_LINE$—Research Speed: §G+15%§!$TABBED_NEW_LINE$—Alternative Techs: §G+1§!$TABBED_NEW_LINE$—Monthly Influence: §G+1§!$TABBED_NEW_LINE$—Anomaly Discovery Chance: §G+25%§!$TABBED_NEW_LINE$—Anomaly Research Speed: §G+25%§!\nUnlock Building: ['building:building_zhishi_jiyi_1']\nUnlock Council Seat: $councilor_zhishi_jiyi_1$"
