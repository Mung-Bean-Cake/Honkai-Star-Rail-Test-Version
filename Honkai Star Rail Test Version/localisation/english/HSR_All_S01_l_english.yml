yaliluo_robotic_army_desc:0 "A new robot army developed by the Belobog Technology Department, capable of dual-use for both civilian and military purposes efficiently."
yaliluo_robotic_defense_army:0 "New Robot Defensive Force"
yaliluo_robotic_defense_army_desc:0 "$yaliluo_robotic_army_desc$"
