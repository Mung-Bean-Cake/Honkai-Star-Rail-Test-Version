#Policies
xianzhou_name:"£xianzhou_union£ Xianzhou"
xianzhou_luofu_text:"Ship Name: §KXianzhou-「Luofu」§!\nThe Xianzhou Luofu is one of the six flagships of the Xianzhou Alliance. It drifts through the endless sea of stars, like an unreturning divine arrow aimed at the "Hunt" Lord's sworn enemy.\nAfter the war with the Abundance peoples came to an end, the Luofu slowly cruised back through regions of flourishing civilizations, engaging in trade and cultural exchanges with various worlds.\nThey signed a reciprocal trade agreement with the Interastral Peace Corporation and helped many worlds, once destroyed by the Abundance, restore their ecosystems.\nBecause it received the Ambrosial Arbor bestowed by Yaoshi of Abundance, it became the foremost of the Xianzhou.\nThe Luofu Dragon Lord is titled "Imbibitor Lunae".\nThe Abundance scourge is the Immortal Arbor.\nLuofu sign: The Cloud Knights guard the towering Arbor; Outworlders come seeking audience; the sea of starskiffs bustles with noise and waves."
xianzhou_fanghu_text:"Ship Name: §KXianzhou-「Fanghu」§!\nThe Xianzhou Fanghu is one of the six flagships of the Xianzhou Alliance. It is a Vidyadhara autonomous territory. In gratitude for the Vidyadhara's merit in suppressing the Abundance scourges, the Alliance gifted the Fanghu to the Vidyadhara for self-rule.\nIn Star Calendar 8072, the wandering planet "Lunar Demon" revived and threatened Fanghu. The battle was fierce and nearly lost, but finally the divine arrows of the Reignbow Arbiter wiped out the enemy. Nearly one-fifth of Fanghu's realms were destroyed by the light-arrow bombardment. After the Third Abundance War, Fanghu pursued a policy of self-preservation and recuperation. Its self-preservation policy has almost severed normal exchanges and trade with other Xianzhou flagships.\nIn Star Calendar 8098, it was anchored in the Lanna system of the Tra'tektli cluster. Barring special circumstances, Fanghu is expected to remain there for at least ten star years.\nIts specialty is aquatic products.\nThe Fanghu Dragon Lord is titled "Frigid Abyss Lord".\nThe Abundance scourge is the Misty Sea.\nFanghu sign: Vidyadhara wander in the Misty Sea; the "Guardians of the Pearl" meditate in silence; the faint sound of solemn dragon roars is heard."
xianzhou_yaoqing_text:"Ship Name: §KXianzhou-「Yaoqing」§!\nThe Xianzhou Yaoqing is one of the six flagships of the Xianzhou Alliance. It drifts through the endless sea of stars, like a giant sword sweeping away all, crushing the plague of abominations across many star domains.\nAs the flagship renowned for its martial prowess among the six, the Yaoqing has long borne the most intense combat missions. Under the fierce pursuit of the foxian "Qingque Army", the abomination armies, such as the Borisin, have been scattered and their fortunes waned.\nIn the myth of the Reignbow Arbiter, it is the birthplace of the Arbiter.\nThe Yaoqing has long cooperated closely with the Interastral Peace Corporation, exchanging for technical and material support needed for warfare. They have swept away the scourges of many worlds, and many have become the spoils of the credit system. In recent years, it has lost much of its former character. Traditional Yaoqing architecture has been replaced by Corporation buildings, and the young are deeply influenced by the Corporation's culture.\nThe Yaoqing Dragon Lord is titled "Skywind Lord".\nThe Abundance scourge is the Moon of Gestation.\nYaoqing sign: It speeds from beyond the nine heavens, riding wind and thunder. Countless foxians stand armored on the deck, majestic and unstoppable."
xianzhou_zhuming_text:"Ship Name: §KXianzhou-「Zhuming」§!\nThe Xianzhou Zhuming is one of the six flagships of the Xianzhou Alliance. It drifts through the endless sea of stars, like a hundred-forged hammer, forging many divine weapons for the Cloud Knights' needs.\nFrom the era of the ancient voyages, the Zhuming was renowned for its craft and alchemical skills. Over the eight-thousand-year journey, it has continuously remodeled itself, losing its original appearance, but the spirit of innovation and the thirst for knowledge in its craftsmen have never died.\nToday, the Zhuming has become a famous place of pilgrimage for artisanship across the galaxy, attracting countless learners with its manufacturing technology rivaling that of Screwllum and Pier Point, sending them away fully laden.\nIn Star Calendar 8098, it was anchored at the Stella Yamazaki system in the Leva du Lardi cluster, which lies within the borders of the Kliment Constitutional State. The Zhuming will conduct technical exchanges there for ten star years, hoping to exchange its advanced smelting technology for the region's abundant mineral resources.\nIn the myth of the Reignbow Arbiter, to repel the Abundance, the Arbiter ignored warnings and entered the deep prison of the Zhuming, persuading the Heliobi leader "Sundial" to make a possession deal, trading his own body for the power of the Heliobi.\nAt the end of the Fire Disaster, the Heliobi were utterly suppressed. Even so, only a few remain on the Zhuming. The Heliobi progenitor "Sundial" is imprisoned at the center of the Zhuming, sleeping soundly. Around this celestial energy being, the Zhuming craftsmen built a ring-shaped Flame Wheel Forge Palace, drawing on its endless energy.\nIts specialty is porcelain.\nThe Zhuming Dragon Lord is titled "Flamecourt Lord".\nThe Abundance scourge is the Primal Sunblaze.\nZhuming sign: Craftsmen here melt gold and forge iron; the furnaces burn day and night, greedily swallowing flames; the deck carries a steady stream of various machines."
xianzhou_yuque_text:"Ship Name: §KXianzhou-「Yuque」§!\nThe Xianzhou Yuque is one of the six flagships of the Xianzhou Alliance.\nIt is the eye of the Alliance gazing at the stars, possessing the Alliance's premier astronomical observation device, the Sky-Seeing Mirror.\nThe Yuque currently sails to the outer edge of the Giant's Arm cluster, following ancient routes for continuous exploration.\nDuring the Second Abundance War, the Yuque was besieged by the Abundance Emanator Shuhu.\nHundreds of years ago, the Abundance peoples gathered a massive army to attack the Yuque, awakening the living planet "Lunar Demon", and the Cloud Five Heroes relieved the siege of the Yuque and defeated the "Lunar Demon".\nThe five Vidyadhara lineages and the Xianzhou swore alliance at the Yuque.\nIts specialty is Jade Matrix.\nThe Yuque Dragon Lord is titled "Kunlun Lord".\nThe Abundance scourge is the Earthen Soil.\nYuque sign: Astrologers wield the Sky-Seeing Mirror, peering into the depths of the starry sea; the Jade Matrix turns incessantly, guiding all through the gloom toward the bright shore."
xianzhou_xuling_text:"Ship Name: §KXianzhou-「Xuling」§!\nThe Xianzhou Xuling is one of the six flagships of the Xianzhou Alliance.\nIn Star Calendar 8098, its location is unknown.\nThe "Xianzhou Alliance Declaration" was signed at Xuling.\nIt appears to be the headquarters of the Ten-Lords Commission.\nMajor criminals of the Alliance must be escorted to the Xilian, to be tried jointly by the Seven Generals of the Reignbow Arbiter.\nXuling sign: Other Xianzhou pass through here, but no other sign of habitation remains; only golden machines are scattered like stars."
xianzhou_default_text:"In ancient mythical times, several Xianzhou ships were ordered to set sail across the sea of stars in search of the elixir of immortality. They spent long years, wearing down their bodies and wills, until finally they received the blessing of Yaoshi. However, the fruit of immortality brought only desolation and suffering. It was not until the Hunt Aeon Lan returned from the abyss, using gravity as His bowstring and a star-arrow to sever the Ambrosial Arbor, that the curse of "Abundance" was broken. After the Xianzhou left their lost path, guided by the "Hunt", they formed an alliance and organized the mighty Cloud Knights. The Alliance took Abominations of Abundance as their target, tasked with eradicating the contamination of immortality, roaming the boundless star fields."
