#Civics
civic_The_Destruction:0 "Practice - ['concept_huimie_effect']"
civic_The_Destruction_desc:0 "The birth of the universe is a fundamental error; civilization is a cancer quietly growing among the vast stars, and conflict is the only universal language among intelligent beings. To correct this error and erase the stain of the universe, Nanook became the embodiment of entropy, ascending in negation of all other Aeons. "Destruction" is not a process, but a result. On the path He promises, all Aeons and their Paths will end in heat death."
councilor_oracle_destruction:0 "Destruction Oracle"
councilor_oracle_destruction_female:0"$councilor_oracle_destruction$"
councilor_oracle_destruction_desc:0 "The birth of the universe is a fundamental error; civilization is a cancer quietly growing among the vast stars, and conflict is the only universal language among intelligent beings."
civic_The_Harmony:0 "Practice - ['concept_tongxie_effect']"
civic_The_Harmony_desc:0 "The collective Aeon from multiple harmonic celestial worlds. Xipe, the thousand-faced unity, sings of harmonious joy. To resist the ruthless laws of the universe, intelligent life must erase weak selfish desires and individual differences, merging into a grand harmony — to support the weak with the strong, and to protect life through death."
councilor_oracle_harmony:0 "Harmony Oracle"
councilor_oracle_harmony_female:0"$councilor_oracle_harmony$"
councilor_oracle_harmony_desc:0 "To resist the ruthless laws of the universe, intelligent life must erase weak selfish desires and individual differences, merging into a grand harmony — to support the weak with the strong, and to protect life through death."
civic_The_Abundance:0 "Practice - ['concept_fengrao_effect']"
civic_The_Abundance_desc:0 "May all sentient beings have their wishes fulfilled. Yaoshi is the nurturer of all beings, the god of paradise, whose goal is to let life flourish without end. Yaoshi is an Aeon who never refuses any prayer and cannot bear to see decay and suffering."
councilor_oracle_abundance:0 "Abundance Oracle"
councilor_oracle_abundance_female:0"$councilor_oracle_abundance$"
councilor_oracle_abundance_desc:0 "Yaoshi is the nurturer of all beings, the god of paradise, whose goal is to let life flourish without end."
civic_The_Hunt:0 "Practice - ['concept_xunlie_effect']"
civic_The_Hunt_desc:0 "Endless enmity, boundless pursuit, how many sorrows for the Hunt Lord? The star-arrow is on the string, golden eyes blaze, the Reignbow Arbiter never looks back."
councilor_oracle_hunt:0 "Hunt Oracle"
councilor_oracle_hunt_female:0"$councilor_oracle_hunt$"
councilor_oracle_hunt_desc:0 "Lan's hunt never counts the cost; His salvation and destruction are often separated by a fine line."
civic_The_Preservation:0 "Practice - ['concept_cunhu_effect']"
civic_The_Preservation_desc:0 "Builder of the Celestial Wall, Cosmic Crystal Wall, and the Great Attractor foundations, worshipped as the "Amber Lord". He is a survivor of the distant "Dusk War". He knows that the devouring enemy is imminent, so He must build barriers spanning light-years to seal it, isolating and protecting worlds that still hold life."
councilor_oracle_preservation:0 "Preservation Oracle"
councilor_oracle_preservation_female:0"$councilor_oracle_preservation$"
councilor_oracle_preservation_desc:0 "He knows that the devouring enemy is imminent, so He must build barriers spanning light-years to seal it, isolating and protecting worlds that still hold life."
civic_The_Nihility:0 "Practice - ['concept_xuwu_effect']"
civic_The_Nihility_desc:0 "IX does not associate with other Aeons, believing that the ultimate nature of the multiverse is nothingness, and thus existence has no value."
councilor_oracle_nihility:0 "Nihility Oracle"
councilor_oracle_nihility_female:0 "$councilor_oracle_nihility$"
councilor_oracle_nihility_desc:0 "Am I just waiting to die in this job?"
civic_The_Erudition:0 "Practice - ['concept_zhishi_effect']"
civic_The_Erudition_desc:0 "Everything is a question; everything has an answer."
civic_The_Propagation:"Practice - ['concept_fanyu_effect']"
civic_The_Propagation_desc:0 "If a shadow appears on the horizon at noon, shut your doors tight — that is not an early nightfall, but a hungry swarm."
civic_jiyi:0 "Practice - ['concept_jiyi_effect']"
civic_jiyi_desc:0 "Thought is existence, and memory is evidence of existence. The Aeon of "Remembrance" records all that is forgotten, preparing for the rebirth of the universe."
civic_huanyu:0 "Practice - ['concept_huanyu_effect']"
civic_huanyu_desc:0 "The Aeon of "Elation". No one can predict what will make Them laugh. Joy is the privilege of intelligent life, and Aha encourages followers to enjoy life's pleasures, seeking happiness in the sharp turns of fate."
civic_kaituo:0 "Blessing of Akivili"
civic_kaituo_desc:0 "The Aeon of "Trailblaze", who set out from the isolated world of Pegana to continuously expand the unknown boundaries of existence. His fate ended in accident."
councilor_oracle_jiyi:0 "Remembrance Oracle"
councilor_oracle_jiyi_desc: "Time — the most diligent thief in the world. It constantly steals our present, and casually throws it into a warehouse called 'memory'. Some indulge in lost property... others care nothing for loss."
councilor_oracle_huanyu:0 "Elation Oracle"
councilor_oracle_huanyu_desc: "「Erudition is scrap iron, Preservation is a fool; Hunt has no sense of humor, Destruction is a madman. The Aeons are all single-minded, Aha has no face!」"
councilor_oracle_fanyu:0 "Propagation Oracle"
councilor_oracle_fanyu_desc: "「If a shadow appears on the horizon at noon, shut your doors tight — that is not an early nightfall, but a hungry swarm.」"
councilor_oracle_kaituo:0 "Trailblaze Oracle"
councilor_oracle_kaituo_desc: "「Countless shooting stars streak across tonight's sky... if you choose the right one, it will carry your wishes to a thousand worlds.」"

