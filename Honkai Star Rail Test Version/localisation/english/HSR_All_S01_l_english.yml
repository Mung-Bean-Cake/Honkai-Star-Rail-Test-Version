councilor_ruler_ipc_chairman_desc:"The most powerful person in the universe, after the Aeons."
ipc_leader:"Louis Fleming"
origin_hsr_ipc: "Interastral Peace Corporation"
origin_hsr_ipc_desc: "To the public, the Corporation is a megacorporate conglomerate advocating free trade; operationally, it is a commercial autocracy that issues currency and monopolizes resources; from its founding mission, it is the selfless support network that devotes everything to the Aeon of Preservation. Most interstellar citizens speak of the Corporation in terms of its ubiquitous goods and recognizable signage: as if "wherever there is trade, there is the Interastral Peace Corporation." Indeed, nearly all commercial activity in the galaxy is built on the Corporation's "Credits" system. If interstellar trade were a sport, the Corporation would be both the top athlete and all the sports, both the arena and the rules themselves. This absolute dominance over wealth, combined with its ceaseless expansion, has given the Corporation a popular image of a conspiratorial autocrat. But the Corporation is indifferent to lowly aspirations of "world domination," because its corporate spirit has remained unchanged since its inception: §Hto devote everything to the "Amber Lord" — Qlipoth.§!"
 #Civics
civic_marketing_expansion_department: "§AMarket Development Department§!"
civic_marketing_expansion_department_desc: "The Market Development Department focuses on traveling to more star systems to promote Qlipoth's mission. It is also responsible for bringing new worlds into the cosmic commercial system. The Galactic Lottery, sold by the IPC's Market Development Department, is marketed with the same passion and fervor as its director, Oswald Schneider. For just one interstellar credit, anyone can bet on their luck and buy into the dream of becoming a cosmic billionaire and joining the commercial system. Under Oswald Schneider's marketing, few new worlds can resist this temptation — they purchase their entry tickets, join the IPC's cosmic commercial system, and thus gain the franchise to operate the Galactic Lottery in their own territories."
civic_marketing_expansion_department_effect:"-Unlocks branch office building ['building:building_marketing_expansion_department']$TABBED_NEW_LINE$-Whenever we sign a trade agreement with another nation, we gain ['concept_pan_galaxy_trade_system'] effect, immediately receiving a lump sum of trade and unity; the other party gains ['concept_pan_galaxy_trade_system_member'] status."
councilor_marketing_expansion_department: "§AMarket Development Department Director§!"
councilor_marketing_expansion_department_desc: "Responsible for establishing relations with new worlds and initiating initial commercial projects."
civic_business_consolidation_department:"§ABusiness Consolidation Department§!"
civic_business_consolidation_department_desc:"After the Market Development Department completes relations with new worlds, subsequent commerce is transferred to the Business Consolidation Department. This department oversees the Corporation's superluminal transport network, catalogs specialty goods and prices, and maintains its facilities and inventories. It is the Corporation's largest department, comprising 45% of total headquarters staff."
civic_business_consolidation_department_effect:"-Unlocks branch office building ['building:building_civic_business_consolidation_department']$TABBED_NEW_LINE$Corporation-exclusive corporate buildings produce more trade and provide more jobs."
councilor_business_consolidation_department:"§ABusiness Consolidation Department Director§!"
councilor_business_consolidation_department_desc:"Business Consolidation Department Director, Board Director."
civic_strategic_investment_department:"§AStrategic Investment Department§!"
civic_strategic_investment_department_desc:"The Strategic Investment Department has the second-longest vision in the Corporation; their investments are never limited to short-term returns. The department includes the elite envoy corps "Special Debt Resolution Squad (Ten Stonehearts)", led by the enigmatic director "Diamond" — one of the few confirmed Emanators of Preservation in the Corporation. They travel the galaxy, actively resolving bad debts caused by the Cancer of All Worlds. Their members have diverse origins and responsibilities, with even records of rotation. The only commonality is that they were all promoted by "Diamond" himself and granted a "cornerstone" as a credential. Members of the "Ten Stonehearts" must carve their cornerstone through their own efforts."
civic_strategic_investment_department_effect:"-Unlocks branch office building ['building:building_strategic_investment_department']$TABBED_NEW_LINE$Whenever a branch office building ['building:building_strategic_investment_department'] is first constructed on a planet/flagship, a random planet/flagship of ours gains ['concept_d_special_economic_zone']."
councilor_strategic_investment_department:"§AStrategic Investment Department Director§!"
councilor_strategic_investment_department_desc:"Its director "Diamond" — one of the few confirmed Emanators of Preservation in the Corporation."
civic_building_materials_logistics_department:"§AConstruction Materials Logistics Department§!"
civic_building_materials_logistics_department_desc:"The Construction Materials Logistics Department is the longest-standing department of the IPC. Its predecessor was the "Amber Lord Support Team", reorganized under Louis's rise. The current director is the portly Taravan Keane — one of the few confirmed Emanators of Preservation in the Corporation and a member of the Seven-Player Board. He holds the sacred task of transporting construction materials to Qlipoth, solidifying his position. They are allied with the Strategic Investment Department."
civic_building_materials_logistics_department_effect:"-Unlocks branch office building ['building:building_materials_logistics_department']"
councilor_building_materials_logistics_department:"§AConstruction Materials Logistics Department Director§!"
councilor_building_materials_logistics_department_desc:"The current director is the portly Taravan Keane — one of the few confirmed Emanators of Preservation in the Corporation and a member of the Seven-Player Board. He holds the sacred task of transporting construction materials to Qlipoth, solidifying his position. They are allied with the Strategic Investment Department."
civic_techniques_developing_department:"§ATechnology R&D Department§!"
civic_techniques_developing_department_desc:"The Technology R&D Department collaborates deeply with the Intelligentsia Guild, transforming the Guild's research outcomes into commercial projects. As the saying goes, "experts manage experts"; the Corporation recognizes Director Yabuli's scientific literacy and business acumen, and her connections with the Guild's "Commonfolk Court" are always intriguing."
civic_techniques_developing_department_effect:"-Unlocks branch office building ['building:building_techniques_developing_department']$TABBED_NEW_LINE$-Whenever we sign a research agreement with another nation, we gain ['concept_pan_galaxy_research_system'] effect, immediately receiving a lump sum of trade and unity; the other party gains ['concept_pan_galaxy_research_system_member'] status."
councilor_techniques_developing_department:"§ATechnology R&D Department Director§!"
councilor_techniques_developing_department_desc:"Director Yabuli, possessing excellent scientific literacy and business acumen."
civic_human_resources_incentive_department:"§ATalent Incentive Department§!"
civic_human_resources_incentive_department_desc:"The Talent Incentive Department is responsible for recruiting, training, and supplying talent for the Corporation, and also serves as a medium for communication and collaboration on many cross-galaxy projects."
civic_human_resources_incentive_department_effect:"-Unlocks branch office building ['building:building_human_resources_incentive_department']$TABBED_NEW_LINE$-Every five years, conduct a selection that grants one leader the ['leader_trait:leader_trait_human_resources'] title, 500 experience, and promotes them one rank."
councilor_human_resources_incentive_department:"§ATalent Incentive Department Director§!"
councilor_human_resources_incentive_department_desc:"The Talent Incentive Department is responsible for recruiting, training, and supplying talent for the Corporation, and also serves as a medium for communication and collaboration on many cross-galaxy projects."
civic_traditional_project_department:"§ATraditional Project Department§!"
civic_traditional_project_department_desc:"Time changes the rise and fall of many industries and their status within the Corporation's trade system. When an industry's share of the pan-galactic trade map falls below a certain threshold, it is removed from the Business Consolidation Department's purview and transferred to the Traditional Project Department, overseen by director Zaitian. The Traditional Project Department, with its mediocre performance, is not highly regarded within the Corporation, but some believe that true elites work there, quietly doing time-tested work."
councilor_traditional_project_department:"§ATraditional Project Department Director§!"
councilor_traditional_project_department_desc:"When an industry's share of the pan-galactic trade map falls below a certain threshold, it is removed from the Business Consolidation Department's purview and transferred to the Traditional Project Department, overseen by director Zaitian."
councilor_traditional_project_department_effect:"Corporation-exclusive corporate buildings produce more trade."
civic_publicity_Propaganda_department:"§APublicity and Propaganda Department§!"
civic_publicity_Propaganda_department_desc:"Director: Trela Fanes, known as the "Godmother", with a very ancient power base, skilled in motivation and oratory. Behind her are four "Guard Corps", wielding ancient "spiritual control". It is said she has planned over 200 assassinations, but Trela herself has killed only one person in her life."
councilor_publicity_Propaganda_department:"§APublicity and Propaganda Department Director§!"
