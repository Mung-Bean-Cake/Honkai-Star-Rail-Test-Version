#Initial Simulated Universe Project
herta_start_situation_chain_title: "Simulated Universe Technology Transformation Project"
herta_start_situation_chain_desc: "The Simulated Universe, jointly developed by four geniuses, has achieved great success. We have also been given the opportunity to undertake some downstream technologies and projects. By researching related technologies, we can transform these technologies into practical industries and higher-level technological research, thereby advancing our industries and technology.\n§BThere are four research directions in total. Completing all technology assistance directions will unlock the Ascension Perk $ap_herta_premote$.§!\nCurrent research status:\nHerta: [Get_herta_help_text]\nRuan Mei: [Get_ruanmei_help_text]\nScrewllum: [Get_luosi_help_text]\nStephen: [Get_sidifen_help_text]"
