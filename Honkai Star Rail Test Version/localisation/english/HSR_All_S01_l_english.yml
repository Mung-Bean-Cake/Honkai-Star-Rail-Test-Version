tr_xunlie_fanyu_1:"§BNomad from the Nest§!"
tr_xunlie_fanyu_1_flavor:"Justice is a foot high, evil is ten feet tall; under the stars, evil is everywhere, but justice is stretched thin. How can a single body of flesh and blood resist a fleet of space pirates? How can one metal skeleton defeat a rotting interstellar empire? To cleanse the universe, one must transcend the limitations of the individual. The cloning vats produce infinite copies of you, armored and memory-imprinted; you march into the infinite star domain in the name of an individual. You will appear at crime scenes in the galactic core, and call for reinforcements after being shot. You will enter disaster-stricken border worlds, killing monsters by sheer numbers, like ants devouring an elephant. You will die infinite times; you have died infinite times, but there will always be new nomads leaving the nest to continue the hunt."
tr_xunlie_fanyu_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_xunlie_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_fanyu_effect']：§G+1§!$TABBED_NEW_LINE$—Small Slot Weapon Damage: §G+100%§!$TABBED_NEW_LINE$—Small Slot Weapon Fire Rate: §G+100%§!$TABBED_NEW_LINE$—Torpedo Slot Weapon Damage: §G+100%§!$TABBED_NEW_LINE$—Torpedo Slot Weapon Fire Rate: §G+100%§!$TABBED_NEW_LINE$—Corvette Build Speed: §G+15%§!$TABBED_NEW_LINE$—Corvette Build Cost: §G-15%§!\nDuring wartime (including crises), the above effects double.\nUnlock Council Seat: $councilor_xunlie_fanyu_1$"
