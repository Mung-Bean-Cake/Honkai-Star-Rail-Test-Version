SR_belobog.121.title:0 "Rift Attack Victory"
SR_belobog.121.desc:0 "The attack on the Rift achieved a predictable victory. The Rift monsters continued to wail under the Silvermane Guards' artillery. Despite some costs, we successfully gained control of this area, bringing us one step closer to success.\nSometimes I wonder, maybe we could use their wails to hold a concert and invite the Grand Guardian to enjoy the bravery of our warriors?"
SR_belobog.121.a:0 "Makes sense, let's extend the invitation to the Grand Guardian immediately."
SR_belobog.121.b:0 "Don't joke; the Grand Guardian won't agree to such foolishness."
SR_belobog.122.title:0 "Victory Report"
SR_belobog.122.desc:0 "The battle against the Rift monsters has gotten off to a good start. Through the fierce fighting of the Silvermane Guards, we successfully repelled the Rift monsters' assault and established a strong defensive line. We will not allow any Rift monster to breach the line and harm our citizens.\nCurrently, the front line has stabilized, and the Rift monsters' attacks have slowed. It's time to consider a counterattack into the Rift-eroded areas."
SR_belobog.122.a:0 "We will reclaim the lost land."

SR_belobog.190.title:0 "Rift Monsters Fully Cleared"
SR_belobog.190.desc:0 "After a thorough search and elimination, the Rift monsters have been completely destroyed. Our outposts fill every corner of the land that once belonged to the Rift; the planet is once again wholly in our hands.\nThis disaster caused by the Cancer of All Worlds should now come to an end."
SR_belobog.190.a:0 "This great victory belongs to everyone in the nation!"

SR_belobog.199.title:0 "Error!"
SR_belobog.199.desc:0 "An error occurred in a Rift combat event related to SR_belobog.100+.\n\nIf you are a player and did not use the console to trigger this, please record as much context as possible related to this mod, contact me where I can see it, and roughly describe the circumstances under which it occurred."
SR_belobog.199.a:0 ":( There seems to be an issue with your mod."

SR_belobog.301.title:0 "The Great Migration"
SR_belobog.301.desc:0 "The first colony has been successfully established. Obviously, the environment here is much more suitable for survival than the homeworld. On the homeworld, one sees endless ice and snow and troublesome Rift monsters, but not here. This holds great appeal for our people.\nAccording to our polls, a significant number of people wish to move to the new world. If we grant their request, we can relocate a huge population from the homeworld at a small resource cost — as long as all influence gained is used for forced migration."
SR_belobog.301.a:0 "We agree, of course."
SR_belobog.301.b:0 "Let's not."

SR_belobog.9999.title:0 "Incoming Transmission"
SR_belobog.9999.desc:0 "I've made some changes; I'm not sure if they work. But there are certainly many bugs left."
SR_belobog.9999.a:0 "Got it"
SR_belobog.9999.a.desc:0 "……"
