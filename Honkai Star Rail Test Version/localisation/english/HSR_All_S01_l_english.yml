NAME_huanyunv:"Trailblazer — Elation"
huanyunv_catch_phrase:""Laughter is humanity's praise!""
huanyunv_backstory:"A young girl who boarded the Astral Express. To eliminate the crisis brought by the Stellaron, she chose to journey with the train."
hsr_paragon.65.name:"Trailblazer — Elation"
hsr_paragon.65.a:"First Meeting"
hsr_paragon.65.a.response:"When you have a chance to choose, don't make yourself regret it..."
hsr_paragon.65.b:"Greeting"
hsr_paragon.65.b.response:"Alright, you've caught my attention."
hsr_paragon.65.c:"Observations"
hsr_paragon.65.c.response:"If I hadn't chosen to board the train, what kind of life would I have lived... no, there is no "if"."
