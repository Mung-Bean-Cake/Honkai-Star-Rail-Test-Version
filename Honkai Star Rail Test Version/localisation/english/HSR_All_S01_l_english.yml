concept_cunhu: "§H「Preservation」§!"
concept_cunhu_desc: "§H「Preservation」, Qlipoth§!\nBuilder of the Celestial Wall, Cosmic Crystal Wall, and the Great Attractor foundations, worshipped as the "Amber Lord". He is a survivor of the distant "Dusk War". He knows that the devouring enemy is imminent, so He must build barriers spanning light-years to seal it, isolating and protecting worlds that still hold life.\n§H「Contemplatives gaze at the stars and seek the ultimate goal of civilization — 'Build a wall,' a resounding echo fills the mind: 'Build a wall.'」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——Adrian Spencer-Smith, "Fables of the Stars"§!"
concept_cunhu_effect:"Path: 「Preservation」"
concept_cunhu_effect_desc:"§HDefensive§! Path. Initially boosts §GPlanet Infrastructure Build Speed§!, §GPlanet Build Queue Limit§!, and §GDefense Army Morale, Damage, Health§!. As devotion increases, it boosts §HStarbase Capacity, Damage, Hull§!, §HDefense Platform Damage and Hull§!. Reduces §GStarbase Upgrade Cost§!, boosts §Hship build speed (defensive war)§! and §Hhome territory fire rate§!."
