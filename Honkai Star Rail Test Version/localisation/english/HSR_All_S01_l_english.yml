#Starting Introductions
Herta_Space_Station_start_screen_messages:0 "Upholding the philosophy of "Transmitting Erudition," it engages in free and broad research; the star river is a timeless poem, and the 「Herta」 Space Station is slowly turning its pages. Herta once worried about the vast number of curios collected across the star domains — huge in quantity, difficult to store, and she was unwilling to manage them herself. The enthusiastic Interastral Peace Corporation immediately proposed a solution, and the space station 「Herta」, sealing wisdom and secrets, was thus born. The station's staff established detailed containment measures for the collection, striving to "encompass all things with clarity and reason". Phenomena are stored in special containers, curios regulated by curio entries — the vast collection is classified and stored deep within the station for research. The Corporation then proposed an initiative to jointly explore the mysteries of the stars, and scholars seeking novelty and knowledge flocked to the station to pursue learning. Most of the staff admire Herta, vowing to practice their starry ideals and uncover the secrets whispered by the stars across the universe. They explore the domains of starry life, discern the justice of arguments, map the landscapes of the starry plains, unravel the mysteries of rituals and ceremonies, and practice the spirit of seeking knowledge through investigation."
Stellaron_Hunters_start_screen_messages:0 "Wanted notice issued by the Interastral Peace Corporation: Blade, Silver Wolf, Sam... these four, dead or alive; do not harm "Destiny's Slave" or deprive him of independent thought. In a certain silent moment, the "Cancer of All Worlds" stirred ripples in the vast sea of stars like a stone thrown into water. In an extremely short time, these twisted and obscure substances had contaminated many worlds, yet alongside the mud and dregs came gems of sunlight and starlight — namely, Stellarons. Wherever Stellarons went, they left destruction and ruin. For civilizations deeply affected, Stellarons were the symbol of annihilation. Even so, there appeared in the star sea those who sought the pearl in the muddy waters, calling themselves "Stellaron Hunters", shuttling between different worlds to seize Stellarons. Apart from their deeds, everything about the "Stellaron Hunters" remains unknown: which Aeon do they follow, what is their purpose in seizing Stellarons? ... Among the myriad rumors, only one consensus has been reached across the universe: the "Stellaron Hunters" are few in number, but each is exceptionally skilled."
Belobog_start_screen_messages:0 "Thousands of years ago, Jarilo-VI had a spring-like climate and enviable marine environments. The forests were laden with fruit, tides brought moist warmth, and wine could be scooped like spring water for all to drink. The local inhabitants were extremely enterprising and energetic, building roads, cities, seaside villas, and exquisite palaces. A life of plenty seemed to start with a cup of coffee at dawn and end with a mug of malt ale at dusk. Then star rails connected Jarilo-VI's world, bringing interstellar trade and extraterrestrial technology. At first, visitors came in search of geomarrow ore, these crystalline minerals containing the lifeblood of industry, their amber reflection echoing the light of Preservation. Later, visitors came for a long and comfortable life — its bays, palm trees, and cheerful music were suitable for any weary traveler seeking a home. People believed that given time, this planet with its humid climate would shine among the stars like other brilliant worlds. About a thousand years ago, a Stellaron streaked across the sky and fell upon this world. Then, the entire planet's fate took a sharp turn, like a farcical drama. The savage Antimatter Legion descended from the sky, and raging wars spread across the land. The Builders constructed walls and battle lines; hundred-meter-tall colossi stood and wrestled with dragon-shaped giants — then, without warning, a cold snap appeared, and the fierce blizzard swallowed everything indiscriminately. The entire planet fell silent... An immense invisible barrier covered the fortress city like a flame cupped in the hands against the cold, thus preserving civilization. Later, this city came to be known as Belobog."
The_Interastral_Peace_Corporation_start_screen_messages:0 "To the public, the Corporation is a megacorporate conglomerate advocating free trade; operationally, it is a commercial autocracy that issues currency and monopolizes resources; from its founding mission, it is the selfless support network that devotes everything to the Aeon of Preservation. Most interstellar citizens speak of the Corporation in terms of its ubiquitous goods and recognizable signage: as if "wherever there is trade, there is the Interastral Peace Corporation." Indeed, nearly all commercial activity in the galaxy is built on the Corporation's "Credits" system. If interstellar trade were a sport, the Corporation would be both the top athlete and all the sports, both the arena and the rules themselves. This absolute dominance over wealth, combined with its ceaseless expansion, has given the Corporation a popular image of a conspiratorial autocrat. But the Corporation is indifferent to lowly aspirations of "world domination," because its corporate spirit has remained unchanged since its inception: to devote everything to the "Amber Lord" — Qlipoth."
Amphoreus_start_screen_messages:0 "The history of Amphoreus is a cyclical epic. The Titans were born first, creating the world and all things. But after the arrival of the three Calamity Titans, the city-states of Amphoreus began to be threatened by the Black Tide. To quell the Black Tide, heroes known as the Chrysos Heirs would slay the Titans, reclaim their Fire Cores, and ascend as demigods, wielding the divine authority of the Titans. After all twelve Fire Cores are reclaimed, Amphoreus undergoes a recreation, resetting the timeline. The demigods of the previous era rebuild Amphoreus with their memories, and the demigods of the previous era become the Titans of the present. Known eras: the Era of Enlightenment, Era of Creation, Era of Gold, Era of Conflict, and Era of Illusion. Twelve Titans created Amphoreus: three wove fate, three shaped the heavens and earth, three molded life, and three guided calamity."



