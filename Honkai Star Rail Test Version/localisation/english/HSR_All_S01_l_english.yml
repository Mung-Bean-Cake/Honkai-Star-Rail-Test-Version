#Ruan Mei
NAME_ruanmei:"Ruan Mei"
ruanmei_catch_phrase:""Neither hasten nor delay death, life will wither anyway.""
ruanmei_backstory:"A gentle and elegant scholar, member #81 of the Genius Society, an expert in life sciences. With her talent and astonishing perseverance, she caught the attention of Nous, and began her research and exploration into the origin of life in secret corners. She was invited by Herta, together with Screwllum and Stephen, to jointly develop the "Simulated Universe". In private, she enjoys traditional drama and pastries, and is also interested in embroidery."
hsr_paragon.5.name:"Space Station「Herta」- Ruan Mei"
hsr_paragon.5.a:"First Meeting"
hsr_paragon.5.a.response:"My name is Ruan Mei. When you say it, don't forget the pause between the syllables."
hsr_paragon.5.b:"Hobbies"
hsr_paragon.5.b.response:"The lips are most sensitive; for pastries to be considered excellent, just one small taste is enough. I prefer seasonal ingredients like fresh fruits and flowers, capturing the fleeting beauty of life, which is more likely to trigger dopamine reactions."
hsr_paragon.5.c:"Observations"
hsr_paragon.5.c.response:"Humans overestimate logic; clinging to rationality makes one a slave to emotion — science comes from passion, that's a gift."
leader_ruanmei_t1:"§MSlowly pluck and sweep§!"
leader_ruanmei_t1_desc:"The music repeats endlessly."
leader_ruanmei_t2:"§MShake the flower silk, not picking when damp with water§!"
leader_ruanmei_t2_desc:"No matter when it blooms, there will come a day when it is blown down by the wind...\n$leader_ruanmei_t2_effect_desc$"
leader_ruanmei_t2_effect_desc:"§BWhen Ruan Mei successfully captures a space creature, she will attempt to use its genes to conduct a small experiment with her knowledge...§!"
leader_ruanmei_t3:"§MFractal Spiral§!"
leader_ruanmei_t3_desc:"Life... is truly wondrous.\n$leader_ruanmei_t3_effect_desc$"
leader_ruanmei_t3_effect_desc:"§BUnlock Resolution ['concept_decision', $decision_ruanmei_get_buff$], allowing Ruan Mei to conduct an experiment§!"
leader_ruanmei_t4:"§MWipe the zither, brush the sleeves§!"
leader_ruanmei_t4_desc:"The lingering sound never fades."
leader_ruanmei_t5:"§MA needle of orchid§!"
leader_ruanmei_t5_desc:"You'll do."
