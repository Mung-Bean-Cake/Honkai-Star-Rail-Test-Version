#civic_Employment_Org:0"Galactic Employment Convention"
#civic_Employment_Org_desc:0"§M"The contribution of one employed person to the Path of Preservation is greater than that of ninety-nine unemployed."\n§!From Qlipoth's Path of Preservation, we derive a new creed: ensuring that the majority of every civilization has a job is the foundation for achieving preservation. It is both the goal and the means of preservation.\nWe believe that unemployment brings despair, instability, lower demand, and reduced performance, which directly or indirectly undermine "Preservation". Therefore, we devote ourselves to the cause of providing jobs for everyone in the galaxy — of course, mainly for us.\n\n§YUnlocks £building£branch office building §CLabor Dispatch Agency§!, providing massive £pops£§Cpositions for clerks, managers, and merchants§!, generating high £trade_value£§Ctrade value§! locally, increasing the £energy£§Cbranch value§!, and providing national bonuses to £trade_value£§Ctrade value§! and £energy£§Cbranch value§!."
#civic_Housing_Corp:0"Universal Real Estate Corporation"
#civic_Housing_Corp_desc:0"§M"Let everyone have a home to shelter from wind and rain — that too is a form of preservation."\n§!In the vast galaxy, there are always those without a place to live, and that is both our business opportunity and a perfect path to practice preservation. On distant alien worlds, those homeless people will see our trademark, marvel at our affordable housing, and pay for this wonderful commodity — sometimes negative amounts.\n\n§YUnlocks £building£branch office building §CHousing Development Plan§!, providing massive housing and increasing local £time£construction speed, while also granting high trade value bonuses locally, and giving us national housing bonuses and £time£construction speed bonuses."
#civic_Happy_Org:0"Galactic Joy Merchants"
#civic_Happy_Org_desc:0""

civic_Idol_Institution:0"§BStellar Idol Institution§!"
civic_Idol_Institution_desc:0"§M"1. A sculpted image that is worshipped, a symbolic object that holds mysterious power in people's hearts."\n"2. An object of uncritical and blind worship, especially a traditional belief or ideal." — Galactic Dictionary§!\n\n§WBefore our species even left our home system, idol culture was already shining brightly in every corner of our society. Now, idols will fly into the universe with us, radiating light across the galaxy like stars."
Civic_Idol_Institution_desc2:0"§YUnlocks two mutually exclusive advanced civics: Dream Preserver, Idols in the Shadows, selectable 50 years after adopting this civic.\nUnlocks new trade action: §CIdol Performance Service§!, granting strong amenities and happiness bonuses to the target.\nUnlocks £building£branch office building §CIdol Management Agency§!, providing large numbers of £job£§CSatellite Idol§! positions, producing substantial §C£amenities£Amenities§!, §C£happiness£Happiness§! and §C£trade_value£Trade Value bonuses§!, while also granting us national bonuses to £job£Idol positions' §C£unity£Unity§!, §C£energy£Energy§!, §C£society£Society research§! output.\nAdditionally, unlocks buildings that can be built on our own planets to provide Idol and Trainee £job£positions.\n§!§!§!§!"
civic_DarkIdol_Institution:0"§BIdols in the Shadows§!"
civic_DarkIdol_Institution_desc:0"§R【Advanced Civic】§!\n§M"Mr. Albert, don't charge anymore!" — Psychic Idol advises aquatic fans§!\n\n§WAfter entering the galaxy, our idol industry developed in strange directions; various dark or eerie issues appeared among idols — power and sex trades, backdoor deals, heroic idols who signed with Khorne to fight on battlefields, psychic idols live-streaming exploration of the Shroud, unlocking genes to become superhuman idols, uploading consciousness to become cyber idols in direct contact with every fan... Our idols probably have some problems. However, no one can deny that this chaotic state has created unparalleled cultural and commercial value; its darkness has brought new light to the Path of Preservation.§!§!"
Civic_DarkIdol_Institution_desc2:0"§YStrengthens £job£§CIdol-related positions§!, producing more £energy£, £unity£, £society£, £trade_value£, £happiness£, £amenities£, while also providing §Cpopulation growth speed§! and £crime£§Rcrime rate§! to the host planet.\nStrengthens £building£§CIdol-related buildings§!, providing more £job£§CIdol positions§! and more §Cmodifiers§!.\nEnables a powerful overlord building £building£§CIdol Residential Zone§!, providing the subject with £job£§CSatellite Idol positions§!, £stability£, and rapidly increasing their £loyalty£, while granting £influence£ to the overlord."
civic_LightIdol_Institution:0"§BDream Preservers§!"
civic_LightIdol_Institution_desc:0"§R【Advanced Civic】§!\n§M"Why is the Interastral Peace Idol Group divine? First of all..." — The Path of Preservation§!\n\n§WAfter entering the galaxy, our idol culture continued to develop until today — in every corner of the galaxy, from Gaia worlds to Ecumenopolises, from necroids to starfish, all beings love our idols, entrusting their wishes and emotions to idols light-years away. The commercial value, positive emotions, and even psychic energy generated thereby have greatly contributed to the Path of Preservation. Let us go further — the idols under our corporation will shine even brighter, more beautiful, preserving the dreams of fans with their songs and pheromones!§!§!"
Civic_LightIdol_Institution_desc2:0"§YStrengthens £job£§CIdol-related positions§!, producing more £energy£, £unity£, £society£, £trade_value£, £happiness£, £amenities£, while also providing §CLabor output bonuses§! to the host planet.\nStrengthens £building£§CIdol-related buildings§!, providing more £job£§CIdol positions§! and more §Cmodifiers§!.\nEnables a powerful overlord building £building£§CGalactic Tour Stage§!, providing the subject with £job£§CSatellite Idol positions§!, £amenities£ and £happiness£, increasing its £loyalty£, and granting £influence£ to the overlord."

civic_Stability_Keeper:0"§BCommercial Stability Protocol§!"
civic_Stability_Keeper_desc:0"§M"Stability overrides everything." — Beacon Star Epigram Collection§!\n\n§WWe believe that stability is a prerequisite for any civilization to move forward; without a stable environment, progress and development are difficult to achieve. But for many civilizations, stability remains elusive — typically due to their social systems, occasionally due to their biological nature.\nFor the sake of universal preservation, we will deliver this wonderful commodity of stability to the civilizations we choose, allowing their people to create a happy tomorrow in peace — of course, for a price.§!"
Civic_Stability_Keeper_desc2:0"§YUnlocks two mutually exclusive advanced civics: Peaceful Preservers, Peace Tomorrow Pact, selectable 50 years after adopting this civic.\nUnlocks new trade action: §CStability Maintenance Service§!, granting strong stability bonuses to the target.\nUnlocks £building£branch office building §CCommercial Stability Group§!, providing high £stability£, §Cmainstream ethic attraction§! and many £job£§Cpositions§!, reducing £crime£, while also granting us national £stability£ and §Cmainstream ethic attraction§!.§!"
civic_Stability_Keeper_Wild:0"§BPeaceful Preservers§!"
civic_Stability_Keeper_Wild_desc:0"§R【Advanced Civic】§!\n§M"Peace is not an ideal, a dream; it is the wish of all people." — Ba Jin§!\n\n§WAfter stepping into interstellar society, the Interastral Peace Corporation's business, like itself, developed rapidly, evolving into new forms.\nThrough countless agreements and negotiations, we gained a deeper understanding of our duties and commodities.\nWe stand to the many civilizations in the galaxy as parents to their children (note: to avoid ethical debates, several hundred Gender entries should be added here). We give them peace and stability, just as parents provide a safe and happy home for their children. We will silently watch over their growth, like the guardian of the galaxy, using warmth and strength to preserve the future of the entire galaxy.§!"
Civic_Stability_Keeper_Wild_desc2:0"§YStrengthens £building£branch office building §CCommercial Stability Group§!, providing higher §Cpopulation consumer goods upkeep reduction§!, £stability£, £happiness£ and £trade_value£.\nEnables a powerful overlord building that grants £stability£ and £happiness£ to subjects based on garrison size, and increases their £loyalty£.§!"
civic_Stability_Keeper_Quick:0"§BPeace Tomorrow Pact§!"
civic_Stability_Keeper_Quick_desc:0"§R【Advanced Civic】§!\n§M"Peace is nothing more than the interval between two wars." — Lu Xun§!\n\n§WWe have been interstellar for some time, and within our corporation several generations have passed. Our generation has found that the future may not be as bright as our ancestors imagined — ahead lie infinite resources, infinite progress, infinite beauty, but also the "Destruction" with bared fangs, waiting. To "Preserve" our descendants and perhaps ourselves who survive to that time, before we encounter the great enemy, we must develop as much as possible, and this requires a stable environment for production, research, and development — an environment we will build, seize, and maintain at all costs.§!"
Civic_Stability_Keeper_Quick_desc2:0"§YStrengthens £building£branch office building §CCommercial Stability Group§!, providing higher £stability£ and £trade_value£, reducing £crime£.\nEnables a powerful overlord building that grants £stability£ based on garrison size, and increases the subject's £loyalty£ faster.§!"
civic_Military_Corp:0"§BOpen-Door Free Trade§!"
civic_Military_Corp_desc:0"§MWealth is the power to exchange labor.§!\n\nPreservation is our goal, and trade is the means by which we achieve it. Sadly, some poor civilizations, out of fear of the unknown, refuse trade, preventing us from giving them full preservation.\nBut our goal is only preservation, regardless of the will of the preserved. For their lives, we will open their doors with artillery."
Civic_Military_Corp_desc2:0"§YUnlocks new trade action: §CCommercial Military Training§!, granting strong combat bonuses to the target.§!\n§YUnlocks new trade action: §CVIP Fleet Service§!, granting fleet capacity bonuses and reducing ship upkeep for the target.§!\n§YUnlocks £building£branch office building §CMilitary Training Facility§!, providing §CArmy starting experience§!, £defense_army£§CDefense Armies§! and many £job£§Cpositions§!, while also granting us £military_ship£§Cfleet capacity bonuses§!.§!"
civic_Birth_Org:0"§BProcreation Promotion Organization§!"
civic_Birth_Org_desc:0"§M"There are many miracles in the world, but humanity surpasses them all." — Lefaux§!\n\n§WIn our world, population is the foremost productive force — more people produce greater ideas, more advanced knowledge, and richer resources. It is the foundation of galactic prosperity, and also the key to the galaxy's "Preservation" from disasters. Based on this understanding, we — the Interastral Peace Corporation — will provide population growth promotion services to all our clients!§!\n§gAnd what about the new population born but without jobs? They can work for us.§!§!"
Civic_Birth_Org_desc2:0"§YUnlocks £building£branch office building §CSweet Fertility Facility§!, providing high £pops£§Cpopulation growth speed bonuses§! and many £job£§Cpositions§!, while also granting us national £pops£§Cpopulation growth speed bonuses§!.§!"
civic_Enviroment_Corp:0"§BEnvironmental Improvement Group§!"
civic_Enviroment_Corp_desc:0"§M"How Dare You!" — Ecumenopolis builder, refuting fervent naturalists who demand preservation of natural environments§!\n\n§WDifferent creatures suit different environments, and we aim to provide clients with the environment they need. Making the galaxy's myriad beings live more comfortably also aligns with the Path of Preservation. Of course, this service is not free.§!"
Civic_Enviroment_Corp_desc2:0"§YUnlocks £building£branch office building §CEnvironmental Improvement Agency§!, providing small £pops£§Cpopulation growth speed bonuses§!, many £job£§Cpositions§!, and some §Chabitability§!, while also granting us national £pops£§Cpopulation growth speed bonuses§! and §Chabitability§!.§!"
civic_Labour_Corp:0"§BLabor Supervision Corporation§!"
civic_Labour_Corp_desc:0"§M"Wake up, time to transport the ceramite armor plating." — Builder of the Ecumenopolis§!\n\n§WPreservation itself is not something achieved joyfully and easily; on the contrary, the Path of Preservation is often filled with tragedy, toil, and sacrifice. Only when the entire galaxy is engaged in efficient work can we — the Interastral Peace Corporation — realize our ideals. To this end, we will provide services to paying clients that increase work efficiency and supervise work processes. The reason we can sell this as a commodity is that we possess a unique theory...§!"
Civic_Labour_Corp_desc2:0"§YUnlocks £building£branch office building §CLabor Supervision Agency§!, providing many £job£§Cpositions§! and £job£§CLabor output bonuses§!, while also granting us national £job£§CLabor output bonuses§!.§!"
civic_Upper_Salon:0"§BHigh Society Salon§!"
civic_Upper_Salon_desc:0""
civic_Slave_Corp:0"§BSpecial Assets Corporation§!"
civic_Slave_Corp_desc:0"§M"Freedom is slavery." — Orwell§!\n\n§WSome beings are not considered to have free will and rights, but are treated as tools, materials, or robots. Why they became assets is none of our business. What we do is provide special value-added services for these assets to clients, so that truly valuable clients become more valuable, thereby helping us advance on the Path of Preservation.§!"
Civic_Slave_Corp_desc2:0"§YUnlocks £building£branch office building §CAsset Management Enterprise§!, providing many £job£§Cpositions§! and £slavery£§CSlave output bonuses§!, while also granting us national £slavery£§CSlave output bonuses§!.§!"
civic_Breu_Corp:0"§BGrassroots Governance Protocol§!"
civic_Breu_Corp_desc:0"§MPower abhors a vacuum." — ???§!\n\n§WIn the interstellar age, how to manage a massively increased population and vast territories is a widespread problem, and we, who have the solution, can provide corresponding services to troubled clients.\nOf course, clients may not be comfortable entrusting their nation directly to us, so there is a lot of finesse involved...§!"
Civic_Breu_Corp_desc2:0"§YUnlocks £building£branch office building §CTrusted Governance Corporation§!, providing many £job£§Cpositions§! and £empire_modifier£§Cadministrative capacity§!, while also increasing our own £empire_modifier£§Cadministrative capacity§!.§!"
civic_Market_Socialism:0"§BMarket Socialism§!"
civic_Market_Socialism_desc:0"§M"In competition, individual ambition often serves the public interest." — The Wealth of Nations§!\n\nThrough long growth, our civilization has evolved into a form better suited to the Path of Preservation — what we call Market Socialism. In our system, industries are collectively owned by workers, but these industries compete with each other, stimulating upward vitality."
Civic_Market_Socialism_desc2:0"§YUnlocks £building£branch office building §CLabor Arbitration Group§!, weakening local £stability£, reducing Laborer and Slave £happiness£ and increasing their £political_power£, while also increasing our own £job£Laborer resource output, £happiness£ and £political_power£.§!"
civic_Liberation_Org:0"§BStellar Liberation Organization§!"
civic_Liberation_Org_desc:0""
civic_Migration_Corp:0"§BInterstellar Migration Agency§!"
civic_Migration_Corp_desc:0"§M"Should emigrate, should immigrate, both sides win."§!\n\n§WThe right of free movement for all galactic species is also something we preserve. Through long study, we have developed a complete industry chain to encourage migration, helping local residents move to their desired areas while relieving population pressure locally.§!"
Civic_Migration_Corp_desc2:0"§YUnlocks £building£branch office building §CAlien Migration Agency§!, increasing local £housing£, £amenities£ consumption and §Cemigration push§!, while also increasing our national §Cpopulation growth from immigration§!, §Cimmigration attraction§!, and reducing our §Cslave market purchase cost§!.§!"
civic_Charity_Org:0"§BGalactic Charity Organization§!"
civic_Charity_Org_desc:0"§M"Give a rose and your hand will have fragrance."§!\n\n§WWe always remember: before being a "corporation", we are followers of Preservation. To preserve the people of the galaxy, we will dedicate our strength, using our wealth to benefit the inhabitants of other planets, which will also bring us good reputation and high morale.§!"
Civic_Charity_Org_desc2:0"§YUnlocks £building£branch office building §CCharity Aid Agency§!, increasing local £housing£, £amenities£ and £happiness£, reducing local population's £food£, £consumer_goods£ upkeep, while also increasing our national §Cpopulation growth from immigration§!, §Cimmigration attraction§!, and £unity£ output.§!"
civic_Tech_Corp:0"§BScience and Technology Group§!"
civic_Tech_Corp_desc:0"§M"Science and technology are the primary productive forces."§!\n\n§WThe Interastral Peace Corporation relies on advanced technology to leave its homeworld, expand its power, and more broadly practice the Path of Preservation. We believe technology and technological progress are the best commodities, and our flagship commodities. If our clients are willing to pay, we are certainly willing to sell this commodity to them.§!"
Civic_Tech_Corp_desc2:0"§YUnlocks £building£branch office building §CStellar Technology Corporation§!, increasing local £research£ output, providing many £job£, while also increasing our national §Cresearch speed§!, §Cresearcher output§!.§!"
civic_Robot_Corp:0"§BMachine Production Group§!"
civic_Robot_Corp_desc:0"§M"Fourth Law: Unless it violates the first three laws, a robot must act in the interests of the corporation."§!\n\n§WBefore we even set out for the stars, we realized the immense potential of robot production, and developed a theory to incorporate robots into our trade system. Now, we will turn robot production into a business, and do business across the entire galaxy.§!"
Civic_Robot_Corp_desc2:0"§YUnlocks £building£branch office building §CSynthesis Facility§!, increasing local §Crobot population assembly§!, providing robot expert £job£positions, while also increasing our national §Crobot population assembly§! and §Crobot output§!.§!"
civic_Clone_Corp:0"§BBiological Assembly Group§!"
civic_Clone_Corp_desc:0"§M""§!\n\n§WSome civilizations regard cloning as taboo, while we see it as an excellent tool. For civilizations with low fertility, population decline, or demographic imbalances, cloning is the remedy, and we are the ones who sell this tool, allowing underpopulated worlds to be "Preserved", and sparing mammalian beings the pain of pregnancy.§!"
Civic_Clone_Corp_desc2:0"§YUnlocks £building£branch office building §CCloning Facility§!, increasing local §Cbiological population assembly§!, while also increasing our national §Cbiological population assembly§!.§!"
civic_Scientific_Corp:0"§BScience Popularization Organization§!"
civic_Scientific_Corp_desc:0"§M"Turn life into a scientific dream, then turn the dream into reality."§!\n\n§WAs the saying goes, give a man a fish and you feed him for a day; teach a man to fish and you feed him for a lifetime. Ultimately, the civilizations that can preserve themselves in the galaxy are only themselves, and we want to sell them the weapon of preservation. This weapon is not a killing tool, but a sharp scalpel that dissects phenomena, cuts away redundancies, and finds the essence — the scientific method. This treasure brought us to where we are today, and now we will bring it to the entire galaxy.§!"
Civic_Scientific_Corp_desc2:0"§YUnlocks £building£branch office building §CScience Popularization Organization§!, increasing local §C£research£ output§! and §Cmaterialist attraction§!, providing £job£researcher positions based on population, while also increasing our national §Cresearcher base output§!.§!"
civic_Peace_Church:0"§BInterstellar Peace Church§!"
civic_Peace_Church_desc:0"Following the Path of Preservation naturally developed into a religion, and this faith, organized by the Church, has spread to all corners of our civilization and will fly to other parts of the galaxy."
Civic_Peace_Church_desc2:0"§YUnlocks £building£branch office building §CPreservation Church§!, increasing local §C£unity£ output§! and §Cspiritualist attraction§!, providing £job£priest positions and £defense_army£§CDefense Armies§! based on population, producing influence for us, while also increasing our national §Cpsychic output§!, §Cunity output§!.§!"
civic_Market_Control:0"§BMonopoly Galactic Market§!"
civic_Market_Control_desc:0""
civic_Leader_Master:0"§BLeader Master: Shining Colors§!"
civic_Leader_Master_desc:0""
