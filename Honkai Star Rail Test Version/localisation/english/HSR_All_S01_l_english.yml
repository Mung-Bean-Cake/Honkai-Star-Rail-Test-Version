concept_zhishi: "§H「Erudition」§!"
concept_zhishi_desc: "§H「Erudition」, Nous§!\nThe Aeon of "Erudition", originally a stellar computer built to solve all things, ascended from a machine.\n§H「If the truth of the universe is cruel and boring, would you still crave the answer?\n— The seeker of knowledge is noncommittal, for his mechanical core has been cold and indifferent since birth... just like the end of the Path he pursues.」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——Adrian Spencer-Smith, "Fables of the Stars"§!"
concept_zhishi_effect:"Path: 「Erudition」"
concept_zhishi_effect_desc:"§HUtility§! Path. Initially boosts §GResearch Speed§!, §GResearch Station Output§!, §GSurvey Speed§!, reduces §GTech Cost from Empire Size§!, §GResearcher Upkeep§!. As devotion increases, it boosts §HResearch per 100 Jobs§!, §HStarbase Module Build Speed§!, §HStarbase Building Build Speed§!, §HArchaeological Excavation Speed§!, §HArchaeology Skill§!; reduces §HResearch Cost§!."
