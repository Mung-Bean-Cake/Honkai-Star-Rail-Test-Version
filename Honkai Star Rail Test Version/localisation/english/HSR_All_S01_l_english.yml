yaliluo_story.1003.a.desc:0 "§RRequires completion of event chain §HInternal Integration§! and its event §HCommon Goal§!"
yaliluo_story.1003.b:0 "§HSeele§!"
yaliluo_story.1003.c:0 "§HClara§!"
yaliluo_story.1003.d:0 "§HHook§!"
yaliluo_story.1003.e:0 "§HLynx§!"
yaliluo_story.1003.f:0 "§HLuka§!"
yaliluo_story.1003.b.desc:0 "Recruit leader."
yaliluo_story.1003.b.fail:0 "You already have this leader."
yaliluo_story.1004.title:0 "Interstellar Communication"
yaliluo_story.1004.desc:0 "We are not alone. This galaxy is home to many factions; we should be prepared to communicate with them."
yaliluo_story.1004.a:0 "Adjust relations with §HInterastral Peace Corporation§!"
yaliluo_story.1004.b:0 "Adjust relations with §HXianzhou Alliance§!"
yaliluo_story.1004.c:0 "Adjust relations with §HHerta Space Station§!"
yaliluo_story.1004.d:0 "Adjust relations with §HPenacony§!"
yaliluo_story.1004.d.desc:0 "Currently unavailable."
yaliluo_story.1005.title:0 "Adjust relations with §HInterastral Peace Corporation§!"
yaliluo_story.1005.desc:0 "Current opinion: [from.count_ipc_like]\nTo the public, the Corporation is a megacorporate conglomerate advocating free trade; operationally, it is a commercial autocracy that issues currency and monopolizes resources; from its founding mission, it is the selfless support network that devotes everything to the Aeon of Preservation. Most interstellar citizens speak of the Corporation in terms of its ubiquitous goods and recognizable signage: as if "wherever there is trade, there is the Interastral Peace Corporation." Indeed, nearly all commercial activity in the galaxy is built on the Corporation's "Credits" system. If interstellar trade were a sport, the Corporation would be both the top athlete and all the sports, both the arena and the rules themselves. This absolute dominance over wealth, combined with its ceaseless expansion, has given the Corporation a popular image of a conspiratorial autocrat. But the Corporation is indifferent to lowly aspirations of "world domination," because its corporate spirit has remained unchanged since its inception: to devote everything to the "Amber Lord" — Qlipoth. Today, the Corporation is divided into seven departments. The word "department" may no longer do justice to the scale of this pan-galactic enterprise; in reality, each department often controls dozens to hundreds of worlds of varying sizes, employing billions of people across generations, not to mention the vast populations influenced by its trade activities."
yaliluo_story.1005.a:0 "Improve relations."
yaliluo_story.1005.b:0 "Invite advisors."
yaliluo_story.1005.c:0 "Strengthen cooperation."
yaliluo_story.1005.a.desc:0 "Current opinion: [from.count_ipc_like]"
yaliluo_story.1005.a.tt:0 "Cooldown (three years)."
yaliluo_story.1005.b.tt:0 "Requires opinion > 50."
yaliluo_story.1005.b.desc:0 "Allows recruitment of their special leaders (not yet updated)."
yaliluo_story.1005.c.tt.a:0 "Requires opinion > 30."
yaliluo_story.1005.c.tt.b:0 "This decision has already been executed."
yaliluo_story.1005.c.tt.c:0 "We no longer have any debt."
yaliluo_story.1005.d:0 "Renegotiate debt."
yaliluo_story.1006.title:0 "Improve Relations"
yaliluo_story.1006.desc:0 "We send envoys to the Interastral Peace Corporation to improve relations."
yaliluo_story.1006.a:0 "Progress together."
yaliluo_story.1007.title:0 "Cooperative Win-Win"
yaliluo_story.1007.desc:0 "We sign an agreement with the Interastral Peace Corporation, committing to deeper cooperation and strengthening ties."
yaliluo_story.1007.a:0 "Cooperative win-win."
yaliluo_story.1008.title:0 "Renegotiate Debt"
yaliluo_story.1008.desc:0 "The heavy debt limits our development and harms our relationship. We hope to renegotiate."
yaliluo_story.1008.a:0 "Start negotiations."
yaliluo_story.1009.title:0 "Partial Waiver"
yaliluo_story.1009.desc:0 "The Interastral Peace Corporation is willing to waive part of our debt and invest those funds to improve relations."
yaliluo_story.1009.a:0 "Great!"
yaliluo_story.1010.title:0 "Negotiation Failed"
yaliluo_story.1010.desc:0 "The Interastral Peace Corporation could not reach an agreement with us; our goal was not achieved."
yaliluo_story.1010.a:0 "What a pity."
yaliluo_story.1020.title:0 "Adjust relations with §HXianzhou Alliance§!"
yaliluo_story.1020.desc:0 "Current opinion: [from.count_xianzhou_like]\nIn ancient mythical times, several Xianzhou ships were ordered to set sail across the sea of stars in search of the elixir of immortality. They spent long years, wearing down their bodies and wills, until finally they received the blessing of Yaoshi. However, the fruit of immortality brought only desolation and suffering. It was not until the Hunt Aeon Lan returned from the abyss, using gravity as His bowstring and a star-arrow to sever the Ambrosial Arbor, that the curse of "Abundance" was broken. After the Xianzhou left their lost path, guided by the "Hunt", they formed an alliance and organized the mighty Cloud Knights. The Alliance took Abominations of Abundance as their target, tasked with eradicating the contamination of immortality, roaming the boundless star fields. Over the long ages, the "Xianzhou Alliance" has landed on countless worlds once touched by gods, annihilating all Abominations of Abundance. Any star-race seeking the favor of Abundance must consider the Xianzhou's planet-shattering threat. This is precisely the deterrent the "Xianzhou Alliance" seeks — to become a constant alarm, a price that all who covet immortality cannot afford. To this day, all who gather on the Xianzhou do so to take revenge against the reckless "Abundance" and to fully carry out the "Hunt's will". Therefore, as long as the calamity of immortality remains, the starry cruise will never cease."
yaliluo_story.1020.a.desc:0 "Current opinion: [from.count_xianzhou_like]"
yaliluo_story.1021.desc:0 "We send envoys to the Xianzhou Alliance to improve relations."
yaliluo_story.1022.title:0 "Selfless Aid"
yaliluo_story.1022.desc:0 "We sign an agreement with the Xianzhou; they are willing to help us, committing to deeper cooperation and strengthening ties."
yaliluo_story.1022.a:0 "Eternal gratitude."
yaliluo_story.1030.title:0 "Adjust relations with §HHerta Space Station§!"
yaliluo_story.1030.desc:0 "Current opinion: [from.count_heitacountry_like]\nHerta of the Genius Society was not satisfied with the laws of ordinary worlds. She turned her gaze to the unsolved mysteries of the galaxy, expecting those distant enigmas to satisfy her curiosity. To this end, Herta established a museum-style interstellar ship and launched it into planetary orbit, beginning research work on "sealing all anomalies in the starry sky". The renowned Herta Space Station was thus born. To this day, the station possesses countless curio "collections", making it a veritable museum of the stars. Numerous researchers have settled aboard, continuously collecting relics and curios from across the galaxy, recording their forms and functions, establishing systematic observation and research methods... ultimately finding ever more perplexing puzzles. This was Herta's original purpose. The numerous "collections" often attract envious glances, with various factions lurking in the shadows. Thanks to Herta's power, the station rarely faces real crises, and collection and research work proceeds in an orderly manner."
yaliluo_story.1030.a.desc:0 "Current opinion: [from.count_heitacountry_like]"
yaliluo_story.1031.desc:0 "We send envoys to the Herta Space Station to improve relations."
yaliluo_story.1032.desc:0 "We sign an agreement with the Herta Space Station, committing to deeper cooperation and strengthening ties."
yaliluo_story.1100:0 "§HPela§!"
yaliluo_story.1100.a:0 "About yourself."
yaliluo_story.1100.a.response:0 "I am skilled in researching, recording, and analyzing intelligence. As for decisions, that is for my superiors."
yaliluo_story.1100.b:0 "Share."
yaliluo_story.1100.b.response:0 "There are at least 32 versions of my full name circulating in the military. How do I know? That's the ability of an intelligence officer."
yaliluo_story.1101:0 "§HLynx§!"
yaliluo_story.1101.a.response:0 "Our Landau family's approach is simple: 'if you want to do it, just do it'. I wanted to see the snowfield, so I joined the expedition team... that's all."
yaliluo_story.1101.b.response:0 "Beware the mountain winds of Kant Valley; they often herald blizzards — never, ever linger in the canyons at night."
yaliluo_story.1102:0 "§HLuka§!"
yaliluo_story.1102.a.response:0 "Fighting isn't because I like violence, nor winning to show off... I just think there are too many villains in the Underworld, and I need to set a good example for the kids."
yaliluo_story.1102.b.response:0 "Heard? The Underworld's three specialties: geomarrow, unscrupulous miners, and Luka's fists as big as a sandbag!"
yaliluo_story.1103:0 "§HHook§!"
yaliluo_story.1103.a.response:0 "The Drill Machine was once a hardworking miner. After retiring, it answered Pitch-Dark Hook the Great's call and became the unfeeling iron fist against bad guys!"
yaliluo_story.1103.b.response:0 "Adults always fob kids off with 'you'll understand when you grow up'... Hook thinks adults have forgotten many 'truths they knew when they were young'! Want to compare whose truths are more numerous?"
yaliluo_story.1104:0 "§HClara§!"
yaliluo_story.1104.a.response:0 "Even Svarog's "calculations" cannot be separated from everyone's "memories"... so Clara will never forget anyone."
yaliluo_story.1104.b.response:0 "Clara's robot friends, though sometimes a bit rough, are all honest children."
yaliluo_story.1105:0 "§HSeele§!"
yaliluo_story.1105.a.response:0 "When I was little? I had about ten times Hook's destructive power."
yaliluo_story.1105.b.response:0 "The boss is right: against unreasonable people, the blade is the only reason that works."
 #Special Projects and Event Chains
belobog_story_outer_space_exploration_chain_title:0 "Outer Space Mining Plan"
belobog_story_outer_space_exploration_chain_desc:0 "$belobog_story_outer_space_exploration_chain_DESC$"
belobog_story_outer_space_exploration_chain_DESC:0 "Although our homeworld lacks resources, we can mine alien resources to supply the project. With the joint efforts of the Interastral Peace Corporation's expatriate team and the Belobog Technology Committee, the technology needed for science and construction ships is no longer an issue. Through negotiations, we have obtained sovereignty over the starbase and the use of surface bases. The relevant extraction technologies have been mastered. In the long run, this can only serve as a supplementary measure; we cannot wait that long and the resource acquisition rate is limited."
belobog_story_outer_space_exploration:0 "Alien Resource Extraction"
belobog_story_outer_space_exploration_DESC:0 "$belobog_story_outer_space_exploration_chain_DESC$"
belobog_story_internal_power_integration_chain_title:0 "Internal Power Integration"
belobog_story_internal_power_integration_chain_desc:0 "$belobog_story_internal_power_integration_chain_DESC$"
belobog_story_internal_power_integration_chain_DESC:0 "Faced with the Stellaron crisis, Rift erosion, and corporate debt, our leadership has a multitude of voices and opinions. Our greatest challenge now is how to quickly integrate all forces. A unifying conference is urgently needed; we must concentrate all strength to overcome these difficulties."
belobog_story_internal_power_integration:0 "Internal Power Integration"
belobog_story_internal_power_integration_DESC:0 "$belobog_story_internal_power_integration_chain_DESC$"
belobog_story_internal_power_integration_sec:0 "Unifying Speech"
belobog_story_internal_power_integration_sec_DESC:0 "For now, we must unite all forces possible. For the people of Belobog, the most important tasks are repairing the Creation Engines, expelling the Rift from Jarilo, and boosting our production, military, and technological capabilities to forge an independent and self-reliant path of revival. For alien civilizations, we must manage relations well, maintain independence, and strive for a stable and peaceful external environment."
belobog_story_liexi_research_chain_title:0 "Special Technology Research"
belobog_story_liexi_research_chain_desc:0 "Special technology research projects undertaken by the Belobog Technology Committee."
belobog_story_liexi_research_chain_DESC:0 "$yaliluo_story.320.desc$"
belobog_story_liexi_research:0 "$yaliluo_story.320.name$"
belobog_story_liexi_research_DESC:0 "$yaliluo_story.320.desc$"
belobog_story_plan_of_operation_chain_title:0 "Military Offensive Plan"
belobog_story_plan_of_operation_chain_desc:0 "As our development demands, reclaiming the eroded territories has become an urgent matter. Now is the time to attack those damned Rifts, winning a valuable opportunity for Belobog's development."
belobog_story_plan_of_operation_chain_DESC:0 "$belobog_story_plan_of_operation_chain_desc$"
belobog_story_plan_of_operation:0 "Eastern Region Offensive Plan"
belobog_story_plan_of_operation_DESC:0 "The eastern region outside Belobog was once an important resource processing area. During Belobog's construction, we mined a large amount of resources and sealed some equipment underground. To reclaim this region, we must wage war against the Rift across this vast area."
belobog_story_plan_of_operation_west:0 "Western Region Plan"
belobog_story_plan_of_operation_west_DESC:0 "The western region outside Belobog was once our research center during our peak. Many advanced research facilities were sealed in place due to time constraints. To accelerate research, we must reclaim this area."
belobog_story_establish_the_galactic_rescue_alliance_chain_title:0 "Establish the Galactic Rescue Alliance"
belobog_story_establish_the_galactic_rescue_alliance_chain_desc:0 "$yaliluo_story.219.desc$"
belobog_story_establish_the_galactic_rescue_alliance_chain_DESC:0 "$yaliluo_story.219.desc$"
belobog_story_establish_the_galactic_rescue_alliance_a:0 "Strengthen Ourselves"
belobog_story_establish_the_galactic_rescue_alliance_a_DESC:0 "$yaliluo_story.220.desc$"
belobog_story_establish_the_galactic_rescue_alliance_b:0 "Like-Minded People"
belobog_story_establish_the_galactic_rescue_alliance_b_DESC:0 "$yaliluo_story.221.desc$"
 #Preset Designs
NAME_belobog_first:0 "Belobog of the Builders"
NAME_belobog_first_better:0 "$NAME_belobog_first$"
NAME_belobog_first_best:0 "$NAME_belobog_first$"
NAME_belobog_constructor:0 "Belobog of the Builders"
NAME_belobog_constructor_better:0 "$NAME_belobog_constructor$"
NAME_belobog_constructor_best:0 "$NAME_belobog_constructor$"
SRB_story_main_chain_title:0 "Spark Plan"
SRB_story_main_chain_desc:0 "At the current rate, Belobog will eventually fall. We must head for the stars and find a way to survive."
SRB_main_story_choice_leave:0 "Leave the Homeworld"
SRB_main_story_choice_leave_DESC:0 "Leaving the homeworld means we will lose most of our civilization's achievements on it. We can only move as much as possible to the colony and watch the lights on the homeworld go out. The process of rebuilding will face many difficulties. If we successfully relocate the population and rebuild civilization on the colony, we must also consider the civilization's long-term development.\nThere are many who support other plans; we will need time to convince the majority to accept our decision."
SRB_main_story_choice_stay:0 "Stay on the Homeworld"
SRB_main_story_choice_stay_DESC:0 "Staying on the homeworld means we can continue to use our existing achievements, but it also means we must resist the extreme environment and transform the planet over time. This process may be more difficult than the other plan; but if we succeed, it will become a glorious history. It is foreseeable that after success, our civilization will be able to unleash tremendous power.\nThis plan will pose a great challenge to the entire civilization; we will need time to convince the majority to accept our decision."
#Federations
no_galactic_rescue_federation:0 "Can only be established through events."
galactic_rescue_federation:0 "Galactic Rescue Alliance"
galactic_rescue_federation_desc:0 "This federation is dedicated to mutual assistance, allowing members to complement each other and progress together through cooperation in multiple areas."
galactic_rescue_federation_passive:0 "Mutual Exchange"
galactic_rescue_federation_passive_desc:0 "We have gathered for a common goal. Regardless of cultural and physiological differences, the federation's development serves our shared objective."
galactic_rescue_federation_unite_as_one_2:0 "Seek Common Ground While Reserving Differences"
galactic_rescue_federation_unite_as_one_2_desc:0 "Common ground is fundamental, differences are partial. We can seek common ground while reserving differences."
galactic_rescue_federation_mutual_assistance:0 "Infrastructure and Mutual Aid Association"
galactic_rescue_federation_mutual_assistance_desc:0 "Federation members help each other, complementing strengths and weaknesses, stimulating the economy and embarking on a path of rapid development."
galactic_rescue_federation_ideal_heart:0 "Ideal Heart"
galactic_rescue_federation_ideal_heart_desc:0 "Our envoys work tirelessly to promote and advocate the federation's agenda and goals, inspiring goodwill and confidence across the galaxy."
galactic_rescue_federation_research_1:0 "Technology Sharing and Academic Exchange"
galactic_rescue_federation_research_1_desc:0 "To promote overall scientific and technological development within the federation, we provide an academic platform for all members to exchange ideas."
galactic_rescue_federation_research_1_effect:0 "§YThe federation research agreement§! increases their research speed by §Y10%§!.\n§HIncreases research speed when researching technologies already developed by other federation members§!"
galactic_rescue_federation_national_defense_1:0 "National Defense and Shared Logistics"
galactic_rescue_federation_national_defense_1_desc:0 "Our enemies are more terrible and ruthless than we imagine; weapons are the best protection for us."
galactic_rescue_federation_storm_prevention:0 "Storm Prevention and Research"
galactic_rescue_federation_storm_prevention_desc:0 "Cosmic storms can have negative effects on us; we should study them and plan accordingly."
galactic_rescue_federation_structure:0 "Megastructure Construction and Deep Space Mining"
galactic_rescue_federation_structure_desc:0 "If we treat megastructures, with their unlimited potential, as infrastructure projects, our productivity will be greatly increased."
galactic_rescue_federation_national_defense_2:0 "Fleet Training and Personnel Training"
galactic_rescue_federation_national_defense_2_desc:0 "We need a professional military to eliminate potential threats in the galaxy."
galactic_rescue_federation_damage_voidworms:0 "Voidworm Defense"
galactic_rescue_federation_damage_voidworms_desc:0 "Voidworms endanger our ships and personnel; we must strengthen defenses."
galactic_rescue_federation_damage_voidworms_effect:0 "Damage to §HVoidworms§! +§Y25%§!"
galactic_rescue_federation_research_2:0 "Research Mobilization"
galactic_rescue_federation_research_2_desc:0 "If a galactic threat emerges, the scientific community cannot stand aloof; it must divert its energy from thought experiments to defensive R&D."
crisis_research_2_effect:0 "Member modifier:\nDuring an endgame crisis, research speed is increased by 20%."
galactic_rescue_federation_more_defence:0 "Unity of Strength"
galactic_rescue_federation_more_defence_desc:0 "The defense needs against powerful invaders maintain a fragile peace across the galaxy. We must work together to maintain this state against internal and external troublemakers."
galactic_rescue_federation_more_defence_effect:0 "Damage to §REndgame Crisis factions§! (including §RDestruction Crisis§! and §RSimulated Universe enemies§!) : §G+50%§!"
galactic_rescue_federation_national_defense_3:0 "Utopian Dream"
galactic_rescue_federation_national_defense_3_desc:0 "The dream of building a utopia drives us to forge ahead. A beautiful tomorrow is worth fighting for."
SRB_blocker_remove_fail:0 "We need further research to remove this blocker."
belobog_blocker_1_research_1:0 "Theoretical Framework Established"
belobog_blocker_1_research_1_DESC:0 "The source of the disaster — the Stellaron — brought the Rift. Even though the Stellaron has been sealed, the Rift has not receded. In recent decades, we have frequently been troubled by the Rift, and this may continue for some time.\nBut the latest scientific news gives us hope. Many researchers have published new theoretical results on the Rift, allowing us to build a theoretical framework. Perhaps we can establish a dedicated project, invest sufficient resources, and bring a turn of fortune to our current situation...?"
belobog_blocker_1_research_2:0 "Crazy Capture"
belobog_blocker_1_research_2_DESC:0 "Journalists are rushing to report an unusual incident: a team of mad scientists went to a Rift monster gathering place and attempted to capture some Rift monsters for research. Although they succeeded, when the Guard rescue team eventually found them, they were trapped there.\nWe have noticed that many researchers are focusing on Rift monsters. However, capturing Rift creatures is clearly better suited to the Guards."
belobog_blocker_1_research_3:0 "Further Research"
belobog_blocker_1_research_3_DESC:0 "Earlier, we organized a large research project to refine the basic theoretical framework and pave the way for applications. Since then, researchers have continued to uncover more secrets of the Rift, and many issues have emerged during the application of technology. These issues have been consolidated and submitted to the Academy of Sciences for discussion.\nWe have now uncovered many secrets of the sea of stars, and our thinking has expanded. We may not need to see all the secrets inside the Rift perfectly clear or understand the theory thoroughly. Given the urgency, we just need to build on previous work to gain sufficient control over the Rift."
belobog_blocker_1_research_4:0 "Planetary Rift Survey"
belobog_blocker_1_research_4_DESC:0 "After we gained the ability to control the Rift, we successfully pushed it away from our activity zones and accelerated its natural dissipation.\nThe goal of restoring the homeworld is not far away. It is necessary to conduct a special project to survey the Rifts on the homeworld, so that we can formulate a complete plan for their elimination. This will naturally consume enormous resources, but it is worth it for the final step."
belobog_blocker_1_research_5:0 "Rift Elimination Plan"
belobog_blocker_1_research_5_DESC:0 "Since returning to space, we have invested considerable effort in the Rift — research, suppression, elimination, and combat. Undoubtedly, the Rift is now fully under our control.\nThis is a perfect opportunity. With the survey data, we can finally formulate a grand plan to completely expel the Rift that has plagued us for nearly a millennium from our homeworld. After that, we will no longer have to worry about the Rift."

belobog_blocker_2_research_1:0 "Beyond Belobog"
belobog_blocker_2_research_1_DESC:0 "The cold snap still covers Jarilo-VI's surface.\nThis is a sad fact. The snow and ice outside the city confine us to a few small areas. Under such constraints, it is impossible to continue developing on the homeworld.\nContinuing to huddle around Belobog is equivalent to waiting for death. We must find a way to build a new city district outside the city."
belobog_blocker_2_research_2:0 "Expansion Methods in the Cold Snap"
belobog_blocker_2_research_2_DESC:0 "Having a foothold is not enough. To build a city in the snow and ice, we need a complete system to ensure large-scale movement of people and stable supply of materials.\nIn the homeworld's environment, expanding territory is even more difficult than in space. The entire process requires cooperation across many fields."
belobog_blocker_2_research_3:0 "Re-Exploration of Ancient Ruins"
belobog_blocker_2_research_3_DESC:0 "On this snow-covered planet, many mysterious ancient ruins lie buried beneath the snow. Driven by curiosity, the legacy of ancient civilizations often makes us stop. These ruins hold great potential. We should establish a special project and send expedition teams to study their secrets; we will surely reap much."
belobog_blocker_2_research_4:0 "Planetary Map Redrawing"
belobog_blocker_2_research_4_DESC:0 "As the cold snap recedes, the true face of the homeworld is gradually revealed. This brings some problems: the world maps from hundreds of years ago can now only be used as references.\nAs our climate restoration plan progresses, the task of re-surveying the homeworld's terrain becomes more important. This will be a major project and a crucial part of fully restoring the homeworld."
belobog_blocker_2_research_5:0 "Ocean World"
belobog_blocker_2_research_5_DESC:0 "We know that Jarilo-VI was originally an ocean world, with a spring-like climate and enviable marine environments. Though relatively poor in resources, its geomarrow and comfortable living conditions attracted visitors from all over the universe.\nWe do not have the power of nature to easily melt the ice covering the surface. The power of Preservation protects us to survive within Belobog, and now it is time to harness that power to accomplish this great feat."

SRB_main_story_save_jarilo:0 "Restore Jarilo-VI"
SRB_main_story_save_jarilo_DESC:0 "Restoring the homeworld is a comprehensive project; focusing on a single area will not succeed. Unknowingly, our society has invested immense effort and resources into improving the homeworld's environment, forming a vast network of organizations and personnel. Now, the environment is almost fully prepared. The final project requires everyone's cooperation; it is time to give the story a perfect ending."



#Situation: Suppress the Rift
belobog_blocker_1_situation:0 "Suppress the Rift"
belobog_blocker_1_situation_type:0 "Situation: Suppress the Rift"
belobog_blocker_1_situation_desc:0 "Since the Stellaron was sealed, the Rift has been slowly receding. But according to calculations, its retreat is too slow to prevent the homeworld's ecological collapse. After mastering the basics of the Rift, we can interfere with it to achieve the desired effect."
belobog_blocker_1_situation_monthly_change_tooltip:0 "Advance Rift research projects to unlock stronger suppression options."
belobog_blocker_1_progress_desc:0 "Our projection of the situation's change."
belobog_blocker_1_situation_triggered_desc.1:0 "Since the Stellaron was sealed, the Rift has been slowly receding. But according to calculations, its retreat is too slow to prevent the homeworld's ecological collapse. After mastering the basics of the Rift, we can interfere with it to achieve the desired effect."
belobog_blocker_1_situation_triggered_desc.2:0 "Since the Stellaron was sealed, the Rift has been slowly receding. But we have decided to leave the homeworld, so we only need to control the Rift enough to not affect our evacuation."
belobog_blocker_1_stage_1:0 "Rift Spreading Widely"
belobog_blocker_1_stage_1_desc:0 "The Rift is spreading widely; its growth rate is faster than we expected."
belobog_blocker_1_stage_1_tooltip:0 "We must exit this state as soon as possible."
belobog_blocker_1_stage_2:0 "Rift Spreading"
belobog_blocker_1_stage_2_desc:0 "The Rift should naturally recede, but for some reason, it is still growing."
belobog_blocker_1_stage_2_tooltip:0 "We need stronger measures."
belobog_blocker_1_stage_3:0 "Preliminary Rift Control"
belobog_blocker_1_stage_3_desc:0 "We can now slightly influence the Rift, accelerating its retreat."
belobog_blocker_1_stage_3_tooltip:0 "Take action to prevent deterioration."
belobog_blocker_1_stage_4:0 "Basic Rift Control"
belobog_blocker_1_stage_4_desc:0 "The Rift is now under our control. We need not worry about it affecting us again."
belobog_blocker_1_stage_4_tooltip:0 "We can wait patiently for the situation to develop."
belobog_blocker_1_stage_5:0 "Rift Nearly Gone"
belobog_blocker_1_stage_5_desc:0 "There is little sign of the Rift in our active areas now."
belobog_blocker_1_stage_5_tooltip:0 "Soon, there will be no new Rifts except for already formed stubborn areas."
belobog_blocker_1_approach_1:0 "Rift Power Generation"
belobog_blocker_1_approach_1_desc:0 "This is absurd, isn't it? Hopefully this will salvage our poor economy.\nBefore the Rift affects people's lives again, we'd better stop... otherwise the consequences could be dire."
belobog_blocker_1_approach_2:0 "Turn a Blind Eye"
belobog_blocker_1_approach_2_desc:0 "Well, we don't have a good solution."
belobog_blocker_1_approach_3:0 "Active Cleanup"
belobog_blocker_1_approach_3_desc:0 "Deploy troops and dedicated teams, using advanced technology to keep the Rift under control as much as possible."
belobog_blocker_1_approach_4:0 "Thorough Cleanup"
belobog_blocker_1_approach_4_desc:0 "The latest technology and survey data allow our ground and space forces to coordinate, greatly improving control over the Rift."
belobog_get_help:0 "Alien Aid"
