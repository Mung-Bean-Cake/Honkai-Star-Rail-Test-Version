auth_herta_level_up_desc:"Continuously pursue technological progress, prioritizing resources for R&D and technology transfer. Galactic scholars provide technical guidance and R&D."
origin_Herta_Space_Station:0 "Space Station「Herta」"
origin_Herta_Space_Station_desc:0 "Herta of the Genius Society was not satisfied with the laws of ordinary worlds. She turned her gaze to the unsolved mysteries of the galaxy, expecting those distant enigmas to satisfy her curiosity. To this end, Herta established a museum-style interstellar ship and launched it into planetary orbit, beginning research work on "sealing all anomalies in the starry sky". The renowned Herta Space Station was thus born. To this day, the station possesses countless curio "collections", making it a veritable museum of the stars. Numerous researchers have settled aboard, continuously collecting relics and curios from across the galaxy, recording their forms and functions, establishing systematic observation and research methods... ultimately finding ever more perplexing puzzles. This was Herta's original purpose. The numerous "collections" often attract envious glances, with various factions lurking in the shadows. Thanks to Herta's power, the station rarely faces real crises, and collection and research work proceeds in an orderly manner."
origin_tooltip_Herta_Space_Station_effects:0 "$TABBED_NEW_LINE$—Initially possesses most mechanical and biological technologies$TABBED_NEW_LINE$—More initial population$TABBED_NEW_LINE$—Additional colony: Herta Space Station$TABBED_NEW_LINE$—Starting leaders receive certain bonuses\n§MThe Rift Reminiscence event provides double rewards, and some Stellaron reward events provide extra bonuses§!"
councilor_ruler_herta:0 "Chairperson"
councilor_ruler_herta_desc:0 "The highest leader coordinating all affairs."
civic_herta_1:0 "Curio Master"
civic_herta_1_desc:0 "The Space Station「Herta」was originally built to collect and exhibit curios, and it has always been dedicated to collecting curios from all over the galaxy, satisfying people's curiosity."
civic_herta_1_effect:0 "Scientist leaders start with the trait ['concept_leader_herta_common', $leader_herta_common$], and the building ['building:herta_holomuseum_1'] provides double the positions."
civic_herta_2:0 "Simulated Universe System"
civic_herta_2_desc:0 "The Space Station「Herta」is equipped with the Simulated Universe system developed by Herta, Ruan Mei, Screwllum, and Stephen Lloyd. Although we cannot understand the geniuses' masterpieces, their shared technology can greatly strengthen our capabilities."
civic_herta_2_effect:0 "Unlock additional starbase buildings$TABBED_NEW_LINE$['starbase_building:space_energy_core_t3']$TABBED_NEW_LINE$['starbase_building:space_rare_resource_t2']$TABBED_NEW_LINE$['starbase_building:space_anchorage_t1']\nAdditional starbase modules$TABBED_NEW_LINE$['starbase_module:space_mining_station_t3']$TABBED_NEW_LINE$['starbase_module:space_science_station_t3']$TABBED_NEW_LINE$['starbase_module:space_alloys_construction_t3']"
