DOT_SR_Dvalin.010.name:"Gift of the Reignbow Arbiter: Xianzhou "Cangcheng""
DOT_SR_Dvalin.010.desc:"Xianzhou "Cangcheng" was one of the nine original flagships of the Xianzhou Alliance, once renowned as the most prosperous of the nine. Cangcheng was known for its flourishing literary culture, with famed academies nurturing a rich humanistic tradition; its native Cangcheng plum was a signature plant, and remedies like the Shidu Shengma decoction from the "Cangcheng Fangji" are still used within the Alliance. In Star Calendar 6300, the activated planet "Devourer Luocha" arrived with the Abundance Emanator Shuhu. Despite reinforcements led by General Tengxiao, Cangcheng fell and was devoured by Luocha. Those blessed by Abundance's immortality could not die, their consciousness and flesh merging with the living planet, trapped in eternal suffering. Now, I gift you this restored Xianzhou "Cangcheng" – may you ride this ship, command the wind, and sail across ten thousand miles of stars!"
DOT_SR_Dvalin.010.a:"Alright"
DOT_SR_Dvalin.010.b: "Thank you"
