#Other stuff
Gov_IPC0:0"Galactic Preservation Group"
Gov_IPC0_desc:0"This megacorporation aims to preserve the entire galaxy, and strives tirelessly toward that goal."
IPC_Normal_Leader:0"Lifetime Director"
IPC_Normal_Leader_Female:0"Lifetime Director"
Gov_IPC_Idol:1"Idol Training Corporation"
Gov_IPC_Idol_desc:1"This megacorporation makes money by cultivating idols and developing idol culture, and invests those funds into the cause of preserving the entire galaxy. Idols and idol culture appear in every aspect of their lives, and idols may even serve as leaders."
IPC_Idol_Leader:0"Producer"
IPC_Idol_Leader_Female:0"Supreme Idol"
#IPC_Normal_Leader:0"Producer"
#IPC_Normal_Leader_Female:0"Supreme Idol"
Gov_IPC_Idol_Dark:0"Idol Abyss"
Gov_IPC_Idol_Dark_desc:0"This megacorporation has been taken over by a group of idols who have stepped into darkness. They have decided to run this vast commercial empire from the shadows, stopping at nothing to continue this civilization's unswerving Path of "Preservation". Perhaps this is because the entire corporation deeply loves the supreme idol — the Aeon Qlipoth."
IPC_Idol_Leader_Dark:0"Dark Idol"
IPC_Idol_Leader_Female_Dark:0"Flower of the Abyss"
Gov_IPC_Idol_Light:0"Dream Preservation Organization"
Gov_IPC_Idol_Light_desc:0"This megacorporation has gone all the way down the road of idol training, reaching today's state. From top to bottom, inside and out, idols and idol culture fill the entire corporation, and even its leaders have become idols in every sense.\nSuch a corporation still resolves to practice the Path of "Preservation" — starting with preserving the dreams of all fans. Perhaps one day, the Interastral Peace Corporation as a whole will become an "idol", with countless fans wherever the hyperlanes reach."
IPC_Idol_Leader_Light:0"Galactic Beacon"
IPC_Idol_Leader_Female_Light:0"Stellar Light"
Gov_IPC_ST_Mild:0"Peaceful Preservation Organization"
Gov_IPC_ST_Mild_desc:0"This megacorporation is dedicated to providing ultimate stability maintenance services to all civilizations, while increasing the happiness of all clients. In their view, this is like a loving mother gently rocking a cradle, giving the child a comfortable environment to grow. This is how they practice the Path of "Preservation"."
IPC_ST_Leader:0"Eldest Son"
IPC_ST_Leader_Female:0"Tender Mother"
Gov_IPC_ST_Quick:0"Galactic Stability Guardian"
Gov_IPC_ST_Quick_desc:0"This megacorporation keenly perceives the great threat approaching the galaxy, and is determined to maintain the stability of all friendly civilizations to allow them to develop rapidly, using the approach of increasing the galaxy's overall strength to "Preserve" the entire galaxy from the terrible crisis. For the "Preservation" of the majority, nothing is beyond sacrifice."
#anomaly
planet_broken_category:0"Shoot Star"
planet_broken_category_desc:0"We have found traces of life on this planet whose surface is covered in lava. Perhaps it was once a life-bearing world."
rukaanomoly.001.name:0"Shoot Star"
rukaanomoly.001.desc:0"After long-term survey and research, our science ship has concluded a startling finding: this place was indeed once a habitable world, but it was struck by some immensely powerful destructive force that wrecked the planet's structure and destroyed its biosphere. To this day, its surface is covered by vast lava seas, and our research indicates that this destructive force appears to be a massively huge, high-kinetic-energy... arrow?\nWhatever its past, various minerals now emerge from its interior in molten form, making mining much easier; meanwhile, our scientists have also become interested in researching the process of change on this planet."
IPC.001.a:0"Approve the construction of a research station."
IPC.001.b:0"An excellent mining site."
IPC.001.c:0"This must be a divine miracle of the Reignbow Arbiter hunting Abominations of Abundance!"
IPC.001.e:0"As long as we invent a tragic story for the beings that once lived here, we can trick a bunch of people into spending a fortune on tourism..."
#event
IPC.002.name:0"A New Understanding of the Stability Protocol"
IPC.002.desc:0""
IPC.004.name:0"The Great Prosperity of Idol Culture"
IPC.004.desc:0""
#origin
origin_IPC_Default:0"Interstellar Peace"
origin_IPC_Default_desc:0"In the distant past, a civilization that had fallen into nihilism witnessed the power of the Aeon of Preservation before stepping into the stars, and decided to find its meaning in the Path of Preservation — this is the origin of the corporation. Though Qlipoth never answered their calls, they remained determined to devote themselves to this great cause.\nNow, with the efforts of the corporation's greatest scientists, they have finally found a path to the brilliant stars, and the story begins here.§!"
#。Ahead lies endless darkness or eternal light? Regardless, for "Preservation", the corporation must advance.\n\n§RTo the stars and the abyss!
origin_tooltip_origin_IPC_Default_effects:0"This origin serves to inform players that the Interastral Peace Corporation has content. Even without it, IPC-related content can still be used."

#tradable_action
trade_action_Trade_More:0"Lease Angel-Type Debt Issuance Machine"
trade_action_Trade_More_desc:0"The Interastral Peace Corporation provides wealth appreciation services to any potential client! As long as you are willing to pay a small amount of resources, the road to wealth will be unimpeded!"
trade_action_Idol_Show:0"Idol Performance Service"
trade_action_Idol_Show_desc:0"National happiness, social stability, national vitality — all within reach! Even livestock populations will be moved by this ultimate idol performance, now on the market! Purchase now and receive alien idol tentacle shaking service!"
trade_action_Stability_Keep:0"Stability Maintenance Service"
trade_action_Stability_Keep_desc:0"Choose Interstellar Peace for stability maintenance! Enforcers delivered one by one, recognized by the Interstellar Peace trademark!"
trade_action_Military_Training:0"Commercial Military Training"
trade_action_Military_Training_desc:0"Interstellar Peace, providing services for peace!"
trade_action_VIP_Ship_Treat:0"VIP Fleet Service"
trade_action_VIP_Ship_Treat_desc:0"Our corporation has special fleet maintenance techniques; we will care for your fleet as gently as a lover!"
trade_action_Charity_Treat:0"Interstellar Charity Aid"
trade_action_Charity_Treat_desc:0"We have a unique understanding of charity, so this aid is generally charged."
trade_action_Faster_Growth:0"Growth Promotion Agreement"
trade_action_Faster_Growth_desc:0"The corporation is only responsible for product supply, not post-maintenance."
trade_action_Live_Better:0"Environmental Improvement Package"
trade_action_Live_Better_desc:0"The Interastral Peace Corporation has a dream: that one day, toxic populations and aquatic species can sit together and learn the Path of Preservation."
trade_action_Worker_Better:0"Human Resource Management"
trade_action_Worker_Better_desc:0"Believing that "hard work" leads to "climbing the ladder" is the fundamental logic of social operation. Earning money with strength gives peace of mind, which is the life philosophy of countless ordinary beings.\nHave you ever faced such troubles? Those lazy people who refuse to "work hard" fail to "climb the ladder"; those who didn't use enough strength and thus didn't earn enough money, do they often blame you? Perhaps you need a little help from our company."
trade_action_Slave_Better:0"Asset Management Package"
trade_action_Slave_Better_desc:0"Assets need to be mobilized to create value — we all know that. But some of your assets may not want to move — that's when you need our service."
trade_action_Control_Better:0"Empire Management Package"
trade_action_Control_Better_desc:0"Only 19.9 influence for 25% size reduction!"
trade_action_Equal_Better:0"Spread Egalitarian Thought"
trade_action_Equal_Better_desc:0"Toward the highest good."
trade_action_Migrate_Better:0"Lower Immigration Requirements"
trade_action_Migrate_Better_desc:0"The corporation welcomes you!"
trade_action_Research_Better:0"Technology Research Assistance"
trade_action_Research_Better_desc:0"Better-than-Curators value pack!"
trade_action_Study_Better:0"Science Popularization Access"
trade_action_Study_Better_desc:0"Designed for the galaxy's vast illiterate population."
trade_action_KLB_Better:0"Missionary Activity Permit"
trade_action_KLB_Better_desc:0"Spread Qlipoth's grace to clients."
trade_action_IPC_Better:0"Non-Aggression Protocol"
trade_action_IPC_Better_desc:0"We will "Preserve" you."
trade_action_Build_Better:0"Builder Protocol"
trade_action_Build_Better_desc:0"Skyscrapers rise overnight, Rome built in a day."

#modifier
country_modifier_Trade_Service:0"Angel-Type Debt Issuance Machine"
country_modifier_Trade_Service_desc:0"Interstellar Peace Corporation at your service!"
country_modifier_Idol_Service:0"Galactic Idol Performance Service"
country_modifier_Idol_Service_desc:0"Unprecedented existence, reincarnated morning star!\nJust transmit love through optical signals, and any race will be captivated!"
country_modifier_Stable_Service:0"Interstellar Peace Corporation Stability Service"
country_modifier_Stable_Service_desc:0"Please — pay attention, Expert-class scientist Ziming · Li, opposition leader Ziming · Li, your government has ordered double the amount of Interstellar Peace stability service, just "for" you!\n"Wow, your government loves you so much!""
country_modifier_Service_Training:0"Purchased Military Training Service"
country_modifier_Service_Training_desc:0"Too quiet, can't hear! In the corporation's training camp, if the instructor says can't hear, then you can't hear!"
country_modifier_Service_ShipUpkeep:0"Commercial Fleet Maintenance Service"
country_modifier_Service_ShipUpkeep_desc:0"Corvette, I'm coming in!"
country_modifier_Service_PeopleUpkeep:0"Capitalist Aid Service"
country_modifier_Service_PeopleUpkeep_desc:0"This is a special service, aimed at keeping you alive."
country_modifier_Service_PopGrow:0"Population Growth Promotion Service"
country_modifier_Service_PopGrow_desc:0"Hmm? Eh... uh, ah—ah!"
country_modifier_Service_Tolerance:0"Habitable Home Plan"
country_modifier_Service_Tolerance_desc:0"Providing habitable services for countless galactic species is difficult — but we did it."
