col_capital_hsr_herta_desc:"Specialized in automated industrial planning."
col_capital_hsr_herta_tt:"Industries autonomously optimize, highly intelligent."
d_herta_1:0 "Containment Section"
d_herta_1_desc:0 "Storage chambers for curios. The central atrium features a giant circular corridor, connecting the collections of various departments at different levels."
d_herta_2:0 "Support Section"
d_herta_2_desc:0 "The logistics core of the station, storing various materials, managing the energy core, and equipped with a complete docking platform system — a key node for station operation and maintenance."
d_herta_3:"Imaginary Energy District"
d_herta_3_desc:"A special energy district created by concentrating and sealing the residual Antimatter Legion corruption on the station. After special treatment, it only serves to generate electricity."
d_herta_debuff:"Rift Erosion"
d_herta_debuff_desc:"Residual effects from the Antimatter Legion's attack on the Herta Space Station. They sustain themselves by eroding the station's energy system."
d_herta_debuff_remove:"We still need to further research the treatment plan."
sm_space_energy_core_t3:0 "Galactic Energy Relay Beacon"
sm_space_energy_core_t3_desc:0 "After Asta upgraded the system with new rare gas RGB lighting, its efficiency saw a leap forward."
sm_space_rare_resource_t2:0 "Interstellar Rare Resource Synthesis Station"
sm_space_rare_resource_t2_desc:0 "A facility that synthesizes large quantities of rare resources for the station, to meet its massive demand for rare resources."
sm_space_anchorage_t1:0 "Herta Space Station Spaceport"
sm_space_anchorage_t1_desc:0 "A huge port that normally recovers ships, materials, and experimental equipment from various systems, and can also dock a large number of ships during special periods."
sm_space_mining_station_t3:0 "Interstellar Mineral Synthesis Center"
sm_space_mining_station_t3_desc:0 "Responsible for mineral collection."
sm_space_science_station_t3:0 "Information Simulation Center"
sm_space_science_station_t3_desc:0 "A special laboratory dedicated to research teams with special experimental needs."
sm_space_alloys_construction_t3:0 "Simulated Alloy Internal Recombination"
sm_space_alloys_construction_t3_desc:0 "With Herta's internal recombination facility, all required alloys can be reused here."
sm_arkship_hsr_base_hub:"Basic Resource Dispatch Center"
sm_arkship_hsr_base_hub_desc:"Supercomputers coordinate the allocation and use of resources."
sm_arkship_hsr_advanced_hub:"Industrial Processing Center"
sm_arkship_hsr_advanced_hub_desc:"Assembly-line industrial production center, responsible for part of the Ark's industrial plans."
sm_arkship_hsr_unity_hub:"Unity Center"
sm_arkship_hsr_unity_hub_desc:"Government and trade center."
sm_arkship_hsr_shield_generator:"Maintenance Center"
sm_arkship_hsr_shield_generator_desc:"Dispatch center responsible for Ark maintenance, also participating in basic construction."
sm_arkship_hsr_hull_shield:"Basic Hull, Armor, Shield Module"
sm_arkship_hsr_hull_shield_desc:"Basic hull, armor, and shield modules for Ark ships."
sm_arkship_hsr_quantum_destabilizer: "$SHIP_AURA_QUANTUM_DESTABILIZER$"
sm_arkship_hsr_quantum_destabilizer_desc: "The Ark ship's mass allows it to project a force field that disrupts nearby enemy weapon systems, reducing their fire rate."
sm_arkship_hsr_subspace_snare: "$SHIP_AURA_SUBSPACE_SNARE$"
sm_arkship_hsr_subspace_snare_desc: "A subspace anchor field projected by the Ark ship, preventing enemy ships from escaping via FTL."
sm_arkship_hsr_shield_dampener: "$SHIP_AURA_SHIELD_DAMPENER$"
sm_arkship_hsr_shield_dampener_desc: "Interference emitters installed across the hull suppress enemy shields, limiting their maximum protection."
sm_arkship_hsr_aura_strike_craft_desc: "The Ark ship broadcasts flight coordination signals, enhancing nearby friendly strike craft combat capabilities."
sm_arkship_hsr_aura_hyperlane: "$SHIP_AURA_HYPERLANE$"
sm_arkship_hsr_aura_hyperlane_desc: "The navigation beacon projected by the Ark ship improves the hyperspace engine calculations of all ships in the fleet."
sm_arkship_hsr_aura_pd_penetration: "$SHIP_AURA_PD_PENETRATION$"
sm_arkship_hsr_aura_pd_penetration_desc: "Electronic countermeasure broadcasts from the Ark ship disrupt enemy point-defense targeting, allowing our weapons to break through interception."
sm_arkship_hsr_aura_bombardment: "$SHIP_AURA_BOMBARDMENT$"
sm_arkship_hsr_aura_bombardment_desc: "Fire control relays deployed by the Ark ship improve the entire fleet's orbital bombardment accuracy."
sm_arkship_hsr_aura_range: "$SHIP_AURA_RANGE$"
sm_arkship_hsr_aura_range_desc: "Shared targeting data from the Ark ship array extends the effective engagement range of each ship in the fleet."
