pc_xianzhou:0 "Xianzhou"
pc_xianzhou_desc:0 "Eternal enmity, shared suffering through ten thousand calamities. Among the vast boundless waters of longevity, take but a single cup and never drain it dry."
pc_xianzhou_world:0 "Xianzhou Ship"
pc_xianzhou_world_desc:0 "Build Xianzhou ships in the universe, explore the universe against entropy."

origin_Xianzhou:0 "Xianzhou Alliance"
origin_Xianzhou_desc:0 "§R[To be reworked]§!\nIn ancient mythical times, several Xianzhou ships were ordered to set sail across the sea of stars in search of the elixir of immortality. They spent long years, wearing down their bodies and wills, until finally they received the blessing of Yaoshi. However, the fruit of immortality brought only desolation and suffering. It was not until the Hunt Aeon Lan returned from the abyss, using gravity as His bowstring and a star-arrow to sever the Ambrosial Arbor, that the curse of "Abundance" was broken. After the Xianzhou left their lost path, guided by the "Hunt", they formed an alliance and organized the mighty Cloud Knights. The Alliance took Abominations of Abundance as their target, tasked with eradicating the contamination of immortality, roaming the boundless star fields. Over the long ages, the "Xianzhou Alliance" has landed on countless worlds once touched by gods, annihilating all Abominations of Abundance. Any star-race seeking the favor of Abundance must consider the Xianzhou's planet-shattering threat. This is precisely the deterrent the "Xianzhou Alliance" seeks — to become a constant alarm, a price that all who covet immortality cannot afford. To this day, all who gather on the Xianzhou do so to take revenge against the reckless "Abundance" and to fully carry out the "Hunt's will". Therefore, as long as the calamity of immortality remains, the starry cruise will never cease."
origin_tooltip_Xianzhou_effects:0 "Eternal enmity, shared suffering through ten thousand calamities. Among the vast boundless waters of longevity, take but a single cup and never drain it dry."
