#Misha
NAME_misha:"Misha"
misha_catch_phrase:""Life is a winding labyrinth; apart from memory, we have nothing.""
misha_backstory:"A well-behaved and sensible bellhop at the "Dreamscape Hotel", dreaming of becoming a galactic adventurer like his grandfather. He works very hard, especially skilled at repairing all kinds of machinery, and is passionate about the interstellar stories shared by hotel guests. He hopes to grow up quickly and looks forward to the day when he can embark on a journey to explore the stars."
hsr_paragon.38.name:"Penacony - Misha"
hsr_paragon.38.a:"First Meeting"
hsr_paragon.38.a.response:"I'm Misha, the bellhop at the "Dreamscape Hotel". Welcome to Penacony, this way please, let me carry your luggage!"
hsr_paragon.38.b:"Hobbies"
hsr_paragon.38.b.response:"I read every issue of Galactic Geographic... especially the latest one, that big whale that can devour planets, it's really amazing! I wonder when I'll see the next issue..."
hsr_paragon.38.c:"Observations"
hsr_paragon.38.c.response:"I often hear that "Trailblaze" means venturing into a new frontier. Penacony has also experienced a similar history — the deliciousness of SoulGlad, the performances of the Dreamjolt Troupe, all achieved through repeated "Trailblazing"... it's really not easy..."
leader_misha_t1:"§MWarp§!"
leader_misha_t1_desc:"Trailblazer, did you rest well? If you want to go anywhere, feel free to find me!"
leader_misha_t2:"§MRoom... Room service!§!"
leader_misha_t2_desc:"I love working at the "Dreamscape Hotel"! Here I can meet so many travelers from afar and hear so many adventure stories... it's wonderful..."
leader_misha_t3:"§MShadows of Happy Times§!"
leader_misha_t3_desc:"Misha must work hard, save up enough money, and someday travel and explore the stars like adults do!"
leader_misha_t4:"§MFirst Love and Friendship§!"
leader_misha_t4_desc:"All work done, time to rest well."
leader_misha_t5:"§MPromise Remembered in the Heart§!"
leader_misha_t5_desc:"Working at the "Dreamscape Hotel" is busy, but it's because of this job that I got to meet friends like you, Trailblazer!"
