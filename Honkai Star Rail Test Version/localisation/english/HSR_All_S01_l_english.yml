mega_HM_CRISIS_TTZPC: "Crucible of War"
mega_HM_CRISIS_TTZPC_DESC: "Once, the Fire Forgers were imprisoned and had their legs broken for their unparalleled forging skills. The Destruction Aeon freed them and granted them inexhaustible power. To repay His kindness, they used the Crucible of War to forge weapons for Him. However, over time, the Crucible has long since ceased to distinguish between craftsman and material; the Fire Forger masters who temper antimatter beings have themselves become part of the weapons of Destruction."
