#Arlan
NAME_alan:"Arlan"
alan_catch_phrase:""Getting hurt to protect everyone is something to be proud of.""
alan_backstory:"The taciturn head of the Security Department at the Space Station「Herta」. Though he doesn't understand research, he is willing to risk his life to protect the station's researchers who value their studies. He is accustomed to pain and regards wounds as medals. Only when holding Peppy does the boy let down his guard and reveal a rare smile."
hsr_paragon.4.name:"Space Station「Herta」- Arlan"
hsr_paragon.4.a:"First Meeting"
hsr_paragon.4.a.response:"Hello, Trailblazer. I'm Arlan, head of the Security Department at the Space Station「Herta」. During your stay, I will ensure your safety."
hsr_paragon.4.b:"Hobbies"
hsr_paragon.4.b.response:"The greatsword must be kept clean at all times."
hsr_paragon.4.c:"Observations"
hsr_paragon.4.c.response:"I heard from the researchers that some curios actually chose to come to the station on their own."
leader_alan_t1:"§MSeal Release§!"
leader_alan_t1_desc:"I'll grant your wish."
leader_alan_t2:"§MMadman's Sanction§!"
leader_alan_t2_desc:"And you will suffer a thousandfold!\n$leader_alan_t2_effect_desc$"
leader_alan_t2_effect_desc:"§BEach effective level provides 1% Shield, Armor, and Hull.\nUpon entering space combat, sacrifice §R20%§! of own hull to gain a large damage boost and recovery effect for §R20§! days, cooldown §R60§! days§!"
leader_alan_t3:"§MUtmost Pain, Utmost Fury§!"
leader_alan_t3_desc:"Everyone shut up.\n$leader_alan_t3_effect_desc$"
leader_alan_t3_effect_desc:"§BUpon entering space combat, additionally deal massive shield damage and 20% hull damage to enemy fleets§!"
leader_alan_t4:"§MRapid Harvest§!"
leader_alan_t4_desc:"What a nuisance."
leader_alan_t5:"§MLike Thunder§!"
leader_alan_t5_desc:"Only battle brings victory."
concept_leader_alan_t1:"$leader_alan_t1$"
