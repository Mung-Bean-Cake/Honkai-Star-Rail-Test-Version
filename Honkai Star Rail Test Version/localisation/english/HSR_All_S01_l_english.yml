# Events
DOT_SR_Dvalin.001.name:"Stormterror"
DOT_SR_Dvalin.001.desc:"My name is Dvalin, from a lost plane, which the beings of my homeland call Teyvat. I was one of the "Four Winds" of Mondstadt in Teyvat, guarding the people according to the old covenant. Therefore, I was called the Dragon of the East Wind. However, with the arrival of disaster, everything came to an end. Who knew that in Mondstadt's vast and beautiful land, flowers bloom all year round, and trees remain green in all seasons. Fine tea, colorful gourds, seasonal flowers. Warm hills and swallows nest, people idle by the northern waters, spring has no price."
DOT_SR_Dvalin.001.a:"Welcome, Dvalin"
DOT_SR_Dvalin.001.b:"You are not welcome here"
 
DOT_SR_Dvalin.002.name:"Stormterror"
DOT_SR_Dvalin.002.desc:"In the long years and boundless darkness, clear gems will be tarnished and grow dim, and proud dragons will be eroded and filled with resentment. However, remember that dust can be easily wiped away, and doubts and poisons can also be shattered. This is the advice of a friend of mine, although I always thought he was idle and not a wise man. But without his help, there would be no me today. He once wrote a poem: Fly freely in the deep sky. Just like when we first met, I walked on the earth singing songs of the wind; you looked down upon the world from the rarefied sky above. Now there is no wind and snow in the sky, and the earth is full of green grass. It must be beautiful. If you had walked on the ground, heard the distant songs of shepherds and wind chimes, tasted wine as sweet as honey, you would understand. If you had been me, and seen your solitary figure gliding across the blue sky, and witnessed your beauty, you would understand. Then you would know that such a sky and earth are worth fighting for. However, all of this is gone, and he is no longer here."
DOT_SR_Dvalin.002.a:"Alright"
DOT_SR_Dvalin.002.b:"Goodbye"
 
DOT_SR_Dvalin.003.name:"Stormterror"
DOT_SR_Dvalin.003.desc:"My friend, I know you are curious about my past. I think I should also tell you the story of Teyvat and Mondstadt, so that the universe will not forget this lost history. "Relive the ancient tales, the poet sings." "When the gods dwelt among men, how many autumns passed." The poet finished the story of the ruins and of Vennessa, and then began to tell the story of the Wind Dragon. He recited: "My story comes from ancient times, when the gods still walked the earth." At that time, about five thousand years ago, a dragon bearing the wind element was born in the high heavens. It descended slowly, full of curiosity about the world. It landed in a village, but was pelted with stones by frightened people. The dragon could not understand the words spoken in fear. It landed in a cemetery, only to hear the endless sighs of grieving people. The dragon could not understand the words spoken in sorrow. It landed in an orchard, but was cursed by angry people who had lost their fruit trees. The dragon could not understand the words spoken in anger. The human world was too complicated. The dragon was puzzled, but still wanted to try. Until one day, the dragon heard the sound of the Skyward Harp. "Sky" was the name of the lyre, and also the companion of the God of Wind. The dragon was drawn to the poetry and landed beside the best singer beneath the sky. People began to panic, because powerful elemental dragons and the great gods who ruled the world had never been able to get along. "Look, how beautiful and gentle it is," said the Wind Singer. "But we don't know what it's thinking," said the people. The melody and poetry attracted both the dragon and the people — what kind of magic was this? The dragon decided to stay by the singer's side, because it too wanted all things to understand its heart. It learned human speech and the Wind Singer's techniques. The "Wolf" of the Knight of Boreas, the "Lion" of the Knight of蒲公英, the "Eagle" of the Knights of Favonius, and Dvalin — the "Wind Dragon" — were thus regarded as Mondstadt's "Four Winds"."
DOT_SR_Dvalin.003.a:"Alright"
DOT_SR_Dvalin.003.b:"Goodbye"
 
DOT_SR_Dvalin.004.name:"Stormterror"
DOT_SR_Dvalin.004.desc:"My friend, I know you are curious about my past. I think I should also tell you the story of Teyvat and Mondstadt, so that the universe will not forget this lost history. "Relive the ancient tales, the poet sings." "When the gods dwelt among men, how many autumns passed." The poet finished the story of the ruins and of Vennessa, and then began to tell the story of the Wind Dragon. He recited: "My story comes from ancient times, when the gods still walked the earth." At that time, about five thousand years ago, a dragon bearing the wind element was born in the high heavens. It descended slowly, full of curiosity about the world. It landed in a village, but was pelted with stones by frightened people. The dragon could not understand the words spoken in fear. It landed in a cemetery, only to hear the endless sighs of grieving people. The dragon could not understand the words spoken in sorrow. It landed in an orchard, but was cursed by angry people who had lost their fruit trees. The dragon could not understand the words spoken in anger. The human world was too complicated. The dragon was puzzled, but still wanted to try. Until one day, the dragon heard the sound of the Skyward Harp. "Sky" was the name of the lyre, and also the companion of the God of Wind. The dragon was drawn to the poetry and landed beside the best singer beneath the sky. People began to panic, because powerful elemental dragons and the great gods who ruled the world had never been able to get along. "Look, how beautiful and gentle it is," said the Wind Singer. "But we don't know what it's thinking," said the people. The melody and poetry attracted both the dragon and the people — what kind of magic was this? The dragon decided to stay by the singer's side, because it too wanted all things to understand its heart. It learned human speech and the Wind Singer's techniques. The "Wolf" of the Knight of Boreas, the "Lion" of the Knight of蒲公英, the "Eagle" of the Knights of Favonius, and Dvalin — the "Wind Dragon" — were thus regarded as Mondstadt's "Four Winds"."
DOT_SR_Dvalin.004.a:"Alright"
DOT_SR_Dvalin.004.b:"Goodbye"
 
DOT_SR_Dvalin.005.name:"Stormterror"
DOT_SR_Dvalin.005.desc:""The black sun set over the ancient kingdom, the pearl lost its luster, gold lost its color, white silk stained with yellow." That is another story from the underground fallen kingdom of Khaenri'ah. About three thousand years ago, the entire continent experienced an age of chaos. The dark power spread and contaminated everything it encountered. During that time, monsters bred and beasts rampaged across the land. People's living space was compressed within city walls, and the wilderness was full of danger. That period was especially hard for Mondstadt. The lineage of the Lion Tooth Knight was vacant due to no qualified heir, and the Knights of Favonius suffered losses and dwindling talents. At that time, the Black Sun Dynasty fell, and the disaster broke through the ancient city walls and spread across the continent. The alchemist known as "Gold" fell into sin and gave birth to countless dark beasts. The great black serpent — the evil dragon "Durin" — rose from the sea, its shadow looming over Mondstadt. But at that time, the lineage of the Lion Tooth Knight was empty, and the eagle flag of the Knights of Favonius could not fly against the wind. The endless lamentation finally summoned Mondstadt's god — the Wind Singer. The prayers of the people awakened the will of the Anemo Archon, the Skyward Harp was strummed again, and the Wind Dragon was called forth once more. Now only the Wind Dragon could be relied upon. The evil dragon and the Wind Dragon engaged in a mortal battle in the storm. The Wind Dragon prevailed, biting the evil dragon's throat, but swallowed its poisonous blood. The venomous blood of Durin was the distorted gold, the power that makes mountains collapse and the earth crumble. The Wind Dragon protected Mondstadt, thinking that this would make people understand it. So it fell into a deep slumber. The Skyward Harp played a mournful tune. The Skyward Harp said, when you wake next time, you should be free. The dragon that was meant to fly freely in the high heavens, all things will eventually understand your beauty."
DOT_SR_Dvalin.005.a:"Alright"
DOT_SR_Dvalin.005.b:"Goodbye"

DOT_SR_Dvalin.006.name:"Stormterror"
DOT_SR_Dvalin.006.desc:"However, things did not go as wished. Durin's corpse was embedded in the snow and ice, and Dvalin was recalled by the Anemo Archon to sleep. People once believed that the Wind Dragon would awaken when needed to protect Mondstadt. But in times of peace, the faith of the Four Winds was lost, and their temples fell into ruin. Five hundred years later, Dvalin, under the influence of poisonous blood and Abyss Mages, fell and degenerated. When it awoke again, it did not hear the music of its friend, but the whispers of the Abyss Mages. It cursed its host for not being by its side at the most critical moment. Dvalin gradually became a demon dragon rather than the Wind Dragon it once was. It even fell to the point of being besieged by the Knights. When the world finally discovered that the strange beast "Stormterror" that had fought the Knights several times was actually Dvalin of the Four Winds, a hatred-driven confrontation had already formed and could not be reconciled. After awakening from a hundred years of slumber, it could only feel the betrayal of this city. Fortunately, with the help of a traveler from a foreign land, Dvalin was saved. The wind direction will change. One day, it will blow toward a brighter direction. Ah, everything is so beautiful."
DOT_SR_Dvalin.006.a:"Alright"
DOT_SR_Dvalin.006.b:"Goodbye"

DOT_SR_Dvalin.007.name:"Stormterror"
DOT_SR_Dvalin.007.desc:"The disaster came on a night two thousand years ago, when the sky suddenly broke, giant ships crossed the sky, thunder pierced the earth veins, dimensions collapsed, islands fell, gods were hunted, and people died in fire. I stood between heaven and earth, saw civilization destroyed in an instant, my family and friends gone, and I had to flee alone into the void. A thousand years later, I learned that the culprit of that disaster was called: The Stellaron Hunters! Who knew that in Mondstadt's vast and beautiful land, flowers bloom all year round, and trees remain green in all seasons. Fine tea, colorful gourds, seasonal flowers. Warm hills and cold mountains, swallows nest, people idle by the northern waters, spring has no price."
DOT_SR_Dvalin.007.a:"We hope you will join our civilization, and we are willing to help you take revenge!"
DOT_SR_Dvalin.007.b:"The story is over, goodbye, my friend!"
 
DOT_SR_Dvalin.008.name:"Stormterror"
DOT_SR_Dvalin.008.desc:"It is said that in the Xianzhou Alliance, the Vidyadhara have five great Dragon Lords who protect the common people: the Azure Dragon Lord of Yaoqing, who controls wind and thunder, guarding the Moon of Gestation, titled "Skywind Lord"; the Vermilion Dragon Lord of Zhuming, who wields heavenly fire, guarding the Primal Sunblaze, titled "Flamecourt Lord"; the Azure Dragon Lord of Fanghu, who commands ice and waves, guarding the Misty Sea, titled "Frigid Abyss Lord"; the Azure Dragon Lord of Yuque, who meditates in silence, guarding the Earthen Soil, titled "Kunlun Lord"; and the Azure Dragon Lord of Luofu, who commands clouds and rain, guarding the Immortal Arbor, titled "Imbibitor Lunae". And now, Dvalin is the sixth Dragon Lord, wielding the wind, tearing thunder and lightning, guarding the verdant sky, titled "Whistling Wind Lord"."
DOT_SR_Dvalin.008.a:"Alright"
DOT_SR_Dvalin.008.b: "Goodbye"


DOT_SR_Dvalin.009.name:"Gift of the Reignbow Arbiter: Xianzhou "Daiyu""
DOT_SR_Dvalin.009.desc:"Xianzhou "Daiyu": During the era of solitary voyage, this Xianzhou detonated in battle against the Stepwraiths. When the Daiyu was shattered beyond repair, its leader Qingzhu made the decisive choice to use a magnificent sacrifice to end the contamination of the Plague of Longevity. The broken ship crashed into the abyssal world of Thalassa's Izumo region, enlightening the civilization of Izumo. Now, I gift you this restored Xianzhou "Daiyu" – may you ride this ship, command the wind, and sail across ten thousand miles of stars!"
DOT_SR_Dvalin.009.a:"Alright"
DOT_SR_Dvalin.009.b: "Thank you"


