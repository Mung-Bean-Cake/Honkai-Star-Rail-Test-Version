councilor_xunlie_jiyi_1_desc:"You must retrieve your own story, even if it has been burned. You must catch the cold-hearted thieves and make them pay for their arrogance."
edict_tr_xunlie_jiyi_1_edict: "Memory Seeking"
edict_tr_xunlie_jiyi_1_edict_desc: "You must retrieve your own story, even if it has been burned."
tr_xunlie_fengrao_1:"§BPacifist§!"
tr_xunlie_fengrao_1_flavor:"Karmetic army ants, silicon-eating flowers, and the ubiquitous Kolchi people — the advent of superluminal transport brought not only large-scale commodity circulation, but also countless species migrations. They hide in cargo boxes, in guests' sleeves, even in stomachs, slipping past quarantine devices. Thus, the cluster fungus engulfs stars, the red tide suffocates oceans. You run between various nodes, following their traces, racking your brains to eliminate species that do not belong here. Wild wasps parasitize ant bodies, poisonous rain scorches flower skins — countermeasures for every move. Before the infection becomes terminal, use ruthless means to extinguish the sparks of extinction and restore peace to the stars."
tr_xunlie_fengrao_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_xunlie_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_fengrao_effect']：§G+1§!$TABBED_NEW_LINE$—Damage to Voidworms: §G+25%§!$TABBED_NEW_LINE$—Damage to Prethoryn: §G+25%§!\nUnlock Edict: ['edict:tr_xunlie_fengrao_1_edict']\nUnlock Council Seat: $councilor_xunlie_fengrao_1$"
