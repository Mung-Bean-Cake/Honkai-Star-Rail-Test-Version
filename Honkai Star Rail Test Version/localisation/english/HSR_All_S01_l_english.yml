concept_hsr_credit: "£hsr_credit£"
concept_hsr_credit_desc: "Credits: The equivalent currency used for galactic commercial exchange.\nThe currency used by the Interastral Peace Corporation to settle with clients, now a hard currency for space travel.\n"People bustle, struggle, and trade, all for nothing more than a number on a terminal. But the truly precious things cannot be bought with the corporation's numbers.""
