DOT_SR_Dvalin.012.name:"Gift of the Trailblaze Heavenly Lord: Train "Nameless""
DOT_SR_Dvalin.012.desc:"The Astral Express is a tool created by "Trailblaze" Akivili to carry Him and the Nameless on interstellar journeys. It is said that more than one such vehicle existed, but no other records remain on the train. When Himeko discovered the train, its memory banks were damaged, losing much precious data. All that is known is that the train was indeed Akivili's creation, and that it did travel with Akivili."
