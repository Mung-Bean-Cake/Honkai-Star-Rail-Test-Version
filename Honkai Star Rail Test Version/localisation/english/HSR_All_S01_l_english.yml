hundunlinyao:"Chaos Special Elixir"
hundunlinyao_desc_short:"Common Curio"
hundunlinyao_desc_details:"The Chaos Physicians' resistance to meaninglessness always seems rather meaningless. They once put the fangs of an Alien Question Demon, Baviru mucus, blood of a wandering demon, and finally sealed the bottle with the forehead touch of a telepathic spider into the Chaos Special Elixir. They believed it had miraculous effects in curing loneliness, but patients often felt more hostile toward the physicians after taking it — its side effects often caused Self-Annihilators to see the "Shadow of Nihility"."


