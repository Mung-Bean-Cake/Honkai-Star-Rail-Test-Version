NAME_daheita:"Big Herta"
daheita_catch_phrase:"See you again? Across the universe, you are the 345th person to see me a second time. From now on, that is your "Herta Number". Remember it well, someone might ask you about it."
daheita_backstory:"The esteemed #83 of the Genius Society, Human, Female, Young, Beautiful, Cute. Legend has it that she lives in seclusion on the edge of the galaxy, rarely venturing out — surely she has appeared this time only for a problem that she personally must solve?"
hsr_paragon.1.name:"Genius Society - Big Herta"
hsr_paragon.1.a:"First Meeting"
hsr_paragon.1.a.response:"Don't recognize me? I told you before — Human, Female, Young, Beautiful, Cute."
hsr_paragon.1.b:"Hobbies"
hsr_paragon.1.b.response:"My wardrobe, well, it's probably the size of a small space station. When Nous first glanced at me, the universe lost a potential Emanator of "Beauty"."
hsr_paragon.1.c:"Observations"
hsr_paragon.1.c.response:"What defines the boundary of mortal knowledge? Many think it's the Genius Society, but I think it's me."
leader_daherta_t1:"§MBroaden Your Horizons§!"
leader_daherta_t1_desc:"The moment you glimpse the unknown, be captivated by it."
leader_daherta_t2:"§MI told you it was magic, right?§!"
leader_daherta_t2_desc:"There are countless puzzles, but the answer is... a non-existent thing.\n$leader_daherta_t2_effect_desc$"
leader_daherta_t2_effect_desc:"§BEach ['concept_curiosity'] provides 1.5% research speed, and each month adds 25% progress to a random technology§!"
leader_daherta_t3:"§MGimme that§!"
leader_daherta_t3_desc:"There are countless puzzles, but the answer is... a non-existent thing.\n$leader_daherta_t3_effect_desc$"
