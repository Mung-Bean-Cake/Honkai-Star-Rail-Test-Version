civic_Interastral_Peace_Corporation:0"§BInterastral Peace Corporation§!"
civic_Interastral_Peace_Corporation_desc:0"§R【Theme Concept】\nThis concept must be selected to enable Interastral Peace Corporation related content.\n\n§M"As long as there is trade, there is the Interastral Peace Corporation."\n\n§WIn the distant future, on the day when the trademark and flag of the Interastral Peace Corporation appear in every corner of the galaxy, children will ask their elders with curiosity how the Interastral Peace Corporation came to where it is today. Where to begin? From the very beginning! Starting with a civilization that followed the Path of Preservation, unified by a megacorporation, and developing a hyperdrive — "
Civic_Interastral_Peace_Corporation_desc2:0"§YUnlocks several new §CTrade Actions§!, granting strong temporary buffs to other parties in exchange for what you need, viewable in the trade interface.§!\n§YUnlocks a series of civics and branch office buildings, some civics requiring specific ethics. New branch office buildings share common features: providing high £job£§Cjob positions§!, £stability£§Cpowerful effects§Y and high £trade_value£§Ctrade value§! to the host while generating high £energy£§Cbranch income§! and infinitely stackable £influence£§Cbenefits§R.\n\nThe Interastral Peace Corporation has three fundamental characteristics: Interstellar, Peace, and Corporation.§W"
