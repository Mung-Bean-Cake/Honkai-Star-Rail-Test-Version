#Ascension Perks
ap_xianzhou_world:0 "Xianzhou Flagship"
ap_xianzhou_world_desc:0 "The ecological flagship slowly sails into the starry sky, like a silent clear moon falling into the night, the long road stretching without direction."
allow_xianzhou_project:0 "Unlock Xianzhou Flagship Resolution"
decision_xianzhou_project_effects:0 "Upgrade a starship or space station to the Xianzhou Flagship planet type, increasing housing, resource production, and population growth, and unlocking special Xianzhou districts, at the cost of removing some production districts."
decision_xianzhou_project_requirements:1 "Use massive resources to build the complete blueprint of the ancient Xianzhou. All district slots on the planet must be built, but not necessarily all as city and industrial districts."
decision_xianzhou_project:0 "Starship Upgrade: Xianzhou Flagship"
 #Ships
xianzhou_planet_fleet: "Xianzhou"
xianzhou_planet_fleet_plural: "Xianzhou"
xianzhou_planet_fleet_desc:"Xianzhou are cosmic vessels with complete ecosystems."
#Districts
district_xz_yunqi:0 "Cloud Knight Guard"
district_xz_yunqi_desc:0 "The Cloud Knights are the armed forces of the Xianzhou Alliance. Their organization spans the six existing Xianzhou flagships, defending the safety of the Xianzhou people and undertaking the heavy task of punishing Abominations of Abundance."
district_xz_yunqi_plural:0 "Cloud Knight Guards"
district_xz_danding:0 "Alchemy Commission"
district_xz_danding_desc:0 "The Alchemy Commission is responsible for biology and medical research on the Xianzhou, and operates clinics in various realms, providing medical services. It is said that in ancient times, the Xianzhou ancestors were not long-lived. To escape the three sufferings of old age, sickness, and death, they set sail for the elixir. After gaining immortality, the Alchemy Commission used the miracles left by the Aeon to expound the "Dao of Immortality". However, nowadays the Alchemy Commission has declined, eventually becoming a place for Outworlders to seek medical treatment."
district_xz_danding_plural:0 "Alchemy Commission"
district_xz_city:0 "Sky-Faring Commission"
district_xz_city_desc:0 "The Sky-Faring Commission manages internal airspace and interstellar navigation, maintenance of transportation such as starskiffs and warships, and all matters related to "flight". Trade and communication with other intelligent races are also handled by the Sky-Faring Commission."
district_xz_industrial:0 "Artisanship Commission"
district_xz_industrial_desc:0 "Artisanship, artisanship — industry and manufacture. The Artisanship Commission is responsible for industrial development and manufacturing, covering the design, manufacture, and improvement of almost every object on the Xianzhou. This includes weapons design, shipbuilding, and mechanical artificial intelligence. From small civilian machines to massive starships and realms, all are made by their craftsmen. They pursue exquisite skill, striving to complete the "Grand Forging" ceremony and be awarded the title of "Grand Smith"."
district_xz_science:0 "Divination Commission"
district_xz_science_desc:0 "The Divination Commission uses the "Jade Matrix" crystal computer technology, responsible for divining the future, information processing and preservation, route calculation, strategic planning, and other tasks."
district_xz_trade:0 "Public Security Commission"
district_xz_trade_desc:0 "The Public Security Commission is the civil affairs management organization of the Xianzhou, the agency most frequently encountered by residents in their daily lives. Population statistics, resource allocation, ecological governance, calendar calculation, and other matters are all handled by the Public Security Commission, which also includes scholars engaged in sociology, ecology, and other academic research."
district_xz_city_plural:0 "Sky-Faring Commissions"
district_xz_industrial_plural:0 "Artisanship Commissions"
district_xz_science_plural:0 "Divination Commissions"
district_xz_trade_plural:0 "Public Security Commissions"
