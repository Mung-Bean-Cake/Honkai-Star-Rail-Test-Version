DOT_SR_Dvalin.101.name:"The Universe Before the Amber Era"
DOT_SR_Dvalin.101.desc:"The universe was still in a barbarous and turbulent age, which later historians would collectively call the Era of Ancient Beasts; at that time the stars were not yet settled, order had not yet been born, and the vast cosmos was dominated by huge primordial beings known as the Dusk Beasts. The myriad worlds were sparse and civilization was scarce, sinking in chaos and desolation. During this period, there were no mature systems of civilization or interstellar rules. The Ancient Beasts roamed the sea of stars with their innate power, devouring newborn stars and cosmic vitality at will. The earliest Aeons in the universe were born in this chaotic era: Aeons of Equilibrium, Voracity, Order, and Permanence ascended one after another, among which the Voracity Aeon Ouroboros was itself a transformed Ancient Beast, becoming the symbol of the old hegemony. As nascent civilizations began to sprout, the conflict between life and the Ancient Beasts erupted into a full-scale war that swept across the entire sea of stars, known as the Dusk War. The flames of war raged without end, and the fledgling civilizations retreated in defeat, on the brink of extinction, the vitality of the universe nearly severed. Until... He ended the long war with supreme divine power, sheltering the surviving worlds and life, and finally ending the savage era of Ancient Beasts. Who was He?"
DOT_SR_Dvalin.101.a:"Akivili!"
DOT_SR_Dvalin.101.b:"The Reignbow Arbiter!"
DOT_SR_Dvalin.101.c:"Murata Himeko!"
DOT_SR_Dvalin.101.d:"Herta!"
DOT_SR_Dvalin.101.e:"Screwllum!"
DOT_SR_Dvalin.101.f:"It must be me! In this vast universe, we can only rely on ourselves!"

#Districts
district_train_planet_1:"Train Core Carriage"
district_train_planet_1_desc:"Main storage area for the train's processing units"
district_train_planet_2:"Party Car"
district_train_planet_2_desc:"Formerly known as "Conference Car", now officially named "Party Car". Currently used mainly as a dining hall and bar, also for meetings and board games, though it has never actually hosted a party."
district_train_planet_3:"Observation Car"
district_train_planet_3_desc:"Strictly speaking, the name "Observation Car" seems inaccurate. After all, many carriages have windows and can be used for "observation". But since this carriage is often used to receive guests — perhaps those various guests are the real "scenery" in the carriage."
district_train_planet_4:"Passenger Car"
district_train_planet_4_desc:"It is said that during the golden age of the Astral Express, there were dozens or even hundreds of such passenger carriages. Perhaps one day, the Astral Express will regain its former glory."
district_train_planet_5:"Rear Carriage"
district_train_planet_5_desc:"During routine "Trailblaze" journeys, crew members will land at predetermined coordinates using safe, stable landing pods; during unconventional "Trailblaze" journeys, the Astral Express will detach its rear carriage as a landing pod, carrying ample survival resources to ensure that the Nameless can use the carriage as a safe house upon landing. According to train records, former navigator "Mophead" Bob used detached carriages for landing multiple times, with a recovery rate of only 42.4%, and a 100% repair rate for recovered carriages... Since then, detached carriage landings have been strictly prohibited by the conductor, only used as a special "backup plan" in extremely rare cases."
