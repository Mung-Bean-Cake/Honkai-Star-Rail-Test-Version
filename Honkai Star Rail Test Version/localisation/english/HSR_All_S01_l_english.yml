concept_fengrao: "§H「Abundance」§!"
concept_fengrao_desc: "§H「Abundance」, Yaoshi§!\nThe nurturer of all beings, the god of paradise, whose goal is to let life flourish without end. Yaoshi holds the Path of "Abundance", and is seen as the sworn enemy of Lan of the "Hunt".\n§H「Flowers bloom freely, facing inevitable withering; birds spread wings and sing, facing inevitable fall; streams babble, flowing toward inevitable drought — why must all things perish? There must be a panacea in the universe to cure the ailment called 'short life'.」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——Anonymous, "Life is Short and Bitter"§!"
concept_fengrao_effect:"Path: 「Abundance」"
concept_fengrao_effect_desc:"§HUtility§! Path. Initially boosts §GPlanet Infrastructure Build Speed§!, §GClear Blocker Speed§!, §GHousing§!, §GAmenities§!, reduces §GClear Blocker Cost§!. As devotion increases, it boosts §HLeader Lifespan§!, §HTerraforming Speed§!, §HColony Development Speed§!, §HPlanetary Ascension Effect§!; reduces §HColony Ship Build Cost§!, §HTerraforming Cost§!, and additionally increases §RJob Upkeep§!."
