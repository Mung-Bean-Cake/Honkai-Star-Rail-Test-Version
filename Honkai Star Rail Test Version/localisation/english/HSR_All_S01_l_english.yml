concept_situation_engine_of_creation_desc:0 "Open the situation: §BJarilo-VI Reboot§!. During the situation, the Grand Guardian's traits will be enhanced, and initial negative effects will be weakened or removed.\n\n§L$situation_engine_of_creation_desc$§!"
concept_belobog_blocker_1_army:0 "Rift Erosion"
concept_belobog_blocker_1_army_desc:0 "The Rift will attack Jarilo-VI every §Rfive§! years. The number of hostile creatures spawned is related to the number of §RRift§! blockers on the planet's surface. Each erosion will expand the Rift, generating new Rifts based on the current number of Rift blockers."
