tech_unreserched:"§RUnresearched§!"
DOT_SR_Herta.1000.title:"Progress Report on Herta's Technical Assistance"
DOT_SR_Herta.1000.desc:"This Herta technology assistance project was undertaken by the physics group. The technology transfer has substantially enriched the physical models of the physics group's frontier fields, guided deeper theoretical research directions, and relevant materials have been distributed to all departments for study and discussion. The outcome has been a great success."
DOT_SR_Herta.1000.a:"Acknowledged"
DOT_SR_Herta.1000.tt:"Completed Herta's technical assistance direction. Completing all directions will unlock the Ascension Perk $ap_herta_premote$."
DOT_SR_Herta.1001.title:"Progress Report on Ruan Mei's Technical Assistance"
DOT_SR_Herta.1001.desc:"Thanks to the accumulated experience from the previous Blue planet transformation project, research in planetary transformation has progressed rapidly. We can now convert a planet into a Spiritual World in a short time. In gene technology, small-scale genetic modification tests have shown no adverse reactions, so we can safely edit new gene sequences."
DOT_SR_Herta.1001.a:"Acknowledged"
DOT_SR_Herta.1001.tt:"Completed Ruan Mei's technical assistance direction. Completing all directions will unlock the Ascension Perk $ap_herta_premote$."
DOT_SR_Herta.1002.title:"Progress Report on Screwllum's Technical Assistance"
DOT_SR_Herta.1002.desc:"Outcome: Great success.\nThe previous space station attack cost us many high-precision mechanical devices and mechanical assistants. Screwllum's new technology not only helped us build, modify, and upgrade new equipment and assistants, but also improved our production and construction technology. Additionally, drawing on Screwllum's technology, we have mastered a new planetary transformation technique."
DOT_SR_Herta.1002.a:"Acknowledged"
DOT_SR_Herta.1002.tt:"Completed Screwllum's technical assistance direction. Completing all directions will unlock the Ascension Perk $ap_herta_premote$."
DOT_SR_Herta.1003.title:"Progress Report on Stephen's Technical Assistance"
DOT_SR_Herta.1003.desc:"The space station's defense network has been strengthened. The previous attack made it urgent to reinforce the station's defense. With Stephen joining the redesign of the defense system, the station's and Blue's defense systems have been comprehensively strengthened."
DOT_SR_Herta.1003.a:"Acknowledged"
DOT_SR_Herta.1003.tt:"Completed Stephen's technical assistance direction. Completing all directions will unlock the Ascension Perk $ap_herta_premote$."
DOT_SR_Herta.1004.title:"Galactic Scholar"
DOT_SR_Herta.1004.desc:"With the further improvement of our research level and the completion of the station's restoration, a large influx of alien scholars has triggered an unprecedented wave of research. Now, collection and research work proceeds in an orderly manner."
DOT_SR_Herta.1004.a:"The path of progress!"
DOT_SR_Herta.1004.tt:"Unlock Ascension Perk $ap_herta_premote$."
