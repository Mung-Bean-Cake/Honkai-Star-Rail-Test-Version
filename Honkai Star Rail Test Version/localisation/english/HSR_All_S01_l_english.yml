tr_xunlie_cunhu_1:"§BFrontier Gunslinger§!"
tr_xunlie_cunhu_1_flavor:"Murders are a daily occurrence on Heldolin. Stowaways hiding in frontier systems carry unforgivable blood debts, yet under the blind eye of the authorities, they try to turn this place into another haven for thieves. You black out their goggles, and the auxiliary machines receiving your commands block attacks; the anesthetic gas filling the room quickly incapacitates the criminals, completing your daily work. You infiltrate the viscous biological ship, paralyzing the glands preparing to bombard. You wear exoskeletons into illegal memory transaction dens, engaging in close combat with Habeck mercenaries. These chaotic skirmishes seem never-ending. But you must still move forward, for the peace of Heldolin."
tr_xunlie_cunhu_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_xunlie_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_cunhu_effect']：§G+1§!$TABBED_NEW_LINE$—Hyperlane Jump Charge Time: §G-50%§!$TABBED_NEW_LINE$—Hyperlane Jump Cooldown: §G-50%§!$TABBED_NEW_LINE$—Jump Drive Cooldown: §G-50%§!$TABBED_NEW_LINE$—Jump Drive Range: §G+50%§!$TABBED_NEW_LINE$—Fleet Command Limit: §G+25%§!$TABBED_NEW_LINE$—Naval Capacity: §G+25%§!\nUpon entering space combat, ships receive bonuses for 30 days.\nUnlock Council Seat: $councilor_xunlie_cunhu_1$"
councilor_xunlie_cunhu_1:"§BFrontier Gunslinger§!"
councilor_xunlie_cunhu_1_desc:"You will continue moving forward, for the peace of the universe."
tr_xunlie_jiyi_1:"§BAmnesiac§!"
tr_xunlie_jiyi_1_flavor:"You lost something important, inside your mind, as if a skillful thief quietly stole your past, digging a hole in your heart. The Incinerators, the Holstein Great Silence — you have heard these names, but never expected them to appear by your side, carving out half of your soul, discarding those memories as waste. Who could tolerate precious memories being casually thrown away? You chase their shadows, embarking on a revenge journey filled with resentment. No one has the right to control another's memories. You must retrieve your own story, even if it has been burned. You must catch the cold-hearted thieves and make them pay for their arrogance."
tr_xunlie_jiyi_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_xunlie_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_jiyi_effect']：§G+1§!$TABBED_NEW_LINE$—Ship Weapon Fire Rate: §G+50%§!$TABBED_NEW_LINE$—Ship Weapon Range: §G+50%§!$TABBED_NEW_LINE$—Army Damage: §G+100%§!$TABBED_NEW_LINE$—Army Morale Damage: §G+100%§!$TABBED_NEW_LINE$—Army Health: §G+100%§!\nUnlock Edict: ['edict:tr_xunlie_jiyi_1_edict']\nUnlock Council Seat: $councilor_xunlie_jiyi_1$"
