 #Argenti
NAME_yinzhi:"Argenti"
yinzhi_catch_phrase:""To devote one's soul means that each time you might not return, but each time you will never retreat." "Mutual encouragement, my dear friend.""
yinzhi_backstory:"A classical knight of the "Knights of Beauty". He is upright, open, and noble-minded — a solitary wanderer across the universe, steadfastly practicing "Beauty". Upholding the reputation of "Beauty" across the universe is Argenti's duty: to fulfill it, one must begin with reverence, and when lowering the lance, one must be convincing."
hsr_paragon.64.name:"Knights of Beauty - Argenti"
hsr_paragon.64.a:"First Meeting"
hsr_paragon.64.a.response:"I am Argenti of the "Knights of Beauty". I hereby greet you with the solemn weight of a rose."
hsr_paragon.64.b:"Greeting"
hsr_paragon.64.b.response:"If you encounter trouble, do let me know — I will defend your safety."
hsr_paragon.64.c:"Observations"
hsr_paragon.64.c.response:"Have you ever heard of a planet where "ugliness" does not exist? Interestingly, the people there also do not see "beauty"."
leader_yinzhi_t1:"§MReverence§!"
leader_yinzhi_t1_desc:"A moment, left in the eyes."
leader_yinzhi_t2:"§MJustice, Blossoms Here§!"
leader_yinzhi_t2_desc:"The humility of agate."
leader_yinzhi_t3:"§MSublime Object§!"
leader_yinzhi_t3_desc:"The glory of the thorny path."
leader_yinzhi_t4:"§MPure and Noble Declaration§!"
leader_yinzhi_t4_desc:"Following the duty of a Knight of Beauty."
leader_yinzhi_t5:"§MDwelling in the Garden of Flowers, Bestowing Absolute Beauty§!"
leader_yinzhi_t5_desc:"All beauty in the galaxy, I will defend until the last moment."
