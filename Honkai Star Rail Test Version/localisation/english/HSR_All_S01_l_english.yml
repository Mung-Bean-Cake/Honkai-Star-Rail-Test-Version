 #Recommendations
XQTD_recommend1_text: "Mod Recommendations from the Dev Team"
XQTD_recommend2_text: "The following mods are not required and do not affect the current mod's operation."
XQTD_recommend_MOD1.1_custom_tooltip: "This is the music, image, and advisor pack submod for Honkai: Star Rail, i.e., a submod of the 「Honkai: Star Rail」 mod! It contains over 200 music tracks, 140+ high-quality images, and Honkai: Star Rail character advisor voices (to be optimized). The music covers albums such as "Out of Control", "Snow in the Ember", "Dreams of Longevity", "Walking on the Path", and "Stellar Theater"."
hsr_module_recommendation1_custom_tooltip: "§RThis is a mod for Hearts of Iron IV§!\n\nIf Genshin Impact were not just a simple, casual mobile game, but an epic saga of swords and magic, fire and blood, people and leaders, ideals and justice — how would its story unfold? If you are curious, now, with new characters, nations, maps, events, focuses, scripts, mechanics, models, music, technology, and based on the famous game Genshin Impact — Teyvat Dawn, a large-scale HOI4 mod, is ready for subscription and experience! Behold the bones bleaching the fields like snow, the mournful winds in tall trees. Once a hero rises with his sword, it's another decade of mortal strife!"
XQTD_recommend_MOD3.1_custom_tooltip: "1. Genshin Impact Species Pack\n— Two new origins\n— New species traits\n— Exclusive traditions, buildings, jobs\n— New weapons\n— New stories, event chains\n2. New leader development mechanics\n— Legendary leaders based on Genshin Impact characters\n— Character-specific progression systems\n3. Exclusive ascension paths, tech trees\n— This mod features a unique ascension path system. After researching the Elemental Theory technology, players can directly select the tradition tree, and after completing it, choose a second ascension path based on researched technologies and traditions.\n— New technology tree based on Genshin Impact\n4. New weapons, World Tree system\n— The World Tree provides powerful boosts to your nation\n— New weapons based on Stellaris lore\n5. New enclaves, ships\n— Adventurers' Guild, assisting your exploration\n— New armed construction ships, armed science ships, Stormterror"
hsr_module_recommendation_custom_tooltip: "This mod revolves around celestial warships, building special ships and fortresses through megastructures and other means.\nAfter researching related technologies, you can build celestial warships and celestial fortresses.\nThese can be designed in the ship designer.\nEight types of warships: Asteroid Warship, Satellite Warship, Planet Warship, Giant Planet Warship, Star Warship, Neutron Warship, Black Hole Warship, Eternal Sky Tower.\nEight types of fortresses: Asteroid Defense Array, Orbital Base, Planet Defense Base, Giant Planet Cannon, Star Bomb, Neutron Storm, Black Hole - Wangchuan, Sky Pillar."
XQTD_recommend_MOD1.2_custom_tooltip: "Mod Name:\n  Honkai: Star Rail | Music, Images & Advisor"
XQTD_recommend_MOD2.2_custom_tooltip: "Mod Name:\n  Teyvat Dawn | Genshin Impact Mod"
XQTD_recommend_MOD3.2_custom_tooltip: "Mod Name:\n  Genshin Impact (Genshin Impact) | Shining Stars"
XQTD_recommend_MOD4.2_custom_tooltip: "Mod Name:\n  Celestial Warships"
