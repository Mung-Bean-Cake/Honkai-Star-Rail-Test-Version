jiziqixing_catch_phrase:""Time to reacquaint ourselves with the Nameless.""
jiziqixing_backstory:""No matter how complex the past, no matter how distant the future, our relationship will never change. I am the navigator of the Astral Express, Himeko, forever a family member gazing at the same scenery as you." With companions and guardians, "Trailblaze" was never a solo voyage. She draws the miracle of star-treading, the silver rails extend, the Nameless set sail again, illuminating the long night of the stars — at the end, she looks back once more, the dream of departure never stranded."
