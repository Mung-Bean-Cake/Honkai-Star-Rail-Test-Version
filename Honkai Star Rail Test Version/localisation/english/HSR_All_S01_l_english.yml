 #Topaz
NAME_tuopa:"Topaz"
tuopa_catch_phrase:"Hi, long time no see! How've you been? Busy with work, working overtime?"
tuopa_backstory:"Topaz is a senior executive of the Interastral Peace Corporation's "Strategic Investment Department", leading the Special Debt Resolution Squad. Despite her youth, she is one of the "Ten Stonehearts", with the cornerstone of "Topaz of Debt Collection". Her partner, the trotter "Numby", can keenly sense the location of wealth, handling security, debt collection, and actuarial work with ease. Now they travel the galaxy together, pursuing various debt disputes that affect the corporation's business."
hsr_paragon.63.name:"Interastral Peace Corporation - Topaz"
hsr_paragon.63.a:"First Meeting"
hsr_paragon.63.a.response:"Nice to meet you, allow me to introduce myself. I'm Topaz, from the Strategic Investment Department of the Interastral Peace Corporation. I've heard much about the Astral Express and the Nameless — pleasure to meet you! And this is my good partner here. Numby, say hello to everyone!"
hsr_paragon.63.b:"Hobbies"
hsr_paragon.63.b.response:"Vast starry skies, billions of adorable and wondrous little creatures... even if only for them, I have to work hard!"
hsr_paragon.63.c:"Observations"
hsr_paragon.63.c.response:"Every family has its own problems, I understand that. But if everyone defaults on their debts for their own reasons, the whole system will collapse — when that happens, personal stories become the world's burden."
leader_tuopa_t1:"§MPayment difficulties?§!"
leader_tuopa_t1_desc:"We must raise risk awareness..."
leader_tuopa_t2:"§MFinancial Turbulence§!"
leader_tuopa_t2_desc:"Market fluctuations are normal, strike when the time is right~"
leader_tuopa_t3:"§MTechnical Adjustment§!"
leader_tuopa_t3_desc:"Worried, yet happy."
leader_tuopa_t4:"§MDemand Inflation§!"
leader_tuopa_t4_desc:"Pay back with interest!"
leader_tuopa_t5:"§MTurn losses into profits!§!"
leader_tuopa_t5_desc:"Ah? That's right. Look far ahead, focus on the long term... that's the secret to successful investment!"
