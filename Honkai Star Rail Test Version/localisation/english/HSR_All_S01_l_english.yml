building_Labour_Dispatch:0"Labor Dispatch Agency"
building_Labour_Dispatch_desc:0"§M"The contribution of one employed person to the Path of Preservation is greater than that of ninety-nine unemployed." — Woodson Halsey\n§!From Qlipoth's Path of Preservation, we derive a new creed: ensuring that the majority of every civilization has a job is the foundation for achieving preservation. It is both the goal and the means of preservation.\nWe believe that unemployment brings despair, instability, lower demand, and reduced performance, which directly or indirectly undermine "Preservation". Therefore, we devote ourselves to the cause of providing jobs for everyone in the galaxy.\n§gOf course, mainly for us.§!"
building_Housing_Corp:0"Housing Development Plan"
building_Housing_Corp_desc:0""Let everyone have a home to shelter from wind and rain — that too is a form of preservation." — Jean Gunnhild\n§!In the vast galaxy, there are always those without a place to live, and that is both our business opportunity and a perfect path to practice preservation. On distant alien worlds, those homeless people will see our trademark, marvel at our affordable housing, and pay for this wonderful commodity.\n§gSometimes negative amounts.§!"
building_Amenity_Corp:0"Global Entertainment Group"
building_Amenity_Corp_desc:0"§M"Interstellar Peace, making dreams come true!" — Peace Park slogan§!\n\n§!Even in the interstellar age, consumerism still runs rampant — ads and movies tell you that if you pay, you get happiness, but often you pay and get pain. But we are different.\nWe will pull out all the stops to bring joy and wonder to customers with expectations and fatigue, so that they can go back to work the next day full of energy, letting everyone who pays get joy. This too is for Preservation. Not only to raise resources for Preservation, but also to preserve children's dreams, and adults' dreams.\n§gWe have found that some adult males enjoy our facilities more than children.§!"

