 #Events
xinghe.11.title:"Stellaron Discovered"
xinghe.11.desc:"Our ships have discovered a Stellaron, a mysterious phenomenon that has been interfering with our normal interstellar navigation since Amber Era 2147. Our top scientists have taken note. Although we believe we are currently unable to eradicate this scourge, existing technology can seal it and reduce its external hazards. Research into the relevant technical implementation has already begun."
xinghe.11.a:"It seems we have a big problem..."
xinghe.101.title:"New World"
xinghe.101.desc:"Our scientists successfully sealed the Stellaron via remote-controlled equipment. After the imaginary energy layer around the planet receded, we saw a habitable new world. No traces of advanced intelligent life have been found yet on this planet; we still need to deploy unmanned equipment to monitor the sealed Stellaron's landing site for the long term."
xinghe.101.a:"Great job"
xinghe.111.title:"Ancient Battlefield"
xinghe.111.desc:"Upon sealing the Stellaron and observing the planet, we found that intelligent life once existed here. They may have had a highly developed civilization, but everything was wiped out by the Stellaron's arrival. We can observe large and small craters on the surface, suggesting they fought against the Rift spawned by the Stellaron."
xinghe.111.a:"Oh, heavens..."
xinghe.121.title:"Survivors"
xinghe.121.desc:"Our sealing equipment has picked up a distress signal! Soon, a ground exploration team reached the planet's surface to find the signal source. At an above-ground observation station of a well-fortified underground facility, they found the source. After geological analysis and scanning, they confirmed the existence of an underground city and its entrance. After opening the city's entrance and communicating with the survivors, they disabled their defenses and invited us inside. There were millions of survivors from a civilization that had survived a nuclear war since ancient times. Despite scarce resources, they had established a self-sufficient community and maintained it for centuries. Initially wary of our scientists — being the first aliens they had ever seen — they were also grateful that we had opened the gate. The shelter stored a lot of equipment and materials for rebuilding civilization after a nuclear disaster. Only they knew how to operate them, but they seemed more willing to join our colony after adapting to the sunlight."
xinghe.121.a:"Let's rebuild this planet together!"
xinghe.121.b:"We respect your sovereignty!"
xinghe.121.c:"Unfortunately, your wish is in vain..."
xinghe.131.title:"Nanite Planet"
xinghe.131.desc:"A nanite planet, seemingly unremarkable. However, our sealing equipment keeps receiving a faint, unusual energy signal from the planet's surface. The cause is unknown."
xinghe.131.a:"Malfunction?"
xinghe.141.title:"Abandoned Ships"
xinghe.141.desc:"We found some abandoned ships in synchronous orbit around the target planet. Their ownership is unclear. However, we found that they can still be started up and, after some repairs, can operate normally."
xinghe.141.a:"Interesting"
xinghe.150_title:"Curio"
xinghe.150_desc:"Our detectors have found ['concept_curiosity'] on [This.GetName]. At an opportune moment, we recovered these curios."
xinghe.160_title:"Energy Capture"
xinghe.160_desc:"While sealing the Stellaron on [This.GetName], our energy capture equipment unexpectedly captured the energy released by the Stellaron's explosion. This energy was converted into a large amount of electricity for our use."
xinghe.170_title:"Rift"
xinghe.170_desc:"After breaking through the imaginary energy barrier, we discovered a Rift inside. It appears that space here has begun to mutate; we need to be careful."
xinghe.180_title:"Wormhole"
xinghe.180_desc:"A wormhole has appeared before us. Its origin and destination are unknown. Perhaps we should venture inside to find out?"
xinghe.200_title:"Rift Reminiscence - Three Little Pigs"
xinghe.200_desc:"You wander the wilderness of the Slaad tribe and encounter three pig-like timid sequence creatures. Their reactions differ: one trembles, one prepares to flee, and one assumes a combat stance. You recall the description in the Interstellar Peace Guide: they are "Sequence Trotters", transdimensional beings that spend most of their lives eating and running away. Encountering "Sequence Trotters" is an auspicious sign. You begin to consider how to respond: the rules of play must be tailored to each Trotter's personality."
xinghe.200.a:"You convey excellent Trotter protection awareness."
xinghe.200.a.tt:"Gain §G5§! ['concept_cunhu_effect'] devotion points."
xinghe.200.b:"Excellent Trotter-catching skills... speed is key!"
xinghe.200.b.tt:"Gain §G5§! ['concept_xunlie_effect'] devotion points."
xinghe.200.c:"Play with the Sequence Trotters."
xinghe.200.c.tt:"Gain §G2§! devotion points in three random ['concept_path_effect']."
xinghe.200.d:"Leave."
xinghe.200.d.tt:"One shouldn't argue with Trotters!"
xinghe.201_title:"Rift Reminiscence - Endless Darkness"
xinghe.201_desc:"Where is this?... You mutter to yourself. You have fallen into boundless darkness. There is no light, no direction to discern. A mysterious hum sounds in your ears, and a huge pull drags you. Your mental energy becomes exceptionally lazy. The currents around you have no substance; your muscles relax, your eyelids droop..."
xinghe.201.a:"Go toward the darkness."
xinghe.201.b:"Resist the pull."
xinghe.201.c:"You could also *surrender to it*."
xinghe.201.c.tt:"Gain §G1§! devotion point in two random ['concept_path_effect']."
xinghe.202_title:"Rift Reminiscence - Jem Hack and Jem Hal"
xinghe.202_desc:"You find yourself in an endless ruin, your vision blocked by abandoned containers. Thick smoke fills the air; scrapped robots are torn into pieces. Their bodies bear the "Interastral Peace Corporation" emblem, their heads next to their feet, no longer intelligent. At this moment, a rustling sound comes from the trash heap behind you. You sense something watching you — you turn and see a robot hiding behind a box. You approach it — you find its cables are broken, incapacitated. "We were known as the 'Amber Lord Support Team', created by Taravan Keane, used by him, and ultimately discarded by him." The robot shows you an object it has saved with its last strength. "Jem Hack ceased operation 371,029 seconds ago. Jem Hal will cease operation in 74,158 seconds, unable to keep his brother's possessions any longer. I humbly request you take one with you.""
xinghe.202.a:"Jem Hack's collection."
xinghe.202.a.tt:"Gain §G2§! devotion points in a random ['concept_path_effect']."
xinghe.202.b:"Turn and walk away."
xinghe.202.b.tt:"100 ['concept_yuzhousuipian']"
xinghe.202.c:"Pay the price... to keep it running."
xinghe.202.c.tt:"Gain §G4§! devotion points in ['concept_fengrao_effect']."
xinghe.202.d:"Preserve Jem Hack's remains."
xinghe.202.d.tt:"Obtain $hundunlinyao$, 100 ['concept_yuzhousuipian']"
xinghe.203_title:"Rift Reminiscence - Stephen Lloyd's Idea"
xinghe.203_desc:"You see a man, about thirty, unremarkable, wearing a white shirt and brown suspenders. When he speaks, his eyes wander, as if dodging: "Um, I wanted to add some random events to this game, that would be fun... but the brainwave reader's stability seems a bit off. So, um, the events you encounter now are a bit, um, monotonous. I'm sorry." "For example," the man says haltingly, not looking at you, "um, this is a random event. I wrote some templates, but the Simulated Universe can't turn them into valid content yet. So you'll see something like this..." As he speaks, the man's figure disappears, and in his place appears a line: You encounter a random event."
xinghe.203.a:"Give me some starting funds."
xinghe.203.a.tt:"Gain 150 ['concept_yuzhousuipian']"
xinghe.203.b:"Give me something good."
xinghe.203.b.tt:"Gain §G3§! devotion points in a random ['concept_path_effect']."
xinghe.203.c:"Do nothing."
xinghe.204_title:"Rift Reminiscence - Nomadic Miners"
xinghe.204_desc:"It is dusk, and you stand in the heat. The mining area makes you dizzy; the veins look like melted butter. "The great Preservation Aeon Qlipoth... He can hear our voices." The miners raise their picks and bring them down; they are like fanatical animals, like believers. Someone sees you — the *Head Miner* wearing a detection lamp. His arms are sturdy and dark, his lips equally black. His hearty smile is unforgettable. He has a gold tooth that repeatedly enlarges and distorts in your mind, until you see only his *smile* — lips and eyes mixing like colors on a palette. "The Amber Lord's grace: 'Qlipoth' preserves this land. You can take one item with you.""
xinghe.204.a:"Qlipoth's gift."
xinghe.204.a.tt:"Gain §G1§! devotion points in two random ['concept_path_effect']."
xinghe.204.b:"Qlipoth's blessing."
xinghe.204.b.tt:"Gain §G2§! devotion points in a random ['concept_path_effect']."
xinghe.204.c:"Offer it to the Amber Lord."
xinghe.204.c.tt:"Gain §G3§! devotion points in ['concept_cunhu_effect']."
xinghe.204.d:"Fight the *Head Miner* and take the good stuff!"
xinghe.204.d.tt:"Gain §G3§! devotion points in ['concept_huimie_effect']."
xinghe.205_title:"Rift Reminiscence - Error Item"
xinghe.205_desc:"⌈A small mishap, but no big deal.⌋ Herta's voice suddenly comes, but you can't find the source. ⌈Some spherical code in the system experienced entropy increase, happens often.⌋ ⌈It's quite chaotic, so I just packed that mess of code and stuffed it into a curio.⌋ Herta says. ⌈Take it with you; it will temporarily skew your action logs, but I'll fix it soon.⌋"
xinghe.205.a:"Choose a bugged curio."
xinghe.205.a.tt:"Lose §G1§! devotion point in a random ['concept_path_effect'], gain a ['concept_random_common_curiosity_get']."
xinghe.205.b:"Leave."
xinghe.205.c:"Let the entropy increase more!"
xinghe.205.c.tt:"Lose §G1§! devotion points in two random ['concept_path_effect'], gain two ['concept_random_common_curiosity_get']."
xinghe.205.d:"Recall the code of the 'correct' item."
xinghe.205.d.tt:"Gain a ['concept_random_common_curiosity_get']."
xinghe.206_title:"Rift Reminiscence - Error Item"
xinghe.206_desc:"You step into a natural program simulated by recursive equations; a black box lies on the ground. You open it, and a holographic physician appears — his lower body is that of a snake. He moves his serpentine tail, and dark green scales rustle, reflecting metallic luster. "Hiss—" he speaks, and the synesthesia beacon works; you gradually understand the half-serpent's language. "Tiange was destroyed 62 light-years away by Lan's light-arrow. Herta observed this event and cultivated my spiritual form in the Simulated Universe." He holds a flame in his palm. "My existence is nothingness... I have no permission to terminate the black box. I tried to breach the defenses, only managing to pass this self-extinguishing flame outside the box. Please accept it and carry out my conviction.""
xinghe.206.a:"Accept the flame of "Self-Annihilation" and destroy the black box."
xinghe.206.a.tt:"Lose 150 ['concept_yuzhousuipian'], gain §G4§! devotion points in a random ['concept_path_effect']."
xinghe.206.b:"Refuse."
xinghe.206.b.tt:"Gain 100 ['concept_yuzhousuipian']"
xinghe.206.c:"Hasten to terminate the black box; rescue him."
xinghe.206.c.tt:"Gain §G4§! devotion points in ['concept_xunlie_effect']."
xinghe.206.d:"You could also *strengthen this conviction*."
xinghe.206.d.tt:"Lose 150 ['concept_yuzhousuipian'], gain §G1§! devotion point in four random ['concept_path_effect']."
xinghe.207_title:"Rift Reminiscence - Interactive Art"
xinghe.207_desc:"You are in Hall Five of the Sigma Galactic United Theater. You can't believe you're sitting among elegantly dressed gentlemen and ladies. You begin to anticipate the performance behind the red velvet curtain. Perhaps it will be the Salsotto Opera Company's cosmic princess, whose skirt is wide enough to cover the entire stage. Or maybe the old fellows from the Jacobin Mathematical Institute's favorite scientific device performance, where the "Pronto Expert System" AI computes dramatic plots. Or even greater, the unplugged performance of the Sigma Saintess, an eternal "Saintess" with the golden ratio physique, remembered by all for the coiled posture of holding the sun. Soon, the performance begins — on stage stands a woman with blue, viscous skin. She raises her hand and begins to sing — a kind of synthesized coloratura. You straighten your back, trying to move your stiff muscles, but find yourself unable to move — a cold touch at your side. Yes... you are certain... a gun barrel is pressed against you. "We changed the program. The era of 'Akivili' has ended; classical art is dead. Today everyone loves action movies. Tell me your choice." a male voice says. Um, not quite." The man's voice is somewhat confused; he licks his lips. "I mean, do you prefer musicals or action movies?""
xinghe.207.a:"Musicals."
xinghe.207.a.tt:"Gain §G4§! devotion points in ['concept_huanyu_effect']."
xinghe.207.b:"Action movies."
xinghe.207.b.tt:"Gain §G4§! devotion points in ['concept_xunlie_effect']."
xinghe.207.c:"Please spare me."
xinghe.207.d:"Watch the secret film of 'Instant'."
xinghe.207.d.tt:"Gain §G6§! devotion points in ['concept_xunlie_effect']."
xinghe.207.e:"Watch the secret film of 'Life'."
xinghe.207.e.tt:"Gain §G6§! devotion points in ['concept_fengrao_effect']."
xinghe.207.f:"Watch the secret 'Film'."
xinghe.207.f.tt:"Gain §G6§! devotion points in ['concept_zhishi_effect']."
xinghe.208_title:"Rift Reminiscence - Social Dream"
xinghe.208_desc:"You walk into the cutest Kirilo Fish Bistro on Pier Point — contained within a giant fish-eye bubble. Through the curved glass you can see the Cosmic Wall. You enjoy the pleasant afternoon sunshine, a moment just for you. All customers are immersed in the ultrasonic fish-wave brain massage. You swallow the *fish eye* on your plate in one gulp, and feel the social dream come over you — the dawn of Pier Point's development, interstellar money rains from the sky, you hold corporate bonds, and happiness is appreciating. Your gastric mucosa consumes the fish eye, and you wake from the dream. You realize it's time for work. But you don't want to leave..."
xinghe.208.a:"Swallow another *fish eye* and continue enjoying the massage."
xinghe.208.a.tt:"Gain 300 ['concept_yuzhousuipian'], lose §G3§! devotion points in a random ['concept_path_effect']."
xinghe.208.b:"Go back to work."
xinghe.208.b.tt:"Gain 100 ['concept_yuzhousuipian']"
xinghe.208.c:"Capture more fish eyes..."
xinghe.208.c.tt:"Gain 500 ['concept_yuzhousuipian'], lose §G3§! devotion points in two random ['concept_path_effect']."
xinghe.208.d:"Never work again! Forever..."
xinghe.208.d.tt:"Gain §G3§! devotion points in ['concept_xuwu_effect']."
xinghe.208.e:"Smash your *work communicator* that can reach you!"
xinghe.208.e.tt:"Gain 400 ['concept_yuzhousuipian'], lose §G1§! devotion point in a random ['concept_path_effect']."
xinghe.209_title:"Rift Reminiscence - Incinerator"
xinghe.209_desc:"This cave is very peaceful; the clusters of insects jumping in midair are like colored stars. A woman sleeps in the cave, Noxus bugs crawling at her feet, her skin as colorless as *gray matter*. She opens her eyes, and when she sees you, a burst of colorful flame erupts around her. The fire spreads along the cave walls, quickly reaching your feet, and you are instantly surrounded by flames. Countless memories surge in your mind, and you feel your mental energy overheating. You recall the afternoon you first learned to count on your fingers, the first time you watched space ants march in formation — why do you remember these? "Remembering this garbage makes you feel alive." You hear her snort, "Believe in Fuli, and we will incinerate your faded memories." she says."
xinghe.209.a:"Devote everything to "Him"."
xinghe.209.a.tt:"Lose §G1§! devotion point in a random ['concept_path_effect'], gain §G3§! devotion points in a random ['concept_path_effect']."
xinghe.209.b:"Bear ten carats of garbage."
xinghe.209.b.tt:"Gain 80 ['concept_yuzhousuipian']"
xinghe.209.c:"Incinerate the "memory" you wish to forget."
xinghe.209.c.tt:"Gain §G3§! devotion points in ['concept_xuwu_effect']."
xinghe.209.d:"Believe in the Aeon of "Remembrance"."
xinghe.209.d.tt:"Gain §G3§! devotion points in ['concept_jiyi_effect']."
xinghe.209.e:"Forget all faded "memories"."
xinghe.209.e.tt:"Lose §G100§! devotion points in ['concept_jiyi_effect'], gain §G5§! devotion points in a random ['concept_path_effect'] 20 times."
xinghe.210_title:"Rift Reminiscence - Bounty Hunter"
xinghe.210_desc:"You walk through the snowy plain, wrapped in warm furs. You meet a man — red-haired, freckled, tall and thin, wearing calfskin boots and carrying a hunting rifle. He points to a spherical building in the distance: "The Interastral Peace Corporation's pharmaceutical company hunts biological materials in SnodeLand to produce precious medicines, recruiting many bounty hunters." "Secret intel, S-class bounty — Snowfield Deep Yak, high reward. It's so cold here, can I borrow your furs?" You notice the *SnodeLand Animal Protection Association* badge on his chest..."
xinghe.210.a:"Give him the fur you're wearing."
xinghe.210.a.tt:"Gain 200 ['concept_yuzhousuipian']"
xinghe.210.b:"Turn and walk away."
xinghe.210.b.tt:"Gain 80 ['concept_yuzhousuipian']"
xinghe.210.c:"Cheaply buy his *calfskin boots* at a low price!"
xinghe.210.c.tt:"Gain 50 ['concept_yuzhousuipian'], gain a ['concept_random_common_curiosity_get']."
xinghe.210.d:"Tear off his badge!"
xinghe.210.d.tt:"Gain §G3§! devotion points in ['concept_xunlie_effect']."
xinghe.210.e:"Extract more *intelligence* from him."
xinghe.210.e.tt:"Gain four ['concept_random_common_curiosity_get']."
xinghe.211_title:"Rift Reminiscence - Nirdis Card"
xinghe.211_desc:"You sit at the card table; the one-eyed croupier's metal leg intertwines with the Nirdis card table legs, his torso straddling the table's central hole, with balls spinning around his waist. He rolls his eye at you, bows elegantly. Then the croupier deals chips with ten mechanical arms, shuffling gracefully. "With a certain probability, you will turn over the most beautiful memory in the world." The croupier deals a stack of cards in front of you. "You might also turn over some hidden, unknown things. If your luck is bad, the consequences could be dangerous.""
xinghe.211.a:"Turn over a card."
xinghe.211.a.tt:"25% chance to gain §G2§! devotion points in a random ['concept_path_effect']."
xinghe.211.b:"Give up."
xinghe.211.b.tt:"Gain 80 ['concept_yuzhousuipian']"
xinghe.211.c:"Haha, flip the table!"
xinghe.211.c.tt:"Gain §G2§! devotion points in two random ['concept_path_effect']."
xinghe.211.d:"Recall past "card-playing experiences"."
xinghe.211.d.tt:"Gain §G3§! devotion points in ['concept_jiyi_effect']."
xinghe.212_title:"Rift Reminiscence - Make a Wish"
xinghe.212_desc:"You enter a circular room, where a rope binds a tree with pure white branches. You are amazed by its pure beauty; it is entirely holy, like a dancing statue. You notice soldiers leaning beside the tree; you're not sure if they are asleep. They are devout knights, each with pallid skin. You also involuntarily approach it. You hear the slow, cracking sound of the tree's waves. You see a wooden sign beside the roots: "Water it... it will bloom.""
xinghe.212.a:"Exchange for blessings."
xinghe.212.a.tt:"Gain §G2§! devotion points in two random ['concept_path_effect']."
xinghe.212.b:"Leave."
xinghe.212.b.tt:"Gain 80 ['concept_yuzhousuipian']"
xinghe.212.c:"Awaken the sleeping soldiers."
xinghe.212.c.tt:"Gain §G5§! devotion points in two random ['concept_path_effect']."
xinghe.212.d:"Deconstruct its life logic."
xinghe.212.d.tt:"Random leader gains 1000 experience."
xinghe.213_title:"Rift Reminiscence - Let's Exchange Gifts"
xinghe.213_desc:"The Nameless train stops at the Budaanlir platform; the rear carriage holds infinite gifts. A traveler in a felt hat leans against the carriage; his clothes are tattered, his felt boots muddy. You approach the carriage; he waves at you. "Akivili once took mortal form and went on adventures with the people of Budaanlir, exchanging interesting experiences from our journeys.""
xinghe.213.a:"Exchange for blessings."
xinghe.213.a.tt:"Lose §G1§! devotion point in a random ['concept_path_effect'], gain §G3§! devotion points in a random ['concept_path_effect']."
xinghe.213.b:"Leave."
xinghe.213.b.tt:"Gain 80 ['concept_yuzhousuipian']"
xinghe.213.c:"Exchange your "memories"."
xinghe.213.c.tt:"Lose §G1§! devotion point in a random ['concept_path_effect'], gain §G4§! devotion points in a random ['concept_path_effect']."
xinghe.213.d:"Tell your story! Then plunder "interesting experiences" from the carriage."
xinghe.213.d.tt:"Gain §G4§! devotion points in ['concept_xunlie_effect']."
xinghe.214_title:"Rift Reminiscence - Robot Sales Terminal"
xinghe.214_desc:"You see a cute robot waving at you. As you approach, it speaks: "Welcome to the Interastral Peace Corporation sales terminal! We have everything you desire!" On the menu, you see medical, enhancement, and purchase services, with reasonable prices..."
xinghe.214.a:"Exchange for blessings."
xinghe.214.a.tt:"Consume 50 ['concept_yuzhousuipian'], gain §G3§! devotion points in a random ['concept_path_effect']."
xinghe.214.b:"Leave."
xinghe.214.b.tt:"Gain 80 ['concept_yuzhousuipian']"
xinghe.214.c:"Devour the terminal's "protective net"."
xinghe.214.c.tt:"Gain §G3§! devotion points in a random ['concept_path_effect']."
xinghe.214.d:"Recall the "bargaining skills" you had forgotten."
xinghe.214.d.tt:"Consume 50 ['concept_yuzhousuipian'], gain §G4§! devotion points in a random ['concept_path_effect']."
xinghe.214.e:"Ask about *after-sales service*."
xinghe.214.e.tt:"Consume 50 ['concept_yuzhousuipian'], gain a ['concept_random_common_curiosity_get']."
xinghe.1000_title:"Trapped Locusts"
xinghe.1000_desc:"As we sealed the Stellaron on [This.GetName], our detectors simultaneously captured locusts. Soon after, the freed locust swarm attacked our equipment. We'd better send a fleet to eliminate them immediately."
xinghe.1000.a:"Oh no..."
xinghe.1010_title:"Dangerous Robot Fleet"
xinghe.1010_desc:"After we sealed the Stellaron on [This.GetName], we received a message from a robot fleet. They ordered us to leave, claiming we had violated their territory, and began indiscriminate attacks in the system!"
xinghe.1020_title:"Demons"
xinghe.1020_desc:"A group of demons, after gaining their freedom, rushed at our equipment and began attacking indiscriminately. We must deal with them!"
xinghe.1030_title:"Angry Aliens"
xinghe.1030_desc:"As we sealed the Stellaron on [This.GetName], the civilization on [This.GetName] became enraged. They began attacking our equipment in the system aggressively and declared their intention to conquer the universe."
xinghe.1030.a:"A bunch of strange people."
xinghe.1040_title:"A Dragon is Here"
xinghe.1040_desc:"A dragon, a celestial dragon, stares at us fiercely. It seems to have been hungry for a long time. It has already begun attacking our facilities."
xinghe.1050_title:"Sealing Failed"
xinghe.1050_desc:"Our sealing operation failed! Instead, the Stellaron absorbed our energy and began summoning demons to attack us. We must stop their counterattack!"
xinghe.1050.a:"Act immediately!"
