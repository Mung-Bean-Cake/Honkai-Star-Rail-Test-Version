 #Trailblazer
NAME_kaituozhe:"Trailblazer"
kaituozhe_catch_phrase:"No need to cling to yesterday."
kaituozhe_backstory:"To eliminate the crisis brought by the Stellaron, the young Trailblazer chose to journey with the Astral Express."
hsr_paragon.62.name:"Astral Express - Trailblazer"
hsr_paragon.62.a:"First Meeting"
hsr_paragon.62.a.response:"When you have a chance to choose, don't make yourself regret it..."
hsr_paragon.62.b:"Reminiscence • Pom-Pom"
hsr_paragon.62.b.response:"Although Pom-Pom says he's unhappy, his body reacts honestly. We should visit Pom-Pom more often!"
hsr_paragon.62.c:"Reminiscence • The Train"
hsr_paragon.62.c.response:"If I hadn't chosen to board the train, what kind of life would I have lived... no, there is no "if"."
leader_kaituozhe_t1:"§MGathering Momentum§!"
leader_kaituozhe_t1_desc:"Seize the opportunity."
leader_kaituozhe_t2:"§MUndying Triple Strike§!"
leader_kaituozhe_t2_desc:"Let's finish this quickly."
leader_kaituozhe_t3:"§MStarlight Descending upon All Worlds§!"
leader_kaituozhe_t3_desc:"Reach the ending with your own will."
leader_kaituozhe_t4:"§MStardust Trump Card§!"
