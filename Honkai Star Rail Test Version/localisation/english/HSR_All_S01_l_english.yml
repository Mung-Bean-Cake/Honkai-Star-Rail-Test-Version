SR_Paragon.101.name:"Warp: Invite a Pathstrider"
SR_Paragon.101.desc:"Pathstrider: Those who walk upon a Path and draw power from it. In the vast universe, there are endless unknowns and possibilities. Civilization's exploration of the cosmos is not only a breakthrough in science and technology but also an infinite extension of the spirit and wisdom of civilization. Today, we stand at a new starting point, facing unprecedented opportunities and challenges. On this road to the sea of stars, we should invite Pathstriders — those brave and adventurous souls — to join us in this great journey."
SR_Paragon.101.a:"Fate decrees"
SR_Paragon.101.b:"Fate decrees"
SR_Paragon.101.c:"Fate decrees"
SR_Paragon.101.d:"Fate decrees"
SR_Paragon.101.e:"Fate decrees"
SR_Paragon.101.f:"Fate decrees"
SR_Paragon.101.g:"Fate decrees"
SR_Paragon.101.h:"Fate decrees"
SR_Paragon.101.i:"Fate decrees"

SR_Paragon.001.name:"Pathstrider"
SR_Paragon.001.desc:"Pathstrider"
SR_Paragon.001.a:"Who are you"
SR_Paragon.001.a.response:"I am a Pathstrider"
SR_Paragon.001.b:"Where do you come from"
SR_Paragon.001.b.response:"I come from the sea of stars"
SR_Paragon.001.c:"Where are you going"
SR_Paragon.001.c.response:"I am going to where you are"

SR_Paragon_March_7th:"Pathstrider: March 7th"
SR_Paragon_March_7th_desc:"An eccentric girl who considers herself passionate about all the things a girl her age "ought to be" passionate about, like photography. She awoke from a piece of drifting eternal ice, yet found herself with no memory of her past. After a brief period of dejection, she decided to name herself after the date of her rebirth. On that day, March 7th was "born"."
SR_Paragon_Himeko:"Pathstrider: Himeko"
SR_Paragon_Himeko_desc:"An adventurous scientist who, in her youth, encountered the stranded Astral Express in her homeland. At that time, something on the train showed her the world beyond her planet, the universe. Years later, when Himeko finally repaired the train and set sail into the stars, she realized that this was only the beginning. On the path of "Trailblazing" new worlds, more companions are needed — even if those who travel together face different directions, they are still under the same starry sky."

SR_Paragon_Welt:"Pathstrider: Welt"
SR_Paragon_Welt_desc:"A seasoned and steady former leader of Anti-Entropy, who inherited the name "Welt" and has saved the world from the brink of destruction many times. After the St. Fontaine incident, Welt was forced to travel through the Stargate with the instigator. Perhaps even he did not expect that what awaited him there would be a brand new journey and companions."

SR_Paragon_Kafka:"Pathstrider: Kafka"
SR_Paragon_Kafka_desc:"In the Interastral Peace Corporation's wanted files, only Kafka's name and "hobby of collecting coats" are recorded. Little is known about this Stellaron Hunter, except that she is one of the most trusted members of "Destiny's Slave" Elio. To reach the "future" foreseen by Elio, Kafka begins to act."

SR_Paragon_Silver_Wolf:"Pathstrider: Silver Wolf"
SR_Paragon_Silver_Wolf_desc:"A super hacker who treats the universe as a game. No matter how formidable the defense system, Silver Wolf can easily crack it. Her data battles with Screwllum of the Genius Society have already become legends in the hacking world. How many more levels are there in the universe to conquer? Silver Wolf is quite looking forward to it."

SR_Paragon_Acheron:"Pathstrider: Acheron"
SR_Paragon_Acheron_desc:"A traveler who claims to be a "Galactic Ranger", real name unknown. She carries a long blade, wandering the galaxy alone. She is taciturn and her sword strikes like purple lightning, yet she always fights with the scabbard, never drawing it."

SR_Paragon_Firefly:"Pathstrider: Firefly"
SR_Paragon_Firefly_desc:"A Stellaron Hunter, fighting in the mechanical armor "Sam". Loyal to her missions, she has a strong will. Born as a weapon to defeat the Swarm, she grows at an abnormal rate and lives a very short life. She joined the Stellaron Hunters in search of a chance to "live", seeking a way to defy fate."

SR_Paragon_Jingliu:"Pathstrider: Jingliu"
SR_Paragon_Jingliu_desc:"A former Sword Champion of the Luofu, who created the undefeated legend of the Cloud Knights. Now her name has been erased, and she has become a traitor to the Xianzhou, walking on the edge of Mara."

SR_Paragon_Ruan_Mei:"Pathstrider: Ruan Mei"
SR_Paragon_Ruan_Mei_desc:"A gentle and elegant scholar, member #81 of the Genius Society, an expert in life sciences. With her talent and astonishing perseverance, she caught the attention of Nous, and began her research and exploration into the origin of life in secret corners. She was invited by Herta, together with Screwllum and Stephen, to jointly develop the "Simulated Universe". In private, she enjoys traditional drama and pastries, and is also interested in embroidery."


