#Legend of Stormterror Dvalin
# OT_SR_Dvalin_ScriptD_# l_simp_chinese: New file"Stormterror"

# Ships
Dvalin_General:"Stormterror"
Dvalin_General_desc:"In the long years and boundless darkness, clear gems will be tarnished and grow dim, and proud dragons will be eroded and filled with resentment. However, remember that dust can be easily wiped away, and doubts and poisons can also be shattered. This is the advice of a friend of mine, although I always thought he was idle and not a wise man. But without his help, there would be no me today. He once wrote a poem: Fly freely in the deep sky. Just like when we first met, I walked on the earth singing songs of the wind; you looked down upon the world from the rarefied sky above. Now there is no wind and snow in the sky, and the earth is full of green grass. It must be beautiful. If you had walked on the ground, heard the distant songs of shepherds and wind chimes, tasted wine as sweet as honey, you would understand. If you had been me, and seen your solitary figure gliding across the blue sky, and witnessed your beauty, you would understand. Then you would know that such a sky and earth are worth fighting for. However, all of this is gone, and he is no longer here."
NAME_Dvalin_General:"Stormterror"
FML_COMPUTER2:"Combat Computer: Artillery"
FML_WEAPON:"Dragon's Breath"
