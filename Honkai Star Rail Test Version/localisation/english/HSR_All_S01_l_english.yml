tr_cunhu_huanyu_1:"§BDreamweaver§!"
tr_cunhu_huanyu_1_flavor:"Clap your hands, and towering skyscrapers rise, sheltering all. Blink, and birds circle in the wind, dead wood blossoms. You knead the dreams in your palm like clay, freely deforming it until the waves of imagination crash upon the shore, time stops, and the story remains in its most beautiful moment. At this moment, nightmares and memes are expelled, peace and tranquility never end. At this moment, twelve hours shimmer in the sky, a colorful feast revels all night. You create a living world that grows with joy, protecting the smiling faces of people in their dreams. The stars sing and sing, sending down a gentle rain; you stand unsheltered in the song, bathing in the violet dawn."
