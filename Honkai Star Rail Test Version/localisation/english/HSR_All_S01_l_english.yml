#Black Swan
NAME_heitiane:"Black Swan"
heitiane_catch_phrase:""Life is a winding labyrinth; apart from memory, we have nothing.""
heitiane_backstory:"A Memokeeper of the "Garden of Recollection", a mysterious and elegant fortune-teller. Often wearing a gentle smile, she patiently listens to others' words and thereby enters "Remembrance" to grasp all information. She is passionate about collecting unique memories, but her underlying thoughts are hard to discern."
hsr_paragon.39.name:"Penacony - Black Swan"
hsr_paragon.39.a:"First Meeting"
hsr_paragon.39.a.response:"Trailblazer? Interesting name, and, hmm, a fate difficult to see through."
hsr_paragon.39.b:"Hobbies"
hsr_paragon.39.b.response:"If I can discover and collect a memory before anyone else, the time I spend appreciating it alone is my most cherished, unique recollection."
hsr_paragon.39.c:"Observations"
hsr_paragon.39.c.response:"Some Memokeepers like to secretly enter others' minds and tamper with their memories... but I don't like doing that at all. Only unaltered memories are truly authentic and precious; otherwise, they are just thoughts inserted into your head by others."
leader_heitiane_t1:"§MFall, Twilight of the False Gods§!"
leader_heitiane_t1_desc:"'To see these "memories", what price must I pay?' 'Before you are willing to appear, people will never know of your existence.' 'Just as people never knew swans came in colors other than white before seeing a black swan?' 'Just like that.'"
leader_heitiane_t2:"§MLoom of Unforeseen Fate§!"
leader_heitiane_t2_desc:""People think they are facing the present and the future, but none know that we are all actually walking toward the past.""
leader_heitiane_t3:"§MTears, also a gift§!"
leader_heitiane_t3_desc:""But dreams... are also a form of memory. Before those memory thieves and incinerators arrive, I will dive into the deep sea to see the wreckage.""
leader_heitiane_t4:"§MEnchanted by the Arms of the Other Shore§!"
leader_heitiane_t4_desc:"The destined course has already revealed itself."
leader_heitiane_t5:"§MReshaping the Memory of Time§!"
leader_heitiane_t5_desc:"Beneath the silent water's surface... is an endless abyss."
