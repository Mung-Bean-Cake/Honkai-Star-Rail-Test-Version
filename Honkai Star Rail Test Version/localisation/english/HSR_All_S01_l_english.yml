tr_cunhu_huimie_1:"§BUnsinkable Flagship§!"
tr_cunhu_huimie_1_flavor:"You have a beautiful dream, toasting with friends under three suns, to great peace! The dome covering the sky embraces the planet, shielding it from scorching light and heat — your masterpiece, which you then witness shattering at dawn. Collapse, screams, the gamma-ray burst of a supernova — your eyes, hands, and every cell in your body wail; the villains ignited the atmosphere, and the tower that stood for 290 Amber Eras turned to ashes. The germs of death dance on the ice crystals of the Smea Ring. You swear to make them pay tenfold. You sketch with your pen a colossal ship that burns the galaxy, its artillery burning the malice of the night. Before all you love turns to ruin, bring necessary destruction to the enemy."
