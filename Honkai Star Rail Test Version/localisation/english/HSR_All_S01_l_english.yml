 #Systems
NAME_lieixi:0 "Rift"
yaliluo_system_initializer_NAME:0 "Jarilo"
yaliluo_system_initializer_DESC:0 "Most historians date Jarilo-VI's planetary history to the mythical wars over a thousand years ago, between the eleven states of Perun and the Veles Collective. The war was long and fierce, until an early spring changed the course of the war, and the Veles won decisively. They attributed the defeat of their old enemies to the spring war god Jarilo, and used the same name in a poem praising the earth. The planet's recorded name — "Jarilo-VI" — may be a mistranslation of a poetic verse."
