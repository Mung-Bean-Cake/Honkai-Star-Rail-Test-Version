MESSAGE_MONIYUZHOU_BATTLE_XINGHE_DESC:"Our ships have discovered a Stellaron, a highly aggressive phenomenon that infects neighboring worlds like cancer cells spreading across the universe."
xinghe_small_storm: "§3Stellaron Storm§!"
xinghe_small_storm_desc: "A mysterious phenomenon that began appearing in Amber Era 2147. On the interstellar routes created by "Trailblaze", some obscure substances have disrupted the flow of imaginary energy. It is like encountering a cliff on a mountain climb, a maelstrom on a voyage — once-smooth interstellar journeys become perilous and uncertain. This phenomenon is highly aggressive, infecting neighboring worlds in the form of mysterious objects known as "Stellarons" — like cancer cells spreading across the universe."
xinghe_small_storm_color_tooltip: "§3Stellaron Storm§!"
xinghe_small_storm_lore_description:"§LA powerful Stellaron storm is about to pass through this system, potentially causing extreme effects on planets and passing ships. Seek shelter.§!"
xinghe_small_storm_fleet_tt:"—Sublight Speed: §R-25%§!\n—Sensor Range: §R-5§!\n—Ship Hyperlane Detection Range: §R-5§!\n—$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ §Rdisabled§! on ships and stations.\n—Ships and stations suffer §R50§! $MOD_SHIP_SHIELD_ADD$ damage per month."
