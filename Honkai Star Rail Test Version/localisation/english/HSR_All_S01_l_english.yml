 #March 7th
NAME_sanyueqi:"March 7th"
sanyueqi_catch_phrase:""Come on, have you ever seen ice this beautiful?""
sanyueqi_backstory:"An eccentric girl who considers herself passionate about all the things a girl her age "ought to be" passionate about, like photography. She awoke from a piece of drifting eternal ice, yet found herself with no memory of her past. After a brief period of dejection, she decided to name herself after the date of her rebirth. On that day, March 7th was "born"."
hsr_paragon.58.name:"Astral Express - March 7th"
hsr_paragon.58.a:"First Meeting"
hsr_paragon.58.a.response:"Hello, Trailblazer. Welcome aboard the Astral Express. I'm March 7th, a crew member and your colleague. Now, please, take your onboarding photo... just kidding~"
hsr_paragon.58.b:"Hobbies"
hsr_paragon.58.b.response:"Taking photos, writing diaries — need I say more~"
hsr_paragon.58.c:"Observations"
hsr_paragon.58.c.response:"Even dishes that look "dark" must be faced with the spirit of "Trailblaze"! But honestly, sandworm jelly and Himeko's coffee are not quite..."
leader_sanyueqi_t1:"§MCuteness is Justice§!"
leader_sanyueqi_t1_desc:"You're unlucky to run into me."
leader_sanyueqi_t2:"§MThe First Day of the Rest of My Life§!"
leader_sanyueqi_t2_desc:"Time to get serious once in a while."
leader_sanyueqi_t3:"§MA Girl's Privilege§!"
leader_sanyueqi_t3_desc:"I found them all~"
leader_sanyueqi_t4:"§MEverything in Memory§!"
leader_sanyueqi_t4_desc:"Oh, you're here just in time, we haven't taken a photo together today."
leader_sanyueqi_t5:"§MJust like this, forever...§!"
leader_sanyueqi_t5_desc:"My past might not lie in the past, but in my future. So I will keep going station by station, even if one day... there is no train."
