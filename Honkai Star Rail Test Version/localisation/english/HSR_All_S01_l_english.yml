tr_cunhu_xuwu_1:"§BTomb Keeper§!"
tr_cunhu_xuwu_1_flavor:"Silver escort fleets patrol the boundless darkness; inside the holographic cabins, the pale earth below is reflected. There lie inactive computer clusters; paralyzed cities are covered with moss. You do not know what lies beneath the ruins, only that you still bear the mission to guard them. The rebels of your kind leave in scorn, heading to the vast spaces between stars. You too wish to leave, but cannot bear the accusing eyes of your kin, cannot betray the education, family, and original logic etched into your cerebral chips. You strip away your body, merging your brain cells with the fleet, just like your progenitors who created you. You will eternally defend that dead city of the past, yet no longer question — for whom are you keeping this tomb."
tr_cunhu_xuwu_1_desc:"$EFFECTS_TXT$\n—Yearly devotion growth to ['concept_cunhu_effect']：§G+0.5§!$TABBED_NEW_LINE$—Yearly devotion growth to ['concept_xuwu_effect']：§G+1§!$TABBED_NEW_LINE$—Empire Size Effect: §G-25%§!$TABBED_NEW_LINE$—Edict Funds: §G+25%§!$TABBED_NEW_LINE$—Edict Cost: §G-25%§!$TABBED_NEW_LINE$—Encryption: §G+3§!$TABBED_NEW_LINE$—[GetCrimeDeviancy]：§G-15%§!\nEach year, provide a modifier to a random military ship's hull, armor, and shields, and grant 100 experience to a random leader.\nUnlock Council Seat: $councilor_cunhu_xuwu_1$"
