#Events
SR_belobog.2.title:0 "The Spark Plan"
SR_belobog.2.desc:0 "As early as a dozen years ago, social discourse about an impending apocalypse emerged. Those claims diminished over time, but have recently become a hot topic again.\nPublic concern points to a huge problem. Scientific circles have indicated that, based on current data, before the planet's natural disasters subside to a level where we can develop on the homeworld, the resources needed to sustain civilization will be exhausted. Additionally, the Silvermane Guards at the front continuously report that the Rift erosion shows no sign of abating. Meanwhile, our efforts to regulate internal affairs have not fully succeeded. At this rate, we will eventually face a crisis.\nFortunately, the Stellaron problem has long been resolved. After extensive discussion, we have found a way out — using the remaining resources to venture into the vast cosmos, using resources beyond the homeworld to sustain our civilization. Two paths lie before us: either the entire nation leaves the homeworld and re-establishes a colony on a suitable planet, or we bring resources from the universe back to fight the difficulties on our homeworld. In any case, we must keep the spark of civilization alive."
SR_belobog.2.a:0 "Understood"
SR_belobog.2.a.desc:0 "Determine the direction of the plan to unify social forces."
SR_belobog.3.title:0 "Final Decision"
SR_belobog.3.desc:0 "After a period of publicity and debate, we have successfully determined a direction for the plan.\nNow, various sectors of society have proposed a range of plans, and the public is closely watching the progress."
SR_belobog.3.a:0 "That's settled."
SR_belobog.3.a.desc:0 "With sufficient conditions, we can develop areas beyond Belobog. While exploring and expanding into the universe, gradually developing the homeworld and improving the environment is an essential step to prevent its destruction."
SR_belobog.4.title:0 "Intense Discussion"
SR_belobog.4.desc:0 "Although we have not publicly commented on the doomsday topic for a long time, the evidence is clear and the matter severe, so public discussion has never ceased.\nUnfortunately, perhaps our prolonged silence has incited public resentment; a large number of people have expressed their urgency and the results of social debate through various means.\nIn any case, the situation has indeed reached a point where action must be taken. We'd better start responding immediately, or the entire civilization will be in our hands."
SR_belobog.4.a:0 "Alright"

SR_belobog.10.title:0 "New Rift Research Project Unlocked"
SR_belobog.10.desc:0 "We have a new Rift research project awaiting action."
SR_belobog.10.a:0 "Understood"
SR_belobog.11.title:0 "Rift Research Completed"
SR_belobog.11.desc:0 "Our decision to invest substantial resources has proven correct. The relevant research teams have successfully unlocked a significant portion of the Rift's secrets, and that is sufficient.\nPeople are enthusiastically discussing the uses of the new findings. In fact, this means we can finally take measures against the Rift's erosion."
SR_belobog.11.a:0 "That's good news."
SR_belobog.12.title:0 "Rift Research Completed"
SR_belobog.12.desc:0 "Our research teams have conducted extensive experiments on Rift creatures. These experiments have further revealed the Rift's operating principles and increased our understanding of Rift creatures.\nThe new findings not only help suppress the Rift but also provide reference for military operations."
SR_belobog.12.a:0 "The Silvermane Guards will appreciate this."
SR_belobog.13.title:0 "Rift Research Completed"
SR_belobog.13.desc:0 "Although fully understanding the deepest principles of the Rift is still difficult for our scientists, developing new methods to control the Rift under different conditions turned out to be surprisingly easy. During the special project, various research teams successively announced their latest results, attracting widespread attention and discussion. The project has essentially achieved its goals, and we can now control every Rift on the planet."
SR_belobog.13.a:0 "Time to prepare for a big move."
SR_belobog.14.title:0 "Rift Research Completed"
SR_belobog.14.desc:0 "Surveying the entire planet under its harsh environment is no easy task. Our brave expedition teams ventured into the snow and ice outside the city; for areas truly inaccessible, we used orbital facilities for scanning.\nThe data obtained is astonishing in various ways, yet expected. With some time to organize the data and formulate a detailed plan, the final step of eliminating the Rift can begin."
SR_belobog.14.a:0 "Something big is coming."
SR_belobog.15.title:0 "Rift Elimination Complete"
SR_belobog.15.desc:0 "We encountered many issues during the execution of the plan. But in any case, we have successfully eliminated all existing Rifts.\nSome areas still show signs of Rift recurrence and expansion, but under our control, they are not a threat. Rift creatures have lost their habitat and will soon disappear completely."
SR_belobog.15.a:0 "Hopefully the Rift won't return."

SR_belobog.20.title:0 "New Cold Snap Research Project Unlocked"
SR_belobog.20.desc:0 "We have a new cold snap research project awaiting action."
SR_belobog.20.a:0 "Understood"
SR_belobog.21.title:0 "Foothold in the Snow and Ice"
SR_belobog.21.desc:0 "After careful design and calculation, our research teams have proposed various plans to develop an area outside Belobog in the snow and ice, and maintain it until it becomes a new city. Some teams have selected a typical area for a trial, establishing a foothold with stable resource supply and living conditions. Now, though challenges remain, developing wasteland outside Belobog is no longer an impossibility."
SR_belobog.21.a:0 "A good attempt."
SR_belobog.22.title:0 "Successful Attempt"
SR_belobog.22.desc:0 "We organized a large force and carried out a massive construction project outside the city. The result proved our plan successful: a base outside Belobog is now ready to develop into a district.\nFollowing this method, we can expand outside the city without worrying about the snow and wind."
SR_belobog.22.a:0 "Well done."
SR_belobog.23.title:0 "Ruins Research Completed"
SR_belobog.23.desc:0 "The expedition teams, with great difficulty, traversed the harsh snow and ice, using the latest technology. After a period of arduous exploration and excavation, they successfully brought back materials and artifacts from the ancient ruins. These precious pieces of knowledge have brought us tremendous progress; it is hard to imagine how much the Stellaron disaster set us back."
SR_belobog.23.a:0 "Good news."
SR_belobog.24.title:0 "Planetary Survey Completed"
SR_belobog.24.desc:0 "Normally, the melting of global ice would cause a series of environmental problems and natural disasters. But perhaps because the ice came from a special source, they simply vanished without causing such issues.\nFor the areas that were ice-covered, they undoubtedly experienced an unparalleled disaster, completely destroying the original environment. Perhaps their form was preserved by the ice, but restoring the ecology after the planet's thaw is a huge problem."
SR_belobog.24.a:0 "We need advanced technology."
SR_belobog.25.title:0 "Ocean Restored"
SR_belobog.25.desc:0 "After countless efforts, we have finally completed this great project — restoring our homeworld, this frozen ocean world, from the cold snap. When the last piece of ice melted, although the ocean world was no longer as vibrant, we felt immense excitement and pride.\nIn these few short decades, we relied on firm belief and unremitting effort, always guarding our civilization and protecting our home. Now, we can finally put down our burdens and welcome new hope for the future.\n\nMay this become our eternal memory."
SR_belobog.25.a:0 "Finally."

SR_belobog.31.title:0 "Blockers Fully Removed"
SR_belobog.31.desc:0 "Through our tireless efforts and the difficult struggle of the entire civilization, we have finally removed all blockers on Jarilo-VI. This is the most critical step toward restoring the homeworld.\nNow, the planet's climate is gradually turning back to its original state, but we can still find areas that remain unchanged or affected. Once we understand everything about the Rift and the cold snap, we can make them disappear from the homeworld entirely."
SR_belobog.31.a:0 "A great victory!"
SR_belobog.31.b:0 "The will of Preservation!"

SR_belobog.51.title:0 "Suppress the Rift"
SR_belobog.51.desc:0 "Ever since the Stellaron was removed, the Rift has been naturally receding. But neither its rate of disappearance nor its occasional resurgence has been satisfactory. By now, we should begin preparing for actions such as clearing Rift monsters on the homeworld.\nIn our long-term experience with the Rift, we have gradually developed some methods to suppress its expansion and accelerate its retreat. These methods are currently applied to civilian and informal affairs, but with limited effectiveness. Clearly, we need stronger measures to suppress the Rift, otherwise we will face great difficulties in the future.\nFurther research on the Rift can increase our understanding, develop more effective methods, or extract useful things from the Rift."
SR_belobog.51.a:0 "This will be a long-term task."
SR_belobog.51.b:0 "Just enough to ensure our evacuation."
SR_belobog.52.title:0 "The Rift's Disappearance"
SR_belobog.52.desc:0 "A dozen years ago, we launched this project to control the Rift on the homeworld; now, the project is approaching its end. Through our long-term efforts, the remaining Rifts are rapidly receding, no longer needing our help.\nAs the Rift recedes, the remaining Rift monsters will also gradually disappear, and their combat effectiveness will plummet — this is an excellent opportunity to launch a final assault. Additionally, if any Rift still impedes our development, it will become easy to remove."
SR_belobog.52.a:0 "This is a perfect ending."
SR_belobog.53.title:0 "Rift Control Failure Leads to Severe Survival Problems"
SR_belobog.53.desc:0 "The current situation was foreshadowed not long ago. The Rift has once again invaded our activity zones, forcing residents to abandon some land and causing trouble for the Silvermane Guards. Rift monsters are more active than ever, repeatedly threatening our defenses.\nThe situation is now even more serious than before. It is certain that if we wait any longer, we will not only lose all development achievements on the homeworld, but also have to evacuate Belobog. In that case, our plan to restore the homeworld will be a complete failure. If we don't want to see that day — which will come within the next few months — we must immediately take the strongest measures to salvage the current suppression failure."
SR_belobog.53.a:0 "This is not what we expected..."
SR_belobog.54.title:0 "Rift Severely Affects People's Lives"
SR_belobog.54.desc:0 ""
SR_belobog.54.a:0 "We must address this."
SR_belobog.55.title:0 "Rift Control Victory in Sight"
SR_belobog.55.desc:0 ""
SR_belobog.55.a:0 "We need to persevere."
SR_belobog.61.title:0 "Rift Blocker Generated"
SR_belobog.61.desc:0 "Due to continuous Rift growth, a new Rift blocker has formed on the homeworld."
SR_belobog.61.a:0 "Understood"
SR_belobog.62.title:0 "Rift Blocker Disappeared"
SR_belobog.62.desc:0 "Thanks to our suppression, a Rift blocker on the homeworld has naturally disappeared."
SR_belobog.62.a:0 "Understood"

SR_belobog.81.title:0 "Rift Erosion"
SR_belobog.81.desc:0 "We failed.\nOur homeworld has been completely consumed by the Rift; all land and civilization have vanished. In the final moments, residents scrambled to flee, boarding rescue ships. But in the end, even the rescue ships on the ground could not escape. We could do nothing.\nThe attempt to suppress the Rift failed. Perhaps we should have invested more resources and effort; perhaps we underestimated the Rift's threat. If we had done more, maybe this wouldn't have happened.\nShortly before the disaster, we declared a state of emergency and mobilized all available forces, but it was too late, useless. Now, [root.capital_scope.GetLeaderName] can only watch Belobog be devoured by the Rift, waiting for it to reach them. The plan to restore the homeworld has failed; we are forced to find a foothold on other planets. But in any case, everything on the homeworld is gone."
SR_belobog.81.a:0 "This is probably the worst outcome."
