#Gallagher
NAME_jialahe:"Gallagher"
jialahe_catch_phrase:"Among the Five Families, the "Bloodhounds" bear the duty of guarding the homeland. That means... all troublemakers are my business. Making someone disappear is much easier than making them appear."
jialahe_backstory:"A sheriff of the Bloodhound Family in Penacony, also a slovenly and casual mixologist. Dressed casually and mixing drinks carelessly, he treats guests with courtesy but remains wary. He seems to have many past stories, but never brings them up."
hsr_paragon.41.name:"Penacony - Gallagher"
hsr_paragon.41.a:"First Meeting"
hsr_paragon.41.a.response:"I'm Gallagher, one of the "Bloodhounds" here. Welcome to the dreamland "Penacony", newbie Nameless."
hsr_paragon.41.b:"Hobbies"
hsr_paragon.41.b.response:"Mixing drinks is a matter of sensibility. Mixing soda in a dream requires adding the current mood — if feeling down, make it richer; if happy, make it sweeter... Mixing drinks is also mixing life."
hsr_paragon.41.c:"Observations"
hsr_paragon.41.c.response:"If you ever see a crazy teapot, or a crawling telephone booth — you've probably run into the mischief of the "Dreamjolt Troupe". Don't worry, you won't die, at worst you'll lose a layer of skin."
leader_jialahe_t1:"§MSalt and Dog§!"
leader_jialahe_t1_desc:"No matter how much time passes, the taste of SoulGlad remains consistently stable... that's the charm of additives."
leader_jialahe_t2:"§MHops Surge§!"
leader_jialahe_t2_desc:"Be careful not to sink too deep into the sweet dream."
leader_jialahe_t3:"§MCanned Special Mix§!"
leader_jialahe_t3_desc:"Intuition, instinct... they can all be trained."
leader_jialahe_t4:"§MLast Whisper§!"
leader_jialahe_t4_desc:"Need I say more? I trust muscle memory more."
leader_jialahe_t5:"§MBlood and Sand§!"
leader_jialahe_t5_desc:"When there were still paths among the stars, this world also bore the footprints of the Nameless. Unfortunately, Penacony never remembered a single one of those names."
