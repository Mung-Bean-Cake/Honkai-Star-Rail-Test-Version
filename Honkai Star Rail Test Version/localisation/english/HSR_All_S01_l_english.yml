#trait
trait_IPC_Better_Trader:0"Trade Tradition"
trait_IPC_Better_Trader_desc:0"This species developed prosperous trade before even achieving civilization; trade has become a tradition deeply embedded in their culture."
trait_IPC_Work_Much_Harder:0"Loves Overtime"
trait_IPC_Work_Much_Harder_desc:0"This species considers overtime a matter of course, and some are even addicted to it. However, excessive overtime lowers their fertility."
trait_IPC_No_Baby:0"Self-Reliant"
trait_IPC_No_Baby_desc:0"This species had a habit, before civilization, of abandoning children after birth, which increased infant mortality but effectively reduced the cost of living after adulthood."
trait_IPC_Best_Trader:0"Marketing Genius"
trait_IPC_Best_Trader_desc:0"With just a little more gene point investment, you get a trait twice as strong as the 2-point trade value bonus trait!"
trait_IPC_Live_Much_Harder:0"Ultimate Striver"
trait_IPC_Live_Much_Harder_desc:0"This species can adapt to harsh environments and monotonous lives, striving to improve their status by conserving resources, working hard, and studying."
trait_IPC_Better_Miner:0"Master Builder"
trait_IPC_Better_Miner_desc:0"This species once glimpsed the great work of the Preservation Aeon, and received teachings that are engraved in their genes."
TRAIT_Expensiver_Slave:0"This species' price on the slave market is increased by 2500 energy credits"
trait_IPC_Expensive_Goods:0"Hot Commodity"
trait_IPC_Expensive_Goods_desc:0"Perhaps because they look good, perhaps because they are very useful, in any case this species is always in high demand on the slave market."
trait_IPC_NeverGonna_GiveUp:0"Self-Defense Tradition"
trait_IPC_NeverGonna_GiveUp_desc:0"This species has an instinct to spontaneously form self-defense units, an instinct that has saved their group many times during their evolutionary journey."
trait_IPC_NeverGonna_RunAround:0"Rather Die Than Surrender"
trait_IPC_NeverGonna_RunAround_desc:0"This species displays astonishing strength and courage when resisting oppression and invasion."
trait_IPC_Better_Alloys:0"Builder Ambition"
trait_IPC_Better_Alloys_desc:0"This species was once directly influenced by the Preservation Aeon at close range, and now the entire species is enthusiastic about building grand works."
trait_IPC_Life_Saver:0"Life Saver"
trait_IPC_Life_Saver_desc:0"This species possesses structures that assist medical services, and their nervous systems grant them the ability to perform delicate medical operations."
trait_IPC_Better_Writer:0"Gifted Writer"
trait_IPC_Better_Writer_desc:0"This species' cultural workers often create outstanding works. Their literary and artistic creations have repeatedly driven social change throughout their civilization's development."
trait_IPC_Better_Idol:0"Performance Gene"
trait_IPC_Better_Idol_desc:0"This species' performances — singing, dancing, releasing pheromones, etc. — have a captivating charm, often leaving other species' counterparts light-years behind."
IPC_Good_For_Idol:0"Idols are also a type of entertainer"
mod_planet_jobs_entertainer_produces_mult:0"Entertainer output"
mod_planet_jobs_culture_worker_produces_mult:0"Cultural Worker output"
mod_planet_jobs_culture_worker_society_research_produces_mult:0"Cultural Worker £society£ output"
mod_planet_jobs_healthcare_produces_mult:0"Medical Worker output"

#tradition
tradition_IPC:0"Corporation"
tradition_IPC_desc:0"The Interastral Peace Corporation at your service!"
tr_IPC_adopt:0""
tr_IPC_adopt_desc:0""
tr_IPC_finish:0""
tr_IPC_finish_desc:0""
allow_IPC_Bduilings:0"I plan to add some new buildings here, but I haven't finished them yet"
tr_ipc_infi_expressnetwork:0"Interstellar Express Network"
tr_ipc_infi_expressnetwork_desc:0""
tr_ipc_infi_expressnetwork_delayed:0"Over our long history of trade, a magnificent interstellar express network has gradually taken shape, allowing our customers to receive ordered goods faster, and thus earning us more energy credits."
tr_ipc_infi_investdevelopmentofstar:0"Invest in Planet Development"
tr_ipc_infi_investdevelopmentofstar_desc:0""
tr_ipc_infi_investdevelopmentofstar_delayed:0"Some civilizations damage other planets for profit, and some empires even damage their own planets for short-term gain. We, on the other hand, realize that only by making ourselves and our friends prosperous can we have money to earn."
tr_ipc_infi_eliteloan:0"Interstellar Loan Industry"
tr_ipc_infi_eliteloan_desc:0""
tr_ipc_infi_eliteloan_delayed:0"If everyone lived within their means, who would buy our goods? In order to sell more goods, we have developed a mature consumer loan system. Its purpose is not to make direct profit, but to indirectly earn money by squeezing consumers' spending power."
tr_ipc_infi_spreadcreditpoints:0"Promote Credits"
tr_ipc_infi_spreadcreditpoints_desc:0""
tr_ipc_infi_spreadcreditpoints_delayed:0"If there were a common currency in the galaxy, it would definitely make our trade more prosperous. We cannot create it alone, but we can try."
tr_ipc_infi_moreinvolution:0"Encourage Involution"
tr_ipc_infi_moreinvolution_desc:0""
tr_ipc_infi_moreinvolution_delayed:0"Earning money with strength gives peace of mind, which has become the life philosophy of countless alien beings. Of course, it is they who put in the effort; our corporation's members just enjoy the fruits of alien labor with gratitude."
tradition_Interastral:0"Interstellar"
tradition_Interastral_desc:0"The road to the brilliant stars is wide open, let us go into the boundless universe to practice the Path of Preservation!"
tr_interastral_expand_faster:0"Land Grabbing Fever"
tr_interastral_expand_faster_desc:0""
tr_interastral_expand_faster_delayed:0"As our galactic exploration progresses, we have become increasingly enthusiastic about building outposts in star systems to "claim sovereignty". This behavior is like children writing their names on new toys, both naive and adorable."
tr_interastral_sell_stars:0"Interstellar Investment"
tr_interastral_sell_stars_desc:0""
tr_interastral_sell_stars_delayed:0"Stocks of alien mining and research stations are skyrocketing, while stocks of our homeworld's mining are plummeting. Everyone believes that homeworld mining will soon die, and that outer space mining will enjoy great prosperity. This investment enthusiasm for alien mining is sure to promote our interstellar exploration."
tr_interastral_invest_base:0"Base Industry Prosperity"
tr_interastral_invest_base_desc:0""
tr_interastral_invest_base_delayed:0"Our creative starbase staff have developed a series of innovative industries to raise funds for projects, such as tricking the wealthy into expensive but pointless trips to space stations, fooling the middle class to try "outer space pollution-free fruit" farming, and so on, making great contributions to our cause."
tr_interastral_fly_us_to_the_star:0"Fly to the Stars"
tr_interastral_fly_us_to_the_star_desc:0""
tr_interastral_fly_us_to_the_star_delayed:0"Since the development of hyperdrive, a large number of artworks themed on interstellar exploration have emerged, and every young person regards working on a science ship as their ideal job!"
tr_interastral_better_colonist:0"New World Fever"
tr_interastral_better_colonist_desc:0""
tr_interastral_better_colonist_delayed:0"More and more people are boarding ships to new worlds, viewing distant alien planets as places to realize their ideals."
tradition_peace:0"Peace"
tradition_peace_desc:0"The path of salvation lies within it."
tr_peace_we_are_the_world:0"Interstellar Diplomacy"
tr_peace_we_are_the_world_desc:0""
tr_peace_we_are_the_world_delayed:0"The diplomatic institutions and norms we established when we were still a planetary civilization are no longer sufficient for the interstellar era. Through long-term exchanges with alien life, we have established diplomatic doctrines for the interstellar age."
tr_peace_we_are_the_one:0"Mutual Benefit Cooperation"
tr_peace_we_are_the_one_desc:0""
tr_peace_we_are_the_one_delayed:0"The Interastral Peace Corporation's principle is neither "exploitation" nor "selflessness", but "mutual benefit". We will strive to establish friendly relations with other empires and promote common prosperity through trade."
tr_peace_fate_together:0"Lobbying Organization"
tr_peace_fate_together_desc:0""
tr_peace_fate_together_delayed:0"Sometimes, a small gift can benefit both sides. Funding friendly lobby groups in our allies' countries has become part of our diplomatic toolkit, facilitating trade and providing them with income and jobs — a classic case of win-win, don't you think?"
tr_peace_influence_galaxy:0"Wealth Projection"
tr_peace_influence_galaxy_desc:0""
tr_peace_influence_galaxy_delayed:0"Besides military projection, we have discovered another form of projection particularly important in the interstellar age: wealth projection. We must extensively establish institutions that allow our wealth to reach every corner of the galaxy, so that we can use our accumulated wealth to solve problems anywhere, and then... accumulate more wealth."
tr_peace_peace_ours:0"Our Corporation's Peace"
tr_peace_peace_ours_desc:0""
tr_peace_peace_ours_delayed:0"The Interastral Peace Corporation knows well that constant concessions and appeasement do not bring peace. To those barbarians who love war, a decisive blow must be dealt."


 #Agenda
council_agenda_agenda_IPC_More_Export_name:0"Expand Interstellar Market"
council_agenda_agenda_IPC_More_Export_desc:0"The core of the Interastral Peace Corporation lies not within, but without."
council_agenda_agenda_IPC_More_Trade_name:0"Stimulate Domestic Economy"
council_agenda_agenda_IPC_More_Trade_desc:0"Through commercial success externally, we can further develop the internal economy."
council_agenda_agenda_IPC_More_Branches_name:0"Focus on Branch Building"
council_agenda_agenda_IPC_More_Branches_desc:0"The next goal is to focus on developing the commercial value of branches, bringing more profit to the corporation."
council_agenda_IPC_Expand_Faster_name:0"Galactic Land Grab"
council_agenda_IPC_Expand_Faster_desc:0"Now, a vast unclaimed fortune lies before us — the stars themselves. Whether developing the resources there or selling the ownership of star systems, it is a steady, highly profitable business."
council_agenda_IPC_Faster_than_Light_name:0"Lead the Wings of the World"
council_agenda_IPC_Faster_than_Light_desc:0"We will become the wings of the world..."
council_agenda_IPC_Accelerate_Colonization_name:0"Stepping Out of the Cradle"
council_agenda_IPC_Accelerate_Colonization_desc:0"Through propaganda, incentive policies, and mass-produced entertainment products, we can encourage the public to emigrate to alien colonies."
