#Origins
origin_belobog:0 "§RNever Retreat!§!"
origin_belobog_desc:0 "Resource depletion, Stellaron impact, and the arrival of the cold snap... numerous disasters once threatened to completely end the brilliant yet short history of Jarilo-VI's civilization. However, under the leadership of the Grand Guardian, and with the selfless help of the Nameless on the Astral Express, the people of Jarilo-VI survived the most difficult period. Yet the disaster brought by the Rift has not been eliminated, and the Corporation's debt has become a new obstacle. The people of Jarilo-VI will not give up any possibility; one day, they will return to the stars!\n\n§LChoices in some events will lead to different outcomes§!"
origin_tooltip_belobog_effects:0 "§R- Warning: Challenging origin§!\nStarts the situation ['concept_situation_engine_of_creation', £situation_outcome_icon_positive£§BJarilo-VI Reboot§!]\nJarilo-VI will face ['concept_belobog_blocker_1_army', £mod_menace_perk_undertaker£§RRift Erosion§!]\n§RStarts with no ships, no mining stations in the home system§!\nHas modifiers ['concept_a_debt_that_lasts_for_seven_hundred_years', £mod_country_subject_tribute_mult£$a_debt_that_lasts_for_seven_hundred_years$], ['concept_the_power_that_has_not_yet_been_fully_integrated', £mod_country_edict_length_mult£$the_power_that_has_not_yet_been_fully_integrated$], ['concept_surviving_in_a_desperate_situation', £mod_country_occupation_armies_add£$surviving_in_a_desperate_situation$], ['concept_belobog_technology_cooperation', £mod_cat_technology£$belobog_technology_cooperation$]\n—$INITIAL_POPS$:§R10 primary species pops and 5 robot pops§!$NEW_LINE$—$HOMEWORLD$$TABBED_NEW_LINE$Planetary modifiers ['concept_yaliluo_cold_wave'], ['concept_yaliluo_united_as_one']$TABBED_NEW_LINE$—['concept_d_belobog_blocker_liexi']：+5$TABBED_NEW_LINE$—['concept_d_belobog_blocker_small']：+10$TABBED_NEW_LINE$—Devastation: §R45%§!$TABBED_NEW_LINE$§RLack of research facilities§!"
START_SCREEN_PART_BELOBOG:0 "Resource depletion, Stellaron impact, and the arrival of the cold snap... numerous disasters once threatened to completely end the brilliant yet short history of Jarilo-VI's civilization. However, under the leadership of the Grand Guardian, and with the selfless help of the Nameless on the Astral Express, the people of Jarilo-VI survived the most difficult period. Yet the disaster brought by the Rift has not been eliminated, and the Corporation's debt has become a new obstacle. The people of Jarilo-VI will not give up any possibility; one day, they will return to the stars! However, they currently face an imminent shortage of maintenance supplies, and the Rift's erosion has not stopped. For the decision-makers, every choice is critical."
 #Concepts
