belobog_blocker_1_army_3:0 "Rift Monster Tide (Large)"
belobog_blocker_1_army_3_desc:0 "These Rift monster clusters are composed of a mix of monsters, including many large units that are difficult to deal with, posing a major threat."
belobog_blocker_1_army_4:0 "Wandering Rift Monsters"
belobog_blocker_1_army_4_desc:0 "Rift monsters discovered along the way to our destination. They pose almost no threat, but are difficult to completely eradicate."
