pc_astral_express:"Astral Express"
pc_astral_express_desc:"After a brief stop, the Astral Express will once again traverse the sea of stars. Listen, the train's whistle has sounded the prelude to departure. New worlds, new lives, new stories await the Trailblazer's stay. Ready to embark on a new "Trailblaze" journey? The warp is about to begin, please prepare, Trailblazer, 3, 2, 1... Next stop: The Galaxy!"
origin_Astral_Express:"Astral Express"
origin_Astral_Express_desc:"Woo, woo, sit in rows, don't stand, be careful during warp jumps; Woo, woo, fasten seatbelts, always ready, the dining car is not for card games!"
origin_tooltip_Astral_Express_effects:"After the fall of Akivili, the Aeon of Trailblaze, His will of Trailblaze was inherited by His followers, the "Nameless", among them the Astral Express He once rode; however, the "Cancer of All Worlds" spread wantonly, and the silver rails upon which the train rested did not escape; before the plague arrived, the train was already struggling; when the path was blocked and congested, it had to quietly run aground; so it went for years, no one knew how long, until a red-haired girl met the abandoned train; She was drawn to the untold stories left between the engine and the silver rails, spending time filling the cracks, smoothing the wear, and refurbishing the entire train; thus, the curious girl stepped into the carriage and began her journey of measuring the universe; The Astral Express stopped at each station, passengers came and went in haste, some joining the train's journey, others leaving; travelers came from different worlds, carrying different pasts, heading to different destinations, but as long as they were on the train, they shared the same journey; therefore, even if the passengers had their own thoughts, or even ill intentions, the train and Himeko did not mind — as long as someone was willing to embark on this wondrous journey, the door would open generously."
Star_Rail_start_screen_messages:"After a brief stop, the Astral Express will once again traverse the sea of stars. Listen, the train's whistle has sounded the prelude to departure. New worlds, new lives, new stories await the Trailblazer's stay. Ready to embark on a new "Trailblaze" journey? The warp is about to begin, please prepare, Trailblazer, 3, 2, 1... Next stop: The Galaxy!"
Astral_Express_start_screen_messages:"Woo, woo, sit in rows, don't stand, be careful during warp jumps; Woo, woo, fasten seatbelts, always ready, the dining car is not for card games! After the fall of Akivili, the Aeon of Trailblaze, His will of Trailblaze was inherited by His followers, the "Nameless", among them the Astral Express He once rode; however, the "Cancer of All Worlds" spread wantonly, and the silver rails upon which the train rested did not escape; before the plague arrived, the train was already struggling; when the path was blocked and congested, it had to quietly run aground; so it went for years, no one knew how long, until a red-haired girl met the abandoned train; She was drawn to the untold stories left between the engine and the silver rails, spending time filling the cracks, smoothing the wear, and refurbishing the entire train; thus, the curious girl stepped into the carriage and began her journey of measuring the universe; The Astral Express stopped at each station, passengers came and went in haste, some joining the train's journey, others leaving; travelers came from different worlds, carrying different pasts, heading to different destinations, but as long as they were on the train, they shared the same journey; therefore, even if the passengers had their own thoughts, or even ill intentions, the train and Himeko did not mind — as long as someone was willing to embark on this wondrous journey, the door would open generously."

