 #Origins
auth_lieshou:"Stellaron Hunter Organization"
gov_lieshou:"Stellaron Hunters"
StellaronHunter:"Stellaron Hunters"
councilor_ruler_administrator:"Hunter Administrator"
lieshou_leader:"Hunter Administrator"
origin_StellaronHunter:"Stellaron Hunters"
origin_tooltip_StellaronHunter_effects:0 "The Stellaron Hunters are a secret organization founded by "Destiny's Slave" Elio, who can foresee the future. They follow the Aeon of Finality and aim to change the universe's fate by seizing Stellarons and executing a "script" to counter Destruction. The Stellaron Hunters strictly follow the script written by Elio; their actions may seem wild and chaotic, but are actually aimed at achieving specific future nodes. The organization has few members, but each possesses planet-destroying combat power. Elio's script is not a single ending, but rather the only path to survival found after countless attempts."
origin_StellaronHunter_desc:"This operation of the Stellaron Hunters is also part of the script: to go to a destined bad ending, change the universe's course, defeat the great calamity, and bring new life to the universe."
The_StellaronHunter_start_screen_messages:0 "This operation of the Stellaron Hunters is also part of the script: to go to a destined bad ending, change the universe's course, defeat the great calamity, and bring new life to the universe."
civic_StellaronHunter_1:"Destiny's Guidance"
civic_StellaronHunter_1_desc:"Follow the script of "Destiny's Slave" Elio to achieve specific future nodes, in order to ultimately obtain a "good ending"."
civic_StellaronHunter_2:"Light and Shadow"
civic_StellaronHunter_2_desc:"The relationship between the Stellaron Hunters and the Astral Express is like that of light and shadow."
councilor_StellaronHunter_1:"Script Practitioner"
councilor_StellaronHunter_1_desc:"An important part of Elio's script"
councilor_StellaronHunter_2:"Script Transmitter"
councilor_StellaronHunter_2_desc:"Responsible for transmitting Elio's script"
 #Traits
trait_StellaronHunter_pop_1:"Glammoth Remnant"
trait_StellaronHunter_pop_1_desc:"A species created by restarting the Glammoth production line based on Firefly's template, full of hope for the future, with high bonuses to unity and trade."
trait_StellaronHunter_pop_2:"Curse of Longevity"
trait_StellaronHunter_pop_2_desc:"Possessing terrifying self-healing ability, for them, longevity is not a blessing but a lingering curse. Their long lifespan has caused them to lose direction for the future, and they are no longer enthusiastic about production."
trait_StellaronHunter_pop_3:"Hacker Talent"
trait_StellaronHunter_pop_3_desc:"Treating the universe as a game, they have superb hacking talents and like to hack the rich to help the poor, increasing advanced output on planets, while using hacker techniques consumes a lot of energy credits."
trait_StellaronHunter_pop_4:"Word Magic"
trait_StellaronHunter_pop_4_desc:"Possessing the ability of language hypnosis, they can increase planetary happiness and basic output through word magic."
trait_StellaronHunter_pop_5:"Glammoth Weapon"
trait_StellaronHunter_pop_5_desc:"Genetically modified clone warriors based on the Glammoth Empire's Empress, i.e., the Glammoth Iron Cavalry. These warriors were implanted with the "thought imprint" of defending the "Glammoth Empire" and loyalty to the Empress at birth. They possess extremely powerful combat abilities, but in contrast, their lifespan is extremely short, and they consume a lot of food and consumer goods."
trait_StellaronHunter_pop_6:"Demon Bloodline"
trait_StellaronHunter_pop_6_desc:"Kafka's homeworld, Pteruges-V, was contaminated by a Stellaron, and its residents, lacking the concept of fear, were ruled by desire, evolving into "demons"."
trait_StellaronHunter_pop_7:"Legendary Hacker"
trait_StellaronHunter_pop_7_desc:"Punklorde still circulates the legends of the legendary hacker Silver Wolf, and the locals, influenced by these stories, have strong unity."
trait_StellaronHunter_pop_8:"Tempered by the Forge"
trait_StellaronHunter_pop_8_desc:"Smelters casually tutored by Blade, possessing high smelting talent."
