concept_huimie_desc: "§H「Destruction」, Nanook§!\nThe Aeon of "Destruction", born from the fallen world of Adlivun. He typically appears as a human male with dark skin and golden eyes.\n§H「If entropy is the irreversible law of the universe, and heat death the inescapable fate of the material world, then why struggle? Burn, fuse, and annihilate. If one wishes to embrace new life, one must first submit to the end.」§!\n\t\t\t\t\t\t\t\t\t\t\t\t\t§H——Collected from a scientist before pressing the nuclear button, Amber Era 2152§!"
concept_huimie_effect:"Path: 「Destruction」"
concept_huimie_effect_desc:"§HOffensive§! Path. Initially boosts §GDamage to Rivals§!, §GFleet Command Limit§!, reduces §GWar Exhaustion Gain§!, boosts §GMonthly Influence§!, §GCommander Experience Gain§!, reduces §GEdict Upkeep§!, §GEdict Cost§!. As devotion increases, it boosts §HNaval Capacity§!, §HShip Weapon Fire Rate§!, §HOrbital Bombardment Damage§!, §HDamage to Starbases§!, §HShip Experience Gain§!, §HShip Weapon Damage§!, §HShip Weapon Range§!; reduces §HShip Upkeep§!."
