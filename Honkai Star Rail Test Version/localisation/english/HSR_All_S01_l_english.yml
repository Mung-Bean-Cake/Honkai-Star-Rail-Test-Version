#Technologies
tech_yaliluo_new_army:0 "New Robot Forces"
tech_yaliluo_new_army_desc:0 "$yaliluo_robotic_army_desc$"
tech_yaliluo_liexi_research_1:0 "Basic Rift Research"
tech_yaliluo_liexi_research_1_desc:0 "Preliminary determination: it is a hybrid product: half original, the other half's data highly fitting with Stellarons — Biology Dept., Sarah Castro."
tech_yaliluo_liexi_research_2:0 "Rift Recovery Research"
tech_yaliluo_liexi_research_2_desc:0 "Like a malignant tumor, like the impulse that leads to sin — it is the source of the Rift's distortion. This heart is already glowing, the patterns on it still bearing life."
tech_trait_power_arm:0 "Deep Mining Power Module"
tech_trait_power_arm_desc:0 "A new robot power mining module from the Deep Mining Plan.\n§BUnlocks trait: Power Mechanical Module§!"


#Ascension Perks and Relics
ap_jarilo_saved:0 "For Defense and Protection"
ap_jarilo_saved_desc:0 "Through our tireless efforts, we have successfully overcome the environmental challenges on our homeworld and saved Jarilo-VI from destruction.\nThe past will become a legend in galactic history. Now, for us, this is a new beginning."
ap_jarilo_saved_fail:0 "We have not yet successfully terraformed our homeworld."



#Modifiers
SRB_blockerHC_modifier:0 "Cold Snap"
SRB_blockerHC_modifier_tooltip:0 "This planet is an endless expanse of ice and snow."
SRB_blockerLJ_modifier:0 "Rift"
SRB_blockerLJ_modifier_tooltip:0 "Rift erosion on the planet severely affects people's lives.\n\n§RRift monsters will periodically assault our defenses§!"
planet_jarilo_start_modifier_tooltip:0 "Perhaps originally an ocean world."
planet_jarilo_emigration_push:0 "Emigration Edict"
planet_jarilo_emigration_push_tooltip:0 "The Qlipoth Fort edict and the impending doom of this planet drive people to leave as soon as possible."
severe_cold_torture:0 "Torture of the Bitter Cold"
severe_cold_torture_tooltip:0 "Experiences on the homeworld have taught this species to survive in cold climates."
yaliluo_cold_wave:0 "§RCold Snap§!"
yaliluo_cold_wave_desc:0 "The snow and wind brought by the Stellaron are difficult to eliminate quickly; as the Rift erodes our space, our development and construction speed are greatly affected."
yaliluo_united_as_one:0 "§HUnited as One§!"
yaliluo_united_as_one_desc:0 "Under the Grand Guardian's leadership, we are united in overcoming all difficulties."
a_debt_that_lasts_for_seven_hundred_years:0 "§RSeven Hundred Years of Debt§!"
a_debt_that_lasts_for_seven_hundred_years_desc:0 "Seven hundred years ago, after the Stellaron fell on Jarilo-VI, the outsiders who had been stationed on this world foresaw the approaching crisis and chose to leave. Among them were investors from the "Interastral Peace Corporation". But before they left, they did one important thing — they found the "Builders" who had stayed behind and provided them with a large sum of funds for disaster prevention. It was with that money that Belobog was able to build its towering walls... even the initial research funding for the automaton soldiers came from that fund. Now, the Corporation has sent people to collect the debt. With the Astral Express's help, we will not lose our sovereignty, but we must still find ways to repay this debt. This event has also sparked widespread discussion in society."
the_power_that_has_not_yet_been_fully_integrated:0 "§RUnintegrated Power§!"
the_power_that_has_not_yet_been_fully_integrated_desc:0 "Faced with the Stellaron crisis, Rift erosion, and corporate debt, our leadership has a multitude of voices and opinions. Our greatest challenge now is how to quickly integrate all forces."
surviving_in_a_desperate_situation:0 "§GSurviving in a Desperate Situation§!"
surviving_in_a_desperate_situation_desc:0 "There is still hope in desperation."
belobog_technology_cooperation:0 "§GExpatriate Staff Code of Conduct: Jarilo-VI Edition§!"
belobog_technology_cooperation_desc:0 "At the request of Director Topaz, this department is now issuing the "Expatriate Staff Code of Conduct: Jarilo-VI Edition" (hereinafter referred to as the "Jarilo-VI Staff Code"), and we hope all employees, both permanent and contracted, will strictly adhere to it during their assignments, maintaining the professional, efficient, and friendly image of the Strategic Investment Department.\nThe specific clauses of the Jarilo-VI Staff Code are as follows:\n1. Expatriate staff must comply with the laws and regulations enacted by the local authorities.\n2. Expatriate staff must not use work as an excuse to disrupt the daily lives, work, or commuting of local residents.\n3. Expatriate staff must not participate in, disrupt, or influence the work of local law enforcement teams (including but not limited to: Silvermane Guards, Wildfire, Moles, etc.) in any way. When necessary, company employees should actively cooperate with local law enforcement teams.\n4. Expatriate staff must not accept gifts or bribes from local residents for any reason.\n5. Expatriate staff must not damage the local environment or public property for any reason.\n6. Expatriate staff must not conduct employee recruitment or internal referrals without the approval of the Human Resources Department.\n7. For work that involves negotiation with local authorities or requires their permission, the project must be reported to the department director and approved before commencement.\nThe following clauses are specially appended by Director Topaz:\n8. Once again: the founding purpose of the "Jarilo-VI Reboot" project is to help local residents accelerate the reconstruction of their homeland and provide the technology and tools needed to achieve that goal.\n9. Expatriate staff must fully assist and cooperate with Jarilo-VI's local residents in the restoration of the "Creation Engine". If necessary, they may provide technical support from the Strategic Investment Department at no cost.\n10. Expatriate staff are obligated to pay for local accommodation, food, and public transport at 1.5 times the market price. This expense will be treated as travel expenses and reimbursed by the department.\n11. All weapons and equipment carried during the assignment should be handed over to local law enforcement teams for safekeeping.\n12. When necessary, expatriate staff are obligated to explain the Strategic Investment Department's work plans and objectives on Jarilo-VI in detail to local residents.\nThese are all the clauses of the "Expatriate Staff Code of Conduct: Jarilo-VI Edition". We hope all employees of the department will live up to Director Topaz's expectations, strictly follow the clauses, and wish you a pleasant and secure assignment. Please remember the Strategic Investment Department's slogan: Your risk, I preserve.\n$belobog_technology_cooperation_tt$"
belobog_technology_cooperation_tt:0 "§GProvides 0.2 progress to the $situation_engine_of_creation_type$ situation§!"
belobog_endless_exploration_of_the_universe:0 "§GEndless Universe Exploration§!"
belobog_endless_exploration_of_the_universe_desc:0 "An alien resource exploration and extraction plan led by the Belobog Development Committee and Technology Department, aimed at supplementing resources to meet the Creation Engine restoration project's needs."
belobog_talent_emergence:0 "§GTalent Emergence§!"
belobog_talent_emergence_desc:0 "Through learning and practice, a large number of talented individuals have been cultivated and discovered."
yaliluo_ethereum_front:0 "§HInterstellar Trade§!"
yaliluo_ethereum_front_desc:0 "Alien trade and tourism will become a major driver of our development."
yaliluo_burn:0 "§RPanic§!"
yaliluo_burn_desc:0 "A large number of explosions have caused social panic."
belobog_liexi_setback:0 "§HGreat Victory§!"
belobog_liexi_setback_desc: "We will walk to the distant lights, sketching the image of Belobog. The long night stretches the traveler's fatigue, but it cannot make us despair. Sorrow, O family: our journey is so long, the strings and drums are silent, only the weary bell still chimes in the wind, in the direction where the lights once appeared. — Katana Thomas, "Thomas's Poems"."
yaliluo_wonderful_life:0 "§HOld Glory§!"
yaliluo_wonderful_life_desc:0 "The glory of our predecessors inspires us; we will make Jarilo the most radiant star in this star sector."
belobog_big_cunhu:0 "§GPan-Preservation Liaison§!"
belobog_big_cunhu_desc:0 "We will strengthen ties with all Preservation factions."
yaliluo_new_life:0 "§HStellar Radiance§!"
yaliluo_new_life_desc:0 "We will continue to build our homeworld, allowing more civilizations interested in our past to see our achievements, and to help those in need."
ipc_help:0 "§HCooperative Win-Win§!"
ipc_help_desc:0 "We will strengthen cooperation with the Interastral Peace Corporation."
heitacountry_help:0 "§HHerta Space Station Technical Assistance§!"
heitacountry_help_desc:0 "The Herta Space Station's technology is beyond our imagination; they are willing to send personnel to guide our science and technology."
xianzhou_help:0 "§HXianzhou's Aid§!"
xianzhou_help_desc:0 "Selfless help from the Xianzhou Alliance."
xianzhou_help_event:0 "《Xianzhou Luofu - Belobog Mutual Trade Agreement》"
xianzhou_help_event_desc:0 "From today onward, the Xianzhou Luofu will fight alongside you until the cold snap turns into spring breeze and frozen soil becomes fertile land."
daunting_smite:0 "Enduring Bulwark"
daunting_smite_desc:0 "Forged by ice and snow, this resolve is eternal!"
 #Specimens
biological_wave_exploration_instrument: "Biological Wave Explorer"
biological_wave_exploration_instrument_desc_short: ""The brighter this thing glows, the more valuable the treasure. But if it's brighter than your exploration lamp, it's probably broken.""
biological_wave_exploration_instrument_desc_details: "Genius Society #8 Ram successfully extracted "value" in encoded form, discovering vast resources on a polar planet... The people of Belobog do not know that the treasure finder in their hands is a gift left by a passing genius."
yongdong_stele_stone: "Eternal Winter Stele"
yongdong_stele_stone_desc_short: ""Even if we fail, this monument will endure forever. Perhaps future humans will come here and know: we once existed.""
yongdong_stele_stone_desc_details: "Long ago, the "Mourning Actors" came to Jarilo-VI. At that time, the Stellaron had not yet fallen, the cold snap had not arrived, but the fires of the Antimatter Legion fell mercilessly on this fragile little planet. The Mourning Actors did not know of the Builders' existence; they saw only devastation. Above the planet, their gondola floated silently. The Mourning Actors left before the Legion discovered them, leaving behind a silent elegy. Later, Belobog's Builders discovered a beautiful stone that shimmered with colorful light. They mixed this stone with geomarrow to build a monument. It is said that this monument still stands in the center of Jarilo-VI — Belobog — Qlipoth Fort."
final_special_issue: "Luofu Sports • Luka Finals Special Edition"
final_special_issue_desc_short: ""What matters is always throwing that punch!""
final_special_issue_desc_details: "Luofu Sports' special edition reporting on Luka's participation in the "Sword Fighting Challenge"."
ancient_coins: "Ancient Coins"
ancient_coins_desc_short: "Ancient coins"
ancient_coins_desc_details: "From an era when Belobog's metal resources were still abundant."
activate_components: "Geomarrow Activation Components"
activate_components_desc_short: ""Brother, you need to consult a real smart person. No one knows how to fix machines better than Marev.""
activate_components_desc_details: "Standard Belobog components, used to activate geomarrow conduction pathways."
mimetic_snow_slug: "Mimetic Snow Slug"
mimetic_snow_slug_desc_short: ""When roasted over a fire, this slug tastes very good...""
mimetic_snow_slug_desc_details: "A mimetic snow slug, a member of Belobog's snowfield ecosystem. It reshapes itself to resemble its surroundings as camouflage, avoiding predators."
monster_armor: "Rift Monster Armor"
monster_armor_desc_short: ""Why would anyone want this? I don't understand...""
monster_armor_desc_details: "An armor-like carapace taken from a Rift monster."
 #Situations, Creation Engine Restoration
situation_engine_of_creation:0 "Jarilo-VI Reboot"
situation_engine_of_creation_type:0 "Situation: Creation Engine Restoration Plan"
situation_engine_of_creation_desc:0 "This plan aims to repair several damaged "Creation Engines" — "geological transformation engineering units" independently constructed by Belobog — and use them to eliminate the cold snap caused by the Stellaron, restoring the vitality of seven hundred years ago. The plan is expected to last ten generations. Although we are not sure if the old homeland can be revived, Belobog's courage and hope will forever be engraved under the stars.\nPhase 1: Belobog musters all its resources to gather the raw materials needed for the Creation Engine restoration.\nPhase 2: Construct all parts, including limbs, prioritizing the structural restoration of the Creation Engine.\nPhase 3: Complete the assembly of the Creation Engine. Work shifts underground, focusing on geomarrow extraction and energy refinement.\nPhase 4: Inject energy, restart the Creation Engine, and begin transforming Jarilo's terrain.\nPhase 5: Jarilo is revitalized.\nPhase 6: Step into the universe, fly beyond the blue sky.\nWith the Corporation's technical support, the required time will be greatly reduced, potentially completed within two to three generations."
belobog_country_resource_shortage:0 "§RWe currently lack resources!§!"
situation_engine_of_creation_outcome:0 "Step into the universe, fly beyond the blue sky!"
stage_engine_of_creation_effects:0 "Restoration work is progressing steadily."
situation_engine_of_creation_regular:0 "Normal Progress"
approach_engine_of_creation_regular_tt:0 "Proceed as planned; supplies will be normally guaranteed."
situation_engine_of_creation_generous:0 "Over-Progress"
approach_engine_of_creation_generous_tt:0 "For Jarilo's future, we need to work even harder!"
situation_engine_of_creation_frugal:0 "Slow Progress"
approach_engine_of_creation_frugal_tt:0 "We are facing financial difficulties and resource shortages, so we must slow down."
situation_engine_of_creation_job_number_tt:0 "Creation Engine District"
situation_engine_of_creation_tooltip:0 "Situation Progress"
belobog_resource_full:0 "Resources Abundant"
more_zaowuyinqing_build:0 "Additional Construction Plan"
 #Event Chains
yaliluo_story.3.name:0 "Battle Setback!"
yaliluo_story.3.desc:0 "Our assault on the Rift has failed. Citizens have mostly been evacuated under the guidance of the Guards and Wildfire; they are now relying on the city and favorable conditions to eliminate the Rift as much as possible."
yaliluo_story.3.a:0 "Never give up!"
yaliluo_story.4.name:0 "Recaptured!"
yaliluo_story.4.desc:0 "We successfully recaptured the area eroded by the Rift! The Belobog Construction Committee has arranged for personnel to focus on post-disaster reconstruction, while Wildfire and the Guards are inspecting and eliminating potential dangers."
yaliluo_story.4.a:0 "Excellent!"
yaliluo_story.5.name:0 "Territory Reclaimed!"
yaliluo_story.5.desc:0 "With the Guards deploying large anti-Rift devices in a small ancient town in the eastern region, Wildfire and another group of Guards began searching for small Rifts. Our eastern campaign is essentially complete. A second force has already assembled in Belobog; with some units returning from the eastern battle, their experience is richer."
yaliluo_story.5.a.desc:0 "With the elimination of the last large Rift in an underground storage vault in the western region, our offensive against the Rift is essentially complete. The soldiers return in triumph amid cheers. With large numbers of personnel heading to the east and west for redevelopment, materials for items we previously could not produce are now abundant, and industrial chains are forming."
yaliluo_story.5.a:0 "Triumphant return"
yaliluo_story.5.a.tt:0 "The Grand Guardian gains 1 §ROffensive Military§! point and 1 §RDefensive Military§! point."
yaliluo_story.7.desc:0 "The frontline forces are engaged in a fierce battle. The Grand Guardian has ordered the reserves to immediately deploy to the front, prioritizing the withdrawal of the advance forces, then launching another assault."
yaliluo_story.100.name:0 "Impending Energy Shortage"
yaliluo_story.100.desc:0 "Although we have made plans and gathered large quantities of materials for the restoration of the damaged "Creation Engines", the rate of consumption is so rapid that we will soon face material shortages. According to estimates from the Belobog Technology Committee, a prolonged shortage would delay the restoration by nearly a generation and significantly increase maintenance costs.\nCurrently, three feasible solutions have been identified. The first is to look outward to space. Although our homeworld lacks resources, we can mine alien resources to supply the project. With the joint efforts of the Interastral Peace Corporation's expatriate team and the Belobog Technology Committee, the technology needed for science and construction ships is no longer an issue. Through negotiations, we have obtained sovereignty over the starbase and the use of surface bases. The relevant extraction technologies have been mastered. However, with our limited resources, the yield from this plan is uncertain and unstable. In the long run, this can only serve as a supplementary measure; we cannot wait that long and the resource acquisition rate is limited.\nThe second and third solutions are deemed most feasible, but they are mutually exclusive. The second solution is to rearm and reclaim the eroded territories. With our research on the Rift, we can now easily eliminate small Rifts, and breakthroughs in eliminating larger Rifts are underway. The required troops can largely come from combat robots previously sealed in rock formations. With the help of the Guards, Wildfire, and robotic forces, we can first reclaim some territory and mine resources there. The third solution focuses on deeper exploration. Previously, due to technological limitations, we could not even explore deeper energy sources; we can convert those robots by replacing their combat modules with engineering modules, and most of the salvaged parts can be used in the project or for producing more critical parts to reduce maintenance costs. Moreover, the current stable environment is more attractive to alien investors and tourists.\nFor now, we must choose between these two solutions, which requires deliberation."
yaliluo_story.100.a:0 "Convene an immediate conference!"
yaliluo_story.101.name:0 "The Choice"
yaliluo_story.101.desc:0 "The Guards and Wildfire representatives are more inclined to reclaim territory first. The eastern and western regions outside Belobog were once our largest resource and research centers. During the evacuation, many heavy and difficult-to-move items and facilities were buried and protected underground. If we can recapture these two regions and maintain them, the project's problems would be mostly solved. The Technology Committee and energy agencies are more inclined toward deep development. Compared to attacking the Rift, deep development poses less risk to personnel, and several large deep mineral deposits have already been identified in our current territories, still not fully exploited."
yaliluo_story.101.a:0 "Prioritize reclaiming the eastern and western regions."
yaliluo_story.101.a.desc:0 "We will formulate a plan to recapture the eastern and western regions.\nThe Grand Guardian gains 1 §GDevelopment Point§! and 1 §RDefensive Military Point§!."
yaliluo_story.101.b:0 "Prioritize deep exploration and extraction."
yaliluo_story.101.b.desc:0 "We will formulate a plan for deep exploration and extraction.\nThe Grand Guardian gains 1 §GDevelopment Point§! and 1 §BDiplomatic Point§!."
yaliluo_story.102.name:0 "Military Reform"
yaliluo_story.102.desc:0 "After the ban on the Underworld was lifted, the Guards and Wildfire conducted long-term joint operations, developing a set of effective procedures for attacking the Rift and post-war reconstruction: the Guards are responsible for assault and breakthrough, Wildfire for reconnaissance, support, and supplies; post-war reconstruction is led by Wildfire with Guard assistance, while robot units provide support. The Technology Committee has previously begun researching new combat robots and sent personnel to convert sealed robots for the upcoming Rift assaults."
yaliluo_story.102.a:0 "Prepare for action."
yaliluo_story.102.a.desc:0 "We will gain 8 new robot defensive armies.\nThe Grand Guardian gains 1 §ROffensive Military Point§! and 1 §RDefensive Military Point§!."
yaliluo_story.103.name:0 "Formulating the Plan"
yaliluo_story.103.desc:0 "According to the pre-set plan, we will first recapture the eastern region to solve energy issues, then focus on the western research center. Meanwhile, some civilian production lines in Belobog have begun assisting in the production of new robotic units. The Technology Department believes that with a little more investment, we can build more units, but this would delay the offensive. The Guards argue that we cannot wait and should strike immediately."
yaliluo_story.103.a:0 "More troops mean a better chance of victory."
yaliluo_story.103.a.desc:0 "We will gain five armies."
yaliluo_story.103.b:0 "We cannot delay a moment; prepare to strike!"
yaliluo_story.103.b.desc:0 "We will gain one army. Jarilo-VI unlocks the planet resolution: §ROrganize an Attack on the Rift§!"
yaliluo_story.104.name:0 "Launch the Attack!"
yaliluo_story.104.desc:0 "We have replenished our forces with more new robot units. A military parade was held in Belobog's central square. The departing Guards, Wildfire members, and volunteers marched off under the Grand Guardian's review. People cheered and blessed them. The road ahead is perilous; may they return safely."
yaliluo_story.104.a:0 "Go forth, warriors!"
yaliluo_story.104.a.desc:0 "Jarilo-VI unlocks the planet resolution: §ROrganize an Attack on the Rift§!"
yaliluo_story.105.name:0 "Post-War Reconstruction"
yaliluo_story.105.desc:0 "After two campaigns, the assembly plants formerly used for combat robots are now producing new models. The Qlipoth Fort has arranged personnel to organize reconstruction and recruit volunteers. Thanks to the people's high enthusiasm, reconstruction has exceeded expectations. We will no longer face resource shortages, and we should now accelerate the Creation Engine restoration plan."
yaliluo_story.105.a:0 "We will eventually win Belobog's future!\nThe Grand Guardian gains 1 §GDevelopment Point§!, 1 §HDomestic Point§!, 1 §ROffensive Military Point§!, 1 §RDefensive Military Point§!, 1 §MResearch Point§!, and 1 §BDiplomatic Point§!"
yaliluo_story.105.a.desc:0 "Increases the §HJarilo-VI Reboot§! situation's monthly progress by 0.1."
yaliluo_story.150.name:0 "Improved Robots"
yaliluo_story.150.desc:0 "A new type of engineering robot, equipped with large engineering modules, designed with experience from underground mining and urban construction, and with Svarog's help. They are being mass-produced, and we have also reassembled many of the old sealed robots. The new robots have much greater work capacity and lower energy consumption."
yaliluo_story.150.a:0 "Excellent."
yaliluo_story.150.a.desc:0 "We gain §B2§! robot pops and §B4§! mining sites.\nThe Grand Guardian gains 1 §GDevelopment Point§! and 1 §HDomestic Point§!"
yaliluo_story.151.name:0 "「Ether Wars」 and the "Interstellar Champion Celebration""
yaliluo_story.151.desc:0 "The "Ether Wars" developed by the Interastral Peace Corporation is a collectible card battle game using "Ether Coins", which became popular across the universe. In this game, any biological data can be turned into "Ether Spirits" for players to "collect, duel, raise, and upgrade". Previously, the Corporation held an "Interstellar Champion Celebration" on Belobog, and it was well received. The IPC has sent representatives to request the use of the old weapons testing ground for future events, or as a secondary venue. For us, the last event brought Belobog more attention and significant interstellar trade. However, we might lack the manpower to ensure the safety of alien tourists and maintain the venue, and we often find ourselves at a disadvantage in negotiations with the Corporation. This requires careful consideration."
yaliluo_story.151.a:0 "This is a great opportunity to attract more interstellar trade."
yaliluo_story.151.b:0 "We need to negotiate further."
yaliluo_story.151.c:0 "We have other plans for the old weapons testing ground..."
yaliluo_story.152.name:0 "Negotiations"
yaliluo_story.152.desc:0 "After negotiations, the Interastral Peace Corporation representatives agreed to our terms and committed to accepting Belobog's management and following the agreed contract. The negotiators believe we can accept their request."
yaliluo_story.152.a:0 "Accept their request."
yaliluo_story.152.b:0 "Forget it."
yaliluo_story.153.name:0 "「Interstellar Champion Celebration」"
yaliluo_story.153.desc:0 "We have reached an agreement with the Interastral Peace Corporation. Now Belobog will collaborate with the Corporation to host the "Interstellar Champion Celebration". More and more alien tourists will come to Belobog. At the same time, we will use this opportunity to promote events like the Boulder Town Fighting Championship to more alien visitors."
yaliluo_story.153.a.desc:0 "The Grand Guardian gains 1 §GDevelopment Point§! and 1 §BDiplomatic Point§!"
yaliluo_story.154.name:0 "Age of Great Development"
yaliluo_story.154.desc:0 "With the establishment of new mining and energy districts, the urgent energy problem is largely solved. Core technology R&D is thriving; we need continuous development to strengthen our capabilities."
yaliluo_story.155.name:0 "Unexpected Discovery!"
yaliluo_story.155.desc:0 "Our exploration and construction teams have discovered another hidden resource point, which will bring us considerable benefits."
yaliluo_story.200.name:0 "The Long Road Ahead"
yaliluo_story.200.desc:0 "We have basically gathered the raw materials needed for the Creation Engine restoration and completed some preliminary processing. For us, this is just the first step of a long journey. Although gathering these materials consumed a lot of time and effort, given our relatively backward technology, we collected far more materials than expected for various reliability experiments. Nevertheless, we have taken the first step; this is the beginning of our return to the starry sea."
yaliluo_story.200.a:0 "Seize the day..."
yaliluo_story.200.a.desc:0 "The Grand Guardian gains 1 §GDevelopment Point§!, 1 §HDomestic Point§!, 1 §ROffensive Military Point§!, 1 §RDefensive Military Point§!, 1 §MResearch Point§!, and 1 §BDiplomatic Point§!"
yaliluo_story.201.name:0 "Expand Construction Scope"
yaliluo_story.201.desc:0 "Thanks to the Belobog Technology Committee's efforts, the feasibility of building each Creation Engine module has been confirmed. The immediate priority is construction. However, they have proposed a preliminary plan to build multiple Creation Engines simultaneously. Considering the construction speed and our resource availability, we need to rationally plan the number of expanded constructions."
yaliluo_story.201.a:0 "We need to consider this."
yaliluo_story.202.name:0 "More Creation Engines"
yaliluo_story.202.desc:0 "Our scientists have submitted a feasibility plan. Considering Belobog's current total resources, labor, alien trade, and outer space mining, we can build and maintain at most 5 Creation Engines. However, building additional engines might affect our plan's progress; we need to weigh the pros and cons."
yaliluo_story.202.a:0 "Perhaps we can build a little more within reason."
yaliluo_story.202.a.desc:0 "Unlocks the planet resolution: More Creation Engines."
yaliluo_story.203.name:0 "Engineering Reorganization"
yaliluo_story.203.desc:0 "Through the joint efforts of the Engineering Department, Technology Department, and Logistics Command, all required parts have been manufactured, and the repair of the Creation Engine framework is largely complete. We have moved one step closer to completing the plan. The main challenge now is assembly. Our workforce may be insufficient, and we don't have enough robots, and they are not fully up to the task. We need to overcome this hurdle."
yaliluo_story.203.a:0 "Overcome all obstacles!"
yaliluo_story.204.name:0 "More Robot Units"
yaliluo_story.204.desc:0 "Assembly plants have stepped up production of robots to compensate for the labor shortage. At the same time, we have called on more people to participate in the assembly process, with experienced workers quickly training newcomers."
yaliluo_story.204.a:0 "We are racing against time!"
yaliluo_story.204.a.desc:0 "Jarilo-VI gains 2 robot pops."
yaliluo_story.205.name:0 "Collecting Energy"
yaliluo_story.205.desc:0 "As the assembly of the last Creation Engine enters its final stage, we have begun large-scale geomarrow extraction to power the engines. Extracting geomarrow requires deep underground work. Since Belobog's geomarrow reserves are limited, we need to build vast underground mining areas to access the geomarrow veins beneath the surface eroded by the Rift. Belobog has decided to restart the Geomarrow Pioneer Corps to mine more geomarrow. Given the scale of this extraction, the depth and scope will be unprecedented. We have requested all departments to prioritize safety during mining."
yaliluo_story.205.a:0 "Safety first."
yaliluo_story.206.name:0 "Explosion!"
yaliluo_story.206.desc:0 "Multiple pioneer corps have reported explosions encountered during their advance or mining. Preliminary research suggests that due to Rift erosion, some geomarrow deposits have changed over time, becoming more active and unstable. We have instructed all pioneer corps to be more cautious, equip themselves with more advanced geomarrow detectors, and arrange for the injured to be evacuated quickly."
yaliluo_story.206.a:0 "How terrible!"
yaliluo_story.207.name:0 "Unexpected Discovery"
yaliluo_story.207.desc:0 "Some pioneer corps have reported good news: they also discovered mineral resources. The quality of these minerals is excellent, but the quantity is small, and some are extremely difficult to mine, so they had to be abandoned."
yaliluo_story.207.a:0 "Good news!"
yaliluo_story.208.name:0 "Relics of the Old World"
yaliluo_story.208.desc:0 "Some exploration teams reported finding relics of the old era during mining. Most of these relics are damaged and difficult to identify. Some can be identified as components of old-style robots and weapons. Some believe this may have been a battlefield from a previous conflict, while others think it might have been a research facility."
yaliluo_story.208.a:0 "We only appreciate things after losing them..."
yaliluo_story.209.name:0 "Engine Test"
yaliluo_story.209.desc:0 "With the completion of energy collection and successful partial engine startup tests, the construction of the Creation Engines is essentially complete. We still need time to adapt to these mountain-like giants. The first fully fueled Creation Engine completed its final engine test. The scene was met with thunderous applause and cheers; everyone's hard work has paid off. This is a once-in-a-millennium opportunity for Jarilo to be reborn."
yaliluo_story.209.a:0 "Look to the present!"
yaliluo_story.210.name:0 "Eradicate the Source!"
yaliluo_story.210.desc:0 "With the engines equipped, tested, and trained, the task now is to eradicate the source. According to the design, the Creation Engines are equipped with the most advanced anti-Rift equipment, capable of absorbing large amounts of Rift erosion and converting it into energy. All our ground defense forces will cooperate with the Creation Engine crews to eliminate all Rifts on the planet's surface and root out the Rift's self-replication and continuous erosion."
yaliluo_story.210.a:0 "Complete the unfinished work of our predecessors!"
yaliluo_story.211.name:0 "Seeing the Light of Day Again"
yaliluo_story.211.desc:0 ""Creation Engine core array output breaking through critical threshold — 99.7%...99.8...100%!" As the final calibration wave pierced the Rift clusters over Novogorod, all monitoring station quantum resonators fell silent simultaneously. For the first time in seven hundred years, the sky of Jarilo-VI was no longer torn by crimson cracks. Those wounds that devoured light and heat and twisted the laws of physics dissipated like thin ice under the blazing sun under the bombardment of planetary-scale geological transformation pulses. The bronze statue of the First Guardian in Belobog's central square suddenly began to play an encrypted recording: "Successors, if you hear this voice, please look at the blue sky for us."\nChief Engineer's Log excerpt: "Today, we finally blew those damned Rifts into elementary particles! When the first azure light appeared behind the clouds, the whole city was banging on anything that could make sound with wrenches, tin cans, even frozen potatoes. An old man was crying while holding his great-grandfather's portrait, shouting 'Can you see it?!', and everyone on the street joined in, the noise loud enough to drown out even the Creation Engine's roar. Honestly, even if alien monsters come again tomorrow — to hell with it, at least this moment was worth it.""
yaliluo_story.211.a:0 "We will walk to the distant lights, sketching the image of Belobog..."
yaliluo_story.212.name:0 "Maintenance and Restart"
yaliluo_story.212.desc:0 "Due to the previous combat and the current need for planetary purification, we need to replace many weapon modules with planetary purification devices and conduct a thorough inspection and maintenance of the Creation Engines. This purification plan aims to eliminate any Rifts potentially lurking inside the planet and address the cold snap. Additionally, we will carry out climate modification to make the planet as perfect as possible."
yaliluo_story.212.a:0 "It's time to end this damned cold snap."
yaliluo_story.213.name:0 "Planetary Purification"
yaliluo_story.213.desc:0 "Today, sixty percent of Belobog's Rift detection systems are aimed at the planet's depths. After modification, maintenance, and refueling, the Creation Engines will begin purification work and transform Jarilo into a Gaia world. Massive energy flows are being injected into the planet's surface, and a grand purification has begun. One day after purification started, the Belobog Meteorological Station reported that the planet's average temperature had risen several degrees, approaching the target."
yaliluo_story.213.a:0 "Steady progress."
yaliluo_story.214.name:0 "The Cold Snap Retreats"
yaliluo_story.214.desc:0 "After a long period of transformation, Jarilo's climate has changed. The cold snap has receded; flowers bloom again; animals and plants grow in abundance. The current goal is to fully transform it into a Gaia world and maintain stability."
yaliluo_story.214.a:0 "What a vast change."
yaliluo_story.215.name:0 "Step into the Universe, Fly Beyond the Blue Sky!"
yaliluo_story.215.desc:0 "Today, Belobog's administrative square is packed with people, listening to the Grand Guardian's speech. "Fellow citizens, selfless alien friends, I hereby announce that we have completed the Jarilo-VI Reboot plan! The Rift has been permanently expelled from Jarilo-VI; we no longer need to worry about the cold snap's erosion. We are now ready to become a true interstellar civilization. Please do not forget those who sacrificed their lives for this great cause..." The speech ends with thunderous applause. We did it; the stars will remember us."
yaliluo_story.215.a:0 "We succeeded!"
yaliluo_story.216.name:0 "Crossroads"
yaliluo_story.216.desc:0 "For a newborn interstellar civilization, the direction and path of development are particularly important. Belobog must now consider this issue. Some believe we should focus on research and trade, like in the past, to continuously climb the galactic stage. Others argue we should strengthen ties with other Preservation factions in the universe, especially the strongest Preservation force — the Interastral Peace Corporation. Another view holds that we should proactively help other worlds afflicted by the Stellaron Rift. Although we are currently weak, we can use our experience to assist them and unite those worlds against their common enemy."
yaliluo_story.216.a:0 "We will return to our former glory."
yaliluo_story.216.b:0 "We share the faith of Preservation."
yaliluo_story.216.c:0 "We should help those worlds potentially affected by Stellarons."
yaliluo_story.217.name:0 "Former Glory"
yaliluo_story.217.desc:0 "Jarilo once left a brilliant history in this star sector. We had the largest trade volume, the highest technology, and the richest culture among the star systems here — Jarilo-VI. Now, in this era of recovery, we should follow our predecessors' path, continuously strengthen ourselves, and bring Jarilo back to the grand galactic stage."
yaliluo_story.217.a:0 "We will continue the glorious history of our predecessors."
yaliluo_story.218.name:0 "Pan-Preservation Factions"
yaliluo_story.218.desc:0 ""Fools use flesh as walls, the greedy use money as walls. When the end comes, they all turn to ashes."\nIt is said that Qlipoth of "Preservation" is the oldest Aeon. He is silent and steadfast, building walls spanning light-years, never interfering in the noisy conflicts of the galaxy, nor heeding the mocking calls of other Aeons. Civilizations across the galaxy speculate on His motives: some say the ancient Aeon foresaw a crisis that could annihilate the universe, and builds barriers to "Preserve" all worlds; others say Qlipoth willingly serves as a laborer for other Aeons, building walls at their command. The truth cannot be verified, but His tireless efforts inspire mortals, who spontaneously gather to build walls to protect their planets. Some Builders claim to have felt the gaze of the "Preservation" Aeon: His gaze shows approval, carrying the warmth of a forge and the smell of lime. The annihilation of a star may endanger planets hundreds of light-years away, pushing them to the brink of survival — some worlds have survived such calamities only because of towering walls. Those who survive no longer mock the Builders' stubbornness and join their ranks, no longer questioning the motives or meaning of "Preservation".\nWe should contact all galactic factions that follow Preservation and practice the Path of Preservation.\nThe Interastral Peace Corporation — as the largest Preservation faction — we should strengthen ties with them, but not lose our independence."
yaliluo_story.218.a:0 "The light of Preservation."
yaliluo_story.219.name:0 "Galactic Rescue Alliance"
yaliluo_story.219.desc:0 "Stellaron erosion is not an isolated case; we are not the only victims. The vast galaxy is home to many weak civilizations suffering from Stellaron corruption, and our universe is fraught with dangers that threaten civilizations beyond Stellarons. We should form a Galactic Rescue Alliance to help worlds afflicted by various crises."
yaliluo_story.219.a:0 "Unity makes strength!"
yaliluo_story.220.name:0 "Strengthen Ourselves"
yaliluo_story.220.desc:0 "Only a stable and solid civilization can spare the strength to help others. We should build Jarilo-VI better, so that more people can learn about our battle with the Stellaron, and those who wish to learn from us can see the fruits of our development."
yaliluo_story.220.a:0 "We will become stronger."
yaliluo_story.221.name:0 "Like-Minded People"
yaliluo_story.221.desc:0 "There are many like-minded people in the galaxy, such as the Galactic Rangers — voluntary bands of vigilantes who believe in the goodness and justice of the universe, which must be upheld by individual actions. If they are willing to help us, we will gain more and more allies."
yaliluo_story.221.a:0 "The highest chivalry is to hold the stars in one's heart."
yaliluo_story.222.name:0 "Form an Alliance"
yaliluo_story.222.desc:0 "There are even more people fighting against Stellaron erosion and suffering from various disasters. We should extend a helping hand to them. If they are willing to join us, we will form a federation to fight together. If the time is not yet ripe for a federation, we will offer whatever assistance we can to those in need."
yaliluo_story.222.a:0 "We are not alone."
yaliluo_story.222.a.desc:0 "Unlock federation type: §HGalactic Rescue Alliance§!\nThe Grand Guardian gains 1 §GDevelopment Point§!, 1 §HDomestic Point§!, 1 §ROffensive Military Point§!, 1 §RDefensive Military Point§!, 1 §MResearch Point§!, and 1 §BDiplomatic Point§!"
yaliluo_story.300.name:0 "Outer Space Exploration and Construction Plan"
yaliluo_story.300.desc:0 "A small science ship with interstellar travel capability and a small construction ship with basic construction capabilities are nearing completion. Compared to the Interastral Peace Corporation's ships, ours are somewhat crude, but they should meet our basic needs. Some suggest we invite IPC personnel for guidance or purchase more advanced components to improve safety and efficiency."
yaliluo_story.300.a:0 "Let's keep it this way; our funds are limited."
yaliluo_story.300.b:0 "Perhaps we can invite them for some guidance to eliminate potential issues."
yaliluo_story.300.c:0 "Let's use some more advanced components; safety first."
yaliluo_story.301.name:0 "Exploration and Extraction"
yaliluo_story.301.desc:0 "Led by the Belobog Development Committee, the first alien resource exploration and extraction teams have been formed and trained. Their goal is to explore and mine potential alien resources and establish mining stations. Before departure, the Grand Guardian expressed deep respect and blessings on behalf of all Belobog people. The Belobog Technology Committee will cooperate with the Development Committee to continuously improve alien exploration technology and personnel training, meeting our development needs."
yaliluo_story.301.a:0 "For Belobog's future!"
yaliluo_story.301.a.desc:0 "§RJarilo-VI§! gains 1 research position and 5 amenities.\nThe Grand Guardian gains 1 §GDevelopment Point§!"
yaliluo_story.302.name:0 "Unintegrated Forces"
yaliluo_story.302.desc:0 "For some time, after the resolution of the Stellaron crisis, the Creation Engine restoration, and the Interastral Peace Corporation debt dispute, there have been numerous internal opinions. The main view is that we should prioritize the Creation Engine restoration plan, rearm and develop our capacity, and completely expel the Rift erosion from Jarilo. The disagreement lies in attitudes toward external forces. Wildfire, the Underworld, labor groups, and some scholars and experts believe that although help from the IPC is crucial, in their eyes Jarilo-VI is just an ordinary little planet, no different from the countless stars in the night sky; but to us, it is our only home. If we rely too much on the Corporation, Belobog will be like a child led by the hand: seemingly able to run and jump, but if the guiding hand lets go, the weakness of the legs will be exposed. Others hold pessimistic views. For this long-term plan, they believe we are unlikely to complete it even with external help, or that we will be consumed by the Rift before completion. Some even propose finding a second home and abandoning Jarilo. Another faction leans toward compromise with the IPC, fully aligning with the Corporation's interests as their vassal. This view is mostly held by conservative forces in the Overworld, who hold power and control some trade resources. They frequently criticize the Grand Guardian's decisions, hoping to find a weakness to attack."
yaliluo_story.302.a:0 "We need deeper communication and consensus."
yaliluo_story.303.name:0 "A Common Goal"
yaliluo_story.303.desc:0 "It is undeniable that without the Corporation's aid, Belobog could not have completed its revival alone — I think no one would deny that. But at the same time, the Corporation's importance has been exaggerated; some see them as saviors from heaven, believing those black-suited agents came out of charity. So far, the Corporation has not charged for their services, but that doesn't mean they aren't profiting. Order is the greatest asset, and its owner can easily obtain many things: a king enjoys the finest food without farming, while farmers must maintain this relationship because their labor only yields returns in an orderly system. The ambition to rule all is often disguised as the goodwill to save all. Once integrated with the cosmic market, we will inevitably be shaped by the Corporation's order, chasing strings of numbers in our accounts. We may have to exhaust every vein of ore, drain every drop of blood, just so some people can enjoy the lives depicted on their phones. We cannot be lost in gratitude and joy; we must remain vigilant and clear-headed. On the other hand, the Corporation is an outsider. In their eyes, Jarilo-VI is just an ordinary little planet, no different from the countless stars in the night sky; but to us, it is our only home. If we rely too much on the Corporation, Belobog will be like a child led by the hand: seemingly able to run and jump, but if the guiding hand lets go, the weakness of the legs will be exposed. We cannot let the aid we receive drown our descendants in a river! The gap between Jarilo-VI and the outside world exists, but it is not insurmountable. To truly become a dignified member of the galaxy, we must forge our own path, not be someone else's appendage.\nLet us learn, let us imitate, let us seek everything that brings beauty. Only then will our future children be able to stand alongside the stars, rather than weep in their brilliance."
yaliluo_story.303.a:0 "Unite all forces that can be united, for Jarilo's future!"
yaliluo_story.303.a.desc:0 "Remove the modifier: §RUnintegrated Power§!. The Grand Guardian gains 1 §BDiplomatic Point§! and 1 §GDevelopment Point§!"
yaliluo_story.304.name:0 "A Shared Future"
yaliluo_story.304.desc:0 "We have endured the snow and wind for over seven hundred years; we have no reason to give up. Completing Jarilo's revival is the shared future we all desire. We need more people to participate, in whatever capacity."
yaliluo_story.304.a:0 "Let us all strive together."
yaliluo_story.304.a.desc:0 "Allows recruitment of more local legendary leaders.\nThe Grand Guardian gains 1 §HDomestic Point§!"
yaliluo_story.305.name:0 "Infrastructure"
yaliluo_story.305.desc:0 "With production and construction in full swing, much infrastructure has been restored and rebuilt. We have raised funds to strengthen the energy system. Some argue for prioritizing power facilities, while others advocate for boosting mining development."
yaliluo_story.305.a:0 "Build mining districts."
yaliluo_story.305.a.desc:0 "Jarilo gains a mining district and a $d_mineral_block$ tile."
yaliluo_story.305.b:0 "Build energy districts."
yaliluo_story.305.b.desc:0 "Jarilo gains a power district and a $d_energy_block$ tile."
yaliluo_story.306.name:0 "Interstellar Civilization — Diplomatic Policy"
yaliluo_story.306.desc:0 "As we develop, we will inevitably encounter many alien civilizations. For us, a stable and peaceful external environment is crucial. Now we must redefine our foreign policy."
yaliluo_story.306.a:0 "Cooperation and win-win is the future."
yaliluo_story.306.a.desc:0 "The Grand Guardian gains 1 §BDiplomatic Point§!"
yaliluo_story.306.b:0 "Increase external exploration efforts."
yaliluo_story.306.c:0 "Trade first."
yaliluo_story.320.name:0 "Further Rift Research"
yaliluo_story.320.desc:0 "Belobog has never stopped researching the Rift. Through generations of effort, a technology to eliminate small Rifts has been developed. It uses modified geomarrow energy to create counter-devices that, when activated, can disperse Rift erosion the size of a small city, helping us eliminate small Rifts."
yaliluo_story.320.a:0 "We must understand it thoroughly."
yaliluo_story.320.a.desc:0 "The Grand Guardian gains 1 §MResearch Point§!"
yaliluo_story.321.name:0 "Rift Recovery Research"
yaliluo_story.321.desc:0 "Through experiments, we have found that although the Rift recedes quickly, we can capture trace amounts of imaginary energy within it. We can study this energy to advance our technology or directly recover it for our use."
yaliluo_story.321.a:0 "Recover for research."
yaliluo_story.321.a.desc:0 "After removing the Rift, gain 15 Physics, Sociology, and Engineering research points."
yaliluo_story.321.b:0 "Recover for energy."
yaliluo_story.321.b.desc:0 "After removing the Rift, gain 70 Energy and 50 Minerals."
yaliluo_story.401.name:0 "Our Home"
yaliluo_story.401.desc:0 "As colonies on [Root.GetName] develop, more and more people travel between the new colony and the homeworld. Some are advocating abandoning Jarilo-VI and moving directly to the new colony, to avoid the Rift erosion and preserve the majority. Many have questioned this: according to interstellar news, Stellaron-induced Rift erosion is common. If we abandon Jarilo-VI and let it be fully eroded, it would spawn more disasters. We cannot simply avoid the Rift by fleeing. Moreover, our technology is not advanced enough to guarantee that everyone can be evacuated before the erosion takes hold. We have fought the Rift for over seven hundred years; we cannot retreat now!"
yaliluo_story.401.a:0 "We cannot give up now."
yaliluo_story.402.name:0 "Stellar Sky Martial Tournament"
yaliluo_story.402.desc:0 "Not long ago, Belobog's interstellar communication station resumed operation. A month ago, we received an "invitation" with some signal distortion — "The Xianzhou Luofu sincerely invites the warriors of Jarilo-VI to participate in the Martial Tournament." Before the cold snap, we had contact with many worlds. The legendary fighter Igor Haft left Jarilo-VI before the Legion invasion and likely participated in the Martial Tournament before returning home to fight against the Legion. Whatever the reason the Xianzhou Alliance is inviting us, participating in this "Martial Tournament" is of great significance to Belobog. It represents an opportunity for the galaxy to recognize us again — a heroic nation that survived the Legion and the cold snap. Additionally, establishing simple ties with the Xianzhou Alliance could give us more leverage against the Corporation. To help Belobog return to the galactic community, Luka, armed with an outdated invitation, went to the Xianzhou Luofu to participate in the Stellar Sky Martial Tournament."
yaliluo_story.402.a:0 "Go, young warrior."
yaliluo_story.403.name:0 "Even When the Applause Fades"
yaliluo_story.403.desc:0 "Facing Boothill's gun, Luka bravely threw his fist, earning himself a "glorious defeat". However, the overwhelming gap in strength deeply shook Luka's confidence. He didn't want to continue. Fortunately, Mr. Tail intervened and pulled Luka out of his self-doubt.\nLuka won Argenti's recognition in the popularity revival round and returned to the stage of the Martial Tournament. Luka gradually approached the "Sword Fighting Challenge", and also approached the regret-filled career of Igor.\nLuka once challenged Svarog and lost. Now, before stepping onto the "Sword Fighting Challenge" stage, he had the chance to challenge Svarog again. This time, Luka won.\nLuka's "Stellar Sky Martial Tournament" ended. Unfortunately, he did not win, but everyone in this story got what they wanted. Luka became a galactic sports star and indirectly promoted the signing of a mutual trade agreement between Belobog and the Xianzhou Luofu. Jing Yuan reunited with an old friend in a different way and made up for past regrets. Igor ultimately succeeded in saving his homeland, even when the applause had long faded."
yaliluo_story.403.a:0 "Well done, Luka!"
yaliluo_story.403.a.desc:0 "Gain 10 opinion from the Interastral Peace Corporation, the Xianzhou Alliance, and the Herta Space Station."
yaliluo_story.404.name:0 "Xianzhou Luofu - Belobog Mutual Trade Agreement"
yaliluo_story.404.desc:0 ""Under the witness of the Eternal Winter Stele, I — Grand Guardian Bronya Rand — declare: The "Xianzhou Luofu - Belobog Mutual Trade Agreement" is now in effect!"\n"I have heard the story of Belobog: its people, in the most desperate times, still held fast to the will of 'Preservation', unyieldingly resisting fate until dawn arrived. Only when I set foot on this heroic land and felt the still-lingering snow and ice burn like fire on my skin did I realize how heavy this 'Preservation' is, and how great the people who struggle on this land are. From today onward, the Xianzhou Luofu will fight alongside you until the cold snap turns into spring breeze and frozen soil becomes fertile land.""
yaliluo_story.404.a:0 "Long live the friendship between Xianzhou Luofu and Belobog!"
opinion_yaliluo_xianzhou_help:0 "Xianzhou Luofu - Belobog Mutual Trade Agreement"
opinion_xianzhou_help:0 "Aid"
yaliluo_story.500.name:0 "Polar Expedition Team - First Report"
yaliluo_story.500.desc:0 "Polar Expedition Team log: First stop, the eastern region outside Belobog. This area is largely covered by snow, cold, with sparse vegetation and many mountains. We found the eastern resource station built against the mountains. Most of it was buried under snow; we could barely squeeze through a small opening. Inside, there was nothing worth analyzing, as we had already moved almost everything we could take during the evacuation, and the rest was buried deep underground. As we were leaving, we found some ancient metal coins beside a rock, reminding us of the pre-Rift era seven hundred years ago."
yaliluo_story.500.a:0 "Continue exploring."
yaliluo_story.501.name:0 "Polar Expedition Team - Second Report"
yaliluo_story.501.desc:0 "Polar Expedition Team log: Second stop, the far eastern region outside Belobog. We found some old buildings, but they were in ruins. Although we call this area the far east, there is still much unexplored territory. We unexpectedly found a damaged electronic device in a dilapidated house; after scanning, we identified it as a storage disk. We did some minor repairs and found it contained logs of the Antimatter Legion's attacks. At this point, we were close to the Rift's root system, and some monsters were already wandering around. We had a hard time escaping, but luckily no casualties."
yaliluo_story.501.a:0 "My goodness."
yaliluo_story.502.name:0 "Polar Expedition Team - Third Report"
yaliluo_story.502.desc:0 "Polar Expedition Team log: Third stop, the southern region outside Belobog. This area was recorded as having some surviving life. In the old days, there were large nature reserves here. Unfortunately, we didn't find anything worth noting. However, one team member found a large mimetic snow slug; its size and estimated age are astonishing, and it is still alive. We speculate this may be related to the recent climate improvement."
yaliluo_story.502.a:0 "Interesting."
yaliluo_story.503.name:0 "Polar Expedition Team - Fourth Report"
yaliluo_story.503.desc:0 "Polar Expedition Team log: Fourth stop, the western region outside Belobog. This area was once a research and development center. We found many old surface buildings and some research institutes. We entered a small old research facility but found nothing valuable, as it had long been emptied. In a corner, we found a bag of geomarrow activation components, much more integrated and compact than ours. We recorded many useful location points to update the map."
yaliluo_story.503.a:0 "Excellent."
yaliluo_story.504.name:0 "Polar Expedition Team - Fifth Report"
yaliluo_story.504.desc:0 "Polar Expedition Team log: Fifth stop, the northern region outside Belobog. The northern region has a high density of Rift roots, so when we reached the northernmost historical area, we could not advance further. We spent a lot of effort escaping. Fortunately, we came across an old city cluster we had never seen before; the ruined buildings served as cover, helping us escape the Antimatter Legion. Using the terrain, we roughly determined our location on the map. Along the way, we found some fragments of Rift monsters frozen solid; the team's biologist found it significant and took one. Now we have decided to return to Belobog."
yaliluo_story.504.a:0 "Welcome back."
yaliluo_story.1001.title:0 "Qlipoth Fort Office"
yaliluo_story.1001.desc:0 "The executive residence is located in the center of Belobog, connected to a soaring tower, symbolizing hope and guidance. As the power center of the surviving civilization, the executive residence is where successive Grand Guardians and their heirs conduct affairs and reside. From planning the Radiance Festival to defending against Rift monster invasions, all communal decisions are issued from here. Each Grand Guardian has inherited the will of Guardian Plamya, following her decrees, using walls to resist the wind and snow, and using will to keep the flame alive, benefiting the people and sustaining the surviving civilization."
yaliluo_story.1001.a:0 "Local Talent Recruitment"
yaliluo_story.1001.a.desc:0 "Recruit other leaders from this origin."
yaliluo_story.1001.b:0 "Synesthesia Beacon"
yaliluo_story.1001.b.desc:0 "Recruit leaders from other factions."
yaliluo_story.1001.c:0 "Interstellar Communication"
yaliluo_story.1001.c.desc:0 "Adjust relations with other factions."
yaliluo_story.1003.title:0 "Local Talent Recruitment"
yaliluo_story.1003.desc:0 "Recruit after meeting relevant conditions."
