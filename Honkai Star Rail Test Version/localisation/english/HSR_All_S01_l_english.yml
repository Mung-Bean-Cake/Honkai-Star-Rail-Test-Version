DDT_FY.1_name: "Disturbance in the Paths"
DDT_FY.1_desc: "Our citizens have recently sensed a disturbance in the Paths and have reported it to the Empire. An immediate investigation has confirmed the source to be agitation in the Destruction Path, but we are unable to resolve the issue."
DDT_FY.2_name: "Strong Energy Fluctuation"
DDT_FY.2_desc: "The previously faint Path disturbance has now grown significantly, expanding from individual citizens' perception to a galaxy-wide energy fluctuation.\nTo date, this energy seems to convey — or to indicate — that something powerful is awakening or approaching."
DDT_FY.2_name_one: "A bad feeling."
DDT_FY.2_name_two: "We must prepare."
DDT_FY.3_name: "Energy Burst, The Beginning of Destruction!"
DDT_FY.3_desc: "Just now, the energy source we have been searching for has finally appeared in the galaxy. Our detectors have identified — nine burst points!!!!!\nAll nine are now revealed across the galaxy, and these energies are saturated with the aura of Destruction. Such immense power cannot be a minor event. Could the Destruction Aeon be preparing for war?"
DDT_FY.3_name_one: "This is absolutely a disaster!"
DDT_FY.4_name: "The Beginning of Destruction!"
DDT_FY.4_desc: "The nine energy burst sites are hidden in nine unknown systems. Many nations have repeatedly sent probes, all losing contact. Based on transmitted imagery, the probes were attacked.\nJust now, the Destruction energy burst again; they are undoubtedly moving."
DDT_FY.4_name_one: "Quick, prepare defenses!"
DDT_FY.8_name: "Universal Declaration"
DDT_FY.8_desc: "The birth of the universe is a fundamental error; civilization is a cancer quietly growing among the vast stars, and conflict is the only universal language among intelligent beings. To correct this error and erase the stain of the universe, I have become the embodiment of entropy, to destroy all."
DDT_FY.8_name_one: "We will never give up!"
DDT_FY.8_name_two: "Destroy us? You dare to think so."
DDT_FY.8_name_three: "Can we surrender to save ourselves?"
DDT_FY.12_name: "§RDestruction§!"
DDT_FY.12_desc: "The birth of the universe is a fundamental error; civilization is a cancer quietly growing among the vast stars, and conflict is the only universal language among intelligent beings. To correct this error and erase the stain of the universe, I have become the embodiment of entropy, to destroy all."
DDT_FY.12_name_one: "The Antimatter Legion?"
DDT_FY.12_desc_one: "The Antimatter Legion, my followers."
DDT_FY.12_name_two: "What do you want to do?"
DDT_FY.12_desc_two: "We vow to place ourselves in absolute opposition to civilization and life.\nWe repeatedly destroy weak or strong civilizations, wandering across one shattered world after another, feeding on the "chaos energy" emitted by dying civilizations until they completely decay.\nNow, we awaken again.\nYou will face endless destruction until you are utterly annihilated."
DDT_FY.12_name_three: "Heh."
DDT_FY.12_name_four: "Bring it on."

DDT_FY.201_name: "§IAeon Emanator — Firewind§!"
DDT_FY.201_desc: "The §IFirewind§! system has appeared. According to the information from within, it is the temporary residence of the Aeon Emanator — Firewind."
DDT_FY.202_name: "§IAeon Emanator — Starscream§!"
