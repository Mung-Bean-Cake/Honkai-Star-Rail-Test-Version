tech_path_path_solt_1:"Path • I"
tech_path_path_solt_1_desc:"Little is known about these mysterious beings that wander the deep starry seas. Limited by finite cognition, intelligent life can only faintly perceive that Aeons tread upon Paths invisible to mortals, wielding their immeasurable power through certain concepts. Ultimately, in myth passed down by word of mouth, Aeons become incarnations of highly condensed philosophical concepts. If one can step onto the Path held by an Aeon, they will receive a distant response, like a glance cast across the galaxy. Many believe this is the only intersection between Aeons and mortals."
