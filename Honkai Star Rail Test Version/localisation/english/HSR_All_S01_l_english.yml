NAME_heita:"Herta"
heita_catch_phrase:"Come do research with me today — I'll research you."
heita_backstory:"The true owner of the Space Station「Herta」. As the smartest human on Blue, she only does what interests her, and once she loses interest, she leaves immediately — the space station is a prime example. She usually appears as a remotely operated puppet: "About seven-tenths like me as a child." — Herta herself."
hsr_paragon.2.name:"Genius Society - Herta"
hsr_paragon.2.a:"First Meeting"
hsr_paragon.2.a.response:"I'm Herta, busy right now. This is remote puppet auto-response mode: Hello, hello, hello everyone, have a pleasant day, goodbye."
hsr_paragon.2.b:"Hobbies"
hsr_paragon.2.b.response:"If you don't solve problems or write papers, don't complain about your boring life, okay?"
hsr_paragon.2.c:"Observations"
hsr_paragon.2.c.response:"The "Silent Lord" erased the eyes from the portrait, but attracted everyone's gaze."
leader_herta_t1:"§MOne-shot Deal§!"
leader_herta_t1_desc:"Can you be quiet!"
leader_herta_t2:"§MIt's magic, I added magic§!"
leader_herta_t2_desc:"Never seen such a big diamond? It's yours~\n$leader_herta_t2_effect_desc$"
leader_herta_t2_effect_desc:"§BWhen in the Council, for each level gained by any leader, add 5 Herta mechanical pops to any colony (not synapses)§!\n§MIf Big Herta is also in the Council, this effect doubles§!"
leader_herta_t3:"§MLet me do it§!"
leader_herta_t3_desc:"Spinning in circles~\n$leader_herta_t3_effect_desc$"
leader_herta_t3_effect_desc:"Each effective level provides an additional 10% effect."
leader_herta_t4:"§MCan be optimized§!"
leader_herta_t4_desc:"Upgrade the config."
leader_herta_t5:"§MWhat are you looking at§!"
leader_herta_t5_desc:"It hurts."
