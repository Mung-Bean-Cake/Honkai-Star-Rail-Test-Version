leader_trait_banner_of_command:0 "Under the Banner"
leader_trait_banner_of_command_desc:0 "Show some mettle."
leader_trait_battlefield:0 "Battlefield"
leader_trait_battlefield_desc:0 "Don't miss any weak spots.\n§LIn some events and decisions, the Grand Guardian gains special skill points.\n-§GDevelopment Points§!\n-$mod_planet_jobs_produces_mult$：§G+0.25%§!\n-$mod_planet_jobs_upkeep_mult$：§G-0.25%§!\n-§HDomestic Points§!\n-$mod_country_unity_produces_mult$：§G+1%§!\n-$MOD_PLANET_AMENITIES_MULT$：§G+0.01§!\n-$MOD_PLANET_STABILITY_ADD$：§G+0.1§!\n-§MResearch Points§!\n-$mod_country_physics_research_produces_mult$：§G+1%§!\n-$mod_country_society_research_produces_mult$：§G+1%§!\n-$mod_country_engineering_research_produces_mult$：§G+1%§!"
leader_trait_military_might:0 "Military Might"
leader_trait_military_might_desc:0 "The key step that decides the course of battle.\n§LIn some events and decisions, the Grand Guardian gains special skill points.\n-§ROffensive Military§!\n-$MOD_SHIP_WEAPON_DAMAGE$：§G+1.5%§!\n-$MOD_SHIP_WEAPON_RANGE_MULT$：§G+1.5%§!\n-$MOD_SHIP_SPEED_MULT$：§G+1.5%§!\n-§RDefensive Military§!\n-$MOD_ARMY_DAMAGE_MULT$：§G+5%§!\n-$MOD_ARMY_HEALTH$：§G+5%§!\n-$MOD_ARMY_MORALE$：§G+5%§!\n-$MOD_COUNTRY_STARBASE_CAPACITY_ADD$：§G+0.25§!\n-§BDiplomatic Points§!\n-$MOD_COUNTRY_BORDER_FRICTION_MULT$：§G-5%§!\n-$MOD_DIPLO_ACTION_ACCEPTANCE_ADD$：§G+0.5§!\n-$MOD_COUNTRY_TRUST_GROWTH$：§G+0.05§!"
leader_trait_daunting_smite:0 "Daunting Smite"
leader_trait_daunting_smite_desc:0 "Be prepared.\n§BUpon entering space combat, inflict a freezing effect on enemy fleets for 15 days, cooldown 90 days.\nFreeze: Significantly reduces enemy ship speed, fire rate, range, and evasion§!"
leader_trait_enduring_bulwark:0 "Enduring Bulwark"
leader_trait_enduring_bulwark_desc:0 "Forged by ice and snow, this resolve is eternal!\n§BWhen we declare war or are declared upon, increase national fleet shield, armor, and hull regeneration for 360 days. Refreshes duration on repeat triggers.§!"
