# l_simp_chinese: New file
 #Origins
origin_luosi_star:"Screwllum"
origin_luosi_star_desc:"When our planet was on the verge of destruction, the wisest among us decided to pursue a mad plan: to use the dying star as fuel to drive a Stellar Differential Engine, simulating a perfect living environment for the Screwllum race. #76 of the Genius Society, Screwllum, ruler of Machine Planet IX, is renowned throughout the universe. His wisdom transcends the entire planet, allowing him to perceive the essence of Screwllum: the planet itself is an experiment, an elegant equation and a cold roller drum forming the world, giving birth to them as inorganic life. The Stellar Differential Engine was built to analyze the origin of the universe and life. Since it could simulate a living environment, it must have understood the fundamental units of the universe and life, i.e., that elegant equation — which was the scholar's purpose in building the Differential Engine. But whether this truly is the origin of inorganic life is, in Screwllum's view, debatable — after all, if the equation were wrong, the Differential Engine could no longer simulate Screwllum's environment; as the Engine still runs, the equation remains unverifiable. Screwllum is not content to spend long ages verifying the correctness of his predecessors' ideas. He decides to personally seek the origin of the universe."
origin_luosi_star_tt:"Signing treaties with any faction will award Unity."
civic_luosi_1:"Machine Benchmark"
civic_luosi_1_desc:"We have become the benchmark for machine civilizations, and we are committed to reducing prejudice against machines."
councilor_luosi_1:"Diplomatic Envoy"
councilor_luosi_1_desc:"The chief of diplomacy responsible for missions."
num_relation_country_effect:"Each faction we have a treaty with provides monthly Unity and 0.5% Happiness."
civic_luosi_2:"Special Research Algorithm"
civic_luosi_2_desc:"Our constant thinking will not only change output but also affect the computational power of the Stellar Differential Engine."
councilor_luosi_2:"Maintainer"
councilor_luosi_2_desc:"Responsible for maintaining the equation."
 #Traits
trait_luosi_pop_1:"Thinker"
trait_luosi_pop_1_desc:"For the people of Screwllum, constant thinking not only meets research needs but also provides some computational power to the Stellar Differential Engine."
trait_luosi_pop_2:"Peace-Seeking Machine"
trait_luosi_pop_2_desc:"The machines of Screwllum have always pursued peace, aiming to change the image of machines after the two Rubert Wars."
TRAIT_LUOSI_POP_2_EXCRETIONS_EFFECT:"Each $pop_group_unit$ £pop£ §Hpop§! produces 1 £unity£ §Y$unity$§! per month."
trait_luosi_pop_3:"Flexible Components"
trait_luosi_pop_3_desc:"The machines of Screwllum constantly evolve and upgrade."
trait_luosi_pop_4:"Universal Components"
trait_luosi_pop_4_desc:"These universal components facilitate combining and separating."
trait_luosi_pop_5:"Extra Computing Power"
trait_luosi_pop_5_desc:"On the Stellar Differential Engine, we gain additional computing power."
