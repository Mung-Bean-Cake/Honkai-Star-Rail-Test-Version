#Yaoguang
NAME_yaoguang:"Yaoguang"
yaoguang_catch_phrase:""Opportunities come from risks, come boldly.""
yaoguang_backstory:"Mysterious, bold, radical — her transformative moves are stunning. With the "eye" of the Hunt, she observes fortune and misfortune, knowing fate is hard to defy, yet the "Rongtao General" still ventures alone. This failing fortune lot — how to change the heavens?"
hsr_paragon.67.name:"Yaoguang"
hsr_paragon.67.a:"First Meeting"
hsr_paragon.67.a.response:"I am Yaoguang, the Rongtao General of the Xianzhou "Yuque". You may call me "Boss Yao" like others. This meeting could have been predicted by divination, but I prefer to experience it firsthand — surely, there will be many surprises."
hsr_paragon.67.b:"Greeting"
hsr_paragon.67.b.response:"Given today's weather, I predict you'll meet the foremost wise person in the Xianzhou Alliance... I didn't say it was me, though."
hsr_paragon.67.c:"Observations"
hsr_paragon.67.c.response:"The sky is high and the earth wide, act freely — next time we meet, tell me what great deeds you've done that would make me gasp."
