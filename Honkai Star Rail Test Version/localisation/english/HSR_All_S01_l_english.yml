origin_tooltip_Penacony_effects:0 "Penacony, located in the Asdana system, is a famous planet of festivities. In reality, Penacony is an interstellar hotel suspended in the galaxy, where you can check in and rest in your room. After falling asleep, you will see the true face of "Penacony" — a magnificent city of joy. In dreams, you can freely explore the fairy-tale-like "Dreamscape" Hotel, shop in the bustling "Oti Mall", sightsee at the "Clockie Plaza", enjoy various amusements at "Eddyen Park", or visit the "Golden Central Station" for sightseeing..."
The_Penacony_start_screen_messages:0 "Drink this bottle of SoulGlad~ Happy dreams come fast~ Penacony, located in the Asdana system, is a famous planet of festivities. In reality, Penacony is an interstellar hotel suspended in the galaxy, where you can check in and rest in your room. After falling asleep, you will see the true face of "Penacony" — a magnificent city of joy. In dreams, you can freely explore the fairy-tale-like "Dreamscape" Hotel, shop in the bustling "Oti Mall", sightsee at the "Clockie Plaza", enjoy various amusements at "Eddyen Park", or visit the "Golden Central Station" for sightseeing..."

