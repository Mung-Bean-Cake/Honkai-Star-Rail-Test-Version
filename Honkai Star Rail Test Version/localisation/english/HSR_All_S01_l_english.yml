#Leaders
belobog_bronya:0 "Bronya Rand"
belobog_bronya_desc:0 "The heiress to Belobog's "Grand Guardian", a young and capable Silvermane Guard commander. Bronya received a strict education from childhood, possessing the elegance and approachability expected of an "heiress". But after seeing the harsh conditions of the Underworld, the future supreme leader began to question... "Can the training I received truly lead the people to the life they desire?""
belobog_gepard:0 "Gepard Landau"
belobog_serval:0 "Serval Landau"
belobog_natasha:0 "Natasha"
belobog_pela:0 "Pela"
belobog_pela_desc:0 "A meticulous Silvermane Guard intelligence officer, young but exceptionally sharp. Whether it's troop movements, material allocation, or terrain conditions, Pela can respond calmly and accurately without error. As for Pela's phone case... "That's not work-related, sir.""
belobog_pela_tt:0 "Silvermane Guard Intelligence Officer, Pela, reporting. You can call me Pela."
belobog_lingke:0 "Lynx Landau"
belobog_lingke_desc:0 "The youngest daughter of the Landau family, Belobog's premier polar explorer. She appears lazy but has strong execution skills. She exudes an aura of "stay away" to avoid unnecessary social interaction. As for how she defines unnecessary social interaction — "Um... isn't all social interaction unnecessary?""
belobog_lingke_tt:0 "...I'm Lynx, a member of the Belobog Snowfield Expedition Team. For work matters, please contact me during work hours... otherwise, I'm unavailable. Yes, that's it, goodbye."
belobog_luka:0 "Luka"
belobog_luka_desc:0 "An optimistic, easygoing mechanical-arm free fighter, a member of the "Wildfire". From the ring to the battlefield, from boxer to warrior, Luka uses his strength to protect the people of the Underworld. Because he has experienced despair himself, he is even more eager to bring hope to others."
belobog_luka_tt:0 "Yo, hey! I'm Luka, a member of "Wildfire". Busting villains, protecting the townsfolk — that's my daily job."
belobog_huke:0 "Hook"
belobog_huke_desc:0 "The leader of the adventure group "Moles", calling herself "Pitch-Dark Hook the Great". She doesn't like being called a little kid, believing she can stand on her own without adults. Adults venture into the Rift, Uncle Sampo goes to the overworld, patients take risks in Natasha's care... under Hook's leadership, children have their own adventures too!"
belobog_huke_tt:0 "Adults in the Underworld are managed by Wildfire, kids by the Moles, and I'm the leader of the Moles — you can call me Pitch-Dark Hook the Great!"
belobog_kelala:0 "Clara"
belobog_kelala_desc:0 "A girl raised by robots, with maturity and persistence beyond her age. To Clara, Svarog's rational calculations are the law of the world and cannot be wrong. Until she discovered that the results of the "calculations" do not always bring happiness. The timid girl decides to be brave."
belobog_kelala_tt:0 "Hello... I'm Clara. Can you be my family... like Mr. Svarog?"
belobog_xier:0 "Seele"
belobog_xier_desc:0 "A stylish and capable member of "Wildfire", who grew up in the dangerous and chaotic underground environment and is used to going it alone. Protection and oppression, the world always showed Seele a black-and-white side — until "that girl" appeared."
belobog_xier_tt:0 "Yo, I'm Seele, a member of "Wildfire" in Belobog's Underworld. Are you ready to witness the future of the Underworld with me?"
#Government
auth_yaliluo:0 "Belobog Guardianate"
auth_yaliluo_desc:0 "Under the leadership of the great Builder Alisa Rand, the Builders began constructing shelters across the planet. The city built under Alisa Rand's leadership was called "Belobog", with the year of its completion marking the first year of the Construction Calendar. Its organizational structure includes the Silvermane Guards and the Wildfire organization. The Grand Guardian is Belobog's supreme ruler, with the surname Rand passed down through generations. The next Grand Guardian is usually raised by the previous one."
gov_yaliluo:0 "Military Guardianate"
gov_yaliluo_desc:0 "Relying on powerful military force to protect survivors, the leader is also the supreme commander."
YALILUO_leader:0 "Grand Guardian"
YALILUO_leader_FEMALE:0 "Grand Guardian"
councilor_ruler_great_guardian:0 "Grand Guardian"
councilor_ruler_great_guardian_desc:0 "The Grand Guardian is Belobog's supreme ruler, the leader and supreme commander."
councilor_tiewei:0 "Silvermane Guard Marshal"
councilor_tiewei_desc:0 "The Silvermane Guard Marshal commands the Silvermane Guards, resisting Rift erosion and maintaining peace on Jarilo."
councilor_yaliluo_tech:0 "Belobog Technology Committee"
councilor_yaliluo_tech_desc:0 "The Belobog Technology Committee is responsible for research and the industrialization of some technologies."
#Civics
civic_tiewei:0 "Silvermane Guards"
civic_tiewei_desc:0 "Always ready to protect humanity's last city — Belobog. The Silvermane Guards are loyal to Belobog, the Builders, and all the people, demanding courage, integrity, selflessness, and loyalty."
civic_yaliluo_tech:0 "Belobog Technology Department"
civic_yaliluo_tech_desc:0 "A technology department directly under the Grand Guardian, serving as the core of scientific research. Its current focus is on suppressing and eliminating the Rift, restoring light and heavy industries, climate and environmental modification, and aerospace technology."
#Blockers and Planet Decisions
d_belobog_blocker_1:0 "Rift Erosion"
d_belobog_blocker_1_desc:0 "This area has suffered severe Rift erosion, with large numbers of Rift creatures roaming."
d_belobog_blocker_2:0 "Snow and Ice"
d_belobog_blocker_2_desc:0 "This lifeless area is completely covered by snow and ice, with occasional Rift creatures wandering."
decision_attacker_belobog_blocker_1:0 "Assault the Rift"
decision_attacker_belobog_blocker_1_desc:0 "With the latest technology against the Rift, we can organize the Silvermane Guards to attack areas with large concentrations of Rift creatures, effectively reducing their numbers."
decision_attacker_belobog_blocker_1_fail:0 "The planet's ground forces are not strong enough; attacking the Rift now may not be a good choice."
decision_attacker_belobog_blocker:0 "§RConscript Forces!§!"
decision_attacker_belobog_blocker_desc:0 "People, take up arms and fight the Rift to the end, defend our Belobog!"
decision_deep_resource_exploitation:0 "§HDeep Resource Exploitation§!"
decision_deep_resource_exploitation_desc:0 "Belobog has identified some deeper mineral and energy resource points, but their extraction is difficult, requiring more time to establish mining bases."
decision_deep_resource_exploitation_tt:0 "40% chance to add a new mining district, 40% chance to add a new energy district (4 exploration sites total), 20% chance to add both a mining and an energy district (4 exploration sites total); 25% chance to trigger an incident.\nRemaining: [from.count_resource_exploitation]"
decision_attacker_liexi_blocker:0 "Organize an Attack on the Rift"
decision_attacker_liexi_blocker_desc:0 "Though we are still weak, we must take a gamble for our future!"
decision_more_zaowuyinqing:0 "More Creation Engines"
decision_more_zaowuyinqing_desc:0 "Research shows we can build additional Creation Engines beyond the current limit."
need_chance:0 "All attack plans have been completed."
more_juntuan:0 "§RWe currently lack the manpower for conscription.\nCooldown: 7.5 years§!"
the_way_used:0 "All mining sites have been exploited."
more_zaowuyinqing:0 "Exceeds the limit."
decision_attacker_belobog_blocker_tt:0 "Conscript 15 Silvermane Guard army units."
d_belobog_blocker_liexi:0 "Rift Erosion"
d_belobog_blocker_liexi_desc:0 "This area has suffered severe Rift erosion, with large numbers of Rift creatures roaming."
d_belobog_blocker_small:0 "Rift"
d_belobog_blocker_small_desc:0 "A small Rift, with a few Rift creatures wandering these ruined cities."
d_belobog:0 "Belobog"
d_belobog_desc:0 "A territory rebuilt by survivors after the Rift erosion, where people rest and recuperate."
d_zaowuyinqing:0 "Creation Engine"
d_zaowuyinqing_desc:0 "A giant machine built with new Jarilo technology, currently under full construction."
d_energy_block:0 "New Energy District"
d_energy_block_desc:0 "New energy facilities built with investment."
d_mineral_block:0 "New Mining District"
d_mineral_block_desc:0 "New mining facilities built with investment."
