#Robin
NAME_zhigengniao:"Robin"
zhigengniao_catch_phrase:"She described her life as a song, and that song began bitter and dark."
zhigengniao_backstory:"Born in Penacony, a galaxy-renowned singer of the Halovian race, a graceful and poised young lady. Invited by the Family to return to her homeland, she sang a song for the guests at the "Harmony Festival". She can transmit her voice through the power of "Harmony", resonating with fans and even all beings across the cosmos."
hsr_paragon.42.name:"Penacony - Robin"
hsr_paragon.42.a:"First Meeting"
hsr_paragon.42.a.response:"Good evening, I'm Robin, a singer from the Family. No need to be formal, this is just a private greeting offstage. Could you spare me a moment?"
hsr_paragon.42.b:"Hobbies"
hsr_paragon.42.b.response:"Sometimes I put on a wig, change my makeup, and wear glasses — then I can go anywhere without worry~"
hsr_paragon.42.c:"Observations"
hsr_paragon.42.c.response:"The publisher on Epheron released a few albums for me and invited me to stay there for a while. That planet's atmosphere is similar to Penacony's, but compared to art, people there seem to care more about the huge profits art can bring..."
leader_zhigengniao_t1:"§MModal Sequence§!"
leader_zhigengniao_t1_desc:"May the song bring us victory."
leader_zhigengniao_t2:"§MFeather Aria§!"
leader_zhigengniao_t2_desc:"Time for a new movement."
leader_zhigengniao_t3:"§MFlowing Nightlights§!"
leader_zhigengniao_t3_desc:"All sounds, resonate again."
leader_zhigengniao_t4:"§MMoon-Hidden Midnight§!"
leader_zhigengniao_t4_desc:"May you find peace in song."
leader_zhigengniao_t5:"§MThousand Tones, Stellar Fugue§!"
leader_zhigengniao_t5_desc:"Don't worry, I'll always be by your side."
