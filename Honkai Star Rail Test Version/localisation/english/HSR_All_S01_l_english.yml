leader_yinlang_t1_desc:"Before the tutorial quest starts"
leader_yinlang_t2:"§M|Force End Process|§!"
leader_yinlang_t2_desc:"This time, can you make it fun for me?"
leader_yinlang_t3:"§MAllow changes?§!"
leader_yinlang_t3_desc:"Huh, activate a cheat code."
leader_yinlang_t4:"§MAttack Payload§!"
leader_yinlang_t4_desc:"Let's spice things up."
leader_yinlang_t5:"§M|Account Banned|§!"
leader_yinlang_t5_desc:"The combat experience needs optimization."
